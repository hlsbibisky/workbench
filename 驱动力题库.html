人…自私一定不是情感驱动的人的特征。", "id": "Q1109"}, {"type": "judge", "cat": "scene", "q": "判断正误：情感驱动的人是全场最难哄的人，怎么哄都哄不好？", "ans": false, "exp": "原文：情感驱动的男人很好哄，让他开心很容易，没有什么坏心思。", "id": "Q1110"}, {"type": "judge", "cat": "scene", "q": "判断正误：积极情感驱动的人吵架最爱翻旧账、记仇？", "ans": false, "exp": "原文：积极的情感驱动女生吵架吵的是现在的态度，以前的事都忘了。…吵架不翻旧账。", "id": "Q1111"}, {"type": "judge", "cat": "scene", "q": "判断正误：回避型依恋的女生是典型的无情无爱的人，与有没有情毫无关系？", "ans": false, "exp": "原文：回避型依恋的女生100%是有情的人，男回避大概率是有情的人。", "id": "Q1112"}, {"type": "judge", "cat": "scene", "q": "判断正误：情感驱动的人怕生、社恐，见不得人多热闹？", "ans": false, "exp": "原文：情感驱动的人从来不怕陌生人，不怕人多，共情能力越强的人越不怕陌生人。", "id": "Q1113"}, {"type": "judge", "cat": "scene", "q": "判断正误：有情的女人最守时，约会从不迟到拖延？", "ans": false, "exp": "原文：有情的女人爱迟到、拖延。", "id": "Q1114"}, {"type": "judge", "cat": "scene", "q": "判断正误：有情的男人遇到冲突总爱冷暴力、冷漠对待，从不肯沟通哄人？", "ans": false, "exp": "原文：有积极情感驱动的男人…绝对不会冷暴力，不会冷漠。一定主动沟通，哄人，编故事画饼也会哄着你。", "id": "Q1115"}, {"type": "judge", "cat": "scene", "q": "判断正误：有情的女人最爱吵架、最爱与人争斗，对吗？", "ans": false, "exp": "原文：真正有情的女人是害怕冲突的…害怕冲突是有情的表现。真正有情的女人也不吵架，害怕冲突。", "id": "Q1116"}, {"type": "judge", "cat": "scene", "q": "判断正误：有情的女人对冤枉毫不在意，被冤枉也无所谓？", "ans": false, "exp": "原文：越有情越不能被冤枉。别人一旦误解比什么都难受。她一定会去跟你掰扯。", "id": "Q1117"}, {"type": "judge", "cat": "scene", "q": "判断正误：情感驱动的人整天负能量、愁眉苦脸？", "ans": false, "exp": "原文：如果自己整天负能量一大堆就一定不是情感驱动的人，因为情感驱动的人是最容易开心起来的。", "id": "Q1118"}, {"type": "judge", "cat": "scene", "q": "判断正误：情感驱动的人最不懂吃喝，毫无口福？", "ans": false, "exp": "原文：很懂得吃就很有福气，情感驱动的人才能很懂得吃，因为这是生活的一部分。情感驱动的人懂生活。", "id": "Q1119"}, {"type": "judge", "cat": "scene", "q": "判断正误：情感驱动的人睡眠质量最差、容易整夜失眠？", "ans": false, "exp": "原文：情感驱动的人睡眠质量最高，哪怕有烦恼也不影响睡觉，可以秒睡。", "id": "Q1120"}, {"type": "judge", "cat": "scene", "q": "判断正误：精神驱动的人需要的睡眠时间最多、最贪睡？", "ans": false, "exp": "原文：精神驱动的人需要的睡眠时间最少。打坐都可以代替睡觉。", "id": "Q1121"}, {"type": "judge", "cat": "scene", "q": "判断正误：责任感驱动的人睡得最久、睡眠质量最好？", "ans": false, "exp": "原文：责任感驱动的人睡眠质量通常不会太好，因为情感和责任感相克而成太极。…真正干活的做事业的人都睡得很少。", "id": "Q1122"}, {"type": "judge", "cat": "scene", "q": "判断正误：喜欢做饭的人一定不是情感驱动的人？", "ans": false, "exp": "原文：喜欢做饭的，一定是情感驱动的。情感驱动是只喜欢给喜欢的人做饭。", "id": "Q1123"}, {"type": "judge", "cat": "scene", "q": "判断正误：物质驱动的人花钱总是乱花乱买、毫无章法？", "ans": false, "exp": "原文：只有物质驱动的人花钱会花到点上，其余的人花钱都是乱花的。", "id": "Q1124"}, {"type": "judge", "cat": "scene", "q": "判断正误：自我价值感驱动的人最会花钱享受、舍得给自己花钱？", "ans": false, "exp": "原文：自我价值感驱动的人…能赚能存，不能花，或者说花钱不会有满足感。…通常会赚钱不会花钱。", "id": "Q1125"}, {"type": "judge", "cat": "scene", "q": "判断正误：情感驱动的人最爱主动给伴侣提供情绪价值、哄人夸人？", "ans": false, "exp": "原文：情感驱动的人不提供情绪价值，但是也存在有情又有爱的人。…不给男人提供情绪价值。", "id": "Q1126"}, {"type": "judge", "cat": "scene", "q": "判断正误：责任感驱动的人做事最拖延、最不靠谱？", "ans": false, "exp": "原文：执行力强是责任感驱动的人。责任感驱动就是执行力，责任感越强，执行力越强。…责任感驱动就意味着靠谱。", "id": "Q1127"}, {"type": "judge", "cat": "scene", "q": "判断正误：非责任感驱动的人对目标感的需求最强烈？", "ans": false, "exp": "原文：只有责任感驱动的人，才会有目标感。非责任感驱动的人，对目标感这个东西是没有需求的。", "id": "Q1128"}, {"type": "judge", "cat": "scene", "q": "判断正误：共情能力强、爱交朋友好做生意的一定不是情感驱动的人？", "ans": false, "exp": "原文：共情能力强很容易有朋友，也很容易做生意。情感驱动的人从来不怕陌生人，不怕人多。", "id": "Q1129"}, {"type": "judge", "cat": "scene", "q": "判断正误：和婆婆关系差、不善待婆婆的女人是潜在的积极物质驱动的人？", "ans": false, "exp": "原文：和婆婆关系好的女人、会善待婆婆的女人就是潜在的积极物质驱动的女人。无论婆婆是个怎么样的人，你怎么对待她是直接决定你是否是物质驱动的。", "id": "Q1130"}, {"type": "judge", "cat": "scene", "q": "判断正误：对事业有强烈追求的女人，她的第一奋斗目标放在事业上？", "ans": false, "exp": "原文：如果是对事业有强烈追求的女人，她的第一目标大概率不会在事业上，而是感情上。", "id": "Q1131"}, {"type": "judge", "cat": "scene", "q": "判断正误：有情的男人从不敢向喜欢的女生表白？", "ans": false, "exp": "原文：有情的男人表白张口就来。有情的女生很可能会有述情障碍。", "id": "Q1132"}, {"type": "judge", "cat": "scene", "q": "判断正误：情感驱动的孩子学习好坏与喜不喜欢老师完全无关？", "ans": false, "exp": "原文：情感驱动的孩子，偏科严重，学习好坏取决于喜不喜欢这门课的老师。", "id": "Q1133"}, {"type": "judge", "cat": "scene", "q": "判断正误：精神驱动的孩子最不爱读书、总要家长催促？", "ans": false, "exp": "原文：精神驱动的孩子，喜欢读书，不需要家长操心，自己会主动把书读好。", "id": "Q1134"}, {"type": "judge", "cat": "scene", "q": "判断正误：精神驱动的人对外表最在意、最易有容貌焦虑？", "ans": false, "exp": "原文：精神驱动的人最不会有容貌焦虑，对外表不太在乎。", "id": "Q1135"}, {"type": "judge", "cat": "scene", "q": "判断正误：情感驱动的女生最不在乎打扮，从不爱装扮出门？", "ans": false, "exp": "原文：情感驱动的女生会天然的想要打扮美美的出门，如果不太在意外表形象，就可能不是情感驱动。", "id": "Q1136"}, {"type": "judge", "cat": "scene", "q": "判断正误：情感驱动的人打麻将全靠精打细算、最计较输赢？", "ans": false, "exp": "原文：情感驱动的人，可能数学不好，但是算牌超厉害。打的是自己开心。…输赢心比较淡。", "id": "Q1137"}, {"type": "judge", "cat": "scene", "q": "判断正误：自我价值感驱动的人打牌输赢心最淡、输赢无所谓？", "ans": false, "exp": "原文：自我价值感驱动的人，最计较输赢。今天不赢就没有意义。…最输不起的就是自我价值感驱动的人。", "id": "Q1138"}, {"type": "judge", "cat": "scene", "q": "判断正误：特别爱在朋友圈秀女朋友、狂晒女友的男人一定是责任感驱动的人？", "ans": false, "exp": "原文：特别喜欢在朋友圈晒女朋友的男人是情感驱动的…这样的人一定不是责任感驱动。", "id": "Q1139"}, {"type": "judge", "cat": "scene", "q": "判断正误：事业做得风生水起的男人的标志是处处压着妻子、让妻子怕自己？", "ans": false, "exp": "原文：对于事业做的风生水起很好很大的男人来说，标志就是怕老婆。…一生惧内大富大贵。", "id": "Q1140"}, {"type": "judge", "cat": "scene", "q": "判断正误：男人事业蒸蒸日上的同时，妻子可以随意情绪爆炸？", "ans": false, "exp": "原文：女人的情绪稳定决定了整个家庭的事业发展。不存在男人事业蒸蒸日上，妻子情绪爆炸。", "id": "Q1141"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的女人最需要男人的情？", "ans": false, "exp": "原文：情感驱动的女人，需要的是男人的事业心上进心。…她最在意的是一个男人有没有志向和志气。", "id": "Q1142"}, {"type": "judge", "cat": "love", "q": "判断正误：精神驱动的女人不需要男人的情？", "ans": false, "exp": "原文：精神驱动的女人，需要的是男人的情。…精神驱动的女人的精神食粮是男人的情。", "id": "Q1143"}, {"type": "judge", "cat": "love", "q": "判断正误：自我价值感驱动的女人根本不需要男人的钱？", "ans": false, "exp": "原文：自我价值感驱动的女人，需要的是男人的钱。", "id": "Q1144"}, {"type": "judge", "cat": "love", "q": "判断正误：责任感驱动的女人只需要男人的情和爱，对陪伴毫无需求？", "ans": false, "exp": "原文：责任感驱动的女人，需要的是男人的陪伴。…只要这个男人可以稳定的待着存在着，她就满足了。", "id": "Q1145"}, {"type": "judge", "cat": "love", "q": "判断正误：物质驱动的女人需要的是男人的陪伴，对不对？", "ans": false, "exp": "原文：物质驱动的女人，需要的是男人的爱。", "id": "Q1146"}, {"type": "judge", "cat": "love", "q": "判断正误：绝大部分情感驱动的女人都需要男人的情？", "ans": false, "exp": "原文：70%-80%的情感驱动的女人不需要男人的情。", "id": "Q1147"}, {"type": "judge", "cat": "love", "q": "判断正误：有情的女人表达情感时应该说“我爱你”？", "ans": false, "exp": "原文：有情的女人表达自己的情感，不是说我爱你。应该说的是，我很喜欢你。永远不要用爱这个字。", "id": "Q1148"}, {"type": "judge", "cat": "love", "q": "判断正误：有情的女人最爱魅惑、诱惑、撩拨男人的情和欲？", "ans": false, "exp": "原文：有情的女人从来不魅惑、不诱惑、不吸引男人，不撩拨男人的情和欲。", "id": "Q1149"}, {"type": "judge", "cat": "love", "q": "判断正误：情重的女生最容易变心出轨？", "ans": false, "exp": "原文：最专一、最无法出轨的女生就是情感驱动的…有情的女生100%做不了海后。情越重的女生，越专一。", "id": "Q1150"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的男人动辄出轨、换对象？", "ans": false, "exp": "原文：情感驱动的男人突然说分手，十有八九不是因为出轨，情感驱动的男人不出轨。", "id": "Q1151"}, {"type": "judge", "cat": "love", "q": "判断正误：有情的女人通常对人非常冷漠？", "ans": false, "exp": "原文：有情的女人通常是冷漠不起来的。女人冷漠是因为没有慈悲心，无情。", "id": "Q1152"}, {"type": "judge", "cat": "love", "q": "判断正误：有爱的女人最爱主动对男人动手动脚、主动亲近？", "ans": false, "exp": "原文：有爱的女人从来不对男人主动动手，从来不主动亲男人。", "id": "Q1153"}, {"type": "judge", "cat": "love", "q": "判断正误：精神驱动的女人最反感伴侣亲近自己、讨厌肢体接触？", "ans": false, "exp": "原文：而精神驱动的女人会喜欢伴侣对自己动手动脚。", "id": "Q1154"}, {"type": "judge", "cat": "love", "q": "判断正误：有情的女人最会拿捏男人的情绪？", "ans": false, "exp": "原文：有情的女人自己就是恋爱脑，不可能拿捏男人。", "id": "Q1155"}, {"type": "judge", "cat": "love", "q": "判断正误：会拿捏男人情绪的绝不可能是精神驱动的女生？", "ans": false, "exp": "原文：会拿捏男人的一定是精神驱动的女生。理性用在情感上的时候，就很会拿捏男人的情绪。", "id": "Q1156"}, {"type": "judge", "cat": "love", "q": "判断正误：男人对女人表现出心疼就是深情，说明他绝不会出轨？", "ans": false, "exp": "原文：爱是不心疼的，当一个男人表现出心疼的情感特征时，他100%会出轨。", "id": "Q1157"}, {"type": "judge", "cat": "love", "q": "判断正误：有爱的女人可以做到无贪念的爱？", "ans": false, "exp": "原文：有爱的女人做不到无贪念的爱，有爱的男人可以做到无贪念的爱。", "id": "Q1158"}, {"type": "judge", "cat": "love", "q": "判断正误：有情的女生被抛弃后最容易因爱生恨、生出巨大怨念？", "ans": false, "exp": "原文：而有情的女生本质上无法有怨恨。所以只有有爱的女人才有可能生的出恨。", "id": "Q1159"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的男人对他的伴侣完全不需要情绪价值？", "ans": false, "exp": "原文：情感驱动的男生需要伴侣夸他，看他打篮球要给他鼓掌喝彩。", "id": "Q1160"}, {"type": "judge", "cat": "love", "q": "判断正误：精神驱动的女人最反感男人对她有占有欲、控制欲、情欲？", "ans": false, "exp": "原文：理智的女人，一定要有一个会对她献殷勤，主动对她有欲望，情欲，占有欲，控制欲的男人。精神驱动的女人的精神食粮是男人的情。", "id": "Q1161"}, {"type": "judge", "cat": "love", "q": "判断正误：男人的情是女人的事业，对吗？", "ans": false, "exp": "原文：女人的情就是男人的事业。", "id": "Q1162"}, {"type": "judge", "cat": "love", "q": "判断正误：有情的女人最能守住钱包、从不借钱给男人？", "ans": false, "exp": "原文：有情的女人是最容易借钱给男人的。有些人哪怕知道对方就是想骗自己的钱…还是会把钱给他。", "id": "Q1163"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的男人完全可以和女生维持纯净的友谊？", "ans": false, "exp": "原文：情感驱动的男人是没办法单纯和女生交朋友的。", "id": "Q1164"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的女生分手后很快就放下了，不会有留恋？", "ans": false, "exp": "原文：分手后很难走出来是因为当时那种美好的感受也是真实的…本质上是情感驱动的女生要的是自己内心中的那一份情感。", "id": "Q1165"}, {"type": "judge", "cat": "love", "q": "判断正误：精神驱动的女生失恋后最痛苦、最难走出来？", "ans": false, "exp": "原文：精神驱动的女生比情感驱动的在恋爱结束后更容易走出来，相对不那么痛苦。", "id": "Q1166"}, {"type": "judge", "cat": "love", "q": "判断正误：家里怎么催婚情感驱动的女生都无所谓的？", "ans": false, "exp": "原文：情感驱动的女生被家里催婚是最难受的，尤其是还有一点责任感驱动的。", "id": "Q1167"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的女生最好的闺蜜是和她同为情感驱动的女生？", "ans": false, "exp": "原文：情感驱动的女生，最好的闺蜜朋友一定是精神驱动的女生…和同样是情感驱动的女生在一起的时候很容易互相不爽。", "id": "Q1168"}, {"type": "judge", "cat": "love", "q": "判断正误：有情的男人好色也是有品的？", "ans": false, "exp": "原文：有情的女人好色是有品的。有情的男人是好色没品。", "id": "Q1169"}, {"type": "judge", "cat": "love", "q": "判断正误：有情的女生嫁入豪门是为了男人的钱？", "ans": false, "exp": "原文：如果是有情的女生加入豪门，就不是为了钱了，甩钱是追不到有情的女生的，有情的女生更看重的是男人的爱、智慧、责任感。", "id": "Q1170"}, {"type": "judge", "cat": "love", "q": "判断正误：女生主动约男生就是动情？", "ans": false, "exp": "原文：男生主动约女生，是动情。女生主动约男生，一定不是动情。", "id": "Q1171"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的女生动情后会毫不迟疑地主动表白？", "ans": false, "exp": "原文：当情感驱动的女生动情的时候，是不会主动考验对方的。也不会主动表白。第一反应会是不配得感激发出的回避。", "id": "Q1172"}, {"type": "judge", "cat": "love", "q": "判断正误：感情逐渐变淡、像白开水一样，责任在有爱的一方？", "ans": false, "exp": "原文：为什么会和自己的伴侣成为邻居成为兄弟，感情像白开水一样，责任在有情的一方。谁有情谁主动。", "id": "Q1173"}, {"type": "judge", "cat": "love", "q": "判断正误：有爱的人会主动、热情地推动爱情往前走？", "ans": false, "exp": "原文：有爱的人一定是在等待有情的一方推动，所以是被动的。先有情后有爱。", "id": "Q1174"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的女生最容易招渣男、被渣男骗？", "ans": false, "exp": "原文：情感驱动的女生通常是不吸渣的，最不容易被渣的是情感驱动的女生。…最容易被渣的是精神驱动的女生。", "id": "Q1175"}, {"type": "judge", "cat": "money", "q": "判断正误：有情的人通常很贫穷？", "ans": false, "exp": "原文：有情的人通常就是物质驱动的人，因为情是物质的源头。食伤生财，所以真正有情的人不会穷。", "id": "Q1176"}, {"type": "judge", "cat": "money", "q": "判断正误：情与财富无关，情的定位不是财星之源？", "ans": false, "exp": "原文：情=财之源。为什么情的定位是食伤？食伤是用来生财的。", "id": "Q1177"}, {"type": "judge", "cat": "money", "q": "判断正误：情感驱动的人赚朋友的钱会羞愧难当、浑身不舒服？", "ans": false, "exp": "原文：真正能赚朋友钱的人，也是情感驱动的人，情感驱动的人赚朋友的钱是毫无违和感的。", "id": "Q1178"}, {"type": "judge", "cat": "money", "q": "判断正误：自我价值感驱动的人最善于赚朋友的钱？", "ans": false, "exp": "原文：自我价值感驱动的人一定赚不了朋友的钱…但凡她赚了一点朋友的钱或者她想赚，她的内心就会非常痛苦。", "id": "Q1179"}, {"type": "judge", "cat": "money", "q": "判断正误：物质驱动的人满脑子想赚钱、以赚钱为本业？", "ans": false, "exp": "原文：物质驱动的人从来不想赚钱的事情，就会有钱。但是一旦他想赚钱，他就赚不到钱。不能偏离自己的核心驱动力。", "id": "Q1180"}, {"type": "judge", "cat": "money", "q": "判断正误：精神驱动的人最适合做长线持股、价值投资？", "ans": false, "exp": "原文：绝对不能做长线，一定要见好就收…价值投资不是精神驱动的人玩的好的。不要做价值投资。", "id": "Q1181"}, {"type": "judge", "cat": "money", "q": "判断正误：过度精神驱动的人特别适合炒股赚钱？", "ans": false, "exp": "原文：高度的过度精神驱动的人不要炒股…一旦关注盈亏的时候，就在贪着金钱本身。", "id": "Q1182"}, {"type": "judge", "cat": "money", "q": "判断正误：财富之源是印星，而非情？", "ans": false, "exp": "原文：财富之源是情，要靠源头不断的生财…财富定位是财星的气数。", "id": "Q1183"}, {"type": "judge", "cat": "money", "q": "判断正误：财气越好的女人，伴侣通常越愚蠢平庸？", "ans": false, "exp": "原文：财气越好的女生，伴侣越有智慧。财气就是财星的气数。", "id": "Q1184"}, {"type": "judge", "cat": "money", "q": "判断正误：处理好与父亲母亲的关系（财印平衡）与财富显化毫无关系？", "ans": false, "exp": "原文：意味着你实现了自身的财印平衡。这个象征着你在财富领域…就不会再有障碍了。", "id": "Q1185"}, {"type": "judge", "cat": "money", "q": "判断正误：人与父亲的关系与人与财富物质的关系毫无关联？", "ans": false, "exp": "原文：他与父亲的关系可以等价于他与财富物质的关系。", "id": "Q1186"}, {"type": "judge", "cat": "love", "q": "判断正误：无情的一方才是推动感情关系向前发展的关键？", "ans": false, "exp": "原文：有情的一方才是推动情感的关键。…谁有情谁主动。", "id": "Q1187"}, {"type": "judge", "cat": "money", "q": "判断正误：人处理与父亲的关系只需压抑情绪，与命中财富的好坏毫无干系？", "ans": false, "exp": "原文：他与父亲的关系可以等价于他与财富物质的关系。", "id": "Q1188"}, {"type": "judge", "cat": "parent", "q": "判断正误：母亲在各柱命理中的定位是财星而非印星？", "ans": false, "exp": "原文：在易经的十神相当中，母亲的定位是以印星为定位，男人以正印为母，女人以偏印为母。", "id": "Q1189"}, {"type": "judge", "cat": "parent", "q": "判断正误：与父亲的关系在命理中对应的是生我的印星，而非财星？", "ans": false, "exp": "原文：对于父亲的定位是以财星为定位，男以偏财为父，女以正财为父。", "id": "Q1190"}, {"type": "judge", "cat": "parent", "q": "判断正误：世界上绝大多数人都能同时亲近并喜欢自己的父亲与母亲？", "ans": false, "exp": "原文：这个世界上百分之八九十的人，基本上都没有办法同时能够喜欢亲近自己的父亲与母亲。", "id": "Q1191"}, {"type": "judge", "cat": "parent", "q": "判断正误：怨恨自己母亲的人反而更容易开智慧、亲近财富？", "ans": false, "exp": "原文：任何人，无论男女，如果怨恨自己的母亲，这种人都不得开智慧；对父亲有怨恨的人，都无法亲近财富。", "id": "Q1192"}, {"type": "judge", "cat": "parent", "q": "判断正误：与父亲心存怨恨丝毫不会影响一个人与财富金钱的关系？", "ans": false, "exp": "原文：对于父亲有怨恨的人，都无法亲近财富。", "id": "Q1193"}, {"type": "judge", "cat": "parent", "q": "判断正误：精神驱动的男人和情感驱动的女人，与父母之间一定都会存在善缘和亲近？", "ans": false, "exp": "原文：精神驱动的男人、情感驱动的女人，他们跟父母之间一定都会有无法排解的矛盾。", "id": "Q1194"}, {"type": "judge", "cat": "parent", "q": "判断正误：需要父亲陪伴的人通常是情感驱动的人，而不是物质驱动的人？", "ans": false, "exp": "原文：如果你是物质驱动的人，你就会喜欢父亲的陪伴；判断物质驱动的标志是内心中需要父亲的陪伴。", "id": "Q1195"}, {"type": "judge", "cat": "parent", "q": "判断正误：需要父亲的情（情感往来）的人通常是精神驱动的人？", "ans": false, "exp": "原文：对于父亲的情的需要意味着……这其实在你自身的情感模式当中，与之对应的驱动力特征是责任感驱动的人。", "id": "Q1196"}, {"type": "judge", "cat": "parent", "q": "判断正误：需要父亲的爱（理智与精神引导）的人通常是责任感驱动的人？", "ans": false, "exp": "原文：你需要父亲有精神追求，需要父亲是个理性的人……这个时候通常情况下，就是你自身有情感驱动的标志。", "id": "Q1197"}, {"type": "judge", "cat": "parent", "q": "判断正误：对母亲的陪伴有需求的人，通常是物质驱动的人？", "ans": false, "exp": "原文：对于母亲的陪伴有需求的人，是精神驱动的人。", "id": "Q1198"}, {"type": "judge", "cat": "parent", "q": "判断正误：对母亲的情与共情有需求的人，通常是责任感驱动的人？", "ans": false, "exp": "原文：对于母亲的情有需求的人，是自我价值感驱动的人。", "id": "Q1199"}, {"type": "judge", "cat": "parent", "q": "判断正误：需要母亲的爱与智慧加持的人，一般是自我价值感驱动的人？", "ans": false, "exp": "原文：对于母亲的爱有需求的人，是责任感驱动的人。", "id": "Q1200"}, {"type": "judge", "cat": "parent", "q": "判断正误：情感驱动的人通常会得到来自父亲的金钱恩泽，而非母亲的？", "ans": false, "exp": "原文：情感驱动的人，能够得到来自于母亲金钱上的恩泽；情感驱动的人更多是会受到妈妈的恩泽，而不是父亲，特别是金钱方面。", "id": "Q1201"}, {"type": "judge", "cat": "parent", "q": "判断正误：情感驱动的人在用钱上最用得了爸爸给的钱？", "ans": false, "exp": "原文：情感驱动的女生用不了爸爸给的钱，情感驱动的人更多是会受到妈妈的恩泽，而不是父亲，特别是金钱方面。", "id": "Q1202"}, {"type": "judge", "cat": "parent", "q": "判断正误：回到家中应多与丈夫般的样子、与母亲谈工作、与父亲唠家常才合乎命理？", "ans": false, "exp": "原文：常回家看看，与母亲唠家常，与父亲谈工作……与母亲唠家常，妈妈的情感是你自我价值感的来源。", "id": "Q1203"}, {"type": "judge", "cat": "parent", "q": "判断正误：孩子一生的气运与父母完全无关，不存在契合或反差？", "ans": false, "exp": "原文：孩子的早运，与父母基本上是契合的；如果孩子的气运与父母形成了鲜明的矛盾与反差，这就意味着你与亲生父母的姻缘就会非常的浅薄。", "id": "Q1204"}, {"type": "judge", "cat": "parent", "q": "判断正误：父母是什么样的人，在一定程度上决定了孩子将来会成为什么样的人？", "ans": false, "exp": "原文：父母是什么样的人，他是不能够决定孩子是什么样的人的；你是什么样的人也不能决定父母是什么样的人。", "id": "Q1205"}, {"type": "judge", "cat": "parent", "q": "判断正误：妈宝男是财星过旺、印星缺失的外在显化？", "ans": false, "exp": "原文：妈宝男就是典型的财印不能平衡的一种显化，妈宝男就是印星过旺，过度的强烈。", "id": "Q1206"}, {"type": "judge", "cat": "parent", "q": "判断正误：大多数孩子都能同时亲近并喜欢自己的父亲和母亲？", "ans": false, "exp": "原文：一个孩子同时亲近自己的父亲和母亲，是比较罕见的，多数是只能亲近某一方。", "id": "Q1207"}, {"type": "judge", "cat": "parent", "q": "判断正误：责任感驱动的人出于责任心，会尽心尽力地为父母端茶倒水、把屎把尿？", "ans": false, "exp": "原文：责任感驱动的女生没有办法出于责任对父母尽职尽责，把屎把尿端茶倒水，这些事都做不了。", "id": "Q1208"}, {"type": "judge", "cat": "parent", "q": "判断正误：任何妈妈都会有陪伴孩子的天性需求，这与情感模式无关？", "ans": false, "exp": "原文：不是情感驱动的妈妈，就没有陪伴孩子的需求。", "id": "Q1209"}, {"type": "judge", "cat": "parent", "q": "判断正误：母亲过度的精神焦虑与关爱，反而能培养出孩子更强的目标感和责任感？", "ans": false, "exp": "原文：孩子接收到母亲精神维度的攻击，本质上给孩子造成的是一种不愿意承担责任的倾向。", "id": "Q1210"}, {"type": "judge", "cat": "parent", "q": "判断正误：母亲过度的负面情绪和倾诉，会让孩子长大后拥有超强的自信和配得感？", "ans": false, "exp": "原文：过度情感驱动的母亲，没有积极情感能力的母亲，情绪不稳定给孩子的影响是不配得感。", "id": "Q1211"}, {"type": "judge", "cat": "parent", "q": "判断正误：和母亲关系不好的女生，谈恋爱反而会非常务实？", "ans": false, "exp": "原文：和自己母亲关系好的女生通常情况下谈恋爱都非常务实；反过来，如果和自己母亲关系不好的女生，就会不务实。", "id": "Q1212"}, {"type": "judge", "cat": "parent", "q": "判断正误：子女的自我价值感根本无法对抗父亲过度的固执与成见？", "ans": false, "exp": "原文：对于男人来说，唯一能对抗他的固执的东西是他的子女的自我价值感，子女的赚钱能力就是改变父亲观念的能力。", "id": "Q1213"}, {"type": "judge", "cat": "parent", "q": "判断正误：在男命的十神中，孩子的定位是印星而非官杀？", "ans": false, "exp": "原文：对男人来说，孩子的定位是官杀。", "id": "Q1214"}, {"type": "judge", "cat": "parent", "q": "判断正误：情感驱动的女人与母亲的关系通常最亲近？", "ans": false, "exp": "原文：精神驱动的女人，跟自己的母亲的关系一定亲近；情感驱动的人，他跟母亲的关系一般都是非常远的。", "id": "Q1215"}, {"type": "judge", "cat": "parent", "q": "判断正误：对责任感驱动的男人来说，生孩子并不是开运或事业启动的标志？", "ans": false, "exp": "原文：对责任感驱动的男人来说，成家立业是有先后顺序的，生孩子就是开运的标志。", "id": "Q1216"}, {"type": "judge", "cat": "money", "q": "判断正误：财星（正财、偏财）在十神定位中对应的驱动力是精神驱动？", "ans": false, "exp": "原文：财星（正财、偏财）=物质驱动，物质驱动的人实现阴阳平衡的方式就是用我克的东西。", "id": "Q1217"}, {"type": "judge", "cat": "money", "q": "判断正误：情感驱动的人会时刻想着搞钱、以赚钱为念头做事？", "ans": false, "exp": "原文：情感驱动的人不会有想搞钱这个念头，没有这个念头的人就能有钱。", "id": "Q1218"}, {"type": "judge", "cat": "money", "q": "判断正误：物质驱动的人最喜欢赚钱，其核心追求就是不断赚钱？", "ans": false, "exp": "原文：物质驱动的人，本质上对于赚钱这件事情没有兴趣。", "id": "Q1219"}, {"type": "judge", "cat": "money", "q": "判断正误：物质驱动的人一旦动了想赚钱的念头，往往更容易赚到钱？", "ans": false, "exp": "原文：物质驱动的人从来不想赚钱的事情，就会有钱；但是一旦他想赚钱，他就赚不到钱。", "id": "Q1220"}, {"type": "judge", "cat": "money", "q": "判断正误：自我价值感驱动的人真正想要的是钱本身，而非赚钱这一行为活动？", "ans": false, "exp": "原文：自我价值感驱动的人的特点是以赚钱为目的，想要的是赚钱，而不是想要钱。", "id": "Q1221"}, {"type": "judge", "cat": "money", "q": "判断正误：自我价值感驱动的人是既会赚钱又会花钱、还擅长投资的人？", "ans": false, "exp": "原文：自我价值感驱动的人通常会赚钱不会花钱，也不会投资。", "id": "Q1222"}, {"type": "judge", "cat": "money", "q": "判断正误：花钱总能花到点子上、花在刀刃上的，是自我价值感驱动的人？", "ans": false, "exp": "原文：只有物质驱动的人花钱会花到点上，其余的人花钱都是乱花的。", "id": "Q1223"}, {"type": "judge", "cat": "money", "q": "判断正误：食伤（情）与财富无关，真正有情的人反而容易贫穷？", "ans": false, "exp": "原文：食伤是用来生财的……情是物质的源头，食伤生财，所以真正有情的人不会穷。", "id": "Q1224"}, {"type": "judge", "cat": "money", "q": "判断正误：物质驱动的人是靠出卖体力和时间换取钱财的人？", "ans": false, "exp": "原文：靠身体赚钱——自我价值感驱动，花时间、精力、体力；物质驱动靠财气、对金钱的感知力赚钱。", "id": "Q1225"}, {"type": "judge", "cat": "money", "q": "判断正误：最会管钱、能够克住钱财的是情感驱动的人而非自我价值感驱动的人？", "ans": false, "exp": "原文：真正能管钱的本质是能够克的住钱财的人，也就是自我价值感驱动的人，管钱最稳当。", "id": "Q1226"}, {"type": "judge", "cat": "money", "q": "判断正误：命理中的财官两旺格局，对应的是情感驱动与精神驱动的组合？", "ans": false, "exp": "原文：命理学的格局财官两旺，就是物质驱动+责任感驱动，富贵并重。", "id": "Q1227"}, {"type": "judge", "cat": "money", "q": "判断正误：以缺钱为发心去赚钱的人，往往更能赚到钱？", "ans": false, "exp": "原文：以缺钱为发心去赚钱的人，是赚不到钱的。", "id": "Q1228"}, {"type": "judge", "cat": "money", "q": "判断正误：自我价值感驱动的人最容易赚到朋友的钱？", "ans": false, "exp": "原文：自我价值感驱动的人一定赚不了朋友的钱；情感驱动的人是很轻易的赚朋友的钱的。", "id": "Q1229"}, {"type": "judge", "cat": "money", "q": "判断正误：最容易向女人借钱、骗女人钱的男人，通常是情感驱动的男人？", "ans": false, "exp": "原文：会向女人借钱的男人通常也是物质驱动的男人，会骗女人钱的男人通常也都是物质驱动的男人。", "id": "Q1230"}, {"type": "judge", "cat": "money", "q": "判断正误：过度自我价值感驱动的人交朋友是为了情感共情与陪伴？", "ans": false, "exp": "原文：过度自我价值感驱动的人，交朋友的原因就是奔着借钱去的，再也没有别的理由交朋友了。", "id": "Q1231"}, {"type": "judge", "cat": "money", "q": "判断正误：女人的自我价值感和男人愿不愿意为她花钱毫无关系？", "ans": false, "exp": "原文：自我价值感驱动的女人衡量自我价值的方式，是男人愿意给她花多少钱。", "id": "Q1232"}, {"type": "judge", "cat": "money", "q": "判断正误：靠砸钱补偿和物质攻势，最能打动情感驱动的女生？", "ans": false, "exp": "原文：钱只对精神驱动和自我价值感驱动的女生有用，情感驱动就不吃钱这套。", "id": "Q1233"}, {"type": "judge", "cat": "money", "q": "判断正误：物质驱动的人花钱会感到纠结、焦虑而不是开心？", "ans": false, "exp": "原文：对物质驱动的人来说，花钱的动作本身就有意义，就能开心；情感驱动+物质驱动的人花钱会越花越有钱。", "id": "Q1234"}, {"type": "judge", "cat": "money", "q": "判断正误：自我价值感驱动的人花钱时通常会有强烈的满足感与快乐？", "ans": false, "exp": "原文：不是情感驱动，花钱也不会觉得开心；自我价值感驱动的人但凡花钱就会有不好的感受。", "id": "Q1235"}, {"type": "judge", "cat": "money", "q": "判断正误：对大多数人而言，创业是快速积累财富、最为稳妥的途径？", "ans": false, "exp": "原文：给大多数人的创业建议就是不要创业；有了点钱就自然想创业，老天爷收割财富最快的方式之一就是创业。", "id": "Q1236"}, {"type": "judge", "cat": "money", "q": "判断正误：有财富焦虑的人往往善于花钱、越花越多越有钱？", "ans": false, "exp": "原文：有财富焦虑的人只想省钱，理解不了为什么有些人越花钱越有钱，这是没有布施心的显化。", "id": "Q1237"}, {"type": "judge", "cat": "money", "q": "判断正误：物质驱动的人最看重物质和钱？", "ans": false, "exp": "原文：物质驱动的人，本质上对于赚钱这件事情没有兴趣；物质驱动的人最不看重物质。", "id": "Q1238"}, {"type": "judge", "cat": "money", "q": "判断正误：精神驱动的人只能靠出卖体力与时间日复一日换取钱财？", "ans": false, "exp": "原文：精神驱动的人赚钱的方式一定是自我价值感驱动，动动脑就会很有钱，无本万利。", "id": "Q1239"}, {"type": "judge", "cat": "money", "q": "判断正误：只要父亲有钱，任何人都能承载并承接住父亲的财富传承？", "ans": false, "exp": "原文：如果你不具有积极的精神驱动，那么你就无法承载来自父亲的财富，只有精神驱动的人才能得到父亲金钱方面的成就。", "id": "Q1240"}, {"type": "judge", "cat": "money", "q": "判断正误：大多数富二代都能靠投资成功并继承、放大父辈的事业基础？", "ans": false, "exp": "原文：富二代，能投资成功的是极少数，物质驱动的人极少。", "id": "Q1241"}, {"type": "judge", "cat": "money", "q": "判断正误：自我价值感驱动的人很适合把客户交成朋友，以便把生意做得长久？", "ans": false, "exp": "原文：自我价值感驱动的人，一定不能把客户发展成朋友，一旦处成了朋友，意味着少了一个客户。", "id": "Q1242"}, {"type": "judge", "cat": "money", "q": "判断正误：对男人而言，把钱花在各种女人和满足情欲上最能聚财？", "ans": false, "exp": "原文：对男人来说，最容易破财的地方是满足自己的情欲，就是花在女人身上，花在各种谋他财的女人身上。", "id": "Q1243"}, {"type": "judge", "cat": "scene", "q": "判断正误：话最少、最没有分享欲和表达欲的人，通常是情感驱动的人？", "ans": false, "exp": "原文：精神驱动的人话是最少的，有爱的人没有表达欲；情感驱动的人一定有分享欲、表达欲。", "id": "Q1244"}, {"type": "judge", "cat": "scene", "q": "判断正误：情感驱动的人往往是社恐、怕陌生人、不易与人亲近的？", "ans": false, "exp": "原文：情感驱动的人从来不怕陌生人，不怕人多，共情能力越强的人越不怕陌生人，很自然地跟人亲近。", "id": "Q1245"}, {"type": "judge", "cat": "scene", "q": "判断正误：真正有贵气、话少的人，通常是情感驱动的人？", "ans": false, "exp": "原文：责任感的话少和精神驱动的话少不同，责任感的人话少是因为贵气，这是真正区分人的社会地位的。", "id": "Q1246"}, {"type": "judge", "cat": "scene", "q": "判断正误：最懂吃、最有口福的人通常是责任感驱动的人？", "ans": false, "exp": "原文：很懂得吃就很有福气，情感驱动的人才能很懂得吃，因为这是生活的一部分。", "id": "Q1247"}, {"type": "judge", "cat": "scene", "q": "判断正误：打牌时最计较输赢、最输不起的人是情感驱动的人？", "ans": false, "exp": "原文：自我价值感驱动的人最计较输赢，最输不起的就是自我价值感驱动的人；情感驱动的人输赢心比较淡。", "id": "Q1248"}, {"type": "judge", "cat": "scene", "q": "判断正误：最会吵架、骂脏话、翻旧账的是有积极情感能力的人？", "ans": false, "exp": "原文：真正有情的女人是害怕冲突的；负面（过度）情感驱动的女人是最会吵架的，带着怨念和嗔恨吵架。", "id": "Q1249"}, {"type": "judge", "cat": "scene", "q": "判断正误：没有情的人最受不了被冤枉，一定会追着人解释清楚？", "ans": false, "exp": "原文：越有情越不能被冤枉；没有情的人就觉得随便你，爱怎么想怎么想无所谓。", "id": "Q1250"}, {"type": "judge", "cat": "scene", "q": "判断正误：责任感驱动的人往往爱迟到、拖延，做事拖泥带水？", "ans": false, "exp": "原文：有情的女人爱迟到、拖延；而责任感驱动就是执行力，责任感越强执行力越强。", "id": "Q1251"}, {"type": "judge", "cat": "scene", "q": "判断正误：情感驱动的人通常都不喜欢做饭？", "ans": false, "exp": "原文：情感驱动的人也一般会喜欢做饭……喜欢吃、喜欢靠近火的人喜欢做饭，喜欢做饭的，一定是情感驱动的。", "id": "Q1252"}, {"type": "judge", "cat": "scene", "q": "判断正误：有容貌焦虑的男人，通常是精神驱动的？", "ans": false, "exp": "原文：有容貌焦虑的男人，一定是情感驱动的；精神驱动的人最不会有容貌焦虑。", "id": "Q1253"}, {"type": "judge", "cat": "scene", "q": "判断正误：情感驱动的人睡眠最差，经常失眠、入睡困难？", "ans": false, "exp": "原文：情感驱动的人睡眠质量最高，哪怕有烦恼也不影响睡觉，可以秒睡。", "id": "Q1254"}, {"type": "judge", "cat": "scene", "q": "判断正误：精神驱动的人需要的睡眠时间最多？", "ans": false, "exp": "原文：精神驱动的人需要的睡眠时间最少，入睡不容易。", "id": "Q1255"}, {"type": "judge", "cat": "scene", "q": "判断正误：特别喜欢在朋友圈晒女友、爱秀恩爱的人，一定是责任感驱动的？", "ans": false, "exp": "原文：特别喜欢在朋友圈晒女朋友的男人是情感驱动的；自己主动喜欢公开关系的人是物质驱动的人。", "id": "Q1256"}, {"type": "judge", "cat": "scene", "q": "判断正误：在聚会和约会中，最不愿意买单、最不肯花自己钱的是情感驱动与物质驱动的人？", "ans": false, "exp": "原文：最爱买单/花自己钱的是情感驱动+物质驱动的；最不愿意买单/花自己钱的是自我价值感、精神驱动的。", "id": "Q1257"}, {"type": "judge", "cat": "scene", "q": "判断正误：情感驱动的女生一旦动情，一定会主动私下约喜欢的男生见面？", "ans": false, "exp": "原文：会主动约男生出来见面的女生，80%都是精神驱动的；男生主动才是动情的标志，女生动情的话一定不会主动。", "id": "Q1258"}, {"type": "judge", "cat": "scene", "q": "判断正误：克服社交恐惧最有效的办法，是时刻躲开人群、避免社交？", "ans": false, "exp": "原文：最有效的克服社恐的行为是花钱买单，主动的为大家买单就可以瞬间消除社交恐惧。", "id": "Q1259"}, {"type": "judge", "cat": "scene", "q": "判断正误：情感驱动的人喜欢你，就越会理性地与你谈观点、讲道理而非讲废话？", "ans": false, "exp": "原文：情感驱动的人喜欢一个人的表现就是想不想跟你分享日常，尤其是讲废话；有事说事、理性、讲观点，就是不喜欢。", "id": "Q1260"}, {"type": "judge", "cat": "scene", "q": "判断正误：一个人对小孩完全没有天性上的喜欢，也仍然可能是情感驱动的人？", "ans": false, "exp": "原文：对小孩没有天性上的喜欢，基本就不是情感驱动的，情感驱动的人喜欢小朋友。", "id": "Q1261"}, {"type": "judge", "cat": "scene", "q": "判断正误：吵架之后最喜欢删除、拉黑对方的是有积极情感能力的女人？", "ans": false, "exp": "原文：有积极情感能力的女人是不会删除、拉黑的；没有情的女人吵架之后才喜欢删除、拉黑。", "id": "Q1262"}, {"type": "judge", "cat": "scene", "q": "判断正误：高度精神驱动的男人最喜欢吹牛、讲大话？", "ans": false, "exp": "原文：高度精神驱动的人是不会吹牛的，连话都不讲；爱吹牛的多数是情感驱动的男生。", "id": "Q1263"}, {"type": "judge", "cat": "scene", "q": "判断正误：真正的贵气体现在话多、爱表现、时刻向人彰显自己？", "ans": false, "exp": "原文：贵气也就是静气是一个人身份感的来源，话少的人讲话有分量。", "id": "Q1264"}, {"type": "judge", "cat": "scene", "q": "判断正误：玩游戏容易上瘾、沉迷于游戏的人是责任感驱动的男生？", "ans": false, "exp": "原文：过度情感驱动，尤其是男生，玩游戏容易上瘾；做事业的男人打游戏也只是娱乐，真正会沉迷是过度情感驱动的表现。", "id": "Q1265"}, {"type": "judge", "cat": "scene", "q": "判断正误：精神驱动的女生平时最喜欢精心装扮自己、对外表十分在意？", "ans": false, "exp": "原文：精神驱动的人最不会有容貌焦虑，对外表不太在乎，通常不会特别打扮；情感驱动的女生会天然的想要打扮美美的出门。", "id": "Q1266"}, {"type": "judge", "cat": "scene", "q": "判断正误：最会挑毛病、对人挑剔最多的人通常是积极精神驱动的人？", "ans": false, "exp": "原文：最会挑毛病的人是情感驱动的，情越重越会挑毛病；不会挑毛病的人，主要是积极精神驱动的人。", "id": "Q1267"}, {"type": "judge", "cat": "scene", "q": "判断正误：真正做大事业的人喜欢在朋友圈高调展示自己的事业成果？", "ans": false, "exp": "原文：真正做事业的人是不会秀的，低调做事，闷声发大财。", "id": "Q1268"}, {"type": "judge", "cat": "scene", "q": "判断正误：情感驱动的人很少会因为看电视剧感动而流泪？", "ans": false, "exp": "原文：情感驱动和过度情感驱动都容易看电视剧感动而流泪。", "id": "Q1269"}, {"type": "judge", "cat": "scene", "q": "判断正误：情感驱动的人在日常生活中对数字和金钱通常非常敏感、精于算账？", "ans": false, "exp": "原文：情多的人对数字和钱没感觉，除非打麻将算钱这种才会算一下。", "id": "Q1270"}, {"type": "judge", "cat": "scene", "q": "判断正误：有情的男人向喜欢的人表白时往往吞吞吐吐、犹豫不决？", "ans": false, "exp": "原文：有情的男人表白张口就来；有情的女生很可能会有述情障碍。", "id": "Q1271"}, {"type": "judge", "cat": "scene", "q": "判断正误：情感驱动的女生从来不会主动对自己的伴侣动手动脚、摸摸蹭蹭？", "ans": false, "exp": "原文：情感驱动的女生会喜欢对自己伴侣动手动脚、摸来摸去，只在对自己喜欢的人这样。", "id": "Q1272"}, {"type": "judge", "cat": "scene", "q": "判断正误：有情的女人会多情，而有情的男人则一点都不多情？", "ans": false, "exp": "原文：有情的男人会多情，有情的女人一点都不多情。", "id": "Q1273"}]};  let pool = [];
  let idx = 0;
  let chosen = [];
  let revealed = false;
  let answers = {};
  let history = [];      // 访问历史栈（按实际看到的顺序）
  let historyIdx = -1;   // 当前在历史栈中的位置
  const qmap = new Map();
  DATA.questions.forEach(q=>qmap.set(q.id, q));
  const CATS = DATA.categories;

  function cats(){ return state.cat==='all' ? DATA.questions : DATA.questions.filter(q=>q.cat===state.cat); }
  function idsWhere(){ return cats().map(q=>q.id); }
  function recalcGlobal(){
    let a=DATA.questions.length;
    document.getElementById('sTotal').textContent=a;
    document.getElementById('sViewed').textContent=Object.keys(answers).length;
    let r=Object.values(answers).filter(x=>x.right).length;
    document.getElementById('sRight').textContent=r;
    let pct = Object.keys(answers).length? Math.round(r/Object.keys(answers).length*100) : 0;
    document.getElementById('sAccuracy').textContent=pct+'%';
    document.getElementById('barFill').style.width=(Object.keys(answers).length/a*100)+'%';
    document.getElementById('progress').textContent='答题进度 '+Object.keys(answers).length+' / '+a+' 题';
    renderTabs();
  }
  function updated(){
    let a=DATA.questions.length;
    document.getElementById('sViewed').textContent=Object.keys(answers).length;
    let r=Object.values(answers).filter(x=>x.right).length;
    document.getElementById('sRight').textContent=r;
    let pct = Object.keys(answers).length? Math.round(r/Object.keys(answers).length*100):0;
    document.getElementById('sAccuracy').textContent=pct+'%';
    document.getElementById('barFill').style.width=(Object.keys(answers).length/a*100)+'%';
    document.getElementById('progress').textContent='答题进度 '+Object.keys(answers).length+' / '+a+' 题';
  }
  const state = {cat:'all'};

  function renderTabs(){
    const bar=document.getElementById('tabbar');
    let html='';
    const all=[{id:'all',name:'全部',icon:'🗂️',hint:'从全部题目中抽卡'}].concat(CATS);
    all.forEach(c=>{
      let cnt = c.id==='all'? DATA.questions.length : DATA.questions.filter(q=>q.cat===c.id).length;
      const on = state.cat===c.id?' on':'';
      html+=`<button class="tab${on}" data-cat="${c.id}">${c.icon||''} ${c.name}<span class="n">${cnt}</span></button>`;
    });
    bar.innerHTML=html;
    bar.querySelectorAll('.tab').forEach(t=>t.onclick=()=> setCat(t.dataset.cat));
    const h=document.getElementById('hint');
    const cur = state.cat==='all'? {hint:'全部主题混合抽卡'} : CATS.find(c=>c.id===state.cat);
    h.textContent = cur? cur.hint : '';
  }
  function setCat(cat){
    state.cat=cat;
    pool=shuffle(idsWhere()); idx=0;
    chosen=[]; revealed=false;
    card('');
    recalcGlobal();
  }

  function shuffle(a){ let x=a.slice(); for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];} return x; }

  function drawOne(){
    if(!pool.length) pool=shuffle(idsWhere());
    if(!pool.length) return card(flush('当前分类下暂无题目'));
    const qid=pool.shift(); pool.push(qid);
    showQuestion(qid, false);
  }
  function drawAll(){
    pool=shuffle(idsWhere()); idx=0;
    history=[]; historyIdx=-1;
    if(pool.length) next(); else card(flush('当前分类下暂无题目'));
  }
  function next(){
    // 如果当前在历史中间，先向前走历史
    if(historyIdx < history.length-1){
      historyIdx++;
      showQuestion(history[historyIdx], true);
      return;
    }
    // 否则从 pool 抽新题
    if(!pool.length){ card(flush('本轮已抽完，点「抽一题」或「全部打乱」重新开始')); return; }
    const qid=pool[idx]; idx=(idx+1)%pool.length;
    showQuestion(qid, false);
  }
  function prev(){
    if(historyIdx <= 0) return;
    historyIdx--;
    showQuestion(history[historyIdx], true);
  }

  function humanType(t){ return {judge:'是非题',single:'单选题',multi:'多选题',short:'简答题'}[t]||t; }
  function chipTypeName(t){ return {judge:'是非',single:'单选',multi:'多选',short:'简答'}[t]; }
  function catName(id){ if(id==='all')return '全部'; const c=CATS.find(x=>x.id===id); return c?c.name:id; }

  function showQuestion(qid, fromHistory){
    const q=qmap.get(qid); if(!q) return;

    // 维护访问历史（仅在不是由「上一题」回退触发时入栈）
    if(!fromHistory){
      if(historyIdx < history.length-1) history = history.slice(0, historyIdx+1);
      history.push(qid);
      historyIdx = history.length-1;
    }

    order = shuffle(q.options ? q.options.map((_,i)=>i) : [0,1]);

    // 如果已经答过，直接显示只读结果；否则显示可作答卡片
    if(answers[qid] && answers[qid]._s){
      renderReviewCard(q, answers[qid]);
    } else {
      chosen=[]; revealed=false;
      renderCard(q);
    }
  }

  function correctIndices(q){
    if(q.type==='single') return [q.ans];
    if(q.type==='judge') return [q.ans?0:1];
    if(q.type==='multi') return q.ans.slice();
    return [];
  }
  function correctText(q){
    if(q.type==='short') return q.ans;
    if(q.type==='judge') return q.ans?'正确':'错误';
    const ci= (q.type==='single')? [q.ans] : q.ans.slice();
    const dispIdx = ci.map(i=>order.indexOf(i));
    return dispIdx.map(pos=>race(pos)+'. '+optText(q,order[pos])).join('；');
  }
  function isAnsCorrect(q,picked){
    if(q.type==='judge'){ const right= q.ans?[0]:[1]; return picked.length===1 && right[0]===picked[0]; }
    if(q.type==='single'){ return picked.length===1 && picked[0]===q.ans; }
    if(q.type==='multi'){ return picked.slice().sort().join()===q.ans.slice().sort().join(); }
    return false;
  }

  // ===== 简答题相似度判分 =====
  function normalizeText(s){
    return String(s).toLowerCase()
      .replace(/[^\u4e00-\u9fa5a-z0-9]/g,'')
      .trim();
  }
  function bigrams(s){
    const arr=[];
    for(let i=0;i<s.length-1;i++) arr.push(s.slice(i,i+2));
    return arr;
  }
  function jaccard(a,b){
    if(!a.length || !b.length) return 0;
    const sa=new Set(a), sb=new Set(b);
    let inter=0;
    sa.forEach(x=>{ if(sb.has(x)) inter++; });
    return inter/(sa.size+sb.size-inter);
  }
  function matchShortAnswer(input, ans){
    const ni=normalizeText(input);
    const na=normalizeText(ans);
    if(!ni) return {ok:false, score:0};
    if(ni===na) return {ok:true, score:1};
    if(ni.includes(na) || na.includes(ni)) return {ok:true, score:0.95};
    const score=jaccard(bigrams(ni), bigrams(na));
    return {ok: score>=0.5, score: score};
  }
  function race(n){ return 'ABCDEFGHIJ'[n]; }
  function optText(q,oi){
    if(q.type==='judge') return oi===0?'正确':'错误';
    return q.options[oi];
  }

  function renderCard(q){
    const area=document.getElementById('cardArea');
    let inner='';
    inner+=`<div class="card" id="qcard">`;
    inner+=`<div class="qmeta"><span class="chip">${catName(q.cat)}</span><span class="chip t">${chipTypeName(q.type)}</span><span class="qnum">${q.id}</span></div>`;
    inner+=`<div class="q">${q.q}</div>`;
    if(q.type!=='short'){
      inner+=`<div class="options" id="opts">`;
      for(let k=0;k<order.length;k++){
        const oi=order[k];
        inner+=`<div class="opt" data-pos="${k}" data-oi="${oi}"><span class="key">${race(k)}</span><span>${optText(q,oi)}</span></div>`;
      }
      inner+=`</div>`;
    } else {
      inner+=`<textarea class="short-in" id="shortIn" placeholder="在脑海或此处写下你的答案…"></textarea>`;
    }
    const hasPrev = historyIdx > 0;
    const actText = q.type==='short' ? '提交答案' : (q.type==='multi' ? '提交答案' : '');
    inner+=`<div class="toolbar" style="margin:6px 0 0;gap:10px">
      ${hasPrev ? '<button class="btn ghost" id="prevBtn">上一题</button>' : ''}
      <button class="btn ghost" id="actBtn" style="${actText?'':'display:none'}">${actText}</button>
      <button class="btn ghost" id="skipBtn">下一题</button>
    </div>`;
    inner+=`<div id="ansArea"></div>`;
    inner+=`</div>`;
    area.innerHTML=inner;

    if(q.type!=='short'){
      document.querySelectorAll('#opts .opt').forEach(o=>{
        o.addEventListener('click',()=>{
          if(revealed) return;
          if(q.type==='single'||q.type==='judge'){
            chosen=[+o.dataset.oi];
            document.querySelectorAll('#opts .opt').forEach(x=>x.classList.remove('picked'));
            o.classList.add('picked');
            revealAnswer(q);
          } else { // multi: toggle pending, reveal on submit
            const oi=+o.dataset.oi;
            const i=chosen.indexOf(oi);
            if(i>=0)chosen.splice(i,1); else chosen.push(oi);
            o.classList.toggle('picked', chosen.includes(oi));
          }
        });
      });
    }
    // action button
    const actBtn=document.getElementById('actBtn');
    if(actBtn){
      actBtn.addEventListener('click',()=>{ if(!revealed) revealAnswer(q); });
    }
    const prevBtn=document.getElementById('prevBtn');
    if(prevBtn){ prevBtn.addEventListener('click',()=>prev()); }
    document.getElementById('skipBtn').addEventListener('click',()=>next());
  }

  // 回看已答过的题（只读）
  function renderReviewCard(q, rec){
    const area=document.getElementById('cardArea');
    let inner='';
    inner+=`<div class="card" id="qcard">`;
    inner+=`<div class="qmeta"><span class="chip">${catName(q.cat)}</span><span class="chip t">${chipTypeName(q.type)}</span><span class="qnum">${q.id}</span><span class="chip" style="background:#faf3e0;color:#b8714e;margin-left:auto">已作答</span></div>`;
    inner+=`<div class="q">${q.q}</div>`;
    if(q.type!=='short'){
      inner+=`<div class="options" id="opts">`;
      const ci=correctIndices(q);
      const correctPos = new Set(ci.map(i=>order.indexOf(i)));
      for(let k=0;k<order.length;k++){
        const oi=order[k]; const isCorr=correctPos.has(k);
        const isPicked = rec.chosen && rec.chosen.includes(oi);
        let cls='opt readonly' + (isCorr?' ok':'') + (isPicked&&!isCorr?' bad':'');
        inner+=`<div class="${cls}" data-pos="${k}"><span class="key">${race(k)}</span><span>${optText(q,oi)}</span></div>`;
      }
      inner+=`</div>`;
    } else {
      inner+=`<div style="background:#fbf7ec;border:1px solid var(--rule);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:15px;color:var(--ink)">${rec.input ? escHtml(rec.input) : '<span style="color:var(--muted)">（未填写）</span>'}</div>`;
    }
    const hasPrev = historyIdx > 0;
    inner+=`<div class="toolbar" style="margin:6px 0 0;gap:10px">
      ${hasPrev ? '<button class="btn ghost" id="prevBtn">上一题</button>' : ''}
      <button class="btn ghost" id="skipBtn">下一题</button>
    </div>`;
    inner+=`<div id="ansArea"></div>`;
    inner+=`</div>`;
    area.innerHTML=inner;

    // 直接渲染答案区
    const aa=document.createElement('div');
    aa.className='ans-show';
    const right = rec.right;
    const verdict = right
      ? '<div class="alabel" style="color:var(--ok)">✔ 答对了</div>'
      : '<div class="alabel" style="color:var(--no)">✘ 答错了</div>';
    const ansLine = q.type==='short' ? '' : '<div class="alabel">正确答案</div>';
    aa.innerHTML = verdict + ansLine +
      `<div class="ansline">${correctText(q)}</div>` +
      `<div class="explain"><b>解析：</b>${q.exp}</div>`;
    const c=document.querySelector('#ansArea');
    c.innerHTML=''; c.appendChild(aa);

    const prevBtn=document.getElementById('prevBtn');
    if(prevBtn){ prevBtn.addEventListener('click',()=>prev()); }
    document.getElementById('skipBtn').addEventListener('click',()=>next());
  }

  function escHtml(s){
    return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function revealAnswer(q){
    revealed=true;
    const qid=q.id;
    let right=null;
    let userInput='';
    if(q.type==='short'){
      const ta=document.getElementById('shortIn');
      userInput = ta ? ta.value.trim() : '';
      if(userInput){
        const m = matchShortAnswer(userInput, q.ans);
        right = m.ok;
      }
    } else {
      if(chosen.length) right=isAnsCorrect(q,chosen);
    }

    if(q.type!=='short'){
      const ci = correctIndices(q);
      const correctOrderPos = ci.map(i=>order.indexOf(i));
      document.querySelectorAll('#opts .opt').forEach(o=>{
        const pos=+o.dataset.pos;
        const isCorr = correctOrderPos.includes(pos);
        if(isCorr) o.classList.add('ok');
        if(chosen.includes(+o.dataset.oi)&&!isCorr) o.classList.add('bad');
        o.classList.remove('picked'); o.classList.add('readonly');
      });
    }

    const aa=document.createElement('div');
    aa.className='ans-show';
    let verdictTxt='';
    if(right!==null){
      verdictTxt = right? '<div class="alabel" style="color:var(--ok)">✔ 答对了</div>'
                       : '<div class="alabel" style="color:var(--no)">✘ 答错了</div>';
      if(!answers[qid]) answers[qid]={right:false,wrong:0};
      const rec=answers[qid];
      rec._s = true;                 // 标记已提交
      rec.input = userInput;         // 简答题保存用户输入
      rec.chosen = chosen.slice();   // 选择题保存选项
      if(right){ if(!rec._r){rec.right=true; rec._r=true;} }
      else rec.wrong++;
      const r2=Object.entries(answers).filter(([,v])=>v.right).length;
      document.getElementById('sRight').textContent=r2;
    } else {
      verdictTxt='<div class="alabel" style="color:var(--accent)">参考答案</div>';
    }
    let ansLine = q.type==='short' ? '' : '<div class="alabel">正确答案</div>';
    aa.innerHTML = verdictTxt + ansLine +
      `<div class="ansline">${correctText(q)}</div>` +
      `<div class="explain"><b>解析：</b>${q.exp}</div>`;
    const c=document.querySelector('#ansArea');
    c.innerHTML=''; c.appendChild(aa);
    const actBtn=document.getElementById('actBtn');
    if(actBtn) actBtn.disabled=true;
    if(q.type==='short'){ const ta=document.getElementById('shortIn'); if(ta) ta.disabled=true; }
    updated();
  }

  function card(html){ document.getElementById('cardArea').innerHTML=html; }
  function flush(msg){ return `<div class="flush-centered">${msg}</div>`; }

  document.getElementById('drawBtn').addEventListener('click',()=>drawOne());
  document.getElementById('shuffleBtn').addEventListener('click',()=>drawAll());
  document.getElementById('resetBtn').addEventListener('click',()=>{ answers={}; pool=shuffle(idsWhere()); idx=0; history=[]; historyIdx=-1; recalcGlobal(); card(''); });

  pool=shuffle(DATA.questions.map(q=>q.id));
  recalcGlobal();
  card(`<div class="flush-centered">点上方「抽一题」开始随机自测，或点标签按主题切换。<br>选择题 / 是非题：<b>选中即判对错</b>；多选与简答需点「提交答案」，简答题会根据语义相似度自动判定对错。</div>`);
})();
</script>

</body></html>
