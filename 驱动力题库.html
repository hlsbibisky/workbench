者都一样", "两者都无法赚到"], "ans": 1, "exp": "原文：情感驱动的人赚朋友的钱是毫无违和感的…但是自我价值感驱动的人赚朋友的钱，会感觉浑身不舒服…他赚不了朋友的钱。", "id": "Q0454"}, {"type": "single", "cat": "love", "q": "真正有情感能力（情感驱动）的人，在做事的发心上与赚钱驱动的人不同。那么情感驱动的人是否以赚钱为目的？", "options": ["以赚钱为核心追求", "不以赚钱为目的，开心与不开心才是做事的核心驱动力", "以名利为目的", "以地位为目的"], "ans": 1, "exp": "原文：真正有情感能力的人，他是不会以赚钱为目的去做很多事情的。反而他的开心与不开心，是自己生命当中最重要的做事情的驱动力。", "id": "Q0455"}, {"type": "single", "cat": "love", "q": "在分析不同驱动力女生与'渣男'的关系时，最容易被渣（被花言巧语哄骗）的女生是哪种驱动？", "options": ["情感驱动", "责任感驱动", "精神驱动", "物质驱动"], "ans": 2, "exp": "原文：会被渣男玩弄、被花言巧语哄骗的是精神驱动的女人…最容易被渣的就是精神驱动的女生，最不容易被渣的是情感驱动的。", "id": "Q0456"}, {"type": "single", "cat": "love", "q": "关于“因爱生恨”，下列哪种说法正确？", "options": ["只有有爱的女人才可能生得出恨", "有情的女生最容易生恨", "所有人都能生恨", "恨与爱、情都无关"], "ans": 0, "exp": "原文：因爱生恨是有爱的女人从爱变成了情，变成了怨恨。而有情的女生本质上无法有怨恨。所以只有有爱的女人才有可能生的出恨。", "id": "Q0457"}, {"type": "single", "cat": "love", "q": "女人想判断自己是不是一个“有爱的人”，最直观的标尺是什么？", "options": ["看自己赚多少钱", "看自己得到多少男人的情", "看自己朋友多少", "看自己多理性"], "ans": 1, "exp": "原文：想判断自己是不是一个有爱的人，就看自己得到了多少的情。这是非常直观的标尺。没有爱就得不到男人的情。两者等价。", "id": "Q0458"}, {"type": "single", "cat": "love", "q": "在'粘人'这一相爱行为中，男女性别不同所对应的驱动力也不同。那么爱粘人的男生与爱粘老公的女人分别是什么驱动？", "options": ["男生责任感驱动、女生物质驱动", "男生物质驱动、女生责任感驱动", "男生精神驱动、女生情感驱动", "两者都一样"], "ans": 1, "exp": "原文：爱粘人的男生是物质驱动的，爱粘人的女生是责任感驱动的。", "id": "Q0459"}, {"type": "single", "cat": "love", "q": "高度自我价值感驱动的女生在友谊中会有怎样的表现？", "options": ["不需要朋友", "讨厌同伴暴露需求", "对朋友有很大需要、很容易向同伴暴露需求", "从不独占朋友"], "ans": 2, "exp": "原文：高度自我价值感驱动的女生，对朋友有很大需要。看到朋友和别人一起玩，就会很难过。就想独占朋友…她们会很容易向同伴暴露她的需求。", "id": "Q0460"}, {"type": "single", "cat": "love", "q": "一个既能搞事业又有情（情感驱动与责任感驱动同时兼顾）的女人，在价值上属于什么？", "options": ["很常见的女人", "很低价值的女人", "非常稀少但属于高价值的女人", "没有特殊价值"], "ans": 2, "exp": "原文：兼具情感驱动与责任感驱动这也是一种非常非常稀少的…又通常来说是高价值的女人，既是情感驱动，又能够稳定跟平衡事业，又是责任感驱动的女人，这个一定是高价值的女人。", "id": "Q0461"}, {"type": "single", "cat": "love", "q": "在精神驱动女人与情感驱动男人的匹配中，精神驱动的女人给情感驱动男人的回应方式是？", "options": ["给钱", "愿意去提供情绪价值", "冷漠", "控制"], "ans": 1, "exp": "原文：精神驱动的女人给情感驱动的男人的回应，就是愿意去给这个男人提供情绪价值。愿意这个词的含义就是精神驱动，本质有爱的女人给男人的回应，就是愿意。", "id": "Q0462"}, {"type": "single", "cat": "love", "q": "论及精神驱动的人对待感情时，他们最无法处理伴侣的某种状态，这种状态会导致其期待落空而激起嗔恨。那么精神驱动的人最无法处理伴侣的什么状态？", "options": ["伴侣的粘人", "伴侣的冷漠", "伴侣的花钱", "伴侣的强势"], "ans": 1, "exp": "原文：精神驱动最处理不了的东西就是伴侣的冷漠。因为始终在期待。只要对方好一点，问题就解决了，但是完全没有的话，就会激起你的嗔恨怨恨。", "id": "Q0463"}, {"type": "single", "cat": "parent", "q": "父母是什么样的人，与孩子最终成为什么样的人之间是什么关系？", "options": ["存在必然的一一对应因果关系", "没有明确的因果关系，父母不能决定孩子最终成为什么样的人", "父母是孩子的关键决定因素", "完全由孩子的财运决定"], "ans": 1, "exp": "原文：父母是什么样的人，他是不能够决定孩子是什么样的人的。你的父母是什么样的人，也不能够决定你是什么样的人。", "id": "Q0626"}, {"type": "single", "cat": "parent", "q": "物质驱动（以财星为用）的人，与父亲的关系通常表现为怎样？", "options": ["亲近父亲，对父亲的陪伴和存在有需求", "天生远离父亲", "对父亲充满怨恨", "与父亲毫无关系"], "ans": 0, "exp": "原文：物质驱动的人，他就会亲近他的父亲…物质驱动的人，对父亲的陪伴，对父亲的存在是有需求的。", "id": "Q0627"}, {"type": "single", "cat": "parent", "q": "一个人如果与父亲关系处理不好（心中对父亲充满怨恨、批判、看不起），会带来什么后果？", "options": ["很难有贵气，贵气没有源头、无法显发", "一定会非常贫穷", "一定会特别富有", "对人生没有任何影响"], "ans": 0, "exp": "原文：如果没有办法处理好与父亲关系的人，他很难有贵气。他的贵气没有源头，贵气无缘，贵气无法得到显发。", "id": "Q0628"}, {"type": "single", "cat": "parent", "q": "一个人如果内心能亲近自己的母亲、对母亲有陪伴需求，通常意味着他比较容易成为怎样的人？", "options": ["理智的人，比较容易开智慧", "情感特别泛滥的人", "物质特别充裕的人", "没有主见的人"], "ans": 0, "exp": "原文：如果你能够很亲近自己的母亲的人，通常情况下是比较容易拥有智慧的。比较容易开智慧，是理智的人。", "id": "Q0629"}, {"type": "single", "cat": "parent", "q": "一个人能否承载、继承来自父亲（父辈）的财富，主要由什么决定？", "options": ["是否具有积极的精神驱动", "是否足够孝顺", "是否是独生子女", "是否物质驱动"], "ans": 0, "exp": "原文：如果你不具有积极的精神驱动，那么你就无法承载来自父亲的财富…没有精神驱动，你得不到来自于父亲在财富上的恩泽…也就是精神驱动可以直接决定的。", "id": "Q0630"}, {"type": "single", "cat": "parent", "q": "一个精神驱动的人，通常在需求层面上对母亲有什么需求？", "options": ["陪伴", "情", "爱", "金钱"], "ans": 0, "exp": "原文：对于母亲的陪伴有需求的人，是精神驱动的人…精神驱动的女生，会对母亲投射陪伴需求。", "id": "Q0631"}, {"type": "multi", "cat": "parent", "q": "不同核心驱动力类型的人对母亲的需求各不相同。以下哪些说法是正确的？", "options": ["对母亲的陪伴有需求的人，是精神驱动的人", "对母亲的情有需求的人，是自我价值感驱动的人", "对母亲的爱有需求的人，是责任感驱动的人", "所有人都必须要亲近母亲"], "ans": [0, 1, 2], "exp": "原文：对于母亲的陪伴有需求的人，是精神驱动的人。对于母亲的情有需求的人，是自我价值感驱动的人。对于母亲的爱有需求的人，是责任感驱动的人。", "id": "Q0632"}, {"type": "single", "cat": "parent", "q": "关于情感驱动的人与母亲的关系，其通常表现为怎样？", "options": ["无法与母亲长时间亲近陪伴，但能够得到来自母亲金钱上的恩泽", "与母亲极为亲密", "彻底脱离母亲", "与母亲完全没有关系"], "ans": 0, "exp": "原文：情感驱动的人，他跟母亲的关系一般都是非常远的，他没有办法靠近自己的母亲…但是情感驱动的人，能够得到来自于母亲金钱上的恩泽。", "id": "Q0633"}, {"type": "single", "cat": "parent", "q": "一个女人与婆婆关系好、会善待婆婆，说明她属于哪一种驱动类型？", "options": ["积极物质驱动（物质驱动）", "情感驱动", "责任感驱动", "精神驱动"], "ans": 0, "exp": "原文：女人直接靠婆媳关系区分。和婆婆关系好的女人、会善待婆婆的女人就是潜在的积极物质驱动的女人。…你怎么对待她是直接决定你是否是物质驱动的。", "id": "Q0634"}, {"type": "single", "cat": "parent", "q": "处理好与父母（孝）的关系这一结果，并不一定意味着什么？", "options": ["一定要与父母非常亲密、很多陪伴、很多爱和很多情", "一定要给父母物质上的供养", "一定要完全认同父母的观念", "一定要与父母彻底断联"], "ans": 0, "exp": "原文：每一个人与父母的关系都至关重要，这个关系并不是特指亲密的关系…并不意味着你一定要与父母非常的亲密，或者很多的陪伴，或者很多的爱，或者很多的情，并不是的。", "id": "Q0635"}, {"type": "single", "cat": "parent", "q": "哪一类人与父母之间一定会有无法排解的矛盾（而非善缘）？", "options": ["精神驱动的男人、情感驱动的女人", "精神驱动的女人、情感驱动的男人", "责任感驱动的人", "物质驱动的人"], "ans": 0, "exp": "原文：精神驱动的男人、情感驱动的女人，他们跟父母之间一定都会有无法排解的矛盾。反而精神驱动的女人，与情感驱动的男人，与父母之间的关系，一定就是会有一些善缘。", "id": "Q0636"}, {"type": "single", "cat": "parent", "q": "父母过度的驱动力、负能量（如精神焦虑、负面情绪）能否被孩子吸收转化为孩子自身积极的能量来源？", "options": ["可能，孩子吸收转化后负能量可能成为滋养，是来报恩的善缘", "不可能，负能量必然彻底摧残孩子", "只有积极能量对孩子才有意义", "只对孩子财运有影响"], "ans": 0, "exp": "原文：父母的过度驱动力、负能量能被孩子吸收转化成孩子自身积极的能量来源，这是亲子关系中非常好的善缘，就是来报恩的。", "id": "Q0637"}, {"type": "single", "cat": "parent", "q": "一个孩子同时亲近自己的父亲和母亲，是常见还是罕见的？", "options": ["是罕见的，多数孩子只能亲近某一方", "非常常见", "男女完全一样", "取决于家庭财富"], "ans": 0, "exp": "原文：一个孩子同时亲近自己的父亲和母亲，是比较罕见的。多数是只能亲近某一方。", "id": "Q0638"}, {"type": "single", "cat": "parent", "q": "所谓'真正的孝'，其核心是什么？", "options": ["不评判父母、能宽恕和原谅父母的愚痴、贪婪、嗔恨，内心没有分别心", "对父母好、给予充足的物质供养", "时刻守在父母身边", "完全继承父母的财富"], "ans": 0, "exp": "原文：能够不对父母投射这些负能量的念头，能够宽恕和原谅父母的愚痴…这是真正的孝的含义。你要能够做到孝，就是做到对父母的愚痴…都能够没有评判，没有分别心。", "id": "Q0639"}, {"type": "single", "cat": "parent", "q": "疗愈内在伤痛、放下对父母执着的方式是什么？", "options": ["和原生家庭了缘，放下对父母的执着与自我执着的功课", "远离并断绝与父母的一切关系", "以怨恨报复父母", "劝说改变父母"], "ans": 0, "exp": "原文：疗愈的方式是和原生家庭了缘。不放下对父母的执着自我的功课是完不成的。", "id": "Q0640"}, {"type": "single", "cat": "scene", "q": "在亲密关系里，一方出现『凡是不按我的方式做就生气、索要对方的爱与迁就』的行为时，用哪个词来概括这类日常表现？", "options": ["情感控制", "用理性讲道理压人", "用冷漠惩罚对方", "用钱要挟对方"], "ans": 0, "exp": "原文：情感控制就是不按她的方式做就生气，要你给她爱。", "id": "Q0813"}, {"type": "single", "cat": "scene", "q": "有一种人'一眼看上去就很理性、对什么事都想分析一下'，遇事总爱钻牛角尖、把简单问题越想越复杂。从驱动力角度看，这更可能是下列哪种状态？", "options": ["积极的正常理性思考", "过度精神驱动", "过度情感驱动", "责任感驱动"], "ans": 1, "exp": "原文：一眼看上去就很理性，可能是过度理性，对什么事都想分析一下，很可能不是积极的精神驱动而是过度精神驱动。…过度精神驱动是最容易神经衰弱的人。实际不爱思考，但就是有过度的精神力，焦虑内耗，想太多。", "id": "Q0814"}, {"type": "single", "cat": "scene", "q": "一个人到社交场合就紧张、想到人多处融入却做不到，被视为有『社恐』。哪种具体的行为最能有效地克制（消除）这种社交恐惧？", "options": ["强迫自己多说多聊", "大方地主动为众人买单花钱", "干脆远离人群", "强行去讨好共情对方"], "ans": 1, "exp": "原文：最有效的克服社恐的行为是花钱买单，主动的为大家买单就可以瞬间消除社交恐惧…这里说的买单是物欲驱动的，只是大方，不是情感驱动的讨好。物欲驱动是克制精神驱动的，这就是核心原理。", "id": "Q0815"}, {"type": "single", "cat": "scene", "q": "面对一个人『性格内向、不爱说话、爱生闷气』，又常有很多感受表达不出来（类似述情障碍）的情况，如何区分『内向』与『社交恐惧』以及『述情障碍』这几类现象？", "options": ["内向是不想社交；社恐是想社交却融入不了；述情障碍是想表达却表达不出来", "三者完全是一回事", "内向就是社交恐惧", "述情障碍就是性格急躁"], "ans": 0, "exp": "原文：述情障碍和性格内向不一样，内向是不想社交，社恐是想社交融入不了。述情障碍是社恐的一种特征（有很多感受表达不出来）性格急躁和爱生闷气也不是一回事。", "id": "Q0816"}, {"type": "single", "cat": "scene", "q": "有这样一种亲子相处场景：母亲非常理性、不带情绪地直接威胁孩子，用孩子犯的过错来惩罚他、冷漠不理他，让孩子感到愧疚和害怕。这种行为被界定为什么？", "options": ["过度情感驱动的情绪宣泄", "过度精神驱动的精神控制（愧疚式教育）", "责任感驱动的合理管教", "过度自我价值感的打压"], "ans": 1, "exp": "原文：过度精神驱动的人很容易展现出精神攻击的一面，比如指责/质问你为什么没把这件事做好…非常理性、不带情绪的直接威胁孩子，因为做错了XX事，从现在开始我和哥哥姐姐都不会理你，哭也没用，让她的孩子感到愧疚和害怕。用对方的过错去惩罚他，这就是精神攻击。…站在道德制高点的愧疚式教育…这就是精神控制。", "id": "Q0817"}, {"type": "single", "cat": "scene", "q": "亲密关系中，一个人看到伴侣很开心，自己反而莫名怒意上涌、想让对方不高兴。这种『看不得伴侣开心』的状态归因为什么？", "options": ["过度精神驱动", "过度情感驱动", "过度自我价值感驱动", "责任感驱动"], "ans": 0, "exp": "原文：看到伴侣开心就莫名的怒火上来，想让他不开心。这是过度精神驱动的表现…精神驱动瞬间变成了过度精神驱动。", "id": "Q0818"}, {"type": "single", "cat": "scene", "q": "有一种相处方式：一方对伴侣进行高强度的质问、逼对方描述细节，站在道德高位、用让人觉得“我对你错”的方式维持气场，令对方不得不内疚。这种“站在高位说话”的方式，其性质是什么？", "options": ["源于过度自我价值感（我慢心）", "天性上属于过度精神驱动", "源于过度情感驱动", "属于责任感驱动的担当"], "ans": 1, "exp": "原文：对老公的质问，本质上就是来自理性层面的高强度的精神攻击，通过胁迫的方式让他不得不内疚。站在高位说话就是精神的攻击性。这还不是因为我慢心，而是天性上过度的精神驱动。", "id": "Q0819"}, {"type": "single", "cat": "scene", "q": "一个人整天'躺平（不思进取、不想做事）'，这种生活状态与哪些内在驱动力有关？", "options": ["只与情感驱动有关", "过度精神驱动和过度情感驱动都可能表现为躺平，只是类型不同", "只与自我价值感驱动有关", "只与物质驱动有关"], "ans": 1, "exp": "原文：过度的精神驱动，过度的情感驱动，都是躺平的特征。只是不同类型的躺平。", "id": "Q0820"}, {"type": "single", "cat": "scene", "q": "从情绪与行为的对应关系看，一个人平时确实动手打人（出现直接肢体冲突）时，这最可能反映其内在处于什么状态？", "options": ["过度情感驱动（情绪失控）", "过度精神驱动", "责任感驱动", "过度物质驱动"], "ans": 0, "exp": "原文：真的会打人的人一定是过度情感驱动的。因为过度情感驱动=情绪失控。…过度情感驱动的女人最容易招致家暴，本身她自己也很容易动手。", "id": "Q0821"}, {"type": "single", "cat": "scene", "q": "在亲密关系争吵中，一个人动不动就生气、有嗔恨心、爱挑对方毛病（观过失、有控制欲），而且“吵架永远翻旧账”。这是哪种驱动的典型特征？", "options": ["过度情感驱动", "过度精神驱动", "过度自我价值感驱动", "责任感驱动"], "ans": 0, "exp": "原文：容易生气，容易有嗔恨心、我慢心、观过失（控制欲）就是过度的情感驱动的特征。吵架永远翻旧账。", "id": "Q0822"}, {"type": "single", "cat": "scene", "q": "在择偶与考察伴侣的方式上，『有爱的女生』与『有情的女生』：当遇到一个对自己不错的男人时，两种女生各自的『审核（接纳）方式』分别是怎样的？", "options": ["有爱的女生考验对方为自己付出多少；有情的女生看重『我是否喜欢』", "两者都只看对方帅不帅", "两者都只看对方有没有钱", "两者都要求对方主动跪舔"], "ans": 0, "exp": "原文：有爱的女生倾向于找个对自己好的男人。要好好考验他…一定要对方付出到一定的量才能接纳他…但有情的女人不是，有情的女人的审核方式不是他对不对我好，是我喜欢。", "id": "Q0823"}, {"type": "single", "cat": "scene", "q": "分手后能否'和前任做朋友'，与一个人是否有'情'有关。下列关于此事说法正确的是哪一项？", "options": ["只要不是情感驱动的人，无论男女都可以和前任做朋友", "男/女只要不是情感驱动就都能和前任做朋友", "没有情的人才可以和前任做朋友，但对女人来说比较难", "任何人都不该和前任做朋友"], "ans": 2, "exp": "原文：没有情的人可以和前任做朋友，但对女人来说比较难。除非她既不是情感驱动也不是精神驱动的女人，才可能和前任做朋友。男人只要不是情感驱动就可以和前任做朋友。", "id": "Q0824"}, {"type": "single", "cat": "scene", "q": "有一位男性特别喜欢在朋友圈晒女友、高调秀恩爱。从行为反推驱动力，这种'特别爱秀'的男人属于哪种驱动的状态？", "options": ["情感驱动，甚至有点过度情感驱动", "精神驱动", "责任感驱动", "物质驱动"], "ans": 0, "exp": "原文：特别喜欢在朋友圈晒女朋友的男人是情感驱动的。甚至有点过度情感驱动…这样的人一定不是责任感驱动。特别爱秀的人做不了事业，做事一定不靠谱。", "id": "Q0825"}, {"type": "single", "cat": "scene", "q": "从才华与灵感的来源看，一个人热爱写诗、搞艺术创作，其灵感和才华的本质更可能与哪种内在驱动力相关？", "options": ["情感驱动", "精神驱动", "物质驱动", "责任感驱动"], "ans": 0, "exp": "原文：写诗的本质是才华，才情，创造，艺术，情感，一定是情感驱动的人。创作者的灵感一定不来自精神世界，而是情感。", "id": "Q0826"}, {"type": "single", "cat": "scene", "q": "有一类人非常固执，跟他说什么都没用，内心一旦形成一个观点就必然不会改变，即使这个观点其实是错的。这类“固执、好争、争的是自己观点”的行为，属于哪种驱动的典型特征？", "options": ["过度自我价值感驱动", "过度情感驱动", "过度精神驱动", "过度物质驱动"], "ans": 0, "exp": "原文：过度自我价值感驱动的人性格中最典型的特征是固执。行为方式是好争，争自己是对的…内心一旦产生一个观点，就必然不会改变。不会认为自己是错的，即使其实是错的。过度自我价值感驱动的人形成的观点，100%没有好结果，但他一定不会改。", "id": "Q0827"}, {"type": "single", "cat": "scene", "q": "一个人很在意别人怎么对待自己、很需要确认'你爱不爱我'，而一旦有人爱自己反而怀疑自己不配被爱。这些表现的本质是什么？", "options": ["自我价值感的缺失", "过度情感驱动", "过度精神驱动", "责任感驱动"], "ans": 0, "exp": "原文：当你在问一个人爱不爱你的时候，它的本质是你的自我价值感的缺失。当你在意别人怎么对待你的时候，当你在意别人需不需要你的时候，它的本质都是自我价值感缺失而影响的。", "id": "Q0828"}, {"type": "single", "cat": "scene", "q": "在亲密关系中，一个人对伴侣生出猜疑、嫉妒，进而想控制对方。这种猜疑嫉妒直接反映的是内在的哪种状态？", "options": ["自我价值感缺失", "过度精神驱动", "过度情感驱动", "责任感驱动"], "ans": 0, "exp": "原文：感情中生出猜疑、嫉妒都是自我价值感缺失的表现，直接的结果是控制欲。…但这不一定代表了是精神驱动，不一定，只是过度自我价值感驱动。", "id": "Q0829"}, {"type": "single", "cat": "scene", "q": "同样是『口袋里有不少钱』的人，有些人安然不焦虑，有些人却仍旧为赚钱焦虑。从驱动力角度区分这两种人，说法正确的是哪一项？", "options": ["口袋里有钱就不焦虑的是物质驱动；明明很有钱还焦虑赚钱的是自我价值感驱动", "口袋里有钱不焦虑的是责任感驱动", "两者都是过度情感驱动", "两者都是过度精神驱动"], "ans": 0, "exp": "原文：口袋里有钱就好，不焦虑赚钱的是物质驱动。口袋里明明很有钱，还焦虑赚钱的是自我价值感驱动。", "id": "Q0830"}, {"type": "single", "cat": "scene", "q": "从日常婚姻关系的侧面判断，要观察一个女人的『物质驱动』状态时，一个实用的行为切入点是什么？", "options": ["看她和婆婆（夫家女性长辈）的关系是否融洽", "看她是否化妆打扮", "看她是否养宠物", "看她是否健身"], "ans": 0, "exp": "原文：女人直接靠婆媳关系区分。和婆婆关系好的女人、会善待婆婆的女人就是潜在的积极物质驱动的女人。…前提条件是婆婆不能是一个非常负能量的人。", "id": "Q0831"}, {"type": "single", "cat": "scene", "q": "恋爱中遇到一种『回避型』（接受不了对方一点点情感浓度、用冷漠冷暴力回避亲密）的人，从驱动力角度，『回避男』应归因为什么？", "options": ["过度的弱责任感驱动", "过度情感驱动", "过度精神驱动", "过度自我价值感驱动"], "ans": 0, "exp": "原文：回避男是过度的弱责任感驱动。越严重的回避，需要的爱就越多。…就需要女人有很强大的内心去安忍，不搭理他，等他自己回来。", "id": "Q0832"}, {"type": "single", "cat": "money", "q": "在赚钱/显化财富的方式中，“靠才华、靠共情、团结大家显化财富”对应哪一种驱动力？", "options": ["情感驱动", "精神驱动", "责任感驱动", "物质驱动"], "ans": 0, "exp": "原文：靠才华赚钱--情感驱动，靠共情、团结大家显化财富。", "id": "Q0973"}, {"type": "single", "cat": "money", "q": "责任感驱动所显化出来的'事业财富'具有杠杆效应。这个杠杆的大小取决于什么？", "options": ["利他的含量", "本金的大小", "投资年限", "人脉的多少"], "ans": 0, "exp": "原文：靠事业心赚钱--责任感驱动，责任感驱动显化出来的事业的财富是有杠杆的。杠杆取决于利他的含量。", "id": "Q0974"}, {"type": "single", "cat": "money", "q": "在赚钱方式的论述中，'靠财气赚钱，财气就是钱生钱的能力'，这对应哪一种驱动力？", "options": ["物质驱动", "自我价值感驱动", "情感驱动", "精神驱动"], "ans": 0, "exp": "原文：靠财气赚钱--物质驱动，财气就是钱生钱的能力。依靠财气、对金钱的感知力赚钱。", "id": "Q0975"}, {"type": "single", "cat": "money", "q": "在赚钱方式中，“靠身体赚钱——花时间、精力、体力”对应哪一种驱动力？", "options": ["自我价值感驱动", "责任感驱动", "物质驱动", "精神驱动"], "ans": 0, "exp": "原文：靠身体赚钱--自我价值感驱动，花时间、精力、体力", "id": "Q0976"}, {"type": "single", "cat": "money", "q": "哪一类人花钱会'花到点上'，而其余的人花钱大都是乱花的？", "options": ["物质驱动的人", "情感驱动的人", "精神驱动的人", "责任感驱动的人"], "ans": 0, "exp": "原文：只有物质驱动的人花钱会花到点上，其余的人花钱都是乱花的。", "id": "Q0977"}, {"type": "single", "cat": "money", "q": "在'如何正确花钱'的论述中，'情感驱动的人'应该怎么花钱？", "options": ["花钱让自己开心，越花越好", "花钱在学习上", "花钱在事业上", "尽量省钱"], "ans": 0, "exp": "原文：情感驱动的人，要花钱让自己开心，越花越好。男人会花钱在女人身上，女人会花钱在家人身上。", "id": "Q0978"}, {"type": "single", "cat": "money", "q": "在“如何正确花钱”中，精神驱动的人应该怎样花钱？", "options": ["花钱在学习上，越花赚钱的能力越强", "花在吃喝玩乐上", "尽量省钱", "花在事业上"], "ans": 0, "exp": "原文：精神驱动的人，要花钱在学习上，越花赚钱的能力越强。", "id": "Q0979"}, {"type": "single", "cat": "money", "q": "就'如何正确花钱'而言，'责任感驱动的人'应该怎么花钱？", "options": ["花钱在事业上，敢于投资自己的事业", "省钱", "花钱在学习上", "花在女人身上"], "ans": 0, "exp": "原文：责任感驱动的人，要花钱在事业上，敢于投资自己的事业，越花越好。", "id": "Q0980"}, {"type": "single", "cat": "money", "q": "商业模式中最赚钱的是哪一种？", "options": ["提供情绪价值的东西", "提供功能实用性的产品", "不断压缩成本", "快速开店扩张"], "ans": 0, "exp": "原文：所以商业模式中最赚钱的就是提供情绪价值的东西。最能提供情绪价值的东西就是让人感受到生活的美好。", "id": "Q0981"}, {"type": "single", "cat": "money", "q": "在炒股方式上，精神驱动的人应当怎么做？", "options": ["动脑子基于逻辑分析，适合做短线，见好就收，不做价值投资", "做长线慢慢等", "加杠杆搏一把", "跟着所谓的高手学习就行"], "ans": 0, "exp": "原文：精神驱动的人炒股，是动脑子基于逻辑分析的。适合做短线。绝对不能做长线，一定要见好就收，不能留恋。…价值投资不是精神驱动的人玩的好的。", "id": "Q0982"}, {"type": "single", "cat": "money", "q": "'奔着赚钱为目的去炒股'，能赚到钱并在股市这个领域成为大佬的是哪两类人？", "options": ["物质驱动和责任感驱动的人", "情感驱动和精神驱动的人", "自我价值感驱动和精神驱动的人", "只有精神驱动的人"], "ans": 0, "exp": "原文：奔着赚钱为目的去炒股的，只有物质驱动和责任感驱动的人能赚钱，能在这个领域成为大佬。", "id": "Q0983"}, {"type": "single", "cat": "money", "q": "'最承受不了风险'、对金钱敏感度最高的人是谁？", "options": ["自我价值感驱动的人", "物质驱动的人", "精神驱动的人", "情感驱动的人"], "ans": 0, "exp": "原文：最承受不了风险的人是自我价值感驱动的人…并且对于金钱的敏感度是最高的。", "id": "Q0984"}, {"type": "single", "cat": "money", "q": "在做股票投资上，物质驱动的人应当怎么做？", "options": ["只需基于看好一个行业/一支股票本身，不用研究个股、靠对价值的赤子之心感知", "整天埋头研究每一只个股", "频繁短线操作", "满仓加杠杆"], "ans": 0, "exp": "原文：物质驱动的人做股票，只需要基于看好一个行业，一支股票本身…根本就不需要去研究个股，不需要动脑子。只需要有一片赤诚的赤子之心就可以了。", "id": "Q0985"}, {"type": "judge", "cat": "drive", "q": "下面关于天道的说法是否正确：太极之中的阴阳平衡与五行平衡是天道的核心。此说法正确吗？", "ans": true, "exp": "原文：太极之中的阴阳平衡，五行平衡是天道的核心", "id": "Q0210"}, {"type": "judge", "cat": "drive", "q": "判断正误：万事万物的演进存在绝对的起点与终点。", "ans": false, "exp": "原文：循环是天道的韵律，生死轮回，物质转化，能量流动，没有绝对的起点与终点", "id": "Q0211"}, {"type": "judge", "cat": "drive", "q": "判断题：遵循天道的法则，意味着对命运的屈从。此说法是否正确？", "ans": false, "exp": "原文：遵循天道的法则并非是对命运的屈从…而是…顺势而为", "id": "Q0212"}, {"type": "judge", "cat": "love", "q": "关于'爱'与'情'的定义：'爱'是付出的意愿，'情'是付出的需要。请判断下面说法是否正确：'爱'是付出的需要，'情'是付出的意愿。此说法正确吗？", "ans": false, "exp": "原文：爱是付出的意愿，情是付出的需要", "id": "Q0464"}, {"type": "judge", "cat": "love", "q": "判断正误：内心本自具足，是真正付出爱的前提。", "ans": true, "exp": "原文：自己的内心本自具足之后，才能真正的付出爱", "id": "Q0465"}, {"type": "judge", "cat": "scene", "q": "判断题：过度理性对一个人是有益无害的（会使人更合群、更有生命活力）。此说法是否正确？", "ans": false, "exp": "原文：过度的理性，则孤独不合群，会失去生命的活力…一个人的精神力越强大内心则越趋于平净，承担责任的能力就越强", "id": "Q0833"}, {"type": "judge", "cat": "parent", "q": "关于原生家庭与幸福的关系：父母有父母自己的因缘和因果，若把不幸福归结为原生家庭并怨恨父母，会产生极大的精神内耗。请判断下面说法是否正确：'父母的因果会成为子女是否幸福的原因。' 此说法正确吗？", "ans": false, "exp": "原文：父母的因果并不会成为我们子女是否幸福的原因", "id": "Q0641"}, {"type": "judge", "cat": "scene", "q": "判断正误：只要一个人平时容易和别人共情、在情感中感到悲伤、甚至很想要为别人付出，就可被认定是情感驱动的人。", "ans": false, "exp": "原文：我们在情感中感受到悲伤，平时容易和别人共情，甚至很想要为别人付出等等，这些都不代表是情感驱动的表现…不一定或过度…都不是正能量", "id": "Q0834"}, {"type": "judge", "cat": "love", "q": "判断题：情感模式本身具有吉凶好坏之分，应被过度解读。此说法是否正确？", "ans": false, "exp": "原文：每一个人的情感模式本身没有好坏之分，它本身是个中性词，我们不要过度的解读…最终还是要落实到我们自身的善根、道德品质上，厚德才能载物", "id": "Q0466"}, {"type": "judge", "cat": "love", "q": "'婚姻'代表一个人对于归属感的需求，与爱不爱、喜不喜欢都没有关系。请判断下面说法是否正确：'婚姻与爱与喜欢存在密切关系。' 此说法正确吗？", "ans": false, "exp": "原文：婚姻代表一个人对于归属感的需求。和爱不爱、喜不喜欢都没有关系", "id": "Q0467"}, {"type": "judge", "cat": "love", "q": "判断正误：'想不想结婚'与'最后是否会结婚'之间存在必然的因果关系。", "ans": false, "exp": "原文：向不向往婚姻、向不想结婚，和最后会不会结婚是没有因果关系的", "id": "Q0468"}, {"type": "judge", "cat": "love", "q": "判断题：情感（感情）的好坏决定一个人是否应结婚。此说法是否正确？", "ans": false, "exp": "原文：婚姻和情感真的没有因果关系…不能因为感情不好，就不要自己的婚姻…不能因为感情很好，就一定要结婚", "id": "Q0469"}, {"type": "judge", "cat": "drive", "q": "'身弱'或'身强'的本质，是用自身五行能量的多与少去论命；但从阴阳平衡维度看，自身五行能量强弱本身没有吉凶含义，它唯一的含义是影响阴阳平衡的能力。请判断下面说法是否正确：'身弱身强本身有吉凶好坏之分。' 此说法正确吗？", "ans": false, "exp": "原文：身弱或者身强的本质，它是用自身的五行能量的多与少去论命的…但阴阳平衡的维度上…并没有吉凶的含义…身弱的人或者身强的人，本身没有好坏之分", "id": "Q0213"}, {"type": "judge", "cat": "drive", "q": "判断正误：一个人的太极中缺少某一种五行，必定是坏事。", "ans": false, "exp": "原文：如果你没有某一种五行你的太极的阴阳平衡又不需要动用到这种五行，那这就是大吉之相", "id": "Q0214"}, {"type": "single", "cat": "love", "q": "在易经万物类象中，“爱”与“情”这两种能量的相互关系是怎样的？", "ans": 2, "exp": "原文：爱与情相克而成太极…在每个人四柱的大太极中有很多的小太极。爱与情的能量就是其中一对小太极", "options": ["两者完全无关、彼此独立", "两者同源、互相促进而不相克", "两者相克而成太极（爱与情的能量相克）", "两者可互相替代、本质相同"], "id": "Q0470"}, {"type": "single", "cat": "drive", "q": "以'我是水'为例说明了五种驱动力实现阴阳平衡的方式：情感驱动的人用木（我所生）实现平衡。那么，情感驱动的人实现阴阳平衡的方式是利用哪一种五行？", "ans": 1, "exp": "原文：情感驱动的人实现阴阳平衡的方式就是用我所生的五行。我是水，就用木实现平衡", "options": ["生我的五行", "我所生的五行", "克我的五行", "我克的五行"], "id": "Q0215"}, {"type": "single", "cat": "drive", "q": "在五种内在驱动力中，‘精神驱动’（有爱的人）实现阴阳平衡的方式是动应哪一种五行？（以‘我是水’为例，水用金实现平衡）", "ans": 2, "exp": "原文：精神驱动的人实现阴阳平衡的方式就是用生我的五行。我是水，就用金实现平衡", "options": ["我所生的五行", "我所克的五行", "生我的五行", "克我的五行"], "id": "Q0216"}, {"type": "single", "cat": "drive", "q": "在五种内在驱动力中，‘责任感驱动’的人实现阴阳平衡的方式是动应哪一种五行？", "ans": 3, "exp": "原文：责任感驱动的人实现阴阳平衡的方式就是用克我的五行…（喜欢克自己的东西）", "options": ["我所生的五行", "我自身的五行", "生我的五行", "克我的五行（喜欢克自己的东西）"], "id": "Q0217"}, {"type": "single", "cat": "drive", "q": "五种内在驱动力与十神五个类型一一对应。官星（正官、七杀）在十神中对应的是哪一种驱动力？", "ans": 3, "exp": "原文：官星（正官、七杀）=责任感驱动", "options": ["情感驱动", "自我价值感驱动", "精神驱动", "责任感驱动"], "id": "Q0218"}, {"type": "single", "cat": "drive", "q": "在五种内在驱动力与十神的对应中，食伤（食神、伤官）对应的是哪一种驱动力？", "ans": 0, "exp": "原文：食伤（食神、伤官）=情感驱动", "options": ["情感驱动", "自我价值感驱动", "物质驱动", "责任感驱动"], "id": "Q0219"}, {"type": "single", "cat": "love", "q": "在男女情感模式匹配中，情感驱动的女人最匹配哪一种驱动力类型的男人？（这类女人最在意的就是男人的事业心上进心）", "ans": 2, "exp": "原文：情感驱动的女人 VS 责任感的男人…她最在意的是一个男人有没有志向和志气", "options": ["精神驱动的男人", "情感驱动的男人", "责任感驱动的男人", "物质驱动的男人"], "id": "Q0471"}, {"type": "single", "cat": "love", "q": "在男女情感模式匹配中，精神驱动的女人（理智、有爱的女人），需要的是哪一类男人？", "ans": 0, "exp": "原文：精神驱动的女人 VS 情感驱动的男人…精神驱动的女人，需要的是男人的情", "options": ["情感驱动的男人（需要有情欲、占有欲、陪伴、献殷勤）", "自我价值感驱动的男人", "责任感驱动的男人", "物质驱动的男人"], "id": "Q0472"}, {"type": "single", "cat": "love", "q": "在男女情感模式匹配中，物质驱动的女人，通常匹配的是哪一种驱动力类型的男人？", "ans": 1, "exp": "原文：物质驱动的女人 VS 精神驱动的男人…物质驱动的女生，通常情况下，她匹配的就是精神驱动的男人", "options": ["情感驱动的男人", "精神驱动的男人", "责任感驱动的男人", "物质驱动的男人"], "id": "Q0473"}, {"type": "single", "cat": "love", "q": "在传统命理学中，“夫妻宫”是四柱中的哪一位？其吉凶能直接决定一个人想不想结婚。", "ans": 2, "exp": "原文：婚姻是日柱的地支。也就是日支。在传统命理学当中，日支=夫妻宫。夫妻宫的吉凶的作用，直接决定了一个人想不想结婚", "options": ["年柱地支（年支）", "月柱地支（月支）", "日柱地支（日支）", "时柱地支（时支）"], "id": "Q0474"}, {"type": "single", "cat": "parent", "q": "在亲缘关系的定位中，母亲这一角色在易经十神当中是以什么为定位的？", "ans": 2, "exp": "原文：因为母亲的定位，是在易经的十神相当中，以印星为定位（生你的五行）", "options": ["财星", "官星", "印星", "食伤"], "id": "Q0642"}, {"type": "single", "cat": "parent", "q": "在亲缘关系的角色定位中，父亲在以十神定位时以什么为定位，从而使人与其父的关系等价于与财富物质的关系？", "ans": 1, "exp": "原文：对于父亲的定位是以财星为定位…他与父亲的关系可以等价于他与财富物质的关系", "options": ["印星", "财星", "食伤", "比劫"], "id": "Q0643"}, {"type": "single", "cat": "money", "q": "关于“情（情感驱动）”与财富的关系（情=财之源，食伤用来生财）：为什么说情感驱动（有情）的人主富？", "ans": 2, "exp": "原文：情=财之源。为什么情的定位是食伤？食伤是用来生财的…有情的人主富…他是不会以赚钱为目的去做很多事情的。反而他的开心与不开心，是自己生命当中最重要的做事情的驱动力。财之源财心的源头就是人的情", "options": ["因为有情的人擅长以赚钱为目的精打细算", "因为有情的人是为了赚钱而做很多事，赚钱是核心追求", "因为情的定位是食伤，而食伤用来生财，他不以赚钱为目的却自然招感财富", "因为有情的人不需要钱，与财富无关"], "id": "Q0986"}, {"type": "single", "cat": "love", "q": "男人身上的情、爱、钱、责任感、陪伴是五种不同的东西。对“责任感驱动的女人”而言，她最需要男人的哪一样东西？", "ans": 2, "exp": "原文：责任感驱动的女人，需要的是男人的陪伴…对责任感驱动的女人来说，只要这个男人可以稳定的待着存在着，她就满足了", "options": ["男人的情与爱", "男人的钱", "男人的存在（陪伴）", "男人的才华与智慧"], "id": "Q0475"}, {"type": "multi", "cat": "scene", "q": "'真正有情的人（情感驱动、正能量）'具有哪些标志性能力？以下哪些属于有情的人（情感驱动）的标志？", "ans": [0, 1, 2], "exp": "原文：有能够快乐起来的能力。能够感受生活美好的能力。自然而然的共情力。能够让不开心的人不被忽视…能够在聚会当中不忽略任何一个躲在角落里的人。有集体的共情力，让每一个人都受到照顾。有情的人也会生气、也会难过、也会悲伤，但很快就忘了…本质上她不是一个有嗔怨心的人", "options": ["有能够快乐起来的能力、感受生活美好的能力", "自然而然的共情力，能让不开心的人开心起来", "有集体的共情力，在聚会中不忽略任何一个躲在角落里的人，让每一个人都受照顾", "长期沉溺于悲伤、满是嗔怨，需要他人不断安慰"], "id": "Q0835"}, {"type": "multi", "cat": "drive", "q": "针对'不是某种驱动力的人，就不要做相应的事情'这一匹配规则，以下哪些说法是正确的？", "ans": [0, 1, 2], "exp": "原文：不是责任感驱动的人，就不要去创业。不是物质驱动的人，没有对于金钱有很强感知力的人，不要投资。千万不要用钱赚钱。不是精神驱动的人，就不要理性，不要动脑子，不要什么事都爱分析、评判、思考", "options": ["不是责任感驱动的人，就不要去创业", "不是物质驱动的人，对金钱没有很强感知力的人，就不要投资、千万不要用钱赚钱", "不是精神驱动的人，就不要理性、不要动脑子、不要凡事都爱分析评判思考", "不是自我价值感驱动的人，反而更适合以赚钱为目的做一切事情"], "id": "Q0220"}, {"type": "multi", "cat": "drive", "q": "五种内在驱动力与十神五类型一一对应。以下对应关系哪些是正确的？（多选）", "ans": [0, 1, 2], "exp": "原文：食伤（食神、伤官）=情感驱动。比劫（比肩、劫财）=自我价值感驱动。印星（正印、偏印）=精神驱动。官星（正官、七杀）=责任感驱动。财星（正财、偏财）=物质驱动", "options": ["食伤（食神、伤官）=情感驱动", "比劫（比肩、劫财）=自我价值感驱动", "印星（正印、偏印）=精神驱动", "官星（正官、七杀）=物质驱动"], "id": "Q0221"}, {"type": "multi", "cat": "love", "q": "关于“爱的定位”与“情的定位”及二者的区别，以下哪些说法是正确的？", "ans": [0, 1, 2, 3], "exp": "原文：爱是付出的意愿，情是付出的需要。情感上的东西是消耗一个人能量的…精神上的追求是可以增加补充一个人能量的。爱在易经当中的定位是很明确的，是基于理性的、无欲的。爱与情相克而成太极", "options": ["爱是付出的意愿，情是付出的需要", "情（情感的流动）是消耗一个人能量的，而精神上的追求（印星）是可以增加补充能量的", "爱的定位是基于理性的、无欲的", "爱与情在易经万物类象中是相克而成太极的"], "id": "Q0476"}, {"type": "multi", "cat": "money", "q": "不同内在驱动力的人在对待金钱（赚钱、花钱）上的表现各不相同。以下哪些说法是正确的？（多选）", "ans": [0, 1, 2], "exp": "原文：财之源财心的源头就是人的情…情感驱动的人赚朋友的钱是毫无违和感的…自我价值感驱动的人赚朋友的钱，会感觉浑身不舒服…他一旦赚朋友的钱，他就会有愧疚感…物质驱动的人，本质上对于赚钱这件事情没有兴趣…他花钱总是能花在刀刃上，他花钱总能花对地方", "options": ["情感驱动的人不想赚钱，但能通过情感生发出财气、招感金钱，赚朋友的钱毫无违和感", "自我价值感驱动的人喜欢赚钱，但赚朋友的钱会有愧疚感、赚不了朋友的钱", "物质驱动的人对赚钱本身没有兴趣，但花钱总能花对地方、让生活更美好", "自我价值感驱动的人以赚钱为目的，赚朋友的钱毫无愧疚"], "id": "Q0987"}, {"type": "short", "cat": "love", "q": "在驱动力理论中，“婚姻”的定义是什么？婚姻与一个人对伴侣的爱与喜欢有无直接关系？请完整给出论断。", "ans": "婚姻代表一个人对于归属感的需求，和爱不爱、喜不喜欢都没有关系。", "exp": "原文：婚姻代表一个人对于归属感的需求。和爱不爱、喜不喜欢都没有关系。", "id": "Q0477"}, {"type": "short", "cat": "love", "q": "在易经万物类象中，“爱”与“情”分别以什么为定位？二者之间是什么关系？", "ans": "情（情感驱动）是以自身五行所生的食伤为定位；爱（有爱的人）是以生我的印星为定位，即精神层面。爱与情的能量在万物类象中相克而成太极。", "exp": "原文：情的定位，就是自身五行所生的东西，食伤的吉凶…在易经当中是以一种相生的关系存在的。你是什么，生你的东西的能量就是爱的能量…我们把它称作印星…爱与情相克而成太极", "id": "Q0478"}, {"type": "short", "cat": "drive", "q": "为什么说'修行人的命是算不准的'？请用这套理论的观点加以说明。", "ans": "因为修行人能够控制或驾驭自己的妄念，能够止息妄念、减少内耗，能够让自己不要去动应他不需要的五行能量，因此其命运无法被推算。", "exp": "原文：为什么说修行人的命是算不准的，因为他能够控制，或者是驾驭自己的妄念，他能够止息自己的妄念，他能够减少自己的内耗，他能够让自己不要去动应他不需要的五行能量", "id": "Q0222"}, {"type": "short", "cat": "parent", "q": "在处理与父母的关系时，我们要感恩、要宽恕与原谅的，不是你父母对你好不好，那究竟是什么呢？这一点与传统'百善孝为先'又是如何联系起来的？", "ans": "我们要感恩的、要宽恕与原谅的不是父母对我们好与不好，而是父母与我们之间这一世作为子女与父母的因缘——因缘本身给了我们这一世来到世界上的机会；学会感恩父母会极大地释放自己的生命能量，这是中华文明百善孝为先的原因。", "exp": "原文：要感恩的、要宽恕与原谅的，不是父母对我们好与不好，我们要感恩的是父母与我们之间，这一世作为子女父母之间的因缘…当你能够做到感恩父母，你会极大地释放自己的生命能量，这是中华文明百善孝为先的原因", "id": "Q0644"}, {"type": "short", "cat": "love", "q": "情感驱动的女人最需要男人的什么？她最在意男人的什么品质？这一需求对应的又是哪一种内在驱动力？", "ans": "情感驱动的女人最需要男人的事业心上进心，最在意男人有没有志向和志气；这一需求对应的是男人的责任感驱动。", "exp": "原文：情感驱动的女人，需要的是男人的事业心上进心。她最在意的是一个男人有没有志向和志气…这就是以情感驱动的女人，所需要的就是责任感驱动的男人", "id": "Q0479"}, {"type": "short", "cat": "love", "q": "一个人'想不想结婚'与'最后会不会结婚'，以及'婚姻'与'情感'之间，分别是怎样的关系？这样理解有什么意义？", "ans": "想不想结婚与最后会不会结婚没有因果关系，都是缘分决定的，缘分在因果层面都可找到原因；婚姻与情感也没有因果关系，婚姻本身与情感是独立定位，不能因感情不好就不要婚姻，也不能因感情很好就一定结婚。明白这一点可减少内耗、不因世俗观念影响自己。", "exp": "原文：向不向往婚姻、向不想结婚，和最后会不会结婚是没有因果关系的…都是缘分决定的…婚姻和情感真的没有因果关系…不能因为感情不好，就不要自己的婚姻…不能因为感情很好，就一定要结婚。不要有这种想法，就能减少很多内耗", "id": "Q0480"}, {"type": "judge", "cat": "drive", "q": "判断题：在五行《八字五行驱动力》理论中，核心驱动力就是命理学中的“用神”，它等于自己会动的念头，动念决定能量大小。", "ans": true, "exp": "原文：核心驱动力，就是实现自身内在五行平衡，最核心的动应，即命理学中的用神。核心驱动力也等于自身会动的念头，动的念决定了自身的能量。", "id": "Q0223"}, {"type": "judge", "cat": "drive", "q": "判断题：按五种驱动力理论，驱动力决定的是性格，而和一个人会获得怎样的世俗成就不构成因果关系——任何驱动力的人都能做生意，只是方式不同。", "ans": true, "exp": "原文：驱动力决定的是性格，和一个人会获得怎么样的世俗成就没有因果关系。比如任何一种驱动力的人都能做生意，只是方式不同。", "id": "Q0224"}, {"type": "judge", "cat": "drive", "q": "判断题：在情感驱动中，“自己开心最重要”且不需用头脑分辨对错，开不开心应放在首位；若硬用智慧（精神）去驱动自己，反而很难有正能量。", "ans": true, "exp": "原文：情感驱动的特点：自己开心最重要，尊重自己的感受。…自己开心最重要。如果硬要用智慧（精神）去驱动，那就很难有正能量。", "id": "Q0225"}, {"type": "single", "cat": "drive", "q": "选择题：关于“驱动力强弱与敏感度”的关系，正确的表述是？", "ans": 1, "exp": "原文：过度的弱驱动=敏感度，过度的驱动力，越弱越敏感。越强越粗糙。敏感就是感知波动的变化非常敏感，一有点风吹草动就有感觉，感知越敏感，痛苦就会越多。", "options": ["驱动力越强，人越敏感、痛苦越多", "过度的弱驱动力：越弱越敏感、越强越粗糙（越敏感痛苦越多）", "敏感度由是否物质驱动决定，与强弱无关", "任何驱动的敏感度都恒定不变"], "id": "Q0226"}, {"type": "single", "cat": "drive", "q": "选择题：一个人渴望智慧、好学、以印为用，却发现自己很难真正高度专注，注意力常分散、无法深度思考、一思考就困、情绪也不算稳定。这最典型地体现为？", "ans": 1, "exp": "原文：大多数精神驱动的人，正是因为印星的能量不够，才会成为精神驱动。…缺乏专注力，思维比较分散，没有办法深度思考，一思考就困，就是精神力不足。没有稳定的情绪也是精神力不足的表现。", "options": ["情感驱动过旺", "精神力不足（印星能量不够）", "责任感驱动过旺", "自我价值感驱动过旺"], "id": "Q0227"}, {"type": "judge", "cat": "drive", "q": "判断题：精神驱动的人最好的状态是能拥有平静；而情感驱动的人需要的是热闹、烟火气和开心，不是平静，因此情感驱动的人不应盲目照搬精神驱动的修行方式。", "ans": true, "exp": "原文：能拥有平静，就是精神驱动力的人最好的状态。…有精神追求的人自然就会对平静有需求…但情感驱动不是，要的反而是热闹，人间烟火，所以情感驱动不要学精神驱动乱修行。", "id": "Q0228"}, {"type": "single", "cat": "scene", "q": "选择题：下列哪种外在能力/行为最能体现“精神驱动”而非情感驱动的定位？", "ans": 1, "exp": "原文：给伴侣提供哄人、夸人、投其所好，给男人提供情绪价值，这是精神驱动。", "options": ["爱吃、会吃、有口福", "稳定地给伴侣提供哄人、夸人、投其所好的情绪价值", "特别喜欢和喜欢的人讲废话、分享日常", "特别擅长人情世故"], "id": "Q0836"}, {"type": "judge", "cat": "drive", "q": "判断题：一个人若只有精神驱动而缺乏责任感驱动，就不会有愿力，因为他不想做事，只想学智慧求内心清静，成为“单纯的修行人”。", "ans": true, "exp": "原文：精神驱动但是没有责任感驱动，那就不会有愿力，因为他不做事。这就是单纯的修行人，他只想学习智慧，只想内心清静，没有想做任何的事情。", "id": "Q0229"}, {"type": "single", "cat": "drive", "q": "选择题：面对一个深陷悲伤、执着痛苦的人，按“精神克制情感”的原理，最有效的帮助方式是？", "ans": 1, "exp": "原文：发泄情绪并不是稳定一个人情感的方式…共情是没有办法解决情感问题的…只有通过精神层面的力量才能帮助人解决痛苦…爱和慈悲就是只倾听，不共情。用无情的态度对待一个人所有的悲伤，然后用几句简单的话让他看清因果层面的障碍…向他展示内心的平静。", "options": ["让对方尽情发泄情绪、尽力共情对方", "只倾听不共情，用无情的态度处之，再用几句简单的话点醒他看清背后的因果障碍，并向他展示内心的平静", "不断给物质或满足其诉求", "严厉命令他立刻想通振作"], "id": "Q0230"}, {"type": "judge", "cat": "drive", "q": "判断题：慈悲心的定位（本质定义）是精神驱动，但这并不表示情感驱动的人不慈悲，只是两者表现形式不一样。", "ans": true, "exp": "原文：慈悲心的定位是精神驱动。但不是说情感驱动的人不慈悲，可能是表现形式不一样。", "id": "Q0231"}, {"type": "single", "cat": "scene", "q": "选择题：某男生特别喜欢在朋友圈高调晒女友、过度爱秀恩爱，按五行驱动力理论推断，他属于哪种驱动力？", "ans": 1, "exp": "原文：特别喜欢在朋友圈晒女朋友的男人是情感驱动的。甚至有点过度情感驱动。…这样的人一定不是责任感驱动。特别爱秀的人做不了事业，做事一定不靠谱。", "options": ["责任感驱动", "情感驱动（甚至过度情感驱动）", "精神驱动", "自我价值感驱动"], "id": "Q0837"}, {"type": "single", "cat": "scene", "q": "选择题：一个人在择业时“单纯因为兴趣选择工作，以自己的开心为发心”，这最符合哪种驱动力？", "ans": 0, "exp": "原文：因为兴趣选择工作，就是情感驱动的人会这样。", "options": ["情感驱动", "精神驱动", "责任感驱动", "物质驱动"], "id": "Q0838"}, {"type": "single", "cat": "scene", "q": "选择题：某人写诗、搞艺术、做编剧创作，其灵感据理论必然来自情感而非精神世界；且缺乏这种驱动去学艺术会非常痛苦。这种艺术创作特质对应的是哪种驱动力？", "ans": 1, "exp": "原文：写诗的本质是才华，才情，创造，艺术，情感，一定是情感驱动的人。创作者的灵感一定不来自精神世界，而是情感…没有情感驱动力的人去学艺术，都会学的非常的蹉跎和痛苦，不是搞艺术是被艺术搞。", "options": ["精神驱动", "情感驱动", "责任感驱动", "物质驱动"], "id": "Q0839"}, {"type": "judge", "cat": "scene", "q": "判断题：从行为反推，情感驱动的女生一旦“动脑、理性、分析”自己的付出要不要回报，就说明她开始得不到男人的情了。", "ans": true, "exp": "原文：情感驱动的女生，一旦动脑、理性、分析，就意味着得不到男人的情。本质上来说付出不可能不求回报，当自己开始分析自己付出需不需要回报啊，状态转变啦等等的时候，就意味着得不到男人的情。", "id": "Q0840"}, {"type": "single", "cat": "scene", "q": "选择题：某女生在自己喜欢的人面前话特别多、分享欲强、爱讲废话讲日常，但别人多说一句废话她都很厌恶。这反推她是哪种驱动力？", "ans": 1, "exp": "原文：情感驱动的人一定有分享欲、表达欲。情越多分享欲越强。…有情的女人只跟自己喜欢的人话多，男人但凡多一句废话都感到很厌恶。", "options": ["精神驱动", "情感驱动", "责任感驱动", "物质驱动"], "id": "Q0841"}, {"type": "single", "cat": "scene", "q": "选择题：一个女生天生“社牛”、不怕陌生人、共情能力强、能瞬间进入高层次社交并无目的性地把事情做成，这最能体现何种驱动的优势？", "ans": 1, "exp": "原文：情感驱动的人从来不怕陌生人，不怕人多，共情能力越强的人越不怕陌生人。没有人与人之间的距离感…共情能力强的女人可以做好生意，到哪儿都能处成朋友…她毫无目的性的就能把事情做成。", "options": ["精神驱动的智慧博弈", "情感驱动的共情能力", "责任感驱动的目标规划", "自我价值感驱动"], "id": "Q0842"}, {"type": "single", "cat": "scene", "q": "选择题：某人谁都能处成朋友、从不筛选对象、不挑人也不嫌弃人，因此常承接过多负能量——这种交友特征属于哪种驱动力？", "ans": 1, "exp": "原文：很喜欢交朋友，但是对交朋友的对象，共情的对象，没有筛选，导致有时候承接了太多负能量。这是情感驱动的人的交友的特征。…情感驱动的人筛选不了，不挑人，也不嫌弃人…筛选是精神驱动的人做的事。", "options": ["精神驱动", "情感驱动", "责任感驱动", "物质驱动"], "id": "Q0843"}, {"type": "single", "cat": "scene", "q": "选择题：一个女生被冤枉后一定要找你掰扯清楚、忍不了一点点委屈，越被误解越难受。按理论这反推她？", "ans": 1, "exp": "原文：越有情越不能被冤枉。别人一旦误解比什么都难受。她一定会去跟你掰扯。…越有情越忍受不了。因为被冤枉相当于她对自我的认知和评价有关…对情感驱动的人来说，情感受到了障碍是最严重的事。", "options": ["她越无情冷漠", "她越有情、感情越深", "她越责任感强", "她越物质化"], "id": "Q0844"}, {"type": "single", "cat": "scene", "q": "选择题：某个女生特别在意别人对自己的评价、在意别人喜不喜欢自己，并因此容易产生讨好行为和焦虑，这被归为哪种驱动力的表现？", "ans": 1, "exp": "原文：在意别人的评价是情感驱动的表现。…一旦焦虑，自己就会害怕，自然就开心不起来了。讨好型人格也是这么产生的…就会很在意别人喜不喜欢自己，对你的情感有没有善意。就会在意别人的评价。", "options": ["责任感驱动", "情感驱动", "精神驱动", "物质驱动"], "id": "Q0845"}, {"type": "judge", "cat": "scene", "q": "判断题：从行为反推，一个人若在“和别人高度共情、一起泪流满面”的状态下，通常大概率不是情感驱动。", "ans": true, "exp": "原文：高度共情负面情绪不是情感驱动。如果是在和别人高度共情的状态下泪流满面，大概率不是情感驱动。", "id": "Q0846"}, {"type": "single", "cat": "scene", "q": "选择题：某女生在情感中理性、会权衡利弊，用各种策略让男人对她更有情欲、更主动，擅长拿捏男人的情绪，这反映她的核心驱动力是？", "ans": 1, "exp": "原文：会拿捏男人的一定是精神驱动的女生。理性用在情感上的时候，就很会拿捏男人的情绪。她需要男人的情作为自己的精神食粮。", "options": ["情感驱动", "精神驱动", "物质驱动", "责任感驱动"], "id": "Q0847"}, {"type": "judge", "cat": "scene", "q": "判断题：按理论，能游走于多段关系的“海后”女生必定是精神驱动，且女海后一定有慈悲心；而专门的男海王则是没有慈悲心的好色者。", "ans": true, "exp": "原文：海后一定是精神驱动的女生。成为海后不是基于自己的欲望，我想要。没有自己的情欲，而是需要别人对她有情欲。…女海后一定有慈悲心。男海王是没有慈悲心的。", "id": "Q0848"}, {"type": "single", "cat": "scene", "q": "选择题：一个人拥有“平静的愤怒”——能轻松进入愤怒又快速平静、悄无声息让对方瞬间知道边界而产生敬畏尊重。这种震慑力的来源是？", "ans": 1, "exp": "原文：能够轻松的进入愤怒的状态，快速的回复平静，在平静当中愤怒，这才是真正有力量的。…真正能够震慑别人的是平静的愤怒…这种才是会让人产生敬畏跟尊重的东西。平静的愤怒是来自于强大的精神力。有足够的心量才能做得到。", "options": ["情欲与占有欲", "强大的精神力与心量", "金钱与地位", "责任感"], "id": "Q0849"}, {"type": "single", "cat": "scene", "q": "选择题：一个女生只喜欢“不理自己”的男人，即使想玩也只会花钱请一大堆女生陪玩，绝不会去花钱点男人/消费男人来哄自己开心。这最说明她？", "ans": 1, "exp": "原文：只喜欢不理自己的男人的女生，一定不会去花钱点男人，消费男人，哄自己开心。…花钱点男人本质上是想得到男人的情，想得到男人对自己的控制欲占有欲。", "options": ["她是标准物质驱动", "她只喜欢不理自己的人、不需要男人的情，因此绝不会花钱消费男人", "她是标准精神驱动", "她责任感极强"], "id": "Q0850"}, {"type": "judge", "cat": "scene", "q": "判断题：情感驱动的女生通常不吸渣、最不容易被渣；相反，最容易遇渣的是精神驱动的女生。", "ans": true, "exp": "原文：情感驱动的女生通常是不吸渣的，最不容易被渣的是情感驱动的女生。…如果吸渣了，就说明你有非常深重的情劫要过。…最容易被渣的是精神驱动的女生。", "id": "Q0851"}, {"type": "single", "cat": "scene", "q": "选择题：一个女生擅用“妩媚、魅惑、诱惑、撩拨”来勾起男人的喜欢（向外不主动动手、偏“闷骚”），按理论她的核心驱动力是？", "ans": 1, "exp": "原文：妩媚、魅惑、诱惑、撩拨的对象是男人的情。要的是男人喜欢她。…骚是用来形容精神驱动女人的。好色是欲望。骚是诱惑。好色是向外的，骚是向内的。闷骚。有爱的女人一点都不好色。…有爱的女人从来不对男人主动动手。", "options": ["情感驱动", "精神驱动（有爱的女人）", "物质驱动", "责任感驱动"], "id": "Q0852"}, {"type": "judge", "cat": "scene", "q": "判断题：情感驱动的女生很难拒绝朋友（尤其以女生为主的朋友），同时她在关系中不给男人提供情绪价值。", "ans": true, "exp": "原文：情感驱动的女生拒绝不了朋友，尤其是女生为主的朋友。不给男人提供情绪价值。", "id": "Q0853"}, {"type": "judge", "cat": "scene", "q": "判断题：对人情世故毫无兴趣、不擅长人际往来的人，不会是情感驱动；情感驱动的人最擅长人情世故。", "ans": true, "exp": "原文：对人情世故没有兴趣的人不会是情感驱动。情感驱动最擅长人情世故。", "id": "Q0854"}, {"type": "judge", "cat": "love", "q": "判断题：情感表达上，有情的女人对伴侣应说“我很喜欢你”而永远不说“我爱你”；说“爱”会在向男人索取情、日后爆发矛盾并给他压迫感。", "ans": true, "exp": "原文：有情的女人表达自己的情感，不是说我爱你。应该说的是，我很喜欢你。永远不要用爱这个字。…当有情的女人说爱的时候，业障就来了。一定会在日后爆发冲突。…当你说起我爱你的时候，会让男人有压迫感，这就会让男人感知到你在索取情了。", "id": "Q0481"}, {"type": "single", "cat": "love", "q": "选择题：伴侣之间感情趋于平淡、如同邻居兄弟如白开水一般，按理论推动/挽救这段感情的核心责任在于？", "ans": 1, "exp": "原文：为什么会和自己的伴侣成为邻居成为兄弟，感情像白开水一样，责任在有情的一方。…谁有情谁主动。…有爱的人一定是在等待有情的一方推动，所以是被动的。先有情后有爱。", "options": ["有爱的一方", "有情的一方", "物质较丰富的一方", "责任感较强的一方"], "id": "Q0482"}, {"type": "judge", "cat": "love", "q": "判断题：伴侣关系中“先有情后有爱”——有情的一方是推动情感发展的关键，有爱的人注定在等待有情的一方推动，因此是被动的。", "ans": true, "exp": "原文：先有情后有爱。…谁有情谁主动。有爱的人一定是在等待有情的一方推动，所以是被动的。", "id": "Q0483"}, {"type": "single", "cat": "love", "q": "选择题：按驱动理论，“情感驱动的女生”遇到“回避型男人（男回避）”，两人缘分的通常结论是？", "ans": 1, "exp": "原文：情感驱动女生遇上回避男，基本上无解，除非是情很少的情驱女，那也许可以有缘分。但是很难进一步关系，越近对方越躲。", "options": ["越靠近感情越深", "基本无解，很难进一步发展，越近对方越躲（除非是情很少的情驱女）", "一定会修成正果", "只能做事业上的搭档"], "id": "Q0484"}, {"type": "single", "cat": "love", "q": "选择题：关于“女人撒娇”与“男人冷漠”的关系，正确的定律是？", "ans": 0, "exp": "原文：女人能撒娇，男人100%不会冷漠。女人但凡用脑子，就是撒不了娇的。", "options": ["女人能撒娇，男人100%不会冷漠；女人但凡动脑子就撒不了娇", "女人越撒娇，男人越冷漠", "两者完全无关", "撒娇等同于冷漠"], "id": "Q0485"}, {"type": "judge", "cat": "love", "q": "判断题：当女人内心自我消解嗔恨心时，远方男人的冷漠会自然消失；两者本质是共业招感（量子纠缠）的关系。", "ans": true, "exp": "原文：所以当女人自我消解嗔恨心的时候，远距离的男人的冷漠就自然消失了，这可以说是量子纠缠，但本质是共业招感。", "id": "Q0486"}, {"type": "single", "cat": "love", "q": "选择题：按伴侣匹配理论，“精神驱动的女人”最适合的伴侣类型是？", "ans": 1, "exp": "原文：精神驱动的女人，找的伴侣就是情感驱动的男人。她需要男人的情，需要男人对她有控制欲、占有欲、情欲。感受不到男人的情就会很痛苦。", "options": ["精神驱动的男人", "情感驱动的男人", "责任感驱动的男人", "物质驱动的男人"], "id": "Q0487"}, {"type": "judge", "cat": "love", "q": "判断题：情感驱动的女生分手后很难走出来，即使对方是个糟糕的男人，因为她要的是自己心中那一份美好的感受。", "ans": true, "exp": "原文：哪怕分手之后也会怀念以前那种美好的感受，因为本质上情感驱动的女生要的是自己本身内心中的那一份情感…分手后很难走出来是因为当时那种美好的感受也是真实的，即使那是一个很糟糕的男人。", "id": "Q0488"}, {"type": "single", "cat": "love", "q": "选择题：一个情感驱动的男人突然提出分手，按理论十有八九原因是？", "ans": 1, "exp": "原文：情感驱动的男人突然说分手，十有八九不是因为出轨，情感驱动的男人不出轨。", "options": ["他出轨了", "并非因为出轨，情感驱动的男人基本不出轨", "他经济破产了", "他变心变得理性客观了"], "id": "Q0489"}, {"type": "judge", "cat": "love", "q": "判断题：情越重的（有情的）女生越专一，即使伴侣待她不好或出轨，她自己也很难出轨；但遇到特定类型的男人也可能引发她出轨。", "ans": true, "exp": "原文：情越重的女生，越专一，即使伴侣人不好/对她不好/出轨，自己也很难出轨。…当情重的女生遇到一种特定类型的男人的时候，会引发她出轨。", "id": "Q0490"}, {"type": "single", "cat": "parent", "q": "选择题：按五行万物类象，子女对母亲“陪伴”的需求，对应哪种驱动力？", "ans": 0, "exp": "原文：对于母亲的陪伴有需求的人，是精神驱动的人。", "options": ["精神驱动", "情感驱动", "自我价值感驱动", "责任感驱动"], "id": "Q0645"}, {"type": "single", "cat": "parent", "q": "选择题：按五行万物类象，子女“需要母亲的陪伴与共情”（对母亲的情有需求）对应哪种驱动力？", "ans": 1, "exp": "原文：对于母亲的情有需求的人，是自我价值感驱动的人。…对母亲的共情有需求的人，如果你需要母亲的共情…", "options": ["精神驱动", "自我价值感驱动", "责任感驱动", "物质驱动"], "id": "Q0646"}, {"type": "single", "cat": "parent", "q": "选择题：按五行万物类象，子女“对母亲的爱有需求、需要母亲智慧”对应哪种驱动力？", "ans": 0, "exp": "原文：对于母亲的爱有需求的人，是责任感驱动的人。…所以什么样的人非常需要母亲的智慧，责任感驱动的人。", "options": ["责任感驱动", "情感驱动", "物质驱动", "自我价值感驱动"], "id": "Q0647"}, {"type": "judge", "cat": "parent", "q": "判断题：怨恨母亲（讨厌其印星定位）的人无法开智慧；对父亲有怨恨的人无法亲近财富——他可能有赚钱能力，却永远没有用钱的能力。", "ans": true, "exp": "原文：对于母亲有怨恨的人，都无法开智慧，对于父亲有怨恨的人，都无法亲近财富。他有可能有赚钱的能力，但他永远无法有用钱的能力。", "id": "Q0648"}, {"type": "single", "cat": "parent", "q": "选择题：亲子反推——一位母亲总给孩子理性建议、期待孩子有责任感、告诉孩子“应该怎么做才对”、希望孩子去创业做事业、主动担责。这通常体现她是哪种驱动？", "ans": 1, "exp": "原文：精神驱动的母亲，在孩子身上投射的能量是责任感，她会期待孩子有责任感驱动。总是会给孩子理性的建议，希望孩子主动去承担责任。告诉孩子应该怎么做才是对的…会希望孩子去创业，去做事情，希望孩子能承担责任。", "options": ["情感驱动", "精神驱动", "责任感驱动", "物质驱动"], "id": "Q0649"}, {"type": "single", "cat": "parent", "q": "选择题：亲子反推——一位母亲最享受孩子“为她付出物质”（无论基于情还是爱），并由此获得巨大满足感。她是哪种驱动？", "ans": 2, "exp": "原文：责任感驱动的母亲会向孩子投射的是物质驱动。最享受孩子对她付出物质。无论是基于情或者爱对她付出物质，能给她带来很大的满足感。", "options": ["情感驱动", "责任感驱动", "物质驱动", "精神驱动"], "id": "Q0650"}, {"type": "single", "cat": "parent", "q": "选择题：亲子反推——一位母亲天生爱黏孩子、强烈需要孩子的陪伴、和孩子待在一起如同充电（即使述情障碍、情很少也对陪伴有强烈需求）。她是哪种驱动？", "ans": 1, "exp": "原文：情感驱动的母亲在孩子身上找的东西是陪伴。…哪怕是述情障碍的情感驱动，只是情很少，但是仍然会对孩子的陪伴有强烈的需求。天生爱黏孩子，和孩子待在一起是在充电。", "options": ["精神驱动", "情感驱动", "责任感驱动", "自我价值感驱动"], "id": "Q0651"}, {"type": "single", "cat": "parent", "q": "选择题：亲子反推——一位母亲最喜欢孩子的“情”与“玩乐心”、非常愿意陪孩子玩。她是哪种驱动？", "ans": 1, "exp": "原文：物质驱动的母亲，最喜欢的是孩子的情。希望孩子有玩乐心，非常愿意陪孩子玩。", "options": ["情感驱动", "物质驱动", "精神驱动", "责任感驱动"], "id": "Q0652"}, {"type": "judge", "cat": "parent", "q": "判断题：责任感驱动的男人“成家立业”有先后顺序，对他而言“生孩子”就是开运的标志；孩子会给他强劲的事业上进心和动力（类似女人情的作用，甚至比女人的情更重要）。", "ans": true, "exp": "原文：对责任感驱动的男人来说，成家立业是有先后顺序的，生孩子就是开运的标志。…对于有孩子的男人来说，就有了强劲的事业的上进心和动力，就像女人的情一样…事能不能沉淀下来变成事业，孩子的存在比女人的情更重要。", "id": "Q0653"}, {"type": "judge", "cat": "parent", "q": "判断题：男性若喜欢亲近所有孩子（愿意陪所有小朋友玩），通常就不会特别亲近/偏心自家孩子；而不喜欢孩子的男人反而特别偏疼自家孩子。另一方面女人若喜欢自家小孩，则一定也会喜欢所有的小孩。", "ans": true, "exp": "原文：男人有可能很不喜欢小朋友，不喜欢跟小孩子玩，但是他会对自己的孩子会有很大的偏心，喜欢自己的小孩。如果男人喜欢所有孩子，那他就不会特别喜欢自己的孩子。…但女人如果喜欢自己的小孩，她一定是喜欢所有的小孩。", "id": "Q0654"}, {"type": "judge", "cat": "parent", "q": "判断题：孩子对母亲的爱、焦虑与担忧的承受能力，就是这孩子承担责任的能力；责任感驱动的孩子即便从小浸泡在父亲混乱情绪与母亲严重焦虑中，仍会很有责任感与目标感。", "ans": true, "exp": "原文：孩子对于母亲的爱、焦虑担忧的承受能力，就是这个孩子承担责任的能力。…除非这个孩子本身是责任感驱动的人，就算从小到大都浸泡在父亲混乱的情绪和母亲严重的焦虑中，仍然会让孩子很有责任感目标感。", "id": "Q0655"}, {"type": "judge", "cat": "parent", "q": "判断题：父母过度驱动力、负能量若能被孩子吸收并转化为自身积极能量来源，是亲子关系中极好的善缘（报恩）；这种吸收只可能在亲子之间投影，伴侣关系中并不存在。", "ans": true, "exp": "原文：父母的过度驱动力、负能量能被孩子吸收转化成孩子自身积极的能量来源，这是亲子关系中非常好的善缘，就是来报恩的…伴侣关系中是没有的。伴侣关系吸收不了这种负能量，只有在生育的子女身上有可能可以吸收你的负能量。", "id": "Q0656"}, {"type": "judge", "cat": "money", "q": "判断题：情感驱动的人通常不会有“想搞钱”这个念头，而没有这个念头的人反而容易有钱。", "ans": true, "exp": "原文：情感驱动的人不会有想搞钱这个念头，没有这个念头的人就能有钱。这也是功课。", "id": "Q0988"}, {"type": "judge", "cat": "money", "q": "判断题：情是物质的源头（食伤生财），真正有情的人通常也是物质驱动的人，且不容易穷；稍微有点善根（阴阳平衡）就很难变穷。", "ans": true, "exp": "原文：有情的人通常就是物质驱动的人，因为情是物质的源头。食伤生财，所以真正有情的人不会穷。稍微有点善根（阴阳平衡）就不可能穷，很难变穷。", "id": "Q0989"}, {"type": "single", "cat": "money", "q": "选择题：一个女生花伴侣的钱会惭愧、纠结、不开心，对伴侣付出“0索取”；即便再有钱有地位的男人疯狂砸钱也讨不得她欢心。这最能反推她是？", "ans": 1, "exp": "原文：有情的女人花了男人的钱，会感到惭愧，会感到纠结，不开心。…男人面对非常喜欢但是对自己0索取的女人会疯狂想砸钱。…有钱的男人在有情的女人眼中啥也不是，再付出多，看都不看一眼。", "options": ["物质驱动的女人", "有情的女人", "精神驱动的女人", "自我价值感驱动的女人"], "id": "Q0990"}, {"type": "judge", "cat": "money", "q": "判断题：富二代乱创业、难以守富的根本原因，是他以“自我价值感”驱动（靠赚钱证明自己）而非责任感驱动——他只做赚钱的事，却不会做事业，也做不了投资。", "ans": true, "exp": "原文：自我价值感的孩子就是靠赚钱来获得自我价值感的…富二代为了实现自己的自我价值感，他们会做的事就是乱创业。本质上他不是责任感驱动的人，但他总是以赚钱为目的…他不会做事业，只能做赚钱的事，而且还做不了投资。", "id": "Q0991"}, {"type": "judge", "cat": "money", "q": "判断题：物质驱动和情感驱动的人都没有财富焦虑（哪怕花掉90%的钱买东西也不焦虑），这与精神驱动的人形成巨大反差。", "ans": true, "exp": "原文：物质驱动情感驱动的人都没有财富焦虑。即使花了90%的钱去买一个东西，也不焦虑。和精神驱动的人有巨大反差。", "id": "Q0992"}, {"type": "judge", "cat": "money", "q": "判断题：金钱归属情境下，情感驱动的女生通常“用不了爸爸给的钱”，更易受到来自母亲（而非父亲）的金钱恩泽。", "ans": true, "exp": "原文：情感驱动的女生用不了爸爸给的钱，情感驱动的人更多是会受到妈妈的恩泽，而不是父亲。特别是金钱方面。", "id": "Q0993"}, {"type": "multi", "cat": "scene", "q": "多选题：以下哪些属于“情感驱动”者的典型观人特征？", "ans": [0, 2, 3], "exp": "原文：有情的女人爱迟到、拖延。…吵架不翻旧账，吵的就是当下的态度不好。以前的事都不记得了。…越有情越不能被冤枉。必定会去跟你掰扯。", "options": ["爱迟到、拖延", "做事极端重规划与严守时", "吵架从不翻旧账、只吵当下态度", "被冤枉一定掰扯清楚、忍不了一点委屈", "擅长用理性拿捏男人情绪"], "id": "Q0855"}, {"type": "multi", "cat": "parent", "q": "多选题：按五行万物类象，下面关于子女与父母需求对应的说法，“正确”的有？", "ans": [0, 1, 2], "exp": "原文：对于母亲的陪伴有需求的人，是精神驱动的人。对于母亲的情有需求的人，是自我价值感驱动的人。对于母亲的爱有需求的人，是责任感驱动的人。…如果你是物质驱动的人，就会喜欢父亲的陪伴。", "options": ["对母亲的“陪伴”有需求→精神驱动", "对母亲的“情/共情”有需求→自我价值感驱动", "对母亲的“爱”有需求→责任感驱动", "对母亲的“陪伴”有需求→物质驱动", "对父亲的“陪伴”有需求→自我价值感驱动"], "id": "Q0657"}, {"type": "multi", "cat": "love", "q": "多选题：关于“有情的女人”，下列说法“正确”的有？", "ans": [0, 1, 2, 3], "exp": "原文：真正有情的女人是害怕冲突的，吵架的时候骂人的话都说不出口…情感驱动的女生通常是不吸渣的…经常对于表达自己的情感非常的犹豫，这就是述情障碍…有情的女人表达自己的情感…应该说的是，我很喜欢你。…会拿捏男人的一定是精神驱动的女生。", "options": ["害怕冲突，吵架时骂人的话说不出口", "通常最不吸渣、最不容易被渣", "有述情障碍——对表达自己的情感常常非常犹豫", "对伴侣应说“我很喜欢你”而非“我爱你”", "擅长拿捏男人的情绪、善于权衡"], "id": "Q0491"}, {"type": "short", "cat": "scene", "q": "填空题：一个女生越（　　　），就越不能被冤枉，被冤枉比什么都难受、忍不了一点点委屈。", "ans": "有情", "exp": "原文：越有情越不能被冤枉。别人一旦误解比什么都难受。她一定会去跟你掰扯。", "id": "Q0856"}, {"type": "short", "cat": "love", "q": "填空题：有情的女人表达情感时应说“我很（　　　）你”，而永远不说“我爱你”。", "ans": "喜欢", "exp": "原文：有情的女人表达自己的情感，不是说我爱你。应该说的是，我很喜欢你。永远不要用爱这个字。", "id": "Q0492"}, {"type": "short", "cat": "drive", "q": "填空题：五种驱动力当中，“（　　　）”是人最大的靠山、属于最高的驱动力。", "ans": "精神", "exp": "原文：精神驱动的人是最容易有靠山的，因为精神就是人最大的靠山。精神力强大的人是永远不会被击败的。…精神驱动力是最高的驱动力。", "id": "Q0232"}, {"type": "judge", "cat": "love", "q": "在感情中，一个人若属于高度回避的回避型人格，通常意味着他对伴侣的『情』（被爱、被需要、被索取情感）极其敏感，几乎无法承受一点点异性的情，这与他是否冷漠不理人无关。对吗？", "ans": true, "exp": "原文：回避男就是过度的弱责任感驱动。大多数有情，也可能没有。…回避的就是女人的情。一点都承受不了。…能被称之为回避的人，是高度敏感，异性的情一点点都无法承受。回避女人的情。", "id": "Q0493"}, {"type": "judge", "cat": "love", "q": "同样表现为回避，男性和女性的内在基础是不同的：男性回避型往往把时间都花在赚钱上、是很有自我价值感的人；而女性回避型则往往是缺乏自我价值感、有『我配不上对方』的不配得感的人。对吗？", "ans": true, "exp": "原文：男回避是很有自我价值感的人。男回避时间都花在赚钱上。女回避是缺乏自我价值感的人，会有不配得感，觉得自己配不上对方。", "id": "Q0494"}, {"type": "single", "cat": "love", "q": "当一个人在被真诚对待、甚至真的有人爱自己时，反而产生强烈的『我配不上』『我这么差怎么会有人喜欢我』的感受，开始想逃、回避，甚至用反复『作』和玩消失来测试对方还在不在、会不会起情绪。这种现象通常缘于下列哪种内在状态？", "ans": 0, "exp": "原文：当她生命中出现一个人爱她的时候，她会不相信自己值得被爱，为什么自己这么差也会有人爱，会觉得自己不够好。…不配得感越重的女生，回避期越长。…先逃，逃了之后，开始自我怀疑。", "options": ["过度自我价值感驱动带来的不配得感", "责任感驱动带来的目标感缺失", "物质驱动带来的金钱焦虑", "过度情感驱动带来的超强配得感"], "id": "Q0495"}, {"type": "judge", "cat": "love", "q": "焦虑型依恋（在爱情里越焦虑、越担心坏事发生、痛苦纠结的人）在驱动力体系里，通常是一个『有情』的女人。对吗？", "ans": false, "exp": "原文：焦虑型依恋一定不是有情的女人。会焦虑的人通常情况下是没办法让自己开心起来的人。…焦虑型依恋在感情中痛苦，是因为在贪求别人对自己的情。", "id": "Q0496"}, {"type": "single", "cat": "love", "q": "在恋爱中，关于『谁先主动约见面』这一行为，下列说法符合这套规律的是？", "ans": 1, "exp": "原文：男生主动约女生，是动情。女生主动约男生，一定不是动情。…会主动的女生约男生一定是会带上其它人的，一群人一起玩，或者是带上闺蜜或者弟弟妹妹之类的。", "options": ["女生主动约男生，往往是女生对男生动情的标志", "男生主动约女生通常是动情；女生动情时往往不会主动，真要约也多半是带上别人的一群人或约闺蜜", "主动与否只跟个人在不在乎掉价有关，与情感模式完全无关", "女生一旦动情，一定会私下单独约对方出去"], "id": "Q0497"}, {"type": "judge", "cat": "love", "q": "一个女人愿意为男人生孩子，只要这种『愿意』并非她本来自己想生，而只是因为得到了男人的情、愿意为对方付出，这往往是精神驱动女人很爱一个人的标志；情感驱动的女人很想生的小孩，通常是她自己发自内心喜欢、自己想生。对吗？", "ans": true, "exp": "原文：当一个女人愿意为男人生孩子的时候，可以证明她很爱他。这是精神驱动的女人表现。…『愿意』就是精神驱动的女人很喜欢或者很爱一个人的标志。…情感驱动的女人很喜欢一个人的标志是会想生孩子的。是自己想生，自己特别喜欢。", "id": "Q0498"}, {"type": "single", "cat": "love", "q": "在被抛弃/被辜负之后，关于『因爱生恨』，说法正确的是？", "ans": 1, "exp": "原文：因爱生恨是有爱的女人从爱变成了情，变成了怨恨。而有情的女生本质上无法有怨恨。所以只有有爱的女人才有可能生的出恨。", "options": ["只有『有情』的女人在被抛弃时才会生出巨大的恨", "只有『有爱』（如精神驱动）的女人才可能生得出恨，有情的女生本质上是无法有怨恨的", "所有女人被抛弃都会有同等强烈的怨恨", "因爱生恨的恨一定源于对男人钱的执念"], "id": "Q0499"}, {"type": "judge", "cat": "love", "q": "『心疼』这种感受中，如果一个男人对包括他在意的人表现出『心疼』（讨好式、献殷勤式地心疼别人、证明自己），在他身上几乎可以判断为一定会出轨的高危信号。对吗？", "ans": true, "exp": "原文：爱是不心疼的，当一个男人表现出心疼的情感特征时，他100%会出轨。…如果在男人身上感受到心疼这种特征，他会心疼别人，这个男人几乎100%会出轨。男人的心疼是在讨好，是在献殷勤，是在证明自己。", "id": "Q0500"}, {"type": "judge", "cat": "love", "q": "当对方问『你想不想我』时，本质是在向『你』索取情；而真正对你有情的人会说『我想你』。会对『你想不想我』这种话感到难受、烦躁、抓狂的女生，多是精神驱动和自我价值感驱动的女生，而不是情感驱动的女生。对吗？", "ans": true, "exp": "原文：问『你想不想我？』的人，本质上是在你身上找情的人。说『我想你』的人，本质是他对你有情。…会觉得伴侣问『你想不想我』很难受、烦躁、抓狂的人，是精神驱动和自我价值感驱动的女生，一定不是情感驱动。", "id": "Q0501"}, {"type": "single", "cat": "love", "q": "关于恋爱（早恋）对学习的影响，符合这套体系规律的是？", "ans": 1, "exp": "原文：精神驱动的女生，早恋会让成绩飙升，越恋成绩越好。情感驱动的女生，早恋会让学业直接报废。任何男生，早恋都会让学习成绩变差，情越重越差。", "options": ["女生一谈恋爱成绩必然下滑", "精神驱动的女生早恋会让成绩飙升、越恋越好；情感驱动的女生早恋学业直接报废；任何男生早恋普遍成绩变差", "所有男生早恋成绩反而更好", "早恋对学习成绩的影响与驱动力完全无关"], "id": "Q0502"}, {"type": "judge", "cat": "love", "q": "一个男人是否值得托付、事业能否走得远，与他老婆过得开不开心、能不能做自己喜欢的事情高度相关：如果男人的老婆不开心的，这个男人多半成不了真正做事业的人。对吗？", "ans": true, "exp": "原文：看一个男人是不是做事业的，是不是责任感驱动的，直接看他老婆过得开不开心就好了，老婆能不能做自己喜欢的事情。如果一个男人的老婆不开心，这个男人一定没事业。", "id": "Q0503"}, {"type": "judge", "cat": "love", "q": "在感情中，精神驱动型的女人往往对伴侣『出轨』没那么在意，只要男人对她还有情、还愿意给她足够的钱（补足自我价值感），就不太会因为出轨分手；而这一套『用钱说事』对情感驱动型的女生并不管用。对吗？", "ans": true, "exp": "原文：精神驱动的女生对于出轨没有那么在意。本质上不会因为对象出轨而分手…通常这时候男人能在经济上给到很大补偿的时候，就没事了。钱只对精神驱动和自我价值感驱动的女生有用，情感驱动就不吃钱这套。", "id": "Q0504"}, {"type": "single", "cat": "love", "q": "择偶时『喜欢／看得上的对象一定是喜欢自己的、对自己有好感的人，绝不会喜欢上一个明确不喜欢自己的人』——这条特征最常被用来排除下列哪一种驱动类型？", "ans": 2, "exp": "原文：喜欢的对象一定是喜欢自己的人，如果喜欢上不喜欢自己的人，就可以排除精神驱动了。", "options": ["情感驱动", "责任感驱动", "精神驱动", "过度物质驱动"], "id": "Q0505"}, {"type": "judge", "cat": "love", "q": "在亲密关系里，主动表白说『我爱你』并不会让人因此更幸福，反而往往是『超强配得感』而不是『不配得感』的男人，才觉得说出这句话理所当然、毫不愧疚；而真正有爱的男人很少主动说这三个字。对吗？", "ans": true, "exp": "原文：真的有爱的男人是不会说『我爱你』的，即使你要他说，他也说的很难受。…恰恰能表达我爱你的男人，一定有超强烈的配得感，而不是不配得感。他会觉得他得到的一切都是合理的。", "id": "Q0506"}, {"type": "multi", "cat": "love", "q": "关于失恋后能否走出来的规律，符合这套说法的是（可多选）：", "ans": [0, 1, 2], "exp": "原文：精神驱动的女生比情感驱动的在恋爱结束后更容易走出来…走不出来的，大多都是理性和智慧帮助不了的情感驱动的女人。…善根越好的人，越接近于平衡，越容易走出来。进德修业就是帮助自身尽快的走出这种痛苦。", "options": ["精神驱动的女生通常比情感驱动的女生更容易走出失恋", "情感驱动的女人很多时候即使有理性和智慧帮忙，也还是走不出来", "能否走出更多靠内在接纳与成长，善根越好越接近平衡就越容易走出来", "走出失恋只取决于对方渣不渣，换一个新对象就一定能走出来"], "id": "Q0507"}, {"type": "judge", "cat": "love", "q": "在亲密关系里，『女人讨好伴侣说明她自我价值感高、男人讨好伴侣说明他自我价值感低』；反过来『女人讨好＝低自我价值感、男人讨好＝高自我价值感』的说法是错的。对吗？", "ans": true, "exp": "原文：女生会讨好伴侣是很高自我价值感的表现。但男生讨好伴侣是低自我价值感的表现。", "id": "Q0508"}, {"type": "single", "cat": "love", "q": "关于男女之间『纯友谊』得以长期成立的条件，符合规律的是？", "ans": 1, "exp": "原文：纯友谊就是两个人对彼此都没有情。…纯友谊产生的条件是，你的心思纯净，对方又对你的心思纯净不产生念头又能保持足够的定力。", "options": ["只要两人都单身，就一定能保持纯友谊", "纯友谊的前提是两人对彼此都没有『情』，且一方心思纯净、对方主观又愿意守得住定力", "纯友谊只存在于同性之间", "情感驱动的人最容易和人保持纯友谊"], "id": "Q0509"}, {"type": "judge", "cat": "love", "q": "女同性恋在驱动定位上有可辨识的标志：通常是『自我价值感驱动+情感驱动』的组合，配偶星被否定、不需要异性的存在、不喜欢官杀、一定不是责任感驱动；而单一自我价值感驱动的人更有约50%以上的概率可能喜欢同性，取决于气运。对吗？", "ans": true, "exp": "原文：女同性恋的标志是自我价值感+情感驱动+配偶星被否定，她不需要异性的存在…不喜欢官杀，一定不是责任感驱动。…能被称之为单一自我价值感驱动的人…单一自我价值感驱动的人，有50%以上的概率，会喜欢同性。", "id": "Q0510"}, {"type": "judge", "cat": "love", "q": "陪伴在感情里分两种：如果对方本没有『需要你陪伴』的需求，却仍然愿意陪伴你、留下来，这种没有需求却主动给的陪伴，才算得上是爱。对吗？", "ans": true, "exp": "原文：当对方没有陪伴你的需求时，还愿意陪伴你，这就是爱。", "id": "Q0511"}, {"type": "judge", "cat": "love", "q": "天天追问伴侣『你爱不爱我』，往往是不安全感和自我价值感缺失的表现，而不是感情深厚的体现。对吗？", "ans": true, "exp": "原文：当一个人每天问『你爱不爱我』的时候，一定证明她没有安全感，并且她在邀请你参与巨大的业力纠缠。", "id": "Q0512"}, {"type": "judge", "cat": "parent", "q": "一个过度精神驱动的母亲，常用充满理性、『本该做好却没做好』『跟你说过多少次了』这样的质问式、精神攻击式沟通来教育孩子（愧疚式教育），这样长大的孩子更容易发展成回避型人格，一被别人要求做点什么就会很难受。对吗？", "ans": true, "exp": "原文：过度精神驱动的母亲对孩子会有攻击性的爱，过度的理性，精神攻击。用质问型的方式和孩子沟通…愧疚式教育。这样长大的孩子会变成回避型人格。…一旦被别人要求干什么，就很痛苦难受。", "id": "Q0658"}, {"type": "judge", "cat": "parent", "q": "对女人来说，来自『母亲的陪伴』会直接影响男人对她的情：缺乏母亲陪伴、与母亲关系不好的女人，往往也难以得到男人的情。对吗？", "ans": true, "exp": "原文：对女人来说，母亲的陪伴=男人的情。母亲的陪伴直接等价于男人对她的情。如果缺乏母亲的陪伴（和母亲关系不好），就得不到男人的情。", "id": "Q0659"}, {"type": "single", "cat": "parent", "q": "关于不同驱动类型的母亲陪伴孩子时的感受，符合规律的是？", "ans": 0, "exp": "原文：只有情感驱动的母亲陪伴孩子才是充电，其它都是需要消耗能量的。责任感驱动的母亲陪伴自己的孩子是需要消耗自身能量的。…她陪孩子的时候，母亲在充电。", "options": ["情感驱动的母亲陪伴孩子＝充电，孩子几乎是她的『充电器』", "责任感驱动的母亲陪伴孩子等于充电", "精神驱动的母亲陪伴孩子等于充电", "所有母亲陪伴孩子对本人而言都等于充电"], "id": "Q0660"}, {"type": "judge", "cat": "parent", "q": "一个人如果不是情感驱动、并不能发自内心喜欢小孩，即使照顾孩子也更多是出于责任感或理性义务；那种『为了圆满家庭、觉得应该生一个孩子』却生完发现自己无法发自内心喜欢孩子的情况，是很多产后抑郁的根本原因之一。对吗？", "ans": true, "exp": "原文：很多人生了宝宝以后，发现自己没有办法发自内心的喜欢自己的孩子，这是很多产后抑郁的根本的原因…她不能发自内心的喜欢自己的孩子，不喜欢陪伴自己的孩子。", "id": "Q0661"}, {"type": "single", "cat": "parent", "q": "关于父母驱动类型对孩子读书的影响，符合这套说法的是？", "ans": 2, "exp": "原文：责任感驱动的孩子，冲着目标读书，学渣学霸都是奔着目标刻苦读书。情感驱动的孩子偏科严重，学习好坏取决于喜不喜欢这门课的老师。…精神驱动的孩子，喜欢读书，不需要家长操心，自己会主动把书读好。", "options": ["责任感驱动的孩子读书靠兴趣，学不学的进全看喜不喜欢老师", "情感驱动的孩子读书靠目标和刻苦", "责任感驱动的孩子会冲着目标刻苦读书；情感驱动的孩子只学得进喜欢的老师的课、偏科极严重；精神驱动的孩子自己主动把书读好、不用家长操心", "自我价值感驱动的孩子学习最差"], "id": "Q0662"}, {"type": "judge", "cat": "parent", "q": "妈宝男表面是责任感驱动、很想做事很想负责的人，但结果是承担不了任何责任；常常爱创业、心比天高、高估自己低估困难，一做事就破财（如开奶茶店火锅店酒吧失败）；而且妈宝男往往有明显的婆媳矛盾、需要妻子来帮他对抗母亲。对吗？", "ans": true, "exp": "原文：妈宝男明明是一个责任感驱动的人，但结果是承担不了任何责任。…妈宝男有一个典型的行为特征是爱创业。…特别爱开奶茶店火锅店酒吧之类的，然后就倒闭了。…妈宝男会非常需要自己的伴侣，但是反抗不了自己的母亲。", "id": "Q0663"}, {"type": "judge", "cat": "parent", "q": "婆媳关系在驱动层面有规律：婆婆有没有钱、以及婆婆的钱对儿媳有没有意义是两回事；财气好的、以财星为用、物质驱动的女生婆媳关系通常最好、天性上能亲近婆婆；而精神驱动的女生更倾向于得到婆婆在金钱上的恩泽。对吗？", "ans": true, "exp": "原文：跟婆婆关系好是财气好的表现，财气越好物质驱动的女生…婆媳关系是最好的。…精神驱动的女人更有可能得到婆婆金钱上的助力成就，更倾向拥有这种婆媳关系。", "id": "Q0664"}, {"type": "judge", "cat": "parent", "q": "一个说『只在意丈夫、不在意孩子』的女人，按驱动类型看，绝不可能是责任感驱动、物质驱动或情感驱动的人，而只可能是自我价值感驱动＋精神驱动的人（她真正在意的其实是男人的钱和情）。对吗？", "ans": true, "exp": "原文：只在意丈夫不在意孩子的女人，只有可能是自我价值感驱动+精神驱动的人。绝不可能是责任感驱动或者物质驱动或者情感驱动的人。", "id": "Q0665"}, {"type": "judge", "cat": "parent", "q": "希望孩子『有目标感、有担当』的母亲，多半是精神驱动的母亲；而母亲整天眼里只有工作、以工作为重的，多半是责任感驱动的母亲。对吗？", "ans": true, "exp": "原文：希望孩子有目标感的母亲，一定是精神驱动的母亲。精神驱动的人都是用理性的方式，希望孩子成为一个有责任感，有担当的人。…责任感驱动的母亲整天都在工作，每天眼里只有工作。", "id": "Q0666"}, {"type": "single", "cat": "parent", "q": "关于『能否发自内心喜欢孩子、和母亲关系是否亲近』的规律，正确的是？", "ans": 1, "exp": "原文：通常和自己孩子十分亲近的女人，从小到大和自己的母亲就不太会亲近。孩子和母亲2选1占绝大多数70%-80%。只有又有情又有爱的女人才能同时兼顾和母亲和孩子的关系，有情+有爱的女人应该不到10%。", "options": ["每个父母都必然发自内心喜欢自己的孩子", "父母和孩子不一定有很大缘分；与自己孩子十分亲近的人，从小到大往往和母亲不太亲近（差不多二选一）；能做到既亲近孩子又亲近母亲的只有既有情又有爱的少数人", "喜欢自己孩子的父母必然也喜欢别人的孩子", "和母亲关系越好的女人越容易发自内心喜欢自己的孩子"], "id": "Q0667"}, {"type": "judge", "cat": "parent", "q": "面对原生家庭（尤其父母）的不足、索取甚至并非善类，成熟的『孝』是接纳父母的因果、不较劲、不试图『渡』父母改变他们；与之相对，过度期待改变父母、或心怀怨恨，反而会障碍自己的气运。对吗？", "ans": true, "exp": "原文：他只是接纳了父母自身的因果，僻他只是接纳，没有去讲道理，没有去争执。…不要跟父母去讲道理，不要跟父母说什么样才是对的…想不明白的时候就去看一看尧舜禹是怎么做的，什么叫孝能动天。", "id": "Q0668"}, {"type": "single", "cat": "scene", "q": "用一句话『有孩子之后爱情就不重要了』来反推一个人的驱动搭配（她说出这话说明什么），正确的是？", "ans": 1, "exp": "原文：只有情感驱动的女生会说出这句话，但也不光是情感驱动，光是情感驱动不足以支撑她说出这句话。过度情感驱动的女生，不会觉得生孩子很重要的。精神驱动的女生绝对说不出这句话。", "options": ["只有精神驱动的女生会说出这句话", "只有情感驱动型的女生才会说出这句话，而且还需要有其他驱动来支撑", "责任感驱动的女生一定会明确说『爱情不重要』", "任何驱动力都说得出口且意义完全相同"], "id": "Q0857"}, {"type": "judge", "cat": "scene", "q": "观察打牌（如麻将）时的行为可以反推驱动力：精神驱动打牌很安静、边打边想牌；自我价值感驱动最计较输赢、输不起；情感驱动打牌是图开心、输赢心淡、不介意牌局大小；物质驱动不打小牌觉得没意思；责任感驱动不喜欢打牌、除非陪重要人物。对吗？", "ans": true, "exp": "原文：精神驱动的人，打牌时候会不停在想，计算自己会胡哪些牌。…自我价值感驱动的人，最计较输赢。…情感驱动的人…打的自己开心…无所谓打大牌打小牌。物质驱动的人…完全不打小牌。责任感驱动的人会不喜欢打牌。除非陪人打。", "id": "Q0858"}, {"type": "single", "cat": "scene", "q": "关于睡眠质量与驱动力，符合这套说法的是？", "ans": 3, "exp": "原文：过度精神驱动的人睡眠是最差的，完全睡不着的人。…情感驱动的人睡眠质量最高…可以秒睡。…责任感驱动的人睡眠质量通常不会太好。…能睡到6个小时以上的企业家很少。", "options": ["过度精神驱动的人睡眠最差，总想太多、神经衰弱、睡不着", "情感驱动的人睡眠质量最高、能秒睡", "责任感驱动的人通常睡得不太多，真正做事业的人睡得少", "以上都对"], "id": "Q0859"}, {"type": "judge", "cat": "scene", "q": "最会『挑毛病』的人通常是情感驱动的（情越重越爱挑毛病、越难有伴侣）；基本不挑毛病的主要是积极精神驱动的人；责任感驱动的人挑毛病往往就事论事、用事情本身挑，而不是情感或精神上的攻击。对吗？", "ans": true, "exp": "原文：最会挑毛病的人是情感驱动的。情越重越会挑毛病，越难有伴侣。不会挑毛病的人，主要是积极精神驱动的人。…责任感驱动的人…用事情挑毛病。就事论事的，做的事情不对，不对的原因不重要。", "id": "Q0860"}, {"type": "single", "cat": "scene", "q": "关于『哄人』在亲密关系中的作用，符合规律的是？", "ans": 1, "exp": "原文：情感驱动男人和精神驱动的女人是最好哄的…井但是过度精神驱动的女生，一哄就完蛋一哄就爆炸。但凡你去哄她就是接着吵。", "options": ["对任何类型的女生，越哄越管用", "情感驱动男和精神驱动女最容易被哄好；过度精神驱动的女生恰恰不能哄，一哄就上纲上线、越哄越爆炸", "哄不哄效果都一样", "精神驱动的女人最不会被哄好"], "id": "Q0861"}, {"type": "judge", "cat": "scene", "q": "『公布关系/晒伴侣』这一细节可分辨驱动力：一个男人喜欢晒伴侣、去哪儿都带着她、愿意见人就公开她的身份，通常是物质驱动型男人爱公开关系的表现；反之羞于、拒不承认伴侣身份存在，往往就不是责任感驱动成熟稳重的表现。对吗？", "ans": true, "exp": "原文：自己主动喜欢公开关系的人是物质驱动的人…爱粘着女人/老婆的男人就是物质驱动的…当男人喜欢晒伴侣，有时间都陪着伴侣，到哪儿都带着伴侣，这些都是物质驱动男人的特征。", "id": "Q0862"}, {"type": "judge", "cat": "scene", "q": "夫妻间『打电话/回家』这一细节能反映驱动力：责任感驱动的男人会因妻子不打电话催自己回家、不关注自己（尤其生娃后情感驱动的妻子把注意力转到孩子身上）而感到失落、目标感消失；而情感驱动型的男人在正开心时接到老婆电话反而容易生气。对吗？", "ans": true, "exp": "原文：责任感驱动的男人因为妻子不打电话给自己催回家，感到很痛苦…突然就不吵架了也不管他了，他就陷入巨大的迷茫…情感驱动的男人，接到他老婆的电话，是最容易爆炸的。", "id": "Q0863"}, {"type": "single", "cat": "scene", "q": "关于『做饭』这一行为偏好，符合规律的说法是？", "ans": 0, "exp": "原文：情感驱动是只喜欢给喜欢的人做饭。…但是喜欢做饭的，一定是情感驱动的。本身木火之气过度的人，是非常不喜欢做饭的。", "options": ["喜欢做饭的人一定是情感驱动的", "喜欢做饭的都是物质驱动的", "木火之气过度的人特别喜欢做饭", "做饭偏好与驱动力完全无关"], "id": "Q0864"}, {"type": "judge", "cat": "scene", "q": "在职场中，一个人如果『承受不了一点压力、只要被要求做某件事就难受』，那么他与领导/上级处不好关系是很正常的——因为这本身就是这个特征遇到『被要求』时必然难受，不并是他故意；驱动力不匹配的人做他领导也很难处得好。对吗？", "ans": true, "exp": "原文：承受不了一点压力…只要是被要求做什么事的时候，就一定会难受，所以上下级关系就不可能会相处的不好…和一个人处得来或者处不来，一定是和驱动力有关。", "id": "Q0865"}, {"type": "judge", "cat": "scene", "q": "爱当众吹牛、爱显摆的男人，大多是情感驱动型男生（爱吹牛的90%都是男生）；只要给他机会吹牛、捧他肯定他，他基本什么都愿意给你；而高度精神驱动的人是连话都很少讲、不吹牛的。对吗？", "ans": true, "exp": "原文：90%吹牛的都是男生。这就是情感驱动男生好哄的原因。只要给他机会吹牛就行了。捧杀他，肯定他，他什么都愿意给你。高度精神驱动的人是不会吹牛的，连话都不讲。男女一样。", "id": "Q0866"}, {"type": "judge", "cat": "money", "q": "『用钱砸/花钱收买感情』之所以时常见效，是因为很多人的确没有抵抗力，只要财力足够多——很多能撑得住的人只是没机会、没缘分接触到这样的人，并非真能百分百不被打动。对吗？", "ans": true, "exp": "原文：所以很多男人会用砸钱的方式收获感情，是因为很多人没有抵抗力。只要财力够多。很多人没有机会没有因缘接触到这样的人，只是没有缘分遇到，并不是百分百不会被收割。", "id": "Q0994"}, {"type": "single", "cat": "money", "q": "关于不同驱动力主导的赚钱/显化财富方式，对应正确的是？", "ans": 0, "exp": "原文：靠才华赚钱--情感驱动，靠共情、团结大家显化财富。靠脑子赚钱--精神驱动…靠事业心赚钱--责任感驱动…靠财气赚钱--物质驱动…靠身体赚钱--自我价值感驱动。", "options": ["情感驱动靠才华共情团结大家；精神驱动靠脑子（精神境界决定赚钱维度）；责任感驱动靠事业且有杠杆；物质驱动靠财气钱生钱；自我价值感驱动靠身体/时间体力", "责任感驱动靠才华赚钱", "物质驱动靠出卖体力赚钱", "精神驱动靠共情团结大家赚钱"], "id": "Q0995"}, {"type": "judge", "cat": "money", "q": "真正物质驱动的人花钱能『花到点上』（投资或花在生命质量上），钱花出去本身就有意义、有满足感；而其他驱动（如满足情欲、滋养我慢心）的乱花钱、存不住钱，在本质上是很难改的。对吗？", "ans": true, "exp": "原文：只有物质驱动的人花钱会花到点上，其余的人花钱都是乱花的。…对男人来说，最容易破财的地方是满足自己的情欲。…乱花钱、存不住钱这个特质，本质上是没法改的。", "id": "Q0996"}, {"type": "single", "cat": "money", "q": "关于『花钱体验』与驱动力，正确的是？", "ans": 0, "exp": "原文：自我价值感驱动一方面能赚钱，一方面也能管钱。但就是不会花钱…花钱纠结、难受…通常自我价值感驱动的人，80%都是精神驱动的。", "options": ["自我价值感驱动的人能赚能存，却不会花钱，一花钱就纠结难受；他们当中约80%还同时是精神驱动的", "精神驱动的人最喜欢大手笔花钱去旅游享受", "物质驱动的人只要一花钱就焦虑", "情感驱动的人花钱都会心疼、舍不得"], "id": "Q0997"}, {"type": "judge", "cat": "money", "q": "情感驱动的人会为开心而花钱，越花越有财；情感驱动＋物质驱动的人花钱会越花越有钱，因为他们能把钱花到对的地方（情会带来财、人情远大于金钱）。对吗？", "ans": true, "exp": "原文：情感驱动的人会花几千块钱开一瓶酒，就很开心…花钱买开心。…情感驱动+物质驱动的人花钱会越花越有钱。因为会把钱花对地方。…人情是远远大于金钱的。", "id": "Q0998"}, {"type": "judge", "cat": "money", "q": "从『花钱比例/态度』这种细节能分辨驱动力：物质驱动的人恨不得把财富总量95%的钱都花光也不焦虑；而精神驱动的人，大约花到财富总量3%-5%就开始焦虑，再多一点就要痛苦抉择。对吗？", "ans": true, "exp": "原文：物质驱动的人，花钱花的就是开心，就是想把钱花光，花出去财富总量95%的钱，即使身上没多少钱了，也不会焦虑。精神驱动的人…大概财富总量的3%-5%是上限。花5%的钱就开始焦虑了。", "id": "Q0999"}, {"type": "single", "cat": "money", "q": "关于『不舍得花钱』这一特征，下列判断正确的是？", "ans": 0, "exp": "原文：不舍得花钱一定不是物质驱动的人，也不是情感驱动的人。情感驱动的人会很喜欢给大家花钱，为了让大家开心是不太考虑钱这个东西的。", "options": ["不舍得花钱一定不是物质驱动的人，也不是情感驱动的人（情感驱动的人很喜欢给大家花钱、不太考虑钱）", "不舍得花钱那就一定是物质驱动", "不舍得花钱那就一定是情感驱动", "舍得很花钱的一定是自我价值感驱动"], "id": "Q1000"}, {"type": "judge", "cat": "money", "q": "在股市/投资里：物质驱动适合做价值投资（凭对价值的感知、不靠脑子），精神驱动适合短线见好就收（不能恋战、不能赚最后一个铜板）；而高度过度精神驱动的人最忌讳炒股（想太多、一贪恋盈亏就崩）。对吗？", "ans": true, "exp": "原文：物质驱动的人做股票，只需要基于看好一个行业、一支股票本身…有很好的发心。…精神驱动的人炒股，是动脑子基于逻辑分析的。适合做短线…不能留恋。…高度的过度精神驱动的人不要炒股。", "id": "Q1001"}, {"type": "single", "cat": "money", "q": "关于『向朋友借钱』，符合这套规律的是？", "ans": 1, "exp": "原文：过度自我价值感驱动的人，最喜欢向朋友借钱…赚不了朋友钱的人，也不愿向朋友借钱，自我价值感驱动的人，最不愿意向朋友借钱…最容易向女人借钱的男人是物质驱动的。", "options": ["自我价值感驱动的人最容易赚朋友的钱、也最愿意向朋友借钱", "过度自我价值感驱动（结合物质+责任感驱动）的人最喜欢向朋友借钱；而自我价值感驱动的人反而最不愿向朋友借钱；最容易向女人借钱的男人是物质驱动的", "情感驱动的人最不愿向朋友借钱", "向伴侣借钱的男人一定是情感驱动的"], "id": "Q1002"}, {"type": "judge", "cat": "money", "q": "『最爱主动买单、大方花自己钱』的人往往是情感驱动＋物质驱动的组合（甚至带着一点不配得感的女生）；而最不愿买单、最不愿花自己钱的，是自我价值感和精神驱动的人。对吗？", "ans": true, "exp": "原文：最爱买单/花自己钱的是情感驱动+物质驱动的。…最不愿意买单/花自己钱的是自我价值感、精神驱动的。", "id": "Q1003"}, {"type": "judge", "cat": "money", "q": "过度焦虑『钱』的人，害怕的其实是贫穷本身、怕没钱花（而不是担心自己赚钱能力差）；这种对金钱的高度焦虑想『在没有钱的状态中硬突破』很难，往往要有特定人生机遇和卓越善根才过得了钱关。对吗？", "ans": true, "exp": "原文：过度焦虑钱的人害怕的都是贫穷本身，而不是赚钱的能力。…要在没有钱的状态中突破对钱的焦虑。这不是谁都能过的了的，要有特定的人生机遇。还有卓越的善根。", "id": "Q1004"}, {"type": "judge", "cat": "drive", "q": "五种核心驱动力（情感、精神、责任感、物质、自我价值感）是『横向』并列、没有谁比谁高级的；而『善根』是纵向的维度，善根越好整体平衡状态越好、各种驱动的优点呈现得越高级。对吗？", "ans": true, "exp": "原文：五种驱动力是横向的，没有谁比谁高级。但善根是纵向的维度，善根越好的人整体的平衡状态越好，他的所有的驱动力的优点呈现出来的都会更高级。", "id": "Q0233"}, {"type": "judge", "cat": "drive", "q": "一个人的核心驱动力并不是一成不变的，它会随气运/时运波动而改变；当核心驱动力改变时，往往带来过往缘分的了结和新缘分的开始，很多婚姻家庭关系的开始或结束都与此有关（极端情形会表现为双向人格障碍）。对吗？", "ans": true, "exp": "原文：一部分人的核心驱动力会随着气运/时间波动。最明显的变化就是性格发生转变。当核心驱动力发生改变的时候，往往会带来缘分的结束与开始。…最极端的类型就是双向人格障碍。", "id": "Q0234"}, {"type": "single", "cat": "drive", "q": "判断一个人的驱动力是否发生了转变（例如从物质/责任感驱动切向精神驱动），下列属于这种判断依据的是？", "ans": 0, "exp": "原文：如果突然喜欢不怎么搭理自己的男人了，就变成精神驱动了。之前应该是男人追也追不到，但是如果突然变成了被男人追也挺愉快的，被男人追不讨厌了…就说明驱动力变了。", "options": ["从『喜欢理自己的男人』突然变成『喜欢不怎么搭理自己的男人、被男人追也不讨厌』——说明开始向精神驱动转变", "从喜欢独处突然变得特别爱聊八卦", "从话少变得狂爱吹牛显摆自己", "从爱逛街变成爱赌博"], "id": "Q0235"}, {"type": "judge", "cat": "drive", "q": "关于『动情』：当你对一个人动情时，往往意味着你开始需要他为你提供情绪价值、照顾你的感受，随之产生控制欲；控制欲得不到满足时会愤怒、起嗔恨；所以对很多并非情感驱动（即『不能动情』）的人，一动情就全是负能量。对『动的是不是恰当的情、对方需不需要』保持觉察很重要。对吗？", "ans": true, "exp": "原文：当你对一个人动情的时候，意味着，你需要他为你提供情绪价值。…就会产生了控制，产生了需要。这时候控制欲就来了。…所谓不能动情的人，是指不是情感驱动的人一动情就全是负能量，全是负面情绪。", "id": "Q0236"}, {"type": "judge", "cat": "drive", "q": "驱动力体系里有条普适规则：你需要谁、对他有所求，就会向谁暴露需求；你需要谁的情，就愿意向谁提供情绪价值；而对谁『有情』，就会想控制谁、需要谁来给你提供情绪价值。爱与情是两种不同的付出：爱是想对方好、无条件付出；情是占有与索取。对吗？", "ans": true, "exp": "原文：你需要谁的爱，你就会向谁暴露你的需求。你需要谁的情，你就会向谁提供情绪价值。你对谁有情，你就会想要控制谁，你就需要谁来给你提供情绪价值。…为别人好就是爱的能量。想占有别人就是情的能量。", "id": "Q0237"}, {"type": "judge", "cat": "drive", "q": "真正意义上的『共情』是让自己很容易开心起来、也让别人开心起来的能力；至于看视频常被负面情绪带动、见谁痛苦就低落，这不是共情，反而往往是情感能力不足、容易被负能量招感的表现。对吗？", "ans": true, "exp": "原文：真正的情是让自己很容易开心起来的能力，而共情也是想让别人开心起来的能力。而普通人认为的看到一些视频会感受到对方的痛苦，这只是很容易被负能量影响到，这不是共情。", "id": "Q0238"}, {"type": "judge", "cat": "drive", "q": "驱动力不等于性格：非责任感驱动的人也可以很有责任感（只是更多是被动承担、并非内在主动追求责任）；而过度情感驱动与过度自我价值感驱动的人都有『想负责』的需求，却往往没有负责任的能力；核心驱动力越聚焦越容易找到生命平衡。对吗？", "ans": true, "exp": "原文：非责任感驱动的人也会有责任感，只不过不是主动追求责任…过度情感驱动和过度自我价值感驱动的人，都有负责任的需求，但是都没有负责任的能力。", "id": "Q0239"}, {"type": "judge", "cat": "drive", "q": "拥有多种驱动力并不是越多越好：驱动力越少越容易得到满足感，驱动力越多越不容易被百分百满足；所以聚焦核心驱动力，比多头贪求更接近安宁与平衡。对吗？", "ans": true, "exp": "原文：驱动力越少，越容易得到满足感。驱动力越多，越不容易百分百满足。", "id": "Q0240"}, {"type": "judge", "cat": "drive", "q": "『越不索取的人得到越多，越是主动索取的人反而只能得到对方权衡利弊之后剩下的零钱』——这一规律在驱动力与亲密关系中被反复强调。对吗？", "ans": true, "exp": "原文：不会索取的人才会得到最多。索取的人只是对方经过权衡利弊之后给你一点剩下的零钱而已。", "id": "Q0241"}, {"type": "judge", "cat": "drive", "q": "述情障碍（有太多感受却表达不出来、嘴硬到无法说出对他人的喜欢，尤其对自己的伴侣）常与高度的不配得感、过度精神/自我价值感相关；对应地，嘴硬的女人没有一个能过得幸福。对吗？", "ans": true, "exp": "原文：一个人不配得感越强，越不会赞美别人，越不会表达自己的情感，特别是对自己的伴侣，嘴硬的不得了，不可能表达她对你的喜欢。述情障碍就表现在这里。…嘴硬的女人没有一个幸福的。", "id": "Q0242"}, {"type": "multi", "cat": "drive", "q": "不同驱动力的人，其修行的上手方式各不相同，符合规律的有（可多选）：", "ans": [0, 1, 2, 3], "exp": "原文：只有精神驱动是靠理性获得觉悟的。打坐也只对精神驱动的人是有用的。…情感驱动的人不靠理性获得觉悟…热闹，是人间烟火。…责任感驱动的人获得觉悟…就是通过做事。…物质驱动的人…通过布施心实践来践履修行的。", "options": ["精神驱动的人靠理性和平静来提升，打坐、静心对他有用", "情感驱动的人不靠理性觉悟、不适合强制打坐，反而喜欢热闹、人间烟火，在感受与情中去向往善根", "责任感驱动的人通过在做事中贯彻利他、放大格局来提升心量", "物质驱动的人通过『财布施/真正的布施心』来实现利他与生命境界提升"], "id": "Q0243"}, {"type": "judge", "cat": "drive", "q": "把『动情』和『动心』区分开很有必要：动情伴随情欲与索取，动心是被对方自带的、能让自己生命平衡的能量高度同频而内心平静；人只会对与自己同频的人心动，而不会对能量层级远高于自己的人动情。对吗？", "ans": true, "exp": "原文：动情是伴随着情欲的。动心是出现了让你生命得到平衡的能量。…动心就是同频的那一刻。…能量层级远高于你的人，是不会让你动心的。因为他不会跟你同频的。", "id": "Q0244"}, {"type": "judge", "cat": "drive", "q": "一个人付出的前提往往是『被需要』：当你让他感受到被需要、被依赖（需要他的存在与陪伴）时，他就有源源不断的动力去做事，会把你的需要视作自己的责任——这种『被需要』正是自我价值感的来源，而不是责任感。对吗？", "ans": true, "exp": "原文：自我价值感驱动的人，只要让他感受到被你需要，他就有源源不断的动力去做事。会将你的需要视为他自己的责任。…被需要就是他的存在被需要。『有你在我就放心了』这种感觉。", "id": "Q0245"}, {"type": "judge", "cat": "drive", "q": "一段关系里判断对方真正在意什么：许多（尤其精神驱动）人对待感情时，在意的并不是权衡利弊地计算对方能给自己带来什么，而是自己精神满足感的来源本身；理性地接纳『对方能满足你的精神需求』也是理性的一部分，对很多女人来说最大的精神满足就来自男人的情。对吗？", "ans": true, "exp": "原文：精神驱动的人在对待感情问题时，他在意的是他的精神满足感来源于什么，而不是说要权衡利弊。…理性的内涵包括对方可以满足你的精神需求。…对女人来说，最大的精神满足来自男人的情。", "id": "Q0246"}, {"type": "single", "cat": "drive", "q": "在八字五行驱动的十神定位理论中，五种核心驱动力分别对应不同的十神，彼此有一套固定的映射关系。小张想确认『财星（正财、偏财）』到底对应哪一种驱动力，下列选项中表述完全正确的是哪一项？", "options": ["印星（正印、偏印）对应责任感驱动", "食伤（食神、伤官）对应自我价值感驱动", "财星（正财、偏财）对应物质驱动", "比劫（比肩、劫财）对应情感驱动"], "ans": 2, "exp": "原文：十神定位：食伤（食神、伤官）=情感驱动 比劫（比肩、劫财）=自我价值感驱动 印星（正印、偏印）=精神驱动 官星（正官、七杀）=责任感驱动 财星（正财、偏财）=物质驱动", "id": "Q0247"}, {"type": "single", "cat": "drive", "q": "在“五种驱动力分别通过动用某一种五行来帮助自身实现阴阳平衡”的设定中（以自己为水为例），“物质驱动”的人实现阴阳平衡，动用的是哪一种五行关系？", "options": ["动用生我的五行（如水用金）", "动用我所生的五行（如水用木）", "动用我克的五行（如水用火）", "动用克我的五行（如水用土）"], "ans": 2, "exp": "原文：物质驱动的人实现阴阳平衡的方式就是用我克的五行，实现阴阳平衡的方式。我是水，就用火实现平衡。（喜欢自己克的东西）", "id": "Q0248"}, {"type": "judge", "cat": "drive", "q": "五种驱动力虽然直接对应五行的能量，但在一个人的一生中，理论上最多只能同时出现四种驱动力，而大多数人是三种、最少是一种。请判断以上说法是否正确？", "ans": true, "exp": "原文：理论上和现实层面上来说，5种驱动力在一个人的生命中最多可以出现4种。大多数人最多是三种，最少是一种。", "options": [], "id": "Q0249"}, {"type": "judge", "cat": "drive", "q": "判断正误：一个人究竟属于哪几种驱动力并不是一成不变的，它会随着时运的变化而改变，其具体表现取决于自身当时取得平衡的方式。", "ans": true, "exp": "原文：驱动力是会随着时运变化的，取决于自身取得平衡的方式。", "options": [], "id": "Q0250"}, {"type": "judge", "cat": "drive", "q": "判断题：一个人身上占据的驱动力越少，越容易获得满足感；驱动力越多，越难以获得百分百的满足。此说法是否正确？", "ans": true, "exp": "原文：驱动力越少，越容易得到满足感。驱动力越多，越不容易百分百满足。", "options": [], "id": "Q0251"}, {"type": "single", "cat": "drive", "q": "地支三合局的形成，用木星与土星相对相汇的位置来解释。下列哪一组地支属于'三合水局'？", "options": ["亥卯未", "申子辰", "寅午戌", "巳酉丑"], "ans": 1, "exp": "原文：地支三合的位置就是在每一个不同的地方木星与土星相对相汇的位置。比如申子辰三合水局。", "id": "Q0252"}, {"type": "judge", "cat": "drive", "q": "判断正误：以具体的干支组合为例，『天干相合未必真能成化』，如『庚乙合化金，合不化』，即虽有相合之名却并不构成真正的合化之气，可见『合』与『化』是两回事。此说法是否正确？", "ans": true, "exp": "原文：庚乙合化金，合不化。辰中的藏气是戊土、癸水、乙木。", "options": [], "id": "Q0253"}, {"type": "single", "cat": "drive", "q": "在干支历法（四柱八字）的太极体系中，十天干本身就可以对应八卦，并且在人的太极里『自我』的定位是以四柱中某一柱的天干为准的。请问，一个人自身的定位是以哪一柱的天干为基准？", "options": ["年柱的天干", "月柱的天干", "日柱的天干", "时柱的天干"], "ans": 2, "exp": "原文：十天干就是八卦…在人的太极当中，干支历法的太极当中，人，自我的定位，就是以日柱的天干为定位的。", "id": "Q0254"}, {"type": "judge", "cat": "love", "q": "判断正误：爱与情在每个人的生命中相克而成太极——例如『印星』（生我、代表爱与精神能量）与『食伤』（我生、代表情）相克，构成一对小太极，其内涵是人的情感与智慧（情志）的平衡。", "ans": true, "exp": "原文：印星与食伤相克成太极，比如你是火，生你的就是木，你生的东西就是土，那么木就是克土的，这就是你爱的能量与情的能量相克而成太极。", "options": [], "id": "Q0513"}, {"type": "single", "cat": "love", "q": "在易经万物类象中，“爱”被定位在人的精神和理性层面（是一种精神力、智慧与慈悲的导向，内涵是理解、接纳与包容）。那么“爱”在十神中的定位是哪一个？", "options": ["官星", "财星", "比劫", "印星"], "ans": 3, "exp": "原文：爱是一种精神力，是一种智慧与慈悲的导向，理解、接纳、包容。在易经的万物类象当中，爱的定位就是每一个人的印星。", "id": "Q0514"}, {"type": "single", "cat": "love", "q": "“有情的人”与“有爱的人”虽然都会付出，但付出的动机不同。以男人向女人付出（如制造浪漫、送花）为例，下列哪一项表述是正确的？", "options": ["有情的一方完全只按照对方想要的方式付出，从不关心自己是否开心", "有情的一方会因自己觉得买花很浪漫而去做，开心在买完那一刻就结束，不太在意对方是否喜欢", "有爱的一方付出主要是为了证明自己浪漫，以满足自身需要为主", "有情与有爱在本源上没有区别，只是付出多少的差别"], "ans": 1, "exp": "原文：有情的男人就会自己搞很多浪漫，他自己想对你好，然后用一些方式去证明他对你的情。他就会以他想要的方式对你付出，不一定是你所需要的。但是有爱的男人的付出，一定是基于你所需要的，因为他自身并没有这个需要。", "id": "Q0515"}, {"type": "single", "cat": "love", "q": "在婚姻中，以“偏财为妻”的男人结婚之后的典型状态是下列哪一项？", "options": ["婚后就是柴米油盐，妻子开始相夫教子", "结婚跟没结婚没有本质区别，婚后仍像谈恋爱一样，与妻子恩婚浪漫", "婚后立刻与妻子疏远，几乎不再来往", "偏财为妻的男人从不把婚姻放在心上，总是游离在外"], "ans": 1, "exp": "原文：以偏财为妻的男人，结婚跟没结婚没有本质区别，结婚以后也是跟谈恋爱一样，他们永远都在谈恋爱。但是正财为妻的男人，一旦结婚以后就是柴米油盐，她的老婆就开始相夫教子。", "id": "Q0516"}, {"type": "single", "cat": "parent", "q": "在四柱八字的万物类象中，父母各有其固定的十神定位。关于'母亲'的定位，下列正确的是哪一项？", "options": ["男人与女人都以正印为母", "男人与女人都以偏印为母", "男人以正印为母，女人以偏印为母", "男人以偏印为母，女人以正印为母"], "ans": 2, "exp": "原文：其实在母亲的这个含义上。男人以正印为母。女人以偏印为母。", "id": "Q0669"}, {"type": "single", "cat": "parent", "q": "在四柱八字的万物类象中，关于'父亲'的十神定位存在明确的男女性别差异。下列哪一项表述符合这套定位？", "options": ["男以正财为父，女以偏财为父", "男以偏财为父，女以正财为父", "男女都以正印为父", "男女都以偏财为父"], "ans": 1, "exp": "原文：男以偏财为父 女以正财为父", "id": "Q0670"}, {"type": "judge", "cat": "parent", "q": "判断正误：一个人与父亲的关系可以等价于他与财富物质的关系，也就是决定他是不是一个物质驱动的人；物质驱动的人往往会亲近父亲，对父亲的陪伴和情感有需求。", "ans": true, "exp": "原文：他与父亲的关系可以等价于他与财富物质的关系。就是他是不是一个物质驱动的人。物质驱动的人，他就会亲近他的父亲。", "options": [], "id": "Q0671"}, {"type": "single", "cat": "parent", "q": "从'食伤生财'的五行相生关系出发，不同驱动力的人对父亲的需求存在差异。请问哪一类驱动力的人会期待并且需要父亲的理智引导、需要父亲的精神驱动力？", "options": ["物质驱动的人", "自我价值感驱动的人", "情感驱动的人", "责任感驱动的人"], "ans": 2, "exp": "原文：如果你是情感驱动的人，你就会期待和需要父亲的理智，需要父亲的精神驱动力。", "id": "Q0672"}, {"type": "multi", "cat": "scene", "q": "按核心驱动力区分孩子『读书/学习』的不同表现（暂不考虑财气等其他因素），下列哪些说法正确？（多选）", "options": ["情感驱动的孩子偏科严重，学习好坏取决于喜不喜欢这门课的老师，写作文全是真情实感", "责任感驱动的孩子冲着目标读书，无论学霸还是学渣都奔着目标刻苦读书", "精神驱动的孩子喜欢读书，不需要家长操心，会主动把书读好、把作业做好，且摸清了应试教育的套路", "自我价值感驱动的孩子通常学习很差，属于垫底水平"], "ans": [0, 1, 2], "exp": "原文：情感驱动的孩子，偏科严重，学习好坏取决于喜不喜欢这门课的老师。写作文全是真情实感。责任感驱动的孩子，冲着目标读书…精神驱动的孩子，喜欢读书，不需要家长操心…自我价值感驱动的孩子，通常学习不会很差，一般中等偏上。", "id": "Q0867"}, {"type": "single", "cat": "scene", "q": "早恋会对不同驱动力者的学习成绩产生不同的影响。下列哪一项符合这套理论？", "options": ["任何女生早恋都会导致成绩飙升", "精神驱动的女生早恋会让成绩飙升，而情感驱动的女生早恋会让学业直接报废", "情感驱动的女生早恋成绩飙升，精神驱动的女生早恋则报废", "早恋对所有驱动力的人都只有坏处"], "ans": 1, "exp": "原文：精神驱动的女生，早恋会让成绩飙升，越恋成绩越好。情感驱动的女生，早恋会让学业直接报废。任何男生，早恋都会让学习成绩变差，情越重越差。", "id": "Q0868"}, {"type": "single", "cat": "scene", "q": "在睡眠质量与不同驱动力的关联中，哪一类驱动力的人“入睡能力最佳”、睡眠质量最高（哪怕有烦恼、哪怕负债也能秒睡、睡得沉摇不醒）？", "options": ["精神驱动", "责任感驱动", "情感驱动", "自我价值感驱动"], "ans": 2, "exp": "原文：情感驱动的人睡眠质量最高，哪怕有烦恼也不影响睡觉，可以秒睡。哪怕是负债也睡得着。入睡能力最佳，而且有时候睡的比较沉，摇不醒。", "id": "Q0869"}, {"type": "single", "cat": "scene", "q": "不同驱动力的人所需睡眠时间不同。哪一种驱动力的人'需要的睡眠时间最少、入睡不容易，甚至打坐都可以代替睡觉'？", "options": ["精神驱动", "情感驱动", "物质驱动", "责任感驱动"], "ans": 0, "exp": "原文：精神驱动的人需要的睡眠时间最少。打坐都可以代替睡觉。入睡不容易。", "id": "Q0870"}, {"type": "single", "cat": "scene", "q": "以『打麻将』为例描述不同驱动力者的行为差异，可用来从行为反推驱动力。哪一种驱动力的人『最计较输赢、最输不起、今天不赢就没有意义』？", "options": ["精神驱动", "自我价值感驱动", "情感驱动", "责任感驱动"], "ans": 1, "exp": "原文：自我价值感驱动的人，最计较输赢。今天不赢就没有意义。不赢牌就难受。最输不起的就是自我价值感驱动的人。", "id": "Q0871"}, {"type": "single", "cat": "scene", "q": "能把金融『玩得好、玩得转、做得很大』的人在命理配置上通常属于哪一类？下列哪一项符合这套理论？", "options": ["往往是情感驱动，因为情感驱动最有深谋远虑", "要么是财印平衡，要么是财官两旺（物质驱动+责任感驱动），且不以赚钱为目的做金融", "以赚钱为目的、对盈亏很敏感的人最容易成为金融大佬", "必须是单纯的自我价值感驱动"], "ans": 1, "exp": "原文：能把金融玩的好的人…要么是财印平衡，要么是财官两旺。财官两旺就是物质驱动+责任感驱动的人。真正做金融的大佬，是不以赚钱为目的做金融的。因为不以赚钱为目的，就对盈亏不敏感。没有见过情感驱动的金融大佬。", "id": "Q0872"}, {"type": "single", "cat": "scene", "q": "命理格局『杀印相生』是成就大事业的人的标配、乱世称王称霸的标配。杀印相生对应的是哪两种驱动力叠加？", "options": ["情感驱动+物质驱动", "自我价值感驱动+情感驱动", "精神驱动+责任感驱动", "物质驱动+自我价值感驱动"], "ans": 2, "exp": "原文：命理学的格局，杀印相生，就是精神+责任感驱动的，官印相生也可以，但是杀印相生更典型。这是成就大事业的人的标配。", "id": "Q0873"}, {"type": "single", "cat": "scene", "q": "『伤官配印』这一格局的特征，下列哪一项表述最准确？", "options": ["伤官配印是纯粹的责任感驱动，靠承担责任实现价值", "伤官配印是情感驱动的人同时有智慧，情是创造性的、无中生有，创造力与艺术天赋来源于此，并能靠共情团结大家", "伤官配印的人没有任何情绪感染力，无法团结他人", "伤官配印只能用作贬义，没有任何正面能力"], "ans": 1, "exp": "原文：伤官配印，情感驱动的人同时有智慧。情是创造性的，无中生有，在不存在需求的情况下创造一种需求。创造力，艺术天赋就来源于这个东西。艺术家最重要的能力也是情感能力。…用共情的方式团结大家的力量。", "id": "Q0874"}, {"type": "judge", "cat": "scene", "q": "判断正误：当『过度自我价值感驱动＋过度情感驱动＋过度精神驱动』三个条件同时满足、并叠加时运影响时，人容易进入『自闭』状态，表现为不爱讲话、不爱思考、不喜欢朋友、不喜共情、也不与人精神交流。", "ans": true, "exp": "原文：自闭症也受到时运影响，当3个条件同时满足的时候就自闭了：过度自我价值感驱动+过度情感驱动+过度精神驱动。不爱讲话，不爱思考，不喜欢朋友。", "options": [], "id": "Q0875"}, {"type": "single", "cat": "scene", "q": "以『不喜欢被叫XX太太、XX妈妈』这一行为来反推驱动力。这类感觉『更主要的一定不是』哪一种驱动力的人？", "options": ["物质驱动", "精神驱动", "自我价值感驱动", "责任感驱动"], "ans": 3, "exp": "原文：被叫XX人太太、XX人妈妈会感觉自我价值感确实，这有可能是自我价值感驱动的人，但更主要的是一定不是责任感驱动的人。", "id": "Q0876"}, {"type": "single", "cat": "scene", "q": "某人打牌时不爱讲话、很安静，一直在心里默默计算自己会胡哪些牌，输赢都情绪稳定、看不出喜怒，他觉得打牌的乐趣在于牌本身排列组合的方式以及赢牌。从这些行为最可能反推出他是哪一类驱动力？", "options": ["情感驱动", "责任感驱动", "精神驱动", "物质驱动"], "ans": 2, "exp": "原文：精神驱动的人，打牌时候会不停在想，计算自己会胡哪些牌。不爱讲话，打牌很安静。看不出喜怒，输赢都情绪稳定。打牌乐趣在于牌本身排列组合的方式，还有赢牌。", "id": "Q0877"}, {"type": "short", "cat": "scene", "q": "简述题：如何通过一个人『睡眠情况』这一行为来反推其核心驱动力（至少写出两类驱动力与睡眠特征之间的对应关系）？", "options": [], "ans": "按原文，情感驱动的人睡眠质量最高、能秒睡而且睡得沉（哪怕负债也睡得着）；精神驱动的人需要的睡眠时间最少但入睡不容易；责任感驱动的人睡眠质量通常不会太好；物质驱动的人心事较少、烦恼比别的人少。", "exp": "原文：情感驱动的人睡眠质量最高，哪怕有烦恼也不影响睡觉，可以秒睡…精神驱动的人需要的睡眠时间最少。打坐都可以代替睡觉。入睡不容易。责任感驱动的人睡眠质量通常不会太好。", "id": "Q0878"}, {"type": "single", "cat": "money", "q": "以『忙碌、辛苦』与赚钱之间的关系来区分正财与偏财为用，下列说法正确的是哪一项？", "options": ["以正财为赚钱方式的人也是越辛苦赚钱越多，而偏财则和忙没有关系", "以偏财为用的人越辛苦赚钱越多", "正财与偏财为用都和忙碌程度无关", "正财代表意外之财，偏财代表稳定收入"], "ans": 0, "exp": "原文：以正财为赚钱方式的人，也是越辛苦赚钱越多。偏财和忙就没有关系。", "id": "Q1005"}, {"type": "single", "cat": "money", "q": "关于“管钱”：能真正克得住钱财（钱不乱花、不担心钱会不翼而飞、自己的钱也管得很好）的核心驱动力是哪种人？", "options": ["情感驱动", "责任感驱动", "自我价值感驱动", "物质驱动"], "ans": 2, "exp": "原文：真正能管钱的本质是能够克的住钱财的人，也就是自我价值感驱动的人。前提是他的气运支持他能实现这样的平衡。", "id": "Q1006"}, {"type": "single", "cat": "money", "q": "有一类驱动力的人既能赚钱也能管钱，但就是'不会花钱'——花钱不会有满足感、不是他感受开心的方式，但凡花钱就有不好的感受，钱往往以被动的方式（被借钱、被诈骗等）花出去。这类人是哪种驱动力？", "options": ["情感驱动", "自我价值感驱动", "精神驱动", "责任感驱动"], "ans": 1, "exp": "原文：自我价值感驱动一方面能赚钱，一方面也能管钱。但就是不会花钱…花钱不会有满足感/不是他感受开心的方式，但凡花钱就会有不好的感受。", "id": "Q1007"}, {"type": "judge", "cat": "money", "q": "判断正误：『不舍得花钱』的人一定不是物质驱动的人，也不是情感驱动的人；因为情感驱动的人很喜欢给大家花钱，为了让大家开心不太考虑钱这个东西。", "ans": true, "exp": "原文：不舍得花钱一定不是物质驱动的人，也不是情感驱动的人。情感驱动的人会很喜欢给大家花钱，为了让大家开心是不太考虑钱这个东西的。", "options": [], "id": "Q1008"}, {"type": "single", "cat": "money", "q": "在“越花越有钱”的金钱观中，哪一类驱动力组合的人花钱会越花越有钱（能把钱花对地方、其花费能带来情和价值的回报）？", "options": ["情感驱动+物质驱动", "精神驱动+责任感驱动", "自我价值感驱动+情感驱动", "责任感驱动+物质驱动"], "ans": 0, "exp": "原文：情感驱动+物质驱动的人花钱会越花越有钱。因为会把钱花对地方。…钱本身有价值，情感驱动的人花钱会带来情，物质驱动的人花钱会带来价值，比如说投资、人情。", "id": "Q1009"}, {"type": "single", "cat": "money", "q": "『最大方、吃饭主动买单、愿意花自己的钱甚至约会也自己花钱』的女生，其最主要的驱动力配置是哪一项？", "options": ["主要是精神驱动的", "最主要的配置是情感驱动的，其次是物质驱动", "主要是自我价值感驱动的", "主要是责任感驱动的"], "ans": 1, "exp": "原文：最大方的女生，吃饭主动买单，愿意花自己的女生，甚至和男生出去约会也自己花钱的。最主要的配置是情感驱动的。其次是物质驱动。", "id": "Q1010"}, {"type": "single", "cat": "money", "q": "从五行的相生关系看财星的来源，『食伤（食神、伤官）』与财星之间的关系是下列哪一项？", "options": ["食伤克财星", "财星生食伤", "食伤是财星之源，食伤是生财的", "食伤与财星无关"], "ans": 2, "exp": "原文：这是食神之间相生相克之间的关系，所以食伤是财星之源，食伤是生财的。", "id": "Q1011"}, {"type": "judge", "cat": "drive", "q": "判断正误：五行十神中，印星对应的是情感驱动的人。是（）", "ans": false, "exp": "原文：印星（正印、偏印）=精神驱动", "id": "Q1012"}, {"type": "judge", "cat": "drive", "q": "判断正误：五行十神中，官星对应的是物质驱动的人。是（）", "ans": false, "exp": "原文：官星（正官、七杀）=责任感驱动", "id": "Q1013"}, {"type": "judge", "cat": "drive", "q": "判断正误：五行十神中，财星对应的是自我价值感驱动的人。是（）", "ans": false, "exp": "原文：财星（正财、偏财）=物质驱动", "id": "Q1014"}, {"type": "judge", "cat": "drive", "q": "判断正误：五行十神中，比劫（比肩劫财）对应的是责任感驱动。是（）", "ans": false, "exp": "原文：比劫（比肩、劫财）=自我价值感驱动", "id": "Q1015"}, {"type": "judge", "cat": "drive", "q": "判断正误：情感驱动的人是通过动应生我的五行来实现阴阳平衡。是（）", "ans": false, "exp": "原文：情感驱动的人实现阴阳平衡的方式就是用我所生的五行…我是水，就用木实现平衡。", "id": "Q1016"}, {"type": "judge", "cat": "drive", "q": "判断正误：精神驱动的人是通过动应我所生的五行来实现阴阳平衡。是（）", "ans": false, "exp": "原文：精神驱动的人实现阴阳平衡的方式就是用生我的五行…我是水，就用金实现平衡。", "id": "Q1017"}, {"type": "judge", "cat": "drive", "q": "判断正误：责任感驱动的人是通过动应我克的五行来实现阴阳平衡。是（）", "ans": false, "exp": "原文：责任感驱动的人实现阴阳平衡的方式就是用克我的五行…我是水，就用土实现平衡。", "id": "Q1018"}, {"type": "judge", "cat": "drive", "q": "判断正误：物质驱动的人是通过动应克我的五行来实现阴阳平衡。是（）", "ans": false, "exp": "原文：物质驱动的人实现阴阳平衡的方式就是用我克的五行…我是水，就用火实现平衡。", "id": "Q1019"}, {"type": "judge", "cat": "drive", "q": "判断正误：五种内在驱动力最多可以在一个人身上同时出现五种。是（）", "ans": false, "exp": "原文：5种驱动力在一个人的生命中最多可以出现4种。", "id": "Q1020"}, {"type": "judge", "cat": "drive", "q": "判断正误：一个人至少拥有两种以上的内在驱动力。是（）", "ans": false, "exp": "原文：一个人至少有一种内在驱动力，最多有4种。", "id": "Q1021"}, {"type": "judge", "cat": "drive", "q": "判断正误：五种驱动力只是人为设定的规则，与金木水火土的五行能量没有任何对应关系。是（）", "ans": false, "exp": "原文：5种是因为它直接对应着五行的能量。", "id": "Q1022"}, {"type": "judge", "cat": "drive", "q": "判断正误：十天干只是承载五行的符号，与八卦没有任何对应关系。是（）", "ans": false, "exp": "原文：比如说甲乙丙丁戊己庚辛壬癸，十天干就是八卦。", "id": "Q1023"}, {"type": "judge", "cat": "drive", "q": "判断正误：在阴阳平衡的维度上，一个人身弱或身强本身就蕴含着吉凶的好坏含义。是（）", "ans": false, "exp": "原文：在阴阳平衡的维度上，一个自身的五行能量的强弱，并没有吉凶的含义。", "id": "Q1024"}, {"type": "judge", "cat": "drive", "q": "判断正误：在干支历法的太极中，自我的定位是以年柱的天干为依据。是（）", "ans": false, "exp": "原文：人，自我的定位，就是以日柱的天干为定位的。", "id": "Q1025"}, {"type": "judge", "cat": "drive", "q": "判断正误：一个人的太极中缺少了某种五行，就一定会造成阴阳失衡的大凶之局。是（）", "ans": false, "exp": "原文：如果你没有某一种五行你的太极的阴阳平衡又不需要动用到这种五行，那这就是大吉之相。", "id": "Q1026"}, {"type": "judge", "cat": "drive", "q": "判断正误：太极层面的平衡与五行层面的多与少、有几个五行，有直接的因果关系。是（）", "ans": false, "exp": "原文：所以太极层面的平衡，跟五行层面的多与少，又没有因果关系。", "id": "Q1027"}, {"type": "judge", "cat": "drive", "q": "判断正误：夫妻宫在传统命理中指的是月支。是（）", "ans": false, "exp": "原文：婚姻是日柱的地支。也就是日支。在传统命理学当中，日支=夫妻宫。", "id": "Q1028"}, {"type": "judge", "cat": "drive", "q": "判断正误：五行取象关注的是人的社会地位与相生相克关系，与身体健康无关。是（）", "ans": false, "exp": "原文：五行取象关注的是五行的存在状态，就是和人的身体健康有关系的东西。比如说木为肝，肾为水。", "id": "Q1029"}, {"type": "judge", "cat": "drive", "q": "判断正误：十神取象关系来源于五行纯粹的存在状态规律，与八卦层面的相生相克无关。是（）", "ans": false, "exp": "原文：十神取象是基于八卦层面上的相生相克的关系而产生的，这叫十神关系。", "id": "Q1030"}, {"type": "judge", "cat": "drive", "q": "判断正误：情的定位，在易经中以印星的吉凶为定位。是（）", "ans": false, "exp": "原文：情的定位，就是自身五行所生的东西，食伤的吉凶直接决定了你是不是情感驱动的人。", "id": "Q1031"}, {"type": "judge", "cat": "drive", "q": "判断正误：爱的定位，在易经中以食伤的吉凶为定位。是（）", "ans": false, "exp": "原文：爱的定位是什么…生你的东西的能量就是爱的能量。这个在十神象当中我们把它称作印星。", "id": "Q1032"}, {"type": "judge", "cat": "drive", "q": "判断正误：命理中所说的核心驱动力，指的就是命理学中的忌神。是（）", "ans": false, "exp": "原文：核心驱动力，就是实现自身内在五行平衡，最核心的动应，即命理学中的用神。", "id": "Q1033"}, {"type": "judge", "cat": "drive", "q": "判断正误：人的驱动力直接决定了一个人此生会获得怎样的世俗成就。是（）", "ans": false, "exp": "原文：驱动力决定的是性格，和一个人会获得怎么样的世俗成就没有因果关系。", "id": "Q1034"}, {"type": "judge", "cat": "drive", "q": "判断正误：在五种驱动力的配对中，情感驱动的女人对应的是精神驱动的男人。是（）", "ans": false, "exp": "原文：情感驱动女人 X 责任感驱动男人", "id": "Q1035"}, {"type": "judge", "cat": "drive", "q": "判断正误：在五种驱动力的配对中，精神驱动的女人对应的是自我价值感驱动的男人。是（）", "ans": false, "exp": "原文：精神驱动女人 X 情感驱动男人", "id": "Q1036"}, {"type": "judge", "cat": "drive", "q": "判断正误：在五种驱动力的配对中，自我价值感驱动的女人对应的是精神驱动的男人。是（）", "ans": false, "exp": "原文：自我价值感驱动女人 X 物质驱动男人", "id": "Q1037"}, {"type": "judge", "cat": "drive", "q": "判断正误：在五种驱动力的配对中，责任感驱动的女人对应的是情感驱动的男人。是（）", "ans": false, "exp": "原文：责任感驱动女人 X 自我价值感驱动男人", "id": "Q1038"}, {"type": "judge", "cat": "drive", "q": "判断正误：愿力驱动的本质，是情感驱动与责任感驱动相结合的产物。是（）", "ans": false, "exp": "原文：愿力驱动=精神驱动+责任感驱动", "id": "Q1039"}, {"type": "judge", "cat": "drive", "q": "判断正误：由责任感驱动显化出的财富量级通常小于物质驱动。是（）", "ans": false, "exp": "原文：由责任感驱动出的财富量级，远远大于物质驱动。", "id": "Q1040"}, {"type": "judge", "cat": "drive", "q": "判断正误：身弱的人，绝大多数都是情感驱动的人。是（）", "ans": false, "exp": "原文：身弱的人，大多数是百分之六七十，都是自我价值感驱动的人。", "id": "Q1041"}, {"type": "judge", "cat": "drive", "q": "判断正误：责任感驱动的人遇到压力时通常会选择逃避，而不会把它转化为动力。是（）", "ans": false, "exp": "原文：不像责任感驱动的人遇到压力会变成动力。", "id": "Q1042"}, {"type": "judge", "cat": "drive", "q": "判断正误：物质驱动的人本质上对赚钱这件事非常感兴趣，并以此为做事发心。是（）", "ans": false, "exp": "原文：物质驱动的人，本质上对于赚钱这件事情没有兴趣，但是他能够通过去运用物质，实现自身的平衡。", "id": "Q1043"}, {"type": "judge", "cat": "drive", "q": "判断正误：在易经万物类象中，人的精神与情感并不相克，二者是完全等同的能量。是（）", "ans": false, "exp": "原文：人的精神与情感相克而成太极。", "id": "Q1044"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的人同精神驱动的人一样，追求的是内在的平静。是（）", "ans": false, "exp": "原文：对于精神驱动的人来说，能够拥有平静的内在世界，就是能量最高的状态。但情感驱动不是，要的反而是热闹，人间烟火。", "id": "Q1045"}, {"type": "judge", "cat": "love", "q": "判断正误：自我价值感驱动的女人感受爱的方式完全不看重伴侣为她花多少钱。是（）", "ans": false, "exp": "原文：自我价值感驱动的女人衡量自我价值的方式，是男人愿意给他花多少钱。", "id": "Q1046"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的人通常会先动脑思考，再决定要不要去做某件事。是（）", "ans": false, "exp": "原文：有情的人不爱思考，不爱动脑，很多事情他是不想的。", "id": "Q1047"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的人会有很强的赚钱念头的驱使。是（）", "ans": false, "exp": "原文：情感驱动的人不会有想搞钱这个念头，没有这个念头的人就能有钱。", "id": "Q1048"}, {"type": "judge", "cat": "love", "q": "判断正误：有情的女人表达情感时最喜欢说的三个字是我爱你。是（）", "ans": false, "exp": "原文：有情的女人表达自己的情感，不是说我爱你。应该说的是，我很喜欢你。", "id": "Q1049"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的人习惯用冷暴力来处理矛盾冲突。是（）", "ans": false, "exp": "原文：有积极情感驱动的男人…绝对不冷暴力，不会冷漠。一定主动沟通，哄人。", "id": "Q1050"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的人最喜欢安静独处，讨厌人群和热闹。是（）", "ans": false, "exp": "原文：情感驱动的人从来不怕陌生人，不怕人多，共情能力越强的人越不怕陌生人。", "id": "Q1051"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的人不擅长让自己和别人开心起来。是（）", "ans": false, "exp": "原文：情感驱动的人很容易开心起来，也很容易让别人开心起来，喜欢小朋友。", "id": "Q1052"}, {"type": "judge", "cat": "love", "q": "判断正误：有情的人在吵架时最喜欢翻旧账，把陈年旧事都翻出来吵。是（）", "ans": false, "exp": "原文：吵架不翻旧账，吵的就是当下的态度不好。以前的事都不记得了。", "id": "Q1053"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的人睡眠质量最差，经常烦恼得睡不着。是（）", "ans": false, "exp": "原文：情感驱动的人睡眠质量最高，哪怕有烦恼也不影响睡觉，可以秒睡。", "id": "Q1054"}, {"type": "judge", "cat": "love", "q": "判断正误：精神驱动的人需要很长的睡眠时间，打坐无法代替休息。是（）", "ans": false, "exp": "原文：精神驱动的人需要的睡眠时间最少。打坐都可以代替睡觉。", "id": "Q1055"}, {"type": "judge", "cat": "love", "q": "判断正误：有爱的人看到伴侣流泪无助时，会立刻心疼并马上心软妥协。是（）", "ans": false, "exp": "原文：有爱的人看到女人流泪是不会心疼的，甚至会觉得开心。", "id": "Q1056"}, {"type": "judge", "cat": "love", "q": "判断正误：有情的女人花男人的钱时毫无压力，甚至觉得理所当然。是（）", "ans": false, "exp": "原文：有情的女人花了男人的钱，会感到惭愧，会感到纠结，不开心。", "id": "Q1057"}, {"type": "judge", "cat": "love", "q": "判断正误：有情的女人会主动去魅惑、撩拨男人的情和欲望。是（）", "ans": false, "exp": "原文：有情的女人从来不魅惑、不诱惑、不吸引男人，不撩拨男人的情和欲。", "id": "Q1058"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的女人是最容易被渣男欺骗和玩弄的类型。是（）", "ans": false, "exp": "原文：最容易被渣的是精神驱动的女生。情感驱动的女生通常是不吸渣的。", "id": "Q1059"}, {"type": "judge", "cat": "love", "q": "判断正误：有情的女人最容易成为海后，脚踏多条船、频繁更换伴侣。是（）", "ans": false, "exp": "原文：有情的女生100%做不了海后。", "id": "Q1060"}, {"type": "judge", "cat": "love", "q": "判断正误：海后一定是情感驱动的女生。是（）", "ans": false, "exp": "原文：海后一定是精神驱动的女生。", "id": "Q1061"}, {"type": "judge", "cat": "love", "q": "判断正误：分手之后，只有情感驱动的人是不会主动联系的那一方。是（）", "ans": false, "exp": "原文：分手之后，情感驱动的男人或者女人，只要想念就会主动。", "id": "Q1062"}, {"type": "judge", "cat": "love", "q": "判断正误：有情的女人冷漠起来，比任何人都彻底绝情。是（）", "ans": false, "exp": "原文：有情的女人通常是冷漠不起来的。女人冷漠是因为没有慈悲心，无情。", "id": "Q1063"}, {"type": "judge", "cat": "love", "q": "判断正误：有情的女人非常擅长拿捏男人的情绪和心思。是（）", "ans": false, "exp": "原文：有情的女人自己就是恋爱脑，不可能拿捏男人。", "id": "Q1064"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的人做事的发心，通常以追求现实的利益回报为主。是（）", "ans": false, "exp": "原文：情感驱动的人做事的发心就是开心就好。", "id": "Q1065"}, {"type": "judge", "cat": "love", "q": "判断正误：精神驱动的女人往往比情感驱动的女人更难走出失恋。是（）", "ans": false, "exp": "原文：精神驱动的女生比情感驱动的在恋爱结束后更容易走出来，相对不那么痛苦。", "id": "Q1066"}, {"type": "judge", "cat": "love", "q": "判断正误：有情的女人在感情中非常在意男人的物质条件和身份地位。是（）", "ans": false, "exp": "原文：情感驱动的女人在感情中不太在意物质。", "id": "Q1067"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的人一般都极度挑剔，看谁都看不顺眼。是（）", "ans": false, "exp": "原文：情感驱动的人一般不挑剔，挑剔有可能是过度情感驱动。", "id": "Q1068"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的人普遍性格内向、社恐、话少。是（）", "ans": false, "exp": "原文：情感驱动的一般都比较外向，因为他有表达欲、分享欲，和人共情。", "id": "Q1069"}, {"type": "judge", "cat": "love", "q": "判断正误：只有精神驱动的人才会在被冤枉时极力自证、滔滔申辩。是（）", "ans": false, "exp": "原文：越有情越不能被冤枉。别人一旦误解比什么都难受。", "id": "Q1070"}, {"type": "judge", "cat": "love", "q": "判断正误：有情的女人对普通男人也非常热情，会耐心听对方讲很多话。是（）", "ans": false, "exp": "原文：有情的女人只跟自己喜欢的人话多，男人但凡多一句废话都感到很厌恶。", "id": "Q1071"}, {"type": "judge", "cat": "love", "q": "判断正误：有情的女人特别擅长讨好男人，以此博取对方的欢心。是（）", "ans": false, "exp": "原文：情感驱动的女人一点都不会讨好男人的。", "id": "Q1072"}, {"type": "judge", "cat": "love", "q": "判断正误：在亲密关系中，推动感情走向的关键往往是更理性、更有爱的一方。是（）", "ans": false, "exp": "原文：有情的一方才是推动情感的关键。谁有情谁主动。", "id": "Q1073"}, {"type": "judge", "cat": "love", "q": "判断正误：自我价值感驱动的女人感受爱的方式，是用理性用爱来证明，而不是用男人花的钱。是（）", "ans": false, "exp": "原文：她感受爱的方式是男人给她花钱。", "id": "Q1074"}, {"type": "judge", "cat": "love", "q": "判断正误：精神驱动的女人非常讨厌男人向她主动献殷勤、表达情感。是（）", "ans": false, "exp": "原文：需要男人对她有表达欲…她需要男人对她有情欲占有欲控制欲、殷勤。", "id": "Q1075"}, {"type": "judge", "cat": "love", "q": "判断正误：有爱的女人（精神驱动）在感情中非常主动，总是主动追求对方。是（）", "ans": false, "exp": "原文：有爱的女人从来不对男人主动动手，从来不主动亲男人。因为一主动就得不到男人的情。", "id": "Q1076"}, {"type": "judge", "cat": "love", "q": "判断正误：精神驱动的女人谈恋爱时不权衡得失，完全靠直觉冲动。是（）", "ans": false, "exp": "原文：有爱代表理性，动脑子谈恋爱，需要思考，要权衡利弊。", "id": "Q1077"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动与责任感驱动在一个人身上可以轻易同时达到顶峰并互相促进。是（）", "ans": false, "exp": "原文：情与责任感虽然是互相矛盾的，情越重越难负责任。因为情克责任感。", "id": "Q1078"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动与精神驱动两种类型是一一对应、完全等同的。是（）", "ans": false, "exp": "原文：情感驱动和精神驱动并不是一一对应的关系，只是常常有伴随关系。", "id": "Q1079"}, {"type": "judge", "cat": "love", "q": "判断正误：精神驱动的女人最需要的是男人的陪伴，而不是男人的情。是（）", "ans": false, "exp": "原文：精神驱动的女人的精神食粮是男人的情。", "id": "Q1080"}, {"type": "judge", "cat": "love", "q": "判断正误：责任感驱动的女人需要男人给她提供丰沛的情感和爱意。是（）", "ans": false, "exp": "原文：针对只有责任感驱动的女人来说，她不需要别的东西，只需要男人的存在。", "id": "Q1081"}, {"type": "judge", "cat": "love", "q": "判断正误：物质驱动的女人需要的是男人的钱和物质给予。是（）", "ans": false, "exp": "原文：物质驱动的女人，需要的是男人的爱。", "id": "Q1082"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的男人最需要的是同样情感驱动、热情主动表达的女人。是（）", "ans": false, "exp": "原文：情感驱动的男人，他一定要是精神驱动的女人。也就是说他需要一个有智慧的女人。", "id": "Q1083"}, {"type": "judge", "cat": "love", "q": "判断正误：回避型依恋的女生，通常都是无情无爱的人，回避的是男人的金钱。是（）", "ans": false, "exp": "原文：回避型依恋的女生100%是有情的人…女人回避的是男人的情。", "id": "Q1084"}, {"type": "judge", "cat": "love", "q": "判断正误：真正有情的女人也喜欢用冷暴力与男人对抗。是（）", "ans": false, "exp": "原文：真正有情的女人也不吵架，害怕冲突。", "id": "Q1085"}, {"type": "judge", "cat": "love", "q": "判断正误：有情的女人从不会主动跟自己喜欢的人分享日常。是（）", "ans": false, "exp": "原文：有情的女人就喜欢不停跟她喜欢的人分享。", "id": "Q1086"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的女生越善于给男人提供情绪价值（哄人夸人）就越陷入被动。是（）", "ans": false, "exp": "原文：能够毫无负担的给对方提供情绪价值…女人越能给男人情绪价值，男人发挥他自己价值的能力就越强。", "id": "Q1087"}, {"type": "judge", "cat": "love", "q": "判断正误：有情的男人跟每一个喜欢的女人相处都会保持理性和克制，从不表达真心。是（）", "ans": false, "exp": "原文：有情的男人对每一个女生都是真诚的喜欢。他想给每一个他喜欢的女生一个家。", "id": "Q1088"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的人是对人情世故最不感兴趣、最不会来事的类型。是（）", "ans": false, "exp": "原文：对人情世故没有兴趣的人不会是情感驱动。情感驱动最擅长人情世故。", "id": "Q1089"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的女人在身材或外形上最自信，从不害怕被看轻。是（）", "ans": false, "exp": "原文：情感驱动的女人，恐惧自己被轻贱，恐惧对方因为自己的喜欢而傲慢。", "id": "Q1090"}, {"type": "judge", "cat": "love", "q": "判断正误：最能旺夫的女人反而是冷静理性的女人，情感越多越阻碍丈夫事业。是（）", "ans": false, "exp": "原文：最旺夫的女人就是多情的女人，情越多，对方事业会做的越大。", "id": "Q1091"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的男人几乎不可能被夸赞和肯定所打动。是（）", "ans": false, "exp": "原文：情感驱动的男人很好哄，只要不停夸，不停喜欢他就行了。", "id": "Q1092"}, {"type": "judge", "cat": "love", "q": "判断正误：情感驱动的男人都很理性冷漠，不擅长表达和哄人。是（）", "ans": false, "exp": "原文：情感驱动的男人会主动的追求，会表达，会共情，他会给大家提供情绪价值，他会献殷勤。", "id": "Q1093"}, {"type": "judge", "cat": "scene", "q": "判断正误：易经最重要的价值在于预测吉凶，而并不关心解决人类的心灵问题。是（）", "ans": false, "exp": "原文：易经最重要的价值就是解决人类的心灵问题。", "id": "Q1094"}, {"type": "judge", "cat": "scene", "q": "判断正误：失恋带来的痛苦，主要来源于那个人的本身价值有多高。是（）", "ans": false, "exp": "原文：比如失恋，让我们痛苦的不是那个人，是在那个时期我们对那一个人的执着。", "id": "Q1095"}, {"type": "judge", "cat": "scene", "q": "判断正误：父母的因果或父母自身的好坏，会直接决定子女是否能够幸福。是（）", "ans": false, "exp": "原文：父母的因果并不会成为我们子女是否幸福的原因。", "id": "Q1096"}, {"type": "judge", "cat": "scene", "q": "判断正误：导致我们痛苦的根源是自身阴阳平衡状态失衡，而非错误的知见。是（）", "ans": false, "exp": "原文：导致我们痛苦的根源不是自身的不平衡而是错误的知见。", "id": "Q1097"}, {"type": "judge", "cat": "scene", "q": "判断正误：处理好与父母关系的结果，就意味着一定要与父母非常亲密、常伴左右。是（）", "ans": false, "exp": "原文：你处理好你与自己的父母的关系的结果，并不意味着你一定要与父母非常的亲密。", "id": "Q1098"}, {"type": "judge", "cat": "scene", "q": "判断正误：孩子早运如果与父母气运形成鲜明反差，反而代表与亲生父母的姻缘非常深厚。是（）", "ans": false, "exp": "原文：如果孩子的气运与父母形成了鲜明的矛盾与反差的时候，这就意味着从出生开始，你与亲生父母的姻缘，就会非常的浅薄。", "id": "Q1099"}, {"type": "judge", "cat": "scene", "q": "判断正误：你与父母之间的姻缘，完全是由你自身的情感模式投影出来的，与共业招感无关。是（）", "ans": false, "exp": "原文：父母是共业招感而来的，他并不像夫妻伴侣…是由你自身的情感模式投影出来的。", "id": "Q1100"}, {"type": "judge", "cat": "scene", "q": "判断正误：对父母投身影怨恨、评判和分别心，恰恰是尽孝的体现。是（）", "ans": false, "exp": "原文：你对父母所投射的分别心…就是你自身的业障。", "id": "Q1101"}, {"type": "judge", "cat": "scene", "q": "判断正误：婚姻代表一个人对伴侣深厚的爱情和喜欢的需求。是（）", "ans": false, "exp": "原文：婚姻代表一个人对于归属感的需求。和爱不爱、喜不喜欢都没有关系。", "id": "Q1102"}, {"type": "judge", "cat": "scene", "q": "判断正误：婚姻与感情之间存在直接的因果关系，感情极好的人就一定要结婚。是（）", "ans": false, "exp": "原文：但是婚姻本身与情感是独立的定位。不能因为感情很好，就一定要结婚。", "id": "Q1103"}, {"type": "judge", "cat": "scene", "q": "判断正误：情感驱动的人做起事来以“应该”为发心，凡事都以责任为重？", "ans": false, "exp": "原文：情感驱动的特点：自己开心最重要，尊重自己的感受。…开心的时候随便做什么事，不开心的时候什么事都别做。", "id": "Q1104"}, {"type": "judge", "cat": "scene", "q": "判断正误：精神驱动的人表达欲和分享欲极强，是人群中最健谈最爱讲话的一类？", "ans": false, "exp": "原文：精神驱动的人不爱讲话，没有表达欲，没有分享欲…精神驱动的人话是最少的。有爱的人没有表达欲。", "id": "Q1105"}, {"type": "judge", "cat": "scene", "q": "判断正误：责任感驱动的人话多是因爱闲聊，话多也意味着社会地位较低？", "ans": false, "exp": "原文：责任感的话少和精神驱动的话少又不同，责任感的人话少是因为贵气。…话少的人讲话有分量。", "id": "Q1106"}, {"type": "judge", "cat": "scene", "q": "判断正误：情感驱动的人没有分享欲和表达欲，最讨厌跟自己喜欢的人讲废话？", "ans": false, "exp": "原文：情感驱动的人一定有分享欲、表达欲。情越多分享欲越强。…情感驱动的人喜欢和自己喜欢的人讲废话。", "id": "Q1107"}, {"type": "judge", "cat": "scene", "q": "判断正误：物质驱动的人对金钱极其看重，凡事都以赚钱为目的去做？", "ans": false, "exp": "原文：物质驱动的人最不看重物质。不会以赚钱为目的做事情。", "id": "Q1108"}, {"type": "judge", "cat": "scene", "q": "判断正误：自私是情感驱动的人最典型的性格特征？", "ans": false, "exp": "原文：情感驱动是最不自私的，甚至有讨好型人格，巴不得把所有东西给别
