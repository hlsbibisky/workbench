<html lang="zh"><head>

<title>八字五行驱动力 · 自测问答卡</title>
<style>
  :root{
    --bg:#f4f1ea; --bg2:#ffffff; --ink:#2c2a26; --muted:#8a8378;
    --rule:#e2dccb; --accent:#8b5a2b; --accent2:#6b8e5a;
    --brand-soft:#f3ede0; --ok:#3f7d4e; --no:#b04a3a; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;line-height:1.7;min-height:100vh}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  header.top{text-align:center;padding:10px 0 22px}
  header.top h1{font-size:26px;letter-spacing:2px;color:var(--accent)}
  header.top p{color:var(--muted);font-size:14px;margin-top:6px}
  .stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
  .stat{background:var(--bg2);border:1px solid var(--rule);border-radius:var(--radius);padding:12px 8px;text-align:center}
  .stat b{display:block;font-size:22px;color:var(--accent)}
  .stat span{font-size:12px;color:var(--muted)}
  .tabbar{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 6px;justify-content:center}
  .tab{cursor:pointer;border:1px solid var(--rule);background:var(--bg2);color:var(--ink);border-radius:999px;padding:8px 16px;font-size:14px;transition:.15s}
  .tab:hover{border-color:var(--accent)}
  .tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tab .n{font-size:11px;opacity:.75;margin-left:4px}
  .hint{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 18px;min-height:20px}
  .toolbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
  .btn{cursor:pointer;border:none;border-radius:10px;padding:11px 20px;font-size:14px;transition:.15s;background:var(--accent);color:#fff}
  .btn.ghost{background:var(--bg2);border:1px solid var(--rule);color:var(--ink)}
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .card{background:var(--bg2);border:1px solid var(--rule);border-radius:var(--radius);padding:26px 28px;margin:10px 0;box-shadow:0 2px 10px rgba(0,0,0,.03)}
  .qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;align-items:center}
  .chip{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--brand-soft);color:var(--accent)}
  .chip.t{background:#eef1ec;color:var(--accent2)}
  .qnum{color:var(--muted);font-size:13px}
  .q{font-size:19px;font-weight:600;line-height:1.6;margin:10px 0 8px}
  .q em{color:var(--accent);font-style:normal;background:#faf3e3;padding:0 4px;border-radius:4px}
  .options{margin:16px 0 8px;display:flex;flex-direction:column;gap:10px}
  .opt{border:1px solid var(--rule);border-radius:10px;padding:12px 16px;cursor:pointer;transition:.12s;background:#fff;display:flex;gap:10px;align-items:flex-start}
  .opt:hover{border-color:var(--accent)}
  .opt .key{color:var(--muted);font-weight:600;min-width:20px}
  .opt.picked{border-color:var(--accent);background:var(--brand-soft)}
  .opt.ok{border-color:var(--ok);background:#edf6ef}
  .opt.bad{border-color:var(--no);background:#f9eeee}
  .opt.readonly{cursor:default}
  .ans-show{background:#fbf7ec;border:1px solid var(--rule);border-left:5px solid var(--accent);border-radius:10px;padding:16px;margin-top:14px}
  .ans-show .alabel{font-weight:700;color:var(--accent);margin-bottom:6px}
  .ans-show .ansline{font-size:17px}
  .ans-show .explain{margin-top:10px;color:var(--muted);font-size:14px;border-top:1px solid var(--rule);padding-top:10px}
  .ans-show .explain b{color:var(--ink)}
  .short-in{border:1px solid var(--rule);border-radius:10px;padding:12px;width:100%;font-size:15px;margin:12px 0;resize:vertical;min-height:84px;font-family:inherit}
  .short-in:focus{outline:none;border-color:var(--accent)}
  .giveup{text-align:center;margin:14px 0;color:var(--muted);font-size:13px}
  .giveup span{cursor:pointer;color:var(--accent);text-decoration:underline}
  .flush-centered{text-align:center;padding:50px 20px;color:var(--muted);font-size:15px}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}
  .bar{height:6px;background:var(--rule);border-radius:999px;overflow:hidden;margin:8px 0}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .progress{color:var(--muted);font-size:13px;text-align:center;margin:8px 0 2px}
  a{color:var(--accent)}
  @media(max-width:600px){ .q{font-size:17px} .card{padding:20px 16px} .stat b{font-size:18px} }
</style>
</head>

<script>
(function(){
  const DATA = {"meta": {"title": "八字五行驱动力 · 自测问答卡", "subtitle": "随机抽卡式自测 · 全篇五大主题 · 题库大幅扩充且题干完整化", "version": "3.0（1011题完整题干版）", "total": 1273}, "categories": [{"id": "drive", "name": "驱动力总论", "icon": "🧭", "hint": "五种驱动力定义、特征、组合、辨析、五行与过度形态"}, {"id": "love", "name": "情与爱·情感关系", "icon": "💞", "hint": "情的本质、爱的本质、情感模式、情执我执、伴侣相处、婚姻配对"}, {"id": "parent", "name": "亲子关系", "icon": "👨‍👩‍👧", "hint": "与父母、母子/父子、亲缘定位、孝与了缘"}, {"id": "scene", "name": "生活观人", "icon": "🔍", "hint": "从行为反推驱动力、性格观人、生活场景"}, {"id": "money", "name": "金钱与财富", "icon": "💰", "hint": "财富显化、赚钱花钱、正财偏财、炒股、孝与财"}], "questions": [{"type": "multi", "cat": "drive", "q": "关于\"每种核心驱动力都有自身的靠谱与不靠谱\"，下列说法正确的是？", "options": ["有情的人不负责任", "有爱的人没有感情", "物质驱动的人不想赚钱（本质上对赚钱没兴趣）", "物质驱动的人是特别想赚钱的人"], "ans": [0, 1, 2], "exp": "原文：每种核心驱动力都有自身的靠谱与不靠谱：有情的人不负责任，有爱的人没有感情，物质驱动的人不想赚钱…物质驱动的人本质上对赚钱没兴趣，但能通过运用物质实现自身平衡。", "id": "Q0001"}, {"type": "multi", "cat": "drive", "q": "关于每个人的独特平衡点，下列说法正确的是？", "options": ["每个人的平衡点都不一样", "别人走过的路不一定适合你", "在别人身上学不到实际经验", "只有自己在生命实践中寻找内在平衡后才能外显相应的关系平衡"], "ans": [0, 1, 2, 3], "exp": "原文：每个人的平衡点都不一样，别人走过的路不一定适合你；在别人身上学不到实际经验，只有自己在生命实践中寻找内在自我的平衡后，才能外显出属于自己的亲密关系、亲子关系、原生家庭关系的平衡。", "id": "Q0002"}, {"type": "multi", "cat": "drive", "q": "在《八字五行驱动力》中，关于'过度的自我价值感驱动'，下列哪些是它表现出来的特征？（多项）", "options": ["永远想找事情做但什么事都做不成、永远不靠谱", "不以赚钱为目的做事但实际所有事都为赚钱所以永远赚不到钱", "非常固执、好争、自私", "特别大方爱借钱给人"], "ans": [0, 1, 2], "exp": "原文：过度的自我价值感驱动…永远都想找事情做，但什么事都做不成，永远不靠谱。他不以赚钱为目的去做事情，但实际上他做的所有的事情都在以赚钱为目的做事，所以他也永远赚不到钱……非常固执、好争，而且自私。", "id": "Q0003"}, {"type": "multi", "cat": "drive", "q": "以下关于'精神力'与'情感'两种能量特性的描述，哪些是正确的？（多项）", "options": ["情感越丰富，对生活的热情和创造力就越强", "情感过度丰富则偏向任性、不负责任", "精神力越强大，内心越趋于平静、承担责任能力越强", "过度理性会孤独不合群、失去生命活力"], "ans": [0, 1, 2, 3], "exp": "原文：情感越丰富，对生活的热情和创造力就越强；若情感过度丰富，则偏向于任性、不负责任。精神力越强大，内心越趋于平静，承担责任的能力越强。过度的理性则孤独不合群，会失去生命的活力。", "id": "Q0004"}, {"type": "multi", "cat": "drive", "q": "在五行驱动力理论中，下列哪些属于'没有责任感（非责任感驱动）'的表现？（多项）", "options": ["做事没有分寸、抢别人资源", "做不了决定、缺乏目标", "说谎、言行不一、对自己说的话不负责任", "主动承担很多责任"], "ans": [0, 1, 2], "exp": "原文：9、没有责任感的表现 做事情没有分寸的人（会抢别人资源之类的）……说谎、言行不一，对自己说的话不负责任……做不了决定，做不了决定因为缺乏目标。", "id": "Q0005"}, {"type": "multi", "cat": "drive", "q": "在《八字五行驱动力》的万物类象中，'贪求心'除了对物质、钱财的贪（金钱焦虑的来源）之外，还可以表现在对情感的贪求上；下列哪些属于贪求心的表现？（多项）", "options": ["对物质、钱财的贪（金钱焦虑的来源）", "对父母的爱/情/陪伴的贪求", "对伴侣的情与爱及陪伴的贪求", "对子女的情与爱及陪伴的贪求"], "ans": [0, 1, 2, 3], "exp": "原文：贪求心特指对物质、钱财的贪（对金钱焦虑的来源）；此外贪求心还可表现在对情感的贪——如对父母的爱/情/陪伴的贪求、对伴侣的情与爱及陪伴的贪求、对子女的情与爱及陪伴的贪求…", "id": "Q0006"}, {"type": "multi", "cat": "drive", "q": "在五行驱动力理论中，下列哪些属于'过度情感驱动'的负面表现？（多项）", "options": ["开心不起来，容易有嗔恨心、怨念，爱挑毛病", "吵架翻旧账、记仇、在意对方态度", "超强的控制欲、占有欲、我慢心", "超多负能量、负面情绪"], "ans": [0, 1, 2, 3], "exp": "原文：开心不起来，很容易有嗔恨心、怨念……吵架翻旧账，记仇……超强的控制欲、占有欲、我慢心，导致超强的嗔恨心、愤怒、怨气。超多负能量、负面情绪。", "id": "Q0007"}, {"type": "multi", "cat": "drive", "q": "以下哪些状态是一个人精神内耗、情感障碍产生的根源？（多选）", "options": ["无法自我接纳", "无法自我理解", "无法自我合理化", "过于自信"], "ans": [0, 1, 2], "exp": "原文：无法自我接纳、无法自我理解、无法自我合理化，就是一个人的精神内耗、情感障碍产生的根源所在。", "id": "Q0008"}, {"type": "multi", "cat": "drive", "q": "学习易经要成就的目标包括下列哪些？（多项）", "options": ["提升人类整体的生命意识维度", "树立完善的人格，知晓为人处世的道理", "认识自己的心，破除对自我的执着、对治烦恼、停止内耗", "追求外在权势和财富多寡"], "ans": [0, 1, 2], "exp": "原文：提升人类整体的生命意识维度…树立完善的人格，知晓为人处世的道理。认识自己的心，破除对自我的执着，对治自己的烦恼，停止内耗…", "id": "Q0009"}, {"type": "multi", "cat": "drive", "q": "在驱动力理论中，天道的“韵律”与“律令”分别是指什么？（多项）", "options": ["循环是天道的韵律，包含生死轮回、物质转化、能量流动", "因果是天道的律令", "一阴一阳之谓道是唯一的法则，不含循环", "没有绝对的起点与终点，一切在无尽循环中演进"], "ans": [0, 1, 3], "exp": "原文：循环是天道的韵律：生死轮回、物质转化、能量流动，没有绝对的起点与终点。因果是天道的律令…如是因，如是果。", "id": "Q0010"}, {"type": "multi", "cat": "drive", "q": "在五行驱动力理论中，人的内心所产生的问题分为哪两种类型？（多项）", "options": ["精神问题", "情感问题", "身体问题", "财运问题"], "ans": [0, 1], "exp": "原文：人的内心所产生的问题有两种类型：一种是精神问题，一种是情感问题。在易经的万物类象当中，精神与情感相克而成太极。", "id": "Q0011"}, {"type": "multi", "cat": "drive", "q": "在五行驱动力理论中，关于'情感驱动'与'愿力'的说法，下列哪些是正确的？（多项）", "options": ["情感驱动可以发展成愿力", "愿力的本质是趋向真正的无条件付出", "可以由情发愿或由爱发愿", "情感驱动不能发展成愿力"], "ans": [0, 1, 2], "exp": "原文：7、愿力 情感驱动可以发展成愿力……愿力的本质是趋向真正的无条件付出，可以由情发愿，也可以由爱发愿。", "id": "Q0012"}, {"type": "multi", "cat": "drive", "q": "在《八字五行驱动力》中，下列哪些属于'五种核心驱动力'？（多项）", "options": ["情感驱动", "精神驱动", "责任感驱动", "金钱驱动", "自我价值感驱动", "物质驱动"], "ans": [0, 1, 2, 4, 5], "exp": "五种核心驱动力：情感（食伤）、精神（印）、责任感（官杀）、自我价值感（比劫）、物质（财）。没有“金钱驱动”。", "id": "Q0013"}, {"type": "multi", "cat": "drive", "q": "在五行驱动力理论中，关于'精神驱动的人'，下列说法哪些是正确的？（多项）", "options": ["是不爱讲话的人", "没有表达欲、没有分享欲", "精神驱动的人就不是情欲驱动的", "更喜欢讲话分享"], "ans": [0, 1, 2], "exp": "原文：精神驱动的人是不爱讲话的人、没有表达欲、没有分享欲，精神驱动的人就不是情欲驱动的。", "id": "Q0014"}, {"type": "single", "cat": "drive", "q": "过度自我价值感驱动的人找到自我价值感的方式是？", "options": ["买豪车", "承担责任、让别人需要他（承受伴侣情绪）和创业", "社交炫耀", "被夸奖"], "ans": 1, "exp": "原文：7、承受伴侣的情绪=找到自我价值感 过度自我价值感驱动的人是不会被人关注、不会被人需要的。他会通过负责任的方式让别人需要他。承受伴侣的情绪就是他找到自我价值感的方式，还有创业。", "id": "Q0015"}, {"type": "single", "cat": "drive", "q": "做事拖泥带水、做不了决定、反复犹豫，通常可能是什么驱动的人？", "options": ["责任感驱动", "情感驱动", "物质驱动", "自我价值感驱动"], "ans": 1, "exp": "原文：2、做不了决定 做事拖泥带水是没有责任感的表现。做不了决定、反复地犹豫，靠自己很难有决断力，等外力或别人来替自己做决定。通常可能是情感驱动的人。", "id": "Q0016"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，责任感驱动的人最容易触发其'我慢心'的是什么？", "options": ["对钱的意见", "他确定的目标感和事情", "对打扮的追求", "对社交的要求"], "ans": 1, "exp": "原文：24、我慢心 责任感驱动的人对事情的控制欲很强，在事情上如果和责任感驱动的人有相悖意见的时候，就会触及到他的逆鳞。责任感驱动的人对于他确定的目标感和事情，是最容易触发他我慢心的东西。", "id": "Q0017"}, {"type": "single", "cat": "drive", "q": "长得像情种但情深缘浅、现实生活中无法有配偶的，是什么情况？", "options": ["过度精神驱动", "情深（过度有情）", "物质驱动", "责任感的男人"], "ans": 1, "exp": "原文：20、情深缘浅 过度有情的女人，情深缘浅。因为情深会否定男人的存在……如果出厂设置就是情感特别厚重的，现实生活中是没有办法有伴侣或配偶的存在的。", "id": "Q0018"}, {"type": "single", "cat": "drive", "q": "母亲过度的爱=什么教育？它对孩子的效果是什么？", "options": ["鼓励式教育、增强信心", "愧疚式教育、让孩子成为逃避责任不负责任的人", "放养式教育", "陪养式教育"], "ans": 1, "exp": "原文：1、母亲的过度的爱 母亲如果强加给孩子过度的爱，孩子感受到这种压迫感，会让孩子成为一个逃避责任感、不负责任的人。母亲过度的爱是攻击性的爱……过度的爱就是愧疚式教育。", "id": "Q0019"}, {"type": "single", "cat": "drive", "q": "过度自信、自我感觉特别良好、傲慢特别大的人，真正的驱动力是什么？", "options": ["过度情感驱动、真正驱动力是精神驱动但精神力不够", "过度精神驱动", "自我价值感强大", "物质驱动"], "ans": 0, "exp": "原文：26、过度自信 过度自信、自我感觉特别良好、傲慢特别大的人，通常是过度情感驱动，真正的驱动力是精神驱动，但是精神力不够的表现。", "id": "Q0020"}, {"type": "single", "cat": "drive", "q": "在《八字五行驱动力》的理论中，为什么说修行人的命算不准？根本原因是什么？", "options": ["因为修行人没有八字", "因为他能驾驭自己的妄念、止息妄念、减少内耗、不去动应他不需要的五行能量", "因为命理是假的", "因为修行改命了"], "ans": 1, "exp": "原文：为什么修行修的是心：因为你动什么念头，就动应了哪一种五行能量在你生命中的作用。修行的意义重大，所以修行人的命是算不准的——因为他能驾驭自己的妄念、止息自己的妄念、减少内耗、不去动应他不需要的五行能量。", "id": "Q0021"}, {"type": "single", "cat": "drive", "q": "过度的价值感驱动（过度责任感驱动）的典型表现是？", "options": ["能做成很多事", "永远在找事情做，但什么事都做不成、永远不靠谱", "以赚钱为目的并赚到钱", "享受生活"], "ans": 1, "exp": "原文：7.3 过度责任感驱动 过度的价值感驱动会有一个很典型的表现是，永远都在找事情做，但是什么事都做不成……永远在创业、永远在做事、永远不靠谱、永远做不成。", "id": "Q0022"}, {"type": "single", "cat": "drive", "q": "过度自我价值感驱动的人“一辈子都在创业”的根本原因是什么？", "options": ["财运太好", "八字无法平衡事业+气运不支持，需要事业证明自己", "喜欢冒险", "擅长经营"], "ans": 1, "exp": "原文：6、一辈子都在创业 八字无法平衡事业+气运不支持，他就会一辈子都在创业，创业永远失败。因为他找不到自我价值感，需要用事业去证明自己。", "id": "Q0023"}, {"type": "single", "cat": "drive", "q": "容易生气、容易有嗔恨心、我慢心、观过失，吵架永远翻旧账，是什么的特征？", "options": ["积极情感驱动", "过度情感驱动", "责任感驱动", "物质驱动"], "ans": 1, "exp": "原文：31、容易生气 容易生气、容易有嗔恨心、我慢心、观过失（控制欲）就是过度的情感驱动的特征。吵架永远翻旧账。", "id": "Q0024"}, {"type": "single", "cat": "drive", "q": "当一个人事业风风光光、突然开始想秀了，意味着什么？", "options": ["事业要起飞", "事业到头了、要开始衰败", "是要扩大规模的信号", "该庆祝了"], "ans": 1, "exp": "原文：16、在朋友圈秀事业 如果一个人的事业风风光光，突然开始想秀了，这个人的事业就到头了、要开始衰败了。是过度的情感驱动发挥的作用……本质是我慢心。", "id": "Q0025"}, {"type": "single", "cat": "drive", "q": "有情的女人过度精神驱动（想太多）的解决办法是什么？", "options": ["减少社交", "多花钱、多为别人花钱", "多学习理智", "多独处"], "ans": 1, "exp": "原文：10、有情的女人（想太多） ……最主要的问题就是想太多了。解决办法是，在经济状况允许的情况下，多花钱、多为别人花钱。……花钱本质上就是财克印。", "id": "Q0026"}, {"type": "single", "cat": "drive", "q": "想承担责任但最终承担不了责任的人，占所有责任感驱动的人中的比例？", "options": ["10%", "50%", "80%-90%以上", "30%"], "ans": 2, "exp": "原文：想承担责任，但最终承担不了责任的人，占据所有责任感驱动的人中80%-90%以上的比例。只能闯祸，只能收拾烂摊子。", "id": "Q0027"}, {"type": "single", "cat": "drive", "q": "把握核心驱动力、实现自身阴阳平衡正是修行中所说的什么内涵？", "options": ["明心见性、悟后起修", "历事练心", "身口意三业清净", "戒定慧"], "ans": 0, "exp": "原文：把握核心驱动力就是帮助自己努力趋近阴阳平衡的生命状态，是增长善根最好的方式，是修行中所说的\"明心见性、悟后起修\"的具体内涵。", "id": "Q0028"}, {"type": "single", "cat": "drive", "q": "能不能接受伴侣粘人，是区分积极自我价值感驱动还是过度自我价值感驱动的标准。", "options": ["社交能力", "是否接受伴侣粘人", "是否爱赚钱", "情绪稳定"], "ans": 1, "exp": "原文：能不能接受伴侣粘人，这就是区分你是积极自我价值感驱动还是过度自我价值感驱动的典型标准。", "id": "Q0029"}, {"type": "single", "cat": "drive", "q": "一个女人特别喜欢被人叫XX太太时，一定是处于什么状态？", "options": ["情感驱动", "责任感驱动、目标感驱动、事业心爆棚", "物质驱动", "过度情感驱动"], "ans": 1, "exp": "原文：19、喜欢被叫XX太太、XX妈妈 当一个女人特别喜欢被人叫XX人太太的时候，一定是责任感驱动、目标感驱动、事业心爆棚的状态。", "id": "Q0030"}, {"type": "single", "cat": "drive", "q": "极高度精神驱动女人占比80-90%以上的一个特征是什么？", "options": ["爱打扮", "会和孩子争宠", "话多", "爱社交"], "ans": 1, "exp": "原文：59、会和孩子争宠的女人 会和孩子争宠的女人，是极度/高度的精神驱动，占比80-90%以上。意味着需要伴侣的情非常多。", "id": "Q0031"}, {"type": "single", "cat": "drive", "q": "弱责任感驱动的人，只要感受到一点点被别人要求会怎样？", "options": ["很高兴", "很痛苦", "无感", "很感恩"], "ans": 1, "exp": "原文：45、弱责任感驱动 弱责任感驱动的人，只要感受到一点点被别人要求，就会很痛苦。被别人、被任何人要求做任何事的时候，男女都一样。", "id": "Q0032"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，为什么说'越有情越不能被冤枉'？根本原因是什么？", "options": ["要面子", "被冤枉与其自我认知评价相矛盾，情感受障碍是最严重的事", "怕被人看不起", "没有安全感"], "ans": 1, "exp": "原文：19、不能被冤枉 越有情越不能被冤枉，别人一旦误解比什么都难受……因为被冤枉与其自我认知评价相矛盾，意味着情感受到了障碍——对情感驱动的人来说，情感受障碍是最严重的事。", "id": "Q0033"}, {"type": "single", "cat": "drive", "q": "过度情感驱动的女人感受爱（情）的方式是什么？", "options": ["男人的理性陪伴", "男人崩溃的激烈情绪", "男人的金钱", "男人的承诺"], "ans": 1, "exp": "原文：8、感受情的方式是男人激烈的情绪 女人感受爱的方式（情）是通过男人崩溃的情绪来感应的。这就是过度情感驱动的女人要的东西……情绪=在乎=被爱。", "id": "Q0034"}, {"type": "single", "cat": "drive", "q": "过度物质驱动的人想表达观点却表达不出来，是因为什么？", "options": ["太紧张", "精神力不足", "太内敛", "没文化"], "ans": 1, "exp": "原文：7.5 过度物质驱动 1、无法表达观点 精神力不足，想表达观点但是表达不出自己的观点，是因为过度物质驱动。同时也是精神驱动。", "id": "Q0035"}, {"type": "single", "cat": "drive", "q": "当你的核心驱动力明确时，本质上你就找到了什么？", "options": ["自己的婚姻", "自己的八字、出厂设置中实现阴阳平衡的方式", "自己的财富", "自己的健康"], "ans": 1, "exp": "原文：当你的核心驱动力明确时，本质上你就找到了自己的八字、出场设置中实现阴阳平衡的方式。只要把生命能量聚焦在核心驱动力上，做什么事都是对的。", "id": "Q0036"}, {"type": "single", "cat": "drive", "q": "强精神驱动VS弱精神驱动的女人的区别在于？", "options": ["要不要男人的情", "需要热烈的情还是淡淡的情", "有没有钱", "长相"], "ans": 1, "exp": "原文：63、强精神驱动 VS 弱精神驱动 无论强精神驱动还是弱精神驱动的女人，都需要男人的情，但是需要的是热烈的情，还是淡淡的情，是很有区别的。", "id": "Q0037"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，责任感驱动的人对待情爱和婚姻的态度是？", "options": ["很需要情和爱", "可能对情情爱爱无感、只想搞事业搞钱，会因为年纪到结婚生子", "非常浪漫", "依赖伴侣的情"], "ans": 1, "exp": "原文：2、责任感驱动不需要情和爱 责任感驱动的人可能对情情爱爱无感，只想搞事业搞钱，不需要情不需要爱。会因为年纪到了结婚生子，不喜欢孩子，和孩子不亲近。", "id": "Q0038"}, {"type": "single", "cat": "drive", "q": "听云泽课程最少、线下课一个都没有的男性类型是？", "options": ["精神驱动男", "责任感驱动男", "情感驱动男", "物质驱动男"], "ans": 2, "exp": "原文：97、对理性和学习不感兴趣 情感驱动的男生对理性东西不感兴趣……听云泽课程最少的类型是情感驱动男生……线下课没有一个情感驱动男。", "id": "Q0039"}, {"type": "single", "cat": "drive", "q": "在驱逐动力与自我价值感理论中，当你问对方'爱不爱你'的时候，这个问题的本质是什么？", "options": ["对方的不足", "你的自我价值感缺失", "你不幸福", "你的控制欲"], "ans": 1, "exp": "原文：3、不配得感 当你在问一个人爱不爱你的时候，它的本质是你的自我价值感的缺失。当你在意别人怎么对待你的时候……它的本质都是自我价值感缺失而影响的。", "id": "Q0040"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，有积极情感驱动的男人在冲突中的典型表现是？", "options": ["只会冷暴力", "会主动沟通、哄人，不会冷暴力", "选择冷漠离开", "一味忍让"], "ans": 1, "exp": "原文：3、只会热暴力，不会冷暴力 有积极情感驱动的男人可能情绪不好、脾气不好，但绝对不会冷暴力、不会冷漠。一定主动沟通、哄人、编故事画饼也会哄着你。", "id": "Q0041"}, {"type": "single", "cat": "drive", "q": "过度精神驱动严重到一定程度时会容易患什么？", "options": ["被害妄想症", "贪食症", "失眠", "健忘"], "ans": 0, "exp": "原文：21、被害妄想症 过度精神驱动严重到一定程度的时候，就会容易被害妄想症。会容易把很多事情扭曲地去理解……做各种各样扭曲的理解和解读。", "id": "Q0042"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，情感驱动的人面对重要任务时的典型表现是？", "options": ["迎难而上、变成动力", "先去放松一下，感觉压力很大", "立刻制定计划", "找别人帮忙"], "ans": 1, "exp": "原文：8、压力 情感驱动的人遇到重要任务会先去放松一下，会感觉压力很大，不能被要求，承担不了责任……不像责任感驱动的人遇压力会变成动力。", "id": "Q0043"}, {"type": "single", "cat": "drive", "q": "在情感关系、亲密关系中，有情的女人是主动还是被动？", "options": ["被动等待", "主动的，不需要男人主动", "由男人决定", "看情况"], "ans": 1, "exp": "原文：51、主动 在情感关系、亲密关系、夫妻生活中，有情的女人是主动的，不需要男人主动。但凡搞反了顺序，都会很痛苦。", "id": "Q0044"}, {"type": "single", "cat": "drive", "q": "极度理性、极度精神驱动的女人对待生气的态度是？", "options": ["无意义地乱吵", "不吵没有意义的架，不生没有意义的气，生气吵架都是为了达成目的", "经常被迫吵架", "总是翻旧账"], "ans": 1, "exp": "原文：53、极度的精神驱动 极度理性、极度精神驱动的女人，不吵没有意义的架，不生没有意义的气，生气吵架都是为了达成某个目的。", "id": "Q0045"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，特别喜欢在朋友圈晒女友的男人通常属于哪种驱动？", "options": ["责任感驱动", "情感驱动", "自我价值感驱动", "物质驱动"], "ans": 1, "exp": "原文：40、特别喜欢晒男友/晒女友的男人 特别喜欢在朋友圈晒女友的男人是情感驱动，甚至有点过度情感驱动……这样的人一定不是责任感驱动。", "id": "Q0046"}, {"type": "single", "cat": "drive", "q": "关于物质驱动力与赚钱：单纯的物质驱动会很单调，通常需要与其他驱动力相辅助才能成就。请问物质驱动通常应与什么相辅助？", "options": ["单独使用财星", "与其他驱动力相辅助（责任感、精神、情感）+物质驱动", "只需要财星", "不需要其他能量"], "ans": 1, "exp": "原文：12、赚钱 通常会与驱动力相辅助，单纯的物质驱动会很单调。需要有其它驱动力去成就它……大多都是精神驱动+物质驱动、责任感驱动+物质驱动、情感驱动+物质驱动。", "id": "Q0047"}, {"type": "single", "cat": "drive", "q": "男人喜欢晒伴侣、到哪儿都带伴侣，这些是哪种驱动的特征？", "options": ["精神驱动", "物质驱动", "情感驱动", "责任感驱动"], "ans": 1, "exp": "原文：20、喜欢秀伴侣 当男人喜欢晒伴侣、有时间都陪着伴侣、到哪儿都带着伴侣，这些都是物质驱动男人的特征。", "id": "Q0048"}, {"type": "single", "cat": "drive", "q": "过度精神驱动的人最典型的身体/状态问题是什么？", "options": ["最容易被神经衰弱", "最强壮", "睡眠极好", "食欲旺盛"], "ans": 0, "exp": "原文：2、过度的精神驱动的表现 过度精神驱动是最容易神经衰弱的人。实际不爱思考，但就是有过度的精神力，焦虑内耗，想太多。", "id": "Q0049"}, {"type": "single", "cat": "drive", "q": "在五行驱动力与心理状态理论中，述情障碍、性格内向、社恐三者之间的关系是？", "options": ["三者相同", "内向是不想社交，社恐是想社交融入不了，述情障碍是社恐的一种特征", "社恐就是内向", "述情障碍是内向"], "ans": 1, "exp": "原文：5、爱生闷气……述情障碍和性格内向不一样。内向是不想社交，社恐是想社交融入不了，述情障碍是社恐的一种特征（有很多感受表达不出来）。", "id": "Q0050"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，'真正有情的女人'吵架时的表现是？", "options": ["最会吵架、带怨念", "害怕冲突，骂人的话说不出口、不会说脏话", "喜欢翻旧账", "主动攻击"], "ans": 1, "exp": "原文：12、不太会吵架 真正有情的女人害怕冲突，吵架时骂人的话都说不出口、不会说脏话；但负面（过度）情感驱动的女人最会吵架，因为她带着怨念与嗔恨在吵。", "id": "Q0051"}, {"type": "single", "cat": "drive", "q": "精神驱动的女生通常会被什么类型的男人吸引？", "options": ["责任感驱动男", "男同", "物质驱动男", "过度情感驱动男"], "ans": 1, "exp": "原文：46、直女被男同吸引 精神驱动的女生会被男同吸引，因为没有情；男同100%是有情的男人，且100%是自我价值感驱动的人。", "id": "Q0052"}, {"type": "single", "cat": "drive", "q": "精神驱动的男人对什么样的话多的男人表现明显不喜？", "options": ["责任感驱动的", "情感驱动的", "物质驱动的", "自我价值感驱动的"], "ans": 1, "exp": "原文：40、精神驱动的男人讨厌话多的男人 精神驱动的男人不喜欢情感驱动话多的男人，且很明显，无法共情话多的男人。", "id": "Q0053"}, {"type": "single", "cat": "drive", "q": "过度自我价值感驱动的人，最典型的表现之一是骂谁最多？", "options": ["孩子", "老婆", "父母", "朋友"], "ans": 1, "exp": "原文：11、骂人只骂老婆 过度自我价值感驱动的人，是最喜欢骂老婆的，孩子还不一定，但是骂老婆是骂最多的。", "id": "Q0054"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，就追随对象而言，情感驱动的人最适合找哪一种类型的老板？", "options": ["讲情义的人", "满眼都是赚钱、只谈现实问题的精神驱动老板", "对自己很好的老板", "情绪化的老板"], "ans": 1, "exp": "原文：106、不能找讲情义的人当老板 情感驱动的人一定要找一个满眼都是赚钱、天天想赚钱、只谈现实问题的精神驱动老板；不能找讲情义的人当老板。", "id": "Q0055"}, {"type": "single", "cat": "drive", "q": "为生孩子而结婚的男同性恋，找的通常是什么驱动的女人？", "options": ["精神驱动", "自我价值感驱动", "情感驱动", "责任感驱动"], "ans": 2, "exp": "原文：79、同妻 为生孩子而结婚的男同性恋，找的一定是情感驱动的女人——只有这样女方才不需要男方的情。", "id": "Q0056"}, {"type": "single", "cat": "drive", "q": "如何判断过度物质驱动（女人），婆婆关系是？", "options": ["和婆婆关系差是积极物质驱动", "和婆婆关系好、善待婆婆的女人是潜在的积极物质驱动", "与婆婆关系无关", "和婆婆不合是物质驱动"], "ans": 1, "exp": "原文：6、判断过度物质驱动 ……女人直接靠婆媳关系区分。和婆婆关系好的女人、会善待婆婆的女人就是潜在的积极物质驱动的女人。", "id": "Q0057"}, {"type": "single", "cat": "drive", "q": "\"不是物质驱动的人\"（对金钱没有很强感知力的人）就不要做什么？", "options": ["不要去创业", "不要动情", "不要投资，千万不要用钱赚钱", "不要理性"], "ans": 2, "exp": "原文：不是物质驱动的人（没有对金钱很强感知力的人），不要投资，千万不要用钱赚钱。", "id": "Q0058"}, {"type": "single", "cat": "drive", "q": "情感驱动+自我价值感驱动的人，与单纯情感驱动相比，其不配得感如何？", "options": ["更严重", "好一些", "完全一样", "无法确定"], "ans": 1, "exp": "原文：117、情感驱动+自我价值感驱动 不配得感会比单纯情感驱动好一些。", "id": "Q0059"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，最容易有靠山、精神最强大的驱动力是？", "options": ["情感驱动", "物质驱动", "精神驱动", "责任感驱动"], "ans": 2, "exp": "原文：23、靠山 精神驱动的人最容易有靠山，因为精神就是人最大的靠山，精神力强大的人永远不会被击败……精神驱动力是最高的驱动力。", "id": "Q0060"}, {"type": "single", "cat": "drive", "q": "高度自我价值感驱动女生对朋友的需要表现为？", "options": ["毫无需要", "对朋友有很大需要，看到朋友和别人玩就难过、想独占朋友", "讨厌社交", "需要朋友共情"], "ans": 1, "exp": "原文：33、对朋友暴露需求 高度自我价值感驱动的女生，对朋友有很大需要。看到朋友和别人一起玩，就会很难过，就想独占朋友。", "id": "Q0061"}, {"type": "single", "cat": "drive", "q": "过度自我价值感驱动的人性格中最典型的特征是什么？", "options": ["坦诚", "固执", "宽容", "温和"], "ans": 1, "exp": "原文：16、固执、赚钱、借钱 过度自我价值感驱动的人性格中最典型的特征是固执，行为方式是好争、争自己是对的。", "id": "Q0062"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，喜欢主动公开男女朋友关系的人通常属于哪种驱动？", "options": ["情感驱动", "物质驱动", "精神驱动", "责任感驱动"], "ans": 1, "exp": "原文：6、喜欢主动公开男/女朋友关系 自己主动喜欢公开关系的人是物质驱动的人。克者为财，需要伴侣的陪伴，会很自然地愿意公布。", "id": "Q0063"}, {"type": "single", "cat": "drive", "q": "用冷漠惩罚做错事的人（不理会），是什么的表现？", "options": ["积极精神驱动", "过度精神驱动、精神控制", "情感驱动", "物质驱动"], "ans": 1, "exp": "原文：7、精神控制/愧疚式教育 ……很冷漠不理做错事的人，就是用冷漠惩罚做错事的人，也是过度精神驱动、精神控制。", "id": "Q0064"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，精神驱动的女生对于出轨的态度是？", "options": ["非常在意、必定分手", "没有那么在意，只要男人对她还有情就分不了", "报复性出轨", "立刻离婚"], "ans": 1, "exp": "原文：62、不在意出轨 精神驱动的女生对于出轨没有那么在意。本质上不会因为对象出轨而分手，很可能分不了……但只要男人对她还有情，就分不了。", "id": "Q0065"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，责任感所显化出来的东西是什么？", "options": ["财富和金钱", "权势、身份和地位的事业", "个人享受", "魅力"], "ans": 1, "exp": "原文：11、责任感决定社会地位高低 ……责任感显化出来的东西是一个人的权势、身份和地位的事业。身份感的来源不是财富经济实力，一定是来自于他的贵气。", "id": "Q0066"}, {"type": "single", "cat": "drive", "q": "在自我价值感与回避型人格理论中，'男回避'与'女回避'在自我价值感上的区别是？", "options": ["男回避缺乏自我价值感、女回避有", "男回避是很有自我价值感的人，女回避缺乏自我价值感、有不配得感", "两者都缺", "两者都强"], "ans": 1, "exp": "原文：29、男回避是很有自我价值感的人 男回避时间都花在赚钱上。女回避是缺乏自我价值感的人，会有不配得感，觉得自己配不上对方。", "id": "Q0067"}, {"type": "single", "cat": "drive", "q": "关于'伴侣财富是共业'这一说法，下列说法正确的是？", "options": ["伴侣关系是一一对应、100%准确度、唯一完全同频等价的，匹配度远高于父母原生家庭和子女", "伴侣财富与各自无关", "穷男人配富女人错配", "伴侣只是普通人"], "ans": 0, "exp": "原文：伴侣关系是一一对应的，100%准确度，匹配程度远远高于父母原生家庭和子女；世界上唯一完全对应的同频和等价的，就是伴侣关系", "id": "Q0068"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，责任感驱动的女生如果出轨，她主要的顾虑是什么？", "options": ["没有任何顾虑", "家庭怎么办、老公怎么办、孩子怎么办", "面子问题", "道德批判"], "ans": 1, "exp": "原文：13、出轨 责任感驱动的女生如果出轨，会遇到一个问题就是，家庭怎么办、老公怎么办、孩子怎么办。会基于责任感去考虑这个问题。", "id": "Q0069"}, {"type": "single", "cat": "drive", "q": "对责任感驱动的人来说，目标感的出现意味着什么？", "options": ["麻烦", "开运标志", "衰退", "人际问题"], "ans": 1, "exp": "原文：23、目标感 对责任感驱动的人来说，目标感的出现，就是开运标志。不安全感消失，眼里只有一个明确的方向。", "id": "Q0070"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，过度的精神驱动（如动水生木）会导致什么结果？", "options": ["财运旺", "过度的思虑、过度的焦虑、神经衰弱", "婚姻顺遂", "身体强壮"], "ans": 1, "exp": "原文：过度的精神驱动想太多：如果你的太极中你是木，水是生木的、水是木的印星，动水生木会有过度的思虑、过度的焦虑、神经衰弱。", "id": "Q0071"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，最能引爆过度情感驱动者'我慢心'的是什么？", "options": ["金钱", "别人的傲慢（指指点点）", "责任", "社交"], "ans": 1, "exp": "原文：13、傲慢、我慢心 说不得，指指点点。因为指指点点是别人的我慢心。引爆过度情感驱动的人的我慢心的东西，是别人的傲慢。", "id": "Q0072"}, {"type": "single", "cat": "drive", "q": "过度自我价值感驱动+过度情感驱动的女人需要的伴侣是谁？", "options": ["吵架能吵赢自己的人", "百依百顺的人", "沉默寡言的人", "有钱的人"], "ans": 0, "exp": "原文：4、伴侣 过度自我价值感驱动和过度情感驱动的女人……需要的伴侣是吵架能吵赢自己的人。", "id": "Q0073"}, {"type": "single", "cat": "drive", "q": "修行/生命最终要实现、比五行层面更高的平衡是什么？", "options": ["阴阳层面的平衡（=善根，善根决定福祉）", "金钱平衡", "社交平衡", "情感平衡"], "ans": 0, "exp": "原文：这只是开始，最终要实现的是阴阳层面的平衡。阴阳层面的平衡＝善根，善根最终决定一个人生命的福祉", "id": "Q0074"}, {"type": "single", "cat": "drive", "q": "在自我价值感驱动理论中，一个人实现自我价值感的方式是什么？", "options": ["创业、学习、谈恋爱", "稳定赚钱的能力", "打扮漂亮", "有多少钱"], "ans": 1, "exp": "原文：3、实现自我价值感的方式 不是钱，而是稳定的赚钱能力。或者被别人需要……一个人实现自我价值感的方式和行为是稳定赚钱的能力。", "id": "Q0075"}, {"type": "single", "cat": "drive", "q": "不和父亲共情、和父亲聊赚钱聊工作，是什么驱动的标志？", "options": ["精神驱动", "自我价值感驱动", "责任感驱动", "情感驱动"], "ans": 1, "exp": "原文：22、不和父亲共情 不和父亲共情，和父亲聊赚钱聊工作等等，这也是自我价值感驱动的标志。", "id": "Q0076"}, {"type": "single", "cat": "drive", "q": "“好人没好报”（行善没得到回报就不坚持）说明什么？", "options": ["发心不正确、是想要表扬的心、是功德相", "善缘不够", "对方忘恩负义", "方法不对"], "ans": 0, "exp": "原文：如果因为行善没得到好的反馈就坚持不下去做好事，那是发心不正确、是想要得到表扬的心、是功德相", "id": "Q0077"}, {"type": "single", "cat": "drive", "q": "有权无实（缺乏精神驱动）在命理上的说法是什么？", "options": ["杀印相生", "有杀无印，印星不足就是有权无实", "有印就有权", "杀重身轻"], "ans": 1, "exp": "原文：31、身居高位没有实权 有权无实就是缺乏精神驱动。有杀无印，印星不足就是有权无实，需要杀印相生。", "id": "Q0078"}, {"type": "single", "cat": "drive", "q": "单一自我价值感驱动的人有50%以上的概率会怎样？", "options": ["喜欢同性", "出家", "单身", "创业"], "ans": 0, "exp": "原文：16、单一的自我价值感驱动的人 有50%以上的概率，会喜欢同性。这取决于他有没有这样的气运。", "id": "Q0079"}, {"type": "single", "cat": "drive", "q": "木火之气过剩的情感驱动女生通常伴随什么疾病？", "options": ["呼吸道疾病", "生殖系统疾病、肾阴虚、耳鸣耳聋掉发等", "心脑血管病", "骨骼病"], "ans": 1, "exp": "原文：木火之气过剩的情感驱动的女生通常伴随着生殖系统疾病，还有肾阴虚、听力障碍、间歇性耳聋、耳鸣、掉发等。", "id": "Q0080"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，情感驱动的人一定有的特质是什么？", "options": ["话多、分享欲", "沉默寡言", "精于算计", "超强配得感"], "ans": 0, "exp": "原文：31、话多、分享欲 情感驱动的人一定有分享欲、表达欲，情越多分享欲越强。喜不喜欢一个人的表现就是想不想跟你分享日常，尤其是讲废话。", "id": "Q0081"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，吵架对'过度情感驱动'的女人来说像什么？", "options": ["灾难", "营养品、治愈方式", "折磨", "浪费时间"], "ans": 1, "exp": "原文：3、吵架 吵架本身是一种治愈的方式。如果过度情感驱动的女人遇到的不是积极情感驱动的男人，那吵架本身就像营养品一样。", "id": "Q0082"}, {"type": "single", "cat": "drive", "q": "过度自我价值感驱动的人，唯一能对抗他固执的是什么？", "options": ["讲道理", "用情感打动", "自己无法撼动的自我价值感去对治", "给他钱"], "ans": 2, "exp": "原文：只有用自己无法撼动的自我价值感去对治父亲的固执。子女的赚钱能力就是改变父亲观念的能力。", "id": "Q0083"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，有情的女人嫁入豪门时，她通常看重的是什么？", "options": ["豪门财富", "男人的爱、智慧、责任感", "地位名分", "家产分额"], "ans": 1, "exp": "原文：70、有情的女人嫁入豪门 有情的女人嫁入豪门就不是为了钱，甩钱追不到有情的女人，她更看重男人的爱、智慧、责任感。", "id": "Q0084"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，精神驱动的人'精神力不足'的表现方式是？", "options": ["分享欲", "专注力", "表达力", "赚钱能力"], "ans": 1, "exp": "原文：3、精神力不足 精神驱动的人都有精神力强弱的问题，表现方式是专注力。不够意味着想高度专注很困难、注意力容易分散。", "id": "Q0085"}, {"type": "single", "cat": "drive", "q": "在五行驱动力配对理论中，物质驱动的女生需要什么样的伴侣？", "options": ["情感驱动男人", "理性、平静、有精神境界追求的精神驱动男人", "物质驱动男人", "责任感驱动男人"], "ans": 1, "exp": "原文：24、对伴侣的需要 物质驱动的女生需要伴侣是非常理性、平静、内心情绪的安稳、有精神境界的追求的男人，需要精神驱动的男人。", "id": "Q0086"}, {"type": "single", "cat": "drive", "q": "在调动情绪与精神力的理论中，最能震慑别人的愤怒是下列哪一种？", "options": ["情绪失控的发泄", "平静的愤怒", "爆裂的怒吼", "持续的抱怨"], "ans": 1, "exp": "原文：32、调动情绪的能力 真正能震慑别人的是平静的愤怒——悄无声息让对方瞬间知道你的边界，才让人产生敬畏尊重。平静的愤怒来自强大精神力。", "id": "Q0087"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，单一精神驱动的男人有什么特点？", "options": ["需要谈恋爱", "没有需求谈恋爱，是典型的修行人", "想结婚生子", "话多"], "ans": 1, "exp": "原文：36、单一精神驱动的男人 单一精神驱动的男人没有需求谈恋爱，是典型的修行人——不是因为他修得好，是因为八字里就没有这个配置。", "id": "Q0088"}, {"type": "single", "cat": "drive", "q": "在自我价值感驱动理论中，女生的自我价值感的衡量方式来自什么？", "options": ["男人的陪伴", "男人愿意为她花多少钱", "男人的长相", "男人的地位"], "ans": 1, "exp": "原文：2、如何判断是否是自我价值感驱动？ 女生的自我价值感的衡量方式，来自于男人愿意为她花多少钱。砸钱多就能讨得她的欢心。", "id": "Q0089"}, {"type": "single", "cat": "drive", "q": "过度情感驱动的人（尤其是男生）小时候容易什么行为上瘾？", "options": ["看剧", "玩游戏", "吃东西", "购物"], "ans": 1, "exp": "原文：39、上瘾 过度情感驱动，尤其是男生，玩游戏容易上瘾，小时候容易玩游戏上瘾。", "id": "Q0090"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，过度精神驱动力强弱程度体现在哪里？", "options": ["能不能分散自己的注意力", "能不能赚钱", "社交能力", "决断力"], "ans": 0, "exp": "原文：3、过度精神驱动的程度 过度精神驱动的强弱程度，体现在能不能分散自己的注意力上。过度钻牛角尖，疯狂地分析、疯狂地想。", "id": "Q0091"}, {"type": "single", "cat": "drive", "q": "在管钱与驱动力的理论中，真正能管钱最靠谱的是什么驱动的人？", "options": ["责任感驱动", "自我价值感驱动", "情感驱动", "物质驱动"], "ans": 1, "exp": "原文：17、管钱最靠谱 真正能管钱的本质是能够克得住钱财的人，也就是自我价值感驱动的人。……还是自我价值感驱动更会管钱。", "id": "Q0092"}, {"type": "single", "cat": "drive", "q": "和过度情感驱动女人在一起的男人，其事业会怎样？", "options": ["越来越好", "不会衰败", "一定迅速破败、不可能有事业", "不受影响"], "ans": 2, "exp": "原文：会和过度情感驱动的女人在一起的男人不可能有事业，能和这样业力纠缠上的男人事业一定迅速破败。", "id": "Q0093"}, {"type": "single", "cat": "drive", "q": "我们做任何事情唯一、摆第一位的正确发心是？", "options": ["对治自己的烦恼", "培养自己的能力", "实现目标", "证明自己"], "ans": 0, "exp": "原文：真正正确的发心是放下对自我的执着…我们做事情唯一正确的发心，是对治自己的烦恼，而不是成长自己的能力", "id": "Q0094"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，情感驱动女生最大的业力功课通常是在哪里？", "options": ["在事业上", "在男人身上找情", "在金钱上", "在修行上"], "ans": 1, "exp": "原文：但如果需要，情感驱动女人最大的业力功课就会是在男人身上找情（你爱不爱我、在不在乎我、付出了多少等）。", "id": "Q0095"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，精神驱动女生对男人吹牛、油腻的态度是？", "options": ["非常反感", "当成缺点排斥", "喜欢油腻男、觉得有魅力", "立刻离开"], "ans": 2, "exp": "原文：67、喜欢男人吹牛逼、油腻男 精神驱动女生喜欢油腻男，听男人吹牛，会觉得有魅力。吹牛也是油腻的一种体现。", "id": "Q0096"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，责任感驱动女人的'发心'用词是什么？", "options": ["想", "愿意", "应该", "喜欢"], "ans": 2, "exp": "原文：7、做事负责，自我驱动 ……做所有事情都觉得是自己应该做的……\"应该\"就是她的发心。不是\"想\"\"愿意\"而是\"应该\"。", "id": "Q0097"}, {"type": "single", "cat": "drive", "q": "在自我价值感与精神驱动理论中，就'找喜欢的事做'这件事而言，自我价值感驱动和精神驱动的人通常具有什么特点？", "options": ["总能找到喜欢的事", "永远找不到喜欢的事情，不要以喜欢为标准找事做", "以兴趣驱动", "以快乐为先"], "ans": 1, "exp": "原文：40、没有喜欢的事情 自我价值感驱动和精神驱动的人，永远找不到喜欢的事情，所以不要以喜欢为标准去找事做。", "id": "Q0098"}, {"type": "single", "cat": "drive", "q": "过度自我价值感驱动的人，其行动是由什么驱动的？", "options": ["情感", "目标（目的）", "习惯", "随机"], "ans": 1, "exp": "原文：13、目标驱动行为 做事都有目的，他的行动都是由目标来驱动的。……这是责任感驱动的标志。", "id": "Q0099"}, {"type": "single", "cat": "drive", "q": "学习增长智慧带来内在愉悦感、能平静，这是什么的标志？", "options": ["情感驱动", "精神驱动", "责任感驱动", "物质驱动"], "ans": 1, "exp": "原文：5、学习智慧 学习增长智慧能带来内在愉悦感、能平静——这是精神驱动的标志。", "id": "Q0100"}, {"type": "multi", "cat": "love", "q": "关于'伴侣出现是来帮助我们完成功课'这一观点，下列说法正确的是？（多选）", "options": ["我们自身没有完成的功课基本全在伴侣身上显现", "你对伴侣投射的念头，就是你自己没有完成的功课、就是内在匮乏的显化", "直到你对伴侣任何特征都不加以评判、完整接纳时，才完成内在匮乏的功课", "伴侣是来让我们享受的，与功课无关"], "ans": [0, 1, 2], "exp": "原文：伴侣出现是来帮我们完成功课：我们自身没有完成的功课基本全在伴侣身上显现。你对伴侣投射的念头，就是你自己没有完成的功课、就是内在匮乏的显化。直到你对伴侣的任何特征都不加以评判、完整接纳时，才完成了自己内在匮乏的功课。", "id": "Q0255"}, {"type": "multi", "cat": "love", "q": "关于男人的情感驱动：男人也有很强的共情力，但男人的情感驱动与女人的情感驱动有所不同。以下关于男人情感驱动特点的说法，正确的是哪些？（多选）", "options": ["有很强的共情力", "与女人不同，男人的情感驱动很容易倾向欲望的驱动", "会把很多时间花在女人身上", "爱吃喝玩乐、会生活、爱做饭、喜欢照顾家庭的男人都是有情的标志"], "ans": [0, 1, 2, 3], "exp": "原文：也有很强的共情力，但与女人不同的是，男人的情感驱动很容易倾向欲望的驱动…爱吃喝玩乐、会生活的男人，爱做饭的男人，喜欢照顾家庭的男人，都是有情的标志。", "id": "Q0256"}, {"type": "multi", "cat": "love", "q": "真情的女人要'旺夫'，可以通过哪些具体的自我调整方式来实现？（这些调整围绕让自己的情感状态更稳定展开）（多选）", "options": ["让自己开心起来", "减少情绪内耗", "增加情感稳定性", "克服自己的不配得感、自我价值感的缺失"], "ans": [0, 1, 2, 3], "exp": "原文：真情的女人旺夫的方式：让自己开心起来，减少情绪内耗，增加情感稳定性，克服自己的不配得感、自我价值感的缺失。", "id": "Q0257"}, {"type": "multi", "cat": "love", "q": "真正情感驱动（有情）的人拥有一系列积极、正能量的可辨识能力。这些能力具体包括哪些？（多选）", "options": ["有能够积极起来的能力", "有能够快乐起来的能力", "能够感受生活美好的能力", "自然而然的共情力"], "ans": [0, 1, 2, 3], "exp": "原文：有能够积极起来的能力；有能够快乐起来的能力；能够感受生活美好的能力；自然而然的共情力。", "id": "Q0258"}, {"type": "multi", "cat": "love", "q": "情感驱动的人最主要的生活方式包括哪些？（多选）", "options": ["开心最重要", "任性最重要", "情感的流动最重要", "以赚钱为目的"], "ans": [0, 1, 2], "exp": "原文：情感驱动的人最主要的生活方式：开心最重要、任性最重要、情感的流动最重要。", "id": "Q0259"}, {"type": "multi", "cat": "love", "q": "爱是一种怎样的力量（爱的能力本质）？", "options": ["精神力", "智慧与慈悲的导向：理解、接纳、包容", "纯粹的情感冲动", "欲望"], "ans": [0, 1], "exp": "原文：爱是一种精神力、一种智慧与慈悲的导向：理解、接纳、包容。", "id": "Q0260"}, {"type": "multi", "cat": "love", "q": "判断两个人是否具有情侣缘分的标志，关乎气运、福业、驱动力与善根。下列哪些属于'情侣缘分标志'？（多选）", "options": ["气运同步", "福业相当", "驱动力匹配", "善根相等"], "ans": [0, 1, 2, 3], "exp": "原文：情侣缘分标志：气运同步、福业相当、驱动力匹配、善根相等。", "id": "Q0261"}, {"type": "single", "cat": "love", "q": "能通过欲望考验、坐怀不乱、不被任何女人撩动内心的男人，其内心强大，通常是什么？", "options": ["能做大事的人", "情感驱动的人", "物质驱动的人", "普通男人"], "ans": 0, "exp": "原文：能通过欲望考验的男人坐怀不乱、不被别人诱惑、不被任何女人撩动内心，内心一定很强大，这是能通过欲望考验的标志——真正做得到的男人都是做大事的。", "id": "Q0262"}, {"type": "single", "cat": "love", "q": "关于驱动力的匹配度与缘分、婚姻的关系，下列说法正确的是？", "options": ["匹配度就是能否结婚的决定因素", "缘分的维度高于情感模式；匹配度决定契合程度但不直接决定缘分", "匹配度高就一定能结婚", "匹配度越低越有缘分"], "ans": 1, "exp": "原文：缘分的维度高于情感模式：你不一定能与更合适的人在一起…但两人情感模式的契合可决定是否有情缘（至少能在一起）；至于能不能结婚、能不能组成家庭，取决于彼此姻缘、气运、善根、福报等都要匹配契合，是更高维度的问题。", "id": "Q0263"}, {"type": "single", "cat": "love", "q": "当一方“摔/提分手”，其原因是“在你身上找不到他要的东西”。面对这种情况，通常有效的建议/做法是什么？", "options": ["这种类型里很多是你越不给他提供情绪价值越离不开你；你先提分手他反而对你更投入", "赶紧去挽回", "去讨好他", "马上求婚"], "ans": 0, "exp": "原文：这种类型里很多是你越不给他提供情绪价值越离不开你，你如果先提分手他可能眼前一亮死心塌地更爱你", "id": "Q0264"}, {"type": "single", "cat": "love", "q": "有爱的人的重要区别之一在于：有爱的人所付出的事都是为了谁好？", "options": ["自己", "别人（为别人好）", "利益", "情感满足"], "ans": 1, "exp": "原文：有爱的人一定是理性的、一定是情绪稳定的。爱与情的重要区别：爱也是付出，情也是付出，但有爱的人所付出的事都是为了别人好。", "id": "Q0265"}, {"type": "single", "cat": "love", "q": "在万物类象与十神象中，'爱'的定位遵循'你是什么，生你的东西的能量就是爱的能量'这一规律。那么'爱的定位'在十神象中称作什么？", "options": ["食伤", "财星", "印星", "比劫"], "ans": 2, "exp": "原文：爱的定位：与情的定位相克而成太极，以相生的关系存在。你是什么，生你的东西的能量就是爱的能量，在十神象中称作印星；是精神上的东西，精神上的追求是可以增加、补充一个人能量的。", "id": "Q0266"}, {"type": "single", "cat": "love", "q": "\"有爱的人喜欢倾听，有情人喜欢讲话（分享）\"描述了爱与情的什么关系？", "options": ["相克的关系", "互为补充、一个人有爱一个人有情就是平衡状态", "没有关系", "纯属巧合"], "ans": 1, "exp": "原文：一个喜欢倾听，一个喜欢讲话（分享）。这就是爱与情的关系，一个人有爱、一个人有情，这样状态就很平衡。", "id": "Q0267"}, {"type": "single", "cat": "love", "q": "情感驱动的男人需要精神驱动的女人，即他需要一个怎样的女人？", "options": ["有智慧、聪明、懂得或愿意给他提供情绪价值的女人", "有钱的女人", "有权的女人", "漂亮的女人"], "ans": 0, "exp": "原文：反过来情感驱动的男人一定需要精神驱动的女人，即他需要一个有智慧、聪明、懂得或愿意给他提供情绪价值的女人。", "id": "Q0268"}, {"type": "single", "cat": "love", "q": "“要情，不要爱”（“要等我开口了你才给我，那我宁可不要”）主要是谁说的话？", "options": ["精神驱动的女人", "情感驱动的女人", "责任感驱动的男人", "物质驱动的女人"], "ans": 0, "exp": "原文：这是精神驱动的女人会说的话。只要要的东西对方给不了自己得不到，就产生情执", "id": "Q0269"}, {"type": "single", "cat": "love", "q": "'问世间情为何物，直教人生死相许'这句诗，讲的是哪种深重的功课？", "options": ["一个有情的女人怀疑自己不被爱", "有爱的女人理性过度", "责任感驱动男人的事业", "物质驱动女人的财富"], "ans": 0, "exp": "原文：\"问世间情为何物，直教人生死相许\"，讲的就是一个有情的女人怀疑自己不被爱这种深重的功课。", "id": "Q0270"}, {"type": "single", "cat": "love", "q": "对伴侣负面情绪有需求（通过对方崩溃感受爱）的人，其驱动力是？", "options": ["男责任感驱动，女精神驱动", "男女都情感驱动", "男女都物质驱动", "男女都责任感驱动"], "ans": 0, "exp": "原文：对伴侣负面情绪有需求的人，本质是对伴侣的情有需求。男人一定是责任感驱动的，女人一定是精神驱动的", "id": "Q0271"}, {"type": "single", "cat": "love", "q": "\"两个人的驱动力匹配 = 相处舒适度\"，其中匹配是指什么？", "options": ["缘分组成的原因", "相处融洽、几乎没什么矛盾", "决定能否结婚的唯一因素", "决定是否有缘分"], "ans": 1, "exp": "原文：两个人的驱动力匹配 = 相处舒适度。匹配不是缘分组成的原因；匹配意味着相处融洽、几乎没什么矛盾。", "id": "Q0272"}, {"type": "single", "cat": "love", "q": "五组配对中，\"情感驱动的女人\"匹配的是哪种男人、最需要男人的什么？", "options": ["情感驱动的男人；男人的情", "责任感驱动的男人；事业心、上进心", "物质驱动的男人；男人的钱", "精神驱动的男人；男人的爱"], "ans": 1, "exp": "原文：情感驱动的女人 匹配 责任感驱动男；情感驱动的女人需要男人的事业心、上进心。", "id": "Q0273"}, {"type": "single", "cat": "love", "q": "女方想在不爱的丈夫身上“扣情”时，恰当的做法是下列哪一项？", "options": ["直接向他输出你的需求，不要问他“想干嘛”，用命令式表达", "多问他“在干嘛”", "不停哭泣", "跟他讲道理"], "ans": 0, "exp": "原文：你不需要在他身上扣情，直接向他输出你的需求就可以了——直接告诉他你的需求，不要问他“想干嘛”", "id": "Q0274"}, {"type": "single", "cat": "love", "q": "有一种人无法进入深度亲密关系、无法承受伴侣的情。这类人通常呈现出怎样的状态？", "options": ["只能有淡淡的关系，一旦关系深入就是结束", "没有任何亲密关系", "是渣男", "总吵架"], "ans": 0, "exp": "原文：无法进入深度亲密关系的人、无法承受伴侣的情的人很多，只能有淡淡的关系，一旦关系深入就是结束", "id": "Q0275"}, {"type": "single", "cat": "love", "q": "'情感=平静'的核心观点是什么？它认为人类获得最大平静的方式是情感，并由此引申出对'控制欲'的解释。", "options": ["人类获得最大平静的方式是情感，有人付出一切努力控制对方让自己平静", "情感就是激烈喜悦", "平静靠独处", "情感等于情绪"], "ans": 0, "exp": "原文：人类获得最大平静的方式是情感，情感关系稳定时能获得最大平静…所以有人付出一切努力控制对方让自己平静——控制欲就是“你要满足我的平静”", "id": "Q0276"}, {"type": "single", "cat": "love", "q": "要求一个人证明他爱自己，其实你要他证明的是什么？", "options": ["证明他对你有情", "证明他有理智", "证明他有财富", "证明他有地位"], "ans": 0, "exp": "原文：当我们要求一个人证明他爱自己的时候，其实你要他证明的是他对你有情…这是一种情感需求，这不是爱，这是情。", "id": "Q0277"}, {"type": "single", "cat": "love", "q": "'心疼'与'同情'是在日常情感中易被混淆的两个概念，且与慈悲、爱有关。关于'心疼'与'同情'，下列说法正确的是？", "options": ["心疼是同频共情，感受到对方的痛苦委屈", "同情就是慈悲", "爱是需要心疼的", "同情对象一定是善缘"], "ans": 0, "exp": "原文：心疼是同频共情，感受到对方的痛苦和委屈。而同情的本质是同情内在过去的自己，同情并不是慈悲。慈悲心是不同情的，爱是不同情的。", "id": "Q0278"}, {"type": "single", "cat": "love", "q": "女人需要男人陪伴与男人需要女人陪伴的根本差别是？", "options": ["女人因开心/控制欲需陪伴，男人因需求/对事情有控制有规划", "需求相同", "都是控制人", "都没有需求"], "ans": 0, "exp": "原文：女人需要男人的陪伴是因为开心、是对他这个人有控制欲；男人需要女人陪伴是因为需求、是对事情有控制欲有规划", "id": "Q0279"}, {"type": "single", "cat": "love", "q": "根据匹配对照表，“自我价值感驱动”的女人，所需配偶是哪种男人？", "options": ["精神驱动", "自我价值感驱动", "责任感驱动", "物质驱动+情感驱动（为自己花钱也给情）"], "ans": 3, "exp": "原文：自我价值感驱动【物质驱动+情感驱动】需要男人为自己花钱，也需要男人的情。", "id": "Q0280"}, {"type": "single", "cat": "love", "q": "“悲慢心”是哪两种驱动力的结合（以情感驱动为驱动）？", "options": ["情感驱动+过度自我价值感驱动（自我价值感缺失）", "责任感+物质", "精神+自我价值", "纯物质"], "ans": 0, "exp": "原文：悲慢心是情感驱动+过度自我价值感驱动（自我价值感缺失）的人，生活中不显著、情感关系里非常明显", "id": "Q0281"}, {"type": "single", "cat": "love", "q": "“情执=贪”的论断：意识不到情执是贪着、认为理所应当的人会怎样？", "options": ["一定对外在人事物有很强依赖", "没有痛苦", "功课已经完成", "已经解脱"], "ans": 0, "exp": "原文：如果意识不到情执是贪着、认为理所应当的人，一定对外在人事物有很强依赖", "id": "Q0282"}, {"type": "single", "cat": "love", "q": "责任感驱动的女人的发心（驱动逻辑）是什么？", "options": ["我想要", "我愿意", "我应该这么做", "我不得不"], "ans": 2, "exp": "原文：情的驱动是我想要，爱的驱动是我愿意，责任感的驱动是我应该这么做。责任感驱动的人做事情都应该以\"我应该\"为发心。", "id": "Q0283"}, {"type": "single", "cat": "love", "q": "在驱动力理论中，“100%谈不了恋爱”的男生，其标志是什么？", "options": ["过度情感驱动+过度物质驱动+过度责任感驱动同时具备（三个过度）", "单一精神驱动", "太有钱", "太忙"], "ans": 0, "exp": "原文：100% 谈不了恋爱的男生一定是过度的情感驱动+过度的物质驱动+过度责任感驱动，三个过度驱动力同时具备是谈不了恋爱的标志", "id": "Q0284"}, {"type": "single", "cat": "love", "q": "在五种内在驱动力里，\"爱的能量\"体现出的特质是什么？", "options": ["偏向感受、情绪", "一定倾向精神层面、智慧层面，偏向理性与思维", "偏向欲望", "偏向物质"], "ans": 1, "exp": "原文：一个心有爱的人体现出的特质一定倾向精神层面、智慧层面，即偏向理性与思维，这是爱的能量。", "id": "Q0285"}, {"type": "single", "cat": "love", "q": "有一种区别于夫妻关系的特殊伴侣形式叫'灵魂伴侣'，它的出现有其目的与特点。那么'灵魂伴侣'的定义是什么？", "options": ["以夫妻关系存在的伴侣", "不是以夫妻关系存在的特殊伴侣形式，是来守护你的，甚至跟你是同一种驱动力的伴侣", "一定是你前世的爱人", "一定是异性"], "ans": 1, "exp": "原文：灵魂伴侣：不是以夫妻关系存在的特殊伴侣形式，这是另一种形式的伴侣关系。这个人的出现就是为了来守护你的，甚至跟你是同一种驱动力的伴侣。", "id": "Q0286"}, {"type": "single", "cat": "love", "q": "女人始终谈不了恋爱的最直接因素（门槛）是？", "options": ["责任感（有责任感才能有稳定情感）", "聪明", "漂亮", "有钱"], "ans": 0, "exp": "原文：一个男人能稳定出现在女人身边而不想躲不逃，门槛就是她有责任感，没有责任感的女人能有稳定情感的概率本身很低", "id": "Q0287"}, {"type": "single", "cat": "love", "q": "真正了解自己后会发现，痛苦时其实想要的是什么？", "options": ["那个人的陪伴或爱", "那个人的怜悯、是那个人的存在", "对方的财富", "对方的地位"], "ans": 1, "exp": "原文：真正了解自己后会发现：原来要的并不是那个人的陪伴或爱，而是那个人对自己的怜悯、是那个人的存在。", "id": "Q0288"}, {"type": "single", "cat": "love", "q": "关于“我执的反复拉扯”，下列哪一项说法是正确的？", "options": ["只要还有一点对别人的期待渴望，你的小我都死不了", "我执会被意志力一举除掉", "痛苦可以一次熬完", "只要努力就脱离拉扯"], "ans": 0, "exp": "原文：只要还有一点对别人的期待渴望，你的小我都死不了。快熬出头时，它总及时跳出来给你心理安慰", "id": "Q0289"}, {"type": "single", "cat": "love", "q": "在传统命理中，“夫妻宫”指的是下列哪一项？", "options": ["日柱的地支（日支）", "年柱", "月柱", "时柱"], "ans": 0, "exp": "原文：夫妻宫：婚姻是日柱的地支，也就是日支。在传统命理中，日支 = 夫妻宫。夫妻宫的吉凶作用，直接决定了一个人想不想结婚。", "id": "Q0290"}, {"type": "single", "cat": "love", "q": "在十神象中，'情'的定位是：以自身五行所生的食伤的吉凶为定位，因为它涉及阴阳平衡问题。那么'情的定位'在十神中属于哪一类？", "options": ["印星", "食伤", "财星", "官星"], "ans": 1, "exp": "原文：情的定位：以自身五行所生的食伤的吉凶为定位，因为它涉及阴阳平衡问题。\"食伤的吉凶直接决定了你是不是情感驱动的人。\"", "id": "Q0291"}, {"type": "single", "cat": "love", "q": "常说有女生只在乎你是不是\"潜力股\"，潜力股指的是什么？", "options": ["你有没有钱", "你是不是责任感驱动的人、是不是有目标感、能努力上进的人", "你帅不帅", "你有没有权势"], "ans": 1, "exp": "原文：潜力股就是你是不是责任感驱动的人、是不是有目标感、能努力上进的人。", "id": "Q0292"}, {"type": "single", "cat": "love", "q": "在择偶倾向中，精神驱动的女人通常偏好什么样的男人？", "options": ["越傲慢、越装的男人越喜欢", "平实真诚的老实人", "回避型男人", "物质富足的男人"], "ans": 0, "exp": "原文：精神驱动的女人喜欢男人傲慢，越傲慢的男人越喜欢，越装的男人越喜欢。所以厌男的人一定不是精神驱动的。", "id": "Q0293"}, {"type": "single", "cat": "love", "q": "'分离焦虑'并不源自'控制欲'，而是一种独立的需求。它的定义更接近下列哪一项？", "options": ["只要 ta 待在你身边你就能很安心，是独立的对陪伴的需求", "控制欲", "依赖症", "恐惧症"], "ans": 0, "exp": "原文：分离焦虑不是控制欲，不来自控制欲，是一种独立的对陪伴的需求——我需要时希望 ta 在，不需要时希望 ta 不在", "id": "Q0294"}, {"type": "single", "cat": "love", "q": "自我感动（说“我非常爱一个人”）的本质是什么？", "options": ["对自我的执着非常深重，代表对其有很强索取控制贪求", "真的深爱对方", "无私的付出", "被爱的表现"], "ans": 0, "exp": "原文：当你说自己非常爱一个人时，只能说明你对自我的执着非常深重，并不代表你很爱这个人", "id": "Q0295"}, {"type": "single", "cat": "love", "q": "一段关系由缔结到稳定，最终“谁主动”的规律是？", "options": ["谁有情谁主动；男女情感缔结动作要由男方主动", "永远男方主动", "谁有钱谁主动", "永远被动"], "ans": 0, "exp": "原文：男女情感关系的缔结这个动作一定要由男方主动。但关系缔结前后不一定，谁有情谁主动", "id": "Q0296"}, {"type": "single", "cat": "love", "q": "某些驱动力组合的人往往“无情无爱”，其命理格局可用“财官两旺”来概括。这类“无情无爱的人”主要是什么驱动的人？", "options": ["情感驱动", "物质驱动、责任感驱动（财官两旺）", "精神驱动", "自我价值感驱动"], "ans": 1, "exp": "原文：无情无爱的人主要是物质驱动、责任感驱动的人。命理学格局叫财官两旺，是真正用来做事业的人。", "id": "Q0297"}, {"type": "single", "cat": "love", "q": "爱是有层次之分的，'越高级的爱'与增长彼此的善根、让人成为更好更正能量的人相联系。那么，越高级的爱是什么？", "options": ["满足对方一切利益", "你愿意付出的东西越趋近于能增长彼此的善根、让大家都能成为更好更正能量的人", "不顾道德地满足对方", "无条件的纵容"], "ans": 1, "exp": "原文：你愿意付出的东西越趋近于能够增长彼此的善根、让我们都能成为更好更正能量的人，这种爱就越高级；而不是助纣为虐。", "id": "Q0298"}, {"type": "single", "cat": "love", "q": "在辨别情感模式时，“真正有情人（有情的人）”的标志是什么？", "options": ["情绪波动大", "食伤的动应为吉且实现阴阳平衡的方式是去动应自己的情感", "容易共情", "经常悲伤"], "ans": 1, "exp": "原文：食伤的动应为吉 + 实现阴阳平衡的方式是去动应自己的情感，这才是真正有情人（有情的人）的标志。", "id": "Q0299"}, {"type": "single", "cat": "love", "q": "遇到恶心的事想投诉报复时，看待这一行为的关键在于'发心'，它区分了基于慈悲智慧与基于嗔恨心泄愤两种情形。对这种情况应如何看待？", "options": ["看发心：基于爱与慈悲智慧可投诉，基于嗔恨心发泄则没意义", "一律应该投诉", "一律忍住", "与发心无关"], "ans": 0, "exp": "原文：若发心是让对方成为更好的人、基于爱与慈悲智慧去惩奸除恶，可以投诉；若基于嗔恨心发泄，没意义", "id": "Q0300"}, {"type": "single", "cat": "love", "q": "在驱动力与两性需求的分析中，物质驱动的男人在感情关系中有明确的需要，并会自然地为满足这种需要而花钱。那么，物质驱动的男人生命中需要的是什么？", "options": ["女人的情", "女人的爱", "一个稳定的女人的存在（女人的陪伴）", "女人的智慧"], "ans": 2, "exp": "原文：物质驱动的男人需要的是女人的陪伴：他生命中需要有一个稳定的女人的存在，就自然而然给这个女人花钱。", "id": "Q0301"}, {"type": "single", "cat": "love", "q": "问“你想不想我”和说“我想你了”的本质区别是？", "options": ["前者在你身上找情（要情），后者是他对你有情", "没有区别", "都是表达爱", "都是无聊"], "ans": 0, "exp": "原文：问“你想不想我”的人本质上是在你身上找情；说“我想你”的本质是他对你有情", "id": "Q0302"}, {"type": "single", "cat": "love", "q": "男人有很多女朋友，并且对每一个都想一辈子，这一现象说明下列哪一项？", "options": ["说明博爱、财气好；但异性伴侣多不代表善根卓越，反而善根比较差", "说明他必然事业成功", "说明他很有责任感", "说明他适合创业"], "ans": 0, "exp": "原文：这说明你博爱、是财气很好的表现…异性伴侣多不代表善根卓越，反而善根比较差", "id": "Q0303"}, {"type": "single", "cat": "love", "q": "在亲密关系语境中，“PUA”这一现象的定义与本质是什么？", "options": ["用情感控制或精神控制，拿捏你对情的渴望，只给一点点(1%)吊着，操控其心智", "单纯的哄骗", "浪漫技巧", "鼓励人"], "ans": 0, "exp": "原文：PUA 就是用情感控制或精神控制，拿捏对方的心性，拿捏你对他的情的渴望和期待。不给对方多，就给一点点（1%），吊着", "id": "Q0304"}, {"type": "single", "cat": "love", "q": "关于'邪淫心'，其本质、它与一般情欲的关系、怎样才构成邪淫并需合乎何种准则，都有明确的辨析。下列关于邪淫心的说法，正确的是？", "options": ["邪淫心本质是我慢心，不是所有情欲都是邪淫，非分之想才是邪淫且要合乎道义", "只有异性之间才有邪淫", "邪淫只属于女人", "邪淫与情欲等同"], "ans": 0, "exp": "原文：邪淫心本质是我慢心——我慢心膨胀时同时产生邪淫心…不是所有情欲都是邪淫，非分之想才是邪淫，且要合乎道义", "id": "Q0305"}, {"type": "single", "cat": "love", "q": "能谈精神恋爱（柏拉图式）的女人，一定是什么类型？", "options": ["100%是过度精神驱动", "单一情感驱动", "任一驱动", "责任感驱动"], "ans": 0, "exp": "原文：能谈精神恋爱的女人一定不是精神驱动的人，100% 是过度精神驱动", "id": "Q0306"}, {"type": "single", "cat": "love", "q": "'爱'与'情'的关键区别在于付出时的心态——是主动愿意还是出于某种驱使。对有爱的人而言，这种关键区别是什么？", "options": ["这些都是我愿意付出，而不是我想要付出", "我想付出", "我别无选择", "我必须付出"], "ans": 0, "exp": "原文：对有爱的人来说，\"这些事情都是我愿意付出，而不是我想要付出。我愿意为你的需求买单，愿意付出才是爱。\"", "id": "Q0307"}, {"type": "single", "cat": "love", "q": "当一个人对另一个人说出“我爱你”这句话时，通常想表达的是什么？", "options": ["他喜欢你/需要你、对你动情、想占有你讨好你", "他真的无条件爱你", "他非常高尚", "他在陈述事实"], "ans": 0, "exp": "原文：通常一个人说我爱你，想表达的是他喜欢你或需要你、对你动情了，想占有你、讨好你", "id": "Q0308"}, {"type": "single", "cat": "love", "q": "分手之所以痛苦，其本质是什么？", "options": ["自己的我慢心、没得到想要的感受，真正痛苦的是内在匮乏被那个人激发后他又走了", "失去了对方", "孤独", "没面子"], "ans": 0, "exp": "原文：本质都是自己的我慢心…痛苦不是失去了什么，而是没有得到什么…真正痛苦的是内在匮乏", "id": "Q0309"}, {"type": "single", "cat": "love", "q": "处理'妄念'时，看待它的视角比对抗它更重要。解决妄念最核心的做法是什么？", "options": ["看到它（观照）而不是对抗它", "拼命对抗它", "分析它的原因", "责怪自己接纳不了"], "ans": 0, "exp": "原文：①自身解决妄念——看到它最重要，而不是对抗它。一去对抗妄念和习气就等于没看到它；只是看着它，它就没有了", "id": "Q0310"}, {"type": "single", "cat": "love", "q": "“创伤性吸引”多见于女性，其核心在于对喜欢自己与不喜欢自己的人采取截然相反的态度。“创伤性吸引”的特征是什么？", "options": ["喜欢一个不喜欢自己的人并付出一切，又不喜欢喜欢自己的人，把自己困在臆想中", "喜欢所有喜欢自己的人", "害怕亲密", "总被抛弃"], "ans": 0, "exp": "原文：创伤性吸引的女生比较多——喜欢一个不喜欢自己的人并付出一切，又不喜欢喜欢自己的人…把自己困在臆想中", "id": "Q0311"}, {"type": "single", "cat": "love", "q": "回避型人格的'回避'行为表面上与'逃避'相似，但二者不同：'回避'并不带'我要逃走'的主观意识。那么，回避型'回避'的心理本质是什么？", "options": ["失去兴趣后的观察期，不是带主观意识的逃避", "主观想逃", "胆小", "不爱任何人"], "ans": 0, "exp": "原文：回避不是逃避——逃避有主观意识，但真正的回避型没有“我要逃走”的主观意识…他对你失去了兴趣", "id": "Q0312"}, {"type": "single", "cat": "love", "q": "失恋让一个人痛苦的根本原因是什么？", "options": ["失去了那个人", "在那个时期对那个人的执着", "自己不够好", "对方太优秀"], "ans": 1, "exp": "原文：失恋让一个人痛苦的，不是那个人，而是在那个时期对那个人的执着。", "id": "Q0313"}, {"type": "single", "cat": "love", "q": "修习“无分别心”应当循序渐进，而非一开始就强求无分别。其具体主张是什么？", "options": ["先把粗重习气和明显恶念转为善念（需要很大分别心），再逐步无分别", "一开始就强求无分别", "努力让自己无分别", "完全不管分别心"], "ans": 0, "exp": "原文：不要一上来就修分别心，而是把粗重的习气和明显的恶念转化为善念，这时需要很大分别心", "id": "Q0314"}, {"type": "single", "cat": "love", "q": "女人的理性、智慧，同时等价于男人的什么？", "options": ["财", "情", "权", "名"], "ans": 1, "exp": "原文：因为女人的理性、智慧，同时等价于男人的情。", "id": "Q0315"}, {"type": "single", "cat": "love", "q": "在万物类象中，'爱'的定位对应的是生你的那个东西。那么在万物类象里，'爱'的定位是什么？", "options": ["食伤", "财星", "每个人的印星", "比劫"], "ans": 2, "exp": "原文：在万物类象中，爱的定位就是每个人的印星，生你的东西就是你精神层面的追求。", "id": "Q0316"}, {"type": "single", "cat": "love", "q": "一片木火之气（阳气过盛）的人，其“慢心”带有怎样的属性？", "options": ["狂、奔放有攻击性、说不得一说就爆炸", "阴沉压抑", "冷漠", "婉转"], "ans": 0, "exp": "原文：一片阳气过盛（木火之气过盛）的人表达的慢心带狂的属性、奔放有攻击性；…一说就爆炸", "id": "Q0317"}, {"type": "single", "cat": "love", "q": "回避型人格有一种典型行为：即使一开始热情，也会突然冷静下来，这被称为“观察期”。回避的“观察期”是什么？", "options": ["很热烈之后突然冷静下来，试探安全边界、安全感、自在感、安全距离", "完全不理任何人", "装冷漠", "工作忙"], "ans": 0, "exp": "原文：他一开始就给你留了观察期…很热烈之后突然冷静下来，这就进入观察期——这是在试探自己安全的边界", "id": "Q0318"}, {"type": "single", "cat": "love", "q": "在男女之间的'爱'上，存在'无私（无条件）'与'有条件'这两种不对称的属性论断。关于男女之爱的差别，正确的论断是什么？", "options": ["男人的爱必须是无私的（无条件的），女人的爱必须是有条件的", "男女之爱都要无私", "女人的爱要无私", "不分男女要求无私是对的"], "ans": 0, "exp": "原文：男人的爱必须是无私的…男人的爱必须是无条件的，女人的爱必须是有条件的", "id": "Q0319"}, {"type": "single", "cat": "love", "q": "对情感驱动（有情）的女人而言，存在一个“最大的功课”，它直接决定她的福泽和生命维度。这个最大的功课是什么？", "options": ["找到更多财物", "把大脑完全放空，能不能做到直接决定她的福泽和生命维度", "多交往男人", "变得理性"], "ans": 1, "exp": "原文：这就是有情的女人最大的功课：能不能把大脑完全放空，直接决定她的福泽和生命维度。", "id": "Q0320"}, {"type": "single", "cat": "love", "q": "道家修行中的“过情关”，强调的是放下对欲望的牵绊，而不是消灭情或欲的能力。道家修行的“过情关”是指什么？", "options": ["不再被欲望所动", "彻底没有欲望", "只有情没有欲", "断情绝爱"], "ans": 0, "exp": "原文：过情关就是不再被欲望所动，道家修的就是这个——不是没有情或欲的能力，而是不被牵绊", "id": "Q0321"}, {"type": "single", "cat": "love", "q": "当你爱上回避型的人并对其产生情之后，会怎样？", "options": ["他会感到痛苦有压迫感，开始回避、超级冷漠，触发你的愤怒嗔恨", "他会更爱你", "他会接受你", "他无感"], "ans": 0, "exp": "原文：你一旦对他产生了情，他就会感到痛苦、有压迫感，就会跑了；他开始回避你的情时会超级冷漠", "id": "Q0322"}, {"type": "single", "cat": "love", "q": "最终能够“搞定、平衡得了”回避型人格的，只有什么样的人？", "options": ["精神驱动的人", "责任感驱动的人", "物质驱动的人", "情感驱动的人"], "ans": 0, "exp": "原文：只有精神驱动的人最终才能搞定回避、才能平衡得了它", "id": "Q0323"}, {"type": "single", "cat": "love", "q": "“天道酬勤”中的“勤”字，其本义与德行修养相关，而非简单的努力做事。它被理解为什么？", "options": ["让自己勤奋地成为有德行的人（进德修业）", "拼命努力做事", "多学知识刺激欲望", "废寝忘食奋斗"], "ans": 0, "exp": "原文：勤不是努力做事思考，而是让自己勤奋地成为有德行的人，是进德修业的意思", "id": "Q0324"}, {"type": "single", "cat": "love", "q": "'破我执'是在情感关系中才会真正发生的过程，而非靠讲道理实现。破我执的本质被描述为什么？", "options": ["互相伤害的过程，在情感中体验自我执着的痛苦才逐渐觉醒", "靠讲道理", "靠出家", "靠金钱"], "ans": 0, "exp": "原文：破我执就是互相伤害的过程，只有在情感中体验到自我执着的痛苦，才会逐渐觉醒", "id": "Q0325"}, {"type": "single", "cat": "love", "q": "“破了情执”的人，其核心内心状态是什么？", "options": ["内心平静、如如不动，不再被情牵动思绪", "无情无欲失去能力", "永远悲伤", "不再爱人"], "ans": 0, "exp": "原文：破了情执的人内心很平静、如如不动，不再被情牵动思绪，包括对家人", "id": "Q0326"}, {"type": "single", "cat": "love", "q": "回避型人格在人群中占有一定比例，而且标准的回避几乎是没有承受能力的。那么，大约有多少人属于回避型？", "options": ["大概 50% 的人都是回避型，标准的回避几乎是没有承受能力的", "只有1%", "每个人都是回避", "回避很罕见"], "ans": 0, "exp": "原文：大概 50% 的人都是回避型，非常多…但标准的回避几乎是没有承受能力的", "id": "Q0327"}, {"type": "single", "cat": "love", "q": "关于“动心”这一概念，下列哪种说法正确？", "options": ["你对什么动心就与什么同频，动心是出现了让你生命得到平衡的能量", "动心就是动情", "动心伴随情欲", "只有有情的人才能动心"], "ans": 0, "exp": "原文：你对什么动心就与什么同频…动心是出现了让你生命得到平衡的能量", "id": "Q0328"}, {"type": "single", "cat": "love", "q": "婚姻的定义是什么？它代表一个人对什么的本质需求，和爱与喜欢有无关系？", "options": ["两个人相爱", "婚姻代表一个人对于归属感的需求，和爱不爱、喜不喜欢都没有关系", "生育子女", "经济合作"], "ans": 1, "exp": "原文：婚姻的定义：婚姻代表一个人对于归属感的需求，和爱不爱、喜不喜欢都没有关系。", "id": "Q0329"}, {"type": "single", "cat": "love", "q": "在'被爱 & 付出爱'的含义中，'爱'被定义为什么？", "options": ["尊重、理解、包容", "控制", "索取", "占有"], "ans": 0, "exp": "原文：被爱 & 付出爱：爱是尊重、理解、包容", "id": "Q0330"}, {"type": "single", "cat": "love", "q": "“有爱的人”在付出之后的满足感来源于什么？", "options": ["自己完成付出那一刻的快乐", "他的付出真实地满足了你的需要", "对方夸赞他", "付出本身"], "ans": 1, "exp": "原文：有爱的人的满足感来源于他的付出真实地满足了你的需要。", "id": "Q0331"}, {"type": "single", "cat": "love", "q": "与回避型人格“恋爱模式”的核心规则，是你越主动反而越得不到回应。其核心规则是什么？", "options": ["你对回避越主动，他就越躲", "你越主动他越爱你", "越殷勤越牢固", "付出多必有回报"], "ans": 0, "exp": "原文：核心规则：你对回避越主动，他就越躲", "id": "Q0332"}, {"type": "single", "cat": "love", "q": "从五行能量的层面看，说“女人是情做的”，其缘由是什么？", "options": ["在五行层面生女人的东西是男人的情", "女人天生无情", "女人和男人磁场一样", "女人只靠物质活着"], "ans": 0, "exp": "原文：在五行层面生女人的东西是男人的情，所以说女人是情做的", "id": "Q0333"}, {"type": "single", "cat": "love", "q": "关于“爱的表达”：根据这套理论，有爱的男人在语言表达上通常有什么特点？", "options": ["有爱的男人不会说“我爱你”，爱不需要表达", "爱必须说出口才成立", "说得多才真爱", "用英文说才是表达"], "ans": 0, "exp": "原文：有爱的男人不会说“我爱你”。爱从来都不需要表达，能说出来的都不是爱", "id": "Q0334"}, {"type": "single", "cat": "love", "q": "在'导致痛苦'这件事上，'自身不平衡'与'错误的知见'被做了区分，其中后者才是根本。导致痛苦的根本根源是什么？", "options": ["自身的不平衡", "错误的知见", "对方的过错", "命运的不公"], "ans": 1, "exp": "原文：导致痛苦的根源不是自身的不平衡，而是错误的知见。", "id": "Q0335"}, {"type": "single", "cat": "love", "q": "人对现实感到失望，通常是因为什么？", "options": ["内心充满了贪着", "运气差", "被亏待", "缺钱"], "ans": 0, "exp": "原文：对现实感到失望：通常是因为内心充满了贪着", "id": "Q0336"}, {"type": "single", "cat": "love", "q": "在修行与心性的语境中，某些人际情境最容易激起一个人的'我慢心'。那么，面对什么最容易激起我慢心？", "options": ["别人的嗔恨、愤怒、道德绑架", "别人的欣赏", "独处", "美景"], "ans": 0, "exp": "原文：面对别人的嗔恨、愤怒、道德绑架最容易激起我慢心", "id": "Q0337"}, {"type": "single", "cat": "love", "q": "“情”作为一种能量，它偏向于下列哪种层面？", "options": ["理性思维", "智慧", "人的感受，来自内心或情绪方面的感受", "事业"], "ans": 2, "exp": "原文：情的能量偏向人的感受，来自内心或情绪方面的感受。", "id": "Q0338"}, {"type": "single", "cat": "love", "q": "与回避型人格能够合拍相处的伴侣应具备的特质，都指向不施加压力与控制。那么回避型人格合适的伴侣是怎样的？", "options": ["不对他动情、对他的热情如如不动、对他完全没有控制欲的人", "对他特别热情的人", "也回避他的人", "强势支配他的人"], "ans": 0, "exp": "原文：回避合适的伴侣：不对他动情、对他的热情如如不动的人", "id": "Q0339"}, {"type": "single", "cat": "love", "q": "'爱'与'情'各自有最精炼的定义，二者都涉及付出但侧重点不同。那么，'爱与情'应如何定义？", "options": ["爱是付出的需要，情是付出的意愿", "爱是付出的意愿，情是付出的需要", "爱与情无区别", "爱是索取，情是付出"], "ans": 1, "exp": "原文：爱是付出的意愿，情是付出的需要。", "id": "Q0340"}, {"type": "judge", "cat": "love", "q": "男女“纯友谊”的前提是双方对彼此都没情、关系与情无关；男人能对女人毫不动念，说明女人对他毫无性吸引力；情感驱动的女人遇到对自己不动念的男人反而会动情。", "ans": true, "exp": "原文：纯友谊就是两个人对彼此都没有情。男人如果能对一个女人毫不动念，对女人来说就是自己对他毫无性吸引力。情感驱动的女人，遇到对自己不动念的男人反而开始动情。", "id": "Q0341"}, {"type": "judge", "cat": "love", "q": "真正的情是让自己很容易开心起来的能力，共情是也想让别人开心起来的能力；普通人看到视频感到对方痛苦只是容易被负能量影响，不是共情。", "ans": true, "exp": "原文：真正的情是让自己很容易开心起来的能力，而共情也是想让别人开心起来的能力。普通人认为的看到一些视频会感受到对方的痛苦，这只是很容易被负能量影响到，这不是共情。", "id": "Q0342"}, {"type": "judge", "cat": "love", "q": "两个有爱的人能成为伴侣，但不能有情感上的交流；双方或一方一旦动情就会非常痛苦。所以不是情感驱动的人，人生最重要的功课就是不要动情。", "ans": true, "exp": "原文：两个有爱的人也能成为伴侣，但他们不能有情感上的交流，最大困惑是双方或一方一旦动情就会非常痛苦。所以不是情感驱动的人，人生最重要的功课就是不要动情。", "id": "Q0343"}, {"type": "judge", "cat": "love", "q": "当女人开始心疼操劳（事业劳累）的男人时，通常说明这男人是高度责任感驱动的，此时男人的事业会迅速腾飞。", "ans": true, "exp": "原文：而当一个女人心疼男人时，通常是因为男人事业操劳、身体的劳累，这种心疼不是同情，而是真正的心疼。只有男人是高度责任感驱动的人才会得到女人这种真实的心疼感。当女人开始心疼男人的时候，男人的事业会迅速腾飞。", "id": "Q0344"}, {"type": "judge", "cat": "love", "q": "回避专治我慢心；你会喜欢上回避是因为喜欢它一开始对你的情，而回避不喜欢的就是你的情——他对你有情，是因为你一开始对他没有情。", "ans": true, "exp": "原文：回避专治我慢心…你会喜欢上回避，也是因为喜欢回避一开始对你的情，但回避不喜欢的就是你的情——他对你有情，是因为你一开始对他没有情", "id": "Q0345"}, {"type": "judge", "cat": "love", "q": "挣脱 PUA 意味着挣脱对情的执着（情执）；情执执着的对象不是人，是对方的情、是被爱，本质是对自我的执着。挣脱精神控制第一步是觉察。", "ans": true, "exp": "原文：要挣脱PUA，意味着要挣脱对情的执着…第一步是觉察到自己被精神控制了；第二步是阻隔——物理阻隔＋拒绝回应", "id": "Q0346"}, {"type": "judge", "cat": "love", "q": "当你问一个人爱不爱你、在意别人怎么对待你、在意别人需不需要你时，其本质都是自我价值感的缺失（不配得感）。", "ans": true, "exp": "原文：当你在问一个人爱不爱你的时候，它的本质是你的自我价值感的缺失。当你在意别人怎么对待你的时候、当你在意别人需不需要你的时候，它的本质都是自我价值感缺失而影响的。", "id": "Q0347"}, {"type": "judge", "cat": "love", "q": "女生对自己伴侣动情的标志是非常主动；情感驱动女生喜欢“自己对伴侣动手动脚”，精神驱动女人喜欢“伴侣对自己动手动脚”。", "ans": true, "exp": "原文：女生会非常主动，就是女生对于自己伴侣动情的标志。情感驱动的女生会喜欢对自己伴侣动手动脚。而精神驱动的女人会喜欢伴侣对自己动手动脚。", "id": "Q0348"}, {"type": "judge", "cat": "love", "q": "情感驱动并不强调你是一个有情绪波动的人；任何驱动力的人生命中都会充满各种情绪起伏。容易共情、容易感动不一定就是情感驱动的。", "ans": true, "exp": "原文：重要澄清：情感驱动并不是在强调你是一个有情绪波动的人…你容易共情、容易同情别人、容易感动…都不一定是情感驱动的。", "id": "Q0349"}, {"type": "judge", "cat": "love", "q": "听到别人说“我爱你”会难受、压迫、下头甚至恶心的女生，是不配得感强，越恶心不配得感越强；50%左右的女生都是这种类型。", "ans": true, "exp": "原文：听到别人说我爱你会难受、压迫、下头甚至恶心的，是不配得感强的女生，越恶心不配得感越强…50%左右的女生都是这种类型", "id": "Q0350"}, {"type": "judge", "cat": "love", "q": "“要爱，却得到情”的感受是下头、恶心、压迫感，这正是回避型人格的感受；回避遇到你她可能觉得你很变态，其实只是不适合、没有缘分。", "ans": true, "exp": "原文：如果我要的是你的爱，你却给我的情，感受就是下头、恶心、压迫感…这就是回避型人格的感受。不是回避变态", "id": "Q0351"}, {"type": "judge", "cat": "love", "q": "女回避通常抗压能力比较强，男回避抗压能力很弱；无论男女，回避的都是伴侣的情、控制欲，其实回避的是过度的情感驱动。", "ans": true, "exp": "原文：女回避通常抗压能力比较强，男回避抗压能力很弱。无论回避男或回避女，回避的都是伴侣的情、控制欲——其实回避的是过度的情感驱动", "id": "Q0352"}, {"type": "judge", "cat": "love", "q": "情感模式没有“应该”“适配”一说，一切由缘分决定；匹配程度相当于两人相处的难度（矛盾的多少）。", "ans": true, "exp": "原文：五种驱动类型之间存在着情感模式的匹配关系。情感模式没有“应该”“适配”一说，一切由缘分决定，仅作参考。情感模式的匹配程度＝两人相处的难度（矛盾的多少）。", "id": "Q0353"}, {"type": "judge", "cat": "love", "q": "两个都是回避的相处模式是相敬如宾、稳定而不热烈；本质上没有幸福可言，但可以很稳定，彼此对对方的情都没有任何需求。", "ans": true, "exp": "原文：通常两人都是回避的情况下，相处模式是相敬如宾…本质上他们没有幸福可言，但是可以很稳定，彼此对对方的情都没有任何需求", "id": "Q0354"}, {"type": "judge", "cat": "love", "q": "当有人用“定力”（不动念）戳到情感驱动女生的自尊心／我慢心时，情就来了；内心越有定力的人，别人对你越深情。", "ans": true, "exp": "原文：当有一个人用定力戳到你的自尊心/我慢心的时候，情就来了。内心越有定力，别人对你越深情（例：榜一大哥喜欢不理他的女主播）。", "id": "Q0355"}, {"type": "judge", "cat": "love", "q": "女生和不喜欢的对象在一起/结婚的很多，通常需要对方的情或物质条件；男人没法勉强自己，通常不会和不喜欢的女人在一起。", "ans": true, "exp": "原文：女生和不喜欢的人在一起/结婚的很多，通常是需要对方的情或物质条件，只要对她好就可接受…但男人没法勉强自己", "id": "Q0356"}, {"type": "judge", "cat": "love", "q": "伴侣急于要求你公开关系、宣誓主权，往往暗藏自我价值感缺失，迟早显化巨大控制；不回应控制欲、不公布反而是正当的。", "ans": true, "exp": "原文：伴侣要求你公开表明身份时矛盾在所难免，因为暗藏自我价值感缺失…不答应要求、不公布就是不回应控制欲，反而是正当的", "id": "Q0357"}, {"type": "judge", "cat": "love", "q": "情感驱动女生的典型表现是：产生矛盾就开始怀疑“他不爱我”，只要对方表现出很理智很淡，就怀疑对方不爱自己。", "ans": true, "exp": "原文：情感驱动女生的典型表现，就是产生矛盾就开始怀疑“他不爱我”。对方只要表现出很理智很淡的状态，自己就会怀疑对方不爱自己。", "id": "Q0358"}, {"type": "judge", "cat": "love", "q": "喜欢或爱上一个人，是因为此人能量振动与自己相近、能量相匹配契合，这种内心安宁的感受就是幸福的感觉。", "ans": true, "exp": "原文：喜欢或爱上另一个人…正是因为此人的能量振动与自己相近、能量与自己相匹配契合，这种内心安宁的感受就是幸福的感觉，是一种平衡的觉受。", "id": "Q0359"}, {"type": "judge", "cat": "love", "q": "母亲过度的负面情绪会让孩子缺乏自我价值感，男生更严重，会产生“不配得感”、怀疑别人不爱自己。", "ans": false, "exp": "原文：母亲如果没有健康的情，不能跟孩子共情，会让孩子缺乏自我价值感。男孩子长大以后会不自信；女孩子会更严重一点，她会有不配得感和自我价值感的缺失。", "id": "Q0360"}, {"type": "judge", "cat": "love", "q": "快熬出头时我执总跳出来给你找各种理由，让你放弃对正知正见的坚持；动一个妥协的念头就相当于给他吃一顿饭。", "ans": true, "exp": "原文：它总及时跳出来给你心理安慰（或许他还爱你、有个机会…），让你放弃对正知正见的坚持…动一个妥协的念头就相当于给他吃一顿饭", "id": "Q0361"}, {"type": "judge", "cat": "love", "q": "一见钟情若真存在，其特征是有爱的人不动情、似曾相识熟悉感、太极阴阳层面的重合；看到一个人动了欲望不能叫一见钟情。", "ans": true, "exp": "原文：有爱的人不动情，但就是跟你似曾相识…它没有动情，而是熟悉感，维度远高于动情。它是两个太极之间的重合", "id": "Q0362"}, {"type": "judge", "cat": "love", "q": "再伟大的男人也会在女人的真情之下败下阵来，甘于被管教、被约束。真正能管住男人的，是女人用脑袋想出来的。", "ans": false, "exp": "原文：所以再伟大的男人也会在女人的真情之下败下阵来…真正能管住男人的东西，不是女人用脑袋想出来的，而是女人情感的自然流露。", "id": "Q0363"}, {"type": "judge", "cat": "love", "q": "当一个情感驱动的女人拼命动脑子，她口中所谓的\"爱\"本质上是男人的\"情\"，所以她说的爱并不是爱。", "ans": true, "exp": "原文：如果一个情感驱动的女人拼命动脑子，她生命当中会不停质疑别人爱不爱她，而且她口中的\"爱\"本质上是男人的\"情\"，所以她说的爱并不是爱。", "id": "Q0364"}, {"type": "judge", "cat": "love", "q": "跟母亲关系处理不好的女人，本质上会抗拒男人的情；因为母亲的陪伴和男人的情在万物类象中是相同的定位。", "ans": true, "exp": "原文：这也是为什么跟母亲关系处理不好的女人得不到男人情的原因…因为母亲的陪伴和男人的情在万物类象中、在女人生命当中是相同的定位。", "id": "Q0365"}, {"type": "judge", "cat": "love", "q": "不是责任感驱动的女人，完全不需要男人的陪伴，甚至男人陪伴会觉得痛苦、全身不舒服，待在一起几天就会吵架。", "ans": true, "exp": "原文：反过来：不是责任感驱动的女人，就完全不需要男人的陪伴，甚至男人陪伴会觉得痛苦、全身不舒服，待在一起几天就会吵架。", "id": "Q0366"}, {"type": "judge", "cat": "love", "q": "只要男人不是情感驱动，就可以和前任做朋友；女人若既不是情感驱动也不是精神驱动，才可能和前任做朋友。", "ans": true, "exp": "原文：男人只要不是情感驱动就可以和前任做朋友。（对女人来说）除非她既不是情感驱动也不是精神驱动的女人，才可能和前任做朋友。", "id": "Q0367"}, {"type": "judge", "cat": "love", "q": "通常被一个男人“我爱你”打动，是因为他给出了让你满意的对价（如金钱物质），感动的其实是背后的钱。", "ans": true, "exp": "原文：通常被一个男人说我爱你感到开心的话，一定是因为他不只说了这三个字，同时付出了很多东西、给出了让你满意的对价（如金钱物质）", "id": "Q0368"}, {"type": "judge", "cat": "love", "q": "一个真正做事业的（创业）男人，一旦控制不住开始动欲望（特别是情欲），他的事业就会开始衰败，这是自然规律。", "ans": true, "exp": "原文：一个真正做事业（创业）的男人，一旦控制不住开始动欲望，特别是情欲，他的事业就会开始衰败，这是自然规律。", "id": "Q0369"}, {"type": "judge", "cat": "love", "q": "百分之七八十的情况下情感驱动的女生不是精神驱动的，会主动回避男人的情，所以这类女生男生追是没用的。", "ans": true, "exp": "原文：百分之七八十的情况下情感驱动的女生不是精神驱动的，百分之七八十会主动回避男人的情。所以这类女生，男生追是没用的。", "id": "Q0370"}, {"type": "judge", "cat": "love", "q": "有爱的女生审核男人的方式是“他对自己好不好、付出多少”；有情的女人审核的方式是“我喜不喜欢”。", "ans": true, "exp": "原文：男人对自己好，这是有爱的女生的审核方式。但有情的女人不是这样，有情的女人的审核方式不是他对不对我好，而是“我喜欢”。", "id": "Q0371"}, {"type": "judge", "cat": "love", "q": "我们在情感中感受到悲伤、平时容易和别人共情，这些一定是情感驱动的表现。", "ans": false, "exp": "原文：我们在情感中感受到悲伤、平时容易和别人共情、甚至很想要为别人付出等等，这些都不代表是情感驱动的表现——它有可能是情感过度的表现（过度的情感驱动），这不是正能量。", "id": "Q0372"}, {"type": "judge", "cat": "love", "q": "如果你的伴侣是有积极情感能力的人，而你是过度情感驱动的人，说明你们俩本来就没缘分。", "ans": true, "exp": "原文：如果你的伴侣是有积极情感能力的人，而你是过度情感驱动的人，说明你们俩本来就没缘分。因为有积极情感能力的人的伴侣一定是理智的人、精神驱动。", "id": "Q0373"}, {"type": "judge", "cat": "love", "q": "情感驱动+精神驱动同时具备的女生，姻缘会比较浅，身边稳定伴侣存在或可能性会比较低，聚少离多反而更适合。", "ans": true, "exp": "原文：精神驱动+情感驱动同时具备的女生，她的姻缘就会比较浅。但也不是完全不会有，聚少离多可能更适合。", "id": "Q0374"}, {"type": "judge", "cat": "love", "q": "过度的爱也是精神焦虑、担忧，出于焦虑担忧做了很多对方不需要的、没有必要的考虑和付出。", "ans": true, "exp": "原文：即使是过度的爱也是为了你好、不是为自身；过度的爱就是过度的精神焦虑、担忧，出于焦虑担忧做了很多你不需要的、没有必要的考虑和付出。", "id": "Q0375"}, {"type": "judge", "cat": "love", "q": "回避型人格要的是对方的爱而不是情，因为他自己是有情的人不需要别人的情；他唯一要的是不被控制的自由。", "ans": true, "exp": "原文：回避型人格要的是对方的爱而不是情，因为他自己是个有情的人，不需要别人的情…唯一要的是不被控制的自由", "id": "Q0376"}, {"type": "judge", "cat": "love", "q": "纠结喜欢一个不理自己的男人（妄想症特征）的女生，有且只有一种核心驱动力——情感驱动，且最不喜欢精神驱动。", "ans": true, "exp": "原文：这样的女生有且只有一种核心驱动力——情感驱动…她一定没有/最不喜欢的驱动力是精神驱动", "id": "Q0377"}, {"type": "judge", "cat": "love", "q": "女回避真跑了就是跑了；男回避会尝试挽回、沟通，沟通无效才彻底消失，且长时间不找他他会回来找你。", "ans": true, "exp": "原文：女回避真的跑了就是跑了…但男回避会尝试着去挽回、沟通和改变…当你长时间不找男回避的时候，他就会回来找你", "id": "Q0378"}, {"type": "multi", "cat": "parent", "q": "关于父母对孩子的影响，以下说法正确的是哪些？（多选）", "options": ["孩子的自我价值感、责任感和情感是最容易受父母影响的东西", "一个孩子同时亲近父母双方是比较罕见的，多数只能亲近一方", "孩子的驱动力最不容易受影响", "孩子的事业最不容易受影响"], "ans": [0, 1], "exp": "原文：孩子的自我价值感、责任感和情感，是最容易受到父母影响的东西。一个孩子同时亲近自己的父亲和母亲，是比较罕见的，多数是只能亲近某一方。", "id": "Q0517"}, {"type": "multi", "cat": "parent", "q": "要做到真正的孝（孝顺父母），应当怎样做、需要具备哪些认知与心态？请选出正确的选项。（多项）", "options": ["真正要做到孝的功课，是契入因果层面的智慧、全面用因果层面智慧去做到孝", "不是对父母好——对父母好并不是大孝，一边对父母好一边怨恨抱怨没有意义", "心中能对父母升起慈悲心、感恩心甚至平等心，不投射情执、贪求、怨恨，就趋近于孝", "孝就是一味忍受父母的打骂"], "ans": [0, 1, 2], "exp": "原文：真正要做到孝的功课，是契入因果层面的智慧…不是对父母好——\"始于事亲，终于立身\"，对父母好并不是大孝…心中能对父母升起慈悲心、感恩心甚至平等心…就趋近于孝。", "id": "Q0518"}, {"type": "multi", "cat": "parent", "q": "关于原生家庭、与父母亲人之间业力纠缠中的'共业'，对其本质及表现做了界定。以下哪些说法是正确的？", "options": ["他对你不好，你就恨他", "他对你有贪着，你就对他就没有感恩", "他无法善待你，你也无法原谅他，就是共业关系", "共业就是同频的负能量"], "ans": [0, 1, 2, 3], "exp": "原文：共业就是\"他对你不好，你就恨他\"；\"他对你有贪着，你对他就没有感恩\"…本质上同频的负能量：他无法善待你，你也无法原谅他，这就是共业关系。", "id": "Q0519"}, {"type": "multi", "cat": "parent", "q": "情感驱动的女生被父母逼婚压力最大，压力来自哪两方面？", "options": ["她很难和自己不喜欢的人在一起、勉强不来自己", "她没办法不在乎父母家人的感受", "她害怕孤独", "她没安全感"], "ans": [0, 1], "exp": "原文：1 她很难和自己不喜欢的人在一起、勉强不来自己，所以恋爱困难；2 她没办法不在乎父母家人感受", "id": "Q0520"}, {"type": "single", "cat": "parent", "q": "\"孩子的早运与父母基本上是契合的；但如果孩子的气运与父母形成鲜明矛盾与反差，意味着从出生开始你与亲生父母的姻缘非常浅薄。\"这属于哪个结论？", "options": ["与父母没有因果关系", "财印平衡", "共业招感", "度驱动力匹配"], "ans": 0, "exp": "原文：父母的善根与子女的善根之间有对应关系；孩子的早运与父母基本上是契合的。但如果孩子的气运与父母形成鲜明矛盾与反差，意味着从出生开始你与亲生父母的姻缘非常浅薄。", "id": "Q0521"}, {"type": "single", "cat": "parent", "q": "如果一个人人生际遇很好、开运很早，又有积极情感能力的父亲，或拥有积极情感驱动的父亲又拥有积极情感驱动的妻子，事业会来得如何？", "options": ["非常晚", "开始得非常早", "没有影响", "不确定"], "ans": 1, "exp": "原文：如果一个人人生际遇很好（从小或开运很早），又能有给到积极情绪的…父亲；或一个男人拥有积极情感驱动的父亲又拥有积极情感驱动的妻子…事业就会开始得非常早。", "id": "Q0522"}, {"type": "single", "cat": "parent", "q": "\"创业起家的人，很难匹配到孩子也能创业\"；如果创一代和孩子关系很融洽，这个孩子就？", "options": ["会成为创二代", "一定不会成为创二代，只有可能是富二代（大概率会是资本家）", "一定会守业", "一定破产"], "ans": 1, "exp": "原文：责任感驱动的父亲需要孩子的自我价值感。所以创业起家的男人，很难匹配到孩子也是能创业的。如果创一代和孩子的关系很融洽，这个孩子就一定不会成为创二代…只有可能是富二代，大概率会是资本家。", "id": "Q0523"}, {"type": "single", "cat": "parent", "q": "\"我投射了不切实际的期待，硬要父母给我给不出的东西，他们给不出，所以我痛苦\"，这实际上是哪种执着所产生的痛苦？", "options": ["对财富的执着", "对自我的执着", "对地位的执着", "对名声的执着"], "ans": 1, "exp": "原文：意识到\"我投射了不切实际的期待，硬要父母给我给不出的东西…\"，这才是痛苦的根源，是对自我的执着所产生的痛苦。", "id": "Q0524"}, {"type": "single", "cat": "parent", "q": "\"期待父亲是一个情感丰富的人、情感驱动的人\"，对应的是哪个驱动力的需要？", "options": ["物质驱动", "责任感驱动", "情感驱动", "精神驱动"], "ans": 1, "exp": "原文：父亲的情（责任感驱动的人需要）：对父亲的情的需要意味着：期待或需要父亲是一个情感丰富的人、情感驱动的人，这对应的是责任感驱动的人。", "id": "Q0525"}, {"type": "single", "cat": "parent", "q": "\"需要母亲的爱\"（需要母亲积极的智慧层面的加持）对应的是哪个驱动力？", "options": ["物质驱动", "责任感驱动", "情感驱动", "精神驱动"], "ans": 1, "exp": "原文：母亲的爱　对应　责任感驱动：因为生印星的东西就是克你的东西，克你的东西生生你的东西…什么样的人非常需要母亲的智慧？责任感驱动的人。", "id": "Q0526"}, {"type": "single", "cat": "parent", "q": "卷孩子读书、接纳不了孩子不是读书的料、被成绩逼疯的母亲，通常是哪种驱动？", "options": ["自我价值感驱动", "责任感驱动", "物质驱动", "情感驱动"], "ans": 0, "exp": "原文：卷孩子读书的母亲：自我价值感驱动的妈妈接纳不了孩子不是读书的料，非要卷、非要读多点、被成绩逼疯——这是妈妈自身执着", "id": "Q0527"}, {"type": "single", "cat": "parent", "q": "如果你能从父母自身因果看到对方一生背后的业力场，会自然而然生出什么？", "options": ["怨恨", "慈悲心、宽恕和原谅", "嫉妒", "恐惧"], "ans": 1, "exp": "原文：如果你能从父母自身因果看到对方一生背后的业力场，会自然而然地生出慈悲心、宽恕和原谅很多原生家庭中…对你有负面影响的事情。", "id": "Q0528"}, {"type": "single", "cat": "parent", "q": "孩子对男人（责任感驱动的男人）的形成有什么意义？", "options": ["孩子会拖累事业", "孩子会形成某种特殊的执着，生孩子是开运的标志，事能不能沉淀成事业，孩子的存在比女人的情更重要", "孩子与事业无关", "孩子让男人变懒"], "ans": 1, "exp": "原文：生孩子是开运的标志…对于有孩子的男人来说就有了强劲的事业上进心…事能不能沉淀下来变成事业，孩子的存在比女人的情更重要。所以对男人来说，孩子会形成某种特殊的执着。", "id": "Q0529"}, {"type": "single", "cat": "parent", "q": "在与母亲和孩子的关系中，同时既兼顾母亲又能兼顾孩子的女人大约占多少？", "options": ["不到10%", "30%左右", "50%左右", "70%-80%"], "ans": 0, "exp": "原文：与孩子亲近的女人从小到大与母亲不太亲近（2选1占70%-80%），只有又有情又有爱的女人能同时兼顾，占不到10%。", "id": "Q0530"}, {"type": "single", "cat": "parent", "q": "\"需要父亲有精神追求、理性的人\"，通常是哪个驱动力的标志？", "options": ["物质驱动", "自我价值感驱动", "情感驱动", "责任感驱动"], "ans": 2, "exp": "原文：父亲的爱（情感驱动的人需要）：对父亲的爱有需求的人，需要父亲有精神追求、是理性的人…这通常是自身情感驱动的标志。本质是食伤生财的关系。", "id": "Q0531"}, {"type": "single", "cat": "parent", "q": "不论男女，从小到大无法与父亲相处、不讲话待一起就难受，意味着什么？", "options": ["不是物质驱动的人", "是情感驱动的人", "太自我", "是责任感驱动"], "ans": 0, "exp": "原文：若从小到大无法与父亲相处、不讲话待一起就不舒服难受，意味着你无法接受或内心不需要父亲的陪伴，意味着你不是物质驱动的人", "id": "Q0532"}, {"type": "single", "cat": "parent", "q": "\"需要母亲是负责任的女人、母亲有上进心\"对应的是哪个驱动力？", "options": ["责任感驱动", "物质驱动", "精神驱动", "情感驱动"], "ans": 1, "exp": "原文：母亲的责任感驱动 + 你的物质驱动：…通常情况下自己是物质驱动的人，如果与母亲之间有足够缘分，你的母亲就会是责任感驱动的人。", "id": "Q0533"}, {"type": "single", "cat": "parent", "q": "以'辛巴'的案例来看，他开运早的原因是？", "options": ["他很有钱", "他的父亲就是一个情感驱动的人，他对父亲的情有需求且刚好拥有情感驱动的父亲，加上妻子情极深极重", "他非常努力", "他是富二代"], "ans": 1, "exp": "原文：辛巴即这种类型：他的父亲就是一个情感驱动的人…他对父亲的情有需求，而他刚好拥有情感驱动的父亲，所以开运特别早。他的妻子是情极深极重…表现力超强的女人。", "id": "Q0534"}, {"type": "single", "cat": "parent", "q": "过度的驱动力传递中，给孩子压迫感最大的母亲是哪种？", "options": ["情感驱动的母亲", "过度/积极精神驱动的母亲", "物质驱动的母亲", "责任感驱动的母亲"], "ans": 1, "exp": "原文：过度精神驱动的母亲给孩子压迫感最大：过度或积极精神驱动的母亲…给孩子的建议本质上给孩子造成一种最具压迫感的感受…比情感给孩子带去的负能量更大。", "id": "Q0535"}, {"type": "single", "cat": "parent", "q": "当一个人对父母投射出分别心、评判、念头时，这些投射在本质上是什么？", "options": ["财富", "自身的业障、自身业力的显化", "智慧", "情感"], "ans": 1, "exp": "原文：这个评判本身、这种对父母投射的分别心、对父母投射的念头，就是你自身的业障、就是你自身业力的显化——这才是关键中的关键。", "id": "Q0536"}, {"type": "single", "cat": "parent", "q": "\"喜欢亲近父亲、对父亲的陪伴和存在有需求\"，对应的是哪个驱动力的需要？", "options": ["物质驱动", "情感驱动", "责任感驱动", "精神驱动"], "ans": 0, "exp": "原文：父亲的陪伴（物质驱动的人需要）：见上文与财的关系…物质驱动的人对父亲的陪伴、存在有需求。", "id": "Q0537"}, {"type": "single", "cat": "parent", "q": "\"需要母亲的陪伴、天生想亲近母亲、待在母亲身边像充电\"，对应的是哪个驱动力？", "options": ["精神驱动", "物质驱动", "责任感驱动", "情感驱动"], "ans": 0, "exp": "原文：母亲的陪伴　对应　精神驱动：天生想亲近母亲、陪伴母亲，待在母亲身边像充电。", "id": "Q0538"}, {"type": "single", "cat": "parent", "q": "下列哪一位被认为是特别典型的责任感驱动类型（尤其男生的典型）？", "options": ["辛巴", "杨振宁", "张朝阳", "郭碧婷"], "ans": 0, "exp": "原文：辛巴是特别典型的责任感驱动类型（尤其是男生的典型）。他父亲是情感驱动的男人，所以有积极互动", "id": "Q0539"}, {"type": "single", "cat": "parent", "q": "智慧维度越高，所需要做的事情就越少；智慧深度越深，所需要做出的改变就越…", "options": ["越多", "越少", "不变", "越快"], "ans": 1, "exp": "原文：智慧维度越高，所需要做的事情就越少；智慧深度越深，所需要做出的改变就越少。", "id": "Q0540"}, {"type": "single", "cat": "parent", "q": "\"当你以什么样的身份存在，就进入什么样的业力场\"，这属于什么原理？", "options": ["阴阳平衡", "共业招感", "五行相生", "因果律"], "ans": 1, "exp": "原文：以某某人孩子的身份存在，就进入他的业力场…这是共业招感（见原生家庭与共业招感一节）。", "id": "Q0541"}, {"type": "single", "cat": "parent", "q": "孩子与父母之间存在姻缘（有缘分）的典型表现是什么？", "options": ["孩子的早运与父母的早运同步", "孩子出生在富裕家庭", "父母很优秀", "孩子很听话"], "ans": 0, "exp": "原文：你与父母的因缘表现在你出生在这样的家庭，共业招感来自气运同步——如果你的早运与父母的早运同步（父母坎坷你也坎坷）就是有缘分的表现。", "id": "Q0542"}, {"type": "single", "cat": "parent", "q": "这个世界上大约有多少人无法同时亲近自己的父亲与母亲？", "options": ["百分之二三十", "百分之四五十", "百分之八九十", "百分之百"], "ans": 2, "exp": "原文：这个世界上百分之八九十的人，基本上都没有办法同时喜欢亲近自己的父亲与母亲；很多情况是两个都亲近不了。", "id": "Q0543"}, {"type": "single", "cat": "parent", "q": "什么样的人与父母之间一定都会产生无法排解的矛盾？", "options": ["精神驱动的男人、情感驱动的男人", "精神驱动的男人、情感驱动的女人", "精神驱动的女人、情感驱动的男人", "物质驱动的男人、情感驱动的女人"], "ans": 1, "exp": "原文：什么人样的人与父母之间一定存在巨大矛盾？精神驱动的男人、情感驱动的女人，跟父母之间一定都会有无法排解的矛盾。", "id": "Q0544"}, {"type": "single", "cat": "parent", "q": "会和孩子争宠的女人（争的是老公的宠）通常是哪种驱动的人？", "options": ["情感驱动", "物质驱动", "精神驱动", "责任感驱动"], "ans": 2, "exp": "原文：会和孩子争宠的女人是极度/高度的精神驱动，占比80-90%以上，意味着需要伴侣的情非常多。", "id": "Q0545"}, {"type": "single", "cat": "parent", "q": "喜欢读书、不需要家长催、自己爱思考向往智慧的是哪种驱动的孩子？", "options": ["精神驱动", "情感驱动", "物质驱动", "责任感驱动"], "ans": 0, "exp": "原文：喜欢读书、不需要家长催的是精神驱动的孩子：自己爱思考、向往智慧、有学习追求。", "id": "Q0546"}, {"type": "single", "cat": "parent", "q": "父亲的负面情绪是克制孩子的东西，与之等价于同一种能量的还有什么？", "options": ["母亲的快乐", "母亲高度的焦虑", "母亲的财富", "母亲的情感"], "ans": 1, "exp": "原文：父亲的负面情绪和母亲高度的焦虑，是同一种能量。", "id": "Q0547"}, {"type": "single", "cat": "parent", "q": "同时能兼顾与母亲和孩子关系（既有情又有爱）的女人大约占多少？", "options": ["不到10%", "占70%-80%", "约占50%", "占90%以上"], "ans": 0, "exp": "原文：只有又有情又有爱的女人才能同时兼顾与母亲和孩子的关系，这样的女人不到 10%", "id": "Q0548"}, {"type": "single", "cat": "parent", "q": "从来不说“我为你好”的妈妈，输出最多的是（并生活充满焦虑）？", "options": ["自己的焦虑", "质问", "爱", "关心"], "ans": 0, "exp": "原文：焦虑的母亲：从来不说“我为你好”的妈妈生活充满焦虑，输出最多的是自己的焦虑", "id": "Q0549"}, {"type": "single", "cat": "parent", "q": "想改变固执的（过度价值感驱动）父亲，唯一可能的方式是什么？", "options": ["言语对抗", "改变他的观点", "行为对抗", "远离他"], "ans": 1, "exp": "原文：过度价值感驱动的父亲，想改变只有一种可能——改变他的观点（本质是改变观点）。", "id": "Q0550"}, {"type": "single", "cat": "parent", "q": "在不同驱动类型的母亲与孩子的关系中，自我价值感驱动的母亲更想从孩子那里得到的是什么？", "options": ["陪伴", "情感上的爱、精神力、理智，很需要孩子的理解接纳包容", "金钱", "玩乐"], "ans": 1, "exp": "原文：自我价值感驱动的母亲：会想要孩子精神上的爱、精神力、理智，不一定需要孩子的陪伴，但很需要孩子的理解、接纳和包容。", "id": "Q0551"}, {"type": "single", "cat": "parent", "q": "“孩子和母亲二选一”这一现象在女性中大约占多大比例？", "options": ["不到10%", "40%左右", "70%-80%", "90%以上"], "ans": 2, "exp": "原文：通常与孩子十分亲近的女人，从小到大与母亲不太亲近，占比绝大多数70%-80%。", "id": "Q0552"}, {"type": "single", "cat": "parent", "q": "在原生家庭中与家人相处、面对家人所投射的负能量时，正确对待家人的态度（做法）是什么？", "options": ["接纳对方就是这样的人、不被影响、保持定力", "纠正、惩罚、攻击", "对抗负能量", "远离一切家人"], "ans": 0, "exp": "原文：不对抗负能量，而是接纳对方就是这样的人（“你是怎么样的人我都可以”），这就是没有分别心；而不是纠正、惩罚、攻击", "id": "Q0553"}, {"type": "single", "cat": "parent", "q": "能否同时亲近父母，是自身哪两种五行能量平衡的表现？", "options": ["财星与比劫", "财星与印星", "官星与食伤", "印星与比劫"], "ans": 1, "exp": "原文：因为能否同时亲近父母，是自身财印平衡的表现。财星与印星两种五行能量相克而成太极。", "id": "Q0554"}, {"type": "single", "cat": "parent", "q": "\"父母之不我爱，与我何哉焉\"（孟子评价虞舜）的含义是什么？", "options": ["父母不爱我是父母的错", "父母爱不爱你跟你没有因果关系", "我因此要恨父母", "父母一定爱我"], "ans": 1, "exp": "原文：\"父母之不我爱，与我何哉焉\"：你的父母爱不爱你跟你没有因果关系。", "id": "Q0555"}, {"type": "single", "cat": "parent", "q": "关于“产后抑郁”的成因，下列哪种说法正确？", "options": ["90%的女生无法从母亲身上学会如何与孩子相处", "绝大多数产后抑郁的母亲没有母爱", "无情无爱的女人约占一半", "孩子和母亲二选一只在少数家庭发生"], "ans": 0, "exp": "原文：产后抑郁就是无法与孩子相处：90%的女生无法从母亲身上学会如何与孩子相处（哪怕母亲是很好的母亲）", "id": "Q0556"}, {"type": "single", "cat": "parent", "q": "关于'妈宝男'这一类型，其本质论断是什么？", "options": ["想承担责任、最终却承担不了任何责任", "完全不想承担任何责任", "对母亲全无控制", "必然是弱势的人"], "ans": 0, "exp": "原文：妈宝男是想承担责任、最终却承担不了任何责任的人；明明是责任感驱动的人，结果承担不了责任（这与不愿承担责任是两种性格）", "id": "Q0557"}, {"type": "single", "cat": "parent", "q": "过度情感驱动的母亲（情绪不稳定）给孩子的影响是什么？", "options": ["过度自信", "不配得感（没有自我价值感）", "过度理性", "对金钱贪婪"], "ans": 1, "exp": "原文：过度情感驱动的母亲（没有积极情感能力、情绪不稳定）给孩子的影响是不配得感。", "id": "Q0558"}, {"type": "single", "cat": "parent", "q": "学习最差、最容易在班中垫底的孩子通常是哪种驱动？", "options": ["精神驱动", "自我价值感驱动", "情感驱动", "责任感驱动"], "ans": 2, "exp": "原文：学习最差、垫底的通常是情感驱动（男女都是），情越重越垫底；艺术生大多情感驱动。", "id": "Q0559"}, {"type": "single", "cat": "parent", "q": "亲子关系中的'亲子缘分标志'具体指什么？", "options": ["孩子早运大概率和父母同步", "孩子长得像父母", "孩子很聪明", "孩子很听话"], "ans": 0, "exp": "原文：亲子缘分标志：孩子早运大概率和父母同步；如果不同步、严重反差，那孩子可能和父母的因缘很浅，孩子就不会出现在亲生父母身边。", "id": "Q0560"}, {"type": "single", "cat": "parent", "q": "'一切法无我，得成于忍'这句话出自哪部经典？", "options": ["道德经", "金刚经", "论语", "孟子"], "ans": 1, "exp": "原文：所以《金刚经》说\"一切法无我，得成于忍\"：老天没有给你修习安忍的机会，你不会拥有这样的心量。", "id": "Q0561"}, {"type": "single", "cat": "parent", "q": "在女人与孩子的关系中，精神驱动的母亲会向孩子投射哪一种能量？", "options": ["财", "情", "责任感", "物质"], "ans": 2, "exp": "原文：精神驱动的母亲：在孩子身上投射的能量是责任感——期待孩子有责任感驱动，总给孩子理性的建议。", "id": "Q0562"}, {"type": "single", "cat": "parent", "q": "'与母亲的关系'会直接决定一个人的什么能力？", "options": ["财富能力", "精神能力", "情感能力", "物质能力"], "ans": 1, "exp": "原文：与母亲的关系会直接决定一个人的精神能力。因为母亲在万物类象中的定位以印星为定位。", "id": "Q0563"}, {"type": "single", "cat": "parent", "q": "对女人来说，母亲的陪伴在五行类象中等价于什么？", "options": ["男人的情", "母亲的母爱", "财富", "事业"], "ans": 0, "exp": "原文：对女人来说，母亲的陪伴 = 男人的情：母亲的陪伴直接等价于男人对她情", "id": "Q0564"}, {"type": "single", "cat": "parent", "q": "大多数人无法宽恕、原谅父母，其根本原因是什么？", "options": ["父母太坏", "自己心太硬", "找不到一个理由", "没有时间"], "ans": 2, "exp": "原文：大多数人无法做到宽恕与原谅，不是因为做不到，是因为找不到一个理由。", "id": "Q0565"}, {"type": "single", "cat": "parent", "q": "关于'妈宝男'的成因，其母亲通常属于哪一种典型的驱动组合（情感模式）？", "options": ["过度情感驱动+过度自我价值感驱动", "责任感驱动", "物质驱动", "纯精神驱动"], "ans": 0, "exp": "原文：这种妈宝男的母亲一定过度情感驱动 + 过度自我价值感驱动、非常固执、超强控制欲、强烈傲慢", "id": "Q0566"}, {"type": "single", "cat": "parent", "q": "在孩子教育中，常对孩子说'我为了你好'这种话的，往往是哪一种母亲？", "options": ["有爱的、精神驱动的母亲", "没爱的女人", "责任感驱动的母亲", "物质驱动的母亲"], "ans": 0, "exp": "原文：会这么说恰恰是有爱的母亲，是精神驱动的女人；…问题不出妈妈没有爱，而是孩子不需要妈妈的爱", "id": "Q0567"}, {"type": "single", "cat": "parent", "q": "在女人与孩子的关系中，情感驱动的母亲在孩子身上寻找的东西是什么？", "options": ["陪伴", "金钱", "事业", "理智"], "ans": 0, "exp": "原文：情感驱动母亲在孩子身上找的东西是陪伴…天生爱黏孩子，和孩子待在一起是充电。", "id": "Q0568"}, {"type": "single", "cat": "parent", "q": "在父亲与孩子的关系中，精神驱动的父亲需要从孩子那里得到的是什么？", "options": ["物质", "陪伴", "情（情感驱动的孩子给男人巨大精神加持）", "理智"], "ans": 2, "exp": "原文：精神驱动的父亲需要孩子的情：如果孩子很有情，非常能激发男人的智慧…就会给男人带来巨大的精神加持。", "id": "Q0569"}, {"type": "single", "cat": "parent", "q": "对男人来说，\"克者为财\"中，克你的东西是什么？", "options": ["财星", "印星", "官星", "食伤"], "ans": 0, "exp": "原文：克者为妻：对男人来说克者为财，你克的东西就是财星、财气。", "id": "Q0570"}, {"type": "single", "cat": "parent", "q": "处理亲子关系最重要的原则是什么？", "options": ["知晓孩子需要什么，需要什么给什么", "强迫孩子像自己", "无条件宠溺", "只给孩子爱"], "ans": 0, "exp": "原文：处理亲子关系最重要的是：知晓孩子需要什么，需要什么给什么；不需要爱就不给爱、不需要情就不给情", "id": "Q0571"}, {"type": "single", "cat": "parent", "q": "\"对母亲的共情有需求\"对应的是哪个驱动力？", "options": ["精神驱动", "自我价值感驱动", "责任感驱动", "物质驱动"], "ans": 1, "exp": "原文：母亲的情（共情）　对应　自我价值感驱动：对母亲的共情有需求。", "id": "Q0572"}, {"type": "single", "cat": "parent", "q": "在父亲与孩子的关系中，情感驱动的父亲对孩子最需要的是什么？", "options": ["物质", "情", "责任感（帮孩子拥有事业）", "陪伴"], "ans": 2, "exp": "原文：情感驱动父亲需要孩子的责任感：想帮孩子拥有事业、培养独立自主有责任感的小孩。", "id": "Q0573"}, {"type": "single", "cat": "parent", "q": "在母亲含义上，男人以什么为母，女人以什么为母？", "options": ["男以偏印为母，女以正印为母", "男人以正印为母，女人以偏印为母", "都以正印为母", "都以偏印为母"], "ans": 1, "exp": "原文：在母亲含义上，男人以正印为母，女人以偏印为母。", "id": "Q0574"}, {"type": "single", "cat": "parent", "q": "在女人与孩子的关系中，责任感驱动的母亲最享受孩子对她做什么？", "options": ["陪伴", "情", "付出物质", "爱"], "ans": 2, "exp": "原文：责任感驱动的母亲：会向孩子投射物质驱动，最享受孩子对她付出物质。", "id": "Q0575"}, {"type": "single", "cat": "parent", "q": "在女人与孩子的关系中，物质驱动的母亲最喜欢孩子身上具有什么特质？", "options": ["金钱", "理智", "情（玩乐心、愿意陪孩子玩）", "事业"], "ans": 2, "exp": "原文：物质驱动的母亲：最喜欢孩子的情，希望孩子有玩乐心、非常愿意陪孩子玩。", "id": "Q0576"}, {"type": "single", "cat": "parent", "q": "在易经万物类象、十神层面的论述中，一个人与父亲的关系，等价于与哪一种十神（宫位/象）的关系？", "options": ["官星", "财星", "印星", "比劫"], "ans": 1, "exp": "原文：你与父亲的关系就是你与财星的关系；财星是生官星的东西。", "id": "Q0577"}, {"type": "single", "cat": "parent", "q": "在易经万物类象（十神象）中，“母亲”这一意象以哪一个十神为定位？", "options": ["财星", "官星", "印星", "比劫"], "ans": 2, "exp": "原文：母亲的定位在十神象中以印星为定位。", "id": "Q0578"}, {"type": "single", "cat": "parent", "q": "在易经万物类象（十神象）的论述中，'父亲'这一意象是以哪一个十神为定位的？", "options": ["官星", "印星", "财星", "比劫"], "ans": 2, "exp": "原文：父亲的定位以财星为定位：男人以偏财为父，女人以正财为父。", "id": "Q0579"}, {"type": "single", "cat": "parent", "q": "母爱的本质究竟是女人的情还是女人的爱？应如何理解？", "options": ["女人的情", "女人的爱", "责任感", "金钱"], "ans": 0, "exp": "原文：母爱的本质是女人的情，不是女人的爱。女人是用情感对待孩子的", "id": "Q0580"}, {"type": "single", "cat": "parent", "q": "在十神/万物类象的语境下，对男人来说，孩子（子女）在其命盘中的定位是什么？", "options": ["财星", "官杀", "印星", "比劫"], "ans": 1, "exp": "原文：对男人来说，孩子的定位是官杀。", "id": "Q0581"}, {"type": "short", "cat": "parent", "q": "过度精神驱动的母亲对孩子“攻击性的爱”大致是什么样？", "ans": "过度理性、精神攻击，用质问型沟通（“为什么又没做好？”）、过度讲道理、带精神攻击性、让孩子内疚（愧疚式教育）；这样长大的孩子会变成回避型人格。", "exp": "原文：过度精神驱动的母亲对孩子有攻击性的爱（过度理性、精神攻击），用质问型沟通（“为什么又没做好？本该做好的你怎么做不好”？…），过度讲道理、带精神攻击性、让孩子内疚——愧疚式教育。这样长大的孩子会变成回避型人格", "id": "Q0582"}, {"type": "short", "cat": "parent", "q": "尧舜禹面对想谋害自己的父亲兄弟，其“孝能动天”的做法要点是什么？", "ans": "接纳家人不是好人：不改变父母、不讲道理、不争执，只恭敬不怨恨、接纳父母因果、为父母忏悔；不报复、不质疑，甚至分封兄弟诸侯让其离远点、仍赡养父母。", "exp": "原文：他不质问、不责怪、不争对错，只做一件事：接纳家人不是好人。不改变父母、不讲道理、不争执，只恭敬、不怨恨、接纳父母因果、为父母忏悔", "id": "Q0583"}, {"type": "short", "cat": "parent", "q": "子女与父母功课的本质是什么、孝的核心是什么？", "ans": "如何化解与父母的怨结、做到孝，即化解父母带来的影响；功课的本质就是怎么做到孝。", "exp": "原文：如何修正父母带来的影响，是子女与父母之间的功课：如何化解与父母的怨结——即使父母对你很不好…怎么做到孝？功课的本质就是怎么做到孝", "id": "Q0584"}, {"type": "judge", "cat": "parent", "q": "能给孩子源源不断输送负能量的东西，是过度的情感、过度的精神，还有就是陪伴；过度的责任感驱动顶多是个不负责任的人，很难把能量投射给孩子。", "ans": true, "exp": "原文：过度的能量对孩子最明显的表现，是精神或情感的过度驱动力…能给孩子源源不断输送负能量的东西，就是过度的情感、过度的精神，还有就是陪伴。过度的责任感驱动顶多是个不负责任的人，但很难把这个能量投射给孩子。", "id": "Q0585"}, {"type": "judge", "cat": "parent", "q": "情感驱动的人通常情况下不是精神驱动的，跟母亲的关系一般都非常远，无法跟母亲近距离长时间陪伴相处；但情感驱动的人能够得到来自母亲金钱上的恩泽。", "ans": true, "exp": "原文：情感驱动的人通常情况下不是精神驱动的，跟母亲的关系一般都非常远…但是情感驱动的人，能够得到来自母亲金钱上的恩泽。无论男女，只要你自己有好的气运，通常就能得到来自母亲在金钱上的恩泽。", "id": "Q0586"}, {"type": "judge", "cat": "parent", "q": "男人的功课：对父亲的情有需求的男人，小时候可能被严重伤害、期待破灭落空，以后不再在父亲身上找情，但这种功课可能进入情执，开始期待或寻找女人的情。", "ans": true, "exp": "原文：男人的功课：对父亲的情有需求的男人，小时候（十几岁以后）可能被严重伤害过、期待破灭落空，再也不去索取父亲的情…但这种功课可能进入情执，开始期待或寻找女人的情。", "id": "Q0587"}, {"type": "judge", "cat": "parent", "q": "过度精神驱动的父亲，如果孩子是积极情感驱动的孩子，无论男女，都能完全吸收化解父亲的过度精神焦虑、精神攻击；这种父亲的负能量反而能激发孩子丰富的情感世界。", "ans": true, "exp": "原文：过度精神驱动的父亲，如果孩子是积极情感驱动的孩子，无论男女，能完全吸收化解来自父亲的过度精神焦虑、精神攻击；…反而能激发孩子丰富的情感世界。", "id": "Q0588"}, {"type": "judge", "cat": "parent", "q": "原生家庭关系没有 100% 一一对应的关系（父母子女不具备一一对应）；而夫妻伴侣关系是一一对应的——你是什么样，伴侣就一定是那样，否则就会巨大痛苦。", "ans": true, "exp": "原文：原生家庭关系没有 100% 一一对应的关系，这与伴侣关系不同。夫妻伴侣关系是：你是这样，伴侣就一定是那样…但父母与子女之间不需要这种匹配。", "id": "Q0589"}, {"type": "judge", "cat": "parent", "q": "妈宝男是典型的财印不能平衡的显化：印星过旺、过度强烈，他需要财星克印、需要妻子的陪伴，但又不得不屈从母亲的控制，形成既讨厌母亲又依赖母亲的妈宝特征。", "ans": true, "exp": "原文：妈宝男就是典型的财印不能平衡的显化：印星过旺、过度强烈…他需要财星克印、需要妻子的陪伴，但又不得不屈从母亲的控制…既讨厌母亲又依赖母亲。", "id": "Q0590"}, {"type": "judge", "cat": "parent", "q": "因果层面智慧是究竟智慧，比普通慈悲心等更高维度（因果智慧与空性智慧）；易经帮助我们了知因果，佛法教我们深信因果，儒家智慧教我们尊重因果。", "ans": true, "exp": "原文：因果层面智慧比普通慈悲心等更高维度，是究竟的智慧（因果智慧与空性智慧）…易经帮助我们了知因果，佛法教我们深信因果，儒家智慧教我们尊重因果。", "id": "Q0591"}, {"type": "judge", "cat": "parent", "q": "过度情感驱动的父亲如果孩子是责任感驱动的，会转化掉；父亲的混乱情绪和母亲的精神混乱，给孩子造成的伤害是等价的，都会造成孩子逃避责任感。", "ans": true, "exp": "原文：过度情感驱动的父亲，如果孩子是责任感驱动，也会转化掉…父亲情绪非常混乱和母亲精神非常混乱，给孩子造成的伤害是等价的…都会造成孩子逃避责任感。", "id": "Q0592"}, {"type": "judge", "cat": "parent", "q": "情感驱动的男人通常对晚辈比较友好，但不喜欢自己的孩子；喜欢自家孩子的男人不喜欢别人的孩子——这是男人身上显著的特征（对自家孩子的偏爱，不同于女人）。", "ans": true, "exp": "原文：情感驱动的男人通常对晚辈比较友好，但不喜欢自己的孩子；喜欢自家孩子的男人，不喜欢别人的孩子…这与女性不同。", "id": "Q0593"}, {"type": "judge", "cat": "parent", "q": "安忍从自己的原生家庭开始；责任感驱动的人从小到大需经历安忍、受苦，主要来自父亲的负面情绪和母亲精神上的攻击性两方面。", "ans": true, "exp": "原文：为什么责任感驱动的人、真正能做事业的人，从小到大需经历安忍、受苦、忍的东西特别多：一方面来自父亲负面的情绪…第二方面来自母亲精神上的攻击性…安忍从自己的原生家庭开始。", "id": "Q0594"}, {"type": "judge", "cat": "parent", "q": "富二代为实现自己的自我价值感，做的事是乱创业：本质不是责任感驱动，总是以赚钱为目的、乱做事；所以富二代能投资成功的是极少数。", "ans": true, "exp": "原文：富二代为实现自己的自我价值感，会做的事就是乱创业：本质上他不是一个责任感驱动的人…所以富二代能投资成功的是极少数（物质驱动的人极少）。", "id": "Q0595"}, {"type": "judge", "cat": "parent", "q": "亲子关系与情侣关系不同：亲子关系不具有一一投影属性——你的盘中可直接看出你的情侣是什么样的人，但看不出孩子是什么样的人。", "ans": true, "exp": "原文：亲子关系与情侣关系不同：亲子关系不具有一一投影属性。你的盘中可直接看出你的情侣是什么样的人，但看不出你的父母是什么样的人、孩子是什么样的人。", "id": "Q0596"}, {"type": "judge", "cat": "parent", "q": "只有亲子关系才能投影出\"孩子吸收转化父母的负能量\"；伴侣关系吸收不了这种负能量，只有在生育的子女身上有可能吸收你的负能量。", "ans": true, "exp": "原文：这件事只有在亲子关系上才能投影出这种关系，伴侣关系中没有——伴侣关系吸收不了这种负能量，只有在生育的子女身上有可能可以吸收你的负能量。", "id": "Q0597"}, {"type": "judge", "cat": "parent", "q": "对男生来说，判断其阴阳平衡倾向的一个关键问题是与母亲的关系（对母亲陪伴、情感的需求），另一个等价的问题是对于男人的情的态度。", "ans": true, "exp": "原文：对女生来说，…与母亲的关系可直接…判断出她阴阳平衡的倾向…与此等价的内容是第二个问题：她对于男人的情的态度。", "id": "Q0598"}, {"type": "judge", "cat": "parent", "q": "喜欢谈异地恋的女生，大多都无法承受母亲的精神关爱；她无法处理母亲精神层面的控制，未来会无法承受男人的陪伴。", "ans": true, "exp": "原文：如果这个孩子是女生，她无法处理母亲精神层面的控制，未来会无法承受男人的陪伴…所以偏向喜欢谈异地恋。喜欢谈异地恋的女生，都无法承受母亲的精神关爱。", "id": "Q0599"}, {"type": "judge", "cat": "parent", "q": "如果精神驱动的女生，对母亲投射的陪伴需求，恰好母亲是自我价值感驱动的人，就是很好的因缘、母女关系非常融洽。", "ans": true, "exp": "原文：比如精神驱动的女生，会对母亲投射陪伴需求…如果母亲恰好可以满足，恰好是自我价值感驱动的人，就是很好的因缘、驱动力匹配、母女关系非常融洽。", "id": "Q0600"}, {"type": "judge", "cat": "parent", "q": "任何男女，如果怨恨自己的母亲（对印星非常讨厌、有怨恨），这种人不得开智慧；对父亲有怨恨的人，都无法亲近财富。", "ans": true, "exp": "原文：任何男女，如果怨恨自己的母亲（对印星非常讨厌、有怨恨或类似负面情感），这种人都不得开智慧；对父亲有怨恨的人，都无法亲近财富。", "id": "Q0601"}, {"type": "judge", "cat": "parent", "q": "能否与父母有非常亲密的关系取决于缘分；即使善根卓越、德行很好，也不一定能与父母亲近，有可能待在一起照样痛苦。", "ans": true, "exp": "原文：能否与父母有非常亲密的关系取决于缘分。即使善根非常卓越、很有德行…也不能意味着能与父母亲近，有可能跟父母待在一起照样痛苦。", "id": "Q0602"}, {"type": "judge", "cat": "parent", "q": "为什么成为一家人，背后有更高维度的因缘层面的原因，是共业招感；所以与父母的姻缘来自共业招感，而与父母没有明确的因果关系。", "ans": true, "exp": "原文：为什么成为一家人，背后有更高维度的因缘层面的原因，是共业招感…你与父母的因果其实都没有因果关系。", "id": "Q0603"}, {"type": "judge", "cat": "parent", "q": "妈宝男典型行为是爱创业、做什么都失败，特别爱开奶茶店/火锅店/酒吧，然后倒闭，但凡做决定就破财。", "ans": true, "exp": "原文：妈宝男典型行为是爱创业、做什么都失败；爱做事、心比天高、我慢心大又想不清楚。步入社会或合资搞事，特别爱开奶茶店/火锅店/酒吧，然后倒闭", "id": "Q0604"}, {"type": "judge", "cat": "parent", "q": "如果你是物质驱动的人，就会喜欢父亲的陪伴；相反如果不是物质驱动、是自我价值感驱动，从小就不喜欢父亲的陪伴。", "ans": true, "exp": "原文：如果你是物质驱动的人，就会喜欢父亲的陪伴；相反如果不是物质驱动、是自我价值感驱动，从小就不喜欢父亲的陪伴。", "id": "Q0605"}, {"type": "judge", "cat": "parent", "q": "听到“我为了你好”感到痛苦窒息、压力大，是因为本质上不是责任感驱动的人会痛苦、感到要承担责任了。", "ans": true, "exp": "原文：听到这句话感到痛苦窒息，和孩子驱动力有关：感到压力大是因为感觉自己要承担责任了——本质上不是责任感驱动的人就会痛苦", "id": "Q0606"}, {"type": "judge", "cat": "parent", "q": "为什么说父母是最大的福田？因为他就在你身边，让你通过自身努力实现自身阴阳平衡的最好对境。", "ans": true, "exp": "原文：为什么说父母是最大的福田：因为他就在你身边，让你通过自身努力实现自身阴阳平衡的最好对境。重要的是你内心向父母投射的念头和能量。", "id": "Q0607"}, {"type": "judge", "cat": "parent", "q": "情感驱动的小孩读书会头痛（尤其男生）、偏科极重，学习最差、垫底的通常是情感驱动（男女都是）。", "ans": true, "exp": "原文：学习最差、垫底的通常是情感驱动（男女都是），情越重越垫底；情感驱动的小孩读书会头痛（尤其男生）、娱乐性重、注意力不集中", "id": "Q0608"}, {"type": "judge", "cat": "parent", "q": "“有孩子之后，爱情就不重要了”只有情感驱动的女生会说；责任感驱动的女生会对孩子说爱情不重要。", "ans": false, "exp": "原文：只有情感驱动的女生会说这句话，但光情感驱动不足以支撑；…责任感驱动的女生只在到年纪觉得该有孩子时说，但不会说爱情不重要", "id": "Q0609"}, {"type": "judge", "cat": "parent", "q": "会哄妈妈开心是对妈妈的情有需求的孩子；孩子和妈妈的缘分取决于两人驱动力匹配度，也取决于善根。", "ans": true, "exp": "原文：会哄妈妈开心是对妈妈的情有需求的孩子，赚了钱就给妈妈买东西；…孩子对妈妈的缘分取决于两人驱动力匹配度，…也取决于善根", "id": "Q0610"}, {"type": "judge", "cat": "parent", "q": "贪求并不取决于要的多还是少；但凡给不到这一点点就有大痛苦，意味着内心对此有极大的贪求。", "ans": true, "exp": "原文：贪求并不取决于要的多还是少。可能我们只求一点点的怜悯和善待…反而但凡给不到这一点点就有大痛苦，就意味着内心对这个有极大的贪求。", "id": "Q0611"}, {"type": "single", "cat": "scene", "q": "精神驱动、情感驱动、过度情感驱动的女人在男人身上“找情”分别表现为？", "options": ["展望期待／变怨恨／找不到就攻击", "攻击／怨恨／期待", "怨恨／期待／攻击", "期待／攻击／怨恨"], "ans": 0, "exp": "原文：精神驱动的女生在男人身上找情，是不会抱怨的，没有怨恨，她内心是展望和期待。情感驱动的女生会变成怨恨。过度情感驱动的女生，在男人身上找情找不到就会攻击。", "id": "Q0673"}, {"type": "single", "cat": "scene", "q": "跟婆婆关系最好、天性上与婆婆没隔阂、自然把婆婆当亲人的是哪种驱动的女生？", "options": ["情感驱动", "精神驱动", "物质驱动", "自我价值感驱动"], "ans": 2, "exp": "原文：以财星为用的物质驱动女生婆媳关系最好，天性上与婆婆没隔阂、能亲近、自然把婆婆当亲人；郭碧婷（精神驱动）则是金钱助力明显。", "id": "Q0674"}, {"type": "single", "cat": "scene", "q": "一个人事业风光时突然开始想“秀”事业、内心觉得自己很厉害，通常意味着什么？", "options": ["即将迎来更大成功", "事业到头了、要开始衰败", "只是正常分享值得鼓励", "财运更加旺盛"], "ans": 1, "exp": "原文：当一个人开始觉得自己很厉害的时候，就要不行了。本质是我慢心。只要他动了这个念头、没有忏悔，基本上事业走到头了。", "id": "Q0675"}, {"type": "single", "cat": "scene", "q": "“不停换事情做、做成一件就换下一件、被‘失败是成功之母’激励永无止境地幻想成功”是？", "options": ["高度责任感驱动", "情感驱动", "积极的弱责任感驱动", "过度自我价值感驱动"], "ans": 2, "exp": "原文：不停换事情做、做成一件就不停换不靠谱的事、被失败激励永无止境，是积极的弱责任感驱动。", "id": "Q0676"}, {"type": "single", "cat": "scene", "q": "一个年薪几百万却和同事下属都处不来、真正想做的事与手头工作无关的高管，说明？", "options": ["他是责任感驱动", "他的核心驱动力利于生命发展", "成就他的可能是过度驱动力而非核心驱动力", "他能力不够"], "ans": 2, "exp": "原文：这位副总裁的案例说明：有些人成就他的驱动力是过度驱动力，而不是核心驱动力，其福报不来自性格。", "id": "Q0677"}, {"type": "single", "cat": "scene", "q": "“喜欢男人给自己买奢侈品、需要男人买奢侈品”本质上是什么需求的表现？", "options": ["物质驱动", "责任感驱动", "精神驱动大于自我价值感驱动", "自我价值感驱动"], "ans": 2, "exp": "原文：有需求让男人给自己买奢侈品，本质上是精神驱动大于自我价值感驱动。男人用付出的多少去衡量感情，本质是男人的情。", "id": "Q0678"}, {"type": "single", "cat": "scene", "q": "最有效克服社恐、瞬间消除社交恐惧的行为是什么？", "options": ["多看书冥想", "主动请大家买单、送礼物、点奶茶", "刻意避免热闹", "找朋友倾诉"], "ans": 1, "exp": "原文：最有效的克服社恐的行为是花钱买单，主动地为大家买单就可以瞬间消除社交恐惧。用物质驱动就能帮自己实现情感驱动。物欲驱动是克制精神驱动的。", "id": "Q0679"}, {"type": "single", "cat": "scene", "q": "最容易被花言巧语哄骗、在被抛弃时最可能被弃的是哪种驱动力的女人？", "options": ["情感驱动", "精神驱动", "物质驱动", "自我价值感驱动"], "ans": 1, "exp": "原文：会被渣男玩弄、被花言巧
