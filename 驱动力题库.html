语哄骗的是精神驱动的女人。更容易被抛弃的是精神驱动。情感驱动的女生通常不会被抛弃。", "id": "Q0680"}, {"type": "single", "cat": "scene", "q": "“不停找事做、一天想十件事、觉得好玩，但接受不了失败”的人是哪种驱动？", "options": ["高度责任感驱动", "积极弱责任感驱动", "高度情感驱动", "物质驱动"], "ans": 2, "exp": "原文：高度情感驱动企业家也会不停找事做，觉得好玩一天想十件事；但情驱不太能接受失败，成败看“运”。", "id": "Q0681"}, {"type": "single", "cat": "scene", "q": "“管不住嘴”、克制不住的过度表达欲（等价于情欲）会怎样？", "options": ["否定事业，做不成任何事，千万不能创业", "代表口才", "代表有激情", "代表自信"], "ans": 0, "exp": "原文：管不住嘴：做什么事都忍不住说一下，做不成任何事。管不住嘴是控制不住的过度表达欲，等价于自身的情欲…千万不能创业", "id": "Q0682"}, {"type": "single", "cat": "scene", "q": "对男人来说，唯一能对抗他固执的东西是什么？", "options": ["老婆的自我价值感", "子女的自我价值感", "父母的自我价值感", "朋友的自我价值感"], "ans": 1, "exp": "原文：对于男人来说，唯一能对抗他的固执的东西是他的子女的自我价值感；对女人来说，是她的老公的自我价值感。只有这两样东西可以对治他们的固执。", "id": "Q0683"}, {"type": "single", "cat": "scene", "q": "在关于一个人『会不会向朋友借钱』这一日常行为的讨论中，不同内在驱动力的人表现差异很大。据此，下列说法正确的是哪一项？", "options": ["自我价值感驱动的人最愿意向朋友借钱", "过度自我价值感驱动的人最喜欢向朋友借钱", "责任感驱动的人借钱最多", "物质驱动的人绝不借钱"], "ans": 1, "exp": "原文：自我价值感驱动的人，最不愿意向朋友借钱。过度自我价值感驱动的人，最喜欢向朋友借钱，因为物质驱动+责任感驱动的人，就会有目的性地向朋友借钱。", "id": "Q0684"}, {"type": "single", "cat": "scene", "q": "根据“旺夫方式”，精神驱动的女人用什么旺夫？", "options": ["用钱", "用责任感", "用爱", "用情"], "ans": 2, "exp": "原文：物质驱动的女人，用钱；责任感驱动的女人，用责任感；精神驱动的女人，用爱；情感驱动的女人，用情；自我价值感驱动的女人，用陪伴。", "id": "Q0685"}, {"type": "single", "cat": "scene", "q": "一片金水之气与一片木火之气的人在情感表达上？", "options": ["金水情感高度压抑、心思易恶毒；木火情感高度释放、一下爆炸但刀子嘴豆腐心不恶毒", "都很激烈", "都很阴沉", "都情绪平稳"], "ans": 0, "exp": "原文：一片金水之气的人阴气重，情感高度压抑、心思容易恶毒。一片木火之气的人阳气过盛，情感高度释放…但是刀子嘴豆腐心、没有恶毒的心思", "id": "Q0686"}, {"type": "single", "cat": "scene", "q": "任性、拖延症、习惯性撒谎，分别对应哪些问题？", "options": ["任性是情感驱动特征；拖延症是缺责任感没目标感；习惯性撒谎是没有责任感（与善根有关）", "都是缺德", "都是没钱", "都是压力大"], "ans": 0, "exp": "原文：任性是否定你靠谱能力的东西，任性是情感驱动的特征。拖延症是缺少责任感、没有目标感。习惯性撒谎是没有责任感的标志", "id": "Q0687"}, {"type": "single", "cat": "scene", "q": "什么样的女生千万不能哄，一哄就上纲上线、越哄越爆炸？", "options": ["精神驱动", "过度精神驱动", "情感驱动", "物质驱动"], "ans": 1, "exp": "原文：有些人是千万不能哄的，一哄就上纲上线、越哄越爆炸。也就是过度精神驱动的女生，一哄就完蛋、一哄就爆炸。", "id": "Q0688"}, {"type": "single", "cat": "scene", "q": "“钱对我很重要”和“我想赚钱／赚钱对我很重要”，分别对应哪两种驱动？", "options": ["物质驱动／自我价值感驱动", "自我价值感驱动／物质驱动", "责任感驱动／物质驱动", "物质驱动／精神驱动"], "ans": 0, "exp": "原文：钱对我很重要＝物质驱动；我想赚钱/赚钱对我很重要＝自我价值感驱动。", "id": "Q0689"}, {"type": "single", "cat": "scene", "q": "看到伴侣开心就莫名怒火上来、想让他不开心，这属于哪种驱动力的表现？", "options": ["过度情感驱动", "过度精神驱动", "过度责任感驱动", "物质驱动"], "ans": 1, "exp": "原文：看到伴侣开心就莫名地怒火上来，想让他不开心。这是过度精神驱动的表现。", "id": "Q0690"}, {"type": "single", "cat": "scene", "q": "判断一个女人是否为“物质驱动”的简单方法，是看什么？", "options": ["其原生家庭财富", "婆媳关系（能否善待婆婆）", "其事业状况", "其消费习惯"], "ans": 1, "exp": "原文：女人直接靠婆媳关系区分。和婆婆关系好的女人、会善待婆婆的女人就是潜在的积极物质驱动的女人。", "id": "Q0691"}, {"type": "single", "cat": "scene", "q": "一个人深层的『情感模式（情感处理与流露的方式）』能否仅仅通过主观努力去改变？", "options": ["能，越努力改变越大", "不能，是天性，只有气运变化才会使其改变", "能改但很有限", "取决于意志力强弱"], "ans": 1, "exp": "原文：情感模式本身不能通过努力的方式改变，它是一种天性，不会随着你的努力而改变。真正会有情感模式变化的人他自己没有感知的，是气运变化的结果。", "id": "Q0692"}, {"type": "single", "cat": "scene", "q": "精神驱动／自我价值感驱动女人吵架时的主要方式是？", "options": ["激烈撕吵", "委屈和隐忍", "冷暴力", "翻旧账"], "ans": 1, "exp": "原文：精神驱动的女人本质上不爱吵架。真的吵起架来，最主要的方式是委屈和隐忍。有爱的女人最主要的特点就是隐忍。", "id": "Q0693"}, {"type": "single", "cat": "scene", "q": "驱动力／性格变化最极端、最剧烈的类型是什么？", "options": ["单相思型", "双向人格障碍", "单纯抑郁症", "精神衰弱"], "ans": 1, "exp": "原文：但也有极端变化的，最极端的类型就是双向人格障碍。一种正常的人格进入一种极度痛苦的人格。这本质是气运的变化。", "id": "Q0694"}, {"type": "single", "cat": "scene", "q": "针对述情障碍的问题，较有效的解决办法/建议是什么？", "options": ["经济允许下多花钱、多为别人花钱（请客送礼），用钱表达说不出的情感", "多讲道理", "闭门不出", "少花钱"], "ans": 0, "exp": "原文：在经济状况允许情况下多花钱、多为别人花钱…多请大家吃吃喝喝玩玩、多买礼物送给有情的朋友，这件事非常有用", "id": "Q0695"}, {"type": "single", "cat": "scene", "q": "过度情感驱动的女人最能包容全世界谁的“我慢心”？", "options": ["全世界所有人的", "老公／男人的", "亲近朋友的", "孩子的"], "ans": 1, "exp": "原文：老公／男人的我慢心是过度情感驱动的女人最能包容的东西。除此以外，全世界人的我慢心，都接受不了。", "id": "Q0696"}, {"type": "single", "cat": "scene", "q": "“空心人”（无情无爱无我）是哪几种的过度组合？", "options": ["过度情感驱动+过度精神驱动+过度自我价值感驱动", "过度责任感+过度物质", "精神+责任", "爱+情"], "ans": 0, "exp": "原文：空心人：无情无爱无我，过度情感驱动＋过度精神驱动＋过度自我价值感驱动。NPD 就很符合这一点", "id": "Q0697"}, {"type": "single", "cat": "scene", "q": "最会挑毛病的是哪种人？情感驱动的人不挑毛病说明什么？", "options": ["情感驱动最会挑毛病；情感驱动若不挑毛病不是优点，反而说明情太少", "责任感驱动最挑毛病", "精神驱动最挑毛病", "物质驱动最挑毛病"], "ans": 0, "exp": "原文：最会挑毛病的是情感驱动的。情感驱动的人如果不挑毛病不是优点，反而说明情太少", "id": "Q0698"}, {"type": "single", "cat": "scene", "q": "过度情感驱动的女人感受爱（情）的方式，主要是通过什么？", "options": ["男人的物质付出", "男人的激烈／崩溃的情绪", "男人的理性讲理", "男人的陪伴"], "ans": 1, "exp": "原文：女人感受爱（情）的方式是通过男人崩溃的情绪来感应的。情绪=在乎=被爱。", "id": "Q0699"}, {"type": "single", "cat": "scene", "q": "老好人（没法拒绝别人、没边界感）的根本特征是？", "options": ["没有边界感、自身没能量、没有拒绝能力，善良没搭配心狠和手段", "太善良是优点", "太替人着想", "运气差"], "ans": 0, "exp": "原文：没有边界感…本质是因为自身没有能量、抗拒不了，没有拒绝的能力…善良一定要搭配心狠和手段", "id": "Q0700"}, {"type": "single", "cat": "scene", "q": "某些人常表现出的『高敏感（感知力特别敏锐）』，其本质来源是什么？它又是什么的直接体现？", "options": ["感知力来自精神世界（精神思维敏锐或情感共情敏锐），是内耗最大的来源", "因为缺爱", "因为身体差", "因为想太多"], "ans": 0, "exp": "原文：高敏感是感知力，这种感知力不来自情感，来自精神世界：一种是精神思维的敏锐，一种是情感共情的敏锐，这就是内耗最大的两个来源", "id": "Q0701"}, {"type": "single", "cat": "scene", "q": "过度精神驱动严重到一定程度时容易产生什么？", "options": ["被害妄想症", "原发性抑郁症", "双向人格障碍", "选择性失忆"], "ans": 0, "exp": "原文：过度精神驱动严重到一定程度的时候，就会容易被害妄想症。会容易把很多事情扭曲地去理解。", "id": "Q0702"}, {"type": "single", "cat": "scene", "q": "冷漠通常是“理性的、有爱的”来自哪种驱动力的男人？", "options": ["情感驱动", "精神驱动", "过度情感驱动", "回避型"], "ans": 1, "exp": "原文：冷漠通常是理性的、有爱的、精神驱动的男人（无情无爱的男人排除）。", "id": "Q0703"}, {"type": "single", "cat": "scene", "q": "“过度的爱”主要是用哪种方式教育孩子？", "options": ["情感感染的方式", "愧疚式（用理性、让孩子惭愧愧疚）教育", "放任主义", "宠爱纵容"], "ans": 1, "exp": "原文：过度的爱就是愧疚式教育，因为它是基于理性的，她会用理性去教育，而不是情感。", "id": "Q0704"}, {"type": "single", "cat": "scene", "q": "从行为观察看，『过度自我价值感驱动』的人发脾气时，最频繁地冲谁发火？", "options": ["孩子", "老婆", "父母", "朋友"], "ans": 1, "exp": "原文：过度自我价值感驱动的人，是最喜欢骂老婆的，孩子还不一定，但是骂老婆是骂最多的。", "id": "Q0705"}, {"type": "single", "cat": "scene", "q": "日常所说的'好色'一词其实存在两种不同含义，分别对应哪一种内在驱动力的状态？", "options": ["自己充满不可控制的情欲（情感驱动）/自己没有但希望别人对自己有很多情欲（精神驱动）", "都指色欲", "都指爱美", "与驱动力无关"], "ans": 0, "exp": "原文：好色有两种含义：1、自身充满了不可控制的情欲…是情感驱动；2、自己没有但希望别人对自己有很多情欲…这是精神驱动", "id": "Q0706"}, {"type": "single", "cat": "scene", "q": "一位'过度情感驱动'的女人，在亲密关系中她真正需要的伴侣应当具备什么特质？", "options": ["整天哄着自己的", "吵架能吵赢自己的", "精神驱动、理性讲理的男人", "物质财富非常丰富的男人"], "ans": 1, "exp": "原文：需要的伴侣是吵架吵赢自己的人。女人吵不过男人可以，但男人吵不过女人，家就要散。", "id": "Q0707"}, {"type": "single", "cat": "scene", "q": "当一个人既想融入群体、喜欢热闹，却总是无法共情、融入不了时（即“社交恐惧”），其本质是什么？", "options": ["单纯不喜欢社交", "想社交但没有社交能力、共不出情", "害怕陌生人", "性格内向"], "ans": 1, "exp": "原文：社交恐惧是想社交，但没有社交能力。非常想要有情感驱动力，但是他不够。想共情却共情不了。", "id": "Q0708"}, {"type": "single", "cat": "scene", "q": "在行为与人品层面，一个人表现出的『傲慢』，其本质是什么？同时《易经》中的谦卦，地位是怎样的？", "options": ["傲慢本质是自卑；谦卦是最吉之卦，谦卑比慈悲更难做到", "傲慢是自信", "谦卦最凶", "谦卑靠忍让"], "ans": 0, "exp": "原文：傲慢本质是自卑…谦卑是最重要的，易经中谦卦是最吉之卦；谦卑是比慈悲更难做到的", "id": "Q0709"}, {"type": "single", "cat": "scene", "q": "一个对'钱'极度焦虑、整天担心没钱的人，他真正害怕的（区别于表面的担心）是什么？", "options": ["自己的赚钱能力", "贫穷本身", "失去现有财富", "朋友的眼光"], "ans": 1, "exp": "原文：过度焦虑钱的人害怕的都是贫穷本身，而不是赚钱的能力。", "id": "Q0710"}, {"type": "single", "cat": "scene", "q": "关于优秀的定义，什么比一切都重要？", "options": ["善良（心平气和善待家人、真诚真情付出）", "漂亮", "有钱有才", "口才好"], "ans": 0, "exp": "原文：会觉得善良比一切都重要…没有比善良更重要的品质了", "id": "Q0711"}, {"type": "single", "cat": "scene", "q": "一个人可能处于『内盛外旺』的状态，其中『内盛』具体指一种什么样的内在状态？", "options": ["除了对自己内在的恶念以外，对其他事情都不感兴趣", "专注练肌肉", "旺盛的斗志", "特别能赚钱"], "ans": 0, "exp": "原文：内盛的意思是除了对自己内在的恶念以外，对其他事情都不感兴趣", "id": "Q0712"}, {"type": "single", "cat": "scene", "q": "在人际相处中，『不信任』（表现为怀疑自己、精神力不足）与『过度怀疑』在驱动力的层面上有什么区别？", "options": ["不信任是精神力不足（怀疑自己），过度怀疑是过度精神驱动", "等于同一件事", "不信任更严重", "怀疑更严重"], "ans": 0, "exp": "原文：不信任别人来源于精神驱动力的不足；而过度怀疑是过度精神驱动", "id": "Q0713"}, {"type": "single", "cat": "scene", "q": "所谓“情感控制”指的是什么？", "options": ["不按她的方式做就生气，要你给她爱", "用理性讲道理压人", "用冷漠惩罚对方", "用钱要挟对方"], "ans": 0, "exp": "原文：情感控制就是不按她的方式做就生气，要你给她爱。", "id": "Q0714"}, {"type": "single", "cat": "scene", "q": "'自恋'（过度自我感觉良好、傲慢）这种表现，其本质属于哪一种内在状态？", "options": ["是我慢心、是自卑（一种情感需求、情感特征）", "是自信", "是自我价值感驱动", "是高傲的正面"], "ans": 0, "exp": "原文：自恋不是自我价值感驱动…本质是我慢心、是自卑", "id": "Q0715"}, {"type": "judge", "cat": "scene", "q": "精神驱动和自我价值感驱动的女人没有嗔怨心，即使伴侣出轨多以隐忍/妥协为主，痛苦源于我慢心自尊受损，最终不会真离开，因为核心利益是男人的情和钱。", "ans": true, "exp": "原文：精神驱动和自我价值感驱动的女人本质上是没有嗔怨心的，她是不会生气的。即使她的男人伴侣出轨了，也是隐忍占多部分。她依然很痛苦，痛苦是因为她的我慢心、自尊心受到了伤害。她本质上是不care男人这个行为的。", "id": "Q0716"}, {"type": "judge", "cat": "scene", "q": "过度情感驱动、过度精神驱动、过度自我价值感驱动的人都会不停想做事但做不好，反以“责任感”为渴望；失败最多的往往是最想做事又无法情志平衡的人，平衡前不要创业。", "ans": true, "exp": "原文：过度情感驱动、过度精神驱动、过度自我价值感驱动，都会不停想做事，但做不好。失败最多的就是最想做事的人。在自身无法平衡之前，不要创业。", "id": "Q0717"}, {"type": "judge", "cat": "scene", "q": "绝大多数人在找到核心驱动力后能自然找到生命平衡；但也有少数个案是靠“过度驱动力”显化成就的（如一位年薪几百万、只能与老板处得来的女高管）。", "ans": true, "exp": "原文：以过度驱动力显化成就的人，决定他性格的东西不是他事业成功的因素。案例：一位年薪几百万的大公司高管（副总裁）……除了老板以外，和其他人都不太能处得来。", "id": "Q0718"}, {"type": "judge", "cat": "scene", "q": "“愿意为男人生孩子”是精神驱动的女人爱一个人的标志（平时不愿生，得到男人的情后产生愿意）；情感驱动女人则是自己想生、特别喜欢才想生。", "ans": true, "exp": "原文：当一个女人愿意为男人生孩子的时候，可以证明她很爱他，这是精神驱动的女人表现。情感驱动的女人很喜欢一个人的标志是会想生孩子的，是自己想生、自己特别喜欢。", "id": "Q0719"}, {"type": "judge", "cat": "scene", "q": "删除、拉黑行为上：有积极情感能力的女人不会删拉黑；负面情绪多、无情的女人吵架后喜欢删拉黑又加回来；最不可能拉黑删除的是精神驱动的女人。", "ans": true, "exp": "原文：有积极情感能力的女人是不会删除、拉黑的。但是消极的、有许多负面情绪的、没有情的女人吵架之后就喜欢删除、拉黑。最不可能拉黑删除的女人是精神驱动的。", "id": "Q0720"}, {"type": "judge", "cat": "scene", "q": "精神（自足）强大的负责任男人吵架不可能输，因为他本自具足可离开、无需对方提供情绪价值、无占有欲无索取；情很重的女人一感受到冷漠就不吵了。", "ans": true, "exp": "原文：精神力强大的男人吵架是不可能输的，因为他本自具足……因为他对你没有占有欲、对你没有索取。情很重的女人感受到冷漠的时候，他就不吵了。", "id": "Q0721"}, {"type": "judge", "cat": "scene", "q": "情感驱动+自我价值感驱动的女生很看重男人的现实价值（钱、物质支持），把它当作情感支柱；但情感驱动+物质驱动的女生不那么需要男人的现实价值。", "ans": true, "exp": "原文：对情感驱动+自我价值感驱动的女生来说，男人的现实价值很重要……但同样是情感驱动+物质驱动的女生，就不那么需要男人的现实价值。", "id": "Q0722"}, {"type": "judge", "cat": "scene", "q": "责任感驱动的男人并不天然给女人花钱，只有特定情景（觉得对不起／有很深的亏欠）才倾其所有甚至净身出户；讨好的情况不算。", "ans": true, "exp": "原文：责任感驱动的男人如果给你花了很多很多钱，他的发心一定是觉得对不起你。非常非常有责任感驱动的男人会净身出户。讨好的情况不算，因为讨好是权衡利弊的博弈，付出一定是有限的。", "id": "Q0723"}, {"type": "judge", "cat": "scene", "q": "读书学习上：只有精神驱动的人学习是通过思维的；情感驱动看书边看边玩，精神驱动能深度从头看到尾，责任感驱动不喜欢看书但刻苦。", "ans": true, "exp": "原文：只有精神驱动的人学习是通过思维的。情感驱动的人看书边看边玩。精神驱动的人看书能深度把一本书从头到尾看下去。责任感驱动的人不喜欢看书，但是刻苦。", "id": "Q0724"}, {"type": "judge", "cat": "scene", "q": "无情无爱不是自私，是出厂设置（驱动力）决定，没有好坏之分；无情无爱的女生通常比较靠谱，无情无爱的男生一定不靠谱（通常就是 NPD 人格）。", "ans": true, "exp": "原文：无情无爱不是自私，是出厂设置（驱动力）决定的…无情无爱的女生通常是比较靠谱的人；而无情无爱的男生一定不靠谱", "id": "Q0725"}, {"type": "judge", "cat": "scene", "q": "过度自我价值感驱动的人永远在创业且创业永远失败，躺平是他人生最佳选项但通常躺不平，创业失败的代价常由别人承担。", "ans": true, "exp": "原文：八字无法平衡事业+气运不支持，他就会一辈子都在创业，创业永远失败。躺平就是他人生最佳选项了，但是通常他躺不平。而且他创业失败的代价都是别人在承担后果。", "id": "Q0726"}, {"type": "judge", "cat": "scene", "q": "天生包容不生气的男人以及责任感驱动的男人，接到老婆电话时最不容易生气；而情感驱动的男人接到老婆电话最容易爆炸。", "ans": true, "exp": "原文：天生包容不生气的男人以及责任感驱动的男人，在接到老婆电话的时候是最不容易生气的。情感驱动的男人接到他老婆的电话，是最容易爆炸的，60-70%的是这样。", "id": "Q0727"}, {"type": "judge", "cat": "scene", "q": "情感驱动的我慢心表现为被误解、被冤枉时会自证、找你说理；过度情感驱动的我慢心则“说不得”，受不了别人指指点点。", "ans": true, "exp": "原文：情感驱动的我慢心的特征，他的傲慢/抓狂体现在不能被误解、被冤枉。过度情感驱动的我慢心的特征、表现方式是“说不得”，受不了别人对他指指点点、评头论足。", "id": "Q0728"}, {"type": "judge", "cat": "scene", "q": "女同性恋（不喜欢异性的同性恋）的标志是自我价值感+情感驱动+配偶星被否定，不需要异性的存在，不喜欢官杀，一定不是责任感驱动。", "ans": true, "exp": "原文：女同性恋的标志是自我价值感+情感驱动+配偶星被否定。她不需要异性的存在，不需要配偶的情，不喜欢官杀，一定不是责任感驱动。", "id": "Q0729"}, {"type": "judge", "cat": "scene", "q": "“运筹帷幄、决胜千里之外”的人一定是精神驱动（或精神+责任感）；责任感驱动的人倾向规划谋划、锁定目标、确定战略。", "ans": true, "exp": "原文：运筹帷幄、决胜千里之外的人，一定是精神驱动的；也可能是精神驱动+责任感驱动相重合的表现。责任感驱动的人倾向于规划、谋划，会锁定目标、确定战略。", "id": "Q0730"}, {"type": "judge", "cat": "scene", "q": "情感驱动的人创业，一旦开始动“我慢心”（不知不觉傲慢）就会走下坡路、破财；他善于运用财富但最终败在自己的我慢心上。", "ans": true, "exp": "原文：让他开始走下坡路的东西，就是我慢心——他不知不觉开始傲慢了。这是情感驱动的人创业、做事情等开始走下坡路的标志。最终会败在自己的我慢心上。", "id": "Q0731"}, {"type": "judge", "cat": "scene", "q": "责任感驱动的人压力越大动力越大，一生“惧内”往往大富大贵，所以事业做得好的男人标志之一就是怕老婆（怕的是妻子情绪不开心）。", "ans": true, "exp": "原文：责任感驱动的人就是压力越大动力越大。一生惧内大富大贵……标志就是怕老婆。怕的不是这个女人本身，怕的是妻子的情绪不开心。", "id": "Q0732"}, {"type": "judge", "cat": "scene", "q": "责任感驱动的领导力是“驾驭”、真正领导，靠确立共同目标和控制、管理人；情感驱动的人可以团结人但不能管理人。", "ans": true, "exp": "原文：责任感驱动的领导力是驾驭，是真正的领导。他不是通过共情，而是通过确立共同的目标；最主要的是控制，他要能够管理人。情感驱动的人可以团结人，但不能管理人。", "id": "Q0733"}, {"type": "judge", "cat": "scene", "q": "情感驱动+责任感驱动同时存在对男人来说不到10%，女人比较多；同时兼具通常善根较好，若发挥好会非常优秀。", "ans": true, "exp": "原文：情感驱动+责任感驱动同时存在：对于男人来说比较少，不到10%，女人比较多。如果同时兼具了两者，通常善根比较好……如果发挥得好会非常优秀、能起到很大价值。", "id": "Q0734"}, {"type": "judge", "cat": "scene", "q": "自我价值感驱动的女人若能自然、轻松地给伴侣提供情绪价值，那她的自我价值感驱动力就很强、挣钱能力也越强。", "ans": true, "exp": "原文：如果自我价值感驱动的女人伴侣是情感驱动的，那女人越给男人提供情绪价值，挣钱的能力就越强。只有能够毫无负担地给对方提供情绪价值，才能真正发挥自己的情感能力。", "id": "Q0735"}, {"type": "judge", "cat": "scene", "q": "述情障碍的本质是傲慢/自卑、没有真正放下自己（不愿表达是傲慢，不敢表达是自卑）；情感驱动的人无法表达感受时功课很大，男生问题更大。", "ans": true, "exp": "原文：不愿意/不敢表达情感的本质是傲慢、自卑…述情障碍不是情感够不够，是没有真正放下自己、放下自己的傲慢", "id": "Q0736"}, {"type": "judge", "cat": "scene", "q": "固执的人一旦形成的想法永远不会改变，而且他的想法100%是错的、100%不利于形成阴阳平衡，固执己见去做的事都不会有好结果。", "ans": true, "exp": "原文：他所形成的想法百分之百是错误的，百分之百是不利于它形成阴阳平衡的。他固执己见去做的所有事情都不会有好结果。", "id": "Q0737"}, {"type": "judge", "cat": "scene", "q": "“我慢心”就是一个人表面高傲、非常骄傲虚荣；其实它的表现非常细微，且以情为定位，一动情绪本质上都是我慢心发作。", "ans": false, "exp": "原文：我慢心的表现并不是一个人非常高傲骄傲，我慢心是非常细微的。我慢心的定位是以情为定位的，所以当你动情绪的时候，本质上都是我慢心在发作。", "id": "Q0738"}, {"type": "judge", "cat": "scene", "q": "一个男人出于利益（在她身上找到价值感、目标感）去照顾老婆感受、毕恭毕敬不让她生气，是目标感驱动的男人，而非天生包容。", "ans": true, "exp": "原文：如果一个男人是基于利益去照顾他老婆的感受的……那一定是目标感驱动的男人，利益优先，因为他在你身上找到了价值感、目标感。", "id": "Q0739"}, {"type": "judge", "cat": "scene", "q": "命理格局“杀印相生”＝精神+责任感驱动，是成就大事业之人的标配（如刘邦、毛泽东）；“伤官配印”是情感驱动+智慧。", "ans": true, "exp": "原文：命理学的格局中，杀印相生，就是精神+责任感驱动。这是成就大事业的人的标配，比如刘邦、毛泽东。伤官配印：情感驱动的人同时有智慧。", "id": "Q0740"}, {"type": "judge", "cat": "scene", "q": "过度情感驱动的男人在亲密关系外身边可以没有女人，一旦进入关系就忍不住找各种异性，但不会真正动感情，自己也痛苦。", "ans": true, "exp": "原文：没有亲密关系的时候可以身边没有任何女人，一旦进入亲密关系，就忍不住地想要找各种异性，但又不会对这些异性真的动感情，本人也很痛苦。", "id": "Q0741"}, {"type": "judge", "cat": "scene", "q": "情感驱动的女人不喜欢花男人钱，花了会想还回去、主动A饭钱；但反而这种女人会得到最多男人的钱。", "ans": true, "exp": "原文：情感驱动的女人是不喜欢花男人的钱的女人，如果花了对方的钱会想还回去、主动A饭钱。但反而是这种类型的女人，会得到最多男人的钱。而这个男人是精神驱动+自我价值感驱动的。", "id": "Q0742"}, {"type": "judge", "cat": "scene", "q": "喜欢年纪小很多的伴侣：情感驱动、物质驱动的女生会喜欢年龄小很多的男生；精神驱动和责任感驱动的女生多喜欢比自己年龄稍大的。", "ans": true, "exp": "原文：情感驱动、物质驱动的女生，会喜欢年龄小很多的男生。精神驱动和责任感驱动的女生，多数是会喜欢比自己年龄稍大的。", "id": "Q0743"}, {"type": "judge", "cat": "scene", "q": "通过学习智慧更容易从失恋中走出来的是精神驱动（可理性疗愈）的女人；走不出来的大多都是理性和智慧帮不了的情感驱动的女人。", "ans": true, "exp": "原文：通过学习智慧更容易从失恋中走出来的是精神驱动的女人。走不出来的，大多都是理性和智慧帮助不了的情感驱动的女人。", "id": "Q0744"}, {"type": "judge", "cat": "scene", "q": "“有情的女人”过度精神驱动想太多，解决办法之一是经济允许时多花钱、多为别人花钱，用钱替自己表达真实感受。", "ans": true, "exp": "原文：最主要的问题就是想太多了。解决办法是，在经济状况允许的情况下，多花钱、多为别人花钱。在无法表达真实感受的时候，就都用钱来替自己表达。", "id": "Q0745"}, {"type": "judge", "cat": "scene", "q": "若某女生突然开始喜欢“不怎么搭理自己的男人”，说明她的驱动力很可能已从物质+责任感驱动变成了精神驱动。", "ans": true, "exp": "原文：如果像之前一样喜欢理自己的男人……就仍旧是物质驱动+责任感驱动（需要爱和陪伴）。如果突然喜欢不怎么搭理自己的男人了，就变成精神驱动了。", "id": "Q0746"}, {"type": "judge", "cat": "scene", "q": "日干（八卦）的平衡决定性格和核心驱动力；太极的平衡决定人一生的生命福祉。两者没有因果关系。", "ans": true, "exp": "原文：五种驱动力仅仅只是基于八卦层面的平衡得出的。八卦的维度决定了性格、决定了核心驱动力。太极的维度决定了生命的福祉。这两个维度没有因果关系，不是A好B就好。", "id": "Q0747"}, {"type": "judge", "cat": "scene", "q": "无情无爱的人＝过度精神驱动+过度情感驱动同时存在；一般不会主动追人，觉得人不错也只是觉得合适。", "ans": true, "exp": "原文：无情无爱的人就是过度精神驱动+过度情感驱动同时存在的。一般情况下不会主动追人，有可能会觉得这个人还不错，但本质上不是喜欢这个人，只是觉得合适。", "id": "Q0748"}, {"type": "judge", "cat": "scene", "q": "学艺术的人很多是过度的情感驱动，但有积极情感能力、创作过程愉悦正能量的艺术家不多，很多是越创作越痛苦的。", "ans": true, "exp": "原文：学艺术的人很多都是过度的情感。有积极的情感能力的艺术家不多。那种但凡在痛苦中创作的都不是情感驱动的人，但他越创作越痛苦。", "id": "Q0749"}, {"type": "judge", "cat": "scene", "q": "责任感驱动男人因妻子生完孩子后不再打电话催他回家而经历“精神危机”，这是他必经的两种痛苦状态之一。", "ans": true, "exp": "原文：这就是责任感驱动的男人必经的2种痛苦的状态：一是妻子有情的时候承受控制欲很痛苦；二是妻子没有情的时候失去动力、没有目标的迷茫的感受。", "id": "Q0750"}, {"type": "judge", "cat": "scene", "q": "过度自信、自我感觉特别良好、傲慢特别大的人，通常是过度情感驱动，而真正的驱动力很可能是精神驱动但精神力不够。", "ans": true, "exp": "原文：过度自信、自我感觉特别良好、傲慢特别大的人，通常是过度情感驱动，真正的驱动力是精神驱动，但是精神力不够的表现。", "id": "Q0751"}, {"type": "judge", "cat": "scene", "q": "打坐、靠理性觉悟的“传统修行”对情感驱动的人是有效标志；情感驱动要的却是热闹、人间烟火和开心。", "ans": false, "exp": "原文：只有精神驱动的人是靠理性获得觉悟的，打坐也只对精神驱动的人是有用的。情感驱动不要乱修行，情感驱动要的到反而是热闹、是人间烟火、是开心。", "id": "Q0752"}, {"type": "judge", "cat": "scene", "q": "“不是责任感驱动的人”可以一辈子做喜欢的事，但不要发展成事业，想做就做、想停就停，半途而废反而是好事。", "ans": true, "exp": "原文：可以一直做喜欢的事情做一辈子，但是不要发展成事业。这样子做事情就不用承担责任。想做就做，不想做就停。半途而废是好事。", "id": "Q0753"}, {"type": "judge", "cat": "scene", "q": "真正会沉迷游戏（上瘾）的是过度情感驱动的表现（上瘾是情绪需要）；责任感驱动的男人玩娱乐只是放松、不会沉迷。", "ans": true, "exp": "原文：真正会沉迷游戏的是过度的情感驱动的表现，上瘾是一种情绪需要。责任感驱动的男人，玩游戏也只是娱乐，谈不上沉迷。", "id": "Q0754"}, {"type": "judge", "cat": "scene", "q": "因爱生恨是有爱的女人从爱变成了情、变成了怨恨；有情的女生本质上无法有怨恨，只有有爱的女人才可能生得出恨。", "ans": true, "exp": "原文：因爱生恨是有爱的女人从爱变成了情、变成了怨恨。而有情的女生本质上无法有怨恨，所以只有有爱的女人才有可能生得出恨。", "id": "Q0755"}, {"type": "judge", "cat": "scene", "q": "守财奴身体一定不好——有很多钱却不会做布施，身体就不好、心里不幸福；真正的慈善不能免费，会极大激发众生的贪求心。", "ans": true, "exp": "原文：守财奴身体一定不好——有很多钱却不会做布施，身体就不好、心里不幸福…真正的慈善是不能免费的", "id": "Q0756"}, {"type": "judge", "cat": "scene", "q": "嫉妒心最强的是情感驱动；强烈的情感驱动会忍不住在意伴侣的前任，而过度的情感驱动是不在乎伴侣有多少前任的。", "ans": true, "exp": "原文：嫉妒心最强的是情感驱动…强烈的情感驱动会忍不住在意伴侣的前任，但过度的情感驱动是不在乎伴侣有多少前任的", "id": "Q0757"}, {"type": "judge", "cat": "scene", "q": "描述一个人的驱动力时，只有“强／弱”一个维度，不需要考虑“需不需要”这个维度。", "ans": false, "exp": "原文：以太极为平衡，不需要动应的五行能量都叫过度。命主需要不需要与你八字中这种五行能量的强弱是平行的2个维度，描述驱动力时应说：积极/过度的强/弱XXX驱动。", "id": "Q0758"}, {"type": "judge", "cat": "scene", "q": "过度精神驱动的人很容易展现“精神攻击”，如愧疚式教育、用冷静的冷漠惩罚做错事的人（精神控制）。", "ans": true, "exp": "原文：过度精神驱动的人很容易展现出精神攻击的一面。很冷漠不理做错事的人，就是用冷漠惩罚做错事的人，也是过度精神驱动、精神控制。", "id": "Q0759"}, {"type": "judge", "cat": "scene", "q": "木火之气过剩的情感驱动女生常伴随生殖系统疾病、肾阴虚、耳鸣、掉发等，且发起神经来最强大。", "ans": true, "exp": "原文：木火之气过剩的情感驱动的女生通常伴随着生殖系统疾病，还有肾阴虚、听力障碍、间歇性耳聋、耳鸣、掉发等。木火之气是爆裂的，直接爆炸。", "id": "Q0760"}, {"type": "judge", "cat": "scene", "q": "女人被叫“XX太太、XX妈妈”感觉自我价值缺失，可能是自我价值感驱动的人，但更主要的一定不是责任感驱动的人。", "ans": true, "exp": "原文：会感觉自我价值感缺失，这有可能是自我价值感驱动的人，但更主要的一定不是责任感驱动的人。", "id": "Q0761"}, {"type": "judge", "cat": "scene", "q": "最容易向女人借钱的男人是物质驱动的（要的是钱，只要是钱就要）；最容易把钱借给男人的女人是有情的女人。", "ans": true, "exp": "原文：最容易向女人借钱的男人是物质驱动的。他要的并不是女人的钱，他要的是钱。有情的女人是最容易借钱给男人的。", "id": "Q0762"}, {"type": "judge", "cat": "scene", "q": "愿力驱动＝精神驱动+责任感驱动；只有精神驱动才有真正的慈悲心，愿力只有在责任感驱动下才有大担当。", "ans": true, "exp": "原文：有精神驱动的人才有真正的慈悲心，愿力驱动只有在责任感驱动的时候才有很大的担当。所以愿力驱动是两种结合的结果。", "id": "Q0763"}, {"type": "judge", "cat": "scene", "q": "一部分人的核心驱动力会随气运／时间波动，最明显的就是性格转变，常带来缘分的结束与开始。", "ans": true, "exp": "原文：一部分人的核心驱动力会随着气运/时间波动，最明显的变化就是性格发生转变。当核心驱动力发生改变的时候，往往会带来缘分的结束与开始。", "id": "Q0764"}, {"type": "judge", "cat": "scene", "q": "0.5种驱动力本质代表他并不是这种驱动力的稳定之人，而是会在“积极”和“过度”驱动力之间波动。", "ans": true, "exp": "原文：0.5驱动力本质上代表他不是这种驱动力的人，不是稳定的一直在积极的驱动力中，而是会在积极和过度的驱动力中波动。", "id": "Q0765"}, {"type": "judge", "cat": "scene", "q": "母亲强加给孩子“过度的爱”（愧疚式教育），会让孩子成为逃避责任感、不负责任的人。", "ans": true, "exp": "原文：母亲如果强加给孩子过度的爱，孩子感受到这种压迫感，会让孩子成为一个逃避责任感、不负责任的人。过度的爱就是愧疚式教育，因为它是基于理性的。", "id": "Q0766"}, {"type": "judge", "cat": "scene", "q": "当一个男人开始需要别人给他提供情绪价值（“你要让我爽”）时，他事业上升的动力就结束了、我慢心开始生长。", "ans": true, "exp": "原文：当一个男人需要别人来给他提供情绪价值的时候，他事业上升的动力就已经结束了，我慢心开始生长了。", "id": "Q0767"}, {"type": "judge", "cat": "scene", "q": "70%的过度自我价值感驱动的人伴随过度精神驱动，剩下30%可能是积极精神驱动，看平衡方式。", "ans": true, "exp": "原文：70%的过度自我价值感驱动的人，是伴随过度精神驱动的。但也有可能30%的人是积极精神驱动。看平衡方式。", "id": "Q0768"}, {"type": "judge", "cat": "scene", "q": "凡人之质量，中和最贵焉。平淡就是中庸平衡；一个人身上没有任何习气标签、越平淡越能显示内心心量，越优秀。", "ans": true, "exp": "原文：凡人之质量，中和最贵矣…平淡就是中庸、平衡。…越平淡越能显示一个人内心的心量", "id": "Q0769"}, {"type": "judge", "cat": "scene", "q": "真正有情的女人也不吵架、害怕冲突；爱吵架的是过度情感驱动，冷暴力常用来形容过度情感驱动。", "ans": true, "exp": "原文：真正有情的女人也不吵架，害怕冲突。爱吵架的是过度情感驱动。冷暴力通常用来形容女人都是过度情感驱动的。", "id": "Q0770"}, {"type": "judge", "cat": "scene", "q": "回避男之所以是“弱责任感”而非“强责任感”，是因为他回避的东西本身就是责任。", "ans": true, "exp": "原文：是弱责任感而不是强责任感，是因为他回避的东西本身就是责任。责任同时是女人的控制欲。所以回避的就是女人的情，一点都承受不了。", "id": "Q0771"}, {"type": "judge", "cat": "scene", "q": "感情中生出猜疑、嫉妒是自我价值感缺失的表现，直接结果是控制欲，而且只会在亲密关系中显化。", "ans": true, "exp": "原文：感情中生出猜疑、嫉妒都是自我价值感缺失的表现，直接的结果是控制欲。只有在亲密关系中会有这样的显化。", "id": "Q0772"}, {"type": "judge", "cat": "scene", "q": "最会哄男人的是精神驱动的女人；能真正被哄好的（一哄就没事）只有精神驱动的女生和情感驱动的男生。", "ans": true, "exp": "原文：精神驱动的女人最会哄男人。能哄得好、可以被哄好的，只有精神驱动的女生和情感驱动的男生。", "id": "Q0773"}, {"type": "judge", "cat": "scene", "q": "愤怒是实现目的、处理问题的能力：内心是平静的、如如不动，但能够爆发出巨大的情绪，才是真正有能量的生气。", "ans": true, "exp": "原文：内心是平静的、如如不动，但能够爆发出巨大的情绪，这才是真正有能量的生气", "id": "Q0774"}, {"type": "judge", "cat": "scene", "q": "一个人只要满足“高度回避”这一特征，就一定是“过度的强责任感驱动”。", "ans": false, "exp": "原文：能被称为回避的人，是高度敏感，异性的情一点点都无法承受，回避女人的情。能称之为回避的是过度的弱责任感驱动。其本能驱动力本身是弱责任感。", "id": "Q0775"}, {"type": "judge", "cat": "scene", "q": "真正做事业的人喜欢在朋友圈“秀事业”、炫耀自己很厉害，越秀事业发展越旺。", "ans": false, "exp": "原文：真正做事业的人是不会秀的，低调做事，闷声发大财。如果一个人的事业风风光光，突然开始想秀了，这个人的事业就到头了、要开始衰败了。", "id": "Q0776"}, {"type": "judge", "cat": "scene", "q": "“只想搞事业赚钱、听不了情情爱爱话题”说明这样的人不需要任何情感连接。", "ans": false, "exp": "原文：有些人只想搞事业赚钱、听不了情爱话题，但有些人不解决情爱就没办法搞事业赚钱；每个人的生命需求不一样，不能互相理解不代表没有需求。", "id": "Q0777"}, {"type": "judge", "cat": "scene", "q": "过度精神驱动是最容易神经衰弱的人，实际不爱思考，但就是有过度的精神力、焦虑内耗、想太多。", "ans": true, "exp": "原文：过度精神驱动是最容易神经衰弱的人。实际不爱思考，但就是有过度的精神力，焦虑内耗，想太多。", "id": "Q0778"}, {"type": "judge", "cat": "scene", "q": "被男人骂得最多的女人是过度精神驱动的女人，因为她们匹配到的往往是过度情感驱动的男人。", "ans": true, "exp": "原文：被男人骂得最多的就是过度精神驱动的女人。因为过度精神驱动的女人，匹配到的就是过度情感驱动的男人。", "id": "Q0779"}, {"type": "judge", "cat": "scene", "q": "99%的男人都只需要女人积极的情感能力，一定不需要女人负面的情绪。", "ans": true, "exp": "原文：99%的男人都只需要女人积极的情感能力，一定不需要女人负面的情绪。如果男人连女人负面的情绪也能接纳，就不会有任何事业，事业会衰败。", "id": "Q0780"}, {"type": "judge", "cat": "scene", "q": "“爱生闷气、性格内向不爱说话”与“述情障碍”是同一回事，都是不喜欢社交。", "ans": false, "exp": "原文：述情障碍和性格内向不一样。内向是不想社交，社恐是想社交融入不了，述情障碍是社恐的一种特征（有很多感受表达不出来）。", "id": "Q0781"}, {"type": "multi", "cat": "money", "q": "所谓“老天爷的钱关”一共只有两个维度。以下哪两项属于“老天爷的钱关”的两个维度？（多选）", "options": ["让你经历穷，看你怕不怕", "让你有钱以后，看你贪不贪", "让你负债", "让你创业"], "ans": [0, 1], "exp": "原文：老天爷的钱关只有 2 个维度：1 是让你经历穷，看你怕不怕；2 是让你有钱以后，看你贪不贪", "id": "Q0879"}, {"type": "single", "cat": "money", "q": "推测自己财富格局时，若想象最大财富量级后第一念头是消费，说明？", "options": ["目前匹配不上这个量级", "正要发财", "是气运好", "是善根深"], "ans": 0, "exp": "原文：想象自己能驾驭的最大财富量级…如果第一念头是消费（花钱、存款、投资等），说明自己目前匹配不上这个量级", "id": "Q0880"}, {"type": "single", "cat": "money", "q": "风险偏好最高（极度相信自己的判断就 ALL IN）的组合是？", "options": ["过度情感驱动+积极物质驱动", "情感驱动+物质驱动", "精神驱动+自我价值感", "单一物质驱动"], "ans": 0, "exp": "原文：风险偏好最高的是过度情感驱动+积极物质驱动，和我慢心有关——极度相信自己的判断就会 ALL IN", "id": "Q0881"}, {"type": "single", "cat": "money", "q": "自我价值感驱动的女人实现或感受自我价值感的方式是？", "options": ["男人的情", "男人的钱", "男人的陪伴", "男人的地位"], "ans": 1, "exp": "原文：女人的自我价值感驱动，实现或感受自我价值感的方式是男人的钱，她匹配的是男人的钱，也就是她感受爱的方式是男人给她花钱。", "id": "Q0882"}, {"type": "single", "cat": "money", "q": "为什么说“和大家合伙是收割所有人的最快方式”？", "options": ["合伙者中只要有 1 个人命或运不好，创业就不会成功", "钱分不均匀", "大家不努力", "没有主人"], "ans": 0, "exp": "原文：和大家合伙是收割所有人的最快方式，因为合伙者中只要有 1 个人命或运不好，创业就不会成功；合作人越多越可怕、失败率越高", "id": "Q0883"}, {"type": "single", "cat": "money", "q": "一个人只要会把钱花出去，所有人花钱的目的都相同且仅有一个，是哪？", "options": ["满足自己的情绪价值", "投资增值", "回报家人", "建立信任"], "ans": 0, "exp": "原文：所有人花钱的目的都相同、且仅有一个——满足自己的情绪价值（单纯的花钱）", "id": "Q0884"}, {"type": "single", "cat": "money", "q": "在家族财富继承之中，什么样的富二代才能继承、承载父亲的财产？", "options": ["物质驱动的人", "责任感驱动的人", "具有积极精神驱动的人", "情感驱动的人"], "ans": 2, "exp": "原文：如果没有精神驱动，无论是男人还是女人，即使父亲给了很多钱也成就不了你…如果不具有积极的精神驱动，就无法承载来自父亲的财富。", "id": "Q0885"}, {"type": "single", "cat": "money", "q": "真正能管住钱（克得住钱财、不乱花）的人是哪种驱动的人？", "options": ["物质驱动", "情感驱动", "责任感驱动", "自我价值感驱动"], "ans": 3, "exp": "原文：真正能管钱的本质是能克得住钱财的人，也就是自我价值感驱动的人，前提是气运支持。", "id": "Q0886"}, {"type": "single", "cat": "money", "q": "不容易存住钱、留不住钱（没财库），传统命理“财库”指什么？", "options": ["辰戌丑未", "子午卯酉", "寅申巳亥", "所有五行"], "ans": 0, "exp": "原文：传统命理学叫“财库”，没财库的人留不住钱…财库就是辰戌丑未", "id": "Q0887"}, {"type": "single", "cat": "money", "q": "人对于财富、物质的控制力，最终表现在哪一方面？", "options": ["情感上", "自我价值感上", "责任感上", "精神上"], "ans": 1, "exp": "原文：人对于财富、物质的控制力表现在自我价值感上——能与自己控制的东西有平衡时，是赚钱能力最强的状态。", "id": "Q0888"}, {"type": "single", "cat": "money", "q": "“想办法赚钱”与“想办法赚别人的钱”分别对应哪种人？", "options": ["自我价值感驱动 / 过度自我价值感驱动", "责任感/情感", "物质/精神", "情感/责任"], "ans": 0, "exp": "原文：前者是自我价值感驱动的人做的，后者是过度自我价值感驱动的人做的", "id": "Q0889"}, {"type": "single", "cat": "money", "q": "自我价值感驱动的人内心安全感的来源是什么？", "options": ["拥有很多钱", "稳定的赚钱能力（被需要）", "会花钱", "被人夸"], "ans": 1, "exp": "原文：自我价值感驱动的人一天不赚钱就焦虑，是想要被需要，安全感的来源是稳定的赚钱能力。", "id": "Q0890"}, {"type": "single", "cat": "money", "q": "哪种驱动力组合风险管理做得最好、见好就收不贪心？", "options": ["情感驱动+物质驱动", "精神驱动+自我价值感", "责任感驱动+物质", "纯精神驱动"], "ans": 0, "exp": "原文：情感驱动+物质驱动：风险管理做得最好。见好就收、不贪心就是风险意识", "id": "Q0891"}, {"type": "single", "cat": "money", "q": "在五行理论中，\"情(情感驱动)\"被定位为食伤，其根本原因是什么？", "options": ["因为食伤是官星", "因为食伤用来生财", "因为食伤是印星", "因为食伤是比劫"], "ans": 1, "exp": "原文：为什么情的定位是食伤？因为食伤是用来生财的。如果你是木，火就是你的食伤，土就是你的财星；所以食是财源，食伤是生财的。", "id": "Q0892"}, {"type": "single", "cat": "money", "q": "“士农工商，商为贱”这一说法对应的内涵是下列哪一项？", "options": ["财富是生命价值维度里排最后的，驾驭不了就平衡不了", "商人最贵", "商业地位高于读书", "商人善根最深"], "ans": 0, "exp": "原文：士农工商，商为贱——财富是生命价值维度里排最后的，驾驭不了就平衡不了，与善根无关", "id": "Q0893"}, {"type": "single", "cat": "money", "q": "要做到'财富显化无碍'，关键是什么？", "options": ["赚很多钱", "不对父母投射负能量（无论父母是什么样的人）", "投资成功", "创业成功"], "ans": 1, "exp": "原文：因为如果你能不对父母投射负能量（无论父母是什么样的人），就是财富显化无碍的关键。", "id": "Q0894"}, {"type": "single", "cat": "money", "q": "一个人对金钱的心态，呈现出的规律是下列哪一项？", "options": ["不在乎钱、对金钱最没感觉的人往往最想赚钱", "不在乎钱的人最不想赚钱", "想赚钱的人最会花钱", "过度物质驱动的人最不爱钱"], "ans": 0, "exp": "原文：不在乎钱、对金钱最没感觉的人，往往最想赚钱；不想赚钱、对金钱没有焦虑的人，往往更善于运用金钱", "id": "Q0895"}, {"type": "single", "cat": "money", "q": "一个人如果以“缺钱为发心”去赚钱，结果会怎样？", "options": ["正好能赚钱", "能赚很多钱", "赚不到钱", "与赚钱无关"], "ans": 2, "exp": "原文：以缺钱为发心去赚钱的人是赚不到钱的；自我价值感的人的发心不是缺钱。", "id": "Q0896"}, {"type": "single", "cat": "money", "q": "“富而不贵”指的是下列哪种情况？", "options": ["可以很有钱但钱对他没意义、得不到人的尊重", "很有才气能当大官", "没钱舍不得花", "没有事业心"], "ans": 0, "exp": "原文：上述例子就是富而不贵——可以很有钱，但钱对他没有意义，得不到人的尊重，别人和他交往只因他有钱", "id": "Q0897"}, {"type": "single", "cat": "money", "q": "当一个人因为负债而感到痛苦时，首先建议他做什么？", "options": ["忏悔对金钱的贪着", "快速还款", "远离债务", "把矛盾转给别人"], "ans": 0, "exp": "原文：感到痛苦先忏悔对金钱的贪着。负债的定位是财星的气数和时运，与驱动力无关", "id": "Q0898"}, {"type": "single", "cat": "money", "q": "乱花钱最快的方式一定是什么？", "options": ["创业和投资", "吃喝玩乐", "买房", "旅游"], "ans": 0, "exp": "原文：乱花钱最快的方式一定是创业和投资——有多少钱干多少事，会瞬间消耗掉大量财富", "id": "Q0899"}, {"type": "single", "cat": "money", "q": "'赌博'这种行为的本质特征，可以被描述为什么？", "options": ["非常明显的德不配财、被老天收割", "财运旺盛的表现", "责任感驱动的表现", "贵气体现"], "ans": 0, "exp": "原文：赌博是非常明显的德不配财、被老天收割的例子——内心的贪着让他坐上牌桌，很快被收割", "id": "Q0900"}, {"type": "single", "cat": "money", "q": "关于'免费做慈善'这件事，正确的论断是下列哪一项？", "options": ["免费是巨大陷阱，没有人类有资格做免费的公益", "免费能增长善根", "免费慈善必有好报", "免费是慈悲的最高表现"], "ans": 0, "exp": "原文：免费是巨大陷阱，没有人类有资格做免费的公益。慈善需要智慧", "id": "Q0901"}, {"type": "single", "cat": "money", "q": "在赚钱这件事上，哪几个要素之间彼此没有因果关系？", "options": ["想不想要、需不需要和能不能有", "努力与懒惰", "投资与消费", "本金与利息"], "ans": 0, "exp": "原文：赚钱想不想要、需不需要和能不能有，彼此没有因果关系", "id": "Q0902"}, {"type": "single", "cat": "money", "q": "决定一个人一生财富维度和财富层次的根本因素是什么？", "options": ["善根", "努力程度", "学历", "人脉"], "ans": 0, "exp": "原文：决定一生财富维度和层次的是善根", "id": "Q0903"}, {"type": "judge", "cat": "money", "q": "如果能处理好与父亲和母亲的关系，相当于能平衡自身五行能量的财星平衡与印星平衡；实现财印平衡，象征你在世间的财富显化上就不会再有障碍了。", "ans": true, "exp": "原文：如果能处理好与父亲和母亲的关系，相当于能平衡自身五行能量的财星平衡与印星平衡…就实现了自身的财印平衡。这象征着你在世间的财富显化上，就不会再有障碍了。", "id": "Q0904"}, {"type": "judge", "cat": "money", "q": "如果自己与母亲关系极差，但只要自身有好的气运，也能得到母亲在金钱上的恩泽（如述情障碍、母亲走后留给他一大笔钱），这是缘分、也是因果的一部分。", "ans": true, "exp": "原文：现实中碰到不少这样的案例：跟母亲关系极差，但母亲走后留给他一大笔钱（来自母亲金钱的恩泽）。前提是你有这样的气运…也是因果的一部分。", "id": "Q0905"}, {"type": "judge", "cat": "money", "q": "财富传承的本质意义上没有意义；把财富传给下一代是典型的对自我的执着（把对自我的执着转移到了对后代的执着）。", "ans": true, "exp": "原文：财富传承的意义本质上没有意义，一定要把财富传给下一代是典型的对自我的执着（你已不在这个世界上还执着财富给后代，就是把对自我的执着转移到了对后代的执着）。", "id": "Q0906"}, {"type": "judge", "cat": "money", "q": "情感驱动的人不想赚钱，但会创造财富；\"创造\"不是赚钱，他能无中生有，从情感中生出财气、招感金钱。情就是财源。", "ans": true, "exp": "原文：情感驱动的人不想赚钱，但会创造财富…财之源、财心的源头就是人的情。…他能无中生有，从情感中生出财气、招感金钱。", "id": "Q0907"}, {"type": "judge", "cat": "money", "q": "真正能赚朋友钱的人也是情感驱动的人；自我价值感驱动的人赚朋友的钱会有愧疚感、赚不了朋友的钱。", "ans": true, "exp": "原文：真正能赚朋友钱的人也是情感驱动的人：情感驱动的人赚朋友钱毫无违和感…自我价值感驱动的人…赚朋友的钱会有愧疚感、赚不了朋友的钱。", "id": "Q0908"}, {"type": "judge", "cat": "money", "q": "女人有财气的表现是爱给男人花钱、愿意给男人花钱，而且越花越有钱，同时能在自己事业上花钱。", "ans": true, "exp": "原文：女人的财气…是她会很愿意给男人花钱。爱给男人花钱的女人财气就会非常好，而且越花越有钱；同时能在自己事业上花钱。", "id": "Q0909"}, {"type": "judge", "cat": "money", "q": "把赚钱作为第一发心做事，会无形中陷入对金钱的执着、产生很大内耗；要找到钱以外更好、更重要的发心。", "ans": true, "exp": "原文：把赚钱作为第一发心做事，会无形中陷入对金钱的执着、产生很大内耗；要找到钱以外更好、更重要的发心", "id": "Q0910"}, {"type": "judge", "cat": "money", "q": "能得男人的爱，本质上是女人有财气的标志；女人的财气就是指赚钱的能力。", "ans": false, "exp": "原文：女人能得男人的爱，本质上就是女人有财气的标志。女人的财气并不是指赚钱的能力…爱给男人花钱的女人财气就会非常好。", "id": "Q0911"}, {"type": "judge", "cat": "money", "q": "女人自身的财富层次对应的就是男人的智慧：财气越好的女人对应的老公越有智慧。", "ans": true, "exp": "原文：女人自身的财富层次（财星一阴一阳平衡的维度）对应的是男人的智慧：财气越好的女人对应的老公越有智慧。", "id": "Q0912"}, {"type": "judge", "cat": "money", "q": "经历破产、负债只是一种形式；真正钱关是，在真正发迹之前无论如何努力都赚不到一毛钱。", "ans": true, "exp": "原文：经历破产、负债只是一种形式；真正的钱关是，在真正发迹之前无论如何努力都赚不到一毛钱", "id": "Q0913"}, {"type": "judge", "cat": "money", "q": "财富类课程=低价值、专门赚穷人的钱，远不如教你如何做一个善良的人。", "ans": true, "exp": "原文：财富类课程（教你赚钱）招感来的学员都是财富匮乏、贫瘠的，专门赚穷人的钱，越想赚钱越穷…远不如教你如何做一个善良的人", "id": "Q0914"}, {"type": "judge", "cat": "money", "q": "内在是否自在与安宁，直接决定你是否有丰富的物质世界；有钱却很痛苦的人必定身体不好。", "ans": true, "exp": "原文：内在是否自在与安宁，直接决定你是否有丰富的物质世界。有钱但很痛苦的人，必定身体不好", "id": "Q0915"}, {"type": "judge", "cat": "money", "q": "免费的结果不但不被珍惜，反而激发众生的贪婪索取，无法增长自己和他人善根。", "ans": true, "exp": "原文：免费的结果不但不被珍惜，反而激发众生的贪婪索取…免费无法增长自己和他人善根，还招致众人不断生恶念", "id": "Q0916"}, {"type": "judge", "cat": "money", "q": "身家几千万出去旅游住酒店还打地铺、不舍得花钱的，没有福报，这是阳气不足的表现。", "ans": true, "exp": "原文：见过身家几千万出去旅游住酒店还打地铺的，不舍得花钱、没有福报，这是阳气不足的表现", "id": "Q0917"}, {"type": "judge", "cat": "money", "q": "人生的捷径是只和命好的人玩，前提是要有这样的福报；气数还决定你上桌坐哪个位置。", "ans": true, "exp": "原文：人生的捷径是只和命好的人玩，前提是你要有这样的福报。气数还决定你上桌坐哪个位置", "id": "Q0918"}, {"type": "judge", "cat": "money", "q": "“贵而不富”没什么问题，当官的人比比皆是；很有才气的贵气才是能当大官的类型。", "ans": true, "exp": "原文：贵而不富：没什么问题，很 OK，当官的比比皆是。很有才气的贵气才是能当大官的类型", "id": "Q0919"}, {"type": "judge", "cat": "money", "q": "事业在五行中的定位是责任感驱动；没有责任感驱动的人千万不要创业，创业必然失败。", "ans": true, "exp": "原文：事业在五行中的定位是责任感驱动，没有责任感驱动的人千万不要创业，创业必然失败", "id": "Q0920"}, {"type": "judge", "cat": "money", "q": "如果一个人很年轻就负债上千万，值得恭喜，以后可能做很大的事。", "ans": true, "exp": "原文：如果一个人很年轻就负债上千万，值得恭喜，以后可能做很大的事（指普通家庭没机会赚那么多钱却有机会负债那么多钱）", "id": "Q0921"}, {"type": "judge", "cat": "money", "q": "有情的人主富；真正有情感能力的人不会以赚钱为目的做很多事情。", "ans": true, "exp": "原文：有情的人主富。真正有情感能力的人不会想着赚钱这件事…他不是核心的追求。他不会以赚钱为目的去做很多事情。", "id": "Q0922"}, {"type": "judge", "cat": "money", "q": "情感驱动的人花男人的钱会愧疚、不开心；自我价值感驱动的女人花男人钱会开心。", "ans": true, "exp": "原文：情感驱动花男人钱会愧疚不开心，自我价值感驱动女人花男人钱会开心。", "id": "Q0923"}, {"type": "judge", "cat": "money", "q": "自我价值感驱动的女人感受爱的方式就是男人给她花钱，她只是因为重利才在乎钱。", "ans": false, "exp": "原文：她本身看钱不重，并不是因为重利，而是在意男人肯不肯为她花钱。", "id": "Q0924"}, {"type": "judge", "cat": "money", "q": "90% 的人买股票就是在赌；夫妻中一定一个赌性、一个没赌性。", "ans": true, "exp": "原文：适不适合买股票和驱动力有关，90% 的人买股票就是在赌。…夫妻中一定一个赌性、一个没赌性", "id": "Q0925"}, {"type": "judge", "cat": "money", "q": "对赚钱不好意思、对赚钱有愧疚感，说明自身无法实现平衡，气运有问题。", "ans": true, "exp": "原文：对赚钱有愧疚感是自身无法实现平衡最直观的表现；对赚钱越没愧疚感，善根越好。", "id": "Q0926"}, {"type": "judge", "cat": "money", "q": "钱关的本质是要深重忏悔对金钱的贪求，内心的安全感来自自己坚定的信念。", "ans": true, "exp": "原文：钱关的本质是要深重忏悔对金钱的贪求，内心的安全感来自自己坚定的信念", "id": "Q0927"}, {"type": "judge", "cat": "money", "q": "教你突破现有格局中财富上限的唯一方式是进德修业、行善积德、厚德载物。", "ans": true, "exp": "原文：教你突破现有格局中财富上限的唯一方式是进德修业、行善积德、厚德载物", "id": "Q0928"}, {"type": "judge", "cat": "money", "q": "有财富焦虑的人多赚钱没用；一旦突破财富焦虑这一关，人生就要走好运。", "ans": true, "exp": "原文：有财富焦虑的人多赚钱没用。…一旦突破财富焦虑这一关，人生就要走好运", "id": "Q0929"}, {"type": "judge", "cat": "money", "q": "主动负债不是坏事，可能是事业助力；负债量级取决于财星气数。", "ans": true, "exp": "原文：分被动负债和主动负债：主动负债不是坏事，可能是事业助力。…负债量级取决于财星气数", "id": "Q0930"}, {"type": "judge", "cat": "money", "q": "物质世界中显化财富取决于你有多少情、能承载他人对你多少情。", "ans": true, "exp": "原文：物质世界中显化财富取决于你有多少情、能承载他人对你多少情。这就是赚钱最根本的东西", "id": "Q0931"}, {"type": "judge", "cat": "money", "q": "财气好的女人一般不会很好看；真正做事业的男人，配偶也长得不好看。", "ans": true, "exp": "原文：财气好的女人：一般不会很好看；真正做事业的男人，配偶也长得不好看", "id": "Q0932"}, {"type": "judge", "cat": "money", "q": "有情的人通常爱思考、爱动脑筋，靠理性做事情。", "ans": false, "exp": "原文：有情的人不爱思考、不爱动脑，很多事情不想，直接靠感觉去做…所以有情的人通常不思考，越不思考越好。", "id": "Q0933"}, {"type": "judge", "cat": "money", "q": "自我价值感驱动的人通常赚钱但不花、也不投资。", "ans": true, "exp": "原文：自我价值感驱动的人通常会赚钱不会花钱，也不会投资；纠结花钱、花钱没有满足感。", "id": "Q0934"}, {"type": "judge", "cat": "money", "q": "不想要钱、对金钱不感兴趣，和实际有没有钱有因果关系。", "ans": false, "exp": "原文：不想要钱、对金钱不感兴趣，和实际有没有钱没有因果关系", "id": "Q0935"}, {"type": "judge", "cat": "money", "q": "大方用钱、会花钱、对钱没概念就是过钱关。", "ans": false, "exp": "原文：大方用钱、会花钱、对钱没概念并不是过钱关。老天爷的钱关只有 2 个维度", "id": "Q0936"}, {"type": "judge", "cat": "money", "q": "以赚钱为目的做事情的人，千万不能把客户交成朋友。", "ans": true, "exp": "原文：所以以赚钱为目的做事情的人，千万不能把客户交成朋友。", "id": "Q0937"}, {"type": "judge", "cat": "money", "q": "过度焦虑钱的人怕的是赚钱的能力本身，而不是怕贫穷。", "ans": false, "exp": "原文：过度焦虑钱的人怕的是贫穷本身，而不是赚钱的能力", "id": "Q0938"}, {"type": "judge", "cat": "money", "q": "孝是财富显化即“财印平衡”的根本框架。", "ans": true, "exp": "原文：孝=财富显化（财印平衡）；财印平衡是与父母亲近的根本框架。", "id": "Q0939"}, {"type": "judge", "cat": "money", "q": "情＝财之源，有情的人不容易穷。", "ans": true, "exp": "原文：情=财之源；“有情的人不容易穷”是情感驱动子话题。", "id": "Q0940"}, {"type": "judge", "cat": "money", "q": "事业所显化的财富，通常比赚钱的更多。", "ans": true, "exp": "原文：由事业来显化的财富，通常比赚钱的更多。", "id": "Q0941"}, {"type": "judge", "cat": "drive", "q": "一个完整的四柱就代表一个人的太极。", "ans": true, "exp": "原文：一个完整的四柱就是一个人的太极。人就是一个生命体，一个太极体。", "id": "Q0101"}, {"type": "single", "cat": "drive", "q": "决定一个人生命吉凶的关键是什么？", "options": ["五行的旺衰强弱", "阴阳平衡", "十神的多寡", "大运的长短"], "ans": 1, "exp": "原文：阴阳是两种能量的平衡方式，决定人的生命吉凶的东西是阴阳平衡。", "id": "Q0102"}, {"type": "judge", "cat": "drive", "q": "只要生命不平衡就必然有痛苦，苦都源于自身的不平衡。", "ans": true, "exp": "原文：生命中不平衡就必然有苦，所有的苦都是因为自身的不平衡导致的。", "id": "Q0103"}, {"type": "single", "cat": "drive", "q": "在《八字五行驱动力》的理论中，'易经'、'道'的核心是什么？", "options": ["空性智慧", "一阴一阳的平衡", "因果报应", "轮回转世"], "ans": 1, "exp": "原文：道是一阴一阳之谓道，是平衡。平衡才是道的核心。", "id": "Q0104"}, {"type": "judge", "cat": "drive", "q": "五行中阴干对应脏、阳干对应腑。", "ans": true, "exp": "原文：阴干为脏，阳干为腑。脏：能够运化气的东西。腑：能够储存运输气的东西。", "id": "Q0105"}, {"type": "single", "cat": "drive", "q": "在五行取象（脏腑对应）中，“乙木”对应人体的哪个脏腑？", "options": ["胆囊", "肝脏", "小肠", "脾胃"], "ans": 1, "exp": "原文：脏 乙木：肝；丁火：心脏；己土：脾脏；辛金：肺；癸水：肾。", "id": "Q0106"}, {"type": "multi", "cat": "drive", "q": "在五行取象（脏腑对应）中，下列哪些属于'脏'之阴干的对应？（多项）", "options": ["乙木（肝）", "甲木（胆）", "丁火（心脏）", "庚金（大肠）"], "ans": [0, 2], "exp": "原文：阴干为脏，阳干为腑。脏 乙木：肝；丁火：心脏；己土：脾脏；辛金：肺；癸水：肾。", "id": "Q0107"}, {"type": "single", "cat": "drive", "q": "在五行吉凶与命理的对应中，五行中水的吉凶在命理上代表什么？", "options": ["财运", "性能力", "事业", "子女"], "ans": 1, "exp": "原文：五行中水的吉凶，代表了性能力。", "id": "Q0108"}, {"type": "judge", "cat": "drive", "q": "性能力好不好与五行之水的旺衰无关，而是由吉凶决定。", "ans": true, "exp": "原文：性能力好不好和旺衰没有关系，不是水旺就是性能力好，是吉凶决定的。", "id": "Q0109"}, {"type": "judge", "cat": "drive", "q": "旺衰本身没有吉凶的含义，吉凶与阴阳平衡相关。", "ans": true, "exp": "原文：吉凶是和阴阳平衡相关的，还不是直接和五行相关的。旺衰没有吉凶的含义。", "id": "Q0110"}, {"type": "single", "cat": "drive", "q": "在五行吉凶与命理的对应中，五行中木的吉凶代表什么？", "options": ["性欲望", "性能力", "生殖器官活性即持久度", "感情热度"], "ans": 2, "exp": "原文：五行中木的吉凶，代表了生殖器官的活性，也就是持久度。", "id": "Q0111"}, {"type": "single", "cat": "drive", "q": "在《八字五行驱动力》的气数理论中，所谓'气数'指的是什么？", "options": ["天干的数量多少", "八卦层面一阴一阳的平衡", "地支的强弱", "十神的多寡"], "ans": 1, "exp": "原文：气数就是它在整个太极当中的价值。气数是八卦层面一阴一阳的平衡。", "id": "Q0112"}, {"type": "judge", "cat": "drive", "q": "气数就是天干之间彼此互相需要。", "ans": true, "exp": "原文：气数就是天干之间彼此互相需要。", "id": "Q0113"}, {"type": "single", "cat": "drive", "q": "在气数理论中，气数成阳的条件中使用最多的是哪种火？", "options": ["丁火", "丙火", "己土", "庚金"], "ans": 1, "exp": "原文：丙火是气数中用的最多的，成阳的条件大多数都是用丙火。", "id": "Q0114"}, {"type": "judge", "cat": "drive", "q": "命理以天干明透为吉，藏于藏干的气数会大打折扣。", "ans": true, "exp": "原文：藏干是大打折扣的。所有的太极都是以明透为吉的。", "id": "Q0115"}, {"type": "single", "cat": "drive", "q": "在命理的阴阳气绝概念中，'气绝'指的是什么？", "options": ["阳气极盛", "阴阳齐备", "阳气与阴气被克尽", "五行皆弱"], "ans": 2, "exp": "原文：气绝就是阳气与阴气被克尽的时候。非常的不利。如果一个人在岁运中，有接近阴气与阳气的气绝的状态，就非常容易消失（死亡）。", "id": "Q0116"}, {"type": "judge", "cat": "drive", "q": "减肥的本质是健脾胃。", "ans": true, "exp": "原文：减肥的本质是健脾胃。", "id": "Q0117"}, {"type": "judge", "cat": "drive", "q": "湿气就是土不能克水。", "ans": true, "exp": "原文：湿气是什么？就是土不能克水。", "id": "Q0118"}, {"type": "single", "cat": "drive", "q": "在五行与健康理论中，大多数人身体不好主要与哪些脏腑有关？", "options": ["脾胃或肝胆", "心与小肠", "肾与膀胱", "肺与大肠"], "ans": 0, "exp": "原文：脾胃是运化之本，大多数人身体不好都和脾胃有关。不是脾胃就是肝胆。", "id": "Q0119"}, {"type": "single", "cat": "drive", "q": "在驱动力与十神定位中，责任感驱动的命理定位是什么？", "options": ["正财偏财", "比肩劫财", "食神伤官", "正官偏官"], "ans": 3, "exp": "原文：责任感驱动的定位就是正官和偏官。克你的五行。", "id": "Q0120"}, {"type": "judge", "cat": "drive", "q": "责任感驱动的人目的性极强，能指哪儿打哪儿。", "ans": true, "exp": "原文：责任感驱动就是目的性超强，指哪儿打哪儿。找到目标了就往前冲。", "id": "Q0121"}, {"type": "judge", "cat": "drive", "q": "“我想赚钱、赚钱对我很重要”属于物质驱动。", "ans": false, "exp": "原文：我想赚钱/赚钱对我很重要，是自我价值感驱动。钱对我很重要，是物质驱动。", "id": "Q0122"}, {"type": "judge", "cat": "drive", "q": "口袋里明明很有钱还焦虑赚钱的是自我价值感驱动。", "ans": true, "exp": "原文：口袋里明明很有钱，还焦虑赚钱的是自我价值感驱动。", "id": "Q0123"}, {"type": "judge", "cat": "drive", "q": "口袋里有钱就好、不焦虑赚钱的是物质驱动。", "ans": true, "exp": "原文：口袋里有钱就好，不焦虑赚钱的是物质驱动。", "id": "Q0124"}, {"type": "judge", "cat": "drive", "q": "驱动力会随时运变化，若阴阳平衡模式切换会不知不觉出现两种性格。", "ans": true, "exp": "原文：驱动力会随着时运的变化而变化，如果发生过阴阳平衡模式切换的话，不知不觉中会有两种性格。", "id": "Q0125"}, {"type": "judge", "cat": "drive", "q": "多种驱动力组合中，一定有1到2种是最主要的。", "ans": true, "exp": "原文：1-4种驱动力组合中，一定有1-2种是最主要的。", "id": "Q0126"}, {"type": "judge", "cat": "drive", "q": "驱动力越多越难获得100%满足，驱动力越少越容易满足。", "ans": true, "exp": "原文：驱动力越多，意味着得到100%满足感越难。驱动力越少，越容易满足。", "id": "Q0127"}, {"type": "single", "cat": "drive", "q": "在阴阳平衡理论中，真正决定吉凶的是哪个层面的阴阳平衡？", "options": ["十神层面", "五行层面", "天干层面", "地支层面"], "ans": 1, "exp": "原文：十神没有吉凶的含义。真正决定吉凶的是五行层面的阴阳平衡。", "id": "Q0128"}, {"type": "judge", "cat": "drive", "q": "十神没有吉凶的含义，情感模式的定位都在十神相中。", "ans": true, "exp": "原文：十神没有吉凶的含义，不要在十神相中焦虑。情感模式的定位都在十神相中。", "id": "Q0129"}, {"type": "judge", "cat": "drive", "q": "情绪稳定的功课就是保持食伤的动应，不要让它不吉。", "ans": true, "exp": "原文：情绪稳定的功课，就是保持食伤的动应，不要让它不吉。", "id": "Q0130"}, {"type": "judge", "cat": "drive", "q": "修行是在找到核心驱动力的基础上朝自身方向去发展，而非盲目模仿他人。", "ans": true, "exp": "原文：修行就是在找到核心驱动力的基础上，朝自身的方向去发展。而不是像情感驱动的人去学别人断情绝爱，这不是修行，这是模仿。", "id": "Q0131"}, {"type": "judge", "cat": "drive", "q": "忏悔的起点是知道错在自己。", "ans": true, "exp": "原文：忏悔的起点是知道错在自己。", "id": "Q0132"}, {"type": "judge", "cat": "drive", "q": "“忏”表白自己的错误，“悔”是决心以后再也不这样做。", "ans": true, "exp": "原文：忏+悔，忏的是自己的错误，悔的是决心以后再也不这样。", "id": "Q0133"}, {"type": "judge", "cat": "drive", "q": "没有羞耻心的人是没办法改正自己错误的。", "ans": true, "exp": "原文：好学近乎智，力行近乎仁，知耻近乎勇，没有羞耻心的人是没办法改正自己错误的。", "id": "Q0134"}, {"type": "single", "cat": "drive", "q": "在责任感驱动（官杀）的命理定位中，关于正官和七杀的区别，以下哪项正确？", "options": ["正官有攻击性和侵略性", "七杀稳扎稳打、风险意识超强", "正官温和守规矩无攻击性，七杀侵略性强企图心强", "二者没有区别"], "ans": 2, "exp": "原文：正官表现出来的就是气度、温和、守规矩、负责任讲规则，没有攻击性侵略性。而七杀的企业家会有非常强的侵略性攻击性，企图心与目标感。", "id": "Q0135"}, {"type": "judge", "cat": "drive", "q": "事业的维度主要看七杀。", "ans": true, "exp": "原文：七杀的维度就是事业的维度，看事业就看七杀。正官也可以看，但是主要看七杀。", "id": "Q0136"}, {"type": "judge", "cat": "drive", "q": "不需要用某五行时，该五行能量很多反而功课很大。", "ans": true, "exp": "原文：你需要用土实现阴阳平衡，土在盘中很多、不少，那就非常好。如果不需要用土实现平衡，土在盘中很多，那功课就非常大了。", "id": "Q0137"}, {"type": "judge", "cat": "drive", "q": "火年可以补阳气，但对某些人动火反而有受克伤的风险。", "ans": true, "exp": "原文：火年是可以补阳气，但是对于有些人来说，阳气不足但是不能动火，动火就有克伤的风险，也有这种情况。", "id": "Q0138"}, {"type": "judge", "cat": "drive", "q": "命理上人的新年第一天不是大年初一，而是立春。", "ans": true, "exp": "原文：新年的第一天不是大年初一那一天，而是立春。立春是寅月。真正的气运交换的第一天。三阳开泰。", "id": "Q0139"}, {"type": "judge", "cat": "drive", "q": "节气是十二地支的分界线，是气运变化的交界点。", "ans": true, "exp": "原文：节气为什么重要，因为节气就是十二地支的分界线，就是气运变化的交界点。", "id": "Q0140"}, {"type": "judge", "cat": "drive", "q": "与个人相关的是自己的大运，营销号所说的九紫离火运跟个人本身关系不大。", "ans": true, "exp": "原文：营销号喜欢说九紫离火运，这个跟个人本身没什么大关系。跟每个个体有关的，是自己的大运。", "id": "Q0141"}, {"type": "judge", "cat": "drive", "q": "时间没到别乱动，潜龙勿用，不要造作。", "ans": true, "exp": "原文：潜龙勿用。动善时，时止则止，时行则行。意思就是，时间没到，别乱动，不要造作。", "id": "Q0142"}, {"type": "judge", "cat": "drive", "q": "正印好的男人是性格规规矩矩的好人。", "ans": true, "exp": "原文：正印好的男人就是性格规规矩矩的好人。", "id": "Q0143"}, {"type": "judge", "cat": "drive", "q": "印过旺时若用在妄念、动脑、分析评判上，就是用错了能量。", "ans": true, "exp": "原文：印克食伤，如果印过度旺盛，就是用错了能量，放在不停的动妄念、不停的在动脑子、分析评判、怀疑焦虑担忧，感到不安全感。", "id": "Q0144"}, {"type": "judge", "cat": "drive", "q": "有情的标志是动水生木；八字不能动水生木克土者，不是有情的女人。", "ans": true, "exp": "原文：有情的标志是动水生木，你的八字里不能动水生木克土，所以你就不是个有情的女人。", "id": "Q0145"}, {"type": "single", "cat": "love", "q": "在驱动力与性取向的对应中，关于女性同性恋的驱动定位，正确的说法是什么？", "options": ["情感驱动加物质驱动", "自我价值感驱动加情感驱动，并否定责任感驱动与精神驱动", "责任感驱动加精神驱动", "物质驱动加精神驱动"], "ans": 1, "exp": "原文：女性同性恋一定是自我价值感驱动+情感驱动，以及100%否定责任感驱动和否定精神驱动。", "id": "Q0379"}, {"type": "judge", "cat": "love", "q": "喜欢同性的定位，还需满足配偶星被否定，不需要配偶星的存在加不需要配偶的情。", "ans": true, "exp": "原文：同性的定位，还同时要求他满足配偶星被否定，不需要配偶星的存在+不需要配偶的情。", "id": "Q0380"}, {"type": "judge", "cat": "love", "q": "成为同性恋还需要时运认可自我价值感驱动和情感驱动。", "ans": true, "exp": "原文：还有一个很重要的是，时运对你的认可。走的运要认可自我价值感驱动+情感驱动。才能支持你成为同性恋。", "id": "Q0381"}, {"type": "single", "cat": "love", "q": "在阴阳平衡学说中，“缘分”是基于什么而产生的？（善缘基于自身的平衡，恶缘基于自身的不平衡）", "options": ["由八字相同产生", "基于自身的平衡而产生", "由财富相当产生", "由生肖相合产生"], "ans": 1, "exp": "原文：缘分是基于自己的平衡而产生的。善缘基于自身的平衡而产生，恶缘基于自身的不平衡而产生。", "id": "Q0382"}, {"type": "judge", "cat": "love", "q": "夫妻是共业关系。", "ans": true, "exp": "原文：夫妻是共业关系。我们能在八字当中看到彼此。最深的缘分就是分毫不差能够看到。", "id": "Q0383"}, {"type": "single", "cat": "love", "q": "合婚中“配偶星一一对应”的缘分对应，是指哪种对应？", "options": ["天干地支字面对应", "五行的关系对应", "出生时间对应", "生肖属相对应"], "ans": 1, "exp": "原文：不是天干地支对应，而是关系对应。福业相当，善业相当。", "id": "Q0384"}, {"type": "judge", "cat": "love", "q": "气运同步就是伴侣的缘分，同好同坏才是缘分。", "ans": true, "exp": "原文：气运同步就是伴侣的缘分，同好同坏才是缘分。气运不好的时候互相纠缠，互相伤害，难舍难分也是一种缘分。", "id": "Q0385"}, {"type": "single", "cat": "love", "q": "在'灵魂伴侣'的基础上，可把它进一步区分为两种类型。那么灵魂伴侣有哪两种类型？", "options": ["互补加匹配，以及彼此高度共情", "门当户对与郎才女貌", "共同修行与共同创业", "地缘相近与利益绑定"], "ans": 0, "exp": "原文：分两种，一种是互相互补+匹配，另一种是能够彼此高度共情。", "id": "Q0386"}, {"type": "judge", "cat": "love", "q": "灵魂伴侣以朋友关系相处，而不把对方当作伴侣。", "ans": true, "exp": "原文：灵魂伴侣的特征：彼此可以互相共情。灵魂伴侣的相处是以朋友关系相处的。", "id": "Q0387"}, {"type": "judge", "cat": "love", "q": "真正有灵魂伴侣的人，在遇到对方之前通常都谈不好恋爱。", "ans": true, "exp": "原文：真正有灵魂伴侣的人，在他遇到灵魂伴侣前，都绝对谈不好恋爱。甚至对爱情没有向往。", "id": "Q0388"}, {"type": "judge", "cat": "love", "q": "正常夫妻通常无法互相共情，因为只有两个有情的人才能共情。", "ans": true, "exp": "原文：只有2个有情的人才能共情。互相共情是能玩到一起，吃喝玩乐。", "id": "Q0389"}, {"type": "judge", "cat": "love", "q": "粘人的女人一定是责任感驱动。", "ans": true, "exp": "原文：粘人的女人，一定是责任感驱动的。分离焦虑症。", "id": "Q0390"}, {"type": "judge", "cat": "love", "q": "分离焦虑是控制欲。", "ans": false, "exp": "原文：分离焦虑不是控制欲，是独立的需求，对陪伴的需求。", "id": "Q0391"}, {"type": "judge", "cat": "love", "q": "分离焦虑指责任感驱动但自身还没有很好实现这种平衡的状态。", "ans": true, "exp": "原文：分离焦虑指的一定是责任感驱动，但是自身还没有办法很好的实现这种平衡状态的时候就会有分离焦虑。", "id": "Q0392"}, {"type": "judge", "cat": "love", "q": "情感驱动的女人最容易得到男人稳定的陪伴。", "ans": false, "exp": "原文：情感驱动的女人，不一定需要男人的陪伴，但也可能…最难得到男人的陪伴。如果情感驱动的女人，能得到男人稳定的陪伴，那是福报很大的表现。", "id": "Q0393"}, {"type": "single", "cat": "love", "q": "对男人来说，“物质驱动”在亲密关系中的典型特点是什么？", "options": ["讨厌女人在场", "非常需要女人的陪伴和存在", "喜欢独处", "不需要亲密关系"], "ans": 1, "exp": "原文：对于男人来说，物质驱动的特点就是非常需要女人的陪伴/存在，身边需要有女人待着。", "id": "Q0394"}, {"type": "single", "cat": "love", "q": "以偏官（七杀）为夫的女人，婚后相处模式有何特点？", "options": ["柴米油盐的家庭主妇", "结婚了也跟谈恋爱一样", "疏离陌生人", "相夫教子式的妻子"], "ans": 1, "exp": "原文：以偏官为夫的女人，就是这个特点（结了婚也跟谈恋爱一样）。她不会成为家庭妇女。", "id": "Q0395"}, {"type": "judge", "cat": "love", "q": "以正官为夫的女人，更容易成为柴米油盐的妻子。", "ans": true, "exp": "原文：以正官为夫的女人，就更容易成为柴米油盐的妻子。", "id": "Q0396"}, {"type": "judge", "cat": "love", "q": "以偏财为妻的男人，婚后与老婆仍保持恋爱模式。", "ans": true, "exp": "原文：男人只要是偏财为妻，他跟老婆之间就一定会是恋爱关系，有浪漫，而不是相夫教子的模式。", "id": "Q0397"}, {"type": "judge", "cat": "love", "q": "以正财为妻的男人婚后是柴米油盐，老婆相夫教子。", "ans": true, "exp": "原文：以正财为妻的男人，一旦结了婚就是柴米油盐。老婆一定是相夫教子的。", "id": "Q0398"}, {"type": "judge", "cat": "love", "q": "在爱情中，“有情”的人更主动，“有爱”的人不主动。", "ans": true, "exp": "原文：爱情是谁有情谁主动。有爱的人是不主动的。", "id": "Q0399"}, {"type": "judge", "cat": "love", "q": "性能力最强的是有爱的人。", "ans": true, "exp": "原文：但是性能力最强的是有爱的人。有情的人是以性欲望来呈现的，有爱的人不会有很强的欲望。", "id": "Q0400"}, {"type": "single", "cat": "love", "q": "说“我需要的时候希望他在，不需要的时候希望他不在”的女人，属于什么驱动？", "options": ["一定是责任感驱动", "一定是精神驱动", "一定是物质驱动", "一定是情感驱动"], "ans": 1, "exp": "原文：我需要的时候，希望他在；不需要的时候，就希望他不在。会说这句话的女人，一定精神驱动的女人。", "id": "Q0401"}, {"type": "single", "cat": "parent", "q": "在万物类象（十神）中，母亲与父亲分别对应什么？（注意选项区分）", "options": ["母亲为印星、父亲为财星", "母亲为财星、父亲为印星", "母亲为比肩、父亲为官星", "母亲为食伤、父亲为财星"], "ans": 0, "exp": "原文：比如母亲，是印星，生你的五行（金）。父亲，是财星，克你的五行（土）。", "id": "Q0612"}, {"type": "judge", "cat": "parent", "q": "依据十神论，母亲是印星，代表生我的五行。", "ans": true, "exp": "原文：比如母亲，是印星，生你的五行（金）。父亲，是财星，克你的五行（土）。", "id": "Q0613"}, {"type": "judge", "cat": "parent", "q": "妈宝男的母亲做的每一件事都可能间接害了他，但母亲不是故意的。", "ans": true, "exp": "原文：妈宝男的特点就是，母亲做的每一件事都能害死他，但她不是故意的。母亲都是为了他好，但是做的每一件事都可以直接了结他。", "id": "Q0614"}, {"type": "single", "cat": "scene", "q": "一个不能共情的人，别人想跟她共情、套近乎时，她会怎样？", "options": ["更加热情", "变得冷漠", "更加配合", "毫无变化"], "ans": 1, "exp": "原文：一个不能共情的人，别人想要跟她共情的时候，她就会冷漠。本质是嗔心。", "id": "Q0782"}, {"type": "judge", "cat": "scene", "q": "八字越不鲜明越不直观的人，其自我认知越混乱。", "ans": true, "exp": "原文：如果一个人的八字越不鲜明越不直观，看半天看不出是个什么性格人，她的自我认知就越混乱，自己也不知道自己是什么样的人。", "id": "Q0783"}, {"type": "single", "cat": "scene", "q": "从八字性格观察角度，当一个人的天干出现『金木相仗』配置时，这种人的性格通常表现出什么特征？", "options": ["性格直率", "性格纠结，不易一眼看出", "八字越鲜明越混沌", "能量多寡决定性格"], "ans": 1, "exp": "原文：有些人天干金木相仗，性格就很纠结，不容易一眼看明白这个人是什么性格。", "id": "Q0784"}, {"type": "judge", "cat": "scene", "q": "一个八字某五行能量多，并不能直接决定他就是这样的人，关键在于阴阳平衡的结果。", "ans": true, "exp": "原文：八字中一个能量的多与少，并不能决定他是不是这样子的人。还是阴阳平衡的结果决定的。", "id": "Q0785"}, {"type": "judge", "cat": "scene", "q": "物极必反的平衡原理是多数要多到极致、少要少到极致，半死不活最糟糕。", "ans": true, "exp": "原文：物极必反就是多要多到极致，少要少到极致。半死不活最糟糕。", "id": "Q0786"}, {"type": "judge", "cat": "scene", "q": "有气势的人容易大富，也容易大起大落，因为他容易走两个极端。", "ans": true, "exp": "原文：有气势的人很容易大富，但也容易大起大落，因为他会在2个极端。", "id": "Q0787"}, {"type": "judge", "cat": "scene", "q": "不是情欲驱动的人，就一定要管好下半身。", "ans": true, "exp": "原文：不是情欲驱动的人，就一定要管好自己的下半身。", "id": "Q0788"}, {"type": "judge", "cat": "scene", "q": "没有精神驱动的人就没有道德感，没有责任感驱动的人就没有责任感。", "ans": true, "exp": "原文：没有精神驱动的人就没有道德感。没有责任感驱动的人就不会有责任感。", "id": "Q0789"}, {"type": "judge", "cat": "scene", "q": "责任感驱动的人找情感驱动的另一半，格局越高越纯真越简单。", "ans": true, "exp": "原文：责任感驱动的男人一定是找情感驱动的女人，而且格局越高越纯真越简单。", "id": "Q0790"}, {"type": "judge", "cat": "scene", "q": "真正有情的女人一定被很多人追求，而且她看都不看他们一眼。", "ans": true, "exp": "原文：真正有情的女人一定是超级多人追求的，而且你看都不看他们一眼的。你老公一定理解不了的。", "id": "Q0791"}, {"type": "single", "cat": "money", "q": "在命理概念中，关于'正财'与'偏财'的正确理解是下列哪一项？", "options": ["正门之财与偏门之财", "正财靠自己赚钱，偏财靠别人替你赚钱", "正财是正当收入，偏财是灰色收入", "两者没有区别"], "ans": 1, "exp": "原文：正财是靠自己赚钱，偏财是靠别人替你赚钱。正财偏财不是正门与偏门的关系。", "id": "Q0942"}, {"type": "judge", "cat": "money", "q": "判断题：“正财、偏财”的区别在于“正门之财”与“偏门之财”。此说法是否正确？", "ans": false, "exp": "原文：正财偏财不是正门与偏门的关系。", "id": "Q0943"}, {"type": "single", "cat": "money", "q": "在财星的十神定位中，同性相克与异性相克分别对应正财、偏财中的哪一个？", "options": ["同性相克为偏财，异性相克为正财", "同性相克为正财，异性相克为偏财", "同性相克为正官，异性相克为七杀", "两者都为正财"], "ans": 1, "exp": "原文：同性相克为正财，异性相克为偏财。", "id": "Q0944"}, {"type": "judge", "cat": "money", "q": "真正大富的人通常是偏财好。", "ans": true, "exp": "原文：真正大富的人，富的量级大的人都是偏财好。", "id": "Q0945"}, {"type": "judge", "cat": "money", "q": "偏财好的人大方，正财气数不好的人吝啬。", "ans": true, "exp": "原文：偏财就是大方，豪爽。正财就是不大方，气数不好就是吝啬。", "id": "Q0946"}, {"type": "single", "cat": "money", "q": "在判断一个人的财富量级时，可以通过哪一层次的维度来衡量？", "options": ["地支的多寡与神煞", "整个太极的阴阳平衡与十天干的气数", "天干的旺衰与十神", "生肖与宫位"], "ans": 1, "exp": "原文：判断他财富量级的方式有几个层次：①整个太极的阴阳平衡 ②十天干的气数。", "id": "Q0947"}, {"type": "judge", "cat": "money", "q": "财星的气数直接决定了一个人财富的量级。", "ans": true, "exp": "原文：所以财星的气数直接决定了一个人财富的量级。", "id": "Q0948"}, {"type": "judge", "cat": "money", "q": "男人以偏财为富，女人以正财为富。", "ans": true, "exp": "原文：男人以偏财为富，女人以正财为富。", "id": "Q0949"}, {"type": "single", "cat": "money", "q": "关于“偏财”，下列哪一项说法符合这套理论？", "options": ["偏财就是情人的意思", "偏财是众人之财，正财亲力亲为之财", "偏财越多女人缘越差", "偏财是辛苦钱"], "ans": 1, "exp": "原文：偏财：众人之财。正财：亲力亲为之财。努力程度成正比。有一种误解以为偏财就是情人。", "id": "Q0950"}, {"type": "judge", "cat": "money", "q": "正财的天花板是百亿级别。", "ans": true, "exp": "原文：正财的天花板是百亿级别，C罗之类的全球体育明星，再高没有了，这是正财天花板。", "id": "Q0951"}, {"type": "judge", "cat": "money", "q": "财克印在生活中表现为对物质巨大贪着，不舍得为健康和智慧买单，容易造恶业。", "ans": true, "exp": "原文：财克印生活中的表现就是对物质有巨大贪着，不舍得为自己的健康和智慧买单的人，生活中会造非常多恶业的。", "id": "Q0952"}, {"type": "judge", "cat": "money", "q": "自我价值感的驱动也可以让人超级有钱；赚钱与钱重不重是不同两个维度。", "ans": true, "exp": "原文：一个人可能很有钱，但是物质驱动不是他的核心驱动力。自我价值感的驱动力也可以让一个人超级有钱。赚钱和钱重不重要是不同的2个维度。", "id": "Q0953"}, {"type": "judge", "cat": "money", "q": "财星的气数有一点点优势，在财富量级上就会高一大个维度，这是量级程度的区别而非旺衰多少。", "ans": true, "exp": "原文：在财星的气数上好一点点，在财富量级上就高一大个维度。是量级/程度的区别，不是旺衰的区别，不是五行能量多少的区别。", "id": "Q0954"}, {"type": "judge", "cat": "money", "q": "只有物质驱动的人能把投资这件事做得非常好。", "ans": true, "exp": "原文：只有物质驱动的人能把投资这件事做的非常好。如果没有动金生水这一点的话，没办法做好投资。", "id": "Q0955"}, {"type": "single", "cat": "drive", "q": "在核心驱动力的判定中，关于'0.5驱动力'，下列说法正确的是？", "options": ["就是刚好50%属于该驱动力", "本质上代表不是这种驱动力的人，总体不利于阴阳平衡", "核心驱动力一定是0.5驱动力", "0.5驱动力越多越好"], "ans": 1, "exp": "原文：0.5驱动力本质上代表他不是这种驱动力的人。0.5的驱动力是不利于她整体的阴阳平衡的…只是在某种情况下利于，总体来说是不利的。", "id": "Q0146"}, {"type": "judge", "cat": "drive", "q": "0.5驱动力本质上代表这个人就是属于这种驱动力的人。", "ans": false, "exp": "原文：0.5驱动力本质上代表他不是这种驱动力的人。", "id": "Q0147"}, {"type": "single", "cat": "drive", "q": "在《八字五行驱动力》中，判断一个人核心驱动力的根本依据是什么？", "options": ["八字中哪个五行最多", "动什么五行能量能使八字形成阴阳平衡状态", "大运中最旺的五行", "出生季节的五行"], "ans": 1, "exp": "原文：动什么五行能量能使你的八字形成阴阳平衡的状态，那这就是你的核心驱动力。", "id": "Q0148"}, {"type": "short", "cat": "drive", "q": "为什么说了解核心驱动力就是了解小我？核心驱动力与“我”是什么关系？", "ans": "了解核心驱动力就相当于了解了自己的小我，可以准确描述“我”；未充分觉醒前只能活在小我中，小我的执着、情执、执着于什么东西由驱动力组合决定，小我就是日柱天干。", "exp": "原文：当我们了解了自己的核心驱动力，就意味着了解了自己的小我…小我就是日柱天干。", "id": "Q0149"}, {"type": "judge", "cat": "drive", "q": "有的情况下，成就一个人的恰恰可能是他的过度驱动力，而不是核心驱动力。", "ans": true, "exp": "原文：有些人成就他的驱动力是过度驱动力，而不是核心驱动力。", "id": "Q0150"}, {"type": "judge", "cat": "drive", "q": "物质驱动的人只要能把钱花在自己的核心驱动力上，越花钱就越有钱。", "ans": true, "exp": "原文：物质驱动的人只要能把钱花出去，花在自己的核心驱动力上，越花钱就越有钱。", "id": "Q0151"}, {"type": "single", "cat": "drive", "q": "在五种驱动力实现阴阳平衡的方式中，物质驱动用的是哪种五行方式实现阴阳平衡？", "options": ["我生", "生我", "我克", "克我"], "ans": 2, "exp": "原文：物质驱动，用“我克”实现阴阳平衡。", "id": "Q0152"}, {"type": "judge", "cat": "drive", "q": "真正做事业的人（责任感驱动）没有办法让自己开心，也没有让自己开心的需求。", "ans": true, "exp": "原文：真正做事业的人，是没有办法让自己开心的。指的是责任感驱动的人。对于责任感驱动的人来说，他也没有让自己开心的需求。", "id": "Q0153"}, {"type": "single", "cat": "drive", "q": "当八卦层面的平衡与整体太极平衡不一致时，生命的主要出路应考量什么？", "options": ["核心驱动力", "太极的平衡", "偏财", "大运"], "ans": 1, "exp": "原文：而平衡不一致的人，就要以太极的平衡为生命主要出路去考量。", "id": "Q0154"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，五种驱动力本质上是什么？", "options": ["行为习惯", "喜忌关系，即五行能量的平衡方式", "出生运气", "命格高下"], "ans": 1, "exp": "原文：五种驱动力本质上是喜忌关系，五行能量的平衡方式，决定了你的性情、喜好、发心、平衡的倾向。", "id": "Q0155"}, {"type": "single", "cat": "drive", "q": "关于改善气不顺的调养，'正确喝茶'的方法是什么？", "options": ["喝凉的快", "逆腹式呼吸（吸气收腹），喝茶吞咽与吐气一起下去、肚子放松，且必须喝热的冒烟的茶", "大口喝纯水", "睡前大量喝生茶"], "ans": 1, "exp": "原文：逆腹式呼吸（吸气时收腹），吸完气呼之前，喝茶，吞咽和吐气一起下去，肚子放松…喝茶一定要喝热茶，无论任何时候不要喝凉，一定要冒烟的。", "id": "Q0156"}, {"type": "judge", "cat": "drive", "q": "喝冰水一定不开运，因为脾胃一定虚湿。", "ans": true, "exp": "原文：喝冰水一定不开运，因为脾胃一定虚湿的，身体一定不太好。", "id": "Q0157"}, {"type": "judge", "cat": "drive", "q": "本命年好不好意味着你需不需要这种八字的能量，每个人情况不同，不能一概而论。", "ans": true, "exp": "原文：本命年好不好意味着你需不需要这个八字的能量…每个人的情况不同，不能一概而论。", "id": "Q0158"}, {"type": "single", "cat": "love", "q": "关于女人的“拿捏男人”与“控制男人”，正确的理解是？", "options": ["两者是一回事", "控制是要求男人听话，拿捏是吸引男人心甘情愿不离开自己", "拿捏是要男人听话，控制是吸引", "控制欲越强关系越好"], "ans": 1, "exp": "原文：控制：要求男人听话。拿捏：吸引男人让男人心甘情愿不离开自己。", "id": "Q0402"}, {"type": "judge", "cat": "love", "q": "女人对男人行为的控制欲，本质来自过度精神驱动，而非情感驱动。", "ans": true, "exp": "原文：控制男人的行为…本质上是精神障碍。是过度的精神驱动…控制欲是来自过度的精神驱动，而不是情感驱动。", "id": "Q0403"}, {"type": "judge", "cat": "love", "q": "控制欲是100%的负能量。", "ans": true, "exp": "原文：所以控制欲是100%的负能量。", "id": "Q0404"}, {"type": "single", "cat": "love", "q": "女人最能“无形之中”约束男人的方式是什么？", "options": ["控制他的行为", "真诚表达内心真实的感受与欢喜", "索取物质", "一味指责"], "ans": 1, "exp": "原文：能无形之中约束男人的东西，是让男人自发的产生责任感，只能通过女人表达真实的感受和情感来实现。", "id": "Q0405"}, {"type": "single", "cat": "love", "q": "在分析不同驱动力女生的感情状况时，哪类女生因不拒绝男人的殷勤而拥有更多'出轨的机会'？", "options": ["情感驱动女生最容易出轨", "精神驱动的女生不拒绝男人的殷勤，有更多出轨机会", "所有女生出轨机会相同", "控制欲强的女生不出轨"], "ans": 1, "exp": "原文：精神驱动的女生不拒绝男人的殷勤，不会觉得恶心，所以只能说有更多的机会可以出轨。", "id": "Q0406"}, {"type": "judge", "cat": "love", "q": "情越重的女生越难出轨，情感驱动的女生本身就不容易出轨。", "ans": true, "exp": "原文：情越重的女生，越难出轨。情感驱动的女生本身就不容易出轨的。", "id": "Q0407"}, {"type": "single", "cat": "love", "q": "对追求女生而言，“死缠烂打+糖衣炮弹（砸钱）”约对多少比例的女生生效？", "options": ["约10%", "约30%", "约50%", "70%以上"], "ans": 3, "exp": "原文：死缠烂打+糖衣炮弹（砸钱）70%以上的女生有效。", "id": "Q0408"}, {"type": "single", "cat": "love", "q": "死缠烂打、疯狂热情、疯狂砸钱等追求手段，只有对哪种女生无效？", "options": ["情感驱动女生", "精神驱动女生", "非精神驱动+非自我价值感驱动女生", "自我价值感驱动女生"], "ans": 2, "exp": "原文：所以无效的可能性只存在于非精神驱动+非自我价值感驱动的女生才有可能。", "id": "Q0409"}, {"type": "judge", "cat": "love", "q": "性行为的发起，是谁有情谁主动。", "ans": true, "exp": "原文：性行为的发生，是谁有情谁主动，谁有情谁发起。", "id": "Q0410"}, {"type": "single", "cat": "love", "q": "真正对男人的情有生理性反感、抗拒、压迫感的女生通常是？", "options": ["过度情感驱动", "精神驱动", "非精神驱动（过度的精神驱动）", "物质驱动"], "ans": 2, "exp": "原文：真正对男人的情有抗拒的定位是非精神驱动，即过度的精神驱动…如果不是精神驱动的女生，对男人的情欲/热情/殷勤都有生理性的反感。", "id": "Q0411"}, {"type": "single", "cat": "love", "q": "真正“厌男”最主要的原因是什么？", "options": ["不需要男人的陪伴", "对男人的情有排斥和抗拒", "男人不出钱", "性格内向"], "ans": 1, "exp": "原文：真正的厌男来自于，既不需要男人的陪伴，也不需要男人的情，特别是男人的情。对男人的情有排斥和抗拒是厌男症最主要的原因。", "id": "Q0412"}, {"type": "single", "cat": "love", "q": "所谓“油腻男”对应的驱动力特征是什么？", "options": ["善根深厚的责任感驱动", "善根贫瘠的情感驱动", "精神驱动", "物质驱动"], "ans": 1, "exp": "原文：油腻男都是情感驱动。油腻感=善根贫瘠的情感驱动。", "id": "Q0413"}, {"type": "judge", "cat": "love", "q": "情感驱动的女生，一旦讲话不再毒、变得更柔和，就是要开运了。", "ans": true, "exp": "原文：情感驱动的女生，一旦嘴不毒了，就是要开运了。讲话更加柔和了，就是要开运了。", "id": "Q0414"}, {"type": "single", "cat": "love", "q": "关于积极精神驱动女生“拿捏男人”的能力，正确的是？", "options": ["既能拿捏男人也能控制男人", "有天赋能拿捏男人，但控制不了男人", "既不能拿捏也不能控制", "靠要求男人听话来维系"], "ans": 1, "exp": "原文：积极精神驱动的女生的天赋是能够拿捏男人，但是控制不了男人。", "id": "Q0415"}, {"type": "judge", "cat": "love", "q": "能和称不上喜欢（不喜欢）的男生在一起的女生，100%是精神驱动的。", "ans": true, "exp": "原文：能和不喜欢的男生在一起的女生，100%是精神驱动的。", "id": "Q0416"}, {"type": "short", "cat": "love", "q": "想要得到男人的金钱与物质，最根本的方式是什么？", "ans": "得到他的情。因为男人的金钱和物质是为情服务的，得到情就等同于得到他所有的物质；向没有情的人索取物质无效且会伤害自己。", "exp": "原文：只有得到他的情才能得到他的物质。因为男人的金钱和物质是为情服务的。得到情=得到所有的物质。", "id": "Q0417"}, {"type": "single", "cat": "love", "q": "需不需要伴侣、需要什么样的伴侣是由什么决定的？", "options": ["善根", "缘分", "驱动力", "出生"], "ans": 2, "exp": "原文：需不需要伴侣，需要什么样的伴侣，是驱动力决定的。", "id": "Q0418"}, {"type": "single", "cat": "love", "q": "最有责任感的男人，在亲密关系中一定受控于谁？", "options": ["权威", "母亲", "女人的情", "金钱"], "ans": 2, "exp": "原文：最有责任感的男人一定是受控于女人的，但是只会被女人的情控制。", "id": "Q0419"}, {"type": "judge", "cat": "love", "q": "对大多数人来说，拥有稳定的伴侣就是开运的标志，女人有孩子时往往就是事业要发展的时候。", "ans": true, "exp": "原文：对大多数人来说，拥有稳定的伴侣，就是开运的标志。当家庭/女人开始有孩子的时候，就是事业要发展的时候。", "id": "Q0420"}, {"type": "single", "cat": "love", "q": "男人的“爱”与“情”在可被动摇、可被“拿捏”的程度上有差异，并与情之轻重有关。关于“拿捏男人的情”，正确的是下列哪一项？", "options": ["男人的爱与情都可以随意拿捏", "男人的爱拿捏不了，但男人的情想怎么拿捏就怎么拿捏", "情越淡的男人越好拿捏", "男人无法被拿捏"], "ans": 1, "exp": "原文：男人的爱拿捏不了，男人的情对女人来说只要愿意，她想怎么拿捏就怎么拿捏。情越重的男人越容易被拿捏。", "id": "Q0421"}, {"type": "judge", "cat": "parent", "q": "八字决定聪明才智的程度，但不能决定读书成绩，读书成绩主要由运决定。", "ans": true, "exp": "原文：八字可以决定聪明才智的程度，但是不能决定读书成绩。主要是由运决定的。", "id": "Q0615"}, {"type": "judge", "cat": "parent", "q": "孩子的学习成绩和智商有因果关系。", "ans": false, "exp": "原文：孩子的学习成绩和智商没有因果关系。", "id": "Q0616"}, {"type": "single", "cat": "parent", "q": "平时读书都不错、一考试总垫底的孩子，通常是？", "options": ["过度精神驱动", "积极的弱精神驱动", "情感驱动", "责任感驱动"], "ans": 1, "exp": "原文：平时读书都不错，一考试总垫底的人，积极的弱精神驱动。精神力越弱考试越差。", "id": "Q0617"}, {"type": "single", "cat": "parent", "q": "孩子考试总是超常发挥，通常说明这个孩子哪方面的状态较好？", "options": ["智商极高", "财气很好", "情感丰富", "压力小"], "ans": 1, "exp": "原文：考试好不好和财气有关…财气越好，考试越容易超常发挥。…如果他总是超常发挥，就说明他的财气很好。", "id": "Q0618"}, {"type": "single", "cat": "parent", "q": "高度精神驱动的孩子在写作方面的通常表现是什么？", "options": ["擅长写记叙文", "写不了作文，只能写议论文，写不了记叙文", "作文总是满分", "厌恶作文"], "ans": 1, "exp": "原文：高度精神驱动的孩子写不了作文，只能写议论文，写不了记叙文。", "id": "Q0619"}, {"type": "judge", "cat": "parent", "q": "情感驱动的男人最喜欢孩子，但越多情的男人和自己孩子的关系大多处不好。", "ans": true, "exp": "原文：情感驱动的男人最喜欢孩子，但是越多情的男人和自己孩子关系大多是处不好的。", "id": "Q0620"}, {"type": "short", "cat": "parent", "q": "从驱动力角度，精神驱动+自我价值感驱动的孩子最需要父母（尤其母亲）给予什么？", "ans": "最需要母亲大量的陪伴以及“被需要”的感受，他不一定需要母亲的爱或情绪价值，但必须能时刻感受到自己被需要；陪伴越多，专注力越多。", "exp": "原文：他需要你需要他。他感受不到被需要的感觉，这对他很重要。…你给他的陪伴越多，专注力就越多。", "id": "Q0621"}, {"type": "single", "cat": "scene", "q": "从婚恋行为观察看，一个女人身上对配偶（丈夫）最有『克』伤力、最容易让家庭不稳定的特征是下列哪一项？", "options": ["过度自我价值感驱动", "情感驱动", "太温柔", "太独立"], "ans": 0, "exp": "原文：一个女人最克夫的特征就是过度自我价值感驱动。", "id": "Q0792"}, {"type": "judge", "cat": "scene", "q": "当一个人在问对方爱不爱自己的时候，本质上是自己的自我价值感缺失。", "ans": true, "exp": "原文：当你在问一个人爱不爱你的时候，它的本质是你的自我价值感的缺失。", "id": "Q0793"}, {"type": "single", "cat": "scene", "q": "在驱动力理论中，属于“过度情感驱动”的人，其心理状态上通常伴随下列哪种特征？", "options": ["不配得感", "超强的配得感", "无欲无求", "莫名恐惧"], "ans": 1, "exp": "原文：过度的情感驱动通常有超强的配得感。索取心非常强。", "id": "Q0794"}, {"type": "single", "cat": "scene", "q": "从财富（财气）的角度看，一个人处处『好争』（凡事都要争个对错输赢）的行为，与财富之间的关系，正确的是哪一项？", "options": ["好争能长养财气", "好争是最耗财的，不固执的人才能长养财气", "好争与财富无关", "固执的人容易发财"], "ans": 1, "exp": "原文：好争是最耗财的。不固执的人才能长养财气。", "id": "Q0795"}, {"type": "single", "cat": "scene", "q": "“幽默”和“有趣”分别对应哪种驱动力标志？", "options": ["幽默=情感驱动，有趣=精神驱动", "幽默=精神驱动，有趣=情感驱动", "两者都是情感驱动", "两者都是精神驱动"], "ans": 1, "exp": "原文：幽默就是精神驱动的标志。有趣是情感驱动的标志。", "id": "Q0796"}, {"type": "judge", "cat": "scene", "q": "责任感驱动的男人最会骗人，想骗人一定骗得了。", "ans": true, "exp": "原文：责任感驱动的男人最会骗人。想骗人一定骗得了。", "id": "Q0797"}, {"type": "single", "cat": "scene", "q": "在判断一位女生『情重不重（情感是否充沛）』时，一个典型的外在标志是下列哪一项？", "options": ["是否情绪化（莫名生气又莫名消气）", "是否有钱", "是否漂亮", "是否有事业"], "ans": 0, "exp": "原文：情绪化本身就是一个女生情重不重的标志。", "id": "Q0798"}, {"type": "judge", "cat": "scene", "q": "自身善根卓越、阴阳平衡好的人，走什么运都不怕。", "ans": true, "exp": "原文：自身善根卓越的，阴阳平衡好的人，走什么运都不怕。", "id": "Q0799"}, {"type": "single", "cat": "scene", "q": "会给自己施加巨大压力感、负担感的人，对应的命理特征是？", "options": ["印星太重", "受克太重（木克土太重）", "财星太旺", "官星太多"], "ans": 1, "exp": "原文：会给自己非常大的压力感的人，就是受克受的太重了，在她的八字中就是木克土克的太重了。", "id": "Q0800"}, {"type": "single", "cat": "money", "q": "财富焦虑最大的人群是哪一类人？", "options": ["情感驱动且赚到钱的人", "自我价值感驱动但赚不到钱的人", "物质驱动的人", "责任感驱动的人"], "ans": 1, "exp": "原文：财富焦虑最大的人，是自我价值感驱动但是又赚不到钱的人。", "id": "Q0956"}, {"type": "judge", "cat": "money", "q": "情感驱动的人是最没有财富焦虑的，开心不起来才是他最压抑的东西。", "ans": true, "exp": "原文：情感驱动的人是最没有财富焦虑的。开心是最重要的，开心不起来才是他最压抑的东西。", "id": "Q0957"}, {"type": "single", "cat": "money", "q": "一个人“会不会花钱”（砸钱的风格）取决于什么？", "options": ["他爱不爱你", "偏财的气数、层次和状态", "是不是情感驱动", "责任感强弱"], "ans": 1, "exp": "原文：会不会花钱直接取决于他的偏财层次。…砸钱的风格（会不会砸钱）跟偏财的气数、状态有关。", "id": "Q0958"}, {"type": "single", "cat": "money", "q": "关于顶级富豪的财富来源，下列哪一项符合这套理论？", "options": ["顶级富豪都靠正财", "顶级的富豪都是靠偏财的，偏财没有上限", "偏财没有正财钱多", "正财无上限"], "ans": 1, "exp": "原文：但是顶级的富豪，都是靠偏财的。…偏财是没有上限的。", "id": "Q0959"}, {"type": "judge", "cat": "money", "q": "破财最快的方式是赌博和被骗。", "ans": true, "exp": "原文：破财最快的方式，赌博和被骗。", "id": "Q0960"}, {"type": "judge", "cat": "money", "q": "命好不如运好，八字极其不平衡的人只要走一点点好运也可能发大财。", "ans": true, "exp": "原文：所以命好不如运好是有道理的，八字不好极其不平衡的人，只要走一点点好运，财运好的那么几年，赚个几百上千万甚至几个亿的人大有人在。", "id": "Q0961"}, {"type": "judge", "cat": "money", "q": "大部分赚钱都不是靠努力得来的，靠努力赚钱必然气虚。", "ans": true, "exp": "原文：靠努力赚钱必然气虚。大部分赚钱都不是靠努力得来的。", "id": "Q0962"}, {"type": "judge", "cat": "money", "q": "事业是财富的杠杆，通过事业赚到的钱和靠身体（亲力亲为）赚到的钱明显不一样。", "ans": true, "exp": "原文：事业就是财富的杠杆。通过事业赚到的钱，和通过身体赚到的钱，明显不一样。", "id": "Q0963"}, {"type": "single", "cat": "scene", "q": "说话很毒、嘴很毒的人，在笔记看来是因为什么？", "options": ["情商高", "阳气不足", "阴气不足", "责任感太强"], "ans": 1, "exp": "原文：为什么他嘴很毒，因为阳气不足", "id": "Q0801"}, {"type": "single", "cat": "scene", "q": "一个人不停讲话、特别会讲话，是何种驱动力的标志？", "options": ["责任感驱动", "精神驱动", "情感驱动(伤官为用)", "自我价值感驱动"], "ans": 2, "exp": "原文：又能够不停讲话，很会讲话，这就是他伤官为用，情感驱动的标志", "id": "Q0802"}, {"type": "single", "cat": "scene", "q": "从能力与可靠度的角度评价『情感驱动』的人去创业当老板这件事，说法正确的是哪一项？", "options": ["很适合当老板", "只靠嘴皮子会讲，本质上是当不了老板的", "创业最稳健", "没做好事会愧疚"], "ans": 1, "exp": "原文：情感驱动的人创业，你怎么敢投资他呢。他只要当时自己爽就行了，只靠嘴皮子会讲，本质上是当不了老板的", "id": "Q0803"}, {"type": "judge", "cat": "scene", "q": "责任感驱动的人没把事情做好会愧疚、觉得自己对不起别人；而情感驱动的人没把事情做好不会有愧疚感。", "ans": true, "exp": "原文：如果是责任感驱动的人，有些事做了是会愧疚的…但时候情感驱动的人没把事情做好，他是不会有愧疚感的", "id": "Q0804"}, {"type": "single", "cat": "scene", "q": "特别会自嘲、有幽默感的男人，可反推他是什么驱动的？", "options": ["精神驱动", "责任感驱动", "物质驱动", "自我价值感驱动"], "ans": 0, "exp": "原文：他是特别会自嘲的也有幽默感的男人，所以他一定是精神驱动的", "id": "Q0805"}, {"type": "single", "cat": "scene", "q": "一个男人身边的合伙人没有一个留得下来，最可能被判断为", "options": ["自我价值感驱动", "物质驱动", "责任感驱动+精神驱动", "情感驱动"], "ans": 2, "exp": "原文：合伙人没有一个留的下来就能直接看出他是责任感驱动的人，还有精神驱动的。他一定不是自我价值感驱动的", "id": "Q0806"}, {"type": "judge", "cat": "scene", "q": "任何人的性格存在都是合理的，甚至不需要看八字就能判断他是怎样一个人。", "ans": true, "exp": "原文：任何人的性格存在都是合理的，甚至不需要去了解他的八字，就知道他是怎样一个人", "id": "Q0807"}, {"type": "single", "cat": "scene", "q": "关于'是否自主创作'与驱动力的关系，正确的是", "options": ["情感驱动的人倾向于抒发情感、进行创作", "精神驱动的人会大量自主创作", "会不会创作与驱动力无关", "非情感驱动的人更爱创作"], "ans": 0, "exp": "原文：董宇辉不创作，毛泽东是创作的。所以董宇辉不是情感驱动的男人…他只是背的好，不是在抒发他自己的情感", "id": "Q0808"}, {"type": "judge", "cat": "scene", "q": "背诗背得好、能拼装应用并不等于情感抒发，本质上是精神驱动（理性答题）而非情感驱动。", "ans": true, "exp": "原文：他背书的过程其实是在做语文应用，而不是情感抒发…本质上是答题高手。所以被称为诗词歌赋的搬运工", "id": "Q0809"}, {"type": "single", "cat": "scene", "q": "从八字用神角度看，用食伤（伤官）的人是命局中以食伤为喜用的人，这类人普遍表现出的性格特点是下列哪一项？", "options": ["有傲骨、不服输、有豪情壮志、感知力强", "冷静平淡、无激情", "胆小怕事", "圆滑世故"], "ans": 0, "exp": "原文：用食伤的人是有傲骨的，不服输，还有豪情壮志。感知力强", "id": "Q0810"}, {"type": "single", "cat": "scene", "q": "从八字性格观察角度，命局中没有食伤（缺乏食神伤官能量）的人，其性格一般表现为下列哪一项？", "options": ["激情澎湃", "淡淡的、冷静、平静，不会有激情澎湃的感受", "傲骨豪情", "元气满满"], "ans": 1, "exp": "原文：没有食伤的人是淡淡的、冷静的、平静的，不会有激情澎湃的蓬勃的感受", "id": "Q0811"}, {"type": "judge", "cat": "scene", "q": "通过一个人是否爱自嘲、有没有幽默感，可反推其是否为精神驱动。", "ans": true, "exp": "原文：他是特别会自嘲的也有幽默感的男人，所以他一定是精神驱动的；一点(驱动力)判断可看他的幽默", "id": "Q0812"}, {"type": "judge", "cat": "love", "q": "责任感驱动的女生（无情无爱）会主动提出婚前不能有性行为，这是她的天性观念。", "ans": true, "exp": "原文：责任感驱动的女生会提出婚前不能性行为，无情无爱的女生，天性上有这样的观念", "id": "Q0422"}, {"type": "single", "cat": "love", "q": "在因果与业力的语境下，'还情债'的具体方式与某种痛苦体验相联系。那么'还情债'的方式是什么？", "options": ["被无情的抛弃，用痛苦偿还", "靠强求对方留下", "与痛苦无关", "不断累积怨念"], "ans": 0, "exp": "原文：还情债的方式就是被无情的抛弃。用痛苦去偿还", "id": "Q0423"}, {"type": "judge", "cat": "love", "q": "在开运前谈恋爱总是被抛弃，这其实是好事，是在消业。", "ans": true, "exp": "原文：在开运前，谈恋爱都是被抛弃的份，这个绝对是好事。消业，消巨大的业", "id": "Q0424"}, {"type": "single", "cat": "love", "q": "如果在'还情债'过程中没有增长智慧、反而增加了怨念，会怎样？", "options": ["顺利完成消业", "只是增加了更多的业力", "表示情债已清", "变成大福报"], "ans": 1, "exp": "原文：如果没有增长智慧，反而增加了怨念，那也不是还债消业，只是增加了更多的业力", "id": "Q0425"}, {"type": "judge", "cat": "love", "q": "跟不喜欢的人在一起，对方自己离开了，这也算是还情债。", "ans": true, "exp": "原文：如果跟不喜欢的人在一起，对方自己离开了，这也是还情债", "id": "Q0426"}, {"type": "single", "cat": "love", "q": "'邪淫心'的本质有一个反直觉的结论：它并非源自情欲过多。那么，邪淫心的本质是什么？", "options": ["情太多", "因为没有情", "阳气过旺", "责任感过强"], "ans": 1, "exp": "原文：邪淫心的本质是因为没有情", "id": "Q0427"}, {"type": "single", "cat": "love", "q": "关于“欲望/邪淫心”的产生链条，“我慢心”是其源头并链接到“动情”。下列哪一项说法是正确的？", "options": ["欲望来自物质匮乏", "我慢心膨胀必然动情，动情必然产生邪淫心", "邪淫心来自责任感", "欲望不受我慢心影响"], "ans": 1, "exp": "原文：欲望就是由我慢心来的，我慢心膨胀的时候，必然动情，动情必然有邪淫心产生，会开始玩弄情感", "id": "Q0428"}, {"type": "judge", "cat": "love", "q": "单一情感驱动的女生，会因为情感缺失而对着每天在网上听到的声音、形象动情，寻找情感寄托。", "ans": true, "exp": "原文：所以会对着一个每天在网上听到的声音、形象，动情…只是需要寻找一个感情的寄托", "id": "Q0429"}, {"type": "single", "cat": "love", "q": "面对把情感寄托在幻想对象上的女生，最妥善的做法是", "options": ["积极回应她的情感", "在她不伤害你和他人的前提下，不拉黑也不回应，给她一点安宁", "与她建立亲密关系", "去指责批评她"], "ans": 1, "exp": "原文：在她没有伤害你或者别人的情况下，给她这一点点的安宁安稳（不拉黑她，但也不回复信息）", "id": "Q0430"}, {"type": "judge", "cat": "love", "q": "幻想型女生若长时间得不到回应而转化为攻击性、影响到自己，就只能拉黑处理。", "ans": true, "exp": "原文：但也有会转化成过度情感驱动的，长时间不回应她之后就开始产生攻击性了，影响到了自己，那就没办法，只能拉黑了", "id": "Q0431"}, {"type": "single", "cat": "love", "q": "“臆想症”与“情感寄托”的区别在于什么？", "options": ["臆想症是自己跟自己对话，是过度精神问题，而非情感寄托", "臆想症就是情感寄托", "情感寄托更严重", "两者没有区别"], "ans": 0, "exp": "原文：这还不是臆想症，臆想症是自己跟自己对话，是过度的精神问题。臆想症就不是情感寄托了", "id": "Q0432"}, {"type": "single", "cat": "love", "q": "对物质驱动+责任感驱动的女人，婚恋方面的建议是", "options": ["讨好男人", "把重心放在工作上、不要讨好男人，找到目标感即可", "故意装作有情有爱", "完全依附他人"], "ans": 1, "exp": "原文：物质驱动和责任感驱动的女人，把重心放在工作上…生命中就不会缺男人的。但是不要讨好男人", "id": "Q0433"}, {"type": "judge", "cat": "parent", "q": "善根在小孩子很小的时候就会显化出来，'3岁看一辈子'是真的。", "ans": true, "exp": "原文：善根这个东西在小孩子很小的时候就会显化出来。3岁看一辈子是真的", "id": "Q0622"}, {"type": "single", "cat": "parent", "q": "面对孩子时，正确的亲子理念（做法）是什么？", "options": ["强行改造孩子天性", "尊重孩子天性、领导孩子善根，同时增长自己的善根", "对孩子实施控制", "完全忽略孩子"], "ans": 1, "exp": "原文：我们要尊重孩子的天性，领导孩子的善根，同时也要增长你自己的善根", "id": "Q0623"}, {"type": "judge", "cat": "parent", "q": "对孩子本无依恋的母亲，若基于责任感强行陪伴会压抑情感；把他当作'能接纳自己的独立的人'来相处，关系反而更好。", "ans": true, "exp": "原文：你在用责任感在驱动你照顾孩子的时候，就会开始产生情感上的压抑了…你把他当独立的人去看待的时候，反而关系会更好", "id": "Q0624"}, {"type": "single", "cat": "parent", "q": "阳气不足的情感驱动女性，其控制欲的特点是什么？", "options": ["没有控制欲", "可怕的控制欲，偏向自私的控制欲", "无为而治、完全放开", "只针对外人"], "ans": 1, "exp": "原文：阳气不足的情感驱动的女生，会有可怕的控制欲，偏向自私的控制欲", "id": "Q0625"}, {"type": "single", "cat": "money", "q": "对物质驱动的人来说，炒股这类行为相当于什么？", "options": ["赌博失控", "发挥价值", "纯粹的恶习", "戒贪手段"], "ans": 1, "exp": "原文：物质驱动的人炒股是发挥价值", "id": "Q0964"}, {"type": "single", "cat": "money", "q": "对'不是物质驱动的人'而言，关于炒股给出的建议是什么？", "options": ["大胆加仓", "戒掉炒股，能戒贪戒赌", "只有炒股能发财", "无所谓可随意炒"], "ans": 1, "exp": "原文：其它戒炒股能戒贪戒赌", "id": "Q0965"}, {"type": "judge", "cat": "money", "q": "物质驱动（以及物质+情感驱动）的人炒股，即使一直跌，只要有钱就加仓最后都能赚钱；而非物质驱动的人做不到这一点。", "ans": true, "exp": "原文：物质驱动情感驱动炒股，就算股票一直跌，只要有钱就加仓。最后都能赚钱。但不是物质驱动的人，做不到这一点", "id": "Q0966"}, {"type": "judge", "cat": "money", "q": "不要试图去赚赚不到的钱。", "ans": true, "exp": "原文：不赚赚不到的钱", "id": "Q0967"}, {"type": "single", "cat": "money", "q": "一个人一旦对金钱失去敬畏，会发生什么？", "options": ["获得善根", "功课就来了，我慢心就起来了，只能靠自己救自己", "财运大增", "毫无影响"], "ans": 1, "exp": "原文：一旦对金钱失去敬畏，那功课就来了，我慢心就起来了，这时候就只能靠自己救自己了", "id": "Q0968"}, {"type": "single", "cat": "money", "q": "关于“对金钱的贪着”，下列哪一项符合这套理论？", "options": ["物质驱动的人最贪钱", "不是物质驱动的人最容易对金钱产生贪着", "没有人贪钱", "不同驱动力贪钱程度相同"], "ans": 1, "exp": "原文：不是物质驱动的人就很容易对金钱产生贪着。物质驱动的人不会把钱看得很重，反而对金钱的贪着是最少的", "id": "Q0969"}, {"type": "judge", "cat": "money", "q": "判断正误：男以偏财为父，女以正财为父。", "ans": true, "exp": "原文：精神驱动的女人贪着的是男人的情", "id": "Q0970"}, {"type": "single", "cat": "money", "q": "自我价值感驱动的人对赚钱和金钱抱有哪种态度？", "options": ["看重赚钱的状态，而不看重钱本身", "看重钱本身", "毫不在意赚钱", "只为存钱"], "ans": 0, "exp": "原文：自我价值感驱动看重的是赚钱的状态，而不是钱本身", "id": "Q0971"}, {"type": "judge", "cat": "money", "q": "对金钱得失结束后就没感觉、懊恼一下就过了，这是自我价值感驱动的特征。", "ans": true, "exp": "原文：对金钱的得失 结束了就没有感觉了，懊恼一下就过了", "id": "Q0972"}, {"type": "single", "cat": "drive", "q": "在八字取象（印星）中，正印与偏印的区别，最核心在于什么？", "options": ["财气多少", "正统与否：正印正统，偏印不正统", "寿命长短", "婚姻好坏"], "ans": 1, "exp": "原文：正印偏印读的不是同一类书，区别就是正统。正印很正统，偏印不正统", "id": "Q0159"}, {"type": "single", "cat": "drive", "q": "在八字取象中，作为'正统的读书人'的正印，其典型表现是什么？", "options": ["上课坐第一排、课本一字不落背下来", "离经叛道", "不读书", "飞扬跋扈"], "ans": 0, "exp": "原文：正印非常好的人，规规矩矩的读书人。上课坐第一排，聚精会神的听老师说。课本一字不落的背下来", "id": "Q0160"}, {"type": "single", "cat": "drive", "q": "在八字取象中，正印读书的内容偏向哪种？", "options": ["偏门杂学", "名著、正版教材、教科书", "地摊文学", "没有标准"], "ans": 1, "exp": "原文：正印是非常简单的读书人，读的是名著、正版教材、教科书", "id": "Q0161"}, {"type": "judge", "cat": "drive", "q": "正印好的人是规规矩矩、正派正统的读书人形象。", "ans": true, "exp": "原文：比较不偏不倚，正派的一种形象", "id": "Q0162"}, {"type": "single", "cat": "drive", "q": "在命理取象中，驱动力属于命理中的哪种取象？", "options": ["五行取象", "十神取象", "干支取象", "神煞取象"], "ans": 1, "exp": "原文：驱动力都不是属于五行取象的范畴，五行取象要深很多。它是十神取象，十神背后对应的五行", "id": "Q0163"}, {"type": "single", "cat": "drive", "q": "在情感驱动的五行结构中，最好、最“真”的情感驱动是哪一种（动什么五行）？", "options": ["金水食伤", "木火食伤(动木生火)", "火土食伤", "水木食伤"], "ans": 1, "exp": "原文：木火食伤，动木生火的情感驱动，是最好的一种情感驱动，是真正的情感驱动", "id": "Q0164"}, {"type": "judge", "cat": "drive", "q": "喜用神就是一个人的核心驱动力。", "ans": true, "exp": "原文：喜用神就是核心驱动力", "id": "Q0165"}, {"type": "judge", "cat": "drive", "q": "情感驱动的人一定会有控制欲，控制的越少，情越好，食伤的能量越好、价值越高。", "ans": true, "exp": "原文：情感驱动的人一定是有控制欲的，控制的越少，情越好，食伤的能量越好", "id": "Q0166"}, {"type": "single", "cat": "drive", "q": "在核心驱动力与妄念、修行的关系中，下列说法正确的是？", "options": ["核心驱动力是最强的能量", "人无意识动的念头都是负面的驱动力，靠修行止住妄念即可破业力场", "驱动力与贪嗔无关", "妄念越多越好"], "ans": 1, "exp": "原文：人无意识动的念头，都是负面的驱动力…当你能够靠修行止住这些妄念，不动这些念头的时候，生命奇迹就出现了。也就是破了业力场，穿越了八字命局", "id": "Q0167"}, {"type": "single", "cat": "drive", "q": "在五行能量与贪、嗔的关系中，关于贪与嗔的普遍规律是什么？", "options": ["哪个五行能量不够就贪什么，哪个五行能量太多就嗔什么", "贪嗔与五行能量无关", "贪嗔只由时运决定", "五行平衡也一样贪嗔"], "ans": 0, "exp": "原文：哪一种五行能量不够就会产生贪心，哪一种五行能量太多就会产生嗔恨心", "id": "Q0168"}, {"type": "judge", "cat": "drive", "q": "有欲望其实是痛苦的感觉（包括控制欲）；有觉察力的人不会觉得控制别人很爽。", "ans": true, "exp": "原文：有欲望其实是痛苦的感觉，包括控制欲。有觉察力的人不会觉得控制别人很爽的", "id": "Q0169"}, {"type": "single", "cat": "drive", "q": "在五行与健康理论中，所有肥胖的根本原因是什么？", "options": ["湿气重，源于土不能克水", "吃得太多", "运动太少", "基因遗传"], "ans": 0, "exp": "原文：湿气重是所有肥胖的根本原因…湿气产生的原因是土不能克水", "id": "Q0170"}, {"type": "single", "cat": "drive", "q": "在五行与健康理论中，吃不胖（骨瘦如柴）的人，命理上多为哪种情况？", "options": ["水旺", "胃气太弱、五行土的存在非常弱", "火旺", "金旺"], "ans": 1, "exp": "原文：吃不胖的人通常胃气太弱，五行土的存在非常弱", "id": "Q0171"}, {"type": "single", "cat": "drive", "q": "在五行与健康理论中，鼻炎的本质是什么？", "options": ["鼻子炎症，喷药即可", "肺寒、肺阳气不足、肾阳不足，应优先养肺再养脾胃，而非一味喷鼻子", "与肺无关", "湿气过重"], "ans": 1, "exp": "原文：鼻炎是肺寒，肺的阳气不足…本质是肺气不足，肺虚生寒，阳气不足；先养肺再养脾胃", "id": "Q0172"}, {"type": "single", "cat": "drive", "q": "在五行与健康理论中，“湿疹”的主要成因是什么？", "options": ["肝火过旺", "湿气过重", "阳气过旺", "血虚"], "ans": 1, "exp": "原文：湿疹是明显湿气过重", "id": "Q0173"}, {"type": "judge", "cat": "drive", "q": "做过心脏搭桥、肾透析这类西医手术，会永久损伤肾气、很难再补回来。", "ans": true, "exp": "原文：西医手术，比如心脏搭桥，一旦做了就是永久损伤，肾气就补不起来了…透析也是…摧毁肾阳、肾气的", "id": "Q0174"}, {"type": "single", "cat": "drive", "q": "在身心灵理论中，身体的本质是什么？", "options": ["纯粹由基因决定", "业力的显化", "随机无常", "纯靠运气"], "ans": 1, "exp": "原文：身体本质上都是业力的显化", "id": "Q0175"}, {"type": "single", "cat": "drive", "q": "针对'失眠（阴虚睡不着）'，正确的调养要点是什么？", "options": ["熬夜补觉", "早起晒上午、阳气生起的太阳", "多喝凉水", "吃安眠药"], "ans": 1, "exp": "原文：很累睡不着，早起晒上午、阳气生起的太阳", "id": "Q0176"}, {"type": "single", "cat": "drive", "q": "在睡眠调养理论中，晒太阳的合适程度是什么？", "options": ["越久越好", "晒到刚刚上火最好（冬天的太阳很珍贵）", "完全不要晒", "在晚上晒"], "ans": 1, "exp": "原文：晒太阳晒到刚刚上火是最好的，冬天的太阳很珍贵", "id": "Q0177"}, {"type": "single", "cat": "drive", "q": "在五行与命理中，哪种五行最容易长寿？（前提是命格有气势且行运配合）", "options": ["金命", "木命", "土命（有气势且行运配合）", "水命"], "ans": 2, "exp": "原文：五行土命里有气势，行运配合，长寿的概率最大。稼穑格最平稳，最长寿", "id": "Q0178"}, {"type": "single", "cat": "drive", "q": "在五行能量的转化理论中，关于地支六合、天干五合与三会的说法，正确的是？", "options": ["地支六合、天干五合可转化五行能量，而三会没有转化效果", "三会可转化五行能量", "六合没有任何转化作用", "任何干支组合都不能转化五行"], "ans": 0, "exp": "原文：地支六合、天干五合很神奇，把一种五行能量转化成其它五行能量。三会没有转化的效果", "id": "Q0179"}, {"type": "judge", "cat": "drive", "q": "从格会大起大落，而且每种从格的稳定性各不相同。", "ans": true, "exp": "原文：从格大起大落是有的，每种从格稳定性不一样", "id": "Q0180"}, {"type": "single", "cat": "drive", "q": "在顺应天道的智慧中，对'弱者道之用'的观点是什么？", "options": ["示弱、不嘴硬认命反而就没事了", "强撑硬闯最安全", "从格不能示弱", "认命反而更差"], "ans": 0, "exp": "原文：弱者道之用。示弱不嘴硬认命反而就没事了", "id": "Q0181"}, {"type": "single", "cat": "drive", "q": "在修行理论中，修行的本质是什么？", "options": ["一种一厢情愿的选择", "善根的增长", "追求神通", "避世隐居"], "ans": 1, "exp": "原文：修行的本质是善根的增长，而不是一种一厢情愿的选择", "id": "Q0182"}, {"type": "judge", "cat": "drive", "q": "能把修行放在第一位看待的多是精神驱动的男人。", "ans": true, "exp": "原文：能把修行当第一的大多是精神驱动的男人", "id": "Q0183"}, {"type": "single", "cat": "drive", "q": "笔记声称阴阳平衡的人与阴阳不平衡的人比例约为", "options": ["1:1", "二八分", "1:40", "人数大致相等"], "ans": 2, "exp": "原文：阴阳平衡的人和阴阳不平衡的人大概是1:40的概率，根本不是二八分", "id": "Q0184"}, {"type": "single", "cat": "drive", "q": "在决定命运的因素中，影响命运的三要素按照由强到弱的正确排序是什么？", "options": ["人和＞天时", "天时＞地利＞人和", "地利＞天时", "人和＞地利"], "ans": 1, "exp": "原文：人的命运是环境决定的，天时＞地利＞人和，天时就是八字，地利就是出生环境", "id": "Q0185"}, {"type": "judge", "cat": "drive", "q": "没有善根的人，贵人会直接远离，长辈也无法成就/滋养你。", "ans": true, "exp": "原文：没有善根的人是直接决定了贵人会远离你的。长辈也是无法给你爱戴的", "id": "Q0186"}, {"type": "judge", "cat": "drive", "q": "出生在阳气旺衰明显的日子里的人，怎么都穷不了，容易有善缘。", "ans": true, "exp": "原文：出生在阳气旺衰的日子里，怎么都穷不了，容易有善缘", "id": "Q0187"}, {"type": "judge", "cat": "drive", "q": "当八字的'根基'（关键五行）被流年引动消失时，身体健康会发生大问题，所谓'引动什么就得什么癌'。", "ans": true, "exp": "原文：根基非常重要，流年瞬间消失的时候，身体危在旦夕就是这个时候…引动的什么，就得什么癌", "id": "Q0188"}, {"type": "judge", "cat": "drive", "q": "抑郁症吃中药很有效果，但也需要气运配合。", "ans": true, "exp": "原文：抑郁症吃中药是很有效果的。但是也要气运配合", "id": "Q0189"}, {"type": "single", "cat": "drive", "q": "关于“幻想症”这类过度精神问题的成因，下列哪种说法正确？", "options": ["八字本身有问题", "几乎100%是时运造成", "原生家庭", "失眠"], "ans": 1, "exp": "原文：还有幻想症，几乎100%都是时运造成的。并不是八字本身有问题，而是走的运", "id": "Q0190"}, {"type": "single", "cat": "drive", "q": "在五行驱动力的万物类象中，'爱的能量'与'情的能量'分别倾向于什么层面？", "options": ["爱偏精神智慧理性，情偏感受情绪", "爱偏情绪感受，情偏理性智慧", "二者都偏情绪感受", "二者都偏理性智慧"], "ans": 0, "exp": "原文：一个有爱的人体现出来的特质，一定是倾向于精神层面的，倾向于智慧层面的…这种内涵，是爱的能量。情的能量，是偏向于人的感受，来自于人的内心，或者是情绪方面的感受。", "id": "Q0191"}, {"type": "single", "cat": "drive", "q": "'甲乙丙丁戊己庚辛壬癸，十天干就是八卦'，这一论断在判定核心驱动力时的意义是什么？", "options": ["十天干就是八卦，人自我定位以日柱天干为准，据此判断需要用哪种五行实现阴阳平衡", "十天干与驱动力无关", "十天干决定财运", "十天干只用于排大运"], "ans": 0, "exp": "原文：比如说甲乙丙丁戊己庚辛壬癸，十天干就是八卦。…人的太极当中，人，自我的定位，就是以日柱的天干为定位的。", "id": "Q0192"}, {"type": "single", "cat": "drive", "q": "在阴阳平衡的维度上，传统命理中所讲的'身弱'与'身强'有没有吉凶含义？它唯一的含义是什么？", "options": ["无吉凶含义，只影响阴阳平衡的能力", "身强为吉、身弱为凶", "决定财运好坏", "与五行完全无关"], "ans": 0, "exp": "原文：但实际上在阴阳平衡的维度上，一个自身的五行能量的强弱，并没有吉凶的含义。它唯一的含义是影响阴阳平衡的能力。", "id": "Q0193"}, {"type": "single", "cat": "drive", "q": "在五行驱动力理论中，关于一个人的太极中缺少某一种五行，理论上的观点是什么？", "options": ["缺少某种五行一定是坏事", "如果你不需要这种五行且太极的阴阳平衡又不需要动用它，缺少它反而是大吉之相", "缺少某种五行会直接影响吉凶", "五行缺一就命不好"], "ans": 1, "exp": "原文：如果你没有某一种五行你的太极的阴阳平衡又不需要动用到这种五行，那这就是大吉之相。", "id": "Q0194"}, {"type": "single", "cat": "drive", "q": "在5种内在驱动力的配对关系中，情感驱动的女人应当匹配哪种男人？", "options": ["责任感驱动男人", "情感驱动男人", "精神驱动男人", "物质驱动男人"], "ans": 0, "exp": "原文：配对模式：情感驱动女人 X 责任感驱动男人", "id": "Q0195"}, {"type": "single", "cat": "drive", "q": "在5种内在驱动力的配对关系中，精神驱动的女人应当匹配哪种男人？", "options": ["精神驱动男人", "情感驱动男人", "物质驱动男人", "责任感驱动男人"], "ans": 1, "exp": "原文：配对模式：精神驱动女人 X 情感驱动男人", "id": "Q0196"}, {"type": "single", "cat": "drive", "q": "在5种内在驱动力的配对关系中，自我价值感驱动的女人应当匹配哪种男人？", "options": ["物质驱动男人", "精神驱动男人", "情感驱动男人", "自我价值感驱动男人"], "ans": 0, "exp": "原文：配对模式：自我价值感驱动女人 X 物质驱动男人", "id": "Q0197"}, {"type": "single", "cat": "drive", "q": "在5种内在驱动力的配对关系中，责任感驱动的女人应当匹配哪种男人？", "options": ["自我价值感驱动男人", "责任感驱动男人", "物质驱动男人", "情感驱动男人"], "ans": 0, "exp": "原文：配对模式：责任感驱动女人 X 自我价值感驱动男人", "id": "Q0198"}, {"type": "single", "cat": "drive", "q": "在5种内在驱动力的配对关系中，物质驱动的女人应当匹配哪种男人？", "options": ["精神驱动男人", "物质驱动男人", "情感驱动男人", "责任感驱动男人"], "ans": 0, "exp": "原文：配对模式：物质驱动女人 X 精神驱动男人", "id": "Q0199"}, {"type": "single", "cat": "drive", "q": "在男女驱动力匹配理论中，精神驱动的女人以什么作为其“精神食粮”？", "options": ["男人的情", "男人的钱", "男人的责任", "男人的陪伴"], "ans": 0, "exp": "原文：精神驱动的女人的精神食粮是男人的情。", "id": "Q0200"}, {"type": "single", "cat": "drive", "q": "在男女驱动力匹配理论中，物质驱动的男人生命中需要的是女人的什么？", "options": ["陪伴", "情", "钱", "责任感"], "ans": 0, "exp": "原文：所以物质驱动的男人他需要的是女人的陪伴。", "id": "Q0201"}, {"type": "single", "cat": "drive", "q": "在自我价值感驱动的匹配理论中，自我价值感驱动的女人感受爱的方式是什么？", "options": ["男人为她花钱", "男人的陪伴", "男人的情", "男人的智慧"], "ans": 0, "exp": "原文：她感受爱的方式是男人给她花钱。", "id": "Q0202"}, {"type": "single", "cat": "drive", "q": "在男女驱动力匹配理论中，不是精神驱动的女人，面对男人的情通常会表现出什么反应？", "options": ["具有回避属性（感到压迫、想回避甚至厌恶），会难受", "欣然接受并回应", "完全无感", "主动索取"], "ans": 0, "exp": "原文：如果不是精神驱动的女人，对于男人的情都具有回避的属性，都会难受的。", "id": "Q0203"}, {"type": "single", "cat": "drive", "q": "在五种驱动力理论中，物质驱动的人对待赚钱的态度是什么？", "options": ["本质上对赚钱没有兴趣，但能通过运用物质实现自身平衡、花钱花在刀刃上", "对赚钱极度热衷", "最擅长用钱赚钱", "只想着赚钱"], "ans": 0, "exp": "原文：物质驱动的人，本质上对于赚钱这件事情没有兴趣，但是他能够通过去运用物质，实现自身的平衡…他花钱总能花在刀刃上，他花钱总能花对地方。", "id": "Q0204"}, {"type": "single", "cat": "drive", "q": "在'亲缘关系·父母的定位'一节中，母亲在易经十神中的定位是什么？", "options": ["印星", "财星", "官杀", "食伤"], "ans": 0, "exp": "原文：因为母亲的定位，是在易经的十神相当中，以印星为定位。…男人以正印为母。女人以偏印为母。", "id": "Q0205"}, {"type": "single", "cat": "drive", "q": "在'亲缘关系·父母的定位'一节中，父亲在易经万物类象中的定位是以什么为定位？", "options": ["财星（男以偏财为父、女以正财为父）", "印星", "官杀", "比劫"], "ans": 0, "exp": "原文：对父亲的定位是以财星为定位，就是男人的父亲是以偏财为父。…男以偏财为父，女以正财为父。", "id": "Q0206"}, {"type": "single", "cat": "drive", "q": "在父亲与驱动力的关系理论中，物质驱动的人与父亲的关系会怎样？", "options": ["会亲近父亲，并对父亲的陪伴与存在有需求", "与父亲天生疏远", "完全不需要父亲", "反感父亲"], "ans": 0, "exp": "原文：物质驱动的人，他就会亲近他的父亲，这就是一个很直观的东西…物质驱动的人，对父亲的陪伴，对父亲的存在是有需求的，他这个是一一对应的关系。", "id": "Q0207"}, {"type": "single", "cat": "drive", "q": "关于'父母是什么样的人'与'孩子是什么样的人'之间的关系，理论上的观点是什么？", "options": ["父母是什么样的人决定了孩子是什么样的人", "父母是什么样的人不能决定孩子是什么样的人，成为一家人背后有更高维度的因缘（共业招感）", "孩子完全复制父母", "与因果无关"], "ans": 1, "exp": "原文：父母是什么样的人，他是不能够决定孩子是什么样的人的。…为什么会成为一家人，这个在背后是有更高维度的，一个因缘层面的原因，它是一种共业招感。", "id": "Q0208"}, {"type": "single", "cat": "drive", "q": "在万物类象中，'爱'与'情'的区别是什么？", "options": ["爱是付出的意愿，情是付出的需要", "爱是付出的需要，情是付出的意愿", "爱与情完全相同", "爱是情欲，情是理性"], "ans": 0, "exp": "原文：爱是付出的意愿，情是付出的需要。知道该如何正确的付出，是人提升生命质量最重要的功课。", "id": "Q0209"}, {"type": "single", "cat": "love", "q": "在“5种内在驱动力配对”中，情感驱动的女人需要/匹配的是哪一种驱动力的男人？", "options": ["精神驱动的男人", "责任感驱动的男人", "物质驱动的男人", "情感驱动的男人"], "ans": 1, "exp": "原文：情感驱动的女人，需要的是男人的事业心上进心…也就是责任感驱动。配对模式：情感驱动女人 X 责任感驱动男人。", "id": "Q0434"}, {"type": "single", "cat": "love", "q": "在'5种内在驱动力配对'中，精神驱动的女人在感情中需要的是男人的特定供给，并把这种供给称作她的'精神食粮'。那么精神驱动的女人需要男人的什么？", "options": ["男人的钱", "男人的陪伴", "男人的情", "男人的责任感"], "ans": 2, "exp": "原文：精神驱动的女人，需要的是男人的情…男人的情就是…这就是她以男人的情为精神食粮。配对模式：精神驱动女人 X 情感驱动男人。", "id": "Q0435"}, {"type": "single", "cat": "love", "q": "关于自我价值感驱动的女人，她感受自我价值感与爱的方式都与男人的某样东西相关。那么，自我价值感驱动的女人需要/衡量自我的方式是男人的什么？", "options": ["男人的陪伴", "男人的情", "男人的钱", "男人的爱"], "ans": 2, "exp": "原文：自我价值感驱动的女人，需要的是男人的钱。自我价值感驱动的女人衡量自我价值的方式，是男人愿意给他花多少钱。配对模式：自我价值感驱动女人 X 物质驱动男人。", "id": "Q0436"}, {"type": "single", "cat": "love", "q": "在“5种内在驱动力配对”中，责任感驱动的女人在感情中只需男人的某样东西即可满足。这样东西是什么？", "options": ["男人的爱", "男人的情", "男人的钱", "男人的陪伴"], "ans": 3, "exp": "原文：责任感驱动的女人，需要的是男人的陪伴。只要这个男人可以稳定的待着存在着，她就满足了。配对模式：责任感驱动女人 X 自我价值感驱动男人。", "id": "Q0437"}, {"type": "single", "cat": "love", "q": "在'5种内在驱动力配对'中，物质驱动的女人在感情中需要的是男人的某样东西，它与男人的智慧、理解接纳包容相关。那么物质驱动的女人需要的是男人的什么？", "options": ["男人的爱", "男人的陪伴", "男人的钱", "男人的事业心"], "ans": 0, "exp": "原文：物质驱动的女人，需要的是男人的爱。…男人对你的理解接纳包容，还有对他聆听的能力就是爱。配对模式：物质驱动女人 X 精神驱动男人。", "id": "Q0438"}, {"type": "single", "cat": "love", "q": "在五种内在驱动力配对中，情感驱动的男人最需要哪一种女人？", "options": ["物质驱动的女人", "责任感驱动的女人", "精神驱动的女人", "自我价值感驱动的女人"], "ans": 2, "exp": "原文：情感驱动的男人，他一定要是精神驱动的女人，也就是说他需要一个有智慧的女人…愿意给他提供情绪价值的女人。配对模式：情感驱动男人 X 精神驱动女人。", "id": "Q0439"}, {"type": "single", "cat": "love", "q": "在男女情感模式中，情感驱动的女生面对男人对她的“情”时通常会主动回避，其原因是什么？", "options": ["因为她们需要更多的钱", "因为她们会感受到压迫感而自然而然地回避男人的情", "因为她们太理性", "因为她们独身主义"], "ans": 1, "exp": "原文：非精神驱动的女人，当她感受到男人对她的情欲，男人对她动情了，她会感受到压迫感，这是不舒服的感觉…因此而产生想要自然而然的回避的情绪。百分之七八十情感驱动的女生会主动的回避男人的情。", "id": "Q0440"}, {"type": "single", "cat": "love", "q": "在易经的定性中，婚姻与情感是独立的定位。那么婚姻和情感之间有没有因果关系？", "options": ["婚姻与情感有直接的因果关系", "情感深就必然要结婚", "婚姻与情感没有因果关系，二者是独立的定位", "感情不好就必须离婚"], "ans": 2, "exp": "原文：婚姻本身与情感是独立的定位。不能因为感情不好，就不要自己的婚姻，这是两码事…婚姻和情感真的没有因果关系。", "id": "Q0441"}, {"type": "multi", "cat": "love", "q": "有些人自称'向往婚姻'，但真实动机并不是向往婚姻本身，而是想借婚姻绑定伴侣的某些东西。这类人倾向用婚姻绑定伴侣的哪些东西？（多选）", "options": ["伴侣的爱", "伴侣的情", "伴侣的钱", "伴侣的陪伴"], "ans": [0, 1, 2, 3], "exp": "原文：有些人向往婚姻，不是真的向往婚姻，而是想用婚姻绑定伴侣的爱、情、钱、陪伴。", "id": "Q0442"}, {"type": "single", "cat": "love", "q": "关于“想不想结婚”与“最后会不会结婚”这两者之间的关系，下列哪项说法正确？", "options": ["两者有直接的因果关系", "没有因果关系，都是缘分决定的", "想结婚就必然能结婚", "不想结婚就必然不结婚"], "ans": 1, "exp": "原文：向不向往婚姻、向不想结婚，和最后会不会结婚是没有因果关系的。有可能不想结婚但不得不结婚，也有可能想结婚最后结不了，都是缘分决定的。", "id": "Q0443"}, {"type": "single", "cat": "love", "q": "“情感模式匹配程度”与“缘分”虽然相关，但属于不同维度。关于两者的关系，正确的是下列哪一项？", "options": ["匹配程度直接决定了是否结婚", "匹配程度越高缘分必然越深", "匹配程度能决定是否有情缘，但不能决定是否有缘分(缘分高于一切)", "缘分完全由匹配程度唯一决定"], "ans": 2, "exp": "原文：情感的匹配程度不能决定两个人是否有缘分，因为缘分是高于一切的…灵魂伴侣（情感模式匹配程度）是两个人在一起契合的程度。但不能够直接决定你有没有缘分。", "id": "Q0444"}, {"type": "single", "cat": "love", "q": "'责任感的本质'可归结为某样东西，也正是因此，拥有地位、权势、事业的男人不易被女人的欲望撩动。那么责任感的本质是什么？", "options": ["爱", "情", "事业心、地位、权势", "金钱"], "ans": 2, "exp": "原文：责任感的本质是事业心、地位、权势。但凡有地位权势和事业的男人，他都不会轻易的被任何女人撩拨自己的欲望。", "id": "Q0445"}, {"type": "single", "cat": "love", "q": "判断一个男人是不是责任感驱动（做事业的人），最直观的方法是什么？", "options": ["看他赚多少钱", "看他有没有豪车", "直接看他老婆过得开不开心", "看他朋友多不多"], "ans": 2, "exp": "原文：看一个男人是不是做事业的，是不是责任感驱动的，直接看他老婆过得开不开心就好了，老婆能不能做自己喜欢的事情。", "id": "Q0446"}, {"type": "single", "cat": "love", "q": "对有情的女人而言，其最关键的功课（要害）是什么？", "options": ["多赚钱", "把大脑完全放空、不过度动脑", "多谈恋爱", "变得更理性强势"], "ans": 1, "exp": "原文：能不能把大脑完全放空。就直接决定了她的福泽和生命维度…有情的女生一旦开始动脑，就会想从男人身上找情。", "id": "Q0447"}, {"type": "single", "cat": "love", "q": "在探讨情感模式匹配与男女姻缘时，会比较'情感模式'与'缘分'二者的高低层次。下列关于两者维度高低的表述，正确的是？", "options": ["情感模式高于缘分", "两者相等", "缘分高于情感模式", "缘分与情感模式无关"], "ans": 2, "exp": "原文：缘分这个东西，它的维度它是高于情感模式的…情感模式的匹配程度不能决定两个人是否有缘分，因为缘分是高于一切的。", "id": "Q0448"}, {"type": "single", "cat": "love", "q": "在核心驱动力中，5种驱动力各自实现阴阳平衡所用的五行关系不同。那么，责任感驱动的人实现阴阳平衡的方式是用哪种五行关系？", "options": ["生我的五行", "我所生的五行", "克我的五行", "我克的五行"], "ans": 2, "exp": "原文：责任感驱动的人实现阴阳平衡的方式就是用克我的五行。我是水，就用土实现平衡。（喜欢克自己的东西）", "id": "Q0449"}, {"type": "single", "cat": "love", "q": "在“核心驱动力”理论中，情感驱动的人实现阴阳平衡所动用的是哪种五行关系？", "options": ["生我的五行", "我所生的五行", "克我的五行", "我克的五行"], "ans": 1, "exp": "原文：情感驱动的人实现阴阳平衡的方式就是用我所生的五行。我是水，就用木实现平衡。", "id": "Q0450"}, {"type": "single", "cat": "love", "q": "在'核心驱动力'中，5种驱动力各自实现阴阳平衡所倚仗的五行关系不同。其中物质驱动的人实现阴阳平衡用的是哪种五行？", "options": ["生我的五行", "我所生的五行", "克我的五行", "我克的五行"], "ans": 3, "exp": "原文：物质驱动的人实现阴阳平衡的方式就是用我克的五行。我是水，就用火实现平衡。（喜欢自己克的东西）", "id": "Q0451"}, {"type": "single", "cat": "love", "q": "在核心驱动力中，5种驱动力各自实现阴阳平衡所用的五行关系不同。那么，精神驱动的人实现阴阳平衡是用哪种五行？", "options": ["生我的五行", "我所生的五行", "克我的五行", "我克的五行"], "ans": 0, "exp": "原文：精神驱动的人实现阴阳平衡的方式就是用生我的五行。我是水，就用金实现平衡。", "id": "Q0452"}, {"type": "single", "cat": "love", "q": "在“核心驱动力”理论中，自我价值感驱动的人实现阴阳平衡所动用的是哪种五行关系？", "options": ["生我的五行", "我克的五行", "用我自身本气的五行", "克我的五行"], "ans": 2, "exp": "原文：自我价值感驱动的人实现阴阳平衡的方式就是用我的五行。我是水，我用水实现平衡。", "id": "Q0453"}, {"type": "single", "cat": "love", "q": "情感驱动与自我价值感驱动的人在“赚朋友钱”这件事上的感受不同。谁更能毫无违和感地赚到朋友的钱？", "options": ["自我价值感驱动的人", "情感驱动的人", "两
