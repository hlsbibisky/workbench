<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沪深300 资金全景</title>
<style>
  :root{
    --bg:#f7f4ee; --card:#fffdf9; --ink:#3a3631; --sub:#8a837a;
    --line:#ece5da; --accent:#b8714e; --accent2:#5b8c7b;
    --up:#c0392b; --down:#2e9e5b;
    --shadow:0 1px 3px rgba(58,54,49,.06), 0 10px 26px rgba(58,54,49,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);}
  body{color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
       line-height:1.5;padding:14px 16px 26px;-webkit-font-smoothing:antialiased;}
  .wrap{width:100%;max-width:none;}

  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;
       flex-wrap:wrap;margin-bottom:12px;}
  .hint{font-size:12.5px;color:var(--sub);letter-spacing:.2px;}
  .hint b{color:var(--accent);font-weight:600;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--sub);
        border-radius:999px;padding:5px 13px;font-size:12.5px;cursor:pointer;
        font-family:inherit;transition:.15s;white-space:nowrap;}
  .chip:hover{border-color:var(--accent);color:var(--accent);}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}

  /* ── 结论卡 ── */
  .verdict{background:var(--card);border:1px solid var(--line);border-radius:16px;
           padding:15px 18px 16px;box-shadow:var(--shadow);margin-bottom:12px;
           border-left:4px solid var(--accent);}
  .vtop{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:9px;}
  .vtag{font-size:11.5px;letter-spacing:1px;color:var(--sub);}
  .vnum{font-size:34px;font-weight:700;letter-spacing:-.5px;line-height:1.05;
        font-variant-numeric:tabular-nums;}
  .vnum u{font-size:16px;text-decoration:none;font-weight:600;margin-left:2px;}
  .vwrd{font-size:15px;font-weight:600;padding-bottom:4px;}
  .up{color:var(--up);} .down{color:var(--down);} .flat{color:var(--sub);}
  .vsub{font-size:12px;color:var(--sub);padding-bottom:5px;font-variant-numeric:tabular-nums;}
  .vtext{font-size:13px;line-height:1.85;color:var(--ink);}
  .vtext b{font-weight:700;}
  .vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:10px 0 11px;}
  .vg{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:8px 11px;}
  .vg b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.2px;}
  .vg span{display:block;font-size:11px;color:var(--sub);margin-top:1px;letter-spacing:.3px;}

  /* ── 图表卡 ── */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:12px 14px 8px;box-shadow:var(--shadow);margin-bottom:12px;}
  .chead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 2px 4px;}
  .chead .t{font-size:13px;font-weight:600;color:var(--ink);}
  .chead .t em{font-style:normal;font-size:11px;color:var(--sub);font-weight:400;margin-left:6px;}
  .chead .r{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;}
  .cvbox{position:relative;width:100%;}
  canvas{display:block;width:100%;}
  .tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;
       background:rgba(255,253,249,.97);border:1px solid var(--line);border-radius:10px;
       box-shadow:0 6px 20px rgba(58,54,49,.12);padding:7px 10px;font-size:12px;
       color:var(--ink);white-space:nowrap;z-index:6;line-height:1.6;
       font-variant-numeric:tabular-nums;}
  .tip .dt{color:var(--sub);font-size:11px;margin-bottom:2px;}
  .tip .row{display:flex;justify-content:space-between;gap:16px;}
  .tip .row i{font-style:normal;color:var(--sub);}

  /* ── 事件表 ── */
  .ev{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;}
  .ev th{text-align:right;font-weight:600;color:var(--sub);font-size:11px;
         padding:5px 8px;border-bottom:1px solid var(--line);letter-spacing:.3px;}
  .ev th:first-child,.ev td:first-child{text-align:left;}
  .ev td{text-align:right;padding:5.5px 8px;border-bottom:1px solid #f3efe8;}
  .ev tr:last-child td{border-bottom:0;}
  .ev .amt{font-weight:700;}
  .evcols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .evh{font-size:11.5px;font-weight:600;letter-spacing:.3px;margin:2px 0 4px;}

  .note{font-size:11.5px;color:var(--sub);line-height:1.8;background:var(--card);
        border:1px dashed var(--line);border-radius:12px;padding:10px 13px;}
  .note b{color:var(--ink);font-weight:600;}
  .note p{margin-top:4px;}

  @media (max-width:760px){
    body{padding:10px 10px 22px;}
    .vgrid{grid-template-columns:repeat(2,1fr);}
    .vnum{font-size:28px;}
    .verdict{padding:13px 13px 14px;}
    .evcols{grid-template-columns:1fr;gap:12px;}
  }
</style>
</head>

  if(q){ for(var i=0;i<RANGES.length;i++){ if(RANGES[i].k===q[1]) cur=q[1]; } }

  var chipBox = document.getElementById('ranges');
  RANGES.forEach(function(r){
    var b = document.createElement('button');
    b.className = 'chip' + (r.k===cur ? ' on' : '');
    b.textContent = r.n;
    b.onclick = function(){
      cur = r.k;
      Array.prototype.forEach.call(chipBox.children, function(c){ c.className='chip'; });
      b.className = 'chip on';
      render();
    };
    chipBox.appendChild(b);
  });

  function slice(days){
    if(!days || days >= S.length) return S.slice();
    return S.slice(S.length - days);
  }

  /* ═══════ 结论引擎 ═══════ */
  function verdict(){
    var w = Math.min(20, S.length);
    var win = S.slice(S.length - w);
    var sum = 0, i;
    for(i=0;i<win.length;i++) sum += win[i][C_EFBIG];
    var last = S[S.length-1];

    // 连续同向天数（从最后一天往前）
    var dir = last[C_EFBIG] >= 0 ? 1 : -1;
    var streak = 0;
    for(i=S.length-1; i>=0; i--){
      var v = S[i][C_EFBIG];
      if((v>=0?1:-1) === dir) streak++; else break;
    }
    // 近20日窗口的指数涨跌与成分股资金（与上面 sum 同一窗口，口径一致）
    var pc = (win[win.length-1][C_CLOSE] / win[0][C_CLOSE] - 1) * 100;
    var hsWin = 0;
    for(i=0;i<win.length;i++) hsWin += win[i][C_HSNET];

    // 所选区间累计（单独展示）
    var rows = slice(RANGES.filter(function(r){return r.k===cur;})[0].days);
    var rs = 0, hs = 0;
    for(i=0;i<rows.length;i++){ rs += rows[i][C_EFBIG]; hs += rows[i][C_HSNET]; }
    var pcRange = (rows[rows.length-1][C_CLOSE] / rows[0][C_CLOSE] - 1) * 100;
    // 近20日在历史同长度窗口中的强度分位
    var wins = [], j;
    for(j=0; j+w <= S.length; j++){
      var t=0; for(i=0;i<w;i++) t += S[j+i][C_EFBIG];
      wins.push(t);
    }
    wins.sort(function(a,b){return a-b;});
    var rank = 0;
    for(i=0;i<wins.length;i++){ if(wins[i] <= sum) rank = i+1; }
    var pct = Math.round(rank / wins.length * 100);

    var buy = sum >= 0;
    var cls = Math.abs(sum) < 8 ? 'flat' : (buy ? 'up' : 'down');
    var word = Math.abs(sum) < 8 ? '基本持平' : (buy ? '净买入' : '净卖出');

    document.getElementById('vNum').innerHTML =
      '<span class="'+cls+'">' + sign(sum, 0) + '</span><u>亿</u>';
    document.getElementById('vNum').className = 'vnum ' + cls;
    document.getElementById('vWord').className = 'vwrd ' + cls;
    document.getElementById('vWord').textContent = word;
    document.getElementById('vSub').textContent =
      '强于同期 ' + pct + '% 的历史窗口　·　' +
      (dir>0 ? '已连续 '+streak+' 日净买入' : '已连续 '+streak+' 日净卖出');

    var rg = RANGES.filter(function(r){return r.k===cur;})[0];
    document.getElementById('vGrid').innerHTML =
      '<div class="vg"><b class="'+(rs>=0?'up':'down')+'">' + sign(rs,0) + '</b><span>' + rg.n + ' ETF大单累计（亿）</span></div>' +
      '<div class="vg"><b class="'+(hs>=0?'up':'down')+'">' + sign(hs,0) + '</b><span>' + rg.n + ' 成分股主力累计（亿）</span></div>' +
      '<div class="vg"><b class="'+(pcRange>=0?'up':'down')+'">' + sign(pcRange,1) + '%</b><span>' + rg.n + ' 沪深300 涨跌</span></div>' +
      '<div class="vg"><b>' + nf(last[C_RATIO],3) + '%</b><span>ETF 占流通市值比</span></div>';

    // 解读（全部基于近 20 个交易日这一窗口）
    var t = [];
    var big = Math.abs(sum);
    var intensity = big > 300 ? '大手笔' : big > 120 ? '明显' : big > 40 ? '温和' : '轻微';
    var action = buy ? '买入' : '卖出';
    if(big < 8){
      t.push('近 20 个交易日，沪深300ETF 大单资金<b>进出基本平衡</b>（' + sign(sum,0) + ' 亿），没有出现明显方向性动作。');
    }else{
      t.push('近 20 个交易日，沪深300ETF 大单资金累计<b class="' + cls + '">' + word + ' ' + nf(Math.abs(sum),0) + ' 亿</b>，' +
             '属于' + intensity + action + '，强于历史 <b>' + pct + '%</b> 的同期窗口。');
    }
    if(pc >= 0 && buy){
      t.push('同期（近 20 日）指数<b class="up">上涨 ' + nf(pc,1) + '%</b>，资金与价格<b>同向</b>——是顺势加仓，不是救市。');
    }else if(pc < 0 && buy){
      t.push('同期（近 20 日）指数<b class="down">下跌 ' + nf(Math.abs(pc),1) + '%</b>，资金进而价格跌，属<b>逆势托底</b>：指数下行时大单持续承接。');
    }else if(pc >= 0 && !buy){
      t.push('同期（近 20 日）指数<b class="up">上涨 ' + nf(pc,1) + '%</b>，资金出而价格涨，属<b>逢高兑现</b>：反弹中被大单减持。');
    }else{
      t.push('同期（近 20 日）指数<b class="down">下跌 ' + nf(Math.abs(pc),1) + '%</b>，资金与价格<b>同向流出</b>，属于跟随性抛压。');
    }
    if(streak >= 5){
      t.push('已连续 <b>' + streak + ' 个交易日</b>' + (dir>0?'净买入':'净卖出') + '，持续性较强，不像单日脉冲。');
    }else if(streak >= 3){
      t.push('已连续 <b>' + streak + ' 个交易日</b>' + (dir>0?'净买入':'净卖出') + '。');
    }
    var hsDir = hsWin >= 0 ? '净流入' : '净流出';
    t.push('同期 300 只成分股主力资金<b class="' + (hsWin>=0?'up':'down') + '">' + hsDir + ' ' + nf(Math.abs(hsWin),0) + ' 亿</b>' +
           ((hsWin>=0) === buy ? '，与 ETF 大单方向一致，是<b>全市场共振</b>。'
                               : '，与 ETF 大单方向<b>相反</b>，说明 ETF 的买卖来自少数特定资金（多为配置型/政策性资金），而非全市场共识。'));
    // 长周期对比：所选区间 vs 近20日
    if(rows.length > w + 20){
      var rdir = rs >= 0 ? '净流入' : '净流出';
      var sameDir = (rs >= 0) === buy;
      if(!sameDir && Math.abs(rs) > Math.abs(sum) * 1.5){
        t.push('拉长到' + rg.n + '看，ETF 大单累计仍是<b class="' + (rs>=0?'up':'down') + '">' + rdir + ' ' +
               nf(Math.abs(rs),0) + ' 亿</b>——近 20 日的' + word + '是长周期' + (buy?'流出':'流入') +
               '里的一段<b>反向动作</b>，更像转折初期，而非趋势已经确立。');
      }else if(sameDir){
        t.push('拉长到' + rg.n + '看，ETF 大单累计<b class="' + (rs>=0?'up':'down') + '">' + rdir + ' ' +
               nf(Math.abs(rs),0) + ' 亿</b>，与近期同向，属于<b>趋势延续</b>。');
      }
    }
    // 规模变化（首尾均为实测/锚点日，量级可参考；日频净申赎含插值，不进结论）
    var sizeChg = win[win.length-1][C_SIZE] - win[0][C_SIZE];
    var subWin = 0;
    for(i=0;i<win.length;i++) subWin += win[i][C_SUB];
    if(Math.abs(sizeChg) >= 50 && (sizeChg>=0) === buy){
      t.push('同期 ETF 合计规模' + (sizeChg>=0?'增加':'减少') + ' <b>' + nf(Math.abs(sizeChg),0) +
             ' 亿</b>，与资金流向同向，仓位确实在' + (buy?'增厚':'收缩') + '。');
    }
    t.push('<span style="color:#8a837a">（注：日频净申赎由份额插值推算，仅供看图，本节结论只采用大单资金、成分股资金与价格三类实测数据。）</span>');
    document.getElementById('vText').innerHTML = t.join('');
  }

  /* ═══════ Canvas 通用 ═══════ */
  var C_SUBC = '#8a837a', C_LINE = '#ece5da';
  var RED = '#c0392b', GRN = '#2e9e5b', ACC = '#b8714e';

  function niceTicks(min, max, n){
    if(!(max > min)){ var m=(min+max)/2||1; min=m*0.99; max=m*1.01; }
    var raw=(max-min)/n;
    var mag=Math.pow(10, Math.floor(Math.log(raw)/Math.LN10));
    var norm=raw/mag;
    var step=(norm<=1?1:norm<=2?2:norm<=5?5:10)*mag;
    var lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step;
    var out=[];
    for(var v=lo; v<=hi+step*1e-6; v+=step) out.push(Math.abs(v)<step*1e-6?0:v);
    return out;
  }

  function makeChart(opt){
    var cv=document.getElementById(opt.id), box=cv.parentNode;
    var tipEl=document.getElementById(opt.tipId);
    var rows=[], hi=-1, g=null, W=0, H=opt.h;
    var dpr=window.devicePixelRatio||1;
    var padL=opt.padL, padR=14, padT=14, padB=25;

    function draw(){
      W = box.clientWidth || 640; H = opt.h;
      cv.style.height=H+'px';
      cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
      var ctx=cv.getContext('2d');
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.clearRect(0,0,W,H);
      if(!rows.length) return;

      var vals=rows.map(opt.val);
      var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
      if(opt.zeroLine){ mn=Math.min(mn,0); mx=Math.max(mx,0); }
      var padv=(mx-mn)*(opt.padRatio||0.14) || Math.abs(mx)*0.1 || 1;
      var ticks=niceTicks(mn-padv, mx+padv, opt.ticks||4);
      var y0=ticks[0], y1=ticks[ticks.length-1];
      var iw=W-padL-padR, ih=H-padT-padB;
      var X=function(i){ return padL + (rows.length<=1 ? iw/2 : iw*i/(rows.length-1)); };
      var Y=function(v){ return padT + ih - ih*(v-y0)/(y1-y0); };
      g={X:X,Y:Y,ih:ih,padT:padT,padB:padB,W:W};
      ctx.font='11px "PingFang SC","Microsoft YaHei",sans-serif';

      // 网格 + y轴
      ctx.textAlign='right'; ctx.textBaseline='middle';
      ticks.forEach(function(t){
        var y=Math.round(Y(t))+.5;
        ctx.strokeStyle=C_LINE; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
        ctx.fillStyle=C_SUBC; ctx.fillText(opt.tickFmt(t), padL-8, y);
      });
      // 零线
      if(opt.zeroLine && y0<0 && y1>0){
        var zy=Math.round(Y(0))+.5;
        ctx.strokeStyle='#d9d0c2'; ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.moveTo(padL,zy); ctx.lineTo(W-padR,zy); ctx.stroke();
      }
      // x轴标签
      ctx.textAlign='center'; ctx.textBaseline='top';
      var nLbl=Math.min(6, Math.max(2, Math.floor(iw/108)));
      for(var k=0;k<nLbl;k++){
        var i2=Math.round((rows.length-1)*k/(nLbl-1));
        var tx=Math.min(Math.max(X(i2), padL+20), W-padR-20);
        ctx.fillStyle=C_SUBC;
        ctx.fillText(rows[i2][0].slice(2).replace(/-/g,'/'), tx, padT+ih+8);
      }

      // 叠加线（归一化，独立量纲）
      if(opt.overlay){
        var ov=rows.map(opt.overlay.val);
        var omin=Math.min.apply(null,ov), omax=Math.max.apply(null,ov);
        var ospan=(omax-omin)||1;
        var OY=function(v){ return padT + ih*0.94 - ih*0.86*(v-omin)/ospan; };
        ctx.beginPath();
        rows.forEach(function(r,i){
          var x=X(i), y=OY(opt.overlay.val(r));
          if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y);
        });
        ctx.strokeStyle=opt.overlay.color; ctx.lineWidth=1.4;
        ctx.setLineDash(opt.overlay.dash||[]); ctx.stroke(); ctx.setLineDash([]);
        g.OY=OY;
      }

      // 主体：柱状 或 面积线
      if(opt.type==='bar'){
        var bw=Math.max(1.2, iw/rows.length*0.68);
        rows.forEach(function(r,i){
          var v=opt.val(r), x=X(i), y=Y(v), zy=Y(0);
          ctx.fillStyle = v>=0 ? opt.up : opt.down;
          var top=Math.min(y,zy), h=Math.abs(zy-y);
          if(h<0.6) h=0.6;
          ctx.fillRect(x-bw/2, top, bw, h);
        });
      }else{
        var grad=ctx.createLinearGradient(0,padT,0,padT+ih);
        grad.addColorStop(0,opt.fill1); grad.addColorStop(1,opt.fill2);
        ctx.beginPath();
        rows.forEach(function(r,i){ var x=X(i), y=Y(opt.val(r)); if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y); });
        ctx.lineTo(X(rows.length-1), padT+ih); ctx.lineTo(X(0), padT+ih); ctx.closePath();
        ctx.fillStyle=grad; ctx.fill();
        ctx.beginPath();
        rows.forEach(function(r,i){ var x=X(i), y=Y(opt.val(r)); if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y); });
        ctx.strokeStyle=opt.stroke; ctx.lineWidth=opt.lw||1.9;
        ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
        var lx=X(rows.length-1), ly=Y(opt.val(rows[rows.length-1]));
        ctx.beginPath(); ctx.arc(lx,ly,6.5,0,Math.PI*2); ctx.fillStyle=opt.glow; ctx.fill();
        ctx.beginPath(); ctx.arc(lx,ly,3.2,0,Math.PI*2); ctx.fillStyle=opt.stroke; ctx.fill();
      }

      // 高亮
      if(hi>=0 && hi<rows.length){
        var cx=X(hi), cy=Y(opt.val(rows[hi]));
        ctx.save();
        ctx.setLineDash([3,3]); ctx.strokeStyle='rgba(140,120,100,.45)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(Math.round(cx)+.5, padT); ctx.lineTo(Math.round(cx)+.5, padT+ih); ctx.stroke();
        ctx.restore();
        ctx.beginPath(); ctx.arc(cx,cy,4.4,0,Math.PI*2);
        ctx.fillStyle='#fffdf9'; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle=opt.stroke||(opt.val(rows[hi])>=0?opt.up:opt.down); ctx.stroke();
      }
    }

    function showTip(i){
      var r=rows[i];
      tipEl.innerHTML=opt.tip(r);
      tipEl.style.opacity=1;
      var px=g.X(i), tw=tipEl.offsetWidth, th=tipEl.offsetHeight;
      var left=px+12;
      if(left+tw > W-4) left=px-tw-12;
      tipEl.style.left=Math.max(2,left)+'px';
      tipEl.style.top=Math.max(2, g.Y(opt.val(r))-th-10)+'px';
    }
    function pick(ev){
      if(!rows.length || !g) return;
      var rect=cv.getBoundingClientRect();
      var xp=(ev.touches?ev.touches[0].clientX:ev.clientX)-rect.left;
      var n=rows.length, iw=g.W-padL-padR;
      var idx=Math.round((xp-padL)/(iw||1)*(n-1));
      idx=Math.max(0,Math.min(n-1,idx));
      if(idx===hi){ showTip(idx); return; }
      hi=idx; draw(); showTip(idx);
    }
    cv.addEventListener('mousemove', pick);
    cv.addEventListener('mouseleave', function(){ hi=-1; tipEl.style.opacity=0; draw(); });
    cv.addEventListener('touchstart', pick, {passive:true});
    cv.addEventListener('touchmove', pick, {passive:true});
    cv.addEventListener('touchend', function(){ hi=-1; tipEl.style.opacity=0; draw(); });

    return {setRows:function(r){ rows=r; hi=-1; tipEl.style.opacity=0; draw(); }, redraw:draw};
  }

  function cumOf(rows, col){
    var out=[], acc=0;
    for(var i=0;i<rows.length;i++){ acc += rows[i][col]; out.push(acc); }
    return out;
  }

  var chart1 = makeChart({
    id:'c1', tipId:'tip1', type:'bar', zeroLine:true,
    h:Math.max(230, Math.min(340, Math.round(window.innerHeight*0.36))),
    padL:52, ticks:5, padRatio:0.12, up:RED, down:GRN, stroke:ACC,
    val:function(r){ return r[C_EFBIG]; },
    tickFmt:function(v){ return (v>0?'+':'') + Math.round(v); },
    overlay:{ val:function(r){ return r[C_EFNET]; }, color:'rgba(140,130,118,.55)', dash:[4,3] },
    tip:function(r){
      var c=(r[C_EFBIG]>=0?'up':'down');
      return '<div class="dt">'+r[0]+'</div>'+
        '<div class="row"><i>大单净额</i><b class="'+c+'">'+sign(r[C_EFBIG],1)+' 亿</b></div>'+
        '<div class="row"><i>主力净额</i><span>'+sign(r[C_EFNET],1)+' 亿</span></div>'+
        '<div class="row"><i>净申赎</i><span>'+sign(r[C_SUB],1)+' 亿</span></div>'+
        '<div class="row"><i>沪深300</i><span>'+nf(r[C_CLOSE],2)+(r[C_CLOSE]>=0?'':'')+'</span></div>';
    }
  });

  var chart2 = makeChart({
    id:'c2', tipId:'tip2', type:'bar', zeroLine:true, h:190,
    padL:52, ticks:4, padRatio:0.12, up:RED, down:GRN, stroke:ACC,
    val:function(r){ return r[C_HSNET]; },
    tickFmt:function(v){ return (v>0?'+':'') + Math.round(v); },
    overlay:{ val:function(r){ return r[C_CLOSE]; }, color:'rgba(120,110,100,.5)', dash:[4,3] },
    tip:function(r){
      var c=(r[C_HSNET]>=0?'up':'down');
      return '<div class="dt">'+r[0]+'</div>'+
        '<div class="row"><i>主力净额</i><b class="'+c+'">'+sign(r[C_HSNET],0)+' 亿</b></div>'+
        '<div class="row"><i>超大单</i><span>'+sign(r[C_HSBIG],0)+' 亿</span></div>'+
        '<div class="row"><i>沪深300</i><span>'+nf(r[C_CLOSE],2)+'</span></div>';
    }
  });

  var chart3 = makeChart({
    id:'c3', tipId:'tip3', type:'line', h:170,
    padL:52, ticks:4, padRatio:0.10, stroke:ACC,
    fill1:'rgba(184,113,78,.22)', fill2:'rgba(184,113,78,.01)', glow:'rgba(184,113,78,.16)',
    val:function(r){ return r[C_RATIO]; },
    tickFmt:function(v){ return v.toFixed(2)+'%'; },
    overlay:{ val:function(r){ return r[C_CLOSE]; }, color:'rgba(120,110,100,.5)', dash:[4,3] },
    tip:function(r){
      return '<div class="dt">'+r[0]+'</div>'+
        '<div class="row"><i>占比</i><b>'+nf(r[C_RATIO],3)+'%</b></div>'+
        '<div class="row"><i>ETF 规模</i><span>'+nf(r[C_SIZE],0)+' 亿</span></div>'+
        '<div class="row"><i>流通市值</i><span>'+nf(r[C_MV],0)+' 亿</span></div>'+
        '<div class="row"><i>沪深300</i><span>'+nf(r[C_CLOSE],2)+'</span></div>';
    }
  });

  /* ═══════ 事件榜 ═══════ */
  function chgOf(date){
    for(var k=0;k<S.length;k++){
      if(S[k][0]===date){ return k>0 ? (S[k][C_CLOSE]/S[k-1][C_CLOSE]-1)*100 : null; }
    }
    return null;
  }
  function evTable(list){
    var h = '<tr><th>日期</th><th>ETF 大单净额</th><th>主力净额</th><th>沪深300</th><th>当日涨跌</th></tr>';
    if(!list.length) return h + '<tr><td colspan="5" style="text-align:center;color:#8a837a;">区间内无</td></tr>';
    list.forEach(function(r){
      var chg = chgOf(r[0]);

           '<td class="amt '+c+'">'+sign(r[C_EFBIG],1)+' 亿</td>'+
           '<td>'+sign(r[C_EFNET],1)+' 亿</td>'+
           '<td>'+nf(r[C_CLOSE],2)+'</td>'+
           '<td class="'+(chg>=0?'up':'down')+'">'+(chg===null?'—':sign(chg,2)+'%')+'</td></tr>';
    });
    return h;
  }
  function renderEvents(rows){
    var buys = rows.filter(function(r){ return r[C_EFBIG] > 0; });
    var sells= rows.filter(function(r){ return r[C_EFBIG] < 0; });
    buys.sort(function(a,b){ return b[C_EFBIG] - a[C_EFBIG]; });

    document.getElementById('evBuy').innerHTML  = evTable(buys.slice(0,6));
    document.getElementById('evSell').innerHTML = evTable(sells.slice(0,6));
  }

  function render(){
    var rg = RANGES.filter(function(r){ return r.k===cur; })[0];
    var rows = slice(rg.days);
    var span = rows.length ? rows[0][0] + ' ~ ' + rows[rows.length-1][0] : '';
    document.getElementById('r1').textContent = span + '　' + rows.length + ' 个交易日';
    document.getElementById('r2').textContent = span;
    document.getElementById('r3').textContent = span;

    verdict();
    chart1.setRows(rows);
    chart2.setRows(rows);
    chart3.setRows(rows);
    renderEvents(rows);
  }

  // 口径说明
  document.getElementById('note').innerHTML =
    '<b>口径</b>：ETF 大单净额 = 25 只纯跟踪沪深300的场内 ETF 每日超大单净额合计（买 − 卖），' +
    '不含 300价值 / 成长 / 红利 / ESG / 增强 / 现金流 等策略型，也不含场外联接（资金已体现在 ETF 内，计入会重复）。' +
    '<p><b>怎么看国家队</b>：沪深300ETF 是政策性资金入场最常用的工具，其二级市场超大单净额的大额、连续、逆势流入，' +
    '通常对应托底性买入；反之连续大额流出常出现在反弹兑现阶段。这一指标是<b>观测近似</b>，' +
    '并非汇金持仓的直接披露——大单也可能来自保险、年金等机构，请结合连续性与价格背离一起看。</p>' +
    '<p><b>成分股资金流</b>：沪深300 当前 300 只成分股每日主力净额合计（主力 = 大单 + 超大单），' +
    '用于观察全市场资金与 ETF 大单是否同向。</p>' +
    '<p><b>两种口径要看清</b>：<b>大单净额</b>是主动买金额 − 主动卖金额，属于<b>流向</b>指标，含日内换手、会放大；' +
    '<b>净申赎</b>是份额变化对应的资金，反映<b>真实仓位增减</b>。两者同向时结论最可靠，背离时以净申赎为准。</p>' +
    '<p><b>净申赎</b>：由 ETF 规模日变化扣除指数涨跌贡献倒推。⚠ 历史日的 ETF 份额是季报份额与实测份额之间的线性插值，' +
    '因此这一列的<b>单日值不代表真实申赎</b>（会呈现均匀增长/下滑的平滑形状，锚点切换日还会出现跳变），只能看量级与方向，' +
    '<b>不作为结论依据</b>。结论只用大单资金、成分股资金、指数价格三类逐日实测数据。</p>' +
    '<p><b>占比</b>：ETF 合计规模 ÷ 沪深300 流通市值（收盘点位 × 每点流通市值系数）。</p>' +
    '<p>数据源：新浪财经历史资金流、腾讯行情。数据截至 <b>' + (D.asof||'—') + '</b>，' +
    '更新于 ' + (D.updated||'—') + '，每日收盘后自动更新一次。</p>';

  render();

  var rt;
  window.addEventListener('resize', function(){
    clearTimeout(rt); rt = setTimeout(render, 150);
  });
  if(window.ResizeObserver){
    var ro = new ResizeObserver(function(){
      clearTimeout(rt); rt = setTimeout(function(){ chart1.redraw(); chart2.redraw(); chart3.redraw(); }, 120);
    });
    ro.observe(document.body);
  }
})();
</script>
