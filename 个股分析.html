function card(title,src,body,span){
  const el=document.createElement('div');el.className='card '+span;
  el.innerHTML=`<h3><span class="bar"></span>${title}${src?`<span class="src">来源：${src}</span>`:''}</h3><div class="card-body">${body}</div>`;

}

function svgEl(id){return document.getElementById(id);}
function drawPe(){
  const svg=svgEl('svgPe');if(!svg)return;const W=680,H=200,pad=30;
  const rows=DATA.ths_eps.rows;if(!rows.length){svg.innerHTML='<text x="20" y="30" fill="#8b98a9">无一致预期数据</text>';return;}
  const price=DATA.quote.price;const pe0=price/rows[0].avg;
  const pes=rows.map(r=>price/r.avg);
  const maxV=Math.max(30,Math.max(...pes)*1.1),minV=Math.min(...pes)*0.9;
  const X=i=>pad+i*(W-2*pad)/(pes.length-1);
  const Y=v=>H-pad-(v-minV)/(maxV-minV)*(H-2*pad);
  let s=`<line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="${C.line}"/>`;
  s+=`<line x1="${pad}" y1="${Y(30)}" x2="${W-pad}" y2="${Y(30)}" stroke="${C.gold}" stroke-dasharray="4 4"/><text x="${W-pad-44}" y="${Y(30)-4}" fill="${C.gold}" font-size="10">30x锚</text>`;
  pes.forEach((v,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${C.cyan}"/><text x="${X(i)}" y="${Y(v)-9}" fill="${C.ink}" font-size="10" text-anchor="middle">${v.toFixed(1)}</text><text x="${X(i)}" y="${H-pad+15}" fill="${C.sub}" font-size="9" text-anchor="middle">${rows[i].year}E</text>`;});
  // 连接线
  for(let i=1;i<pes.length;i++){s+=`<line x1="${X(i-1)}" y1="${Y(pes[i-1])}" x2="${X(i)}" y2="${Y(pes[i])}" stroke="${C.cyan}" stroke-width="1.5" opacity=".6"/>`;}
  svg.innerHTML=s;
}
function drawFlow(){
  const svg=svgEl('svgFlow');if(!svg)return;const W=680,H=210,pad=24;
  const arr=DATA.fundflow.main_net;if(!arr.length){svg.innerHTML='<text>无数据</text>';return;}

      let yrs=0,et=e0;while(et&&price/et>30&&yrs<20){et*=1+cagr;yrs++;}o.years_to_30=yrs;
      o.target30_price=+(30*e0).toFixed(2);o.discount_vs_30=+((o.target30_price-price)/o.target30_price*100).toFixed(1);}}
  const mn=DATA.fundflow.main_net||[];
  o.cum_120=mn.reduce((a,b)=>a+b,0);o.cum_20=mn.slice(-20).reduce((a,b)=>a+b,0);
  o.cum_10=mn.slice(-10).reduce((a,b)=>a+b,0);o.cum_5=mn.slice(-5).reduce((a,b)=>a+b,0);
  const rz=DATA.margin.rzye||[];if(rz.length>=2){o.margin_chg_yi=+((rz[rz.length-1]-rz[0])/1e8).toFixed(2);o.margin_latest_yi=+(rz[rz.length-1]/1e8).toFixed(2);}
  const hn=DATA.holders.nums||[];if(hn.length>=2){o.holder_chg_pct=+((hn[hn.length-1]-hn[0])/hn[0]*100).toFixed(2);o.holder_latest=hn[hn.length-1];}
  return o;
}

/* ---------- 启动 ---------- */
render();
