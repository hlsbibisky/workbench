<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>八字能量分布 · 核心驱动力</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#f3ecdc; --paper-2:#fbf6ea; --ink:#3a3329; --ink-soft:#8a7c68;
    --line:#e2d4bb; --accent:#b8714e;
    --yong-ink:#5f7a45; --yong-bd:#c9d8b6; --yong-bg:#f1f6e9;
    --ji-ink:#b15538;  --ji-bd:#e6c6b2; --ji-bg:#fbeee8;
    /* 五行色 */
    --wx-mu:#5b8c7b; --wx-huo:#c8694e; --wx-tu:#b8924a;
    --wx-jin:#8a837a; --wx-shui:#4a7fb8;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    font-family:'Noto Sans SC', system-ui, sans-serif; color:var(--ink);
    min-height:100vh;
    background:radial-gradient(130% 110% at 50% -10%, #fbf5e9 0%, #f3ecdc 55%, #ece1cb 100%);
    display:flex; flex-direction:column; align-items:center;
    padding:26px 16px 60px;
  }
  .wrap{ width:100%; max-width:1080px; }

  .page-h{ text-align:center; margin-bottom:6px; }
  .page-h h1{ font-family:'Noto Serif SC',serif; font-size:26px; letter-spacing:3px; margin:0; color:var(--ink); }
  .page-h .sub{ font-size:13px; color:var(--ink-soft); letter-spacing:2px; margin-top:6px; }
  .rule{ width:140px; height:1px; margin:14px auto 22px; background:linear-gradient(90deg,transparent,var(--accent),transparent); }

  /* 顶部标签切换 */
  .tabs{ display:flex; gap:10px; justify-content:center; margin:0 0 24px; flex-wrap:wrap; }
  .tab{ font-family:'Noto Serif SC',serif; font-size:15px; letter-spacing:2px; color:var(--ink-soft);
    background:var(--paper-2); border:1px solid var(--line); border-radius:30px; padding:9px 30px;
    cursor:pointer; transition:all .2s ease; }
  .tab:hover{ color:var(--accent); border-color:var(--accent); }
  .tab.active{ color:#fff; background:var(--accent); border-color:var(--accent);
    box-shadow:0 8px 18px -8px rgba(184,113,78,.7); }

  /* 输入卡片 */
  .input-card{ background:var(--paper-2); border:1px solid var(--line); border-radius:16px;
    padding:22px 24px; max-width:640px; margin:0 auto 26px; box-shadow:0 6px 20px rgba(120,90,60,.10); }
  .input-card h3{ font-family:'Noto Serif SC',serif; font-size:16px; margin:0 0 16px; color:var(--accent); letter-spacing:1px; }
  .frow{ display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .frow label{ font-family:'Noto Serif SC',serif; font-size:14px; width:74px; flex:0 0 74px; color:var(--ink); }
  .frow input, .frow select{ flex:1; min-width:160px; padding:10px 12px; border-radius:10px;
    border:1px solid var(--line); background:#fff; font-family:'Noto Sans SC',sans-serif; font-size:14px; color:var(--ink); }
  .gen-btn{ display:block; width:100%; padding:13px; border:none; border-radius:11px; background:var(--accent);
    color:#fff; font-family:'Noto Serif SC',serif; font-size:16px; letter-spacing:3px; cursor:pointer; margin-top:8px; }
  .gen-btn:hover{ background:#a6623f; }
  .tip{ font-size:12px; color:var(--ink-soft); text-align:center; margin-top:12px; line-height:1.7; }

  /* 结果区 */
  #result{ display:none; }
  #result.on{ display:block; animation:fade .3s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  /* —— 能量分布视图 —— */
  .bazi-bar{ text-align:center; background:var(--paper-2); border:1px solid var(--line);
    border-radius:14px; padding:16px; margin-bottom:22px; }
  .bazi-bar .pillars{ font-family:'Noto Serif SC',serif; font-size:22px; letter-spacing:6px; color:var(--ink); }
  .bazi-bar .pillars b{ color:var(--accent); }
  .bazi-bar .dm{ font-size:13px; color:var(--ink-soft); margin-top:8px; letter-spacing:1px; }

  .cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(186px,1fr)); gap:16px; }
  .ec{ background:var(--paper-2); border:1px solid var(--line); border-radius:16px; padding:18px 16px;
    position:relative; overflow:hidden; transition:.18s; border-top:4px solid var(--c, var(--accent)); }
  .ec:hover{ transform:translateY(-3px); box-shadow:0 10px 26px rgba(120,90,60,.16); }
  .ec .wx{ position:absolute; top:8px; right:12px; font-family:'Noto Serif SC',serif; font-size:38px;
    color:var(--c, var(--accent)); opacity:.16; font-weight:700; }
  .ec .god{ font-family:'Noto Serif SC',serif; font-size:13px; color:var(--c, var(--accent)); letter-spacing:2px; }
  .ec .name{ font-family:'Noto Serif SC',serif; font-size:17px; margin:2px 0 4px; color:var(--ink); }
  .ec .godself{ font-size:11.5px; color:var(--sub, #8a837a); margin:0 0 12px; letter-spacing:.5px; }
  .ec .godself b{ color:var(--c, var(--accent)); font-weight:600; }
  .ec .energy{ font-family:'Noto Serif SC',serif; font-size:46px; font-weight:700; line-height:1;
    color:var(--c, var(--accent)); }
  .ec .energy small{ font-size:14px; font-weight:400; color:var(--ink-soft); margin-left:6px; letter-spacing:1px; }
  .ec .intensity{ font-size:13px; margin:8px 0 12px; font-weight:600; }
  .ec .intensity.up{ color:var(--yong-ink); }
  .ec .intensity.down{ color:var(--ji-ink); }
  .ec .tags{ margin-bottom:12px; display:flex; flex-wrap:wrap; gap:6px; }
  .ec .tg{ font-size:11px; padding:3px 10px; border-radius:11px; }
  .tg.core{ background:var(--accent); color:#fff; }
  .tg.yong{ background:var(--yong-bg); color:var(--yong-ink); border:1px solid var(--yong-bd); }
  .tg.ji{ background:var(--ji-bg); color:var(--ji-ink); border:1px solid var(--ji-bd); }
  .ec .desc{ font-size:12.5px; line-height:1.75; color:var(--ink-soft); border-top:1px dashed var(--line); padding-top:10px; }

  .note{ font-size:12px; color:var(--ink-soft); text-align:center; margin-top:22px; line-height:1.8;
    background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:14px 18px; }
  .note b{ color:var(--accent); }

  /* —— 核心驱动力视图 —— */
  .core-card{ background:linear-gradient(135deg,#fffdf9,#f6ece2); border:1px solid var(--line);
    border-radius:16px; padding:22px 24px; margin-bottom:18px; display:flex; gap:20px; align-items:flex-start;
    border-left:5px solid var(--accent); }
  .core-card .icon{ font-size:40px; line-height:1; }
  .core-card .body{ flex:1; }
  .core-card .k{ font-size:12px; letter-spacing:2px; color:var(--ink-soft); }
  .core-card .t{ font-family:'Noto Serif SC',serif; font-size:23px; font-weight:700; color:var(--accent); margin:2px 0 8px; }
  .core-card .d{ font-size:14px; color:var(--ink); line-height:1.7; }
  .core-card .pct{ margin-left:auto; text-align:center; flex:0 0 auto; }
  .core-card .pct b{ font-family:'Noto Serif SC',serif; font-size:30px; color:var(--yong-ink); }
  .core-card .pct span{ font-size:12px; color:var(--ink-soft); display:block; }

  .drivebars{ background:var(--paper-2); border:1px solid var(--line); border-radius:14px; padding:16px 20px; margin-bottom:18px; }
  .drivebars h3{ font-family:'Noto Serif SC',serif; font-size:14px; letter-spacing:1px; color:var(--accent); margin:0 0 14px; }
  .db{ display:flex; align-items:center; gap:12px; margin:10px 0; font-size:13px; }
  .db .nm{ width:96px; font-family:'Noto Serif SC',serif; }
  .db .bar{ flex:1; height:16px; background:var(--line); border-radius:9px; overflow:hidden; }
  .db .bar i{ display:block; height:100%; border-radius:9px; transition:width .4s ease; }
  .db .pc{ width:46px; text-align:right; color:var(--ink-soft); }
  .db.core .nm{ color:var(--accent); font-weight:600; }
  .db.yong .nm{ color:var(--yong-ink); font-weight:600; }
  .db.ji .nm{ color:var(--ji-ink); }

  .grid2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:18px; }
  .box{ background:var(--paper-2); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .box h3{ font-family:'Noto Serif SC',serif; font-size:14px; letter-spacing:1px; color:var(--accent); margin:0 0 10px; }
  .box p{ font-size:13.5px; margin:0; color:var(--ink); line-height:1.7; }
  .tag{ display:inline-block; margin:3px 4px 0 0; padding:4px 12px; border-radius:11px; background:var(--paper); color:var(--ink); font-size:13px; }
  .tag.wx{ background:#efe6da; }
  .tag.yong{ background:var(--yong-bg); color:var(--yong-ink); border:1px solid var(--yong-bd); }

  .read{ background:var(--paper-2); border:1px solid var(--line); border-radius:14px; padding:18px 22px; font-size:14px; line-height:1.9; }
  .read .tt{ font-family:'Noto Serif SC',serif; font-size:15px; font-weight:700; display:block; margin:14px 0 6px; letter-spacing:1px; }
  .read .tt:first-child{ margin-top:0; }
  .read .hl{ color:var(--accent); font-weight:600; }

  @media (max-width:680px){
    .core-card{ flex-direction:column; gap:12px; padding:18px 16px; }
    .core-card .icon{ font-size:32px; }
    .core-card .pct{ margin-left:0; text-align:left; }
    .core-card .pct b{ font-size:26px; }
    .db .nm{ width:72px; }
    .db .pc{ width:40px; }
    .grid2{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-h">
    <h1>八字能量分布</h1>
    <div class="sub">输入出生信息 → 看五种驱动力的能量值与核心驱动力</div>
  </div>
  <div class="rule"></div>

  <div class="tabs">
    <button class="tab active" data-view="energy" onclick="switchView('energy')">能量分布</button>
    <button class="tab" data-view="core" onclick="switchView('core')">核心驱动力</button>
  </div>

  <div class="input-card">
    <h3>输入出生信息</h3>
    <div class="frow">
      <label>出生日期</label>
      <input type="date" id="birth" value="1995-06-15" />
    </div>
    <div class="frow">
      <label>出生时辰</label>
      <select id="hour">
        <option value="0">子时（23:00–00:59）</option>
        <option value="2">丑时（01:00–02:59）</option>
        <option value="4" selected>寅时（03:00–04:59）</option>
        <option value="6">卯时（05:00–06:59）</option>
        <option value="8">辰时（07:00–08:59）</option>
        <option value="10">巳时（09:00–10:59）</option>
        <option value="12">午时（11:00–12:59）</option>
        <option value="14">未时（13:00–14:59）</option>
        <option value="16">申时（15:00–16:59）</option>
        <option value="18">酉时（17:00–18:59）</option>
        <option value="20">戌时（19:00–20:59）</option>
        <option value="22">亥时（21:00–22:59）</option>
      </select>
    </div>
    <div class="frow">
      <label>性别</label>
      <select id="gender">
        <option value="男">男</option>
        <option value="女" selected>女</option>
      </select>
    </div>
    <button class="gen-btn" id="genBtn">生 成 能 量 分 布</button>
    <div class="tip">能量值为基于八字四柱天干地支权重的相对评分（整数）。强度＝相对五种均值的偏离。子时按早子时计，精确分钟不影响模板结论。</div>
  </div>

  <div id="result">
    <!-- 视图一：能量分布 -->
    <div id="view-energy">
      <div class="bazi-bar">
        <div class="pillars" id="pillars"></div>
        <div class="dm" id="dmLine"></div>
      </div>
      <div class="cards" id="cards"></div>
      <div class="note">
        <b>怎么读：</b>能量值越高，该驱动力在这人命局里越活跃。强度为正（绿）表示偏强，为负（红）表示偏弱。
        标「<b>核心</b>」＝最强驱动力；标「<b>过度</b>」＝该驱动力过强或过弱（极端态，易显失衡面）。
      </div>
    </div>

    <!-- 视图二：核心驱动力 -->
    <div id="view-core" style="display:none">
      <div id="coreOut"></div>
    </div>
  </div>
</div>

<script src="bazi_engine.js"></script>
<script>
/* 十神组 → 驱动力信息（与 驱动力.html 的 DRIVERS 映射一致） */
const DRIVER_INFO = {
  '比劫': { name:'自我价值感驱动', element:'木', color:'var(--wx-mu)', icon:'🌱', self:'我自己',
    yong:'靠赚钱与被需要确认价值、能主动表达需求、会逗母亲开心',
    ji:'不停找事证明自己、忍受不了控制欲、自私、不配得感' },
  '食伤': { name:'情感驱动', element:'火', color:'var(--wx-huo)', icon:'🔥', self:'孩子',
    yong:'有情、容易开心、共情强、旺夫、社牛',
    ji:'带怨念嗔恨、最会吵架、翻旧账、在男人身上找情变怨恨' },
  '财':   { name:'物质驱动', element:'土', color:'var(--wx-tu)', icon:'⛰️', self:'爸爸 · 男命的伴侣',
    yong:'花钱开心、招感财富、对价值敏感、适合价值投资',
    ji:'眼里只有钱、以借钱/目的交友恋爱' },
  '官杀': { name:'责任感驱动', element:'金', color:'var(--wx-jin)', icon:'🛡️', self:'女命的伴侣',
    yong:'最靠谱、规划目标、领导力驾驭、稳定伴侣=意义',
    ji:'回避责任、讨厌被要求、男回避（承担不了责任）' },
  '印':   { name:'精神驱动', element:'水', color:'var(--wx-shui)', icon:'💧', self:'妈妈',
    yong:'理性目标感、智慧、杀印相生成就霸业、朋友精神同频',
    ji:'无情无爱、忍受不了陪伴/控制、攻击性爱、最易被渣男玩弄' },
};
/* 五行顺序：木→火→土→金→水 */
const ORDER = ['比劫','食伤','财','官杀','印'];
const WX_COLOR = {'木':'#5b8c7b','火':'#c8694e','土':'#b8924a','金':'#8a837a','水':'#4a7fb8'};

const G = BaziEngine.GAN, Z = BaziEngine.ZHI;
const gz = p => G[p.gan] + Z[p.zhi];

let CURRENT = null; // 缓存当前计算结果

function switchView(v){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  document.getElementById('view-energy').style.display = v==='core' ? 'none' : 'block';
  document.getElementById('view-core').style.display = v==='core' ? 'block' : 'none';
}

function compute(){
  const dt = document.getElementById('birth').value;
  if(!dt){ alert('请先选择出生日期'); return; }
  const [y,m,d] = dt.split('-').map(Number);
  const hh = Number(document.getElementById('hour').value);
  const gender = document.getElementById('gender').value;
  const bz = BaziEngine.computeBazi({ y, m, d, hh, mm:0, gender });

  // 四柱展示
  document.getElementById('pillars').innerHTML =
    `${gz(bz.year)}　${gz(bz.month)}　<b>${gz(bz.day)}</b>　${gz(bz.hour)}`;
  document.getElementById('dmLine').textContent =
    `日主 ${G[bz.dayMaster]}${['木','火','土','金','水'][bz.dmWx]}　·　命局${bz.strength.level}`;

  // 五驱动力能量值（子平旺衰法：月令+通根+同类+印绶，整数无单位）
  const res = BaziEngine.computeDriveEnergies(bz);
  const energies = ORDER.map(k => res.energies[k]);
  const mean = energies.reduce((a,b)=>a+b,0) / 5;
  const maxE = Math.max(...energies);
  const EXTREME_HI = ['偏强','强','极强'];
  const EXTREME_LO = ['极弱','弱','偏弱'];

  const cardsHtml = ORDER.map((k,i)=>{
    const info = DRIVER_INFO[k];
    const e = energies[i];
    const level = res.levels[k];
    const intensity = Math.round((e - mean) / mean * 100);  // 强度（相对均值偏离%）
    // 标签判定：以旺衰等级辨 用 / 过度（过强或过弱均为过度）
    const tags = [];
    let state = 'yong';
    if(e === maxE) tags.push('<span class="tg core">核心</span>');
    if(EXTREME_HI.includes(level)){ tags.push('<span class="tg ji">过强·过度</span>'); state='ji'; }
    else if(EXTREME_LO.includes(level)){ tags.push('<span class="tg ji">过弱·过度(不足)</span>'); state='ji'; }
    if(state==='yong' && !tags.length) tags.push('<span class="tg yong">平衡·用</span>');
    const desc = state==='ji' ? info.ji : info.yong;

    return `<div class="ec" style="--c:${info.color}">
      <div class="wx">${info.element}</div>
      <div class="god">${k}</div>
      <div class="name">${info.name}</div>
      <div class="godself">${k} 代表：<b>${info.self||'—'}</b></div>
      <div class="energy">${e}<small>能量值</small></div>
      <div class="intensity ${intensity>=0?'up':'down'}">强度 ${level}（${intensity>=0?'+':''}${intensity}%）</div>
      <div class="tags">${tags.join('')}</div>
      <div class="desc">${desc}</div>
    </div>`;
  }).join('');
  document.getElementById('cards').innerHTML = cardsHtml;

  // 缓存并渲染核心驱动力视图
  CURRENT = { bz, res, energies, mean, maxE };
  renderCore();

  document.getElementById('result').classList.add('on');
  document.getElementById('result').scrollIntoView({behavior:'smooth', block:'start'});
}

function renderCore(){
  if(!CURRENT) return;
  const { bz, res, energies, mean, maxE } = CURRENT;
  // 核心驱动力 = 命局「核心用神」（喜用十神第一顺位），由身强身弱判定，非能量值最高
  const dr = bz.drive;
  const coreKey = dr.core;          // 核心用神对应十神
  const secondKey = dr.second;      // 喜用中次高（或忌神中最弱者）
  const coreInfo = DRIVER_INFO[coreKey];
  const secondInfo = DRIVER_INFO[secondKey];
  const total = energies.reduce((a,b)=>a+b,0) || 1;

  // 五驱动力分布条（按能量值占比）——仅作「分布」展示，核心高亮由用神决定
  const bars = ORDER.map((k,i)=>{
    const e = energies[i];
    const pct = Math.round(e/total*100);
    const isCore = k===coreKey;
    const isYong = bz.yongshen.xiTen.includes(k);
    const cls = isCore ? 'core' : (isYong ? 'yong' : 'ji');
    const label = isCore ? '★核心用神' : (isYong ? '喜用' : '忌神');
    return `<div class="db ${cls}"><span class="nm">${k}</span>
      <span class="bar"><i style="width:${pct}%;background:${WX_COLOR[DRIVER_INFO[k].element]}"></i></span>
      <span class="pc">${pct}%</span>
      <span style="width:62px;font-size:11px;color:${isCore?'var(--accent)':(isYong?'var(--yong-ink)':'var(--ji-ink)')}">${label}</span></div>`;
  }).join('');

  // 日主天性
  const dmNature = BaziEngine.DAY_MASTER[G[bz.dayMaster]];
  // 成长方向（用神）
  const growTen = bz.yongshen.xiTen;
  const growWx = bz.yongshen.xiWx.map(i=>BaziEngine.WX_NAME[i]);
  // 人生主题（基于用神视角）
  const theme = dr.theme;

  document.getElementById('coreOut').innerHTML = `
    <div class="core-card">
      <div class="icon">${coreInfo.icon}</div>
      <div class="body">
        <div class="k">核心驱动力 ＝ 命局「核心用神」</div>
        <div class="t">${coreInfo.name}（${coreKey}）</div>
        <div class="d">${coreInfo.yong}</div>
      </div>
      <div class="pct"><b>第${['一','二','三','四','五'][bz.yongshen.xiTen.indexOf(coreKey)+1]||'一'}喜用</b><span>用神顺位</span></div>
    </div>
    <div class="note" style="margin-top:0;margin-bottom:18px;background:var(--yong-bg);border-color:var(--yong-bd)">
      <b>概念说明：</b>核心驱动力不是「命里出现最多的十神」，而是命局<span style="color:var(--yong-ink)">最需要、最能平衡日主</span>的「喜用十神（用神）」。
      它由日主身强身弱决定——身强喜克泄耗（官杀/食伤/财），身弱喜生扶（印/比劫）。能量值高低只反映该驱动力的活跃度，不决定核心。
    </div>

    <div class="drivebars"><h3>五类驱动力分布（按能量值）</h3>${bars}</div>

    <div class="grid2">
      <div class="box"><h3>次要驱动力（喜用次位）</h3>
        <p><span class="tag yong">${secondInfo.name}（${secondKey}）</span></p>
        <p style="margin-top:8px;color:var(--ink-soft);font-size:12.5px;">${secondInfo.yong}</p></div>
      <div class="box"><h3>日主天性</h3>
        <p>日主 <b>${G[bz.dayMaster]}${dmNature.wx}</b>（${dmNature.yin==='阳'?'阳':'阴'}）· 命局${bz.strength.level}</p>
        <p style="margin-top:6px;color:var(--ink-soft);font-size:12.5px;">${dmNature.txt}</p></div>
      <div class="box"><h3>成长方向（用神）</h3>
        <p><span class="tag yong">${growTen.join('</span><span class="tag yong">')}</span></p>
        <p style="margin-top:8px;color:var(--ink-soft);font-size:12.5px;">补运五行：
          <span class="tag wx">${growWx.join('</span><span class="tag wx">')}</span></p></div>
    </div>

    <div class="read">
      <span class="tt">人生主题</span>
      <p>${theme}</p>
      <span class="tt">给你的小建议</span>
      <p>你被「<span class="hl">${coreInfo.name}</span>」这一用神推动，它是你补足命局、舒展天性的通道；「${secondInfo.name}」作为喜用次位，同样值得经营。
        在 ${growTen.join('、')} 上多给自己空间与练习，动力会更稳、更久。</p>
      <span class="tt">与六亲的具体关系</span>
      <p>如「需要妈妈的什么」「伴侣给你什么」等，见驱动力页的「六亲关系矩阵」与十神关系图。</p>
    </div>`;
}

document.getElementById('genBtn').onclick = compute;

compute();
</script>
