<script>
const IDB_NAME='food_img_db', IDB_STORE='images';
const SB_URL='https://vienajheerbsmckfzkzo.supabase.co/rest/v1/workbench_sync';
const SB_KEY='sb_publishable_b6t_c2L2j8wB7Vgp9lWGZw_HqHVFQzF';
const LIBS=[
  {key:'food_menu',   name:'菜品库'},
  {key:'food_drinks', name:'饮品库'},
  {key:'food_snacks', name:'零食库'},
];
let __idb=null, __idbHave=new Set();
let IMPORTED=[];                 // {id,name,w,h,base64}
let STATE={};                    // key -> array of items (每项含 image 字段)
let curLib=LIBS[0].key;
let pickCtx=null;                // {idx, libKey}

/* ---------- IndexedDB ---------- */
function idbOpen(){return new Promise((res,rej)=>{try{if(__idb)return res(__idb);const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE);};r.onsuccess=e=>{__idb=e.target.result;res(__idb);};r.onerror=e=>rej(e);}catch(e){rej(e);}});}
async function idbPut(id,v){try{if(__idbHave.has(id))return;const db=await idbOpen();await new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(v,id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});__idbHave.add(id);}catch(e){log('idbPut 失败 '+id);}}
async function idbGet(id){try{const db=await idbOpen();return await new Promise((res)=>{const tx=db.transaction(IDB_STORE,'readonly');const rq=tx.objectStore(IDB_STORE).get(id);rq.onsuccess=()=>res(rq.result||'');rq.onerror=()=>res('');});}catch(e){return '';}}
async function idbGetAll(){try{const db=await idbOpen();return await new Promise((res)=>{const tx=db.transaction(IDB_STORE,'readonly');const rq=tx.objectStore(IDB_STORE).getAll();rq.onsuccess=()=>res(rq.result||{});rq.onerror=()=>res({});});}catch(e){return {};}}
async function idbDel(id){try{__idbHave.delete(id);const db=await idbOpen();await new Promise((res)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>res();});}catch(e){}}
async function idbClear(){try{const db=await idbOpen();await new Promise((res)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).clear();tx.oncomplete=()=>res();tx.onerror=()=>res();});__idbHave.clear();}catch(e){}}

/* ---------- 工具 ---------- */
function log(s){const el=document.getElementById('log');el.textContent+='\n'+s;el.scrollTop=el.scrollHeight;}
function norm(s){(s||'').replace(/\s+/g,'').toLowerCase();return (s||'').replace(/\s+/g,'').toLowerCase();}
function imgIdOf(ref){return ref&&ref.startsWith('idb://')?ref.slice(6):'';}
function readLib(key){try{return JSON.parse(localStorage.getItem(key)||'[]');}catch(e){return [];}}
function writeLib(key,arr){localStorage.setItem(key,JSON.stringify(arr));}

/* ---------- 读取三库 ---------- */
function loadLibs(){
  STATE={};
  LIBS.forEach(L=>{ STATE[L.key]=readLib(L.key); });
  renderTabs(); renderList();
  updateStat();
}
function updateStat(){
  let total=0,matched=0;
  LIBS.forEach(L=>{(STATE[L.key]||[]).forEach(it=>{total++; if(it&&it.image&&it.image.startsWith('idb://'))matched++;});});
  document.getElementById('stat').textContent=`已导入 ${IMPORTED.length} 张 · 三库 ${total} 项 / 已配 ${matched} 项`;
  const has=IMPORTED.length>0;
  document.getElementById('btnMatch').disabled=!has;
  document.getElementById('btnBackup').disabled=!has && matched===0;
  document.getElementById('btnPush').disabled=matched===0;
  document.getElementById('btnClearCloud').disabled=matched===0 && IMPORTED.length===0;
}

/* ---------- 导入原图（不压缩） ---------- */
document.getElementById('folder').addEventListener('change',async e=>{
  const files=[...e.target.files].filter(f=>/image\//.test(f.type));
  if(!files.length){log('未选中图片文件');return;}
  if(document.getElementById('clearFirst').checked){
    if(!confirm('将清空本地旧图库（IndexedDB 图片 + 三库图片引用）后再导入。确定？\n（云端将在你点「同步云端」后才被清空）')){return;}
    await idbClear();
    LIBS.forEach(L=>{(STATE[L.key]||[]).forEach(it=>{if(it)it.image='';});LIBS.forEach(L=>writeLib(L.key,STATE[L.key]));});
    log('已清空本地旧图库');
  }
  IMPORTED=[];
  log('开始导入 '+files.length+' 张原图（不压缩）…');
  let ok=0;
  for(const f of files){
    const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});
    const dim=await new Promise(r=>{const im=new Image();im.onload=()=>r([im.naturalWidth,im.naturalHeight]);im.onerror=()=>r([0,0]);im.src=b64;});
    const id='imp_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
    IMPORTED.push({id,name:f.name,w:dim[0],h:dim[1],base64:b64});
    await idbPut(id,b64); ok++;
  }
  const nmap={}; IMPORTED.forEach(p=>nmap[p.id]=p.name);
  try{ localStorage.setItem('food_img_names', JSON.stringify(nmap)); }catch(e){}
  log('导入完成：'+ok+' 张（文件名已记录，刷新后仍可自动匹配）');
  updateStat();
  renderList();
  autoMatch(true);
});

/* ---------- 自动预匹配（按文件名） ---------- */
function autoMatch(silent){
  let n=0;
  LIBS.forEach(L=>{
    (STATE[L.key]||[]).forEach(it=>{
      if(!it||!it.name)return;
      const nm=norm(it.name);
      let hit=null;
      // 1) 精确：文件名(去扩展) == 条目名
      hit=IMPORTED.find(p=>norm(p.name.replace(/\.[^.]+$/,''))===nm);
      // 2) 文件名以条目名开头
      if(!hit)hit=IMPORTED.find(p=>norm(p.name.replace(/\.[^.]+$/,'').replace(/[0-9]+$/,'')).startsWith(nm));
      // 3) 条目名包含文件名(去扩展)
      if(!hit)hit=IMPORTED.find(p=>nm.includes(norm(p.name.replace(/\.[^.]+$/,''))));
      if(hit){ it.image='idb://'+hit.id; it.__match='auto'; n++; }
    });
  });
  LIBS.forEach(L=>writeLib(L.key,STATE[L.key]));
  log('自动预匹配 '+n+' 项（请逐条核对，错的用「选图」改）');
  renderList(); updateStat();
}
document.getElementById('btnMatch').addEventListener('click',()=>autoMatch(false));

/* ---------- 渲染 ---------- */
function renderTabs(){
  const el=document.getElementById('tabs');el.innerHTML='';
  LIBS.forEach(L=>{
    const t=document.createElement('div');t.className='tab'+(L.key===curLib?' on':'');
    const cnt=(STATE[L.key]||[]).filter(it=>it&&it.image&&it.image.startsWith('idb://')).length;
    t.textContent=L.name+' ('+cnt+'/'+(STATE[L.key]||[]).length+')';
    t.onclick=()=>{curLib=L.key;renderTabs();renderList();};
    el.appendChild(t);
  });
}
async function renderList(){
  const el=document.getElementById('list');el.innerHTML='';
  const arr=STATE[curLib]||[];
  for(let i=0;i<arr.length;i++){
    const it=arr[i];if(!it)continue;
    const row=document.createElement('div');row.className='row';
    const img=document.createElement('img');img.className='thumb';
    if(it.image&&it.image.startsWith('idb://')){const b=await idbGet(imgIdOf(it.image));img.src=b||'';}else{img.removeAttribute('src');img.style.background='#efe9df';}
    const meta=document.createElement('div');meta.className='meta';
    const nm=document.createElement('div');nm.className='nm';nm.textContent=it.name||'(无名)';
    const tag=document.createElement('div');tag.className='tag '+(it.__match==='auto'?'auto':it.image?'manual':'');
    tag.textContent=it.image&&it.image.startsWith('idb://')?(it.__match==='auto'?'已自动匹配 · 请核对':'已手动配图'):'未配图';
    meta.appendChild(nm);meta.appendChild(tag);
    const act=document.createElement('div');act.className='act';
    const b1=document.createElement('button');b1.className='ghost';b1.textContent='选图';
    b1.onclick=()=>openPicker(i,curLib);
    const b2=document.createElement('button');b2.className='danger';b2.textContent='清除';
    b2.onclick=()=>{it.image='';it.__match='';writeLib(curLib,arr);renderList();renderTabs();updateStat();};
    act.appendChild(b1);act.appendChild(b2);
    row.appendChild(img);row.appendChild(meta);row.appendChild(act);
    el.appendChild(row);
  }
}

/* ---------- 选图弹窗 ---------- */
function openPicker(idx,libKey){
  pickCtx={idx,libKey};
  const L=LIBS.find(x=>x.key===libKey);
  document.getElementById('pickerTitle').textContent='为「'+L.name+' · '+(STATE[libKey][idx].name||'')+'」选图';
  const g=document.getElementById('pgrid');g.innerHTML='';
  IMPORTED.forEach(p=>{
    const c=document.createElement('div');c.className='pimg';
    const im=document.createElement('img');im.src=p.base64;c.appendChild(im);
    const res=document.createElement('div');res.className='res';res.textContent=(p.w||'?')+'×'+(p.h||'?');
    c.appendChild(res);
    const cap=document.createElement('div');cap.className='cap';cap.textContent=p.name;
    c.appendChild(cap);
    c.onclick=()=>{STATE[libKey][idx].image='idb://'+p.id;STATE[libKey][idx].__match='';writeLib(libKey,STATE[libKey]);document.getElementById('picker').classList.remove('show');renderList();renderTabs();updateStat();};
    g.appendChild(c);
  });
  document.getElementById('picker').classList.add('show');
}
document.getElementById('pickerClose').onclick=()=>document.getElementById('picker').classList.remove('show');

/* ---------- 备份 ---------- */
document.getElementById('btnBackup').addEventListener('click',async()=>{
  const imgs={};IMPORTED.forEach(p=>imgs[p.id]=p.base64);
  const payload={exportedAt:new Date().toISOString(),libs:STATE,images:imgs};
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='图库备份_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  log('已下载整库备份（含原图，可恢复）');
});

/* ---------- 云端同步 ---------- */
async function expandRefsInString(v){
  if(typeof v!=='string'||!v.includes('idb://'))return v;
  let obj;try{obj=JSON.parse(v);}catch(e){return v;}
  await walkExpand(obj);return JSON.stringify(obj);
}
async function walkExpand(o){
  if(Array.isArray(o)){for(const it of o)await walkExpand(it);return;}
  if(o&&typeof o==='object'){for(const k in o){if(typeof o[k]==='string'&&o[k].startsWith('idb://')){const b=await idbGet(o[k].slice(6));if(b)o[k]=b;}else if(typeof o[k]==='object'){await walkExpand(o[k]);}}}
}
async function collectAllExpanded(){
  const out={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);let v=localStorage.getItem(k);if(/^food_/.test(k))v=await expandRefsInString(v);out[k]=v;}
  return out;
}
const SB_H={'Authorization':'Bearer '+SB_KEY,'apikey':SB_KEY,'Accept':'application/json'};
async function getCloudData(){
  const r=await fetch(SB_URL+'?id=eq.me',{headers:SB_H});
  if(!r.ok){log('读取云端失败 '+r.status);return null;}
  const j=await r.json();
  return (j[0]&&j[0].payload&&j[0].payload.data)||null;
}
async function upsertCloud(dataObj){
  const headers={'Authorization':'Bearer '+SB_KEY,'apikey':SB_KEY,'Content-Type':'application/json','Accept':'application/json','Prefer':'return=minimal'};
  const g=await fetch(SB_URL+'?id=eq.me&select=id',{headers});
  const exists=g.ok&&(await g.json()).length>0;
  const body=JSON.stringify({id:'me',payload:{data:dataObj,updatedAt:new Date().toISOString()}});
  if(exists){
    const r=await fetch(SB_URL+'?id=eq.me',{method:'PUT',headers,body});
    if(!r.ok)log('PUT 失败 '+r.status+' '+((await r.text())||'').slice(0,200));
    return r.ok;
  }else{
    const r=await fetch(SB_URL,{method:'POST',headers,body});
    if(!r.ok)log('POST 失败 '+r.status+' '+((await r.text())||'').slice(0,200));
    return r.ok;
  }
}
// 合并推送：以云端现有数据为底，本地 food_* 覆盖上去，其余模块原样保留
async function mergeAndPush(){
  const cloud=await getCloudData();
  const local=await collectAllExpanded();
  const merged=Object.assign({},cloud||{},local);
  const nCloud=cloud?Object.keys(cloud).length:0;
  log('云端原有 '+nCloud+' 个键，本机 '+Object.keys(local).length+' 个键，合并后 '+Object.keys(merged).length+' 个');
  return await upsertCloud(merged);
}
document.getElementById('btnPush').addEventListener('click',async()=>{
  if(!confirm('将：①下载一次整库备份 ②把本机配好的三库（含原图）合并推送到云端。\n确定同步？'))return;
  const imgs={};IMPORTED.forEach(p=>imgs[p.id]=p.base64);
  const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),libs:STATE,images:imgs})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='图库备份_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  log('已下载备份');
  document.getElementById('btnPush').disabled=true;
  try{
    const ok=await mergeAndPush();
    log(ok?'已同步云端（原图，未压缩）':'云端同步失败，请看上方错误码');
  }catch(e){log('同步异常：'+e);}
  document.getElementById('btnPush').disabled=false;
});
document.getElementById('btnClearCloud').addEventListener('click',async()=>{
  if(!confirm('用本机当前三库状态覆盖云端（旧图即被清掉）。确定？'))return;
  try{
    const ok=await mergeAndPush();
    log(ok?'云端已用本机状态覆盖（旧图清空）':'操作失败');
  }catch(e){log('异常：'+e);}
});

/* ---------- 从云端拉取列表（本地为空时兜底） ---------- */
async function pullFromCloud(){
  log('正在从云端拉取三库列表…');
  try{
    const r=await fetch(SB_URL+'?id=eq.me',{headers:SB_H});
    if(!r.ok){log('云端拉取失败('+r.status+')');return false;}
    const j=await r.json();
    const data=(j[0]&&j[0].payload&&j[0].payload.data)||null;
    if(!data){log('云端暂无数据');return false;}
    let n=0;
    for(const L of LIBS){
      if(!data[L.key])continue;
      let arr;try{arr=typeof data[L.key]==='string'?JSON.parse(data[L.key]):data[L.key];}catch(e){arr=[];}
      if(Array.isArray(arr)){
        for(const it of arr){
          if(it&&typeof it.image==='string'&&it.image.startsWith('data:image')){
            const id='imp_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
            await idbPut(id,it.image); it.image='idb://'+id;
          }
        }
        writeLib(L.key,arr); n+=arr.length;
      }
    }
    loadLibs();
    log('已从云端拉取 '+n+' 个条目（含名称），现在可以导入图片并自动匹配了');
    return n>0;
  }catch(e){log('拉取异常：'+e);return false;}
}
document.getElementById('btnPull').addEventListener('click',()=>pullFromCloud());

/* ---------- 导入备份还原（把之前配好的对应关系+原图灌回来） ---------- */
document.getElementById('btnRestore').addEventListener('click',()=>document.getElementById('restoreFile').click());
document.getElementById('restoreFile').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f)return;
  try{
    const obj=JSON.parse(await f.text());
    const libs=obj.libs||obj;
    const images=obj.images||{};
    let n=0; for(const id in images){ await idbPut(id,images[id]); if(!IMPORTED.find(p=>p.id===id)) IMPORTED.push({id,name:id,base64:images[id]}); n++; }
    let m=0; for(const L of LIBS){ if(Array.isArray(libs[L.key])){ writeLib(L.key,libs[L.key]); m+=libs[L.key].length; } }
    loadLibs();
    log('还原完成：原图 '+n+' 张，条目 '+m+' 条。请核对后点「备份并同步云端」');
  }catch(err){ log('备份解析失败：'+err); }
  e.target.value='';
});

/* ---------- 启动 ---------- */
(async function init(){
  log('当前网页源：'+location.origin);
  if(location.origin.indexOf('github.io')<0){
    log('⚠ 你不在 github.io 上！本机数据与工作台不互通，请改用 https://hlsbibisky.github.io/workbench/图库总管理.html');
  }else{
    log('源正确（github.io），与工作台共用数据。');
  }
  loadLibs();
  let total=0; LIBS.forEach(L=>total+=(STATE[L.key]||[]).length);
  if(total===0){ await pullFromCloud(); }
  // 预载 IndexedDB 已有图（若之前导入过）
  let nmap={}; try{ nmap=JSON.parse(localStorage.getItem('food_img_names')||'{}'); }catch(e){ nmap={}; }
  const m=await idbGetAll();
  Object.keys(m).forEach(id=>{if(id.startsWith('imp_')&&!IMPORTED.find(p=>p.id===id))IMPORTED.push({id,name:nmap[id]||id,base64:m[id]});});
  updateStat();
})();
</script>
