<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>驱动力 · 情感模式全解</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#f3ecdc; --paper-2:#fbf6ea; --ink:#3a3329; --ink-soft:#8a7c68;
    --line:#e2d4bb; --accent:#b8714e;
    --yong-ink:#5f7a45; --yong-bd:#c9d8b6; --yong-bg:#f1f6e9;
    --ji-ink:#b15538; --ji-bd:#e6c6b2; --ji-bg:#fbeee8;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    font-family:'Noto Sans SC', system-ui, sans-serif; color:var(--ink);
    min-height:100vh;
    background:radial-gradient(130% 110% at 50% -10%, #fbf5e9 0%, #f3ecdc 55%, #ece1cb 100%);
    display:flex; flex-direction:column; align-items:center;
    padding:26px 16px 60px;
  }
  .wrap{ width:100%; max-width:1080px; }

  /* Tabs */
  .tabs{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:22px;
    border-bottom:1px solid var(--line); padding-bottom:14px; }
  .tab{ font-family:'Noto Serif SC',serif; font-size:15px; letter-spacing:1px; cursor:pointer;
    padding:9px 18px; border-radius:22px; border:1px solid var(--line); background:var(--paper-2);
    color:var(--ink-soft); transition:.18s; user-select:none; }
  .tab:hover{ border-color:var(--accent); color:var(--accent); }
  .tab.on{ background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 4px 14px rgba(184,113,78,.28); }

  .panel{ display:none; animation:fade .25s ease; }
  .panel.on{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .sub{ font-family:'Noto Serif SC',serif; font-size:13px; color:var(--ink-soft);
    letter-spacing:2px; text-align:center; margin:0 0 18px; }

  /* 总览卡片 */
  .cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px; }
  .dc{ background:var(--paper-2); border:1px solid var(--line); border-radius:16px; padding:18px 16px;
    cursor:pointer; transition:.18s; position:relative; overflow:hidden; }
  .dc:hover{ transform:translateY(-3px); box-shadow:0 10px 26px rgba(120,90,60,.16); }
  .dc .god{ position:absolute; top:10px; right:12px; font-family:'Noto Serif SC',serif; font-size:34px;
    color:rgba(184,113,78,.13); font-weight:700; }
  .dc h3{ margin:0 0 4px; font-family:'Noto Serif SC',serif; font-size:19px; letter-spacing:1px; }
  .dc .el{ font-size:12px; color:var(--accent); margin-bottom:10px; }
  .dc .core{ font-size:13px; color:var(--ink); margin-bottom:10px; }
  .dc .pill{ display:inline-block; font-size:11px; padding:2px 9px; border-radius:11px; margin:3px 4px 0 0; }
  .pill.y{ background:var(--yong-bg); color:var(--yong-ink); border:1px solid var(--yong-bd); }
  .pill.j{ background:var(--ji-bg); color:var(--ji-ink); border:1px solid var(--ji-bd); }

  /* 详解 */
  .detail-head{ text-align:center; margin-bottom:18px; }
  .detail-head h2{ font-family:'Noto Serif SC',serif; font-size:24px; margin:0 0 4px; letter-spacing:2px; }
  .detail-head .meta{ font-size:13px; color:var(--ink-soft); }
  .nav-row{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:20px; }
  .nav-row .nv{ font-size:13px; padding:6px 14px; border-radius:18px; border:1px solid var(--line);
    background:var(--paper-2); cursor:pointer; color:var(--ink-soft); }
  .nav-row .nv.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .block{ background:var(--paper-2); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:16px; }
  .block h4{ margin:0 0 12px; font-family:'Noto Serif SC',serif; font-size:16px; display:flex; align-items:center; gap:8px; }
  .block h4 .tag{ font-size:11px; padding:2px 9px; border-radius:10px; }
  .tag.y{ background:var(--yong-bg); color:var(--yong-ink); }
  .tag.j{ background:var(--ji-bg); color:var(--ji-ink); }
  .tag.n{ background:#efe6d4; color:var(--ink-soft); }
  .block ul{ margin:0; padding-left:20px; }
  .block li{ font-size:13.5px; line-height:1.85; margin-bottom:6px; }
  .define{ font-size:14px; line-height:1.9; background:linear-gradient(180deg,#fbf3e3,#f6ecd8);
    border-left:4px solid var(--accent); padding:16px 18px; border-radius:10px; margin-bottom:16px; }

  /* 矩阵 */
  .matrix-wrap{ overflow-x:auto; }
  table.matrix{ border-collapse:collapse; width:100%; min-width:760px; background:var(--paper-2);
    border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  table.matrix th, table.matrix td{ border:1px solid var(--line); padding:12px 10px; vertical-align:top; font-size:13px; }
  table.matrix thead th{ background:var(--accent); color:#fff; font-family:'Noto Serif SC',serif; font-size:14px; letter-spacing:1px; }
  table.matrix tbody th.drv{ background:#f0e6d2; text-align:left; width:118px; }
  table.matrix tbody th.drv .dn{ font-family:'Noto Serif SC',serif; font-weight:600; font-size:14px; }
  table.matrix tbody th.drv .dg{ font-size:11px; color:var(--ink-soft); }
  .cell{ cursor:pointer; border-radius:8px; min-height:54px; transition:.15s; line-height:1.6; }
  .cell:hover{ background:#fff7ea; box-shadow:inset 0 0 0 2px var(--accent); }
  .cell .ans{ font-weight:500; }
  .cell .more{ font-size:11px; color:var(--accent); margin-top:4px; display:block; }
  .cell.todo{ color:var(--ink-soft); font-style:italic; }

  .detail-box{ margin-top:18px; background:var(--paper-2); border:1px solid var(--line); border-radius:12px;
    padding:18px 20px; display:none; }
  .detail-box.on{ display:block; animation:fade .2s; }
  .detail-box .dh{ font-family:'Noto Serif SC',serif; font-size:16px; color:var(--accent); margin:0 0 10px; }
  .detail-box .q{ font-size:13px; color:var(--ink-soft); margin-bottom:10px; }
  .detail-box .body{ font-size:14px; line-height:1.95; }
  .detail-box .src{ margin-top:12px; font-size:11.5px; color:var(--ink-soft); border-top:1px dashed var(--line); padding-top:8px; }

  /* 快速查询 */
  .quick{ background:var(--paper-2); border:1px solid var(--line); border-radius:16px; padding:24px; max-width:680px; margin:0 auto; }
  .qrow{ display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .qrow label{ font-family:'Noto Serif SC',serif; font-size:14px; width:64px; }
  .qsel{ flex:1; min-width:200px; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    background:#fff; font-family:'Noto Sans SC',sans-serif; font-size:14px; color:var(--ink); }
  .qbtn{ display:block; width:100%; padding:12px; border:none; border-radius:10px; background:var(--accent);
    color:#fff; font-family:'Noto Serif SC',serif; font-size:15px; letter-spacing:2px; cursor:pointer; margin-top:6px; }
  .qbtn:hover{ background:#a6623f; }
  .qres{ margin-top:18px; display:none; }
  .qres.on{ display:block; animation:fade .2s; }
  .qres .qr-h{ font-family:'Noto Serif SC',serif; font-size:15px; color:var(--accent); margin-bottom:8px; }
  .qres .qr-ans{ background:linear-gradient(180deg,#fbf3e3,#f6ecd8); border-left:4px solid var(--accent);
    padding:14px 16px; border-radius:10px; font-size:14.5px; line-height:1.9; margin-bottom:12px; }
  .qres .qr-body{ font-size:14px; line-height:1.95; }

  /* 关系 */
  .rel-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; }
  .rel-card{ background:var(--paper-2); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .rel-card h4{ font-family:'Noto Serif SC',serif; margin:0 0 10px; font-size:16px; color:var(--accent); }
  .rel-card p{ font-size:13.5px; line-height:1.85; margin:0; }
  .cycle{ display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin:20px 0; }
  .cn{ width:74px; height:74px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Noto Serif SC',serif; background:#fff; border:2px solid var(--accent); }
  .cn b{ font-size:17px; }
  .cn span{ font-size:11px; color:var(--ink-soft); }
  .arr{ font-size:20px; color:var(--accent); }
  .legend{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:6px; }

  .hint{ font-size:12px; color:var(--ink-soft); text-align:center; margin-top:14px; line-height:1.7; }
  a{ color:var(--accent); }
</style>
</head>

<div class="wrap">

    <div class="rel-grid" id="relGrid"></div>
  </section>
</div>
