<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股主要指数估值</title>
<style>
  :root{
    --bg:#f7f4ee; --card:#fffdf9; --ink:#3a3631; --sub:#8a837a;
    --line:#ece5da; --accent:#b8714e; --accent2:#5b8c7b;
    --up:#c0392b; --down:#2e9e5b; --amber:#e0a52e;
    --lowBg:#e8f5e9; --midBg:#fff8e1; --highBg:#fce4ec;
    --shadow:0 2px 12px rgba(184,113,78,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    line-height:1.6;padding:20px 16px 60px;min-height:100vh;}
  .wrap{max-width:1100px;margin:0 auto;}

  /* 顶栏 */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;
    padding-bottom:18px;border-bottom:2px solid var(--line);}
  .topbar-left h1{font-size:26px;font-weight:700;color:var(--accent);letter-spacing:1px;}
  .topbar-left .sub{font-size:13px;color:var(--sub);margin-top:4px;}
  .topbar-right{display:flex;gap:10px;align-items:center;}
  .btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px;padding:8px 18px;cursor:pointer;font-size:14px;font-weight:600;
    font-family:inherit;transition:.15s;display:flex;align-items:center;gap:6px;}
  .btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);
    box-shadow:var(--shadow);}
  .btn:active{transform:scale(.97);}

  /* 概览卡片 */
  .overview{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
  .oc{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:20px;text-align:center;
    transition:.2s;}
  .oc:hover{box-shadow:var(--shadow);transform:translateY(-2px);}
  .oc .num{font-size:36px;font-weight:800;line-height:1.15;}
  .oc .lbl{font-size:13px;color:var(--sub);margin-top:6px;font-weight:500;}
  .oc.low{border-bottom:4px solid var(--down);} .oc.low .num{color:var(--down);}
  .oc.mid{border-bottom:4px solid var(--amber);} .oc.mid .num{color:var(--amber);}
  .oc.high{border-bottom:4px solid var(--up);}   .oc.high .num{color:var(--up);}
  .oc.avg{border-bottom:4px solid var(--accent);} .oc.avg .num{color:var(--accent);}

  /* 主表格 */
  .tbl-wrap{background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:var(--shadow);}
  table{width:100%;border-collapse:collapse;}
  thead{background:linear-gradient(180deg,#faf7f2,var(--card));}
  th{padding:14px 16px;text-align:left;font-weight:700;color:var(--sub);
    font-size:13px;border-bottom:2px solid var(--line);letter-spacing:.3px;
    white-space:nowrap;position:sticky;top:0;background:linear-gradient(180deg,#faf7f2,var(--card));z-index:2;}
  td{padding:16px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:15px;}
  tr:last-child td{border-bottom:none;}
  tr:hover{background:var(--mark);}
  .idx-cell{font-weight:700;font-size:16px;color:var(--ink);white-space:nowrap;}
  .idx-cell .type{font-size:11.5px;color:var(--sub);font-weight:500;display:block;margin-top:1px;}

  /* 数值样式 */
  .pe-num{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;}
  .pct-wrap{display:inline-flex;align-items:center;gap:8px;}
  .pct-bar{width:72px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;}
  .pct-fill{height:100%;border-radius:4px;transition:width .6s ease;}
  .pct-num{font-size:15px;font-weight:700;min-width:48px;text-align:center;
    padding:3px 10px;border-radius:8px;}
  .pct-low{background:var(--lowBg);color:var(--down);}
  .pct-mid{background:var(--midBg);color:var(--amber);}
  .pct-high{background:var(--highBg);color:var(--up);}

  /* 评级标签 */
  .rtag{display:inline-block;padding:5px 14px;border-radius:10px;font-size:13.5px;
    font-weight:700;letter-spacing:.5px;white-space:nowrap;}
  .rtag-low{background:var(--lowBg);color:var(--down);border:1.5px solid rgba(46,158,91,.25);}
  .rtag-mid{background:var(--midBg);color:var(--amber);border:1.5px solid rgba(224,165,46,.25);}
  .rtag-high{background:var(--highBg);color:var(--up);border:1.5px solid rgba(192,57,43,.25);}

  /* 操作建议 */
  .adv{color:var(--sub);font-size:13.5px;line-height:1.55;max-width:200px;}

  /* 底部说明 */
  .foot{margin-top:20px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;
    padding:18px 20px;font-size:13px;color:var(--sub);line-height:1.85;}
  .foot h4{color:var(--accent);font-size:14.5px;margin-bottom:8px;}
  .foot p{margin-bottom:4px;}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;}
  .legend i{display:inline-flex;align-items:center;gap:5px;font-weight:600;}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block;}

  /* 状态栏 */
  .status-bar{font-size:12.5px;color:var(--sub);text-align:right;margin-top:8px;}

  /* 响应式 */
  @media(max-width:900px){
    body{padding:14px 10px 50px;}
    .topbar h1{font-size:21px;}
    .overview{grid-template-columns:repeat(2,1fr);gap:10px;}
    .oc .num{font-size:28px;}
    td{padding:12px 10px;font-size:14px;}
    .pe-num{font-size:19px;}
    .adv{max-width:140px;font-size:12.5px;}
    .hide-sm{display:none;}
  }
  @media(max-width:560px){
    .overview{grid-template-columns:repeat(2,1fr);}
    .oc .num{font-size:24px;}
    table{font-size:13px;}
    th,td{padding:10px 8px;}
    .pe-num{font-size:17px;}
    .hide-xs{display:none;}
  }

  /* 嵌入检测 */
  .embed-hint{display:none;background:var(--mark);border:1.5px solid #e7d3bf;
    border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--sub);}
</style>
</head>
<body>
<div class="wrap">
  <div class="embed-hint" id="embedHint">💡 此页面嵌入工作台中查看效果最佳</div>

  <div class="topbar">
    <div class="topbar-left">
      <h1>📊 A股主要指数估值</h1>
      <div class="sub" id="updateTime">数据更新中…</div>
    </div>
    <div class="topbar-right">
      <button class="btn" onclick="doRefresh()" id="refreshBtn">🔄 刷新</button>
      <button class="btn" onclick="doCopy()">📋 复制表格</button>
    </div>
  </div>

  <div class="overview" id="overview"></div>

  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th>指数名称</th>
          <th>PE(TTM)</th>
          <th>PE 百分位</th>
          <th>PB</th>
          <th>股息率</th>
          <th>评级</th>
          <th class="hide-xs">操作建议</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="status-bar" id="statusBar"></div>

  <div class="foot">
    <h4>📌 说明</h4>
    <p><strong>PE百分位：</strong>当前PE在历史数据中的位置。0%=历史最低（最便宜），100%=历史最高（最贵）。</p>
    <p><strong>数据来源：</strong>中证指数 / 国证指数 / 东方财富；统计周期近10年。内置参考数据定期手动更新。</p>
    <div class="legend">
      <i><span class="dot" style="background:var(--down)"></span> 低估 (PE位 &lt;35%) — 定投好时机</i>
      <i><span class="dot" style="background:var(--amber)"></span> 合理 (35%–75%) — 正常持有</i>
      <i><span class="dot" style="background:var(--up)"></span> 高估 (&gt;75%) — 谨慎观望</i>
    </div>
  </div>
</div>

<script>
/* ============ 嵌入检测 ============ */
if(window.self !== window.top){ document.getElementById('embedHint').style.display='block'; }

/* ============ 指数定义 ============ */
const INDICES = [
  {code:'000300', name:'沪深300',     type:'大盘宽基', sector:'A股核心'},
  {code:'000016', name:'上证50',       type:'超大盘',   sector:'蓝筹权重'},
  {code:'399006', name:'创业板指',     type:'成长宽基', sector:'创业板'},
  {code:'000905', name:'中证500',       type:'中盘宽基', sector:'中盘成长'},
  {code:'000852', name:'中证1000',     type:'小盘宽基', sector:'小盘股'},
  {code:'000688', name:'科创50',       type:'科技宽基', sector:'硬科技'},
  {code:'399303', name:'国证1000',     type:'全市场',   sector:'除金融外'},
  {code:'000985', name:'中证全指',     type:'全市场',   sector:'A股整体'},
];

/* ============ 内置默认数据（2026-08 参考，定期更新） ============ */
const FALLBACK = {
  time: '2026-08-10',
  src: '内置参考数据',
  items: [
    {name:'沪深300',   pe:14.20, pePct:78, pb:1.38, dy:2.90},
    {name:'上证50',     pe:11.40, pePct:72, pb:1.26, dy:3.30},
    {name:'创业板指',   pe:55.20, pePct:42, pb:6.08, dy:1.10},
    {name:'中证500',   pe:23.10, pePct:30, pb:1.72, dy:2.10},
    {name:'中证1000',  pe:31.40, pePct:26, pb:2.18, dy:1.60},
    {name:'科创50',    pe:43.80, pePct:38, pb:3.84, dy:0.90},
    {name:'国证1000',  pe:19.80, pePct:35, pb:1.92, dy:2.20},
    {name:'中证全指',  pe:17.40, pePct:38, pb:1.58, dy:2.50},
  ]
};

/* ============ 评级逻辑 ============ */
function rate(pePct){
  if(pePct < 35) return {lv:'低估', cls:'rtag-low', pcls:'pct-low', sev:'low'};
  if(pePct < 58) return {lv:'合理偏低', cls:'rtag-low', pcls:'pct-low', sev:'mid'};
  if(pePct < 76) return {lv:'合理', cls:'rtag-mid', pcls:'pct-mid', sev:'mid'};
  return {lv:'高估', cls:'rtag-high', pcls:'pct-high', sev:'high'};
}
function suggest(name, pePct){
  if(pePct < 35) return '低估区间，适合定投或分批布局';
  if(pePct < 58) return '偏低位置，可正常定投逢低加码';
  if(pePct < 76) return '中性偏高，控制节奏保持持有';
  return '高估预警，谨慎追高可考虑止盈';
}

/* ============ 渲染 ============ */
function render(data){
  const arr = data.items;
  const lowN = arr.filter(x=>x.pePct<35).length;
  const midN = arr.filter(x=>x.pePct>=35 && x.pePct<76).length;
  const highN = arr.filter(x=>x.pePct>=76).length;
  const avgPe = (arr.reduce((s,x)=>s+x.pe,0)/arr.length).toFixed(1);

  // 概览
  document.getElementById('overview').innerHTML = `
    <div class="oc low"><div class="num">${lowN}</div><div class="lbl">低估指数</div></div>
    <div class="oc avg"><div class="num">${avgPe}</div><div class="lbl">平均 PE</div></div>
    <div class="oc mid"><div class="num">${midN}</div><div class="lbl">合理指数</div></div>
    <div class="oc high"><div class="num">${highN}</div><div class="lbl">高估指数</div></div>`;

  // 表格
  document.getElementById('tbody').innerHTML = arr.map(it => {
    const r = rate(it.pePct);
    const sug = suggest(it.name, it.pePct);
    const barClr = it.pePct<35 ? 'var(--down)' : it.pePct<76 ? 'var(--amber)' : 'var(--up)';
    return `<tr>
      <td><div class="idx-cell">${it.name}<span class="type">${INDICES.find(i=>i.name===it.name)?.type||''}</span></div></td>
      <td><span class="pe-num">${it.pe.toFixed(2)}</span></td>
      <td><div class="pct-wrap">
        <div class="pct-bar"><div class="pct-fill" style="width:${Math.min(it.pePct,100)}%;background:${barClr}"></div></div>
        <span class="pct-num ${r.pcls}">${it.pePct}%</span>
      </div></td>
      <td style="font-weight:600;font-variant-numeric:tabular-nums">${it.pb.toFixed(2)}</td>
      <td style="font-weight:600;font-variant-numeric:tabular-nums">${it.dy.toFixed(1)}%</td>
      <td><span class="rtag ${r.cls}">${r.lv}</span></td>
      <td class="hide-xs"><span class="adv">${sug}</span></td>
    </tr>`;
  }).join('');

  // 时间与状态
  document.getElementById('updateTime').textContent =
    `数据更新：${data.time || '未知'} · 来源：${data.src || '—'}`;
  document.getElementById('statusBar').textContent =
    `共 ${arr.length} 只主要指数 · ${new Date().toLocaleString('zh-CN')}`;
}

/* ============ 数据获取 ============ */
async function doRefresh(){
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent='⏳ 获取中…';

  let data = null;
  // 尝试 API（东方财富指数列表）
  try {
    const resp = await fetch('https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=20&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:90+t:3+f:!50&fields:f12,f14,f20,f21,f45,f116,f117',{
      mode:'cors'
    });
    if(resp.ok){
      const j = await resp.json();
      if(j?.data?.diff && j.data.diff.length > 0){
        data = parseEMData(j.data.diff);
      }
    }
  } catch(e){ console.log('API不可用:', e.message); }

  // localStorage 缓存兜底
  if(!data){
    try {
      const c = JSON.parse(localStorage.getItem('val_cache'));
      if(c && Date.now() - c.ts < 86400000) data = c.d;
    }catch(e){}
  }

  // 内置数据最终兜底
  if(!data) data = FALLBACK;

  // 存缓存
  try{ localStorage.setItem('val_cache', JSON.stringify({ts:Date.now(), d:data})); }catch(e){}
  render(data);

  btn.disabled = false; btn.textContent='🔄 刷新';
}

function parseEMData(list){
  const targets = ['沪深300','上证50','创业板指','中证500','中证1000','科创50'];
  const found = list.filter(x => targets.includes(x.f14));
  if(found.length < 3) throw new Error('不足');
  return {
    time: new Date().toISOString().split('T')[0],
    src: '东方财富行情API（实时）',
    items: found.map(x => ({
      name: x.f14,
      pe: parseFloat(x.f20)||0,
      pePct: estPct(x.f14, parseFloat(x.f20)||0),
      pb: parseFloat(x.f21)||0,
      dy: (parseFloat(x.f45)||0)*100,
    }))
  };
}

// 基于历史范围估算百分位
function estPct(name, pe){
  const rng = {
    '沪深300':{lo:8,hi:22},'上证50':{lo:7,hi:17},'创业板指':{lo:25,hi:85},
    '中证500':{lo:15,hi:38},'中证1000':{lo:18,hi:48},'科创50':{lo:28,hi:78},
  };
  const r = rng[name] || {lo:10,hi:50};
  if(pe <= r.lo) return 5;
  if(pe >= r.hi) return 95;
  return Math.round(((pe-r.lo)/(r.hi-r.lo))*100);
}

/* ============ 复制 ============ */
function doCopy(){
  const rows = document.querySelectorAll('#tbody tr');
  let t = 'A股主要指数估值\n' + '='.repeat(65) + '\n';
  t += `导出：${new Date().toLocaleString('zh-CN')}\n\n`;
  t += `{'指数':<10} {'PE':>8} {'百分位':>7} {'PB':>6} {'股息率':>6} {'评级':<8}\n`;
  t += '-'.repeat(65)+'\n';
  rows.forEach(tr => {
    const td = tr.querySelectorAll('td');
    const n = td[0].textContent.trim(), pe = td[1].textContent.trim();
    const pt = td[2].querySelector('.pct-num')?.textContent.trim() || '';
    const pb = td[3].textContent.trim(), dy = td[4].textContent.trim();
    const tg = td[5].textContent.trim();
    t += `${n.padEnd(10)} ${pe.padStart(8)} ${pt.padStart(7)} ${pb.padStart(6)} ${dy.padStart(6)} ${tg.padEnd(8)}\n`;
  });
  navigator.clipboard.writeText(t).then(()=>alert('✅ 已复制！')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=t;
    document.body.appendChild(ta);ta.select();document.execCommand('copy');
    document.body.removeChild(ta); alert('✅ 已复制！');
  });
}

/* ============ 启动 ============ */
render(FALLBACK);
doRefresh();
</script>
</body>
</html>
