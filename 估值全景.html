<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>估值全景</title>
<style>
  :root{
    --bg:#f7f4ee; --card:#fffdf9; --ink:#3a3631; --sub:#8a837a;
    --line:#ece5da; --accent:#b8714e; --accent2:#5b8c7b;
    --up:#c0392b; --down:#2e9e5b; --amber:#e0a52e;
    --lowBg:#e8f5e9; --midBg:#fff8e1; --highBg:#fce4ec;
    --shadow:0 2px 12px rgba(184,113,78,.08);
    --mark:rgba(184,113,78,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    line-height:1.6;padding:20px 16px 60px;min-height:100vh;}
  .wrap{max-width:1200px;margin:0 auto;}

  /* 嵌入提示 */
  .embed-hint{display:none;background:var(--mark);border:1.5px solid #e7d3bf;
    border-radius:10px;padding:10px 16px;margin-bottom:18px;font-size:13px;color:var(--sub);}

  /* 顶栏 */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;
    padding-bottom:16px;border-bottom:2px solid var(--line);}
  .topbar-left h1{font-size:26px;font-weight:700;color:var(--accent);letter-spacing:1px;}
  .topbar-left .sub{font-size:13px;color:var(--sub);margin-top:4px;}
  .topbar-right{display:flex;gap:10px;align-items:center;}
  .btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px;padding:8px 18px;cursor:pointer;font-size:14px;font-weight:600;
    font-family:inherit;transition:.15s;display:flex;align-items:center;gap:6px;}
  .btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);
    box-shadow:var(--shadow);}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

  /* 标签栏 */
  .tab-bar{display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid var(--line);}
  .tab{padding:10px 24px;font-size:15px;font-weight:600;color:var(--sub);
    cursor:pointer;border-bottom:3px solid transparent;transition:.2s;background:none;
    letter-spacing:.5px;}
  .tab:hover{color:var(--accent);background:var(--mark);}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}

  /* 概览卡片 */
  .overview{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  .oc{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:20px;text-align:center;
    transition:.2s;}
  .oc:hover{box-shadow:var(--shadow);transform:translateY(-2px);}
  .oc .num{font-size:36px;font-weight:800;line-height:1.15;}
  .oc .lbl{font-size:13px;color:var(--sub);margin-top:6px;font-weight:500;}
  .oc.low{border-bottom:4px solid var(--down);} .oc.low .num{color:var(--down);}
  .oc.mid{border-bottom:4px solid var(--amber);} .oc.mid .num{color:var(--amber);}
  .oc.high{border-bottom:4px solid var(--up);}   .oc.high .num{color:var(--up);}
  .oc.avg{border-bottom:4px solid var(--accent);} .oc.avg .num{color:var(--accent);}

  /* 主表格 */
  .tbl-wrap{background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:var(--shadow);}
  table{width:100%;border-collapse:collapse;}
  thead{background:linear-gradient(180deg,#faf7f2,var(--card));}
  th{padding:14px 14px;text-align:left;font-weight:700;color:var(--sub);
    font-size:13px;border-bottom:2px solid var(--line);letter-spacing:.3px;
    white-space:nowrap;position:sticky;top:0;z-index:2;
    background:linear-gradient(180deg,#faf7f2,var(--card));
    cursor:pointer;user-select:none;transition:background .15s;}
  th:hover{background:var(--mark);}
  th .th-inner{display:inline-flex;align-items:center;gap:4px;}
  .sort-arrow{font-size:11px;color:var(--sub);opacity:.4;transition:opacity .15s;}
  th.sort-asc .sort-arrow{opacity:1;color:var(--accent);transform:rotate(0deg);}
  th.sort-desc .sort-arrow{opacity:1;color:var(--accent);transform:rotate(180deg);}
  td{padding:14px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:15px;}
  tr:last-child td{border-bottom:none;}
  tr:hover{background:var(--mark);}
  .idx-cell{font-weight:700;font-size:16px;color:var(--ink);white-space:nowrap;}
  .idx-cell .type{font-size:11.5px;color:var(--sub);font-weight:500;display:block;margin-top:1px;}

  /* 数值样式 */
  .pe-num{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;}
  .pct-wrap{display:inline-flex;align-items:center;gap:8px;}
  .pct-bar{width:72px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;}
  .pct-fill{height:100%;border-radius:4px;transition:width .6s ease;}
  .pct-num{font-size:14.5px;font-weight:700;min-width:48px;text-align:center;
    padding:3px 10px;border-radius:8px;}
  .pct-low{background:var(--lowBg);color:var(--down);}
  .pct-mid{background:var(--midBg);color:var(--amber);}
  .pct-high{background:var(--highBg);color:var(--up);}

  /* 评级标签 */
  .rtag{display:inline-block;padding:5px 14px;border-radius:10px;font-size:13.5px;
    font-weight:700;letter-spacing:.5px;white-space:nowrap;}
  .rtag-low{background:var(--lowBg);color:var(--down);border:1.5px solid rgba(46,158,91,.25);}
  .rtag-mid{background:var(--midBg);color:var(--amber);border:1.5px solid rgba(224,165,46,.25);}
  .rtag-high{background:var(--highBg);color:var(--up);border:1.5px solid rgba(192,57,43,.25);}

  /* 操作建议 */
  .adv{color:var(--sub);font-size:13.5px;line-height:1.55;max-width:200px;}

  /* 底部说明 */
  .foot{margin-top:20px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;
    padding:18px 20px;font-size:13px;color:var(--sub);line-height:1.85;}
  .foot h4{color:var(--accent);font-size:14.5px;margin-bottom:8px;}
  .foot p{margin-bottom:4px;}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;}
  .legend i{display:inline-flex;align-items:center;gap:5px;font-weight:600;}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block;}

  /* 状态栏 */
  .status-bar{font-size:12.5px;color:var(--sub);text-align:right;margin-top:8px;}

  /* 响应式 */
  @media(max-width:900px){
    body{padding:14px 10px 50px;}
    .topbar h1{font-size:21px;}
    .overview{grid-template-columns:repeat(2,1fr);gap:10px;}
    .oc .num{font-size:28px;}
    td{padding:12px 10px;font-size:14px;}
    .pe-num{font-size:19px;}
    .adv{max-width:140px;font-size:12.5px;}
    .hide-sm{display:none;}
    .tab{padding:8px 16px;font-size:14px;}
  }
  @media(max-width:560px){
    .overview{grid-template-columns:repeat(2,1fr);}
    .oc .num{font-size:24px;}
    table{font-size:13px;}
    th,td{padding:10px 8px;}
    .pe-num{font-size:17px;}
    .hide-xs{display:none;}
  }
</style>

</div>

/* ============ 评级逻辑（基于 PE 百分位） ============ */
function rate(pePct){
  if(pePct === 0 || pePct === null || pePct === undefined) return {lv:'待评估', cls:'rtag-mid', pcls:'pct-mid', sev:'mid'};
  if(pePct < 35) return {lv:'低估', cls:'rtag-low', pcls:'pct-low', sev:'low'};
  if(pePct < 58) return {lv:'合理偏低', cls:'rtag-low', pcls:'pct-low', sev:'mid'};
  if(pePct < 76) return {lv:'合理', cls:'rtag-mid', pcls:'pct-mid', sev:'mid'};
  return {lv:'高估', cls:'rtag-high', pcls:'pct-high', sev:'high'};
}
function suggest(name, pePct){
  if(!pePct) return '暂无足够数据';
  if(pePct < 35) return '低估区间，适合定投或分批布局';
  if(pePct < 58) return '偏低位置，可正常定投逢低加码';
  if(pePct < 76) return '中性偏高，控制节奏保持持有';
  return '高估预警，谨慎追高可考虑止盈';
}

/* ============ 排序 ============ */

    case 'pePct': return item.pePct||0;
    case 'pb': return item.pb||0;
    case 'pbPct': return item.pbPct||0;
    case 'dy': return item.dy||0;
    case 'rating':
      const r = rate(item.pePct);
      const order = {'低估':0,'合理偏低':1,'合理':2,'高估':3,'待评估':4};
      return order[r.lv]||4;
    default: return item.pePct||0;
  }
}
function sortData(arr){
  const sorted = [...arr].sort((a,b)=>{
    let va = getSortVal(a, sortCol), vb = getSortVal(b, sortCol);
    if(typeof va === 'string') va = va.toLowerCase();
    if(typeof vb === 'string') vb = vb.toLowerCase();
    if(va < vb) return sortDir === 'asc' ? -1 : 1;
    if(va > vb) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });
  return sorted;
}

/* ============ 表头渲染（带排序箭头） ============ */
function renderThead(){
  const isIndex = curTab === 'index';
  const cols = isIndex ? [
    {key:'name', label:'指数名称', sortable:true},
    {key:'pe', label:'PE(TTM)', sortable:true},
    {key:'pePct', label:'PE 百分位', sortable:true},
    {key:'pb', label:'PB', sortable:true},
    {key:'pbPct', label:'PB 百分位', sortable:true},
    {key:'dy', label:'股息率', sortable:true},
    {key:'rating', label:'评级', sortable:true},
    {key:'adv', label:'操作建议', sortable:false},
  ] : [
    {key:'name', label:'行业名称', sortable:true},
    {key:'pe', label:'PE(TTM)', sortable:true},
    {key:'pePct', label:'PE 百分位', sortable:true},
    {key:'pb', label:'PB', sortable:true},
    {key:'pbPct', label:'PB 百分位', sortable:true},
    {key:'dy', label:'股息率', sortable:true},
    {key:'rating', label:'评级', sortable:true},
    {key:'adv', label:'操作建议', sortable:false},
  ];

  document.getElementById('thead').innerHTML = '<tr>' + cols.map(c => {
    const arrow = c.sortable
      ? '<span class=sort-arrow>'+(sortCol===c.key?(sortDir==='asc'?' ^ ':' v '):' | ')+'</span>'
      : '';
    const cls = c.sortable && sortCol===c.key ? `sort-${sortDir}` : '';
    const onClick = c.sortable ? `onclick="doSort('${c.key}')"` : '';
    const hideClass = (!isIndex && c.key==='adv') ? ' hide-xs' : (isIndex && c.key==='adv' ? ' hide-xs' : '');
    return `<th ${onClick} class="${cls}${hideClass}"><span class="th-inner">${c.label}${arrow}</span></th>`;
  }).join('') + '</tr>';
}

function doSort(col){
  if(sortCol === col){ sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
  else{ sortCol = col; sortDir = 'asc'; }
  renderCurrent();
}

/* ============ 渲染 ============ */
function render(data){
  const arr = sortData(data.items);
  const lowN = arr.filter(x=>x.pePct>0&&x.pePct<35).length;
  const midN = arr.filter(x=>x.pePct>=35&&x.pePct<76).length;
  const highN = arr.filter(x=>x.pePct>=76).length;
  const avgPe = arr.filter(x=>x.pe).reduce((s,x)=>s+x.pe,0)/Math.max(arr.filter(x=>x.pe).length,1);

  // 概览
  document.getElementById('overview').innerHTML = `
    <div class="oc low"><div class="num">${lowN}</div><div class="lbl">低估</div></div>
    <div class="oc avg"><div class="num">${avgPe.toFixed(1)}</div><div class="lbl">平均 PE</div></div>
    <div class="oc mid"><div class="num">${midN}</div><div class="lbl">合理</div></div>
    <div class="oc high"><div class="num">${highN}</div><div class="lbl">高估</div></div>`;

  // 表头
  renderThead();

  const isIndex = curTab === 'index';

  // 表格内容
  document.getElementById('tbody').innerHTML = arr.map(it => {
    const r = rate(it.pePct);
    const sug = suggest(it.name, it.pePct);
    const barClr = (!it.pePct || it.pePct<35) ? 'var(--down)' : it.pePct<76 ? 'var(--amber)' : 'var(--up)';
    const barClrPB = (!it.pbPct || it.pbPct<35) ? 'var(--down)' : it.pbPct<76 ? 'var(--amber)' : 'var(--up)';
    const info = isIndex
      ? (INDICES.find(i=>i.name===it.name)||{})
      : (INDUSTRIES.find(i=>i.name===it.name)||{});
    return `<tr>
      <td><div class="idx-cell">${it.name}<span class="type">${info.type||''}</span></div></td>
      <td>${it.pe ? `<span class="pe-num">${it.pe.toFixed(2)}</span>` : '<span style="color:var(--sub)">—</span>'}</td>
      <td><div class="pct-wrap">
        ${it.pePct!==null&&it.pePct!==undefined?`<div class="pct-bar"><div class="pct-fill" style="width:${Math.min(it.pePct,100)}%;background:${barClr}"></div></div>
        <span class="pct-num ${r.pcls}">${it.pePct}%</span>`:'<span style="color:var(--sub)">—</span>'}
      </div></td>
      <td style="font-weight:600;font-variant-numeric:tabular-nums">${it.pb ? it.pb.toFixed(2) : '—'}</td>
      <td><div class="pct-wrap">
        ${it.pbPct!==null&&it.pbPct!==undefined?`<div class="pct-bar"><div class="pct-fill" style="width:${Math.min(it.pbPct,100)}%;background:${barClrPB}"></div></div>
        <span class="pct-num ${it.pbPct<35?'pct-low':it.pbPct<76?'pct-mid':'pct-high'}">${it.pbPct}%</span>`:'<span style="color:var(--sub)">—</span>'}
      </div></td>
      <td style="font-weight:600;font-variant-numeric:tabular-nums">${it.dy ? it.dy.toFixed(1)+'%' : '—'}</td>
      <td><span class="rtag ${r.cls}">${r.lv}</span></td>
      <td class="hide-xs"><span class="adv">${sug}</span></td>
    </tr>`;
  }).join('');

  // 时间与状态
  document.getElementById('updateTime').textContent =
    `数据更新：${data.time || '未知'} · 来源：${data.src || '—'}`;
  document.getElementById('statusBar').textContent =
    `共 ${arr.length} 项 · 排序：${getSortLabel()} · ${new Date().toLocaleString('zh-CN')}`;
}

function getSortLabel(){
  const labels = {name:'名称', pe:'PE', pePct:'PE百分位', pb:'PB', pbPct:'PB百分位', dy:'股息率', rating:'评级'};
  return `${labels[sortCol]||sortCol} ${sortDir==='asc'?'↑升序':'↓降序'}`;
}

/* ============ 标签切换 ============ */
function switchTab(tab){
  curTab = tab;
  // 更新标签样式
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  // 更新标题
  document.getElementById('pageTitle').textContent = tab === 'index' ? 'A股主要指数估值' : '行业板块估值';
  renderCurrent();
}

function renderCurrent(){
  if(curTab === 'index'){
    render(currentIndexData || FALLBACK_INDEX);
  } else{
    render(currentIndustryData || FALLBACK_INDUSTRY);
  }
}

/* ============ 数据获取与缓存 ============ */
let currentIndexData = null;
let currentIndustryData = null;

async function doRefresh(){
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent='⏳ 获取中…';

  // 尝试 API
  try {
    const resp = await fetch('https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=30&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:90+t:3+f:!50,m:90+t:2+f:!50,m:90+t:1+f:!50&fields:f12,f14,f20,f21,f45,f116,f117',{
      mode:'cors'
    });
    if(resp.ok){
      const j = await resp.json();
      if(j?.data?.diff && j.data.diff.length > 0){
        const parsed = parseEMData(j.data.diff);
        if(parsed.index && parsed.index.items.length >= 5) currentIndexData = parsed.index;
        if(parsed.industry && parsed.industry.items.length >= 3) currentIndustryData = parsed.industry;
      }
    }
  } catch(e){ console.log('API不可用:', e.message); }

  // localStorage 缓存兜底
  if(!currentIndexData || !currentIndustryData){
    try {
      const c = JSON.parse(localStorage.getItem('val_cache'));
      if(c && Date.now() - c.ts < 86400000){
        if(!currentIndexData && c.idx) currentIndexData = c.idx;
        if(!currentIndustryData && c.ind) currentIndustryData = c.ind;
      }
    }catch(e){}
  }

  // 最终兜底
  if(!currentIndexData) currentIndexData = FALLBACK_INDEX;
  if(!currentIndustryData) currentIndustryData = FALLBACK_INDUSTRY;

  // 存缓存
  try{ localStorage.setItem('val_cache', JSON.stringify({ts:Date.now(), d:null, idx:currentIndexData, ind:currentIndustryData})); }catch(e){}

  renderCurrent();
  btn.disabled = false; btn.textContent='🔄 刷新';
}

function parseEMData(list){
  const idxTargets = ['上证指数','深证成指','沪深300','上证50','创业板指','中证500','中证1000','科创50','中证全指'];
  const indTargets = INDUSTRIES.map(i => i.name);

  const idxFound = list.filter(x => idxTargets.includes(x.f14));
  const indFound = list.filter(x => indTargets.includes(x.f14));

  function estPct(name, pe){
    const rng = {
      // 指数
      '上证指数':{lo:10,hi:22},'深证成指':{lo:12,hi:30},'沪深300':{lo:8,hi:22},'上证50':{lo:7,hi:17},
      '创业板指':{lo:25,hi:85},'中证500':{lo:15,hi:38},'中证1000':{lo:18,hi:48},'科创50':{lo:28,hi:78},
      '中证全指':{lo:12,hi:26},
      // 金融
      '银行':{lo:4.5,hi:9},'证券':{lo:12,hi:35},'保险':{lo:8,hi:22},
      // 科技
      '半导体':{lo:30,hi:95},'计算机':{lo:25,hi:70},'通信':{lo:16,hi:40},'电子元件':{lo:22,hi:55},
      // 医疗
      '医药生物':{lo:20,hi:45},'医疗器械':{lo:18,hi:42},
      // 消费
      '白酒':{lo:15,hi:40},'食品饮料':{lo:17,hi:38},'家电':{lo:10,hi:25},
      '纺织服饰':{lo:13,hi:32},'商贸零售':{lo:14,hi:32},'旅游酒店':{lo:16,hi:40},'游戏传媒':{lo:15,hi:45},
      // 制造 & 新能源
      '新能源车':{lo:16,hi:50},'光伏设备':{lo:12,hi:38},'风电设备':{lo:15,hi:40},
      '汽车整车':{lo:14,hi:35},'机械设备':{lo:16,hi:40},
      // 周期 & 资源
      '房地产':{lo:6,hi:16},'建筑装饰':{lo:10,hi:24},'建筑材料':{lo:12,hi:28},
      '钢铁':{lo:8,hi:22},'有色金属':{lo:14,hi:40},'煤炭':{lo:6,hi:15},'石油石化':{lo:10,hi:24},
      '基础化工':{lo:15,hi:38},'轻工制造':{lo:14,hi:32},
      // 公用 & 其他
      '电力':{lo:12,hi:28},'环保':{lo:18,hi:40},'交通运输':{lo:11,hi:26},
      '农林牧渔':{lo:18,hi:45},'国防军工':{lo:30,hi:75},'商业航天':{lo:35,hi:100},
    };
    const r = rng[name] || {lo:10,hi:50};
    if(pe <= r.lo) return 5;
    if(pe >= r.hi) return 95;
    return Math.round(((pe-r.lo)/(r.hi-r.lo))*100);
  }

  function estPbPct(name, pb){
    const rng = {
      // 指数
      '上证指数':{lo:1.1,hi:2.0},'深证成指':{lo:1.6,hi:3.2},'沪深300':{lo:1.0,hi:1.9},'上证50':{lo:0.9,hi:1.7},
      '创业板指':{lo:4,hi:9},'中证500':{lo:1.3,hi:2.8},'中证1000':{lo:1.6,hi:3.5},'科创50':{lo:2.8,hi:5.5},
      '中证全指':{lo:1.2,hi:2.2},
      // 金融
      '银行':{lo:0.45,hi:0.95},'证券':{lo:1.0,hi:2.5},'保险':{lo:0.85,hi:2.0},
      // 科技
      '半导体':{lo:2.8,hi:6.5},'计算机':{lo:2.5,hi:5.5},'通信':{lo:1.4,hi:3.0},'电子元件':{lo:2.0,hi:4.8},
      // 医疗
      '医药生物':{lo:2.2,hi:4.5},'医疗器械':{lo:2.5,hi:5.2},
      // 消费
      '白酒':{lo:3.5,hi:8},'食品饮料':{lo:2.8,hi:6},'家电':{lo:2,hi:4.5},
      '纺织服饰':{lo:1.4,hi:3.0},'商贸零售':{lo:1.3,hi:2.6},'旅游酒店':{lo:1.6,hi:3.5},'游戏传媒':{lo:1.8,hi:4.5},
      // 制造 & 新能源
      '新能源车':{lo:1.8,hi:4},'光伏设备':{lo:1.4,hi:3.5},'风电设备':{lo:1.3,hi:3.0},
      '汽车整车':{lo:1.6,hi:3.2},'机械设备':{lo:1.5,hi:3.2},
      // 周期 & 资源
      '房地产':{lo:0.6,hi:1.5},'建筑装饰':{lo:0.7,hi:1.4},'建筑材料':{lo:1.2,hi:2.6},
      '钢铁':{lo:0.7,hi:1.8},'有色金属':{lo:1.6,hi:4.0},'煤炭':{lo:0.7,hi:1.5},'石油石化':{lo:0.85,hi:1.8},
      '基础化工':{lo:1.5,hi:3.2},'轻工制造':{lo:1.6,hi:3.2},
      // 公用 & 其他
      '电力':{lo:1.1,hi:2.2},'环保':{lo:1.5,hi:3.0},'交通运输':{lo:1.0,hi:2.0},
      '农林牧渔':{lo:1.8,hi:3.8},'国防军工':{lo:2.2,hi:5},'商业航天':{lo:3,hi:7},
    };
    const r = rng[name] || {lo:1,hi:5};
    if(pb <= r.lo) return 5;
    if(pb >= r.hi) return 95;
    return Math.round(((pb-r.lo)/(r.hi-r.lo))*100);
  }

  return {
    index: idxFound.length >= 3 ? {
      time: new Date().toISOString().split('T')[0],
      src: '东方财富行情API（实时）',
      items: idxFound.map(x => ({
        name: x.f14,
        pe: parseFloat(x.f20)||0,
        pePct: estPct(x.f14, parseFloat(x.f20)||0),
        pb: parseFloat(x.f21)||0,
        pbPct: estPbPct(x.f14, parseFloat(x.f21)||0),
        dy: (parseFloat(x.f45)||0)*100,
      }))
    } : null,
    industry: indFound.length >= 3 ? {
      time: new Date().toISOString().split('T')[0],
      src: '东方财富行情API（实时）',
      items: indFound.map(x => ({
        name: x.f14,
        pe: parseFloat(x.f20)||0,
        pePct: estPct(x.f14, parseFloat(x.f20)||0),
        pb: parseFloat(x.f21)||0,
        pbPct: estPbPct(x.f14, parseFloat(x.f21)||0),
        dy: (parseFloat(x.f45)||0)*100,
      }))
    } : null,
  };
}

/* ============ 复制 ============ */
function doCopy(){
  const rows = document.querySelectorAll('#tbody tr');
  const tabName = curTab === 'index' ? 'A股主要指数估值' : '行业板块估值';
  let t = tabName + '\n' + '='.repeat(70) + '\n';
  t += `导出：${new Date().toLocaleString('zh-CN')} · 排序：${getSortLabel()}\n\n`;
  const hasPB = true;
  t += `{'名称':<10} {'PE':>8} {'PE%':>7} {'PB':>6} {'PB%':>6} {'股息':>6} {'评级':<8}\n`;
  t += '-'.repeat(70)+'\n';
  rows.forEach(tr => {
    const td = tr.querySelectorAll('td');
    const n = td[0].textContent.trim(), pe = td[1].textContent.trim();
    const pt = td[2].querySelector('.pct-num')?.textContent.trim() || '';
    const pb = td[3].textContent.trim(), ppt = td[4].querySelector('.pct-num')?.textContent.trim() || '';
    const dy = td[5].textContent.trim(), tg = td[6].textContent.trim();
    t += `${n.padEnd(10)} ${pe.padStart(8)} ${pt.padStart(7)} ${pb.padStart(6)} ${ppt.padStart(6)} ${dy.padStart(6)} ${tg.padEnd(8)}\n`;
  });
  navigator.clipboard.writeText(t).then(()=>alert('✅ 已复制！')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=t;
    document.body.appendChild(ta);ta.select();document.execCommand('copy');
    document.body.removeChild(ta); alert('✅ 已复制！');
  });
}

/* ============ 启动 ============ */
render(FALLBACK_INDEX);
doRefresh();
</script>
