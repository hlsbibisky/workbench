<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>生活场景观察</title>
<style>
:root{
  --bg:#f7f4ee; --card:#fffdf9; --ink:#3a3631; --sub:#8a837a;
  --line:#ece5da; --accent:#b8714e; --accent2:#5b8c7b; --mark:#f0e3d6;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",serif;background:var(--bg);color:var(--ink);line-height:1.75;min-height:100vh;}
.wrap{max-width:720px;margin:0 auto;padding:26px 18px 60px;}

/* 顶部标题 */
.page-head{text-align:center;margin-bottom:22px;}
.page-head h1{font-size:23px;font-weight:700;color:var(--accent);letter-spacing:1px;}
.page-head p{font-size:13.5px;color:var(--sub);margin-top:6px;}

/* 进度（轻量文字，不用科技条） */
.prog{text-align:center;font-size:13px;color:var(--sub);margin:0 0 18px;}
.prog b{color:var(--accent);}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:18px;box-shadow:0 2px 10px rgba(120,90,60,0.05);}
.scene-desc{border-left:4px solid var(--accent2);}
.scene-desc h2{font-size:18px;color:var(--accent);margin-bottom:8px;font-weight:700;}
.scene-desc p{font-size:14.5px;color:var(--ink);}

/* 题卡 */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(120,90,60,0.04);}
.q-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap;}
.q-no{background:var(--accent);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.q-txt{font-size:15px;font-weight:600;margin-bottom:12px;line-height:1.7;}
.q-type{font-size:11px;color:var(--sub);margin-bottom:10px;}

/* 选项 */
.opts{display:flex;flex-direction:column;gap:9px;}
.opt{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;background:#fdfbf7;cursor:pointer;transition:.16s;font-size:14px;text-align:left;}
.opt:hover{border-color:var(--accent2);background:#f4f8f5;}
.opt.sel{border-color:var(--accent2);background:#eef5f1;}
.opt.ok{border-color:var(--accent2);background:#eef5f1;}
.opt.no{border-color:#c98a7a;background:#fbf0ec;}
.opt-letter{width:25px;height:25px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--sub);flex-shrink:0;}
.opt.sel .opt-letter,.opt.ok .opt-letter{background:var(--accent2);color:#fff;}
.opt.no .opt-letter{background:#c98a7a;color:#fff;}

.tf{display:flex;gap:10px;}
.tf-btn{flex:1;padding:12px;border:1.5px solid var(--line);border-radius:11px;background:#fdfbf7;cursor:pointer;font-size:15px;font-weight:600;text-align:center;transition:.16s;}
.tf-btn:hover{border-color:var(--accent2);}
.tf-btn.sel{border-color:var(--accent2);background:#eef5f1;}

/* 解析 */
.exp-toggle{display:flex;align-items:center;gap:6px;margin-top:13px;padding:8px 12px;background:var(--mark);border-radius:9px;cursor:pointer;font-size:13px;color:var(--accent);font-weight:600;transition:.16s;border:none;width:100%;text-align:left;font-family:inherit;}
.exp-toggle:hover{background:#e9dac9;}
.exp-toggle .ar{transition:transform .3s;font-size:10px;}
.exp-toggle.open .ar{transform:rotate(90deg);}
.exp-content{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 14px;background:#fcf8f2;border-radius:0 0 9px 9px;font-size:13.5px;line-height:1.9;color:var(--ink);}
.exp-content.open{max-height:1200px;padding:14px;}
.exp-content strong{color:var(--accent);}

/* 自由问答 */
.qa{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:6px;box-shadow:0 2px 8px rgba(120,90,60,0.04);}
.qa h3{font-size:16px;color:var(--accent);margin-bottom:10px;}
.qa-hist{max-height:280px;overflow-y:auto;margin-bottom:12px;}
.qa-item{margin-bottom:11px;padding:10px 12px;background:var(--mark);border-radius:9px;font-size:13.5px;line-height:1.8;}
.qa-q{color:var(--accent);font-weight:600;margin-bottom:3px;}
.qa-a{color:var(--ink);}
.qa-a strong{color:var(--accent);}
.qa-row{display:flex;gap:8px;}
.qa-input{flex:1;padding:10px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;outline:none;font-family:inherit;background:#fdfbf7;transition:.16s;}
.qa-input:focus{border-color:var(--accent2);}
.qa-send{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit;transition:.16s;}
.qa-send:hover{background:#a35f3e;}

/* 按钮 */
.btn{display:inline-block;padding:13px 38px;background:var(--accent);color:#fff;border:none;border-radius:26px;font-size:16px;cursor:pointer;font-family:inherit;font-weight:600;transition:.18s;box-shadow:0 3px 10px rgba(184,113,78,0.25);}
.btn:hover{background:#a35f3e;transform:translateY(-1px);}
.btn.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent);box-shadow:none;}
.btn.ghost:hover{background:var(--mark);}
.center{text-align:center;}

/* 导航 */
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;}
.nav .btn{padding:10px 22px;font-size:14px;}
.nav .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

/* 欢迎/结果 */
.welcome{text-align:center;padding:34px 18px;}
.welcome h2{font-size:22px;color:var(--accent);margin-bottom:14px;}
.welcome p{font-size:14.5px;color:var(--ink);margin-bottom:11px;line-height:1.9;}
.result{text-align:center;padding:30px 18px;}
.result h2{color:var(--accent);font-size:21px;margin-bottom:14px;}
.result .score{font-size:44px;color:var(--accent);font-weight:700;margin:16px 0 6px;}
.result p{font-size:14.5px;color:var(--ink);margin-bottom:8px;}

/* 场景列表（欢迎页选场景） */
.scene-list{display:flex;flex-direction:column;gap:10px;margin:18px 0;}
.scene-pick{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);cursor:pointer;transition:.16s;font-size:14.5px;}
.scene-pick:hover{border-color:var(--accent2);background:#f4f8f5;}
.scene-pick .st{font-size:12px;color:var(--sub);}
.scene-pick.done{border-color:var(--accent);background:#fbf2ea;}
@media(max-width:480px){
  .wrap{padding:20px 13px 54px;}
  .card,.q,.qa{padding:16px;}
  .q-txt{font-size:14px;}
  .opt{padding:10px 12px;font-size:13px;}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ========== DATA（来自桌面 index.html 完整迁移，UI 重写为工作台暖色宣纸调性） ==========
const SCENES = [
// ===== 数据由下方完整展开 =====
// ========== 场景1：拒绝别人的请求 ==========
{
  title:`拒绝别人的请求`,
  description:`朋友临时找你帮忙做一件你不太想做的事。你内心有些犹豫，但最终清晰地说出了"不"。`,
  questions:[
    {type:"mc",dimension:"shishen",
      text:`这种"清晰地说出不"的行为体现了什么？`,
      options:[
        {letter:"A",text:`印星——内在安全感的支撑`,correct:false},
        {letter:"B",text:`比劫——自我边界的清晰确立`,correct:true},
        {letter:"C",text:`财官——对外部资源的合理管控`,correct:false},
        {letter:"D",text:`食伤——自然流畅的表达`,correct:false}
      ],
      explanation:`<strong>正确答案：B</strong><br><br>比劫能量代表"自我边界"的力量。当你清晰地说出"不"，这是比劫能量健康运作的表现——你有能力区分"我的"和"不是我的"，有能力保护自己的能量不被过度消耗。<br><br><strong>干扰项辨析：</strong>食伤是表达，但说"不"的核心不是表达能力，而是边界意识；财官是外部管控，但拒绝请求首先是内在边界问题；印星是内在安全感，虽然提供了基础支撑，但"说不"这个动作本身是比劫的功能。<br><br><strong>关键区分：</strong>比劫管"边界"，食伤管"表达"，财官管"秩序"——拒绝是边界问题，不是表达问题。`
    },
    {type:"tf",dimension:"xingzuo",
      text:`从四象限角度看，"拒绝别人"属于火象维度（外在行动/可观察行为）的事件。`,
      correct:true,
      explanation:`<strong>正确答案：正确</strong><br><br>"拒绝"是一个可被外部观察到的行为，属于火象维度（外在行动）。但需要注意的是，拒绝的<strong>内在动机</strong>（我为什么要拒绝）属于水象维度（内在感受），而拒绝后的<strong>关系影响</strong>属于风象维度（关系沟通）。<br><br><strong>关键区分：</strong>同一个事件在四个维度都有对应——行为在火象，动机在水象，关系在风象，系统规则在土象。觉察时要有"四象限全景"意识。`
    },
    {type:"mc",dimension:"zonghe",
      text:`拒绝别人后，如果你感到轻松而非内疚，这说明什么？`,
      options:[
        {letter:"A",text:`你的比劫能量充足，边界感健康`,correct:true},
        {letter:"B",text:`你的印星能量不足，缺少安全感`,correct:false},
        {letter:"C",text:`你的食伤能量过弱，无法表达真实想法`,correct:false},
        {letter:"D",text:`你缺乏同理心，不在乎他人感受`,correct:false}
      ],
      explanation:`<strong>正确答案：A</strong><br><br>拒绝后感到轻松，说明你的比劫能量在健康运作——你守住了自己的边界，内在没有冲突。这种轻松感是比劫功能正常的信号。<br><br><strong>干扰项辨析：</strong>B选项是常见误解——设立边界不等于缺乏同理心。健康的拒绝恰恰是因为你足够了解自己，才能给出真实的回应。C和D描述的是能量不足的状态，但题目描述的是健康的拒绝。<br><br><strong>关键区分：</strong>内疚感往往意味着比劫被压制——你"应该"拒绝但"不敢"拒绝。轻松感才是比劫健康的标志。`
    },
    {type:"mc",dimension:"jung",
      text:`在拒绝别人的过程中，你清晰地感知到"我不想要这样做"，这种内在价值判断主要对应哪个认知功能？`,
      options:[
        {letter:"A",text:`Te（外倾思维）——基于效率的分析`,correct:false},
        {letter:"B",text:`Se（外倾感觉）——基于当下感官的体验`,correct:false},
        {letter:"C",text:`Fi（内倾情感）——基于内在价值观的判断`,correct:true},
        {letter:"D",text:`Fe（外倾情感）——基于群体和谐的考量`,correct:false}
      ],
      explanation:`<strong>正确答案：C</strong><br><br>Fi（内倾情感）是"向内"的价值判断——我内心觉得这件事对不对、值不值得、是否符合我的价值观。"我不想要这样做"正是Fi的典型表达。<br><br><strong>干扰项辨析：</strong>Fe会考虑"拒绝会不会让对方不高兴"——这是向外的情感判断；Te会考虑"这件事值不值得花时间"——这是效率导向；Se关注当下的感官体验，与价值判断无关。<br><br><strong>关键区分：</strong>Fi对应比劫/食伤——内在价值观；Fe对应食伤/杀——群体和谐。拒绝时用的是Fi还是Fe，决定了你是忠于自己还是照顾他人。`
    },
    {type:"tf",dimension:"flow",
      text:`从五行流转的角度看，拒绝别人属于"金"的收敛能量——收缩、划定边界。`,
      correct:true,
      explanation:`<strong>正确答案：正确</strong><br><br>五行中，"金"主收敛、肃降、划定边界。拒绝别人正是"金"的功能——收缩自己的能量场，明确什么是"我的范围"，什么是"范围之外"。<br><br><strong>五行对应：</strong>木（生发/开始）→ 火（绽放/表达）→ 土（承载/接纳）→ 金（收敛/边界）→ 水（潜藏/休养）。拒绝是金的收敛功能。<br><br><strong>关键区分：</strong>如果金的收敛功能不足，就会"边界松散"——什么都答应，能量持续外泄。`
    },
    {type:"mc",dimension:"body",
      text:`当你清晰地说出"不"的那一刻，身体最可能的感受是什么？`,
      options:[
        {letter:"A",text:`喉咙感到紧缩和堵塞`,correct:false},
        {letter:"B",text:`腹部感到空虚和不安`,correct:false},
        {letter:"C",text:`头顶感到压力和沉重`,correct:false},
        {letter:"D",text:`胸口有一种稳定而有力的感觉`,correct:true}
      ],
      explanation:`<strong>正确答案：D</strong><br><br>比劫能量对应的身体区域是胸口（心轮区域）。当比劫健康运作时，胸口会有一种稳定、有力、"站得住"的感觉。这就是"有底气"的身体表达。<br><br><strong>干扰项辨析：</strong>B选项（喉咙紧缩）是食伤受阻的身体信号——想说但不敢说；C选项（腹部空虚）是印星不足——缺少内在支撑；D选项（头顶压力）是杀能量——面对挑战时的压力感。<br><br><strong>关键区分：</strong>身体觉察比思维更准确。胸口有力 = 比劫在线；胸口发虚 = 比劫不足。学会识别这个信号，就能实时觉察自己的边界状态。`
    }
  ]
},
// ========== 场景2：拒绝后的内心反应 ==========
{
  title:`拒绝后的内心反应`,
  description:`你拒绝了朋友的请求后，内心开始出现各种声音："我是不是太自私了？""他会不会不高兴？"但同时也有一个声音说："我确实有自己的安排。"`,
  questions:[
    {type:"mc",dimension:"shishen",
      text:`"我是不是太自私了"这种自我质疑，主要反映了什么能量状态？`,
      options:[
        {letter:"A",text:`财官过强——过度关注外部评价`,correct:false},
        {letter:"B",text:`印星充足——内在安全感很强`,correct:false},
        {letter:"C",text:`食伤过旺——过度表达和反思`,correct:false},
        {letter:"D",text:`比劫被压制——自我需求被道德评判覆盖`,correct:true}
      ],
      explanation:`<strong>正确答案：D</strong><br><br>"我是不是太自私了"是比劫被压制的典型表现——你的自我需求被一个"应该为别人付出"的道德框架所覆盖。比劫的核心功能是维护自我边界，当它被压制时，你会觉得"维护自己的需求 = 自私"。<br><br><strong>干扰项辨析：</strong>食伤过旺是"说太多"而非"质疑自己"；财官过强关注的是外部评价（"别人怎么看我"），而非内在道德评判；印星充足的人不会有这种自我质疑。<br><br><strong>关键区分：</strong>比劫健康的人拒绝后感到轻松；比劫被压制的人拒绝后感到内疚。内疚感是比劫被压制的信号。`
    },
    {type:"tf",dimension:"xingzuo",
      text:`"他会不会不高兴"这种担忧属于水象维度（内在体验/主观感受）的关注。`,
      correct:false,
      explanation:`<strong>正确答案：错误</strong><br><br>"他会不会不高兴"关注的是<strong>他人的感受</strong>和<strong>关系的影响</strong>，这属于风象维度（关系沟通/共享意义），而非水象维度。<br><br><strong>四象限回顾：</strong>水象关注的是"我的内在体验"（我自己的情绪、感受）；风象关注的是"关系层面"（别人怎么想、关系会怎样）。<br><br><strong>关键区分：</strong>如果是"我拒绝后感到内疚"，这是水象维度（我的内在感受）；但"他会不会不高兴"是在关注对方的感受和关系影响，这是风象维度。`
    },
    {type:"mc",dimension:"zonghe",
      text:`"我确实有自己的安排"这个声音代表什么？`,
      options:[
        {letter:"A",text:`比劫的真实声音——自我需求的清晰表达`,correct:true},
        {letter:"B",text:`财官的计算——权衡利弊后的理性判断`,correct:false},
        {letter:"C",text:`食伤的合理化——为自己的拒绝找借口`,correct:false},
        {letter:"D",text:`印星的退缩——回避冲突的防御机制`,correct:false}
      ],
      explanation:`<strong>正确答案：A</strong><br><br>"我确实有自己的安排"是比劫的真实声音——它不需要解释、不需要理由，只是清晰地陈述一个事实：我有自己的需求和安排。这是比劫健康运作的表现。<br><br><strong>干扰项辨析：</strong>如果是"合理化"，你会编造一个理由而非陈述事实；印星的退缩是"算了不说清楚"而非清晰表达；财官的计算会有更多利弊分析而非简单的事实陈述。<br><br><strong>关键区分：</strong>比劫的表达是简洁、直接、不需要论证的。当你发现自己在反复解释拒绝的理由时，说明比劫已经被动摇了。`
    },
    {type:"mc",dimension:"jung",
      text:`在内心两种声音的拉扯中，如果你最终倾向于照顾对方的感受而后悔拒绝，这主要体现了哪个认知功能的主导？`,
      options:[
        {letter:"A",text:`Fe（外倾情感）——优先考虑群体和谐与他人感受`,correct:true},
        {letter:"B",text:`Ti（内倾思维）——追求内部逻辑一致性`,correct:false},
        {letter:"C",text:`Ni（内倾直觉）——依赖深层预感`,correct:false},
        {letter:"D",text:`Fi（内倾情感）——坚持内在价值观`,correct:false}
      ],
      explanation:`<strong>正确答案：A</strong><br><br>Fe（外倾情感）的核心特征是"以他人的情感状态为参照"——对方的感受比自己的需求更重要。当Fe过度主导时，你会为了维持和谐而牺牲自己的边界。<br><br><strong>干扰项辨析：</strong>Fi会坚持"我的感受更重要"——不会后悔拒绝；Ti关注逻辑一致性，不太会被情感拉扯；Ni是直觉功能，与这种情感决策模式无关。<br><br><strong>关键区分：</strong>Fe对应食伤/杀——关注群体和谐；Fi对应比劫/食伤——关注内在价值。Fe过度 = 讨好模式；Fi健康 = 边界清晰。`
    },
    {type:"mc",dimension:"flow",
      text:`从五行流转角度看，拒绝后的内疚感说明能量卡在了哪个环节？`,
      options:[
        {letter:"A",text:`金的收敛过度——边界太硬导致内在冲突`,correct:false},
        {letter:"B",text:`水的潜藏不足——缺少内在休养`,correct:false},
        {letter:"C",text:`火的绽放受阻——表达后无法自然过渡`,correct:false},
        {letter:"D",text:`土的承载失衡——接纳与边界之间失去平衡`,correct:true}
      ],

    {keys:['拖延','完美主义'], ans:`拖延往往不是懒，而是能量卡住了。常见模式：<strong>完美主义是杀能量过度（自我施压）+ 食伤受阻（不敢输出）的组合</strong>。解决方法是先让食伤流动起来——允许不完美的输出。`},
    {keys:['情绪','感受'], ans:`情绪是能量状态的信号。比劫相关情绪：愤怒、委屈（边界被侵犯）；食伤相关情绪：兴奋或空虚（输出过多或过少）；财官相关情绪：焦虑或踏实（外部掌控感）；印星相关情绪：安全或不安（内在滋养状态）；杀相关情绪：压力或振奋（挑战应对）。`},
    {keys:['身体','身体觉察'], ans:`身体是能量最诚实的指标。比劫——胸口的力量感或紧缩；食伤——喉咙的通畅或堵塞；财官——肩背的紧张或放松；印星——腹部的温暖或冰凉；杀——头顶的压力或清明。<strong>身体觉察比思维分析更准确</strong>。`},
    {keys:['内疚','愧疚','自责'], ans:`内疚感的身体表现主要在<strong>肩背部</strong>，而非胸口。<br><br><strong>原因分析：</strong>内疚是"我做了不该做的事"或"我没做应该做的事"的自我评判，这属于财官/土的能量范畴——关乎规则、责任、秩序。肩背部是财官能量的身体对应区域，当内在出现"应该vs不应该"的冲突时，肩背会不自觉地紧张——这是"承担责任"的身体模式。`},
    {keys:['胸口','胸闷','心里沉'], ans:`胸口的感受主要对应<strong>比劫</strong>和<strong>食伤</strong>的能量状态。<br><br>• 胸口有力、稳定 = 比劫健康（自我边界清晰）<br>• 胸口紧缩、发虚 = 比劫被压（不敢维护边界）<br>• 胸口堵塞、有话说不出 = 食伤受阻（表达被压抑）<br><br><strong>关键区分：</strong>如果你感到胸口闷，先辨别是"不敢说"（食伤）还是"不敢做"（比劫）。`},
    {keys:['肩背','肩膀','背部'], ans:`肩背部是<strong>财官能量</strong>的身体对应区域。<br><br>• 肩背放松 = 财官健康（能高效运作但不被外部评价绑架）<br>• 肩背紧张、僵硬 = 财官过度（过度承担责任、过度关注外部规则）<br><br><strong>释放方法：</strong>觉察到肩背紧张时，做几个深呼吸，有意识地"放下"不属于你的责任。`},
  ];
  let bestMatch = null, lastPosition = -1;
  for (const item of keywords) {
    for (const k of item.keys) {
      const pos = q.lastIndexOf(k);
      if (pos !== -1 && pos > lastPosition) { lastPosition = pos; bestMatch = item; }
    }
  }
  if (bestMatch) return bestMatch.ans;
  return `这是一个很好的觉察问题。试着从"十神"和"五行流转"的角度看看：此刻是哪个能量在主导？它是在顺畅流动，还是被卡住了？<br><br>你可以描述得更具体一些（比如涉及<strong>边界、表达、身体感受、拖延</strong>等），我会给出更贴合的解读。`;
}

// ========== 状态 ==========
const KEY='life_scene_obs_v1';
let state = loadState();
function loadState(){
  try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.answers) return s; }catch(e){}
  return {started:false, mode:'all', currentScene:0, currentQ:0, answers:{}, qaHistory:{}, randomQueue:[]};
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
// 把所有题打平为一维 [{si,qi}] 并打乱
function buildRandomQueue(){
  const q=[];
  SCENES.forEach((sc,si)=>sc.questions.forEach((_,qi)=>q.push({si,qi})));
  return shuffle(q);
}
function saveState(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

function getTotalQ(){ return SCENES.reduce((s,x)=>s+x.questions.length,0); }
function getAnswered(){ let n=0; for(const k in state.answers) n++; return n; }
function isSceneDone(si){ return SCENES[si].questions.every((_,qi)=>state.answers[si+'_'+qi]!==undefined); }

const app=document.getElementById('app');

function render(){
  if(!state.started){ renderWelcome(); return; }
  if(state.mode==='all'){
    if(state.currentScene>=SCENES.length){ renderResult(); return; }
    renderScene();
  } else if(state.mode==='random'){
    if(state.currentQ>=state.randomQueue.length){ renderResult(); return; }
    renderRandom();
  } else {
    renderScene();
  }
}

function renderWelcome(){
  const done = SCENES.filter((_,i)=>isSceneDone(i)).length;
  let html = `<div class="welcome">
    <h2>生活场景观察</h2>
    <p>二十个日常瞬间，带你用「十神 · 五行 · 荣格八维 · 四象」的视角，重新看懂自己如何反应、为何反应。</p>
    <p>每题选完即显答案与解析；随时可在场景里写自己的困惑，系统会给出能量视角的解读。</p>
    <p style="font-size:13px;color:var(--sub);">已完成场景：${done} / ${SCENES.length}</p>
    <button class="btn" onclick="startRandom()">随机闯关（全部题目打乱）</button>
    <div style="height:14px"></div>
    <button class="btn ghost" onclick="startAll()">从头开始闯关</button>
    <div style="height:14px"></div>
    <button class="btn ghost" onclick="pickMode()">选择单个场景</button>
  </div>`;
  app.innerHTML = html;
}

function pickMode(){
  let list = SCENES.map((s,i)=>{
    const d = isSceneDone(i) ? '<span class="st">✓ 已完成</span>' : `<span class="st">${s.questions.length} 题</span>`;
    return `<div class="scene-pick ${isSceneDone(i)?'done':''}" onclick="startSingle(${i})">
      <span>${i+1}. ${s.title}</span>${d}</div>`;
  }).join('');
  app.innerHTML = `<div class="page-head"><h1>选择场景</h1></div>
    <div class="scene-list">${list}</div>
    <div class="center"><button class="btn ghost" onclick="goHome()">返回</button></div>`;
}

function startAll(){ state.started=true; state.mode='all'; state.currentScene=0; state.currentQ=0; saveState(); render(); }
function startSingle(i){ state.started=true; state.mode='single'; state.currentScene=i; state.currentQ=0; saveState(); render(); }
function startRandom(){ state.started=true; state.mode='random'; state.randomQueue=buildRandomQueue(); state.currentQ=0; saveState(); render(); }

function renderScene(){
  const sc = SCENES[state.currentScene];
  const total = getTotalQ();
  const answered = getAnswered();
  let prog = state.mode==='all'
    ? `总进度 ${answered} / ${total} 题 · 场景 ${state.currentScene+1} / ${SCENES.length}`
    : `场景 ${state.currentScene+1} / ${SCENES.length} · ${getDimLabel('x')}`;
  let html = `<div class="page-head"><h1>${sc.title}</h1></div>
    <div class="prog"><b>${prog}</b></div>
    <div class="card scene-desc"><h2>场景</h2><p>${sc.description}</p></div>`;

  sc.questions.forEach((q,qi)=>{
    const aKey = state.currentScene+'_'+qi;
    const ans = state.answers[aKey];
    let qHtml = `<div class="q">
      <div class="q-head"><span class="q-no">${qi+1}</span></div>
      <div class="q-txt">${q.text}</div>`;
    if(q.type==='mc'){
      qHtml += `<div class="opts">`;
      q.options.forEach((o,oi)=>{
        let cls='opt', letter=o.letter;
        if(ans!==undefined){
          if(oi===ans){ cls += ans===oi&&o.correct ? ' ok':' no'; }
          else if(o.correct){ cls += ' ok'; }
        }
        const mark = (ans!==undefined && o.correct) ? '✓' : (ans===oi? '✗':'');
        qHtml += `<div class="${cls}" ${ans!==undefined?'':'onclick="selOpt('+state.currentScene+','+qi+','+oi+')"'}>
          <span class="opt-letter">${mark||letter}</span><span>${o.text}</span></div>`;
      });
      qHtml += `</div>`;
    } else {
      const tfCls = (v)=>{ if(ans===undefined) return 'tf-btn'; const right=(v===q.correct); return 'tf-btn '+(ans===v?(right?'sel':'sel'):''); };
      qHtml += `<div class="tf">
        <div class="${ans!==undefined?'tf-btn sel':'tf-btn'}" ${ans!==undefined?'':'onclick="selTF('+state.currentScene+','+qi+',true)"'}>正确</div>
        <div class="${ans!==undefined?'tf-btn sel':'tf-btn'}" ${ans!==undefined?'':'onclick="selTF('+state.currentScene+','+qi+',false)"'}>错误</div>
      </div>`;
      if(ans!==undefined){
        const ok = (ans===q.correct);
        qHtml += `<div style="margin-top:9px;font-size:13px;color:${ok?'var(--accent2)':'#c98a7a'};font-weight:600;">你的判断：${ans?'正确':'错误'} · 正确答案：${q.correct?'正确':'错误'} ${ok?'✓':'✗'}</div>`;
      }
    }
    // 解析
    const expOpen = ans!==undefined ? ' open':'';
    qHtml += `<button class="exp-toggle${expOpen}" onclick="toggleExp(this)"><span class="ar">▶</span>${ans!==undefined?'查看解析':'选完显示解析'}</button>
      <div class="exp-content${expOpen}">${q.explanation}</div>`;
    qHtml += `</div>`;
    html += qHtml;
  });

  // 自由问答
  html += `<div class="qa"><h3>这个场景，你有什么想记录的？</h3>
    <div class="qa-hist" id="qaHist"></div>
    <div class="qa-row"><input class="qa-input" id="qaInput" placeholder="写下你的困惑或观察…" onkeydown="if(event.key==='Enter')sendQA()">
    <button class="qa-send" onclick="sendQA()">解读</button></div></div>`;

  // 导航
  const isLast = state.mode==='all' && state.currentScene===SCENES.length-1;
  let navHtml = `<div class="nav">`;
  if(state.mode==='all'){
    navHtml += `<button class="btn ghost" ${state.currentScene===0?'disabled':''} onclick="goPrev()">上一场景</button>
    <button class="btn" onclick="goNext()">${isLast?'完成':'下一场景'}</button>`;
  } else {
    navHtml += `<button class="btn" onclick="goNext()">下一场景</button>`;
  }
  navHtml += `<button class="btn ghost" onclick="goHome()">返回首页</button></div>`;
  html += navHtml;
  app.innerHTML = html;
  renderQA();
}

function selOpt(si,qi,oi){
  const k=si+'_'+qi; if(state.answers[k]!==undefined) return;
  state.answers[k]=oi; saveState(); render();
}
function selTF(si,qi,val){
  const k=si+'_'+qi; if(state.answers[k]!==undefined) return;
  state.answers[k]=val; saveState(); render();
}

// 随机闯关：所有题目打平打乱后逐题出现
function renderRandom(){
  const item = state.randomQueue[state.currentQ];
  const sc = SCENES[item.si];
  const q = sc.questions[item.qi];
  const aKey = item.si+'_'+item.qi;
  const ans = state.answers[aKey];
  const total = state.randomQueue.length;
  const answered = getAnswered();
  let html = `<div class="page-head"><h1>随机闯关</h1></div>
    <div class="prog"><b>第 ${state.currentQ+1} / ${total} 题 · 来自「${sc.title}」 · 已答 ${answered} 题</b></div>`;

  let qHtml = `<div class="q">
    <div class="q-head"><span class="q-no">${state.currentQ+1}</span></div>
    <div class="q-txt">${q.text}</div>`;
  if(q.type==='mc'){
    qHtml += `<div class="opts">`;
    q.options.forEach((o,oi)=>{
      let cls='opt', letter=o.letter;
      if(ans!==undefined){
        if(oi===ans){ cls += ans===oi&&o.correct ? ' ok':' no'; }
        else if(o.correct){ cls += ' ok'; }
      }
      const mark = (ans!==undefined && o.correct) ? '✓' : (ans===oi? '✗':'');
      qHtml += `<div class="${cls}" ${ans!==undefined?'':'onclick="selOpt('+item.si+','+item.qi+','+oi+')"'}>
        <span class="opt-letter">${mark||letter}</span><span>${o.text}</span></div>`;
    });
    qHtml += `</div>`;
  } else {
    qHtml += `<div class="tf">
      <div class="${ans!==undefined?'tf-btn sel':'tf-btn'}" ${ans!==undefined?'':'onclick="selTF('+item.si+','+item.qi+',true)"'}>正确</div>
      <div class="${ans!==undefined?'tf-btn sel':'tf-btn'}" ${ans!==undefined?'':'onclick="selTF('+item.si+','+item.qi+',false)"'}>错误</div>
    </div>`;
    if(ans!==undefined){
      const ok = (ans===q.correct);
      qHtml += `<div style="margin-top:9px;font-size:13px;color:${ok?'var(--accent2)':'#c98a7a'};font-weight:600;">你的判断：${ans?'正确':'错误'} · 正确答案：${q.correct?'正确':'错误'} ${ok?'✓':'✗'}</div>`;
    }
  }
  const expOpen = ans!==undefined ? ' open':'';
  qHtml += `<button class="exp-toggle${expOpen}" onclick="toggleExp(this)"><span class="ar">▶</span>${ans!==undefined?'查看解析':'选完显示解析'}</button>
    <div class="exp-content${expOpen}">${q.explanation}</div></div>`;
  html += qHtml;

  const isLast = state.currentQ===total-1;
  html += `<div class="nav">
    <button class="btn ghost" ${state.currentQ===0?'disabled':''} onclick="randPrev()">上一题</button>
    <button class="btn" onclick="goNext()">${isLast?'完成':'下一题'}</button>
    <button class="btn ghost" onclick="goHome()">返回首页</button>
  </div>`;
  app.innerHTML = html;
}
function randPrev(){ if(state.currentQ>0){ state.currentQ--; saveState(); render(); } }
function toggleExp(btn){ btn.classList.toggle('open'); btn.nextElementSibling.classList.toggle('open'); }

function sendQA(){
  const input=document.getElementById('qaInput');
  const q=input.value.trim(); if(!q) return;
  const a=generateAnswer(q);
  const key='scene_'+state.currentScene;
  if(!state.qaHistory[key]) state.qaHistory[key]=[];
  state.qaHistory[key].push({q,a});
  input.value=''; saveState(); renderQA();
  setTimeout(()=>{ const h=document.getElementById('qaHist'); if(h) h.scrollTop=h.scrollHeight; },30);
}
function renderQA(){
  const hist=document.getElementById('qaHist'); if(!hist) return;
  const key='scene_'+state.currentScene;
  const list=state.qaHistory[key]||[];
  hist.innerHTML = list.map(it=>`<div class="qa-item"><div class="qa-q">问：${it.q}</div><div class="qa-a">答：${it.a}</div></div>`).join('')
    || '<div style="font-size:13px;color:var(--sub);padding:6px 2px;">还没有记录，写下你的观察吧。</div>';
}

function goNext(){
  if(state.mode==='random'){
    if(state.currentQ<state.randomQueue.length-1){ state.currentQ++; saveState(); render(); }
    else { renderResult(); }
    return;
  }
  if(state.mode==='single'){ renderWelcome(); return; }
  if(state.currentScene<SCENES.length-1){ state.currentScene++; state.currentQ=0; saveState(); render(); }
  else { renderResult(); }
}
function goPrev(){
  if(state.mode==='random'){ if(state.currentQ>0){ state.currentQ--; saveState(); render(); } return; }
  if(state.currentScene>0){ state.currentScene--; state.currentQ=0; saveState(); render(); }
}

function renderResult(){
  const total=getTotalQ(); const answered=getAnswered();
  const doneScenes=SCENES.filter((_,i)=>isSceneDone(i)).length;
  let correct=0;
  SCENES.forEach((sc,si)=>sc.questions.forEach((q,qi)=>{
    const a=state.answers[si+'_'+qi];
    if(a===undefined) return;
    if(q.type==='mc'){ if(q.options[a] && q.options[a].correct) correct++; }
    else { if(a===q.correct) correct++; }
  }));
  const acc = answered? Math.round(correct/answered*100):0;
  app.innerHTML = `<div class="result">
    <h2>这一轮观察完成</h2>
    <div class="score">${doneScenes}<span style="font-size:18px;color:var(--sub)"> / ${SCENES.length} 场景</span></div>
    <p>已作答 ${answered} / ${total} 题 · 答对 ${correct} 题（${acc}%）</p>
    <p style="font-size:13.5px;color:var(--sub);margin-top:10px;line-height:1.9;">觉察不在"答对"，而在"看见"。<br>你愿意为哪一个反应停下来，那一瞬就是成长的入口。</p>
    <div style="height:16px"></div>
    <button class="btn" onclick="restart()">再来一轮</button>
    <div style="height:10px"></div>
    <button class="btn ghost" onclick="goHome()">回到首页</button>
  </div>`;
}
function restart(){
  const keepMode = state.mode;
  state.started=false; state.mode=keepMode; state.currentScene=0; state.currentQ=0;
  state.answers={}; state.qaHistory={};
  if(keepMode==='random') state.randomQueue=buildRandomQueue();
  saveState(); render();
}
// 返回首页：彻底回到初始欢迎界面
function goHome(){ state.started=false; saveState(); render(); }

render();
</script>
</body></html>
