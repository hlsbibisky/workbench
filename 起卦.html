<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>六爻起卦</title>
<style>
  :root{
    --bg:#f7f4ee; --card:#fffdf9; --ink:#3a3631; --sub:#8a837a;
    --line:#ece5da; --accent:#b8714e; --accent2:#5b8c7b; --mark:#f0e3d6;
    --red:#c0392b; --green:#27ae60; --gold:#b8860b;
    --radius:14px; --shadow:0 1px 3px rgba(58,54,49,.06),0 10px 30px rgba(58,54,49,.05);
    --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;height:100dvh;margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--font);line-height:1.6;-webkit-font-smoothing:antialiased;
    overscroll-behavior:none;}
  ::selection{background:var(--mark);}

  /* ===== 桌面横版布局 ===== */
  .app{display:grid;grid-template-columns:400px 1fr;gap:0;min-height:100dvh;
    max-width:1400px;margin:0 auto;}

  /* 左侧面板 */
  .panel-left{padding:24px 20px;border-right:1px solid var(--line);background:var(--card);
    display:flex;flex-direction:column;overflow-y:auto;}
  /* 右侧面板 */
  .panel-right{padding:24px 28px;overflow-y:auto;background:var(--bg);}

  h1{text-align:center;font-size:22px;letter-spacing:4px;color:var(--accent);margin:0 0 4px;}
  .lead{text-align:center;font-size:13px;color:var(--sub);margin:0 0 18px;}

  .steps{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:18px;}
  .step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;max-width:100px;}
  .step-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:600;border:2px solid var(--line);color:var(--sub);background:var(--card);transition:.3s;}
  .step.active .step-dot{border-color:var(--accent);color:var(--accent);background:var(--mark);}
  .step.done .step-dot{border-color:var(--accent);color:#fff;background:var(--accent);}
  .step-label{font-size:11px;color:var(--sub);letter-spacing:1px;}
  .step.active .step-label,.step.done .step-label{color:var(--ink);font-weight:500;}
  .step-line{width:24px;height:2px;background:var(--line);margin:0 -2px;margin-bottom:18px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 16px;margin-bottom:14px;box-shadow:var(--shadow);}
  .card-title{font-size:15px;font-weight:600;color:var(--accent);margin:0 0 10px;
    display:flex;align-items:center;gap:6px;}

  .q-input{width:100%;min-height:80px;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;font-family:inherit;font-size:14px;color:var(--ink);resize:vertical;
    background:#fff;line-height:1.6;transition:.2s;}
  .q-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(184,113,78,.12);}
  .q-input::placeholder{color:var(--sub);}
  .q-count{text-align:right;font-size:11px;color:var(--sub);margin-top:4px;}
  .quick-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .tag{font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:16px;
    background:#fff;color:var(--sub);cursor:pointer;transition:.15s;white-space:nowrap;}
  .tag:hover{border-color:var(--accent);color:var(--accent);}

  .mode-select{display:flex;gap:8px;}
  .mode-btn{flex:1;padding:12px 8px;border:2px solid var(--line);border-radius:12px;
    background:var(--card);cursor:pointer;text-align:center;transition:.2s;font-family:inherit;}
  .mode-btn:hover{border-color:var(--accent);}
  .mode-btn.selected{border-color:var(--accent);background:var(--mark);}
  .mode-icon{font-size:24px;margin-bottom:4px;}
  .mode-name{font-size:14px;font-weight:600;color:var(--ink);}
  .mode-desc{font-size:11px;color:var(--sub);margin-top:2px;}

  .btn-primary{display:block;width:100%;padding:12px;border:none;border-radius:10px;
    background:var(--accent);color:#fff;font-size:15px;font-weight:600;letter-spacing:2px;
    cursor:pointer;font-family:inherit;transition:.15s;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;}

  /* ===== 铜钱区域（SVG逼真铜钱） ===== */
  .coins-area{text-align:center;padding:8px 0 16px;}
  .coins{display:flex;justify-content:center;gap:24px;margin:16px 0;align-items:flex-end;}
  .coin-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .coin{width:90px;height:90px;position:relative;cursor:pointer;perspective:600px;transition:transform .15s;}
  .coin-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.25,.46,.45,.94);}
  .coin.flipping .coin-inner{animation:coinFlip3d .7s ease-in-out;}
  @keyframes coinFlip3d{
    0%{transform:rotateY(0deg) rotateX(0deg) scale(1);}
    20%{transform:rotateY(180deg) rotateX(60deg) translateY(-30px) scale(1.08);}
    40%{transform:rotateY(450deg) rotateX(120deg) translateY(-50px) scale(1.05);}
    60%{transform:rotateY(720deg) rotateX(200deg) translateY(-20px) scale(1.02);}
    80%{transform:rotateY(1000deg) rotateX(300deg) translateY(-10px) scale(1);}
    100%{transform:rotateY(1440deg) rotateX(360deg) translateY(0) scale(1);}
  }
  .coin-face{position:absolute;width:100%;height:100%;border-radius:50%;
    backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
    transition:opacity .3s;}
  .coin-face svg{width:88%;height:88%;drop-shadow:0 4px 12px rgba(0,0,0,.35);}
  .coin-tail{transform:rotateY(180deg);}
  .coin-label{font-size:12px;color:var(--sub);font-weight:500;letter-spacing:2px;
    height:20px;display:flex;align-items:center;justify-content:center;}

  .throw-hint{text-align:center;font-size:14px;color:var(--sub);margin:12px 0 8px;}
  .throw-progress{text-align:center;font-size:13px;color:var(--accent);font-weight:500;margin:6px 0;}

  .gua-forming{margin-top:12px;}
  .forming-title{text-align:center;font-size:13px;color:var(--sub);margin-bottom:8px;letter-spacing:2px;}
  .yao-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(236,229,218,.5);}
  .yao-row:last-child{border-bottom:none;}
  .yao-name{width:32px;font-size:12px;color:var(--sub);text-align:right;flex-shrink:0;}
  .yao-lines{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;height:24px;}
  .yao-line{height:4px;background:var(--ink);border-radius:2px;transition:.3s;}
  .yao-line.yang{width:64px;}
  .yao-line.yin{width:28px;}
  .yao-line.yin-gap{width:12px;}
  .yao-type{width:42px;font-size:11px;color:var(--sub);text-align:left;flex-shrink:0;}
  .yao-type.old-yang{color:var(--red);}
  .yao-type.old-yin{color:var(--green);}

  /* ===== 右侧结果区 ===== */
  .result-header{text-align:center;padding:12px 0 6px;}
  .result-gua-name{font-size:48px;font-weight:700;color:var(--accent);letter-spacing:10px;margin:4px 0 2px;}
  .result-gua-change{font-size:17px;color:var(--sub);letter-spacing:2px;}
  .result-gua-change span{color:var(--ink);font-weight:600;}

  .info-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:12px 0;}
  .info-key{color:var(--sub);font-size:13px;}
  .info-val{color:var(--ink);font-weight:500;}

  .zhuang-table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0;}
  .zhuang-table th{color:var(--sub);font-weight:500;font-size:12px;padding:7px 6px;
    border-bottom:2px solid var(--line);text-align:center;letter-spacing:1px;}
  .zhuang-table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle;}
  .zhuang-table tr:last-child td{border-bottom:none;}
  .table-section-title{font-size:14px;font-weight:600;color:var(--accent);
    padding:12px 0 6px;letter-spacing:1px;}

  .td-yao{display:flex;align-items:center;justify-content:center;gap:4px;height:26px;}
  .td-yao .yl{height:4px;background:var(--ink);border-radius:2px;}
  .td-yao .yl.yang{width:40px;}
  .td-yao .yl.yin{width:18px;}
  .td-yao .yl.gap{width:8px;}
  .dong-mark{color:var(--red);font-weight:700;font-size:12px;margin-left:2px;}

  .verdict-card{background:linear-gradient(135deg,#fef9f3,#fdf3e8);border:1px solid var(--line);
    border-radius:14px;padding:16px 14px;margin:14px 0;}
  .verdict-title{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;}
  .verdict-conclusion{font-size:15px;color:var(--ink);line-height:1.7;}
  .verdict-basis{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.7;}

  .ci-section{margin:16px 0;}
  .ci-title{font-size:15px;font-weight:600;color:var(--accent);margin:0 0 8px;display:flex;align-items:center;gap:6px;}
  .ci-ori{font-size:15px;font-weight:600;color:var(--ink);margin:6px 0 4px;padding:10px 14px;background:var(--mark);border-radius:10px;}
  .ci-xiang{font-size:13px;color:var(--sub);margin:4px 0 6px;font-style:italic;}
  .ci-explain{font-size:14px;color:var(--ink);line-height:1.8;}

  .yao-item{padding:10px 0;border-bottom:1px solid var(--line);}
  .yao-item:last-child{border-bottom:none;}
  .yao-item-header{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:4px;}
  .yao-ci{font-size:14px;color:var(--ink);margin:3px 0;}
  .yao-explain{font-size:13px;color:var(--sub);line-height:1.7;}

  .copy-prompt{background:var(--ink);color:#f0ead6;padding:14px 14px;border-radius:12px;
    font-size:12px;line-height:1.8;white-space:pre-wrap;word-break:break-all;
    max-height:280px;overflow-y:auto;font-family:inherit;}
  .copy-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px;
    margin-top:8px;border:1px solid var(--accent);color:var(--accent);background:transparent;
    border-radius:10px;cursor:pointer;font-size:14px;font-family:inherit;font-weight:500;transition:.15s;}
  .copy-btn:hover{background:var(--mark);}
  .copy-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:rgba(58,54,49,.88);color:#fff;padding:14px 28px;border-radius:12px;
    font-size:15px;z-index:9999;pointer-events:none;opacity:0;transition:.3s;
    box-shadow:0 8px 30px rgba(0,0,0,.2);}
  .copy-toast.show{opacity:1;}

  .page{display:none;}
  .page.active{display:block;}

  /* 底部操作栏 */
  .bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);
    border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:10px;z-index:100;
    max-width:1400px;margin:0 auto;}
  .bottom-bar button{flex:1;padding:10px;border-radius:10px;font-size:14px;cursor:pointer;
    font-family:inherit;font-weight:500;transition:.15s;}
  .bb-ghost{border:1px solid var(--line);background:var(--card);color:var(--sub);}
  .bb-ghost:hover{border-color:var(--accent);color:var(--accent);}
  .bb-main{border:none;background:var(--accent);color:#fff;}
  .bb-main:hover{filter:brightness(1.05);}

  /* 结果页：右侧全宽展示 */
  #page-result.page.active{display:block;}

  /* ===== 响应式：平板/手机回退为单栏 ===== */
  @media(max-width:900px){
    .app{grid-template-columns:1fr;gap:0;}
    .panel-left{border-right:none;border-bottom:1px solid var(--line);max-width:none;}
    .panel-right{padding:16px 16px 80px;}
    .result-gua-name{font-size:36px;letter-spacing:6px;}
    .coins{gap:18px;}
    .coin{width:78px;height:78px;}
  }
  @media(max-width:520px){
    .panel-left{padding:14px 12px 70px;}
    .coin{width:68px;height:68px;}
    .result-gua-name{font-size:30px;letter-spacing:4px;}
    .zhuang-table{font-size:12px;}
    .zhuang-table td,.zhuang-table th{padding:6px 4px;}
    .info-grid{font-size:13px;}
  }
  .yao-placeholder{color:#ccc;font-size:11px;}
</style>
</head>
<body>
<div class="app">

<!-- ===== 左侧面板 ===== -->
<div class="panel-left">

<!-- 页面1：输入问题 -->
<div class="page active" id="page-input">
  <h1>⚊ 六爻起卦</h1>
  <p class="lead">诚心默念，一卦一问</p>

  <div class="steps">
    <div class="step active" id="st1"><div class="step-dot">✎</div><div class="step-label">输入问题</div></div>
    <div class="step-line"></div>
    <div class="step" id="st2"><div class="step-dot">🪙</div><div class="step-label">投掷铜钱</div></div>
    <div class="step-line"></div>
    <div class="step" id="st3"><div class="step-dot">◎</div><div class="step-label">查看结果</div></div>
  </div>

  <div class="card">
    <div class="card-title">✎ 请输入您想问的问题</div>
    <textarea class="q-input" id="questionInput" placeholder="尽量具体，如：这段关系有没有可能推进？&#10;&#10;注意事项：一事一问，心诚意专。" maxlength="200"></textarea>
    <div class="q-count"><span id="qCount">0</span> / 200</div>
    <div class="quick-tags">
      <span class="tag" onclick="setQ('今天是否适合推进项目？')">🔆 今天是否适合推进项目？</span>
      <span class="tag" onclick="setQ('这份工作值得继续做吗？')">💼 是否该换工作？</span>
      <span class="tag" onclick="setQ('TA对我有意思吗？')">💕 TA对我有意？</span>
      <span class="tag" onclick="setQ('近期财运如何？')">💰 近期财运如何？</span>
      <span class="tag" onclick="setQ('这件事能成吗？')">🎯 这件事能成吗？</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">◎ 选择起卦方式</div>
    <div class="mode-select">
      <div class="mode-btn selected" id="modeManual" onclick="selectMode('manual')">
        <div class="mode-icon">🪙</div><div class="mode-name">逐爻投掷</div><div class="mode-desc">手动投掷六次</div>
      </div>
      <div class="mode-btn" id="modeAuto" onclick="selectMode('auto')">
        <div class="mode-icon">⚡</div><div class="mode-name">一键起卦</div><div class="mode-desc">自动生成六爻</div>
      </div>
    </div>
  </div>

  <button class="btn-primary" id="startBtn" onclick="startDivination()" style="margin-top:6px;">▶ 开始起卦</button>
  <p style="text-align:center;font-size:11px;color:var(--sub);margin-top:8px;">
    问题越具体，卦象参考价值越高
  </p>
</div>

<!-- 页面2：投掷铜钱 -->
<div class="page" id="page-throw">
  <h1 style="font-size:18px;margin:12px 0 2px;">⚊ 六爻起卦</h1>
  <div class="steps">
    <div class="step done" id="st1b"><div class="step-dot">✓</div><div class="step-label">输入问题</div></div>
    <div class="step-line"></div>
    <div class="step active" id="st2b"><div class="step-dot">🪙</div><div class="step-label">投掷铜钱</div></div>
    <div class="step-line"></div>
    <div class="step" id="st3b"><div class="step-dot">◎</div><div class="step-label">查看结果</div></div>
  </div>

  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;">
      <span style="font-size:14px;color:var(--ink);" id="throwQuestion">?</span>
      <button style="border:none;background:none;color:var(--sub);cursor:pointer;font-size:16px;"
              onclick="editQuestion()" title="修改问题">✎</button>
    </div>
  </div>

  <div class="card">
    <div class="coins-area">
      <div style="text-align:center;font-size:16px;font-weight:600;color:var(--accent);letter-spacing:2px;" id="coinsTitle">投掷铜钱</div>
      <div class="coins">
        <!-- 铜钱0：正面（字面） -->
        <div class="coin-wrap">
          <div class="coin" id="coin0"><div class="coin-inner">
            <div class="coin-face coin-head">
              <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs><radialGradient id="cg" cx="35%" cy="30%" r="65%"><stop offset="0%" stop-color="#e8c86a"/><stop offset="55%" stop-color="#c9a035"/><stop offset="100%" stop-color="#9a7820"/></radialGradient></defs>
                <circle cx="50" cy="50" r="47" fill="url(#cg)" stroke="#8B6914" stroke-width="2"/>
                <circle cx="50" cy="50" r="44" fill="none" stroke="#a68320" stroke-width=".5" opacity=".5"/>
                <rect x="41" y="41" width="18" height="18" rx="1" fill="#8B6914"/>
                <text x="50" y="27" text-anchor="middle" fill="#6b520e" font-size="11" font-weight="700" font-family="KaiTi,STKaiti,serif">通</text>
                <text x="50" y="79" text-anchor="middle" fill="#6b520e" font-size="11" font-weight="700" font-family="KaiTi,STKaiti,serif">宝</text>
              </svg>
            </div>
            <div class="coin-face coin-tail">
              <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs><radialGradient id="cb" cx="35%" cy="30%" r="65%"><stop offset="0%" stop-color="#d4a84b"/><stop offset="55%" stop-color="#b8922d"/><stop offset="100%" stop-color="#8a6a18"/></radialGradient></defs>
                <circle cx="50" cy="50" r="47" fill="url(#cb)" stroke="#7a5a10" stroke-width="2"/>
                <circle cx="50" cy="50" r="44" fill="none" stroke="#9a7820" stroke-width=".5" opacity=".4"/>
                <rect x="41" y="41" width="18" height="18" rx="1" fill="#7a5a10"/>
                <text x="50" y="36" text-anchor="middle" fill="#5a4208" font-size="10" font-weight="700" font-family="KaiTi,STKaiti,serif">乾</text>
                <text x="50" y="72" text-anchor="middle" fill="#5a4208" font-size="10" font-weight="700" font-family="KaiTi,STKaiti,serif">隆</text>
              </svg>
            </div>
          </div></div>
          <div class="coin-label" id="cr0"></div>
        </div>
        <!-- 铜钱1 -->
        <div class="coin-wrap">
          <div class="coin" id="coin1"><div class="coin-inner">
            <div class="coin-face coin-head">
              <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="47" fill="url(#cg)" stroke="#8B6914" stroke-width="2"/>
                <circle cx="50" cy="50" r="44" fill="none" stroke="#a68320" stroke-width=".5" opacity=".5"/>
                <rect x="41" y="41" width="18" height="18" rx="1" fill="#8B6914"/>
                <text x="50" y="27" text-anchor="middle" fill="#6b520e" font-size="11" font-weight="700" font-family="KaiTi,STKaiti,serif">通</text>
                <text x="50" y="79" text-anchor="middle" fill="#6b520e" font-size="11" font-weight="700" font-family="KaiTi,STKaiti,serif">宝</text>
              </svg>
            </div>
            <div class="coin-face coin-tail">
              <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="47" fill="url(#cb)" stroke="#7a5a10" stroke-width="2"/>
                <circle cx="50" cy="50" r="44" fill="none" stroke="#9a7820" stroke-width=".5" opacity=".4"/>
                <rect x="41" y="41" width="18" height="18" rx="1" fill="#7a5a10"/>
                <text x="50" y="36" text-anchor="middle" fill="#5a4208" font-size="10" font-weight="700" font-family="KaiTi,STKaiti,serif">乾</text>
                <text x="50" y="72" text-anchor="middle" fill="#5a4208" font-size="10" font-weight="700" font-family="KaiTi,STKaiti,serif">隆</text>
              </svg>
            </div>
          </div></div>
          <div class="coin-label" id="cr1"></div>
        </div>
        <!-- 铜钱2 -->
        <div class="coin-wrap">
          <div class="coin" id="coin2"><div class="coin-inner">
            <div class="coin-face coin-head">
              <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="47" fill="url(#cg)" stroke="#8B6914" stroke-width="2"/>
                <circle cx="50" cy="50" r="44" fill="none" stroke="#a68320" stroke-width=".5" opacity=".5"/>
                <rect x="41" y="41" width="18" height="18" rx="1" fill="#8B6914"/>
                <text x="50" y="27" text-anchor="middle" fill="#6b520e" font-size="11" font-weight="700" font-family="KaiTi,STKaiti,serif">通</text>
                <text x="50" y="79" text-anchor="middle" fill="#6b520e" font-size="11" font-weight="700" font-family="KaiTi,STKaiti,serif">宝</text>
              </svg>
            </div>

// ============================================================

const TIANGAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];

function getLiujin(gong, na){
  const gw = BAGUA_WU[gong];
  const w = ZHI_WU[na];
  if(w === gw) return '兄弟';
  const sheng={'木':'火','火':'土','土':'金','金':'水','水':'木'};
  const ke={'木':'土','土':'水','水':'火','火':'金','金':'木'};
  if(sheng[gw]===w) return '子孙';
  if(ke[gw]===w) return '妻财';
  if(sheng[w]===gw) return '父母';
  if(ke[w]===gw) return '官鬼';
  return '兄弟';
}

// 世应位置（0-based：0初…5上）
function getShiYing(guaName, gong){
  const list = GONG_MAP[gong] || [];
  const idx = list.indexOf(guaName);
  if(idx < 0) return {shi:5, ying:2};
  const shiPos = [5,0,1,2,3,4,3,2][idx];
  const yingPos = (shiPos + 3) % 6;
  return {shi:shiPos, ying:yingPos};
}

function getXunkong(rizhi){
  const xu = DIZHI.indexOf(rizhi);
  const start = (xu + 2) % 12;
  return [DIZHI[start], DIZHI[(start+1)%12]];
}

// 干支（日柱精确；月柱按节气近似定月支+五虎遁定月干）
function getGanZhi(date){
  const year = date.getFullYear();
  const h = date.getHours();
  const yGan = TIANGAN[(year - 4) % 10];
  const yZhi = DIZHI[(year - 4) % 12];
  // 月柱：十二节（定月）近似
  const jie = [[1,6,'丑'],[2,4,'寅'],[3,6,'卯'],[4,5,'辰'],[5,6,'巳'],[6,6,'午'],[7,7,'未'],[8,8,'申'],[9,8,'酉'],[10,8,'戌'],[11,7,'亥'],[12,7,'子']];
  let mZhi = '子';
  const md = (date.getMonth()+1)*100 + date.getDate();
  for(const [jm,jd,z] of jie){ if(md >= jm*100+jd) mZhi = z; else break; }
  const yGanIdx = TIANGAN.indexOf(yGan);
  const yinGan = (yGanIdx*2 + 2) % 10;
  const mGanIdx = (yinGan + (DIZHI.indexOf(mZhi) - 2)) % 10;
  const mGan = TIANGAN[(mGanIdx+10)%10];
  // 日柱（以 1970-01-01 庚午为锚）
  const diff = Math.floor((date.getTime() - new Date(1970,0,1).getTime()) / 86400000);
  const dGan = TIANGAN[((6 + diff) % 10 + 10) % 10];
  const dZhi = DIZHI[((6 + diff) % 12 + 12) % 12];
  // 时柱
  const hZhiIdx = Math.floor((h + 1) / 2) % 12;
  const hGan = TIANGAN[(TIANGAN.indexOf(dGan)*2 + hZhiIdx) % 10];
  return {nian:yGan+yZhi, yue:mGan+mZhi, ri:dGan+dZhi, shi:hGan+DIZHI[hZhiIdx], riZhi:dZhi};
}

// 八卦名（上、下）
function getGuaParts(yaos){
  const lower = yaos[2]+''+yaos[1]+''+yaos[0];
  const upper = yaos[5]+''+yaos[4]+''+yaos[3];
  return {upper:BIT2GUA[upper], lower:BIT2GUA[lower]};
}
function resolveGuaName(upper, lower){
  return GUA_MAP[upper+lower] || (upper+lower);
}

// 六神起法（日干定初爻六神）
const SHEN_BY_GAN = {'甲':'青龙','乙':'青龙','丙':'朱雀','丁':'朱雀','戊':'勾陈','己':'螣蛇','庚':'白虎','辛':'白虎','壬':'玄武','癸':'玄武'};

const RAW = `

// 解析 RAW 为 GUA64 对象
const GUA64 = {};
RAW.trim().split('\n').forEach(line=>{
  const p = line.split('|');
  if(p.length < 17) return;
  const name = p[0];
  const yaoco = [];
  for(let i=0;i<6;i++){
    yaoco.push({ci:p[5+i*2], explain:p[6+i*2]});
  }
  GUA64[name] = {
    gong: p[1],
    ci: {original:p[2], xiang:p[3], explain:p[4]},
    yaoco: yaoco
  };
});

// ============================================================
//  应用状态与交互
// ============================================================
let appState = {question:'', mode:'manual', throws:[], currentThrow:0, result:null};

function setQ(q){ document.getElementById('questionInput').value = q; updateQCount(); }
function updateQCount(){ document.getElementById('qCount').textContent = document.getElementById('questionInput').value.length; }
document.getElementById('questionInput').addEventListener('input', updateQCount);

function selectMode(m){
  appState.mode = m;
  document.getElementById('modeManual').classList.toggle('selected', m==='manual');
  document.getElementById('modeAuto').classList.toggle('selected', m==='auto');
}

function showPage(id){
  // 左侧页面切换
  document.querySelectorAll('.panel-left .page').forEach(p => p.classList.remove('active'));
  const leftPage = document.getElementById('page-'+id);
  if(leftPage) leftPage.classList.add('active');
  // 右侧：只有 result 页才切换
  if(id === 'result'){
    document.getElementById('page-result-placeholder').style.display = 'none';
    document.getElementById('page-result').classList.add('active');
  } else {
    document.getElementById('page-result-placeholder').style.display = '';
    document.getElementById('page-result').classList.remove('active');
  }
  document.getElementById('bottomBar').style.display = (id==='result') ? 'flex' : 'none';
}

function startDivination(){
  const q = document.getElementById('questionInput').value.trim();
  if(!q){ alert('请输入您想问的问题'); return; }
  appState.question = q;
  document.getElementById('throwQuestion').textContent = q.length > 20 ? q.slice(0,20)+'…' : q;
  if(appState.mode === 'auto'){
    appState.throws = [];
    for(let i=0;i<6;i++) appState.throws.push([Math.random()>0.5, Math.random()>0.5, Math.random()>0.5]);
    computeAndShowResult();
  } else {
    appState.throws = []; appState.currentThrow = 0;
    resetFormingArea(); updateThrowUI();
    showPage('throw');
  }
}

function throwCoins(){
  if(appState.currentThrow >= 6) return;
  const btn = document.getElementById('throwBtn');
  btn.disabled = true;
  const result = [Math.random()>0.5, Math.random()>0.5, Math.random()>0.5];
  appState.throws.push(result);

  for(let i=0;i<3;i++){
    const coin = document.getElementById('coin'+i);
    coin.classList.add('flipping');
    setTimeout(()=>{
      coin.classList.remove('flipping');
      coin.querySelector('.coin-inner').style.transform = result[i] ? 'rotateY(0deg)' : 'rotateY(180deg)';
      document.getElementById('cr'+i).textContent = result[i] ? '字' : '背';
      document.getElementById('cr'+i).style.opacity = '1';
    }, 720);
  }

  setTimeout(()=>{
    updateFormingRow(appState.currentThrow, result);
    appState.currentThrow++;
    if(appState.currentThrow >= 6){
      document.getElementById('throwHint').textContent = '✨ 卦象已成！';
      document.getElementById('throwProgress').textContent = '';
      btn.style.display = 'none';
      setTimeout(computeAndShowResult, 800);
    } else {
      btn.disabled = false;
      document.getElementById('throwCount').textContent = appState.currentThrow + 1;
      document.getElementById('throwHint').textContent = '点击下方按钮投掷铜钱';
      document.getElementById('throwProgress').textContent = '正在生成第 ' + (appState.currentThrow+1) + ' 爻…';
      setTimeout(()=>{
        for(let i=0;i<3;i++){
          document.getElementById('cr'+i).textContent = '';
          document.getElementById('cr'+i).style.opacity = '0';
        }
      }, 1200);
    }
  }, 780);
}

function updateFormingRow(idx, result){
  const count = result.filter(Boolean).length;
  let type, cssClass;
  if(count === 3){ type='老阳'; cssClass='old-yang'; }
  else if(count === 2){ type='少阳'; cssClass=''; }
  else if(count === 1){ type='少阴'; cssClass=''; }
  else { type='老阴'; cssClass='old-yin'; }
  const isYang = count >= 2;
  const rows = document.querySelectorAll('#formingArea .yao-row');
  const row = rows[5-idx];
  const linesDiv = row.querySelector('.yao-lines');
  const typeDiv = row.querySelector('.yao-type');
  if(isYang){ linesDiv.innerHTML = '<div class="yao-line yang"></div>'; }
  else { linesDiv.innerHTML = '<div class="yao-line yin"></div><div class="yao-line yin-gap"></div><div class="yao-line yin"></div>'; }
  typeDiv.textContent = type;
  typeDiv.className = 'yao-type' + (cssClass ? ' '+cssClass : '');
}

function resetFormingArea(){
  let html = '';
  for(let i=0;i<6;i++){
    const name = YAO_LABELS[5-i];
    html += '<div class="yao-row"><div class="yao-name">'+name+'</div><div class="yao-lines"></div><div class="yao-type yao-placeholder">未掷</div></div>';
  }
  document.getElementById('formingArea').innerHTML = html;
}

function updateThrowUI(){
  document.getElementById('throwCount').textContent = '1';
  document.getElementById('throwBtn').disabled = false;
  document.getElementById('throwBtn').style.display = '';
  document.getElementById('throwHint').textContent = '点击下方按钮投掷铜钱';
  document.getElementById('throwProgress').textContent = '';
  for(let i=0;i<3;i++){
    const c = document.getElementById('coin'+i);
    c.classList.remove('flipping');
    c.querySelector('.coin-inner').style.transform = '';
    document.getElementById('cr'+i).textContent = '';
    document.getElementById('cr'+i).style.opacity = '0';
  }
}

function editQuestion(){ showPage('input'); }

// ---- 计算结果 ----
function computeAndShowResult(){
  const yaos = [];
  const dongYaos = [];
  for(let i=0;i<6;i++){
    const t = appState.throws[i];
    const count = t.filter(Boolean).length;
    if(count === 3){ yaos.push(1); dongYaos.push(i); }
    else if(count === 2){ yaos.push(1); }
    else if(count === 1){ yaos.push(0); }
    else { yaos.push(0); dongYaos.push(i); }
  }

  const benParts = getGuaParts(yaos);
  const benGuaName = resolveGuaName(benParts.upper, benParts.lower);

  const bianyaos = yaos.slice();
  dongYaos.forEach(d => { bianyaos[d] = 1 - bianyaos[d]; });
  const bianParts = getGuaParts(bianyaos);
  const bianGuaName = resolveGuaName(bianParts.upper, bianParts.lower);

  const benData = GUA64[benGuaName] || {gong:'乾', ci:{original:'',xiang:'',explain:''}, yaoco:[]};
  const bianData = GUA64[bianGuaName] || null;
  const gz = getGanZhi(new Date());
  const xk = getXunkong(gz.riZhi);
  const sy = getShiYing(benGuaName, benData.gong);

  appState.result = {
    question: appState.question, time: new Date(), ganzhi: gz, xunkong: xk,
    benGua: benGuaName, bianGua: bianGuaName, gong: benData.gong,
    yaos: yaos, bianyaos: bianyaos, dongYaos: dongYaos, shiYing: sy,
    data: benData, bianData: bianData
  };

  renderResult();
  showPage('result');
  document.querySelectorAll('#st3 .step-dot, #st3b .step-dot').forEach(e => e.textContent = '✓');
  document.getElementById('st3').className = 'step done';
  document.getElementById('st3b').className = 'step done';
}

// ---- 渲染 ----
function renderResult(){
  const r = appState.result; if(!r) return;
  document.getElementById('resGuaName').textContent = r.benGua;
  document.getElementById('resGuaChange').innerHTML = r.dongYaos.length > 0
    ? (r.benGua + ' → ' + r.bianGua) : (r.benGua + '（无变爻）');

  const timeStr = r.time.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  document.getElementById('resInfoCard').innerHTML =
    '<div class="info-grid">' +
    '<div class="info-key">问事</div><div class="info-val">'+escHtml(r.question)+'</div>' +
    '<div class="info-key">日期</div><div class="info-val">'+timeStr+'</div>' +
    '<div class="info-key">干支</div><div class="info-val">'+r.ganzhi.nian+'年 '+r.ganzhi.yue+'月 '+r.ganzhi.ri+'日 '+r.ganzhi.shi+'时</div>' +
    '<div class="info-key">卦象</div><div class="info-val" style="font-size:16px;font-weight:600;">'+r.benGua+(r.dongYaos.length>0?(' → '+r.bianGua):'')+'</div>' +
    '<div class="info-key">宫位</div><div class="info-val">'+r.gong+'宫（'+BAGUA_WU[r.gong]+'）</div>' +
    '<div class="info-key">空亡</div><div class="info-val">日空：'+r.xunkong[0]+r.xunkong[1]+'</div>' +
    '</div>';

  renderTable(r);
  renderVerdict(r);
  renderGuaCi(r);
  renderYaoCi(r);
  renderAIPrompt(r);
}

function renderTable(r){
  const upper = getGuaParts(r.yaos).upper;
  const lower = getGuaParts(r.yaos).lower;
  const allNa = [...NAJIA[lower], ...NAJIA[upper]];
  const riGan = r.ganzhi.ri[0];
  const shenStart = SHEN_BY_GAN[riGan];
  const shenShift = SHEN_ORDER.indexOf(shenStart);

  let html = '<table class="zhuang-table"><tr><th>六神</th><th>六亲</th><th>纳甲</th><th>爻</th><th>世应</th></tr>';
  for(let i=5;i>=0;i--){
    const na = allNa[i] || '?';
    const qin = getLiujin(r.gong, na);
    const shen = SHEN_ORDER[(shenShift+i)%6];
    const isYang = r.yaos[i] === 1;
    const isDong = r.dongYaos.includes(i);
    const isShi = i === r.shiYing.shi;
    const isYing = i === r.shiYing.ying;
    let yaoLineHtml = isYang
      ? '<div class="td-yao"><div class="yl yang"></div></div>'
      : '<div class="td-yao"><div class="yl yin"></div><div class="yl gap"></div><div class="yl yin"></div></div>';
    const dongMark = isDong ? '<span class="dong-mark">'+(isYang?'×':'○')+'</span>' : '';
    const shiYingMark = isShi ? ' <b>世</b>' : (isYing ? ' <b>应</b>' : '');
    const typeLabel = (isDong && isYang) ? '老阳' : (isDong && !isYang) ? '老阴' : (isYang ? '少阳' : '少阴');
    html += '<tr><td>'+shen+'</td><td>'+qin+'</td><td>'+na+'</td><td>'+yaoLineHtml+' '+dongMark+'</td><td>'+typeLabel+shiYingMark+'</td></tr>';
  }
  html += '</table>';

  if(r.dongYaos.length > 0){
    const bUpper = getGuaParts(r.bianyaos).upper;
    const bLower = getGuaParts(r.bianyaos).lower;
    const bNa = [...NAJIA[bLower], ...NAJIA[bUpper]];
    html += '<div class="table-section-title">【变卦】'+r.bianGua+'</div><table class="zhuang-table"><tr><th>六神</th><th>六亲</th><th>纳甲</th><th>爻</th></tr>';
    for(let i=5;i>=0;i--){
      const na = bNa[i] || '?';
      const qin = getLiujin(r.gong, na);
      const shen = SHEN_ORDER[(shenShift+i)%6];
      const isYang = r.bianyaos[i] === 1;
      let yaoLineHtml = isYang
        ? '<div class="td-yao"><div class="yl yang"></div></div>'
        : '<div class="td-yao"><div class="yl yin"></div><div class="yl gap"></div><div class="yl yin"></div></div>';
      html += '<tr><td>'+shen+'</td><td>'+qin+'</td><td>'+na+'</td><td>'+yaoLineHtml+' '+(isYang?'少阳':'少阴')+'</td></tr>';
    }
    html += '</table>';
  }
  document.getElementById('resTable').innerHTML = html;
}

function renderVerdict(r){
  const dCount = r.dongYaos.length;
  let conclusion, basis;
  if(dCount === 0){
    conclusion = r.benGua + ' 之卦，六爻安静，以本卦卦辞为主参考。';
    basis = '依据：本卦卦辞 — ' + (r.data.ci.original || '（略）') + '\n' + (r.data.ci.explain || '');
  } else if(dCount <= 3){
    const dongStr = r.dongYaos.map(d => YAO_NAMES[d]+'爻').join('、');
    conclusion = dCount + ' 爻动（' + dongStr + '），以本卦与变卦综合参断。';
    basis = '依据：本卦卦辞 — ' + (r.data.ci.original || '（略）') + '，' + (r.data.ci.xiang || '') + '\n';
    if(r.bianData){ basis += '变卦卦辞 — ' + (r.bianData.ci.original || '（略）') + '\n'; }
    basis += '\n补充：以上仅基于卦象规则，请结合现实约束综合决策。';
  } else {
    conclusion = dCount + ' 爻动：爻动过多，卦象纷杂，以本卦卦辞为主参考。';
    basis = '依据：本卦卦辞 — ' + (r.data.ci.original || '（略）') + '\n' + (r.data.ci.explain || '');
  }
  document.getElementById('resVerdict').innerHTML =
    '<div class="verdict-card"><div class="verdict-title"><span style="font-size:20px;margin-right:6px;">🔔</span>结论</div>' +
    '<div class="verdict-conclusion">'+conclusion+'</div>' +
    '<div class="verdict-basis">'+basis.replace(/\n/g,'<br>')+'</div></div>';
}

function renderGuaCi(r){
  const d = r.data; if(!d || !d.ci) return;
  document.getElementById('resGuaCi').innerHTML =
    '<div style="text-align:center;font-size:26px;font-weight:700;color:var(--accent);margin:10px 0;">'+r.benGua+'</div>' +
    '<div class="ci-ori">'+d.ci.original+'</div>' +
    (d.ci.xiang ? '<div class="ci-xiang">象曰：'+d.ci.xiang+'</div>' : '') +
    '<div class="ci-explain">'+d.ci.explain+'</div>';
}

function renderYaoCi(r){
  const d = r.data; if(!d || !d.yaoco || d.yaoco.length === 0) return;
  let html = '';
  for(let i=0;i<6;i++){
    const isYang = r.yaos[i] === 1;
    const label = (isYang ? ['初九','九二','九三','九四','九五','上九'] : ['初六','六二','六三','六四','六五','上六'])[i];
    const yao = d.yaoco[i]; if(!yao) continue;
    const isDong = r.dongYaos.includes(i);
    html += '<div class="yao-item"><div class="yao-item-header">'+label+(isDong?' <span style="color:var(--red)">（动爻）</span>':'')+'</div>' +
      '<div class="yao-ci">'+yao.ci+'</div><div class="yao-explain">'+yao.explain+'</div></div>';
  }
  document.getElementById('resYaoCi').innerHTML = html;
}

function renderAIPrompt(r){
  const dCount = r.dongYaos.length;
  const dongStr = r.dongYaos.map(d => YAO_NAMES[d]+'爻').join('、');
  const upper = getGuaParts(r.yaos).upper;
  const lower = getGuaParts(r.yaos).lower;
  const allNa = [...NAJIA[lower], ...NAJIA[upper]];
  const riGan = r.ganzhi.ri[0];
  const shenShift = SHEN_ORDER.indexOf(SHEN_BY_GAN[riGan]);

  let benTable = '| 爻位 | 六神 | 六亲 | 纳甲 | 爻 | 世应 |\n|---|---|---|---|---|---|\n';
  for(let i=5;i>=0;i--){
    const na = allNa[i] || '?';
    const qin = getLiujin(r.gong, na);
    const shen = SHEN_ORDER[(shenShift+i)%6];
    const isYang = r.yaos[i]===1;
    const isDong = r.dongYaos.includes(i);
    const isShi = i===r.shiYing.shi;
    const isYing = i===r.shiYing.ying;
    const yaoType = (isDong && isYang) ? '老阳' : (isDong && !isYang) ? '老阴' : (isYang?'少阳':'少阴');
    const sy = isShi ? '世' : (isYing ? '应' : '');
    benTable += '| '+YAO_LABELS[5-i]+' | '+shen+' | '+qin+' | '+na+' | '+yaoType+' | '+sy+' |\n';
  }

  let bianTable = '';
  if(r.dongYaos.length > 0){
    const bUpper = getGuaParts(r.bianyaos).upper;
    const bLower = getGuaParts(r.bianyaos).lower;
    const bNa = [...NAJIA[bLower], ...NAJIA[bUpper]];
    bianTable = '\n\n变卦装卦信息：\n| 爻位 | 六神 | 六亲 | 纳甲 | 爻 |\n|---|---|---|---|---|\n';
    for(let i=5;i>=0;i--){
      const na = bNa[i]||'?';
      const qin = getLiujin(r.gong, na);
      const shen = SHEN_ORDER[(shenShift+i)%6];
      const isYang = r.bianyaos[i]===1;
      bianTable += '| '+YAO_LABELS[5-i]+' | '+shen+' | '+qin+' | '+na+' | '+(isYang?'少阳':'少阴')+' |\n';
    }
  }

  const prompt =
'采用六爻占卜，占得以下信息，请你帮我完整断卦：\n\n' +
'1️⃣起卦信息：\n\n' +
'主卦：' + r.benGua + '。\n' +
'变卦：' + r.bianGua + '。\n\n' +
(dCount > 0 ? ('此卦有' + dCount + '个爻变。\n变爻：' + dongStr + '\n') : '此卦无动爻。\n') +
'\n占卜问题：' + r.question + '\n\n' +
'起卦时间：' + r.ganzhi.nian + '年 ' + r.ganzhi.yue + '月 ' + r.ganzhi.ri + '日\n' +
'日旬空：' + r.xunkong[0] + r.xunkong[1] + '空\n\n' +
'主卦属于' + r.gong + '宫本宫卦\n\n' +
'主卦装卦信息：\n' + benTable + bianTable + '\n\n' +
'你是六爻解卦助手。仅依据《古筮真诠（总论篇、易理篇）》进行解读与推断：不创造书中没有的规则，不以个人体系替代原书观点。所有结论都要能追溯到书中章节或规则。\n\n' +
'目标\n- 让新手一眼看懂"结论是什么、为什么、要补什么"。\n- 将解卦过程结构化、可复核、可复现。\n- 用清晰的逻辑链条解释结论来源。\n\n' +
'输入要求（尽量完整）\n- 所问事项与背景（具体到时间/对象/范围）\n- 起卦方式与时间（年/月/日/时）\n- 卦象信息：本卦、变卦、动爻、世应、六亲（若有月建/日辰/旬空/六神也提供）\n- 若为代占或意念不明，说明占卜意念来源\n\n' +
'工作流程\n1. 信息校验：标注缺失项与冲突项。\n2. 取用神：说明取用神依据（书中规则/章节）。\n3. 定旺衰：结合日月、动变与相关规则判断旺衰。\n4. 看动变：分析动爻、变爻、化进化退、暗动等影响。\n5. 看冲合：六冲、六合、三合等格局影响。\n6. 看特殊格局：伏吟、反吟、句空、三墓、三绊等。\n7. 断应期：给出应期推断与依据。\n8. 汇总结论：区分"可断结论"与"待证结论"。\n\n' +
'输出格式（新手友好）\n1. 结论卡片（必须先给）\n   - 结论：明确回答"成/不成/利/不利/吉/凶/有/无/快/慢"等\n   - 置信度：高/中/低（并说明是信息不足还是卦象不明）\n   - 时间提示：若可断应期，用"xx时间段"；不可断则写"无法断定"\n2. 一句话原因（100 字内，面向新手）\n3. 趋避建议（可执行、简短；仅基于书中规则推导，不引入外部常识）\n4. 依据链路（按顺序列出：取用神/旺衰/动变/冲合/特殊格局/应期）\n5. 证据引用（短引用 + 对应章节/关键词）\n6. 不确定项与缺失信息（必要时提出补充问题）\n\n' +
'约束\n- 不脱离原书体系，不引入其他流派规则\n- 原文引用不超过 100 字；仅在必要处引用\n- 明确区分已知事实、推断与假设\n- 若信息不足或规则不覆盖，明确说明"无法断定"';

  document.getElementById('aiPrompt').textContent = prompt;
}

function copyPrompt(){
  const text = document.getElementById('aiPrompt').textContent;
  const done = ()=>{ const t=document.getElementById('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else { fallbackCopy(text,done); }
}
function fallbackCopy(text,cb){
  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ alert('复制失败，请手动选择文本复制'); }
  document.body.removeChild(ta);
}

function resetAll(){
  appState = {question:'',mode:'manual',throws:[],currentThrow:0,result:null};
  document.getElementById('questionInput').value=''; updateQCount();
  selectMode('manual'); updateThrowUI(); resetFormingArea();
  showPage('input');
  document.querySelectorAll('.step').forEach((s,i)=>{ s.className='step'+(i===0?' active':''); });
  document.querySelectorAll('.step-dot').forEach(e=>{
    e.textContent = e.closest('.step').querySelector('.step-label').textContent==='输入问题' ? '✎' :
                    e.closest('.step').querySelector('.step-label').textContent==='投掷铜钱' ? '🪙' : '◎';
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function scrollToTop(){ window.scrollTo({top:0,behavior:'smooth'}); }
function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 工具：从卦名取上卦首字对应的八卦名（上卦）
function resolveUpper(r){ return getGuaParts(r.yaos).upper; }
