<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>工作台</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b8714e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<link rel="icon" type="image/x-icon" href="icons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<style>
  /* 与「状态记录」模块保持一致的暖色宣纸风格 */
  :root{
    --bg:#f7f4ee; --card:#fffdf9; --ink:#3a3631; --sub:#8a837a;
    --line:#ece5da; --accent:#b8714e; --accent2:#5b8c7b; --mark:#f0e3d6;
    --noted:#3f9d6b;
    --radius:14px;
    --shadow:0 1px 3px rgba(58,54,49,.06), 0 10px 30px rgba(58,54,49,.05);
    --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; height:100dvh;}
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font); line-height:1.5; -webkit-font-smoothing:antialiased;
    overscroll-behavior:none; }
  ::selection{ background:var(--mark); }
  .app{ min-height:100vh; min-height:100dvh; }

  .app{ display:flex; min-height:100vh; }

  /* ===== 左侧导航栏 ===== */
  .sidebar{
    width:240px; flex:0 0 240px; background:var(--card);
    border-right:1px solid var(--line); padding:22px 14px;
    display:flex; flex-direction:column; gap:4px;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    position:relative;
    display:flex; align-items:center; gap:9px;
    padding:4px 4px 16px 24px; margin-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .brand-stack{
    display:flex; flex-direction:column; align-items:flex-start;
    font-weight:700; color:var(--accent); line-height:1.05;
  }
  .brand-tag, .brand-title{
    display:block;
  }
  .brand-tag{ font-size:22px; padding-bottom:3px; letter-spacing:0.05cm; }
  .brand-title{ font-size:22px; letter-spacing:0.1cm; }
  /* HLS 与工作台同为横排，左对齐即 H↔工；LS 顺 H 跟在后面，不与作台对齐 */
  .brand .dot{
    position:absolute; left:7px; top:25px;
    width:9px; height:9px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 0 4px rgba(184,113,78,.14);
  }
  .brand-en{ font-size:11px; font-weight:500; letter-spacing:1px; color:var(--sub);
    padding-bottom:2px; }
    font-size:10.5px; color:var(--sub); letter-spacing:1.5px; font-weight:400; white-space:nowrap; }

  .navlabel{ font-size:11px; color:var(--sub); letter-spacing:2px; padding:10px 12px 4px; }
  .navitem{
    position:relative;
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    border:none; background:transparent; color:var(--ink); padding:11px 14px;
    border-radius:11px; cursor:pointer; font-size:15px; transition:.16s;
    font-family:inherit; letter-spacing:1px;
  }
  .navitem:hover{ background:var(--mark); }
  .navitem.active{ background:var(--accent); color:#fff; font-weight:600;
    box-shadow:0 3px 12px rgba(184,113,78,.28); }
  .navitem.nav-alarm{ border-left:3px solid #d9822b; }
  .navitem.nav-alarm-red{ border-left:3px solid #c0392b; background:#fdf0ee; }
  .navitem .navbadge{ position:absolute; top:7px; right:10px; min-width:18px; height:18px;
    line-height:18px; text-align:center; background:#c0392b; color:#fff; font-size:11px;
    border-radius:9px; padding:0 5px; font-weight:700; }

  .sidefoot{
    margin-top:auto; font-size:11px; color:var(--sub); padding:14px 12px 0;
    border-top:1px solid var(--line); line-height:1.8;
  }
  .sync-box{ margin-top:10px; padding:10px; background:rgba(184,113,78,.06); border:1px solid var(--line); border-radius:10px; }
  .syncbtn{ display:inline-block; margin:2px 4px 2px 0; padding:6px 12px; background:#fff; color:var(--accent); border:1px solid var(--accent); border-radius:14px; cursor:pointer; font-size:12.5px; font-family:inherit; transition:.14s; }
  .syncbtn:hover{ background:var(--accent); color:#fff; }
  .sidefoot .stat{ color:var(--noted); font-weight:600; }

  /* ===== 主区 ===== */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }

  /* 顶栏 */
  .topbar{
    height:58px; flex:0 0 58px; display:flex; align-items:center; justify-content:space-between;
    padding:0 30px; border-bottom:1px solid var(--line); background:rgba(255,253,249,.6);
    backdrop-filter:blur(4px); position:sticky; top:0; z-index:5;
  }
  .crumb{ font-size:13.5px; color:var(--sub); letter-spacing:.5px; display:flex; align-items:center; gap:8px; }
  .crumb .sep{ color:var(--line); }
  .crumb .now{ color:var(--accent); font-weight:600; }
  .topright{ display:flex; align-items:center; gap:14px; font-size:13px; color:var(--sub); }
  .topright .hi{ color:var(--ink); font-weight:600; }
  #wbSaveBtn{ font-family:inherit; font-size:13px; font-weight:600; color:#fff; background:var(--accent);
    border:0; border-radius:9px; padding:7px 15px; cursor:pointer; box-shadow:0 2px 8px rgba(184,113,78,.25);
    display:inline-flex; align-items:center; gap:5px; transition:transform .12s, background .15s; }
  #wbSaveBtn:hover{ background:#a5613f; }
  #wbSaveBtn:active{ transform:scale(.96); }
  .wbsync-state{ font-size:12px; color:#8a7f70; margin-left:6px; white-space:nowrap; }
  .wbsync-state.ok{ color:#3aa76d; }
  .wbsync-state.err{ color:#c0392b; }
  .wbsync-state.off{ color:#a99c8c; }
  .wb-icon-btn{ font-family:inherit; font-size:12.5px; font-weight:500; color:var(--accent); background:#fff;
    border:1px solid var(--line); border-radius:9px; padding:6px 12px; cursor:pointer;
    display:inline-flex; align-items:center; gap:4px; transition:.14s; }
  .wb-icon-btn:hover{ background:var(--mark); border-color:var(--accent); }
  .topright label.wb-icon-btn input{ display:none; }
  .topright .clock{ font-variant-numeric:tabular-nums; color:var(--ink);
    background:var(--mark); padding:3px 11px; border-radius:20px; letter-spacing:.5px; }

  .content{ flex:1; padding:26px 30px 56px; min-width:0; display:flex; flex-direction:column; }

  .modhead{ margin-bottom:18px; flex:0 0 auto; }
  .modtitle{ font-size:22px; font-weight:700; margin:0 0 14px; letter-spacing:1px;
    display:flex; align-items:baseline; gap:12px; }
  .modtitle small{ font-size:13px; color:var(--sub); font-weight:400; letter-spacing:0; }

  /* 子模块 tab */
  .subtabs{ display:flex; gap:8px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  .subtab{
    display:inline-flex; align-items:center; gap:7px;
    border:1px solid var(--line); border-bottom:none; background:#fff; color:var(--sub);
    padding:9px 17px; border-radius:11px 11px 0 0; cursor:pointer; font-size:14px;
    transition:.16s; font-family:inherit; margin-bottom:-1px; letter-spacing:.5px;
  }
  .subtab:hover{ border-color:var(--accent); color:var(--accent); }
  .subtab.active{ background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  .subtab .pip{ width:6px; height:6px; border-radius:50%; background:var(--noted); }
  .subtab.active .pip{ background:#fff; }

  .modbody{ margin-top:18px; flex:1; min-height:0; display:flex; flex-direction:column; }
  .modbody > *{ animation:fade .26s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  /* iframe 容器 + 工具条 */
  .framebox{
    border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
    background:var(--card); box-shadow:var(--shadow);
    display:flex; flex-direction:column; flex:1; min-height:0;
  }
  .framebar{
    display:flex; align-items:center; justify-content:flex-end;
    padding:4px 14px; border-bottom:1px solid var(--line); background:var(--bg);
    min-height:0;
  }
  .framebar .fbtn{
    border:1px solid var(--line); background:#fff; color:var(--sub); cursor:pointer;
    width:30px; height:30px; border-radius:9px; display:grid; place-items:center; transition:.15s;
  }
  .framebar .fbtn:hover{ border-color:var(--accent); color:var(--accent); }
  .framebar .fbtn svg{ width:15px; height:15px; }
  .framebox iframe{ width:100%; flex:1; min-height:0; border:none; display:block; background:var(--bg); }

  /* 占位面板 */
  .placeholder{
    background:var(--card); border:1px dashed var(--line); border-radius:var(--radius);
    padding:52px 28px; text-align:center; color:var(--sub); box-shadow:var(--shadow);
  }
  .placeholder .ico{
    width:46px; height:46px; margin:0 auto 16px; border-radius:14px; background:var(--mark);
    display:grid; place-items:center; color:var(--accent);
  }
  .placeholder .ico svg{ width:24px; height:24px; }
  .placeholder h3{ color:var(--accent); font-size:18px; margin:0 0 10px; letter-spacing:1px; }
  .placeholder p{ font-size:14px; margin:6px auto; max-width:480px; line-height:1.7; }
  .placeholder .tag{ display:inline-block; margin-top:16px; font-size:11px; color:var(--sub);
    background:var(--mark); border-radius:12px; padding:4px 13px; letter-spacing:1px; }

  /* 窄屏：侧栏收窄但仍保留文字 */
  @media (max-width:880px){
    .sidebar{ width:132px; flex:0 0 132px; padding:18px 10px; }
    .brand{ justify-content:flex-start; padding:2px 0 14px; }
    .brand-title{ font-size:17px; }
    .brand-tag{ font-size:17px; padding-bottom:3px; }
    .brand .dot{ left:4px; top:21px; width:7px; height:7px;
      box-shadow:0 0 0 3px rgba(184,113,78,.14); }
    .brand-en{ display:none; }
    .navlabel{ display:none; }
    .navitem{ justify-content:flex-start; padding:11px 10px; }
    .sidefoot{ display:none; }
    .topbar, .content{ padding-left:18px; padding-right:18px; }
    .framebox iframe{ flex:1; min-height:0; }
  }
  /* === 手机：侧栏抽屉化 + 顶栏紧凑 + iframe 撑满 === */
  .wbmenu-btn{ display:none; }
  .menu-mask{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.32); z-index:50; }

  /* 手机：整个 sidebar 变成抽屉，从左侧滑出 */
  @media (max-width:680px){
    .app{ flex-direction:column; }
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; z-index:60; width:260px;
      flex-direction:column; align-items:stretch; gap:6px; padding:14px 8px 18px;
      border-right:1px solid var(--line); border-bottom:none;
      background:#fffdf9;
      box-shadow:0 0 24px rgba(0,0,0,.06);
      transform:translateX(-100%); transition:transform .28s ease;
      overflow-y:auto; -webkit-overflow-scrolling:touch;
    }
    body.menu-open .sidebar{ transform:translateX(0); }
    body.menu-open .menu-mask{ display:block; }
    .brand{ padding:0 6px 10px; border-bottom:1px solid var(--line); margin-bottom:8px; }
    .brand-stack{ font-size:17px; }
    .brand-tag, .brand-title{ font-size:17px; padding-bottom:2px; letter-spacing:1px; }
    .brand .dot{ left:7px; top:25px; width:7px; height:7px;
      box-shadow:0 0 0 3px rgba(184,113,78,.14); }
    .brand-en{ display:none; }
    .navlabel{ display:block; font-size:11px; padding:8px 10px 4px; color:var(--sub); }
    #navCommon, #navOther{
      display:flex; flex-direction:column; gap:2px;
      width:100%;
    }
    .navitem{
      width:100%; padding:10px 12px; font-size:14.5px; justify-content:flex-start;
    }
    .navitem .navbadge{ position:static; margin-left:8px; }

    /* 顶栏紧凑 */
    .topbar{
      padding:0 10px; height:44px; flex:0 0 44px; gap:8px;
    }
    .crumb{ font-size:12px; letter-spacing:0; gap:4px; min-width:0;
      flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .topright{ gap:6px; }
    .topright .wb-icon-btn{
      padding:4px 8px; font-size:11.5px; border-radius:8px;
    }
    /* 手机端只显示图标，不显示文字 */
    .wb-icon-btn .lbl{ display:none; }
    .wb-icon-btn .icn{ font-size:15px; line-height:1; }
    #wbSaveBtn{ padding:5px 9px; font-size:12px; border-radius:8px; }
    #wbSaveBtn .icn{ font-size:15px; line-height:1; }
    .wbsync-state{ display:none; }
    .topright .clock{ padding:2px 8px; font-size:11px; display:none; /* 极窄屏空 */ }
    .topright .hi{ display:none; }

    /* 汉堡按钮显示 */
    .wbmenu-btn{
      display:inline-grid; place-items:center; flex:0 0 auto;
      width:34px; height:34px; border:1px solid var(--line); background:#fff;
      border-radius:9px; cursor:pointer; color:var(--accent); padding:0;
      font-family:inherit;
    }
    .wbmenu-btn:active{ transform:scale(.94); }
    .wbmenu-btn svg{ width:18px; height:18px; }

    .content{ padding:14px 12px 36px; }
    .modtitle{ font-size:17px; letter-spacing:.5px; gap:8px; margin-bottom:10px; }
    .modhead{ margin-bottom:14px; }
    .framebox{ border-radius:10px; }
    .framebox iframe{ flex:1; min-height:0; width:100%; }
  }

  /* 极窄屏（≤420px）：再紧凑，副标题、按钮只图标、subtab 更紧凑 */
  @media (max-width:420px){
    .topbar{ height:40px; flex:0 0 40px; }
    .modtitle{ font-size:15px; gap:6px; }
    .modtitle small{ display:none; }
    .sidebar{ width:230px; padding:12px 6px 16px; }
    .subtab{ padding:7px 11px; font-size:12.5px; gap:5px; }
    .subtabs{ gap:5px; }
    .content{ padding:10px 10px 28px; }
  }


</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-stack">
        <div class="brand-tag"><span>H</span><span>L</span><span>S</span></div>
        <div class="brand-title"><span>工</span><span>作</span><span>台</span></div>
      </div>
      <span class="dot"></span>
      <span class="brand-en">WorkBench</span>
    </div>
    <div class="navlabel">常用</div>
    <nav id="navCommon"></nav>
    <div class="navlabel">其他</div>
    <nav id="navOther"></nav>
    <button class="navitem" id="wbSyncNav" onclick="wbOpenSync()" style="display:flex;align-items:center;justify-content:space-between">
      <span class="lbl">☁ 云同步</span>
      <span id="wbSyncDot" style="width:8px;height:8px;border-radius:50%;background:#c9bfae"></span>
    </button>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="wbmenu-btn" id="wbMenuBtn" type="button" aria-label="打开菜单" title="打开菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="crumb" id="crumb"></div>
      <div class="topright">
        <button class="wb-icon-btn" onclick="wbExport()" title="导出全部数据为 JSON 备份"><span class="icn">⬇</span><span class="lbl"> 导出</span></button>
        <label class="wb-icon-btn" title="从 JSON 备份恢复全部数据" style="cursor:pointer"><span class="icn">⬆</span><span class="lbl"> 导入</span><input type="file" accept="application/json" style="display:none" onchange="wbImport(this.files[0])"></label>
        <button id="wbSaveBtn" onclick="wbRequestSave()" title="把当前页面正在编辑的内容立即保存到本地；若已连接云同步则同时上传"><span class="icn">💾</span><span class="lbl"> 保存</span></button>
        <span class="wbsync-state off" id="wbSyncState" title="云同步状态：未连接 / 已同步时间">未连接</span>
        <span class="hi" id="hi"></span>
        <span id="today"></span>
      </div>
    </div>

    <div class="content">
      <div class="modhead">
        <h1 class="modtitle" id="modtitle"></h1>
        <div class="subtabs" id="subtabs"></div>
      </div>
      <div class="modbody" id="modbody"></div>
    </div>
  </main>
</div>

<div class="menu-mask" id="wbMenuMask"></div>

<script>
/* 抽屉菜单：手机端汉堡按钮打开/关闭，主区域点击/侧栏外点击也会关闭 */
(function(){
  function close(){ document.body.classList.remove('menu-open'); }
  function open(){  document.body.classList.add('menu-open'); }
  document.getElementById('wbMenuBtn').addEventListener('click', function(){
    document.body.classList.toggle('menu-open');
  });
  document.getElementById('wbMenuMask').addEventListener('click', close);
  /* 点侧栏里的 nav 项目后自动收起（但要等导航逻辑处理完再关） */
  document.addEventListener('click', function(e){
    var item = e.target.closest && e.target.closest('.navitem');
    if(item && document.body.classList.contains('menu-open')){
      /* 200ms 后关，让主页面有时间看见已切换到新模块 */
      setTimeout(close, 220);
    }
  });
  /* ESC 关闭 */
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape') close();
  });
})();

/* =========================================================
   工作台框架 —— 模块 / 子模块配置
   后续接入具体内容时，只需在对应模块下增删 sub 项：
     type:'iframe'      + src      → 嵌入一个独立页面（如状态记录）
     type:'placeholder' + desc     → 占位面板（待建设），可加 status:'building'
     type:'html'        + html     → 直接写内联内容
   子项可带 status:'online' 标记已上线（导航点 + 底部统计会读取）
   ========================================================= */
const ICONS = {
  inner:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.2 5.2l1.8 1.8M17 17l1.8 1.8M18.8 5.2 17 7M7 17l-1.8 1.8"/></svg>',
  stock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9"/><path d="M16 7h5v5"/></svg>',
  daily:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/></svg>',
  tools:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6.5v6.5H4zM13.5 4H20v6.5h-6.5zM4 13.5h6.5V20H4zM13.5 13.5H20V20h-6.5z"/></svg>',
  refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>',
  build:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12 4 7.5"/></svg>'
};

const SCREENING_RAW = "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>放映室 · 工作台</title>\n<style>\n  :root{\n    --bg:#f7f4ee; --card:#fffdf9; --ink:#3a3631; --sub:#8a837a;\n    --line:#ece5da; --accent:#b8714e; --accent2:#5b8c7b; --mark:#f0e3d6;\n    --noted:#3f9d6b; --warn:#d9822b; --bad:#c0392b;\n    --radius:14px;\n    --shadow:0 1px 3px rgba(58,54,49,.06), 0 10px 30px rgba(58,54,49,.05);\n    --font:\"PingFang SC\",\"Microsoft YaHei\",\"Hiragino Sans GB\",sans-serif;\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;height:100%;}\n  body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;-webkit-font-smoothing:antialiased;}\n  ::selection{background:var(--mark);}\n\n  .topbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(255,253,249,.7);backdrop-filter:blur(4px);position:sticky;top:0;z-index:5;}\n  .brand{display:flex;align-items:baseline;gap:8px;}\n  .brand b{font-size:17px;font-weight:700;letter-spacing:3px;color:var(--accent);}\n  .brand small{font-size:10.5px;color:var(--sub);letter-spacing:1px;}\n  .topacts{display:flex;gap:10px;align-items:center;}\n  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit;transition:.14s;}\n  .btn:hover{border-color:var(--accent);color:var(--accent);}\n  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}\n  .btn.primary:hover{background:#a05f3d;}\n  .btn:disabled{opacity:.6;cursor:not-allowed;}\n  .fileinp{display:none;}\n\n  /* 布局：中间播放器 + 右侧面板 */\n  .app{display:flex;height:calc(100vh - 53px);min-height:600px;}\n  .main{flex:1;min-width:0;background:var(--bg);padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}\n  .side-r{width:430px;flex:0 0 430px;background:var(--card);border-left:1px solid var(--line);}\n\n  /* 中间：16:9 播放器 */\n  .player-wrap{width:100%;max-width:calc((100vh - 200px) * 16 / 9);display:flex;flex-direction:column;align-items:center;}\n  .screen{width:100%;aspect-ratio:16/9;background:#0a0908;border-radius:var(--radius);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(0,0,0,.25);}\n  .screen video{width:100%;height:100%;object-fit:contain;display:block;}\n  .dropzone{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(255,255,255,.65);font-size:13px;gap:8px;pointer-events:none;}\n  .dropzone b{font-size:15px;font-weight:500;}\n  .screen.has-video .dropzone{display:none;}\n  .nowplaying{font-size:12px;color:var(--sub);margin-top:10px;text-align:center;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n\n  .controls{width:100%;max-width:calc((100vh - 200px) * 16 / 9);height:44px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:0 14px;margin-top:12px;display:flex;align-items:center;gap:10px;}\n  .playbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--accent);background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;font-size:12px;}\n  .time{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;min-width:90px;text-align:center;}\n  .progress{flex:1;height:5px;background:var(--line);border-radius:3px;position:relative;cursor:pointer;}\n  .progress .bar{height:100%;background:var(--accent);border-radius:3px;width:0%;position:relative;}\n  .progress .bar::after{content:'';position:absolute;right:-4px;top:-3px;width:10px;height:10px;background:#fff;border:2px solid var(--accent);border-radius:50%;}\n  .speed{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 7px;font-size:12px;color:var(--sub);cursor:pointer;font-family:inherit;}\n\n  /* 右侧：AI陪伴 + 标签 */\n  .side-r .ai-panel{flex:1;min-height:0;display:flex;flex-direction:column;border-bottom:1px solid var(--line);}\n  .ai-head{height:40px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;}\n  .ai-head .l{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--accent);}\n  .ai-head .r{font-size:11px;color:var(--sub);}\n  .ai-body{flex:1;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px;background:#fdfbf7;}\n  .ai-msg{max-width:94%;padding:8px 11px;border-radius:11px;font-size:13px;line-height:1.55;animation:pop .2s ease;}\n  .ai-msg.ai{align-self:flex-start;background:#f5efe6;border-top-left-radius:3px;color:var(--ink);}\n  .ai-msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-top-right-radius:3px;}\n  .ai-msg .when{font-size:9.5px;color:var(--sub);margin-bottom:2px;}\n  .ai-msg.ai .when{color:#a89882;}\n  .ai-input{display:flex;gap:7px;padding:8px 12px;border-top:1px solid var(--line);align-items:center;background:#fff;}\n  .ai-input input{flex:1;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12.5px;font-family:inherit;}\n  .ai-input input:focus{outline:none;border-color:var(--accent);}\n  .micbtn{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:13px;transition:.14s;}\n  .micbtn:hover{border-color:var(--accent);color:var(--accent);}\n  .micbtn.rec{border-color:var(--bad);background:#fdf0ee;color:var(--bad);animation:pulse 1.2s infinite;}\n  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,57,43,.25);}70%{box-shadow:0 0 0 7px rgba(192,57,43,0);}100%{box-shadow:0 0 0 0 rgba(192,57,43,0);}}\n  @keyframes pop{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}\n\n  /* 右下标签 */\n  .bottom-tabs{flex:0 0 46%;display:flex;flex-direction:column;}\n  .tooltabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:6px 10px 0;background:#fff;flex-wrap:wrap;}\n  .ttab{border:1px solid var(--line);border-bottom:none;background:#fff;color:var(--sub);padding:6px 11px;border-radius:8px 8px 0 0;cursor:pointer;font-size:12px;font-family:inherit;margin-bottom:-1px;}\n  .ttab:hover{border-color:var(--accent);color:var(--accent);}\n  .ttab.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}\n  .tpane{display:none;flex:1;overflow:auto;padding:12px;background:#fdfbf7;}\n  .tpane.show{display:block;}\n\n  .note-row{display:flex;align-items:flex-start;gap:7px;padding:7px 0;border-bottom:1px dashed var(--line);}\n  .note-row:last-child{border-bottom:none;}\n  .note-time{flex:0 0 48px;font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums;cursor:pointer;background:var(--mark);padding:2px 5px;border-radius:5px;text-align:center;}\n  .note-time:hover{background:var(--accent);color:#fff;}\n  .note-text{flex:1;font-size:12px;color:var(--ink);line-height:1.45;}\n  .note-text .tag{font-size:9.5px;color:var(--sub);background:#f0ebe3;padding:1px 4px;border-radius:5px;margin-right:4px;}\n  .note-del{flex:0 0 20px;color:var(--sub);cursor:pointer;font-size:14px;text-align:center;}\n  .note-del:hover{color:var(--bad);}\n  .addnote{display:flex;gap:5px;margin-top:8px;}\n  .addnote input{flex:1;border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:11.5px;font-family:inherit;}\n  .addnote input[type=\"time\"]{flex:0 0 70px;}\n  .addnote button{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;padding:5px 9px;cursor:pointer;font-size:11px;}\n\n  .aiarea textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:12px;font-family:inherit;resize:vertical;background:#fff;}\n  .aiarea textarea:focus{outline:none;border-color:var(--accent);}\n  .aiopts{display:flex;flex-direction:column;gap:6px;margin-top:8px;}\n  .aiopts input{width:100%;border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:11.5px;font-family:inherit;}\n  .hint{font-size:10.5px;color:var(--sub);line-height:1.5;margin-top:8px;background:#f5efe6;padding:7px;border-radius:7px;}\n  .hint b{color:var(--accent);}\n\n  /* 截图分析 */\n  .shot-drop{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--sub);font-size:12px;background:#fff;cursor:pointer;transition:.14s;}\n  .shot-drop:hover{border-color:var(--accent);color:var(--accent);background:#fffbf7;}\n  .shot-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}\n  .shot-thumb{width:72px;height:48px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:pointer;}\n  .shot-row{padding:8px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:#fff;}\n  .shot-row .img{width:100%;border-radius:7px;margin-bottom:6px;}\n  .shot-row .txt{font-size:12px;color:var(--ink);line-height:1.5;}\n  .shot-row .meta{font-size:10px;color:var(--sub);margin-top:4px;}\n\n  /* 观影记录 */\n  .rec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}\n  .rec-head .cnt{font-size:12px;color:var(--sub);}\n  .rec-head .cnt b{color:var(--accent);}\n  .rec-card{display:flex;gap:10px;padding:9px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;cursor:pointer;background:#fff;transition:.12s;}\n  .rec-card:hover{border-color:var(--accent);background:#fffbf7;}\n  .rec-poster{width:54px;flex:0 0 54px;aspect-ratio:3/4;background:var(--mark);border-radius:8px;overflow:hidden;display:grid;place-items:center;color:var(--sub);font-size:10px;text-align:center;}\n  .rec-poster img{width:100%;height:100%;object-fit:cover;}\n  .rec-info{flex:1;min-width:0;}\n  .rec-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n  .rec-date{font-size:10.5px;color:var(--sub);margin:2px 0 5px;}\n  .rec-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;}\n  .rec-bar span{display:block;height:100%;background:var(--accent2);}\n  .rec-pct{font-size:10px;color:var(--sub);margin-top:3px;}\n\n  /* 弹窗 */\n  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100;}\n  .modal.show{display:flex;}\n  .mdialog{background:#faf7f1;max-width:480px;width:92%;border-radius:16px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:92vh;overflow:auto;}\n  .mdialog h3{margin:0 0 10px;font-size:17px;color:var(--accent);}\n  .mrow{margin-bottom:10px;}\n  .mrow label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px;}\n  .mrow input,.mrow select,.mrow textarea{width:100%;border:1px solid #ddd3c4;border-radius:8px;padding:8px;font-size:13px;font-family:inherit;}\n  .macts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}\n\n  /* 记录编辑：搜索候选 + 海报预览 */\n  .rec-preview{width:84px;height:112px;background:var(--mark);border-radius:8px;overflow:hidden;display:grid;place-items:center;color:var(--sub);font-size:10px;flex:0 0 84px;}\n  .rec-preview img{width:100%;height:100%;object-fit:cover;}\n  .rec-cands{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}\n  .cand{width:84px;cursor:pointer;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;transition:.12s;}\n  .cand:hover{border-color:var(--accent);}\n  .cand img{width:100%;height:112px;object-fit:cover;display:block;background:var(--mark);}\n  .cand-title{font-size:10px;padding:4px 5px;line-height:1.3;color:var(--ink);height:34px;overflow:hidden;}\n\n  @media (max-width:1100px){\n    .side-r{width:340px;}\n  }\n  @media (max-width:820px){\n    .side-r{display:none;}\n    .main{width:100%;}\n  }\n</style>\n</head>\n<body>\n\n<div class=\"topbar\">\n  <div class=\"brand\"><b>放映室</b><small>CINEMA</small></div>\n  <div class=\"topacts\">\n    <label class=\"btn primary\"><input type=\"file\" class=\"fileinp\" id=\"fileInp\" accept=\"video/*\">📂 选择影片</label>\n    <button class=\"btn\" onclick=\"openAiCfg()\">⚙ AI配置</button>\n    <button class=\"btn\" onclick=\"openHelp()\">❓ 怎么用</button>\n  </div>\n</div>\n\n<div class=\"app\">\n  <!-- 中：16:9 播放器 -->\n  <main class=\"col main\">\n    <div class=\"player-wrap\">\n      <div class=\"screen\" id=\"screen\">\n        <video id=\"video\" controlsList=\"nodownload\"\n          ontimeupdate=\"onTimeUpdate()\" onloadedmetadata=\"onLoaded()\"\n          onplay=\"onPlayState()\" onpause=\"onPlayState()\" onended=\"onEnded()\"></video>\n        <div class=\"dropzone\">\n          <b>拖拽影片到这里</b>\n          <span>或点击右上角「选择影片」</span>\n        </div>\n      </div>\n      <div class=\"controls\">\n        <button class=\"playbtn\" id=\"playBtn\" onclick=\"togglePlay()\">▶</button>\n        <span class=\"time\" id=\"timeTxt\">00:00 / 00:00</span>\n        <div class=\"progress\" id=\"progress\" onclick=\"seek(event)\"><div class=\"bar\" id=\"bar\"></div></div>\n        <select class=\"speed\" id=\"speed\" onchange=\"setSpeed(this.value)\">\n          <option value=\"0.5\">0.5x</option><option value=\"0.75\">0.75x</option>\n          <option value=\"1\" selected>1x</option><option value=\"1.25\">1.25x</option>\n          <option value=\"1.5\">1.5x</option><option value=\"2\">2x</option>\n        </select>\n      </div>\n      <div class=\"nowplaying\" id=\"nowPlaying\">未选择影片</div>\n    </div>\n  </main>\n\n  <!-- 右：AI陪伴 + 功能标签 -->\n  <aside class=\"col side-r\">\n    <div class=\"ai-panel\">\n      <div class=\"ai-head\">\n        <div class=\"l\">🎭 AI 陪伴</div>\n        <div class=\"r\" id=\"aiStatus\">等待开始</div>\n      </div>\n      <div class=\"ai-body\" id=\"aiBody\">\n        <div class=\"ai-msg ai\">\n          <div class=\"when\">系统</div>\n          打开影片后，AI 会在这里陪你聊天。它不会挡住画面。\n        </div>\n      </div>\n      <div class=\"ai-input\">\n        <button class=\"micbtn\" id=\"micBtn\" onclick=\"toggleMic()\" title=\"点击说话\">🎤</button>\n        <input id=\"chatInp\" placeholder=\"打字或点击麦克风说话…\" onkeydown=\"if(event.key==='Enter')sendChat()\">\n        <button class=\"btn primary\" onclick=\"sendChat()\" style=\"padding:6px 12px;font-size:12px;\">发送</button>\n      </div>\n    </div>\n\n    <div class=\"bottom-tabs\">\n      <div class=\"tooltabs\">\n        <button class=\"ttab active\" onclick=\"switchTab('notes')\" data-tab=\"notes\">时间轴</button>\n        <button class=\"ttab\" onclick=\"switchTab('ai')\" data-tab=\"ai\">AI生成</button>\n        <button class=\"ttab\" onclick=\"switchTab('shot')\" data-tab=\"shot\">截图分析</button>\n        <button class=\"ttab\" onclick=\"switchTab('records')\" data-tab=\"records\">观影记录</button>\n      </div>\n\n      <div class=\"tpane show\" id=\"pane-notes\">\n        <div id=\"noteList\"><div class=\"empty-tip\" style=\"font-size:11.5px;color:var(--sub);text-align:center;padding:14px 0;\">还没有时间轴评论</div></div>\n        <div class=\"addnote\">\n          <input type=\"time\" id=\"noteTime\" step=\"1\">\n          <input type=\"text\" id=\"noteText\" placeholder=\"添加评论…\" onkeydown=\"if(event.key==='Enter')addNote()\">\n          <button onclick=\"addNote()\">+</button>\n        </div>\n      </div>\n\n      <div class=\"tpane\" id=\"pane-ai\">\n        <div class=\"aiarea\">\n          <textarea id=\"plotText\" placeholder=\"把剧情简介、分集剧情或字幕文本粘贴到这里，AI 会生成时间轴评论。\"></textarea>\n          <div style=\"display:flex;gap:8px;align-items:center;margin-top:6px;\">\n            <label class=\"btn\" style=\"font-size:12px;padding:6px 10px;cursor:pointer;\">📝 上传字幕<input type=\"file\" class=\"fileinp\" accept=\".srt,.vtt\" onchange=\"onSubtitle(this.files[0])\"></label>\n            <span id=\"subInfo\" style=\"font-size:11px;color:var(--sub);\">有字幕就用字幕，AI 评论更准</span>\n          </div>\n          <textarea id=\"aiKey\" placeholder=\"API Key（也可在「AI配置」里填写，仅存在本机）\" style=\"margin-top:6px;\"></textarea>\n          <div class=\"aiopts\">\n            <input id=\"aiModel\" placeholder=\"模型，如 gpt-4o-mini\">\n            <input id=\"aiEndpoint\" placeholder=\"API 地址，留空用 OpenAI\">\n          </div>\n          <button class=\"btn primary\" style=\"width:100%;margin-top:8px;padding:7px 0;\" onclick=\"genAiNotes()\" id=\"genBtn\">✨ 生成时间轴评论</button>\n          <div class=\"hint\">\n            <b>AI 是怎么「看」电影的？</b><br>\n            这里先用「剧情文本预读」：你把剧情/字幕给 AI，它提前写好每个时间点的评论。右侧 AI 陪伴面板会在播放时自动显示。\n          </div>\n        </div>\n      </div>\n\n      <div class=\"tpane\" id=\"pane-shot\">\n        <label class=\"shot-drop\" id=\"shotDrop\">\n          <input type=\"file\" id=\"shotInp\" class=\"fileinp\" accept=\"image/*\" multiple onchange=\"onShotSelect(this.files)\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" style=\"vertical-align:-3px;margin-right:5px;opacity:.8;\">\n            <rect x=\"3\" y=\"6\" width=\"18\" height=\"12\" rx=\"2\"></rect>\n            <circle cx=\"12\" cy=\"12\" r=\"3\"></circle>\n            <path d=\"M7 6l1-2h8l1 2\"></path>\n          </svg>\n          点击或拖拽上传电影截图<br><span style=\"font-size:10.5px\">AI 会分析画面内容并发表看法</span>\n        </label>\n        <div class=\"shot-preview\" id=\"shotPreview\"></div>\n        <div id=\"shotList\"></div>\n        <div class=\"hint\" style=\"margin-top:8px;\">\n          <b>实时画面分析</b><br>\n          在「AI配置」里可开启定时自动截图分析，费用由多模态模型产生，默认关闭。\n        </div>\n      </div>\n\n      <div class=\"tpane\" id=\"pane-records\">\n        <div class=\"rec-head\">\n          <span class=\"cnt\">已记录 <b id=\"recCount\">0</b> 部</span>\n          <button class=\"btn primary\" style=\"padding:5px 10px;font-size:12px;\" onclick=\"openEditor(null)\">＋ 添加记录</button>\n        </div>\n        <div id=\"recList\"></div>\n      </div>\n    </div>\n  </aside>\n</div>\n\n<!-- 帮助弹窗 -->\n<div class=\"modal\" id=\"helpModal\" onclick=\"if(event.target===this)closeHelp()\">\n  <div class=\"mdialog\">\n    <h3>放映室使用说明</h3>\n    <p style=\"font-size:13px;color:var(--sub);line-height:1.7;margin:0 0 12px;\">\n      1. 点击「选择影片」加载本地视频，支持 mp4 / mkv / webm 等格式。<br><br>\n      2. 右侧「AI 陪伴」面板显示 AI 和你自己的消息；下方标签可切换「时间轴 / AI生成 / 截图分析 / 观影记录」。<br><br>\n      3. 「AI生成」建议先「上传字幕」(.srt/.vtt)，AI 会基于真实时间轴写评论；没字幕也可粘贴剧情文本。填好 API Key 后一键生成。<br><br>\n      4. 播放时，到点的 AI 评论会自动出现在上方陪伴面板；你也可以直接在输入框打字或点 🎤 说话，AI 会结合当前播放位置真实回复（不再只是罐头话）。<br><br>\n      5. 「截图分析」上传电影截图，AI 会基于画面内容发表看法。<br><br>\n      6. 「观影记录」里每部电影都有海报、标题、观看日期和进度；点记录可联网搜索海报或手动上传。\n    </p>\n    <div class=\"macts\"><button class=\"btn primary\" onclick=\"closeHelp()\">知道了</button></div>\n  </div>\n</div>\n\n<!-- AI配置弹窗 -->\n<div class=\"modal\" id=\"cfgModal\" onclick=\"if(event.target===this)closeAiCfg()\">\n  <div class=\"mdialog\">\n    <h3>AI 配置</h3>\n    <div class=\"mrow\"><label>API 端点</label><input id=\"cfgEndpoint\" placeholder=\"https://api.openai.com/v1/chat/completions\"></div>\n    <div class=\"mrow\"><label>模型</label><input id=\"cfgModel\" placeholder=\"gpt-4o-mini\"></div>\n    <div class=\"mrow\"><label>API Key</label><input id=\"cfgKey\" type=\"password\" placeholder=\"sk-...\"></div>\n    <div class=\"mrow\"><label>实时视觉分析间隔（秒，0=关闭）</label><input id=\"cfgVision\" type=\"number\" min=\"0\" step=\"5\" placeholder=\"0\"></div>\n    <div class=\"hint\">实时视觉分析会定时截图并调用多模态模型，费用较高，默认关闭。</div>\n    <div class=\"macts\">\n      <button class=\"btn\" onclick=\"closeAiCfg()\">取消</button>\n      <button class=\"btn primary\" onclick=\"saveAiCfg()\">保存</button>\n    </div>\n  </div>\n</div>\n\n<!-- 观影记录编辑弹窗 -->\n<div class=\"modal\" id=\"recModal\" onclick=\"if(event.target===this)closeRecModal()\">\n  <div class=\"mdialog\">\n    <h3>观影记录</h3>\n    <div class=\"mrow\"><label>片名</label><input id=\"recTitle\" placeholder=\"电影名称\"></div>\n    <div class=\"mrow\">\n      <label>联网搜索海报（输入片名，自动获取海报 / 简介）</label>\n      <div style=\"display:flex;gap:8px;\">\n        <input id=\"recSearch\" placeholder=\"如 盗梦空间 / Inception\">\n        <button class=\"btn\" onclick=\"doSearch()\" style=\"white-space:nowrap;\">🔍 搜索</button>\n      </div>\n    </div>\n    <div class=\"rec-cands\" id=\"recCands\"></div>\n    <div class=\"mrow\">\n      <label>海报（搜索自动获取，或手动上传）</label>\n      <div style=\"display:flex;gap:10px;align-items:center;\">\n        <div class=\"rec-preview\" id=\"recPreview\">无海报</div>\n        <label class=\"btn\">📤 上传海报<input type=\"file\" class=\"fileinp\" accept=\"image/*\" onchange=\"onRecUpload(this)\"></label>\n      </div>\n    </div>\n    <div class=\"mrow\"><label>观看日期</label><input id=\"recDate\" type=\"date\"></div>\n    <div class=\"mrow\"><label>观看进度 <span id=\"recProgLabel\">100%</span></label>\n      <input id=\"recProg\" type=\"range\" min=\"0\" max=\"100\" value=\"100\" oninput=\"recProgLabel.textContent=this.value+'%'\">\n    </div>\n    <div class=\"mrow\"><label>年份 / 导演（可选）</label><input id=\"recYear\" placeholder=\"如 2010 / 克里斯托弗·诺兰\"></div>\n    <div class=\"mrow\"><label>剧情简介（可选）</label></div>\n    <div class=\"mrow\"><textarea id=\"recPlot\" rows=\"3\" placeholder=\"可留空，联网搜索后会自动填入\"></textarea></div>\n    <div class=\"macts\">\n      <button class=\"btn\" onclick=\"deleteRecord()\" id=\"recDel\">删除</button>\n      <button class=\"btn primary\" onclick=\"saveRecord()\">保存</button>\n    </div>\n  </div>\n</div>\n\n<script>\n/* ================= 数据层 ================= */\nconst LS_PREFIX='cinema_';\nconst K_CFG=LS_PREFIX+'ai_cfg';\nconst K_RECORDS=LS_PREFIX+'records';\nlet state={\n  file:null, url:null, currentId:null, recordId:null,\n  meta:{title:'',info:'',plot:''},\n  notes:[], shown:new Set(), visionTimer:null,\n  editingId:null, recPoster:null,\n  subtitle:[], subtitleRaw:''  /* 字幕线索（上传 .srt/.vtt 后生效） */\n};\n\nfunction lsGet(k){ try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;} }\nfunction lsSet(k,v){ localStorage.setItem(k,JSON.stringify(v)); notifyParent(); }\nfunction notifyParent(){ try{parent.postMessage({type:'wb-data-changed'},'*');}catch(e){} }\n\ntry{ if(!window.__wbStorageHooked){\nvar _oS=Storage.prototype.setItem, _oR=Storage.prototype.removeItem;\nStorage.prototype.setItem=function(k,v){ var r=_oS.apply(this,arguments); try{ notifyParent(); }catch(e){} return r; };\nStorage.prototype.removeItem=function(k){ var r=_oR.apply(this,arguments); try{ notifyParent(); }catch(e){} return r; };\nwindow.__wbStorageHooked=true; } }catch(e){}\n\nfunction loadCfg(){\n  let cfg=lsGet(K_CFG)||{};\n  cfg.endpoint=cfg.endpoint||'';\n  cfg.model=cfg.model||'gpt-4o-mini';\n  cfg.key=cfg.key||'';\n  cfg.vision=cfg.vision||0;\n  return cfg;\n}\nfunction saveCfg(cfg){ lsSet(K_CFG,cfg); }\n\nfunction loadRecords(){ return lsGet(K_RECORDS)||[]; }\nfunction saveRecords(a){ lsSet(K_RECORDS,a); renderRecords(); }\n\nfunction movieKey(id){ return LS_PREFIX+'movie_'+id; }\nfunction loadMovie(id){\n  let m=lsGet(movieKey(id))||{};\n  state.meta=m.meta||{title:'',info:'',plot:''};\n  state.notes=m.notes||[];\n  state.subtitle=m.subtitle||[];\n  state.subtitleRaw=m.subtitleRaw||'';\n}\nfunction saveMovie(){\n  if(!state.currentId) return;\n  lsSet(movieKey(state.currentId),{meta:state.meta,notes:state.notes,subtitle:state.subtitle,subtitleRaw:state.subtitleRaw,updated:Date.now()});\n}\n\n/* ================= UI ================= */\nconst $=id=>document.getElementById(id);\nconst video=$('video'), playBtn=$('playBtn'), timeTxt=$('timeTxt'), bar=$('bar'), progress=$('progress');\n\nfunction fmt(sec){\n  if(!isFinite(sec)) return '00:00';\n  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=Math.floor(sec%60);\n  const p=n=>String(n).padStart(2,'0');\n  return h>0 ? `${p(h)}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;\n}\nfunction parseTime(t){\n  const p=t.split(':').map(Number);\n  if(p.length===2) return p[0]*60+p[1];\n  if(p.length===3) return p[0]*3600+p[1]*60+p[2];\n  return 0;\n}\nfunction todayStr(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }\nfunction esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }\n\nfunction renderNotes(){\n  const list=$('noteList');\n  if(!state.notes.length){ list.innerHTML='<div class=\"empty-tip\" style=\"font-size:11.5px;color:var(--sub);text-align:center;padding:14px 0;\">还没有时间轴评论</div>'; return; }\n  const sorted=[...state.notes].sort((a,b)=>a.time-b.time);\n  list.innerHTML=sorted.map(n=>`\n    <div class=\"note-row\">\n      <div class=\"note-time\" onclick=\"seekTo(${n.time})\">${fmt(n.time)}</div>\n      <div class=\"note-text\"><span class=\"tag\">${n.type==='ai'?'AI':'我'}</span>${esc(n.text)}</div>\n      <div class=\"note-del\" onclick=\"delNote('${n.id}')\">×</div>\n    </div>\n  `).join('');\n}\n\n/* ================= 观影记录 ================= */\nfunction renderRecords(){\n  const recs=loadRecords();\n  $('recCount').textContent=recs.length;\n  const el=$('recList');\n  if(!recs.length){ el.innerHTML='<div class=\"empty-tip\" style=\"font-size:11.5px;color:var(--sub);text-align:center;padding:14px 0;\">还没有观影记录。看片时自动记录，或点「添加记录」。</div>'; return; }\n  el.innerHTML=recs.map(r=>`\n    <div class=\"rec-card\" onclick=\"openEditor('${r.id}')\">\n      <div class=\"rec-poster\">${r.poster?`<img src=\"${r.poster}\" onerror=\"this.parentNode.innerHTML='无海报'\">`:'无海报'}</div>\n      <div class=\"rec-info\">\n        <div class=\"rec-title\">${esc(r.title)}</div>\n        <div class=\"rec-date\">观看：${esc(r.date||'—')}${r.year?(' · '+esc(r.year)):''}</div>\n        <div class=\"rec-bar\"><span style=\"width:${r.progress||0}%\"></span></div>\n        <div class=\"rec-pct\">已看 ${r.progress||0}%</div>\n      </div>\n    </div>`).join('');\n}\n\nfunction ensureRecord(duration){\n  const title=state.meta.title;\n  if(!title) return;\n  let recs=loadRecords();\n  let r=recs.find(x=>x.title && x.title.toLowerCase()===title.toLowerCase());\n  if(r){\n    r.duration=duration; r.date=todayStr(); r.updated=Date.now(); state.recordId=r.id;\n  }else{\n    r={id:Date.now()+'', title, poster:null, date:todayStr(), progress:0, duration, year:'', plot:'', updated:Date.now()};\n    recs.unshift(r); state.recordId=r.id;\n  }\n  saveRecords(recs);\n}\nfunction updateRecordProgress(id,pct){\n  const recs=loadRecords(); const r=recs.find(x=>x.id===id);\n  if(r && r.progress!==pct){ r.progress=pct; r.updated=Date.now(); saveRecords(recs); }\n}\n\n/* 编辑弹窗 */\nfunction openEditor(id){\n  state.editingId=id||null;\n  state.recPoster=null;\n  if(id){\n    const r=loadRecords().find(x=>x.id===id);\n    if(!r) return;\n    $('recTitle').value=r.title||'';\n    $('recDate').value=r.date||todayStr();\n    $('recProg').value=r.progress||0; $('recProgLabel').textContent=(r.progress||0)+'%';\n    $('recYear').value=r.year||'';\n    $('recPlot').value=r.plot||'';\n    state.recPoster=r.poster||null;\n    $('recPreview').innerHTML=r.poster?`<img src=\"${r.poster}\">`:'无海报';\n    $('recDel').style.display='';\n  }else{\n    $('recTitle').value=''; $('recDate').value=todayStr();\n    $('recProg').value=100; $('recProgLabel').textContent='100%';\n    $('recYear').value=''; $('recPlot').value='';\n    $('recPreview').innerHTML='无海报';\n    $('recDel').style.display='none';\n  }\n  $('recSearch').value=''; $('recCands').innerHTML='';\n  $('recModal').classList.add('show');\n}\nfunction closeRecModal(){ $('recModal').classList.remove('show'); }\nfunction onRecUpload(inp){\n  const f=inp.files[0]; if(!f) return;\n  const r=new FileReader();\n  r.onload=()=>{ state.recPoster=r.result; $('recPreview').innerHTML=`<img src=\"${r.result}\">`; };\n  r.readAsDataURL(f);\n}\nfunction saveRecord(){\n  const title=$('recTitle').value.trim();\n  if(!title){ alert('请填写片名'); return; }\n  const recs=loadRecords();\n  const rec={\n    title, poster:state.recPoster||null,\n    date:$('recDate').value||todayStr(),\n    progress:parseInt($('recProg').value,10)||0,\n    year:$('recYear').value.trim(),\n    plot:$('recPlot').value.trim(),\n    updated:Date.now()\n  };\n  if(state.editingId){\n    const idx=recs.findIndex(r=>r.id===state.editingId);\n    if(idx>=0){ rec.id=state.editingId; rec.duration=recs[idx].duration||0; recs[idx]=rec; }\n    else { rec.id=Date.now()+''; rec.duration=0; recs.unshift(rec); }\n  }else{\n    rec.id=Date.now()+''; rec.duration=0; recs.unshift(rec);\n  }\n  saveRecords(recs); closeRecModal(); renderRecords();\n}\nfunction deleteRecord(){\n  if(!state.editingId) return;\n  if(!confirm('确定删除这条观影记录？')) return;\n  const recs=loadRecords().filter(r=>r.id!==state.editingId);\n  saveRecords(recs); closeRecModal(); renderRecords();\n}\n\n/* 联网搜索海报（维基百科，免 Key） */\nasync function wikiSearch(name,lang){\n  const q=encodeURIComponent(name);\n  const url=`https://${lang}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${q}&gsrlimit=6&prop=pageimages|extracts&exintro&explaintext&exlimit=max&pithumbsize=400&format=json&origin=*&redirects=1`;\n  const res=await fetch(url);\n  if(!res.ok) throw new Error('网络错误 '+res.status);\n  const data=await res.json();\n  const pages=data.query && data.query.pages ? Object.values(data.query.pages) : [];\n  return pages\n    .sort((a,b)=>(a.index||0)-(b.index||0))\n    .map(p=>({ title:p.title, poster:p.thumbnail?p.thumbnail.source:null, extract:(p.extract||'').trim() }))\n    .filter(p=>p.poster);\n}\nasync function wikiSearchAll(name){\n  let r=await wikiSearch(name,'zh');\n  if(r.length<1) r=await wikiSearch(name,'en');\n  return r;\n}\nasync function doSearch(){\n  const name=$('recSearch').value.trim();\n  if(!name){ alert('请输入片名'); return; }\n  $('recCands').innerHTML='<div class=\"empty-tip\" style=\"font-size:11px;color:var(--sub);\">搜索中…</div>';\n  try{\n    const list=await wikiSearchAll(name);\n    if(!list.length){ $('recCands').innerHTML='<div class=\"empty-tip\" style=\"font-size:11px;color:var(--sub);\">未找到匹配，可直接上传海报</div>'; return; }\n    window.__cands=list;\n    $('recCands').innerHTML=list.map((p,i)=>`\n      <div class=\"cand\" onclick=\"pickCand(${i})\">\n        <img src=\"${p.poster}\" onerror=\"this.style.visibility='hidden'\">\n        <div class=\"cand-title\">${esc(p.title)}</div>\n      </div>`).join('');\n  }catch(e){\n    $('recCands').innerHTML='<div class=\"empty-tip\" style=\"font-size:11px;color:var(--sub);\">搜索失败（可能离线）：可直接上传海报</div>';\n  }\n}\nfunction pickCand(i){\n  const p=window.__cands[i]; if(!p) return;\n  $('recTitle').value=p.title;\n  state.recPoster=p.poster;\n  $('recPreview').innerHTML=`<img src=\"${p.poster}\">`;\n  if(p.extract) $('recPlot').value=p.extract.slice(0,400);\n  const y=(p.extract||'').match(/(?:19|20)\\d{2}/);\n  if(y) $('recYear').value=y[0];\n}\n\n/* ================= 播放器控制 ================= */\nfunction loadFile(file){\n  if(!file) return;\n  if(state.url) URL.revokeObjectURL(state.url);\n  state.file=file;\n  state.url=URL.createObjectURL(file);\n  video.src=state.url;\n  video.load();\n  $('screen').classList.add('has-video');\n  state.currentId=file.name+'_'+file.size;   /* 用文件名+大小做稳定 ID，重选同一部片可找回评论 */\n  const had=lsGet(movieKey(state.currentId));\n  if(had){\n    loadMovie(state.currentId); state.shown.clear();\n  }else{\n    const title=file.name.replace(/\\.[^.]+$/,'');\n    state.meta={title,info:'',plot:''};\n    state.notes=[]; state.shown.clear();\n  }\n  renderNotes(); clearAi();\n  $('nowPlaying').textContent='正在观看：'+title;\n  aiSay('系统','已加载影片：'+title);\n  saveMovie();\n  ensureRecord(video.duration||0);\n}\n\n$('fileInp').addEventListener('change',e=>{ if(e.target.files[0]) loadFile(e.target.files[0]); });\nwindow.addEventListener('dragover',e=>{ e.preventDefault(); });\nwindow.addEventListener('drop',e=>{\n  e.preventDefault();\n  const f=e.dataTransfer.files[0];\n  if(f && f.type.startsWith('video/')) loadFile(f);\n});\n\nfunction togglePlay(){ if(video.paused) video.play(); else video.pause(); }\nfunction onPlayState(){ playBtn.textContent=video.paused?'▶':'❚❚'; }\nfunction setSpeed(v){ video.playbackRate=parseFloat(v); }\nfunction onLoaded(){\n  timeTxt.textContent=`00:00 / ${fmt(video.duration)}`;\n  ensureRecord(video.duration);\n}\nfunction onTimeUpdate(){\n  const cur=video.currentTime, dur=video.duration||1;\n  timeTxt.textContent=`${fmt(cur)} / ${fmt(video.duration)}`;\n  bar.style.width=(cur/dur*100)+'%';\n  if(state.recordId && Math.floor(cur)%3===0) updateRecordProgress(state.recordId, Math.round(cur/dur*100));\n  checkNotes(cur);\n}\nfunction onEnded(){ if(state.recordId) updateRecordProgress(state.recordId,100); }\nfunction seek(e){\n  const rect=progress.getBoundingClientRect();\n  const p=(e.clientX-rect.left)/rect.width;\n  video.currentTime=p*(video.duration||0);\n}\nfunction seekTo(t){ video.currentTime=t; if(video.paused) video.play(); }\n\n/* ================= 时间轴评论 ================= */\nfunction checkNotes(cur){\n  state.notes.forEach(n=>{\n    if(state.shown.has(n.id)) return;\n    if(Math.abs(cur-n.time)<=0.5){\n      state.shown.add(n.id);\n      aiSay((n.type==='ai'?'AI':'我'), n.text, fmt(n.time));\n    }\n  });\n}\nfunction addNote(){\n  const t=$('noteTime').value, txt=$('noteText').value.trim();\n  if(!t || !txt) return;\n  const sec=parseTime(t);\n  state.notes.push({id:Date.now()+'',time:sec,text:txt,type:'manual'});\n  saveMovie(); renderNotes();\n  $('noteText').value='';\n}\nfunction delNote(id){\n  state.notes=state.notes.filter(n=>n.id!==id);\n  saveMovie(); renderNotes();\n}\n\n/* ================= AI 面板 ================= */\nfunction clearAi(){ $('aiBody').innerHTML=''; }\nfunction aiSay(who, text, when){\n  const body=$('aiBody');\n  const div=document.createElement('div');\n  div.className='ai-msg '+(who==='我'?'user':'ai');\n  div.innerHTML=(when?`<div class=\"when\">${esc(who)} · ${when}</div>`:`<div class=\"when\">${esc(who)}</div>`)+esc(text);\n  body.appendChild(div);\n  body.scrollTop=body.scrollHeight;\n  $('aiStatus').textContent=who==='AI'?'AI 刚刚发言':'等待开始';\n}\nfunction sendChat(){\n  const inp=$('chatInp'), txt=inp.value.trim(); if(!txt) return;\n  aiSay('我', txt);\n  inp.value='';\n  chatWithAI(txt);\n}\n/* 真实调用 AI 聊天（含「问这一幕」隐藏上下文） */\nasync function chatWithAI(userText){\n  const cfg=loadCfg();\n  const key=cfg.key||$('aiKey').value.trim();\n  const model=cfg.model||$('aiModel').value.trim()||'gpt-4o-mini';\n  const endpoint=cfg.endpoint||$('aiEndpoint').value.trim()||'https://api.openai.com/v1/chat/completions';\n  if(!key){\n    aiSay('AI','（还没配置 AI：点右上角「AI配置」填 API Key，我就能真的陪你聊了。现在先用本地模式。）');\n    return;\n  }\n  // 隐藏上下文：当前影片 + 播放位置 + 附近字幕（仅之前内容）\n  let ctx=`当前影片：${state.meta.title||'未命名'}`;\n  if(isFinite(video.duration)&&video.duration>0) ctx+=`；当前播放位置：${fmt(video.currentTime)} / ${fmt(video.duration)}`;\n  const near=nearbySubtitle(video.currentTime);\n  if(near) ctx+=`；当前附近字幕（之前内容）：${near}`;\n  try{\n    const sys=`你是陪用户看电影的 AI 朋友，语气像朋友一样自然。${ctx}。只依据用户给出的信息和影片上下文回答；不确定就说不确定，不要编造或剧透未播到的情节。`;\n    const res=await fetch(endpoint,{\n      method:'POST',\n      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},\n      body:JSON.stringify({model:model,messages:[{role:'system',content:sys},{role:'user',content:userText}],temperature:0.8})\n    });\n    if(!res.ok) throw new Error('API '+res.status);\n    const data=await res.json();\n    const txt=data.choices?.[0]?.message?.content?.trim()||'（AI 没有返回内容）';\n    aiSay('AI', txt);\n  }catch(e){\n    aiSay('AI','（调用 AI 失败：'+e.message+'）');\n  }\n}\n/* 取当前播放点之前的邻近字幕（供「问这一幕」用，稍后字幕上传后生效） */\nfunction nearbySubtitle(t){\n  if(!state.subtitle || !state.subtitle.length) return '';\n  const before=state.subtitle.filter(c=>c.start<=t).slice(-3);\n  return before.map(c=>`[${fmt(c.start)}] ${c.text}`).join('  ');\n}\n\n/* ================= 标签切换 ================= */\nfunction switchTab(name){\n  document.querySelectorAll('.ttab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));\n  document.querySelectorAll('.tpane').forEach(p=>p.classList.toggle('show',p.id==='pane-'+name));\n}\nfunction openHelp(){$('helpModal').classList.add('show');}\nfunction closeHelp(){$('helpModal').classList.remove('show');}\nfunction openAiCfg(){\n  const cfg=loadCfg();\n  $('cfgEndpoint').value=cfg.endpoint;\n  $('cfgModel').value=cfg.model;\n  $('cfgKey').value=cfg.key;\n  $('cfgVision').value=cfg.vision;\n  $('cfgModal').classList.add('show');\n}\nfunction closeAiCfg(){$('cfgModal').classList.remove('show');}\nfunction saveAiCfg(){\n  saveCfg({\n    endpoint:$('cfgEndpoint').value.trim(),\n    model:$('cfgModel').value.trim(),\n    key:$('cfgKey').value.trim(),\n    vision:parseInt($('cfgVision').value||'0',10)\n  });\n  closeAiCfg();\n  setupVision();\n}\n\n/* ================= AI 生成时间轴 ================= */\nasync function genAiNotes(){\n  const plot=$('plotText').value.trim();\n  if(!plot && !state.subtitle.length){ alert('请先粘贴剧情文本，或上传字幕文件'); return; }\n  const cfg=loadCfg();\n  const key=cfg.key||$('aiKey').value.trim();\n  const model=cfg.model||$('aiModel').value.trim()||'gpt-4o-mini';\n  const endpoint=cfg.endpoint||$('aiEndpoint').value.trim()||'https://api.openai.com/v1/chat/completions';\n  if(!key){ alert('请先在 AI配置 或右侧面板填写 API Key'); return; }\n  const btn=$('genBtn'); const old=btn.textContent; btn.textContent='生成中…'; btn.disabled=true;\n  try{\n    const dur=isFinite(video.duration)&&video.duration>0?fmt(video.duration):'';\n    let subExcerpt='';\n    if(state.subtitle.length){\n      subExcerpt=state.subtitle.map(c=>`[${fmt(c.start)}] ${c.text}`).join('\\n');\n      if(subExcerpt.length>5000) subExcerpt=subExcerpt.slice(0,5000)+'\\n…(字幕较长，已截断)';\n    }\n    const useSub=!!subExcerpt;\n    const prompt=`你是一位陪用户看电影的 AI 朋友。请生成 5~10 条「观影时间轴评论」。\n要求：\n1. 输出必须是合法 JSON 数组，不要 markdown 代码块。\n2. 每条格式：{\"time\":\"mm:ss\",\"text\":\"评论内容\"}\n3. ${useSub?('time 必须直接采用下面「字幕证据」里出现该情节的真实时间点（格式 mm:ss）；字幕时间即电影真实时间，不要另造。'):(dur?('影片总时长约 '+dur+'，让时间点均匀分布在时长内（可到约 80% 处）'):'合理分布在前 90 分钟内')}；text 要口语化、有陪伴感，像朋友一样吐槽或点评细节。\n4. 评论要有趣、有情绪、有互动感，让用户感觉有人陪着一起看。\n5. 【防剧透】每条评论只可引用「该时间点之前」已描述或合理的情节，绝对不要提及该时间点之后的剧情或结局；更不要提前揭晓反转/凶手/结局。\n6. 每条 30~80 字。\n\n${useSub?('字幕证据（真实时间轴，优先据此写评论）：\\n'+subExcerpt):('剧情文本如下：\\n'+plot)}`;\n    const res=await fetch(endpoint,{\n      method:'POST',\n      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},\n      body:JSON.stringify({model:model,messages:[{role:'user',content:prompt}],temperature:0.85})\n    });\n    if(!res.ok) throw new Error('API '+res.status);\n    const data=await res.json();\n    let text=data.choices?.[0]?.message?.content||'';\n    text=text.replace(/```json\\s*/,'').replace(/```\\s*$/,'').trim();\n    const arr=JSON.parse(text);\n    if(!Array.isArray(arr)) throw new Error('返回格式不是数组');\n    let added=0;\n    arr.forEach(item=>{\n      const sec=parseTime(item.time);\n      if(sec>=0 && item.text){\n        state.notes.push({id:Date.now()+Math.random()+'',time:sec,text:String(item.text).trim(),type:'ai'});\n        added++;\n      }\n    });\n    saveMovie(); renderNotes();\n    aiSay('系统',`已生成 ${added} 条 AI 时间轴评论，播放时会自动显示在上方。`);\n    switchTab('notes');\n  }catch(e){\n    alert('生成失败：'+e.message+'\\n\\n请检查 API Key、模型名和接口地址是否正确。');\n  }finally{ btn.textContent=old; btn.disabled=false; }\n}\n\n/* ================= 字幕解析（字幕优先） ================= */\nfunction parseSRT(txt){\n  const out=[]; const blocks=txt.replace(/\\r/g,'').split(/\\n\\s*\\n/);\n  blocks.forEach(b=>{\n    const lines=b.trim().split('\\n');\n    if(lines.length<2) return;\n    const idx=lines.findIndex(l=>/-->/.test(l));\n    if(idx<0) return;\n    const m=lines[idx].match(/(\\d+):(\\d+):(\\d+)[,.](\\d+)\\s*-->\\s*(\\d+):(\\d+):(\\d+)/);\n    if(!m) return;\n    const start=+m[1]*3600+ +m[2]*60+ +m[3]+ +m[4]/1000;\n    const text=lines.slice(idx+1).join(' ').trim();\n    if(text) out.push({start, text});\n  });\n  return out;\n}\nfunction parseVTT(txt){\n  const out=[]; const lines=txt.replace(/\\r/g,'').split('\\n');\n  for(let i=0;i<lines.length;i++){\n    const m=lines[i].match(/(\\d+):(\\d+):(\\d+)[.](\\d+)\\s*-->\\s*(\\d+):(\\d+):(\\d+)/);\n    if(m){\n      const start=+m[1]*3600+ +m[2]*60+ +m[3]+ +m[4]/1000;\n      let j=i+1, text='';\n      while(j<lines.length && lines[j].trim()!==''){ text+=(text?' ':'')+lines[j].trim(); j++; }\n      if(text) out.push({start, text}); i=j;\n    }\n  }\n  return out;\n}\nfunction onSubtitle(file){\n  if(!file) return;\n  const r=new FileReader();\n  r.onload=()=>{\n    const txt=r.result;\n    const cues=/\\.vtt$/i.test(file.name)?parseVTT(txt):parseSRT(txt);\n    if(!cues.length){ $('subInfo').textContent='字幕解析失败，请检查格式（.srt / .vtt）'; return; }\n    state.subtitle=cues; state.subtitleRaw=txt.slice(0,20000);\n    $('subInfo').textContent=`已加载 ${cues.length} 条字幕，AI 评论将基于真实时间轴`;\n    saveMovie();\n  };\n  r.readAsText(file);\n}\n\n/* ================= 截图分析 ================= */\nfunction onShotSelect(files){\n  if(!files || !files.length) return;\n  const cfg=loadCfg();\n  const key=cfg.key||$('aiKey').value.trim();\n  const model=cfg.model||$('aiModel').value.trim()||'gpt-4o-mini';\n  const endpoint=cfg.endpoint||$('aiEndpoint').value.trim()||'https://api.openai.com/v1/chat/completions';\n  if(!key){ alert('请先在 AI配置 里填写 API Key'); return; }\n  Array.from(files).forEach(file=>analyzeShot(file,endpoint,model,key));\n}\nasync function analyzeShot(file,endpoint,model,key){\n  const id=Date.now()+Math.random();\n  const list=$('shotList');\n  const row=document.createElement('div'); row.className='shot-row'; row.id='shot-'+id;\n  const imgUrl=URL.createObjectURL(file);\n  row.innerHTML=`<img class=\"img\" src=\"${imgUrl}\"><div class=\"txt\">正在分析画面…</div><div class=\"meta\">${esc(file.name)}</div>`;\n  list.prepend(row);\n  try{\n    const base64=await fileToBase64(file);\n    const res=await fetch(endpoint,{\n      method:'POST',\n      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},\n      body:JSON.stringify({\n        model:model,\n        messages:[{\n          role:'user',\n          content:[\n            {type:'text',text:'你是陪用户看电影的 AI。请用一句话点评这张电影截图，语气像朋友一样。只输出一句。'},\n            {type:'image_url',image_url:{url:base64}}\n          ]\n        }],\n        max_tokens:120\n      })\n    });\n    if(!res.ok) throw new Error('API '+res.status);\n    const data=await res.json();\n    const txt=data.choices?.[0]?.message?.content?.trim()||'（AI 没有返回内容）';\n    row.querySelector('.txt').textContent=txt;\n    aiSay('AI', txt);\n  }catch(e){\n    row.querySelector('.txt').textContent='分析失败：'+e.message;\n  }\n}\nfunction fileToBase64(file){\n  return new Promise((resolve,reject)=>{\n    const r=new FileReader();\n    r.onload=()=>resolve(r.result);\n    r.onerror=reject;\n    r.readAsDataURL(file);\n  });\n}\nconst shotDrop=$('shotDrop');\nshotDrop.addEventListener('dragover',e=>{ e.preventDefault(); shotDrop.style.borderColor='var(--accent)'; });\nshotDrop.addEventListener('dragleave',e=>{ e.preventDefault(); shotDrop.style.borderColor=''; });\nshotDrop.addEventListener('drop',e=>{\n  e.preventDefault(); shotDrop.style.borderColor='';\n  onShotSelect(e.dataTransfer.files);\n});\n\n/* ================= 实时视觉分析（可选） ================= */\nfunction setupVision(){\n  if(state.visionTimer){ clearInterval(state.visionTimer); state.visionTimer=null; }\n  const cfg=loadCfg();\n  if(!cfg.vision || cfg.vision<=0 || !cfg.key) return;\n  state.visionTimer=setInterval(()=>{\n    if(video.paused || video.ended) return;\n    captureAndAnalyze();\n  }, Math.max(10,cfg.vision)*1000);\n}\nasync function captureAndAnalyze(){\n  const cfg=loadCfg();\n  if(!cfg.key) return;\n  try{\n    const canvas=document.createElement('canvas');\n    canvas.width=video.videoWidth||640; canvas.height=video.videoHeight||360;\n    const ctx=canvas.getContext('2d'); ctx.drawImage(video,0,0,canvas.width,canvas.height);\n    const base64=canvas.toDataURL('image/jpeg',0.7);\n    const res=await fetch(cfg.endpoint||'https://api.openai.com/v1/chat/completions',{\n      method:'POST',\n      headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},\n      body:JSON.stringify({\n        model:cfg.model||'gpt-4o-mini',\n        messages:[{\n          role:'user',\n          content:[\n            {type:'text',text:'你是陪用户看电影的 AI。请用一句话描述当前画面里正在发生什么，语气像朋友一样。只输出一句。'},\n            {type:'image_url',image_url:{url:base64}}\n          ]\n        }],\n        max_tokens:80\n      })\n    });\n    if(!res.ok) return;\n    const data=await res.json();\n    const txt=data.choices?.[0]?.message?.content?.trim();\n    if(txt) aiSay('AI', txt, fmt(video.currentTime));\n  }catch(e){ console.error(e); }\n}\n\n/* ================= 历史记录恢复（点击记录卡→续看） ================= */\nfunction restoreHistory(id){\n  const r=loadRecords().find(x=>x.id===id);\n  if(!r) return;\n  state.currentId=id; state.recordId=id;\n  loadMovie(id);\n  renderNotes(); clearAi();\n  $('nowPlaying').textContent='继续观看：'+r.title;\n  aiSay('系统','继续观看：'+r.title);\n  if(!state.file){\n    aiSay('系统','本地影片文件未保留，请重新选择同一部影片。');\n  }\n}\n\n/* ================= 语音输入 ================= */\nlet recognizer=null, isRec=false;\nfunction initSpeech(){\n  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;\n  if(!SR){ $('micBtn').style.display='none'; return; }\n  recognizer = new SR();\n  recognizer.continuous = false;\n  recognizer.interimResults = true;\n  recognizer.lang = 'zh-CN';\n  recognizer.onstart = ()=>{ isRec=true; $('micBtn').classList.add('rec'); $('micBtn').title='正在听…再点结束'; };\n  recognizer.onend = ()=>{ isRec=false; $('micBtn').classList.remove('rec'); $('micBtn').title='点击说话'; };\n  recognizer.onresult = (e)=>{\n    let final='', interim='';\n    for(let i=e.resultIndex;i<e.results.length;i++){\n      const t=e.results[i][0].transcript;\n      if(e.results[i].isFinal) final+=t; else interim+=t;\n    }\n    const inp=$('chatInp');\n    if(final){ inp.value=final; sendChat(); }\n    else if(interim){ inp.value=interim; }\n  };\n  recognizer.onerror = (e)=>{\n    if(e.error==='not-allowed') aiSay('系统','麦克风权限被拒绝，请在浏览器地址栏允许使用麦克风。');\n    else if(e.error!=='no-speech') aiSay('系统','语音识别出错：'+e.error);\n  };\n}\nfunction toggleMic(){\n  if(!recognizer){ initSpeech(); }\n  if(!recognizer){ aiSay('系统','当前浏览器不支持语音识别，请用 Edge / Chrome 打开。'); return; }\n  if(isRec){ recognizer.stop(); }\n  else { try{ recognizer.start(); }catch(e){ aiSay('系统','无法启动麦克风：'+e.message); } }\n}\n\n/* ================= 启动 ================= */\nfunction init(){\n  renderRecords();\n  const cfg=loadCfg();\n  $('aiModel').value=cfg.model;\n  $('aiEndpoint').value=cfg.endpoint;\n  initSpeech();\n  setupVision();\n}\ninit();\n\nwindow.addEventListener('message',e=>{\n  if(e.data && e.data.type==='wb-reload') location.reload();\n});\n<<<SCRIPT_END>>>\n</body>\n</html>\n";
const SCREENING_SRC = SCREENING_RAW.split('<<<SCRIPT_END>>>').join('</'+'script>');

function wbImport(file){

  reader.onload = function(){
    try{
      const obj = JSON.parse(reader.result);
      const data = obj.data || obj;
      let n=0;
      Object.keys(data).forEach(k=>{ localStorage.setItem(k, data[k]); n++; });

    }catch(e){ alert('文件格式不对，导入失败'); }

}

const WB_SKIP=['wb_cloudsync','food_cloudsync','wb_last_sync_at','wb_cloud_ver','wb_merge_shadow'];
/* 污染键：源于旧写法 localStorage.setItem=fn。localStorage 是 Storage 对象，带 WebIDL
   named property setter；在严格实现的浏览器（iOS Safari/WebKit）里该赋值不会覆盖方法，
   而是写入一条名为 setItem 的条目（值为函数字符串）。它会污染云端并回灌所有设备，
   在该设备上还会遮蔽原生方法，导致所有写入静默失败、同步彻底中断。此处统一识别并清除。 */
const WB_JUNK=['setItem','getItem','removeItem','clear','key','length','constructor','__proto__','toString','valueOf'];
function wbIsJunk(k,v){
  if(WB_JUNK.indexOf(k)>=0) return true;
  if(typeof v==='string' && /^\s*function\s*\(/.test(v)) return true;
  return false;
}
function wbCleanJunk(){
  try{
    var rm=[];
    for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); var v=localStorage.getItem(k); if(wbIsJunk(k,v)) rm.push(k); }
    rm.forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
    if(rm.length) console.warn('[wb] 已清理污染键:', rm);
    return rm;
  }catch(e){ return []; }
}
function wbLoadCfg(){
  try{ wbSync=JSON.parse(localStorage.getItem(WB_K_SYNC))||null; }catch(e){ wbSync=null; }
  if(!wbSync) wbSync={};
  if(wbSync.connected===undefined) wbSync.connected=false;
  /* 自愈：清掉旧版 GitHub 同步层遗留字段（其中含明文 GitHub 令牌），只保留 connected。
     现用的 Supabase 同步层只依赖 connected 一个字段，删除其余字段不影响同步。 */
  if(wbSync.github!==undefined || wbSync.provider!==undefined || wbSync.gist_id!==undefined || wbSync.token!==undefined){
    const c=wbSync.connected;
    wbSync={connected:c};
    try{ localStorage.setItem(WB_K_SYNC, JSON.stringify(wbSync)); }catch(e){}
    console.warn('[wb] 已清除旧版 GitHub 同步配置（含明文令牌）');
  }
  return wbSync;
}
function wbSaveCfg(){ localStorage.setItem(WB_K_SYNC, JSON.stringify(wbSync)); }
function wbCollect(){ const o={}; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(WB_SKIP.indexOf(k)<0){ const v=localStorage.getItem(k); if(!wbIsJunk(k,v)) o[k]=v; } } return o; }
function wbApply(o){
  if(!o) return;
  let changed=false;
  Object.keys(o).forEach(k=>{
    if(WB_SKIP.indexOf(k)<0 && !wbIsJunk(k,o[k])){
      const cur=localStorage.getItem(k);
      if(cur!==o[k]){ try{ localStorage.setItem(k,o[k]); changed=true; }catch(e){ console.error('wbApply failed for',k,e); } }
    }
  });
  if(changed) wbBroadcastReload();
}
function wbSchedulePush(immediate){
  wbLoadCfg(); if(!wbSync.connected) return;
  /* 首次拉取尚未完成前一律不推，避免用本机旧数据覆盖另一台设备刚写的记录 */
  if(!wbReady){ wbPendingPush=true; return; }
  if(wbPushTimer) clearTimeout(wbPushTimer);
  wbPushTimer=setTimeout(()=>wbPush(true), immediate?0:800);
}

/* ===== 合并策略 v2：三向合并，新增 / 编辑 / 删除 都能双向同步 =====
   旧版问题（就是「显示已同步但实际没同步」的主因）：
     1) 只有 5 个键走合并，其余二十多个键一律「本机直接覆盖云端」，
        另一端新增的内容会被整机覆盖抹掉；
     2) 按 id 合并时固定保留云端版本，导致本机对已有条目的编辑丢失。
   现在改为：以「上次同步成功时的快照」为基线做三向合并
     - 两侧都有：取时间戳更新的那个（编辑能同步）
     - 只有一侧有、基线没有：新增，保留
     - 基线有、某一侧没有：该侧删除，删除（删除也能同步，不会复活）
     - 没有基线时只做并集，绝不删除（最保守，不会误删数据） */
const WB_K_SHADOW='wb_merge_shadow';
function wbLoadShadow(){ try{ return JSON.parse(localStorage.getItem(WB_K_SHADOW))||{}; }catch(e){ return {}; } }
function wbSaveShadow(o){ try{ const s={}; Object.keys(o||{}).forEach(k=>{ if(wbIsArr(o[k])) s[k]=o[k]; }); localStorage.setItem(WB_K_SHADOW, JSON.stringify(s)); }catch(e){} }
function wbIsArr(v){ try{ const a=JSON.parse(v); return Array.isArray(a); }catch(e){ return false; } }
function wbIsObj(v){ try{ const a=JSON.parse(v); return a && typeof a==='object' && !Array.isArray(a); }catch(e){ return false; } }
function wbItemId(x){
  if(x===null||x===undefined) return JSON.stringify(x);
  if(typeof x!=='object') return 'v:'+String(x);
  if(x.id!==undefined && x.id!==null) return String(x.id);
  if(x.key!==undefined && x.key!==null) return 'k:'+String(x.key);
  if(x.name!==undefined) return 'n:'+String(x.name);
  return JSON.stringify(x);
}
function wbItemTs(x){
  if(!x||typeof x!=='object') return 0;
  const t=x.updated||x.ts||x.created||x._ts||0;
  if(typeof t==='number') return t;
  const p=Date.parse(t); return isNaN(p)?0:p;
}
function wbMergeArr3(localStr,cloudStr,baseStr){
  let L=null,C=null,B=null;
  try{ L=JSON.parse(localStr); }catch(e){}
  try{ C=JSON.parse(cloudStr); }catch(e){}
  try{ B=JSON.parse(baseStr); }catch(e){}
  if(!Array.isArray(L)&&!Array.isArray(C)) return (localStr!=null?localStr:cloudStr);
  if(!Array.isArray(L)) return cloudStr;
  if(!Array.isArray(C)) return localStr;
  if(!Array.isArray(B)) B=null;                 /* 无基线：只做并集，绝不敢删 */
  const map={};
  const put=x=>{ const id=wbItemId(x); const cur=map[id]; if(cur===undefined||wbItemTs(x)>=wbItemTs(cur)) map[id]=x; };
  L.forEach(put); C.forEach(put);
  if(B){                                        /* 三向判定：基线有、任一侧没了 => 该侧删了 */
    const bIds={},lIds={},cIds={};
    B.forEach(x=>{ bIds[wbItemId(x)]=1; });
    L.forEach(x=>{ lIds[wbItemId(x)]=1; });
    C.forEach(x=>{ cIds[wbItemId(x)]=1; });
    Object.keys(bIds).forEach(id=>{ if(!lIds[id]||!cIds[id]) delete map[id]; });
  }
  const out=Object.keys(map).map(k=>map[k]);
  out.sort((a,b)=>wbItemTs(a)-wbItemTs(b));
  return JSON.stringify(out);
}
function wbMergeObj(localStr,cloudStr){
  let L=null,C=null;
  try{ L=JSON.parse(localStr); }catch(e){}
  try{ C=JSON.parse(cloudStr); }catch(e){}
  if(!L||typeof L!=='object'||Array.isArray(L)) return (localStr!=null?localStr:cloudStr);
  if(!C||typeof C!=='object'||Array.isArray(C)) return localStr;
  const out={};
  Object.keys(C).forEach(k=>{ out[k]=C[k]; });
  Object.keys(L).forEach(k=>{ if(!wbIsEmptyVal(L[k])||out[k]===undefined) out[k]=L[k]; });
  return JSON.stringify(out);
}
function wbMergeDaily(localStr,cloudStr){
  let L=null,C=null;
  try{ L=JSON.parse(localStr||'null'); }catch(e){ return localStr; }
  try{ C=JSON.parse(cloudStr||'null'); }catch(e){ C=null; }
  if(!L||!L.records) return cloudStr||localStr;
  if(!C||!C.records) return localStr;
  const out={records:Object.assign({},C.records||{}),tags:Object.assign({},C.tags||{})};
  Object.keys(L.records||{}).forEach(d=>{
    const a=out.records[d]||'', b=L.records[d]||'';
    out.records[d]=(b.length>=a.length)?b:a;   /* 同一天取内容更充实的一方 */
  });
  Object.keys(L.tags||{}).forEach(d=>{
    const a=out.tags[d]||[], b=L.tags[d]||[];
    out.tags[d]=(b.length>=a.length)?b:a;
  });
  return JSON.stringify(out);
}
function wbIsEmptyVal(v){
  if(v===null||v===undefined) return true;
  const s=String(v).trim();
  return s===''||s==='[]'||s==='{}'||s==='null';
}
function wbMergeAll(cloudObj){
  const local=wbCollect();
  const shadow=wbLoadShadow();
  const out=Object.assign({},cloudObj||{});
  Object.keys(local).forEach(k=>{
    const lv=local[k], cv=out[k], bv=shadow[k];
    if(k==='DAILY_STATUS'){ out[k]=wbMergeDaily(lv,cv); return; }
    if(wbIsArr(lv)||wbIsArr(cv)){ out[k]=wbMergeArr3(lv,cv,bv); return; }   /* 数组：三向合并 */
    if(wbIsObj(lv)&&wbIsObj(cv)){ out[k]=wbMergeObj(lv,cv); return; }        /* 对象：按键合并 */
    if(wbIsEmptyVal(lv)&&!wbIsEmptyVal(cv)) return;                          /* 本机空、云端有 → 保留云端 */
    out[k]=lv;
  });
  Object.keys(out).forEach(k=>{ if(wbIsJunk(k,out[k])) delete out[k]; });    /* 清掉污染键 */
  return out;
}
function wbSig(o){ let n=0,s=0; Object.keys(o||{}).forEach(k=>{ n++; s+=(o[k]||'').length; }); return n+':'+s; }
function wbBroadcastReload(){ document.querySelectorAll('iframe').forEach(f=>{ try{ f.contentWindow.postMessage({type:'wb-reload'},'*'); }catch(e){} }); if(typeof updateStockBadge==='function'){ try{ updateStockBadge(); }catch(e){} } }

function wbToast(m){ let t=document.getElementById('wbToast'); if(!t){ t=document.createElement('div'); t.id='wbToast'; t.style.cssText='position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#2c241b;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .3s'; document.body.appendChild(t); } t.textContent=m; t.style.opacity='1'; clearTimeout(t._tm); t._tm=setTimeout(()=>{ t.style.opacity='0'; },1800); }
async function wbPush(silent){
  if(!wbSync||!wbSync.connected||wbBusy) return; wbBusy=true;
  try{
    const client=wbSbInit(); if(!client) throw new Error('Supabase 未初始化（脚本未加载？）');
    /* 关键：推送前先取云端现有内容做合并，绝不整库覆盖，否则会抹掉另一台设备的记录 */
    let cloudObj=null;
    try{
      const { data }=await client.from('workbench_sync').select('payload').eq('id','me').maybeSingle();
      if(data&&data.payload&&data.payload.data) cloudObj=data.payload.data;
    }catch(e){ console.warn('取云端失败，本次跳过推送以免覆盖',e); wbBusy=false; return; }
    const merged=cloudObj?wbMergeAll(cloudObj):wbCollect();
    const sig=wbSig(merged);
    if(sig===wbLastPushSig){ wbBusy=false; return; }   /* 内容没变就不推，避免无意义刷云端 */
    const now=new Date().toISOString();
    const row={ id:'me', payload:{ updatedAt:now, data:merged }, updated_at:now };
    const { error }=await client.from('workbench_sync').upsert(row, { onConflict:'id' });
    if(error) throw error;
    wbLastPushSig=sig;
    wbSaveShadow(merged);          /* 记录本次同步快照，作为下次三向合并的基线 */
    /* 只有推送成功后才推进时间戳 */
    try{ localStorage.setItem(WB_K_LAST_SYNC, now); localStorage.setItem(WB_K_CLOUD_VER, now); }catch(e){}
    wbUpdateSyncUI(); if(!silent) wbToast('已同步到云端');
  }catch(e){ console.error(e); wbToast('同步失败：'+(e&&e.message?e.message:e)); }
  finally{ wbBusy=false; }
}
async function wbPull(){
  if(!wbSync||!wbSync.connected||wbBusy) return; wbBusy=true;
  try{
    const client=wbSbInit(); if(!client) throw new Error('Supabase 未初始化');
    const { data, error }=await client.from('workbench_sync').select('*').eq('id','me').maybeSingle();
    if(error) throw error;
    if(data && data.payload){
      /* 用「已见过的云端版本」判断，而不是本机推送时间，否则本机一写入就再也拉不到对端数据 */
      const seenVer=localStorage.getItem(WB_K_CLOUD_VER)||'1970-01-01T00:00:00.000Z';
      const cloudAt=data.payload.updatedAt||'1970-01-01T00:00:00.000Z';
      if(cloudAt>seenVer){
        const merged=wbMergeAll(data.payload.data);   /* 落地也走合并，云端旧值不会抹掉本机新记录 */
        wbApply(merged);
        wbSaveShadow(merged);                          /* 存快照，作为下次三向合并的基线 */
        try{ localStorage.setItem(WB_K_CLOUD_VER, cloudAt); }catch(e){}
      }
    }
  }catch(e){ console.error(e); }
  finally{ wbBusy=false; }
}
function wbStartPoll(){
  if(wbPollTimer) clearInterval(wbPollTimer);
  wbPollTimer=setInterval(async()=>{
    if(!wbSync||!wbSync.connected||wbBusy) return;
    try{
      const client=wbSbInit(); if(!client) return;
      const { data, error }=await client.from('workbench_sync').select('updated_at').eq('id','me').maybeSingle();
      if(error) return;
      const cloudAt=(data&&data.updated_at)||'1970-01-01T00:00:00.000Z';
      const seenVer=localStorage.getItem(WB_K_CLOUD_VER)||'1970-01-01T00:00:00.000Z';
      if(cloudAt>seenVer) wbPull();
    }catch(e){}
  },15000);
}
async function wbConnect(){
  wbLoadCfg();
  try{
    const client=wbSbInit(); if(!client) throw new Error('Supabase 未初始化（脚本未加载？）');
    wbSync.connected=true; wbSaveCfg();      /* 必须先置位，否则 wbPull 会被开头的未连接判断挡掉 */
    try{ await wbPull(); }catch(e){ }
    wbReady=true;
    wbStartPoll();
    wbToast('已连接，开始同步'); wbUpdateSyncUI();
  }catch(e){ wbToast('连接失败：'+(e&&e.message?e.message:e)); }
}
function wbDisconnect(){
  wbSync.connected=false; wbSaveCfg(); wbUpdateSyncUI();
  if(wbPollTimer){ clearInterval(wbPollTimer); wbPollTimer=null; }
  if(wbPushTimer){ clearTimeout(wbPushTimer); wbPushTimer=null; }
  wbToast('已断开云同步');
}
function wbOpenSync(){
  wbLoadCfg();
  let m=document.getElementById('wbSyncModal');
  if(!m){ m=document.createElement('div'); m.id='wbSyncModal'; m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:9998'; document.body.appendChild(m); }
  m.onclick=e=>{ if(e.target===m) m.style.display='none'; };
  m.style.display='flex';
  const conn=wbSync.connected?'已连接 ✅（自动同步中）':'未连接';
  const urlMask=WB_SUPABASE_URL.replace(/^(https:\/\/[^.]+).*$/,'$1• • • • •');
  m.innerHTML='<div style="background:#faf7f1;max-width:460px;width:92%;border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)">'
    +'<h2 style="margin:0 0 6px;font-size:19px;color:#2c241b">☁ 工作台云同步</h2>'
    +'<p style="margin:0 0 14px;font-size:13px;color:#7a6f60;line-height:1.6">同步<b>全部页面</b>数据到你的 Supabase 云端（美食/股票/驱动力/周计划…），电脑与手机自动保持一致。无需令牌、换设备不清数据。</p>'
    +'<div style="margin-bottom:12px;font-size:12px;color:#7a6f60">Supabase 项目：<b style="color:#2c241b">'+escAttr(urlMask)+'</b></div>'
    +'<div id="wbSyncStatus" style="margin:10px 0;font-size:13px;color:#b8714e">状态：'+conn+'</div>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap">'
    +'<button onclick="wbDoConnect()" style="background:#b8714e;color:#fff;border:0;padding:9px 16px;border-radius:9px;cursor:pointer">连接并同步</button>'
    +'<button onclick="wbPush();" style="background:#efe7da;color:#2c241b;border:0;padding:9px 16px;border-radius:9px;cursor:pointer">立即上传</button>'
    +'<button onclick="wbPull();" style="background:#efe7da;color:#2c241b;border:0;padding:9px 16px;border-radius:9px;cursor:pointer">拉取</button>'
    + (wbSync.connected?'<button onclick="wbDisconnect()" style="background:#e8d9cf;color:#a23;border:0;padding:9px 16px;border-radius:9px;cursor:pointer">断开</button>':'')
    +'</div>'
    +'<div style="margin-top:12px;text-align:right"><button onclick="document.getElementById(\'wbSyncModal\').style.display=\'none\'" style="background:none;border:0;color:#7a6f60;cursor:pointer;font-size:13px">关闭</button></div>'
    +'</div>';
}
function wbDoConnect(){ wbLoadCfg(); wbConnect(); }
function escAttr(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
window.addEventListener('message', e=>{ if(e.data && e.data.type==='wb-data-changed'){ wbSchedulePush(); } });
async function wbSilentReconnect(){
  wbCleanJunk();          /* 启动先自愈：清掉旧写法留下的 setItem 等污染条目，恢复 localStorage 写入能力 */
  wbLoadCfg();
  const dot=document.getElementById('wbSyncDot');
  if(!wbSync.connected){ if(dot) dot.style.background='#c9bfae'; wbReady=true; return; }
  if(dot) dot.style.background='#3aa76d';
  try{ await wbPull(); }catch(e){}
  wbReady=true;                                   /* 拉取完成后才放开推送闸门 */
  if(wbPendingPush){ wbPendingPush=false; wbSchedulePush(); }
  wbStartPoll();
  wbUpdateSyncUI();
}
wbSilentReconnect();
wbUpdateSyncUI();


</script>
