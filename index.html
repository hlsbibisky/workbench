<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台</title>
<style>
  /* 与「状态记录」模块保持一致的暖色宣纸风格 */
  :root{
    --bg:#f7f4ee; --card:#fffdf9; --ink:#3a3631; --sub:#8a837a;
    --line:#ece5da; --accent:#b8714e; --accent2:#5b8c7b; --mark:#f0e3d6;
    --noted:#3f9d6b;
    --radius:14px;
    --shadow:0 1px 3px rgba(58,54,49,.06), 0 10px 30px rgba(58,54,49,.05);
    --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font); line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--mark); }

  .app{ display:flex; min-height:100vh; }

  /* ===== 左侧导航栏 ===== */
  .sidebar{
    width:240px; flex:0 0 240px; background:var(--card);
    border-right:1px solid var(--line); padding:22px 14px;
    display:flex; flex-direction:column; gap:4px;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    position:relative;
    display:flex; align-items:center; gap:9px;
    padding:4px 4px 16px 24px; margin-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .brand-stack{
    display:flex; flex-direction:column; align-items:flex-start;
    font-weight:700; color:var(--accent); line-height:1.05;
  }
  .brand-tag, .brand-title{
    display:grid; grid-template-columns:repeat(3, 28px);
  }
  .brand-tag{ font-size:14px; padding-bottom:5px; opacity:.88; }
  .brand-title{ font-size:22px; letter-spacing:0; }
  .brand-tag span, .brand-title span{ text-align:center; }
  .brand .dot{
    position:absolute; left:7px; top:19px;
    width:9px; height:9px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 0 4px rgba(184,113,78,.14);
  }
  .brand-en{ font-size:11px; font-weight:500; letter-spacing:1px; color:var(--sub);
    padding-bottom:2px; }
    font-size:10.5px; color:var(--sub); letter-spacing:1.5px; font-weight:400; white-space:nowrap; }

  .navlabel{ font-size:11px; color:var(--sub); letter-spacing:2px; padding:10px 12px 4px; }
  .navitem{
    position:relative;
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    border:none; background:transparent; color:var(--ink); padding:11px 14px;
    border-radius:11px; cursor:pointer; font-size:15px; transition:.16s;
    font-family:inherit; letter-spacing:1px;
  }
  .navitem:hover{ background:var(--mark); }
  .navitem.active{ background:var(--accent); color:#fff; font-weight:600;
    box-shadow:0 3px 12px rgba(184,113,78,.28); }
  .navitem.nav-alarm{ border-left:3px solid #d9822b; }
  .navitem.nav-alarm-red{ border-left:3px solid #c0392b; background:#fdf0ee; }
  .navitem .navbadge{ position:absolute; top:7px; right:10px; min-width:18px; height:18px;
    line-height:18px; text-align:center; background:#c0392b; color:#fff; font-size:11px;
    border-radius:9px; padding:0 5px; font-weight:700; }

  .sidefoot{
    margin-top:auto; font-size:11px; color:var(--sub); padding:14px 12px 0;
    border-top:1px solid var(--line); line-height:1.8;
  }
  .sync-box{ margin-top:10px; padding:10px; background:rgba(184,113,78,.06); border:1px solid var(--line); border-radius:10px; }
  .syncbtn{ display:inline-block; margin:2px 4px 2px 0; padding:6px 12px; background:#fff; color:var(--accent); border:1px solid var(--accent); border-radius:14px; cursor:pointer; font-size:12.5px; font-family:inherit; transition:.14s; }
  .syncbtn:hover{ background:var(--accent); color:#fff; }
  .sidefoot .stat{ color:var(--noted); font-weight:600; }

  /* ===== 主区 ===== */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }

  /* 顶栏 */
  .topbar{
    height:58px; flex:0 0 58px; display:flex; align-items:center; justify-content:space-between;
    padding:0 30px; border-bottom:1px solid var(--line); background:rgba(255,253,249,.6);
    backdrop-filter:blur(4px); position:sticky; top:0; z-index:5;
  }
  .crumb{ font-size:13.5px; color:var(--sub); letter-spacing:.5px; display:flex; align-items:center; gap:8px; }
  .crumb .sep{ color:var(--line); }
  .crumb .now{ color:var(--accent); font-weight:600; }
  .topright{ display:flex; align-items:center; gap:14px; font-size:13px; color:var(--sub); }
  .topright .hi{ color:var(--ink); font-weight:600; }
  #wbSaveBtn{ font-family:inherit; font-size:13px; font-weight:600; color:#fff; background:var(--accent);
    border:0; border-radius:9px; padding:7px 15px; cursor:pointer; box-shadow:0 2px 8px rgba(184,113,78,.25);
    display:inline-flex; align-items:center; gap:5px; transition:transform .12s, background .15s; }
  #wbSaveBtn:hover{ background:#a5613f; }
  #wbSaveBtn:active{ transform:scale(.96); }
  .wb-icon-btn{ font-family:inherit; font-size:12.5px; font-weight:500; color:var(--accent); background:#fff;
    border:1px solid var(--line); border-radius:9px; padding:6px 12px; cursor:pointer;
    display:inline-flex; align-items:center; gap:4px; transition:.14s; }
  .wb-icon-btn:hover{ background:var(--mark); border-color:var(--accent); }
  .topright label.wb-icon-btn input{ display:none; }
  .topright .clock{ font-variant-numeric:tabular-nums; color:var(--ink);
    background:var(--mark); padding:3px 11px; border-radius:20px; letter-spacing:.5px; }

  .content{ flex:1; padding:26px 30px 56px; min-width:0; display:flex; flex-direction:column; }

  .modhead{ margin-bottom:18px; flex:0 0 auto; }
  .modtitle{ font-size:22px; font-weight:700; margin:0 0 14px; letter-spacing:1px;
    display:flex; align-items:baseline; gap:12px; }
  .modtitle small{ font-size:13px; color:var(--sub); font-weight:400; letter-spacing:0; }

  /* 子模块 tab */
  .subtabs{ display:flex; gap:8px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  .subtab{
    display:inline-flex; align-items:center; gap:7px;
    border:1px solid var(--line); border-bottom:none; background:#fff; color:var(--sub);
    padding:9px 17px; border-radius:11px 11px 0 0; cursor:pointer; font-size:14px;
    transition:.16s; font-family:inherit; margin-bottom:-1px; letter-spacing:.5px;
  }
  .subtab:hover{ border-color:var(--accent); color:var(--accent); }
  .subtab.active{ background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  .subtab .pip{ width:6px; height:6px; border-radius:50%; background:var(--noted); }
  .subtab.active .pip{ background:#fff; }

  .modbody{ margin-top:18px; flex:1; min-height:0; display:flex; flex-direction:column; }
  .modbody > *{ animation:fade .26s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  /* iframe 容器 + 工具条 */
  .framebox{
    border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
    background:var(--card); box-shadow:var(--shadow);
    display:flex; flex-direction:column; flex:1; min-height:0;
  }
  .framebar{
    display:flex; align-items:center; justify-content:flex-end;
    padding:4px 14px; border-bottom:1px solid var(--line); background:var(--bg);
    min-height:0;
  }
  .framebar .fbtn{
    border:1px solid var(--line); background:#fff; color:var(--sub); cursor:pointer;
    width:30px; height:30px; border-radius:9px; display:grid; place-items:center; transition:.15s;
  }
  .framebar .fbtn:hover{ border-color:var(--accent); color:var(--accent); }
  .framebar .fbtn svg{ width:15px; height:15px; }
  .framebox iframe{ width:100%; flex:1; min-height:0; border:none; display:block; background:var(--bg); }

  /* 占位面板 */
  .placeholder{
    background:var(--card); border:1px dashed var(--line); border-radius:var(--radius);
    padding:52px 28px; text-align:center; color:var(--sub); box-shadow:var(--shadow);
  }
  .placeholder .ico{
    width:46px; height:46px; margin:0 auto 16px; border-radius:14px; background:var(--mark);
    display:grid; place-items:center; color:var(--accent);
  }
  .placeholder .ico svg{ width:24px; height:24px; }
  .placeholder h3{ color:var(--accent); font-size:18px; margin:0 0 10px; letter-spacing:1px; }
  .placeholder p{ font-size:14px; margin:6px auto; max-width:480px; line-height:1.7; }
  .placeholder .tag{ display:inline-block; margin-top:16px; font-size:11px; color:var(--sub);
    background:var(--mark); border-radius:12px; padding:4px 13px; letter-spacing:1px; }

  /* 窄屏：侧栏收窄但仍保留文字 */
  @media (max-width:880px){
    .sidebar{ width:132px; flex:0 0 132px; padding:18px 10px; }
    .brand{ justify-content:flex-start; padding:2px 0 14px; }
    .brand-title{ font-size:17px; }
    .brand-tag{ font-size:11px; padding-bottom:4px; }
    .brand-tag, .brand-title{ grid-template-columns:repeat(3, 22px); }
    .brand .dot{ left:4px; top:16px; width:7px; height:7px;
      box-shadow:0 0 0 3px rgba(184,113,78,.14); }
    .brand-en{ display:none; }
    .navlabel{ display:none; }
    .navitem{ justify-content:flex-start; padding:11px 10px; }
    .sidefoot{ display:none; }
    .topbar, .content{ padding-left:18px; padding-right:18px; }
    .framebox iframe{ flex:1; min-height:0; }
  }
  /* 手机：侧栏变顶部横滑导航，主区 iframe 全屏 */
  @media (max-width:680px){
    .app{ flex-direction:column; }
    .sidebar{
      width:100%; flex:0 0 auto; height:auto; position:sticky; top:0; z-index:20;
      flex-direction:column; padding:10px 12px; border-right:none; border-bottom:1px solid var(--line);
    }
    .brand{ padding:2px 0 8px; }
    .brand-en{ display:none; }
    .navlabel{ display:none; }
    #navCommon, #navOther{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
    .navitem{ flex:0 0 auto; width:auto; padding:8px 13px; font-size:13.5px; white-space:nowrap; }
    .navitem .navbadge{ position:static; margin-left:6px; }
    .sidefoot{ display:none; }
    .topbar{ padding:0 14px; height:50px; flex:0 0 50px; }
    .content{ padding:12px 12px 36px; }
    .modtitle{ font-size:19px; }
    .crumb{ font-size:12.5px; }
    .framebox iframe{ flex:1; min-height:0; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-stack">
        <div class="brand-tag"><span>H</span><span>L</span><span>S</span></div>
        <div class="brand-title"><span>工</span><span>作</span><span>台</span></div>
      </div>
      <span class="dot"></span>
      <span class="brand-en">WorkBench</span>
    </div>
    <div class="navlabel">常用</div>
    <nav id="navCommon"></nav>
    <div class="navlabel">其他</div>
    <nav id="navOther"></nav>
    <button class="navitem" id="wbSyncNav" onclick="wbOpenSync()" style="display:flex;align-items:center;justify-content:space-between">
      <span class="lbl">☁ 云同步</span>
      <span id="wbSyncDot" style="width:8px;height:8px;border-radius:50%;background:#c9bfae"></span>
    </button>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="topright">
        <button class="wb-icon-btn" onclick="wbExport()" title="导出全部数据为 JSON 备份">⬇ 导出</button>
        <label class="wb-icon-btn" title="从 JSON 备份恢复全部数据" style="cursor:pointer">⬆ 导入<input type="file" accept="application/json" style="display:none" onchange="wbImport(this.files[0])"></label>
        <button id="wbSaveBtn" onclick="wbRequestSave()" title="把当前页面正在编辑的内容立即保存到本地并同步云端">💾 保存</button>
        <span class="hi" id="hi"></span>
        <span id="today"></span>
      </div>
    </div>

    <div class="content">
      <div class="modhead">
        <h1 class="modtitle" id="modtitle"></h1>
        <div class="subtabs" id="subtabs"></div>
      </div>
      <div class="modbody" id="modbody"></div>
    </div>
  </main>
</div>

<script>
/* =========================================================
   工作台框架 —— 模块 / 子模块配置
   后续接入具体内容时，只需在对应模块下增删 sub 项：
     type:'iframe'      + src      → 嵌入一个独立页面（如状态记录）
     type:'placeholder' + desc     → 占位面板（待建设），可加 status:'building'
     type:'html'        + html     → 直接写内联内容
   子项可带 status:'online' 标记已上线（导航点 + 底部统计会读取）
   ========================================================= */
const ICONS = {
  inner:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.2 5.2l1.8 1.8M17 17l1.8 1.8M18.8 5.2 17 7M7 17l-1.8 1.8"/></svg>',
  stock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9"/><path d="M16 7h5v5"/></svg>',
  daily:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/></svg>',
  tools:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6.5v6.5H4zM13.5 4H20v6.5h-6.5zM4 13.5h6.5V20H4zM13.5 13.5H20V20h-6.5z"/></svg>',
  refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>',
  build:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12 4 7.5"/></svg>'
};

const MODULES = {
  inner: {
    title:'内观觉察', note:'自我觉察与成长', group:'common',
    sub:[
      {id:'now',     name:'当下状态', type:'iframe',      src:'每日状态记录.html', status:'online'},
    ]
  },
  week: {
    title:'周计划', note:'一周安排 · 待办', group:'common',
    sub:[ {id:'plan', name:'周计划', type:'iframe', src:'周计划.html', status:'online'} ]
  },
  daily: {
    title:'美食记录', note:'美食记录 · 好好吃饭', group:'common',
    sub:[ {id:'food', name:'美食记录', type:'iframe', src:'美食记录.html', status:'online'} ]
  },
  stock: {
    title:'股票', note:'行情 · 持仓 · 策略', group:'common',
    sub:[
      {id:'board',   name:'盘面跟踪',     type:'iframe',  src:'股票.html#board',   status:'online'},
      {id:'review',  name:'个人账户复盘', type:'iframe',  src:'股票.html#review', status:'online'},
      {id:'journal', name:'状态记录',     type:'iframe',  src:'股票.html#journal', status:'online'},
    ]
  },
  drive: {
    title:'八字驱动力', note:'八字 · 十神 · 关系对应', group:'common',
    sub:[
      {id:'drive', name:'驱动力总览', type:'iframe', src:'驱动力.html',      status:'online'},
      {id:'core',  name:'核心驱动力', type:'iframe', src:'核心驱动力.html',  status:'online'},
      {id:'cycle', name:'十神关系图', type:'iframe', src:'shishen_cycle.html', status:'online'},
    ]
  },
  cinema: {
    title:'放映室', note:'本地观影 · AI陪伴', group:'other',
    sub:[ {id:'player', name:'放映室', type:'iframe', src:'放映室.html', status:'online'} ]
  },
  tools: {
    title:'工具', note:'效率 · 小工具', group:'other',
    sub:[ {id:'media', name:'音视频总结', type:'iframe', src:'音视频总结.html', status:'online'} ]
  },
};

const navCommon = document.getElementById('navCommon');
const navOther  = document.getElementById('navOther');
const titleEl = document.getElementById('modtitle');
const subEl   = document.getElementById('subtabs');
const bodyEl  = document.getElementById('modbody');
const crumbEl = document.getElementById('crumb');

let curIframe = null;

/* 顶栏：问候 + 日期 + 实时时钟 */
const WD = ['周日','周一','周二','周三','周四','周五','周六'];
function greet(h){ if(h<5)return'夜深了'; if(h<11)return'早上好'; if(h<13)return'中午好'; if(h<18)return'下午好'; return'晚上好'; }
function tick(){
  const d=new Date();
  document.getElementById('hi').textContent = greet(d.getHours());
  document.getElementById('today').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${WD[d.getDay()]}`;
}
tick(); setInterval(tick, 1000*20);

/* 构建左侧导航（按分组渲染，顺序由 NAV_ORDER 控制） */
const NAV_ORDER = ['inner','week','daily','stock','drive','cinema','tools'];
NAV_ORDER.forEach(key=>{
  const m = MODULES[key];
  if(!m) return;
  const target = (m.group==='other') ? navOther : navCommon;
  const b = document.createElement('button');
  b.className = 'navitem';
  b.dataset.key = key;
  b.innerHTML = `<span class="lbl">${m.title}</span>`;
  b.onclick = ()=> selectModule(key);
  target.appendChild(b);
});

/* 接收股票模块发来的异常预警，在左侧导航「股票」上标注 */
window.addEventListener('message', e=>{
  const d = e.data; if(!d || d.type!=='stockAlert') return;
  const nav = document.querySelector('.navitem[data-key="stock"]'); if(!nav) return;
  const red=(d.red||0), yellow=(d.yellow||0);
  nav.classList.toggle('nav-alarm-red', red>0);
  nav.classList.toggle('nav-alarm', yellow>0 && red===0);
  let badge = nav.querySelector('.navbadge');
  const total = red+yellow;
  if(total>0){
    if(!badge){ badge=document.createElement('span'); badge.className='navbadge'; nav.appendChild(badge); }
    badge.textContent = total;
  } else if(badge){ badge.remove(); }
});

/* 底部状态统计（页脚文案为静态，见 HTML 中 .sidefoot） */

function selectModule(key){
  const m = MODULES[key];
  document.querySelectorAll('.navitem[data-key]').forEach(b=> b.classList.toggle('active', b.dataset.key === key));
  titleEl.innerHTML = `${m.title}<small>${m.note||''}</small>`;
  subEl.innerHTML = '';
  m.sub.forEach(s=>{
    const t = document.createElement('button');
    t.className = 'subtab';
    const pip = s.status==='online' ? '<span class="pip"></span>' : '';
    t.innerHTML = `${pip}<span>${s.name}</span>`;
    t.dataset.id = s.id;
    t.onclick = ()=> selectSub(key, s.id);
    subEl.appendChild(t);
  });
  /* 只有一个子项时不显示 subtabs（避免嵌入时与 iframe 内导航重复） */
  subEl.style.display = m.sub.length <= 1 ? 'none' : '';
  selectSub(key, m.sub[0].id);
}

function selectSub(modKey, subId){
  const m = MODULES[modKey];
  const s = m.sub.find(x=>x.id===subId);
  subEl.querySelectorAll('.subtab').forEach(t=> t.classList.toggle('active', t.dataset.id === subId));

  // 面包屑
  crumbEl.innerHTML = `<span>工作台</span><span class="sep">›</span><span>${m.title}</span><span class="sep">›</span><span class="now">${s.name}</span>`;

  bodyEl.innerHTML = '';
  if(s.type === 'iframe'){
    const box = document.createElement('div'); box.className = 'framebox';
    const bar = document.createElement('div'); bar.className = 'framebar'; bar.style.display='none'; /* framebar 已隐藏（标题由 subtab 显示，刷新按钮移至 iframe 右下角悬浮） */
    const btn = document.createElement('button'); btn.className='fbtn'; btn.title='刷新此页';
    btn.innerHTML = ICONS.refresh;
    const f = document.createElement('iframe'); f.src = s.src; f.title = s.name;
    btn.onclick = ()=>{ f.src = f.src; };
    bar.appendChild(btn);
    box.appendChild(bar); box.appendChild(f);
    bodyEl.appendChild(box);
    curIframe = f;
  } else if(s.type === 'html'){
    bodyEl.innerHTML = s.html || '';
  } else { // placeholder
    const p = document.createElement('div'); p.className = 'placeholder';
    p.innerHTML = `<div class="ico">${ICONS.build}</div><h3>${s.name}</h3><p>${s.desc||'该板块待建设。'}</p><span class="tag">框架占位 · 待后续接入</span>`;
    bodyEl.appendChild(p);
  }
}

// 数字键 1–5 快速切换模块
document.addEventListener('keydown', e=>{
  const n = parseInt(e.key,10);
  if(n>=1 && n<=Object.keys(MODULES).length){ selectModule(Object.keys(MODULES)[n-1]); }
});

// 默认进入第一个模块
selectModule('inner');

/* ============ 数据同步：导出/导入全部 localStorage（跨设备手动备份） ============ */
function wbExport(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); data[k]=localStorage.getItem(k); }
  const blob = new Blob([JSON.stringify({app:'workbench', exportedAt:new Date().toISOString(), data}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '工作台数据备份_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
}
function wbImport(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const obj = JSON.parse(reader.result);
      const data = obj.data || obj;
      let n=0;
      Object.keys(data).forEach(k=>{ localStorage.setItem(k, data[k]); n++; });
      if(confirm('已读入 '+n+' 项数据，将刷新页面以应用。确定刷新？')) location.reload();
    }catch(e){ alert('文件格式不对，导入失败'); }
  };
  reader.readAsText(file);
}

/* ===== 工作台级云同步：同步全部页面数据（美食/股票/驱动力/周计划…） ===== */
const WB_K_SYNC='wb_cloudsync';
const WB_K_LAST_SYNC='wb_last_sync_at';
let wbSync=null, wbPushTimer=null, wbPollTimer=null, wbLastSha=null, wbBusy=false;
const WB_SKIP=['wb_cloudsync','food_cloudsync','wb_last_sync_at']; /* 不同步令牌/时间戳本身，防外泄 */
function wbLoadCfg(){
  try{ wbSync=JSON.parse(localStorage.getItem(WB_K_SYNC))||null; }catch(e){ wbSync=null; }
  if(!wbSync) wbSync={};
  if(!wbSync.provider) wbSync.provider='github';
  if(!wbSync.github) wbSync.github={token:'',repo:'hlsbibisky/workbench',branch:'main',path:'data/workbench_sync.json'};
  if(wbSync.connected===undefined) wbSync.connected=false;
  return wbSync;
}
function wbSaveCfg(){ localStorage.setItem(WB_K_SYNC, JSON.stringify(wbSync)); }
function wbCollect(){ const o={}; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(WB_SKIP.indexOf(k)<0) o[k]=localStorage.getItem(k); } return o; }
function wbApply(o){
  if(!o) return;
  let changed = false;
  Object.keys(o).forEach(k=>{
    if(WB_SKIP.indexOf(k)<0){
      const cur = localStorage.getItem(k);
      if(cur !== o[k]){
        try{ localStorage.setItem(k,o[k]); changed=true; }
        catch(e){ console.error('wbApply failed for',k,e); }
      }
    }
  });
  if(changed) wbBroadcastReload();
}
function wbSchedulePush(immediate){
  wbLoadCfg(); if(!wbSync.connected) return;
  // 本地一发生改动就标记为「最新」，防止刷新/轮询时被较旧的云端版本覆盖
  try{ localStorage.setItem(WB_K_LAST_SYNC, new Date().toISOString()); }catch(e){}
  if(wbPushTimer) clearTimeout(wbPushTimer);
  wbPushTimer=setTimeout(wbPush, immediate?0:300);
}
function wbBroadcastReload(){ document.querySelectorAll('iframe').forEach(f=>{ try{ f.contentWindow.postMessage({type:'wb-reload'},'*'); }catch(e){} }); if(typeof updateStockBadge==='function'){ try{ updateStockBadge(); }catch(e){} } }
/* 统一【保存】按钮：把当前可见 iframe 里的编辑内容立即落盘（子页监听 wb-request-save 自行保存） */
function wbRequestSave(){
  const f=document.querySelector('.modbody iframe');
  if(!f || !f.contentWindow){ wbToast('当前页面没有可保存的内容'); return; }
  try{ f.contentWindow.postMessage({type:'wb-request-save'},'*'); }catch(e){}
  wbSchedulePush(true); // 立即把本地最新数据上传云端，不等防抖
  wbToast('已保存并同步到云端');
}
/* 子页保存成功后的回执 */
window.addEventListener('message', e=>{ if(e.data && e.data.type==='wb-saved'){ wbToast(e.data.msg||'已保存'); } });
function wbToast(m){ let t=document.getElementById('wbToast'); if(!t){ t=document.createElement('div'); t.id='wbToast'; t.style.cssText='position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#2c241b;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .3s'; document.body.appendChild(t); } t.textContent=m; t.style.opacity='1'; clearTimeout(t._tm); t._tm=setTimeout(()=>{ t.style.opacity='0'; },1800); }
async function wbPush(){
  if(!wbSync||!wbSync.connected||wbBusy) return; wbBusy=true;
  const now = new Date().toISOString();
  try{ const payload=JSON.stringify({updatedAt:now,data:wbCollect()});
    const enc=wbGhB64(payload); let sha=wbLastSha;
    if(!sha){ try{ const cur=await wbGhReq('GET'); sha=cur.sha; }catch(e){ sha=null; } }
    const res=await wbGhReq('PUT',{message:'workbench sync '+now,content:enc,sha:sha||undefined,branch:(wbSync.github.branch||'main').trim()});
    if(res && res.sha){ wbLastSha = res.sha; try{ localStorage.setItem(WB_K_LAST_SYNC, now); }catch(e){} }
    wbToast('已同步到云端');
  }catch(e){ console.error(e); wbToast('同步失败：'+(e&&e.message?e.message:e)); }
  finally{ wbBusy=false; }
}
// 解析 GitHub contents API 返回：小文件直接 decode content；超过 1MB 的文件 content 为空，需用 download_url 取完整内容
async function wbParseSync(cur){
  if(cur && cur.content) return wbGhUnB64(cur.content);
  if(cur && cur.download_url){
    const r = await fetch(cur.download_url);
    if(!r.ok) throw new Error('download '+r.status);
    return await r.text();
  }
  throw new Error('no content available');
}
async function wbPull(){
  if(!wbSync||!wbSync.connected||wbBusy) return; wbBusy=true;
  try{
    const cur=await wbGhReq('GET'); wbLastSha=cur.sha;
    const text=await wbParseSync(cur); const obj=JSON.parse(text);
    if(obj&&obj.data){
      const localAt = localStorage.getItem(WB_K_LAST_SYNC) || '1970-01-01T00:00:00.000Z';
      const cloudAt = obj.updatedAt || '1970-01-01T00:00:00.000Z';
      if(cloudAt > localAt){ wbApply(obj.data); try{ localStorage.setItem(WB_K_LAST_SYNC, cloudAt); }catch(e){} }
    }
  }
  catch(e){ console.error(e); }
  finally{ wbBusy=false; }
}
async function wbGhReq(method,body){
  const repo=(wbSync.github.repo||'').trim(), token=(wbSync.github.token||'').trim();
  if(!repo||!token) throw new Error('请先填写 GitHub 仓库与令牌');
  const url='https://api.github.com/repos/'+repo+'/contents/'+encodeURIComponent(wbSync.github.path.trim());
  const headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'};
  const res=await fetch(url,{method,headers,body:body?JSON.stringify(body):undefined});
  if(!res.ok){ const t=await res.text().catch(()=>''); throw new Error('GitHub '+res.status+' '+t.slice(0,140)); }
  return res.json();
}
function wbGhB64(s){ return btoa(unescape(encodeURIComponent(s))); }
function wbGhUnB64(s){ return decodeURIComponent(escape(atob(s.replace(/\s/g,'')))); }
function wbGhStartPoll(){
  if(wbPollTimer) clearInterval(wbPollTimer);
  wbPollTimer=setInterval(async()=>{
    if(!wbSync||!wbSync.connected||wbBusy) return;
    try{
      const cur=await wbGhReq('GET');
      if(cur.sha!==wbLastSha){
        wbLastSha=cur.sha;
        const text=await wbParseSync(cur); const obj=JSON.parse(text);
        if(obj&&obj.data){
          const localAt = localStorage.getItem(WB_K_LAST_SYNC) || '1970-01-01T00:00:00.000Z';
          const cloudAt = obj.updatedAt || '1970-01-01T00:00:00.000Z';
          if(cloudAt > localAt){ wbApply(obj.data); try{ localStorage.setItem(WB_K_LAST_SYNC, cloudAt); }catch(e){} }
        }
      }
    }
    catch(e){}
  },15000);
}
async function wbConnect(){
  wbLoadCfg();
  try{
    if(!wbSync.github.repo||!wbSync.github.token) throw new Error('请填写 GitHub 仓库与令牌');
    try{ await wbPull(); }catch(e){ /* 首次无文件可忽略 */ }
    wbGhStartPoll();
    wbSync.connected=true; wbSaveCfg(); wbToast('已连接，开始同步');
  }catch(e){ wbToast('连接失败：'+(e&&e.message?e.message:e)); }
}
function wbDisconnect(){
  wbSync.connected=false; wbSaveCfg();
  if(wbPollTimer){ clearInterval(wbPollTimer); wbPollTimer=null; }
  if(wbPushTimer){ clearTimeout(wbPushTimer); wbPushTimer=null; }
  wbToast('已断开云同步');
}
function wbOpenSync(){
  wbLoadCfg();
  const c=wbSync, g=c.github;
  let m=document.getElementById('wbSyncModal');
  if(!m){ m=document.createElement('div'); m.id='wbSyncModal'; m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:9998'; document.body.appendChild(m); }
  m.onclick=e=>{ if(e.target===m) m.style.display='none'; };
  m.style.display='flex';
  const conn=c.connected?'已连接 ✅（自动同步中）':'未连接';
  m.innerHTML='<div style="background:#faf7f1;max-width:460px;width:92%;border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)">'
    +'<h2 style="margin:0 0 6px;font-size:19px;color:#2c241b">☁ 工作台云同步</h2>'
    +'<p style="margin:0 0 14px;font-size:13px;color:#7a6f60;line-height:1.6">同步<b>全部页面</b>数据（美食记录 / 股票 / 驱动力 / 周计划…）到 GitHub，电脑与手机自动保持一致。</p>'
    +'<div style="margin-bottom:12px"><label style="display:block;font-size:12px;color:#7a6f60;margin-bottom:4px">GitHub 仓库（owner/repo）</label><input id="wbRepo" value="'+escAttr(g.repo)+'" style="width:100%;padding:8px;border:1px solid #ddd3c4;border-radius:8px;box-sizing:border-box"></div>'
    +'<div style="margin-bottom:12px"><label style="display:block;font-size:12px;color:#7a6f60;margin-bottom:4px">个人访问令牌 PAT（需 repo 权限，仅存本机）</label><input id="wbToken" type="password" value="'+escAttr(g.token)+'" placeholder="ghp_..." style="width:100%;padding:8px;border:1px solid #ddd3c4;border-radius:8px;box-sizing:border-box"></div>'
    +'<div style="margin-bottom:12px"><label style="display:block;font-size:12px;color:#7a6f60;margin-bottom:4px">分支</label><input id="wbBranch" value="'+escAttr(g.branch||'main')+'" style="width:100%;padding:8px;border:1px solid #ddd3c4;border-radius:8px;box-sizing:border-box"></div>'
    +'<div id="wbSyncStatus" style="margin:10px 0;font-size:13px;color:#b8714e">状态：'+conn+'</div>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap">'
    +'<button onclick="wbDoConnect()" style="background:#b8714e;color:#fff;border:0;padding:9px 16px;border-radius:9px;cursor:pointer">连接并同步</button>'
    +'<button onclick="wbPush();" style="background:#efe7da;color:#2c241b;border:0;padding:9px 16px;border-radius:9px;cursor:pointer">立即上传</button>'
    +'<button onclick="wbPull();" style="background:#efe7da;color:#2c241b;border:0;padding:9px 16px;border-radius:9px;cursor:pointer">拉取</button>'
    + (c.connected?'<button onclick="wbDisconnect()" style="background:#e8d9cf;color:#a23;border:0;padding:9px 16px;border-radius:9px;cursor:pointer">断开</button>':'')
    +'</div>'
    +'<div style="margin-top:12px;text-align:right"><button onclick="document.getElementById(\'wbSyncModal\').style.display=\'none\'" style="background:none;border:0;color:#7a6f60;cursor:pointer;font-size:13px">关闭</button></div>'
    +'</div>';
}
function wbDoConnect(){
  wbLoadCfg();
  wbSync.github.repo=document.getElementById('wbRepo').value.trim();
  wbSync.github.token=document.getElementById('wbToken').value.trim();
  wbSync.github.branch=document.getElementById('wbBranch').value.trim()||'main';
  wbSaveCfg();
  wbConnect();
}
function escAttr(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
/* 接收各 iframe 页面数据变更，触发上传 */
window.addEventListener('message', e=>{ if(e.data && e.data.type==='wb-data-changed'){ wbSchedulePush(); } });
/* 启动自恢复：若上次已连接，静默重连（拉数据 + 起轮询），不弹任何界面 */
async function wbSilentReconnect(){
  wbLoadCfg();
  const dot=document.getElementById('wbSyncDot');
  if(!wbSync.connected){ if(dot) dot.style.background='#c9bfae'; return; }
  if(!wbSync.github.repo||!wbSync.github.token){ wbSync.connected=false; wbSaveCfg(); if(dot) dot.style.background='#c9bfae'; return; }
  if(dot) dot.style.background='#3aa76d';
  try{ await wbPull(); }catch(e){ /* 首次无文件可忽略 */ }
  wbGhStartPoll();
}
wbSilentReconnect();
</script>
