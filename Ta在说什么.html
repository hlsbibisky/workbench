<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ta在说什么 · 工作台</title>
<style>
:root{
  --bg:#f7f4ee; --card:#fffdf9; --ink:#3a3631; --sub:#8a837a;
  --line:#ece5da; --accent:#b8714e; --accent2:#5b8c7b; --mark:#f0e3d6;
  --noted:#3f9d6b; --bad:#c0392b;
  --radius:14px;
  --shadow:0 1px 3px rgba(58,54,49,.06), 0 10px 30px rgba(58,54,49,.05);
  --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6;-webkit-font-smoothing:antialiased;}
::selection{background:var(--mark);}

.page{max-width:1000px;margin:0 auto;padding:16px 18px 30px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;}

.lab{font-size:12px;letter-spacing:.8px;color:var(--sub);margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.lab b{font-weight:700;color:var(--ink);font-size:13px;letter-spacing:0;}
.lnk{color:var(--sub);cursor:pointer;text-decoration:underline dotted;font-size:12px;}
.lnk:hover{color:var(--accent);}
.wpick{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;font-size:12.5px;cursor:pointer;margin:0 6px 0 0;color:var(--sub);transition:.15s;}
.wpick:hover{border-color:var(--accent);color:var(--accent);}
.wpick.on{background:var(--mark);border-color:var(--accent);color:#8d5233;font-weight:500;}
#whoPick{display:none;margin-top:10px;padding:9px 12px;border:1px solid #e8d3c1;background:#fdf8f2;border-radius:10px;}

textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-family:inherit;font-size:13.5px;line-height:1.8;padding:11px 12px;resize:vertical;outline:none;transition:.15s;display:block;}
textarea:focus{border-color:var(--accent);}
textarea::placeholder{color:#b8b0a5;}
.ta{height:auto;min-height:48vh;resize:vertical;font-size:14px;}
.ta-req{height:120px;font-size:12px;background:#fbf8f4;}

input[type=text],input[type=password],select{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-family:inherit;font-size:13px;padding:7px 10px;outline:none;transition:.15s;}
input:focus,select:focus{border-color:var(--accent);}
input::placeholder{color:#b8b0a5;}

.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.primary:hover{background:#a05f3d;color:#fff;}
.btn.big{padding:9px 22px;font-size:13.5px;}
.btn:disabled{opacity:.5;cursor:wait;}

.actrow{display:flex;align-items:center;gap:12px;margin-top:11px;flex-wrap:wrap;}
.state{font-size:12.5px;color:var(--sub);}
.state b{color:var(--noted);font-weight:500;}
.state i{font-style:normal;color:var(--bad);}

details.mini{position:relative;}
details.mini summary{list-style:none;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 13px;font-size:12.5px;color:var(--sub);user-select:none;}
details.mini summary::-webkit-details-marker{display:none;}
details.mini summary:hover{border-color:var(--accent);color:var(--accent);}
details.mini[open] summary{border-color:var(--accent);color:var(--accent);}
.drop{position:absolute;right:0;top:calc(100% + 8px);z-index:20;width:330px;max-width:84vw;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(58,54,49,.14);padding:12px;}
.hist-item{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12.5px;cursor:pointer;transition:.15s;background:#fff;}
.hist-item + .hist-item{margin-top:6px;}
.hist-item:hover{border-color:var(--accent);}
.hist-item .t{color:var(--sub);font-size:11px;}
.hist-item .s{color:var(--ink);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.apigrid{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px 10px;align-items:center;}
.apigrid label{font-size:12px;color:var(--sub);text-align:right;}
.apigrid input,.apigrid select{width:100%;}
.tip{grid-column:1 / -1;font-size:11.5px;color:var(--sub);line-height:1.7;margin-top:2px;}

.summary{background:#fbf5ee;border:1px solid #f0e3d6;border-radius:12px;padding:12px 14px;font-size:13.5px;color:#5b5348;line-height:1.8;}
.summary .k{display:inline-block;font-size:11.5px;letter-spacing:1px;color:var(--accent);border:1px solid #e8d3c1;border-radius:6px;padding:1px 7px;margin-right:9px;vertical-align:1px;background:#fffdf9;}

.thread{display:flex;flex-direction:column;gap:20px;}
.msg{display:flex;flex-direction:column;}
.msg.me{align-items:flex-end;}
.msg.them{align-items:flex-start;}
.whoLbl{font-size:12.5px;color:var(--sub);margin-bottom:6px;padding:0 3px;letter-spacing:.5px;}
.bubble{max-width:78%;border-radius:13px;padding:10px 15px;font-size:14.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word;}
.msg.them .bubble{background:#f2efe9;border:1px solid #eae4da;color:var(--ink);border-top-left-radius:4px;}
.msg.me .bubble{background:#f0dcd2;border:1px solid #e7cfc1;color:#5b3a26;border-top-right-radius:4px;}

.read{margin-top:9px;max-width:94%;border-left:3px solid #c98a63;background:#fdfaf6;border-radius:0 10px 10px 0;padding:11px 14px;}
.msg.me .read{border-left-color:#dcc9b6;align-self:flex-start;}
.row{display:flex;gap:10px;font-size:13.5px;line-height:2.05;color:#5b5148;}
.row + .row{margin-top:2px;}
.row .k{flex:0 0 86px;color:#a89c8f;}
.row .v{flex:1;min-width:0;word-break:break-word;}
.row.warn .v{color:#a3512c;}
.risk{display:inline-block;font-size:11px;border-radius:6px;padding:0 6px;margin-left:7px;vertical-align:1px;border:1px solid;white-space:nowrap;}
.risk.hi{color:#a32d2d;border-color:#eec3c3;background:#fcebeb;}
.risk.mid{color:#8a5a12;border-color:#efd9ae;background:#faeeda;}
.risk.lo{color:#3b6d11;border-color:#d6e3c0;background:#eaf3de;}

.outwrap{max-width:780px;margin:16px auto 6px;}
.empty{text-align:center;color:#b3aa9e;font-size:12.5px;padding:22px 16px 6px;line-height:2;}

.lowbar{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.lowbar .lt{font-size:12px;color:var(--sub);}
.lowbar .btn{padding:4px 10px;font-size:12px;border-radius:8px;}
.lowhint{font-size:11.5px;color:#a89c8f;line-height:1.6;}
.boxpanel{border:1px solid #e8d3c1;background:#fbf8f4;border-radius:10px;padding:10px;margin-top:10px;}
.boxpanel .lab{margin:0 0 6px;}

@media (max-width:880px){
  .page{padding:12px;}
  .bubble,.read{max-width:100%;}
  .row .k{flex:0 0 66px;}
  .drop{position:fixed;left:12px;right:12px;top:auto;width:auto;}
}
</style>
</head>
<body>

<div class="page">

  <div class="card">
    <div class="lab"><b>聊天记录</b><span><span id="cntIn">0 字</span> · <span class="lnk" id="btnFlip">对调自己/对方</span> · <span class="lnk" id="btnClear">清空</span></span></div>
    <textarea class="ta" id="chat" placeholder="从微信里复制聊天记录，整段粘贴到这里——昵称、日期时间会自动去掉，换成「自己 / 对方」。&#10;&#10;也支持手动写：&#10;自己：周六要不要一起吃饭？&#10;对方：这周有点忙"></textarea>
    <div id="whoPick"></div>

    <div class="actrow">
      <button class="btn primary big" id="btnGo">开始解读</button>
      <span class="state" id="state">填好接口密钥，结果直接出在下面</span>
      <span style="flex:1;"></span>
      <details class="mini">
        <summary>历史 <span id="cntHist">0</span></summary>
        <div class="drop"><div id="hist"></div></div>
      </details>
      <details class="mini" id="apiBox">
        <summary>接口设置</summary>
        <div class="drop">
          <div class="apigrid">
            <label>服务商</label>
            <select id="prov">
              <option value="deepseek">DeepSeek</option>
              <option value="zhipu">智谱（glm-4-flash 免费）</option>
              <option value="moonshot">Kimi</option>
              <option value="dashscope">通义</option>
              <option value="custom">自定义</option>
            </select>
            <label>接口地址</label>
            <input type="text" id="baseURL" placeholder="https://...">
            <label>密钥</label>
            <input type="password" id="apiKey" placeholder="sk-...">
            <label>模型</label>
            <input type="text" id="model" placeholder="deepseek-v4-flash">
            <div class="tip">密钥只存在你这台电脑的浏览器里。还没有？DeepSeek：platform.deepseek.com 注册→充值→建密钥，约 5 分钟，10 块钱能用很久；智谱的 glm-4-flash 免费。聊天内容会发给模型服务商，介意的用下面「复制给 WorkBuddy」。</div>
          </div>
        </div>
      </details>
    </div>
  </div>

  <div class="outwrap">
    <div id="out"><div class="empty">解读结果会出在这里</div></div>
  </div>

  <div class="lowbar">
    <span class="lt">没有密钥，或想让我亲自读？</span>
    <button class="btn" id="btnCopy">复制给 WorkBuddy</button>
    <button class="btn" id="btnPaste">粘回解读</button>
    <span class="lowhint">复制后到对话里发出去，名字会自动换成「自己 / 对方」。</span>
  </div>
  <div class="boxpanel" id="pasteBox" style="display:none;">
    <div class="lab"><b>把 WorkBuddy 给的解读整段粘进来</b><span>带不带代码块都行</span></div>
    <textarea class="ta-req" id="back" placeholder="【整体】&#10;……&#10;&#10;【1】对方|原话&#10;字面：……"></textarea>
    <div style="margin-top:8px;"><button class="btn primary" id="btnRender">存档并渲染</button></div>
  </div>

</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var K = { hist:'ywHist', key:'ywApiKey', prov:'ywApiProv', base:'ywApiBase', model:'ywApiModel', chat:'ywChat', back:'ywBack' };

  function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
  function esc(s){
    return String(s==null?'':s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }
  function pad(n){ return (n<10?'0':'')+n; }

  var PRESETS = {
    deepseek: { base:'https://api.deepseek.com', model:'deepseek-v4-flash' },
    zhipu:    { base:'https://open.bigmodel.cn/api/paas/v4', model:'glm-4-flash' },
    moonshot: { base:'https://api.moonshot.cn/v1', model:'moonshot-v1-8k' },
    dashscope:{ base:'https://dashscope.aliyuncs.com/compatible-mode/v1', model:'qwen-plus' },
    custom:   { base:'', model:'' }
  };

  var SYS_PROMPT = [
    '你是一个对话潜台词翻译器。用户给你一段聊天记录，每行用「自己：」或「对方：」标注说话人。',
    '逐句解读，严格遵守：',
    '1. 绝不打分、绝不做好感度评级，只做潜台词翻译。',
    '2. 对「对方」的每句话输出这些字段：字面 / 真意 / 别读成（对方这句话最容易被误会成的意思）/ 风险（只填 高、中、低）/ 可以接（一句能接住这句话的回复）。',
    '3. 对「自己」的每句话只输出两个字段：传达到的 / 对方收到的是。',
    '4. 最开头给一段【整体】，一两句说清这段对话的氛围和走向。',
    '5. 每一句都要处理，包括自己说的那句；按对话顺序编号。',
    '6. 看上下文判断，不要只看单句；拿不准就写「更可能是」，不要编造。',
    '7. 只输出下面的格式，不要任何解释、不要 markdown 符号：',
    '',
    '【整体】',
    '……',
    '',
    '【1】对方|原话',
    '字面：……',
    '真意：……',
    '别读成：……',
    '风险：高',
    '可以接：……',
    '',
    '【2】自己|原话',
    '传达到的：……',
    '对方收到的是：……'
  ].join('\n');

  /* ---------- 对话解析 ---------- */
  /* 微信复制出来的真实格式是三行：昵称一行 / 日期时间一行 / 内容一行 */
  var HEAD_RE = /^(.{1,24}?)[\s\u00a0]+(\d{4}[-\/年]\d{1,2}[-\/月]\d{1,2}日?)([\s\u00a0]+\d{1,2}:\d{2}(?::\d{2})?)?\s*$/;
  var TIMERE = /^(.{1,24}?)[\s\u00a0]+(\d{1,2}:\d{2}(?::\d{2})?)\s*$/;
  var ONLYTIME_RE = /^\d{1,2}:\d{2}(?::\d{2})?$/;
  var DATE_RE = /^(\d{4}年\d{1,2}月\d{1,2}日|\d{4}[-\/年]\d{1,2}[-\/月]\d{1,2}日?|昨天|今天|前天)(\s*[\u00a0\s]+\d{1,2}:\d{2}(?::\d{2})?)?$/;
  var PUNC_RE = /[，。！？,.!?、；;：:（）()"'「」【】]/;

  function isNameLine(t, lines, i){
    if(!t || t.length > 20) return false;
    if(DATE_RE.test(t) || ONLYTIME_RE.test(t)) return false;
    if(PUNC_RE.test(t)) return false;
    if(/\s/.test(t)) return false;
    var nx = lines[i+1] ? String(lines[i+1]).trim() : '';
    if(!nx) return false;
    return DATE_RE.test(nx) || ONLYTIME_RE.test(nx);
  }

  function isMeName(n){ n = String(n||'').trim(); return n==='我'||n==='自己'||n==='本人'||n==='me'||n==='Me'||n==='ME'; }
  function isThemName(n){ n = String(n||'').trim(); return n==='对方'||n==='他'||n==='她'||n==='ta'||n==='TA'||n==='Ta'; }

  var meName = '';
  try{ meName = localStorage.getItem('ywMeName') || ''; }catch(e){}

  function roleOfName(nm, nameMap, unknown){
    if(isMeName(nm)) return 'me';
    if(isThemName(nm)) return 'them';
    if(meName && nm === meName) return 'me';
    if(nameMap[nm]) return nameMap[nm];
    if(unknown.indexOf(nm) < 0) unknown.push(nm);
    var r = meName ? 'them' : (unknown.length === 2 ? 'me' : 'them');
    nameMap[nm] = r;
    return r;
  }

  function parseChat(raw){
    var lines = String(raw||'').replace(/\r/g,'').split('\n');
    var msgs = [], cur = null, curRole = null, roleKnown = false;
    var nameMap = {}, unknown = [], pendingName = '';
    function push(role, text){
      if(!cur || cur.role !== role){
        cur = { role: role, text: text, locked: !!roleKnown };
        msgs.push(cur);
        curRole = role;
      } else {
        cur.text += (cur.text ? '\n' : '') + text;
        if(roleKnown) cur.locked = true;
      }
    }
    for(var i=0;i<lines.length;i++){
      var t = lines[i].trim();
      if(!t){ continue; }

      /* ③ 纯日期 / 时间行 —— 必须放最前，否则「2026年09月21日 18:06」会被误当成「昵称+时间」 */
      if(DATE_RE.test(t) || ONLYTIME_RE.test(t)){ continue; }

      /* ① 昵称 + 日期时间 写在同一行 */
      var hm = HEAD_RE.exec(t) || TIMERE.exec(t);
      if(hm && !DATE_RE.test(hm[1].trim())){
        curRole = roleOfName(hm[1].trim(), nameMap, unknown);
        roleKnown = true;
        cur = null; pendingName = '';
        continue;
      }

      /* ② 昵称单独一行（下一行是日期/时间）——昵称绝不进内容 */
      if(isNameLine(t, lines, i)){
        var nm = t;
        var r0 = roleOfName(nm, nameMap, unknown);
        /* 「内容在前、昵称在后」的复制格式：把刚收到、还没归属的那条收回给这个昵称 */
        if(cur && !cur.locked){ cur.role = r0; cur.locked = true; }
        pendingName = nm;
        curRole = r0;
        roleKnown = true;
        cur = null;
        continue;
      }

      /* ④ "我：" / "对方：" 这类前缀 */
      var pm = /^([^\s:：]{1,12})\s*[:：]\s*([\s\S]*)$/.exec(t);
      if(pm){
        var role = isMeName(pm[1]) ? 'me'
                 : (isThemName(pm[1]) ? 'them'
                 : (meName && pm[1].trim() === meName ? 'me' : null));
        if(role){
          curRole = role; roleKnown = true;
          if(pm[2].trim()===''){ cur = null; continue; }
          push(role, pm[2].trim());
          continue;
        }
      }

      push(curRole || 'them', t);
    }
    /* 兜底：哪怕漏网，也绝不允许昵称出现在聊天内容里 */
    var allNames = {};
    for(var k in nameMap) allNames[k] = 1;
    if(pendingName) allNames[pendingName] = 1;
    lastUnknown = unknown;
    msgs.forEach(function(m){
      m.text = m.text.split('\n').filter(function(ln){
        var x = ln.trim();
        if(!x) return false;
        return !(x.length <= 20 && allNames[x]);
      }).join('\n');
    });
    return msgs.filter(function(m){ return m.text.trim() !== ''; });
  }

  function toNormalized(msgs){
    return msgs.map(function(m){
      return (m.role==='me'?'自己':'对方') + '：' + m.text.replace(/\s*\n\s*/g,' ');
    }).join('\n');
  }

  var lastMsgs = null, lastChat = null, lastUnknown = [];
  function getMsgs(){
    var raw = $('chat').value;
    if(lastMsgs && lastChat === raw) return lastMsgs;
    lastMsgs = parseChat(raw);
    lastChat = raw;
    renderWhoPick(lastUnknown, !!raw.trim());
    return lastMsgs;
  }

  function renderWhoPick(names, hasChat){
    var box = $('whoPick');
    if(!box) return;
    box.style.display = 'block';
    if(!hasChat){
      box.innerHTML = '<span style="font-size:12.5px;color:#a89c8f;">粘上聊天记录后，这里会列出认出的人，让你点一下哪个是你。</span>';
      return;
    }
    if(!names || names.length === 0){
      box.innerHTML = '<span style="font-size:12.5px;color:#a89c8f;">这段里没认出昵称（如果是用「自己：/对方：」写的，直接解读就行）。</span>';
      return;
    }
    var h = '<span style="font-size:13px;color:#8d5233;">这一步很重要：点一下哪个是你（点一次就记住，以后自动认）</span><div style="margin-top:7px;">';
    names.forEach(function(n){
      var isMe = (meName === n) || (!meName && names.length > 1 && names.indexOf(n) === 1);
      h += '<span class="wpick'+(isMe?' on':'')+'" data-n="'+esc(n)+'">'+esc(n)+(isMe?' · 你':'')+'</span>';
    });
    h += '</div>';
    if(!meName) h += '<div style="font-size:11.5px;color:#a89c8f;margin-top:7px;">没点之前，默认第一个算对方。点错了不要紧，再点另一个就行。</div>';
    box.innerHTML = h;
    Array.prototype.forEach.call(box.querySelectorAll('.wpick'), function(el){
      el.onclick = function(){
        meName = el.getAttribute('data-n');
        try{ localStorage.setItem('ywMeName', meName); }catch(e){}
        lastMsgs = null; lastChat = null;
        getMsgs();
        flash('好了，「' + meName + '」是你，另一个算对方', 'ok');
      };
    });
  }
  function renderPreview(msgs){
    var h = '<div class="summary"><span class="k">确认</span>角色认对了吗？反了就点上面的「对调自己/对方」，没问题就点「开始解读」。</div><div class="thread" style="margin-top:16px;">';
    msgs.forEach(function(m){
      h += '<div class="msg '+(m.role==='me'?'me':'them')+'">';
      h += '<div class="whoLbl">'+(m.role==='me'?'自己':'对方')+'</div>';
      h += '<div class="bubble">'+esc(m.text)+'</div>';
      h += '</div>';
    });
    $('out').innerHTML = h + '</div>';
  }

  /* ---------- 解读结果解析 ---------- */
  function cleanLine(s){
    return String(s||'')
      .replace(/^\s*[-*·]\s+/,'')
      .replace(/\*\*/g,'')
      .replace(/__/g,'')
      .replace(/`/g,'')
      .replace(/^#+\s*/,'')
      .replace(/^>\s*/,'')
      .trim();
  }

  function parseAnalysis(raw){
    var text = String(raw||'').replace(/\r/g,'');
    text = text.replace(/^\s*```[^\n]*$/gm,'');
    var lines = text.split('\n');
    var summary = '', items = [], curItem = null, inSum = false;
    var headRe = /^(?:[【\[［]\s*(\d{1,3})\s*[】\]］]|(\d{1,3})\s*[.、．)）]\s*)\s*(.+)$/;
    var secRe  = /^(?:[【\[［]\s*)?(整体|总览|氛围|总结|概述)(?:\s*[】\]］])?\s*[:：]?\s*(.*)$/;
    var kvRe   = /^([^：:]{1,12})[：:]\s*([\s\S]*)$/;

    for(var i=0;i<lines.length;i++){
      var lt = cleanLine(lines[i]);
      if(!lt){ continue; }
      var hm = headRe.exec(lt);
      if(hm){
        var body = hm[3] || '';
        var isField = /^(字面|真意|别读成|误读|风险|可以接|可以回|传达到的|建议|收到的是)/.test(body);
        if(!isField){
          var role = 'them', quote = body;
          var sp = body.split(/[|｜丨]/);
          if(sp.length>1 && sp[0].trim().length<=10){
            role = isMeName(sp[0].trim()) ? 'me' : 'them';
            quote = sp.slice(1).join('｜').trim();
          } else if(/我|自己/.test(body)) {
            role = 'me';
          }
          curItem = { me: role==='me', quote: quote, fields: [], reply: '' };
          items.push(curItem);
          inSum = false;
          continue;
        }
      }
      var sm = secRe.exec(lt);
      if(sm){
        inSum = true;
        curItem = null;
        if(sm[2]) summary += (summary? '\n':'') + sm[2];
        continue;
      }
      var km = kvRe.exec(lt);
      if(km && km[1].trim().length<=10){
        var k = km[1].trim(), v = (km[2]||'').trim();
        if(curItem){
          if(/^(可以接|可以回|建议回|怎么接|可以这样接)$/.test(k)){ curItem.reply = v; }
          else curItem.fields.push({ k:k, v:v });
        }
        else if(inSum){ if(v) summary += (summary? ' ':'') + v; }
        continue;
      }
      if(inSum){ summary += (summary? ' ':'') + lt; }
    }
    return { summary: summary, items: items };
  }

  /* ---------- 渲染 ---------- */
  var EMPTY = '';

  function riskBadge(v){
    var t = String(v||'').trim();
    var cls = /高/.test(t) ? 'hi' : (/低/.test(t) ? 'lo' : 'mid');
    if(!t) t = '—';
    return esc(t) + '<span class="risk '+cls+'">误读风险</span>';
  }

  function renderOut(data){
    var out = $('out');
    var items = (data && data.items) ? data.items : [];
    var summary = (data && data.summary) ? data.summary : '';
    if(!items.length && !summary){ out.innerHTML = EMPTY; return; }

    /* 「可以接」是"我下一句该怎么说"——从对方条目挪到我自己这一侧 */
    var pendingReply = '';
    items.forEach(function(it){
      if(it.me){
        if(pendingReply){ it._reply = pendingReply; pendingReply = ''; }
      } else if(it.reply){
        pendingReply = pendingReply ? (pendingReply + '　/　' + it.reply) : it.reply;
      }
    });
    var tailReply = pendingReply;

    var h = '';
    if(summary){
      h += '<div class="summary"><span class="k">整体</span>'+esc(summary)+'</div>';
    }
    if(items.length){
      h += '<div class="thread" style="margin-top:16px;">';
      items.forEach(function(it){
        h += '<div class="msg '+(it.me?'me':'them')+'">';
        h += '<div class="whoLbl">'+(it.me?'自己':'对方')+'</div>';
        h += '<div class="bubble">'+esc(it.quote || '（未写原话）')+'</div>';
        var rows = '';
        (it.fields || []).forEach(function(f){
          var isWarn = /别读成|误读|风险|陷阱|收到的是/.test(f.k);
          var v = /风险/.test(f.k) ? riskBadge(f.v) : esc(f.v);
          rows += '<div class="row'+(isWarn?' warn':'')+'"><span class="k">'+esc(f.k)+'</span><span class="v">'+v+'</span></div>';
        });
        if(it._reply){
          rows += '<div class="row"><span class="k" style="color:#8d5233;">可以接</span><span class="v" style="color:#8d5233;font-weight:500;">'+esc(it._reply)+'</span></div>';
        }
        if(rows){ h += '<div class="read">'+rows+'</div>'; }
        h += '</div>';
      });
      if(tailReply){
        h += '<div class="msg me">';
        h += '<div class="whoLbl">下一句可以这样接</div>';
        h += '<div class="read" style="align-self:flex-end;border-left:0;border-right:3px solid #c98a63;border-radius:10px 0 0 10px;">';
        h += '<div class="row"><span class="k" style="color:#8d5233;">可以接</span><span class="v" style="color:#8d5233;font-weight:500;">'+esc(tailReply)+'</span></div>';
        h += '</div></div>';
      }
      h += '</div>';
    }
    out.innerHTML = h;
  }

  /* ---------- API ---------- */
  function currentCfg(){
    return {
      key: $('apiKey').value.trim(),
      base: $('baseURL').value.trim().replace(/\/+$/,''),
      model: $('model').value.trim()
    };
  }
  function callApi(norm){
    var c = currentCfg();
    if(!c.key){ return Promise.reject('先点右上「接口设置」，把密钥填上'); }
    if(!c.base){ return Promise.reject('接口地址不能为空'); }
    if(!c.model){ return Promise.reject('模型名不能为空'); }
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 90000) : null;
    return fetch(c.base + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.key },
      body: JSON.stringify({
        model: c.model,
        temperature: 0.5,
        messages: [
          { role: 'system', content: SYS_PROMPT },
          { role: 'user', content: norm }
        ]
      }),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function(r){
      if(timer) clearTimeout(timer);
      return r.json().catch(function(){ return {}; }).then(function(j){
        if(!r.ok){
          var m = (j && j.error && j.error.message) ? j.error.message : ('HTTP ' + r.status);
          if(r.status === 401) m = '密钥不对（401）——去服务商那里检查一下密钥';
          else if(r.status === 402) m = '余额不足（402）——去服务商那里充一点';
          else if(r.status === 429) m = '请求太频繁（429），等一会儿再试';
          else if(r.status === 404) m = '接口地址或模型名不对（404）——检查接口设置';
          throw m;
        }
        var txt = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
        if(!txt) throw '模型回了空内容，再试一次';
        return txt;
      });
    }).catch(function(e){
      if(timer) clearTimeout(timer);
      if(e && e.name === 'AbortError') throw '等太久放弃了（90 秒），再试一次';
      if(String(e).indexOf('Failed to fetch') >= 0) throw '连不上这个接口地址——检查网络，或换个服务商试试';
      throw e;
    });
  }

  /* ---------- 历史 ---------- */
  function loadHist(){
    try{ var v = JSON.parse(lsGet(K.hist,'[]')); return Array.isArray(v)?v:[]; }catch(e){ return []; }
  }
  function saveHist(rec){
    var list = loadHist();
    list.unshift(rec);
    if(list.length>60) list = list.slice(0,60);
    lsSet(K.hist, JSON.stringify(list));
    renderHist();
  }
  function firstLine(s){
    var ls = String(s||'').split('\n');
    for(var i=0;i<ls.length;i++){ var t = ls[i].trim(); if(t) return t; }
    return '';
  }
  function renderHist(){
    var list = loadHist(), box = $('hist');
    $('cntHist').textContent = list.length;
    if(!list.length){ box.innerHTML = '<p class="lowhint" style="margin:2px;">还没有记录。</p>'; return; }
    box.innerHTML = list.map(function(r,i){
      var d = new Date(r.t||Date.now());
      var ts = (d.getMonth()+1) + '-' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      return '<div class="hist-item" data-i="'+i+'">' +
             '<div class="t">'+ts+'</div>' +
             '<div class="s">'+esc(firstLine(r.raw) || '（无内容）')+'</div></div>';
    }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('.hist-item'), function(el){
      el.onclick = function(){
        var r = list[+el.dataset.i];
        if(!r) return;
        var data = parseAnalysis(r.raw||'');
        renderOut(data);
        var d2 = new Date(r.t||Date.now());
        flash('已载入 · ' + (d2.getMonth()+1) + '月' + d2.getDate() + '日 ' + pad(d2.getHours()) + ':' + pad(d2.getMinutes()));
      };
    });
  }

  function syncCnt(){ $('cntIn').textContent = $('chat').value.length + ' 字'; }
  function flash(msg, kind){
    var el = $('state');
    el.innerHTML = kind==='bad' ? '<i>'+esc(msg)+'</i>' : (kind==='ok' ? '<b>'+esc(msg)+'</b>' : esc(msg));
  }
  /* 任何未预料到的错误都要显示出来，绝不出现「点了没反应」 */
  window.addEventListener('error', function(e){
    try{ flash('出错了：' + ((e && e.message) ? e.message : '未知错误'), 'bad'); }catch(x){}
  });

  /* ---------- 事件 ---------- */
  var parseTimer = null;
  $('chat').addEventListener('input', function(){
    lsSet(K.chat, $('chat').value);
    syncCnt();
    if(parseTimer) clearTimeout(parseTimer);
    parseTimer = setTimeout(function(){ try{ getMsgs(); }catch(e){} }, 400);
  });
  $('back').addEventListener('input', function(){ lsSet(K.back, $('back').value); });
  $('apiKey').addEventListener('input', function(){ lsSet(K.key, $('apiKey').value); });
  $('baseURL').addEventListener('input', function(){ lsSet(K.base, $('baseURL').value); });
  $('model').addEventListener('input', function(){ lsSet(K.model, $('model').value); });
  $('prov').addEventListener('change', function(){
    lsSet(K.prov, $('prov').value);
    var p = PRESETS[$('prov').value] || PRESETS.deepseek;
    if(p.base){ $('baseURL').value = p.base; $('model').value = p.model; lsSet(K.base,p.base); lsSet(K.model,p.model); }
  });

  $('btnClear').onclick = function(){
    $('chat').value = '';
    lastMsgs = null; lastChat = null;
    lsDel(K.chat);
    renderOut(null);
    syncCnt();
    flash('已清空');
  };

  $('btnFlip').onclick = function(){
    var raw = $('chat').value.trim();
    if(!raw){ flash('先把聊天记录粘进来', 'bad'); return; }
    var m = getMsgs();
    m.forEach(function(x){ x.role = x.role==='me' ? 'them' : 'me'; });
    renderPreview(m);
    flash('已对调。没问题就点「开始解读」');
  };

  function doRender(raw, chatNorm){
    var data = parseAnalysis(raw);
    if(!data.items.length && !data.summary){
      flash('这次回复里没读到解读格式，再试一次', 'bad');
      return false;
    }
    renderOut(data);
    lsSet(K.back, raw);
    var d = new Date();
    flash('解读完成 · ' + (d.getMonth()+1) + '月' + d.getDate() + '日 ' + pad(d.getHours()) + ':' + pad(d.getMinutes()), 'ok');
    saveHist({ t: Date.now(), raw: raw, chat: chatNorm||'' });
    return true;
  }

  $('btnGo').onclick = function(){
    var rawChat = $('chat').value.trim();
    if(!rawChat){ flash('先把聊天记录粘进来', 'bad'); return; }
    var msgs = getMsgs();
    if(!msgs.length){ flash('没读出内容，检查一下格式', 'bad'); return; }
    var norm = toNormalized(msgs);
    var btn = $('btnGo');
    btn.disabled = true;
    flash('解读中，通常几秒到十几秒…');
    callApi(norm).then(function(txt){
      btn.disabled = false;
      doRender(txt, norm);
    }).catch(function(e){
      btn.disabled = false;
      flash(String(e && e.message ? e.message : e), 'bad');
    });
  };

  function copyText(text){
    return new Promise(function(res){
      function ok(){ res(true); }
      function no(){ res(false); }
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(text).then(ok, no);
          return;
        }
      }catch(e){}
      try{
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        var r = document.execCommand('copy');
        document.body.removeChild(ta);
        if(r) ok(); else no();
      }catch(e){ no(); }
    });
  }

  $('btnCopy').onclick = function(){
    var rawChat = $('chat').value.trim();
    if(!rawChat){ flash('先把聊天记录粘到上面那个大框里', 'bad'); $('chat').focus(); return; }
    var norm = toNormalized(getMsgs());
    var txt = '用「Ta在说什么」解读这段聊天记录。\n\n' + norm;
    copyText(txt).then(function(ok){
      if(ok){
        flash('已复制（名字已换成 自己/对方）· 去对话里粘贴发出去', 'ok');
      } else {
        $('pasteBox').style.display = 'block';
        $('back').value = txt;
        $('back').focus(); $('back').select();
        flash('自动复制没成功——上面这段已归一化，按 Ctrl+C 复制', 'bad');
      }
    });
  };

  $('btnPaste').onclick = function(){
    var p = $('pasteBox');
    p.style.display = (p.style.display==='none' || !p.style.display) ? 'block' : 'none';
    if(p.style.display==='block'){ $('back').value = lsGet(K.back,''); $('back').focus(); }
  };

  $('btnRender').onclick = function(){
    var raw = $('back').value.trim();
    if(!raw){ flash('里面还是空的', 'bad'); return; }
    doRender(raw, '');
  };

  /* ---------- 初始化 ---------- */
  (function init(){
    $('chat').value = lsGet(K.chat,'');
    $('prov').value = lsGet(K.prov,'deepseek');
    var p = PRESETS[$('prov').value] || PRESETS.deepseek;
    $('baseURL').value = lsGet(K.base, p.base);
    $('model').value = lsGet(K.model, p.model);
    $('apiKey').value = lsGet(K.key,'');
    syncCnt();
    renderHist();
    renderWhoPick(null, !!$('chat').value.trim());
    var savedBack = lsGet(K.back,'');
    if(savedBack.trim()){
      var d = parseAnalysis(savedBack);
      if(d.items.length){ renderOut(d); flash('已恢复上次的解读'); }
    }
    if(!$('apiKey').value){ flash('填好接口密钥，结果直接出在下面'); }
  })();

})();
</script>
</body>
