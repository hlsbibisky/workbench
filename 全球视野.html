<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球视野</title>
<style>
  :root{
    --bg:#f7f4ee; --card:#fffdf9; --ink:#3a3631; --sub:#8a837a;
    --line:#ece5da; --accent:#b8714e; --accent2:#5b8c7b;
    --up:#c0392b; --down:#2e9e5b; --amber:#e0a52e;
    --lowBg:#e8f5e9; --midBg:#fff8e1; --highBg:#fce4ec;
    --shadow:0 2px 12px rgba(184,113,78,.08);
    --mark:rgba(184,113,78,.06);
    --gold:#c9a227; --goldBg:#fdf6e3;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    line-height:1.6;padding:18px 14px 70px;min-height:100vh;}
  .wrap{max-width:1180px;margin:0 auto;}

  /* 顶栏 */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;
    flex-wrap:wrap;gap:12px;padding-bottom:14px;border-bottom:2px solid var(--line);}
  .topbar-left h1{font-size:24px;font-weight:700;color:var(--accent);letter-spacing:1px;}
  .topbar-left .sub{font-size:12.5px;color:var(--sub);margin-top:4px;}
  .topbar-right{display:flex;gap:8px;align-items:center;}
  .btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px;padding:7px 15px;cursor:pointer;font-size:13.5px;font-weight:600;
    font-family:inherit;transition:.15s;display:flex;align-items:center;gap:5px;}
  .btn:hover{border-color:var(--accent);color:var(--accent);box-shadow:var(--shadow);}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  /* 模块 */
  .mod{background:var(--card);border:1.5px solid var(--line);border-radius:16px;
    margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden;}
  .mod-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 18px;border-bottom:1.5px solid var(--line);cursor:pointer;
    background:linear-gradient(180deg,#faf7f2,var(--card));flex-wrap:wrap;}
  .mod-hd:hover{background:var(--mark);}
  .mod-hd .tt{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;color:var(--ink);}
  .mod-hd .tt .ico{font-size:17px;}
  .mod-hd .tt .tag{font-size:11px;font-weight:600;color:var(--sub);background:var(--bg);
    border:1px solid var(--line);border-radius:6px;padding:1px 7px;letter-spacing:.3px;}
  .mod-hd .rr{display:flex;align-items:center;gap:8px;}
  .mod-hd .caret{font-size:12px;color:var(--sub);transition:transform .2s;}
  .mod.fold .caret{transform:rotate(-90deg);}
  .mod.fold .mod-bd{display:none;}
  .mod-bd{padding:16px 18px 18px;}
  .mod-note{font-size:12px;color:var(--sub);line-height:1.7;background:var(--bg);
    border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin-bottom:12px;}

  /* 子卡 */
  .subgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;}
  .subcard{border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;background:var(--card);}
  .subcard h4{font-size:13.5px;color:var(--accent);margin-bottom:9px;font-weight:700;
    display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .subcard h4 .more{font-size:11.5px;color:var(--sub);cursor:pointer;font-weight:600;
    border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--bg);}
  .subcard h4 .more:hover{color:var(--accent);border-color:var(--accent);}

  /* 数值行 */
  .kv{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--sub);font-size:12.5px;}
  .kv .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .kv .v .sm{font-size:11.5px;font-weight:600;margin-left:6px;}

  /* 涨跌色（A股习惯：涨红跌绿） */
  .up{color:var(--up);} .down{color:var(--down);} .flat{color:var(--sub);}
  .pill{display:inline-block;padding:1px 7px;border-radius:6px;font-size:12px;font-weight:700;
    font-variant-numeric:tabular-nums;}
  .pill.up{background:#fdeceb;color:var(--up);}
  .pill.down{background:#e9f6ee;color:var(--down);}
  .pill.flat{background:#f0eee9;color:var(--sub);}

  /* 黄金 */
  .goldtop{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px;margin-bottom:12px;}
  .gcell{border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:linear-gradient(180deg,var(--goldBg),var(--card));}
  .gcell .gl{font-size:11.5px;color:var(--sub);font-weight:600;}
  .gcell .gn{font-size:22px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;line-height:1.2;}
  .gcell .gp{font-size:12.5px;font-weight:700;margin-top:3px;}
  .mood{border:1.5px solid #ecd9b0;background:linear-gradient(90deg,var(--goldBg),var(--card));
    border-radius:11px;padding:11px 13px;margin-bottom:12px;display:flex;gap:10px;align-items:center;}
  .mood .mi{font-size:20px;}
  .mood .mt{font-size:14.5px;font-weight:700;color:var(--ink);}
  .mood .ms{font-size:12px;color:var(--sub);margin-top:2px;}
  .news{display:flex;flex-direction:column;gap:7px;max-height:290px;overflow-y:auto;}
  .ni{border-left:3px solid var(--gold);padding:6px 0 6px 10px;font-size:12.8px;line-height:1.65;}
  .ni .nt{color:var(--sub);font-size:11px;font-weight:600;margin-bottom:1px;}
  .ni .nx{color:var(--ink);}

  /* 全球 */
  .ggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px;}
  .gitem{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);}
  .gitem .gn2{font-size:12px;color:var(--sub);font-weight:600;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .gitem .gv2{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:1px;}
  .gitem .gp2{font-size:11.5px;font-weight:700;}
  .gsplit{font-size:11.5px;color:var(--sub);margin-bottom:8px;font-weight:700;color:var(--accent);
    border-left:3px solid var(--accent);padding-left:7px;}

  .foot{margin-top:16px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;
    padding:16px 18px;font-size:12.5px;color:var(--sub);line-height:1.8;}
  .foot h4{color:var(--accent);font-size:14px;margin-bottom:7px;}

  .loading{text-align:center;padding:26px;color:var(--sub);font-size:13.5px;}
  .empty{text-align:center;padding:20px;color:var(--sub);font-size:13px;}

  @media(max-width:820px){
    body{padding:12px 9px 50px;}
    .topbar-left h1{font-size:20px;}
    .mod-hd{padding:11px 13px;} .mod-bd{padding:12px 13px 14px;}
    .gcell .gn{font-size:19px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="topbar-left">
      <h1>全球视野</h1>
      <div class="sub" id="updateTime">数据加载中…</div>
    </div>
    <div class="topbar-right">
      <button class="btn" onclick="doRefresh()" id="refreshBtn">🔄 刷新全部</button>
    </div>
  </div>

  <!-- 黄金 -->
  <div class="mod" id="mod-gold">
    <div class="mod-hd" onclick="toggleMod('mod-gold')">
      <div class="tt"><span class="ico">🥇</span>黄金<span class="tag" id="goldTag">金价 · ETF · 情绪 · 影响因素</span></div>
      <div class="rr"><span class="caret">▼</span></div>
    </div>
    <div class="mod-bd"><div id="goldBody"><div class="loading">加载中…</div></div></div>
  </div>

  <!-- 全球 -->
  <div class="mod" id="mod-global">
    <div class="mod-hd" onclick="toggleMod('mod-global')">
      <div class="tt"><span class="ico">🌍</span>全球市场<span class="tag">股指 · 大宗 · 外汇 · 加密</span></div>
      <div class="rr"><span class="caret">▼</span></div>
    </div>
    <div class="mod-bd"><div id="globalBody"><div class="loading">加载中…</div></div></div>
  </div>

  <div class="foot">
    <h4>📌 说明</h4>
    <p><strong>黄金：</strong>国际金价（COMEX / 伦敦金现货）、国内沪金、黄金 ETF、美元指数来自东方财富；伦敦金现货、原油价格来自腾讯财经；影响金价的资讯来自新浪财经实时快讯。</p>
    <p><strong>全球市场：</strong>全球股指、COMEX 铜、BDI 来自东方财富；原油、伦敦金来自腾讯财经；比特币来自 Gate.io 公开行情（带 CORS 头）。数据为延时行情，仅供参考。</p>
  </div>
</div>

<script>
/* ==================== 通用工具 ==================== */
let _jpSeq = 0;
function jsonp(url, cbKey, timeout){
  cbKey = cbKey || 'cb';
  return new Promise(function(resolve, reject){
    const name = 'jp' + (++_jpSeq) + Math.floor(Math.random()*9000+1000);
    const sep = url.indexOf('?') < 0 ? '?' : '&';
    const s = document.createElement('script');
    s.referrerPolicy = 'no-referrer';
    let done = false;
    const to = setTimeout(function(){
      if(done) return; done = true; cleanup(); reject(new Error('timeout'));
    }, timeout || 9000);
    function cleanup(){
      clearTimeout(to);
      try{ delete window[name]; }catch(e){ window[name] = undefined; }
      if(s.parentNode) s.parentNode.removeChild(s);
    }
    window[name] = function(d){ if(done) return; done = true; cleanup(); resolve(d); };
    s.onerror = function(){ if(done) return; done = true; cleanup(); reject(new Error('load error')); };
    s.src = url + sep + cbKey + '=' + name;
    document.head.appendChild(s);
  });
}
/* 变量式 JSONP：腾讯 v_xxx= / kday= / 新浪 var hq_str_xxx= */
function jsonpVar(url, varName, timeout){
  return new Promise(function(resolve, reject){
    const s = document.createElement('script');
    s.referrerPolicy = 'no-referrer';
    let done = false;
    const to = setTimeout(function(){
      if(done) return; done = true; cleanup(); reject(new Error('timeout'));
    }, timeout || 9000);
    function cleanup(){
      clearTimeout(to);
      try{ delete window[varName]; }catch(e){ window[varName] = undefined; }
      if(s.parentNode) s.parentNode.removeChild(s);
    }
    s.onerror = function(){ if(done) return; done = true; cleanup(); reject(new Error('load error')); };
    s.onload = function(){
      setTimeout(function(){
        if(done) return;
        const v = window[varName];
        if(v === undefined || v === null){ done = true; cleanup(); reject(new Error('no var')); return; }
        done = true; cleanup(); resolve(v);
      }, 50);
    };
    try{ delete window[varName]; }catch(e){ window[varName] = undefined; }
    s.src = url;
    document.head.appendChild(s);
  });
}
function safe(p){ return p.then(function(r){ return r; }).catch(function(e){ return null; }); }
function num(v, d){ const n = parseFloat(v); return isNaN(n) ? (d === undefined ? null : d) : n; }
function fmt(n, d){ if(n === null || n === undefined || isNaN(n)) return '—'; return n.toFixed(d === undefined ? 2 : d); }
function cls(v){ return v > 0 ? 'up' : (v < 0 ? 'down' : 'flat'); }
function sgn(v, d){ if(v === null || v === undefined) return '—'; return (v > 0 ? '+' : '') + v.toFixed(d === undefined ? 2 : d); }
function pctPill(v, unit){
  if(v === null || v === undefined) return '<span class="pill flat">—</span>';
  return '<span class="pill ' + cls(v) + '">' + sgn(v, 2) + (unit || '%') + '</span>';
}
function yi(v){
  if(v === null || v === undefined) return '—';
  const e = v / 1e8;
  if(Math.abs(e) >= 1) return sgn(e, 2) + '亿';
  return sgn(v / 1e4, 0) + '万';
}
function toggleMod(id){ document.getElementById(id).classList.toggle('fold'); }
function esc(s){ return String(s === undefined || s === null ? '' : s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ==================== 数据源封装 ==================== */
const EM = 'https://push2delay.eastmoney.com/api/qt/';

/* 东财批量行情（指数 / 商品 / ETF） */
async function emQuotes(secids){
  const url = EM + 'ulist.np/get?secids=' + encodeURIComponent(secids.join(',')) +
    '&fields=f1,f2,f3,f4,f12,f13,f14,f124&fltt=2&invt=2';
  const j = await jsonp(url, 'cb', 9000);
  const d = (j && j.data && j.data.diff) || [];
  const out = {};
  d.forEach(function(x){ out[x.f12] = { code:x.f12, name:x.f14, price:x.f2, pct:x.f3, chg:x.f4 }; });
  return out;
}
/* 腾讯外盘 hf_ 系列：price=[0] pct=[1] high=[4] low=[5] prev=[7] open=[8]
   注意：qt.gtimg.cn 返回的是 v_xxx="值" 形式的赋值语句，jsonpVar 取到的是「值」本身，
   不含 v_xxx= 前缀，所以这里直接按逗号切分，不能再拿正则去匹配脚本文本。 */
async function txHfOne(code){
  const v = await jsonpVar('https://qt.gtimg.cn/q=' + code, 'v_' + code, 9000);
  const p = String(v === undefined || v === null ? '' : v).split(',');
  if(p.length < 9) return null;
  return { code:code, price:num(p[0]), pct:num(p[1]), high:num(p[4]), low:num(p[5]), prev:num(p[7]), open:num(p[8]) };
}
async function txHf(codes){
  const rs = await Promise.all(codes.map(function(c){ return safe(txHfOne(c)); }));
  const out = {};
  rs.forEach(function(r, i){ if(r) out[codes[i]] = r; });
  return out;
}

/* ==================== 状态 ==================== */
const S = { gold:null, global:null, showAllGlobal:false };

/* ==================== 黄金 ==================== */
const GOLD_KEYS = ['黄金','金价','美联储','加息','降息','避险','通胀','美元','贵金属','白银','央行购金','地缘','实际利率'];
async function loadGold(){
  try{
    const [q, news] = await Promise.all([
      safe(emQuotes(['101.GC00Y','113.au2610','0.159934','1.518880','0.159937','1.518800','100.UDI','101.SI00Y'])),
      safe(loadGoldNews())
    ]);
    let xau = null;
    try{
      const p = (await safe(txHf(['hf_XAU']))) || {};
      if(p['hf_XAU']) xau = { name:'伦敦金现货', price:p['hf_XAU'].price, pct:p['hf_XAU'].pct };
    }catch(e){}
    S.gold = { q:q || {}, xau:xau, news:news || [] };
    renderGold();
  }catch(e){
    document.getElementById('goldBody').innerHTML = '<div class="empty">黄金数据暂时获取不到，请稍后重试</div>';
  }
}
async function loadGoldNews(){
  const url = 'https://zhibo.sina.com.cn/api/zhibo/feed?page=1&page_size=60&zhibo_id=152&tag_id=0&dire=f&dpc=1';
  const j = await jsonp(url, 'callback', 9000);
  const list = (((j || {}).result || {}).data || {}).feed ? ((j.result.data.feed.list) || []) : [];
  const out = [];
  list.forEach(function(x){
    const txt = (x.rich_text || '').replace(/<[^>]+>/g, '');
    if(!txt) return;
    let hit = 0;
    GOLD_KEYS.forEach(function(k){ if(txt.indexOf(k) >= 0) hit++; });
    if(hit > 0) out.push({ t:(x.create_time || '').slice(5, 16), x:txt, hit:hit });
  });
  out.sort(function(a, b){ return b.hit - a.hit; });
  return out.slice(0, 10);
}
function goldMood(g){
  const gc = g.q['GC00Y'] || {};
  const pct = num(gc.pct, 0);
  const udi = g.q['UDI'] || {};
  const udiPct = num(udi.pct, 0);
  let t, s;
  if(pct >= 1.5){ t = '黄金强势拉升，避险与多头情绪主导'; }
  else if(pct >= 0.5){ t = '黄金稳步走强，多头略占上风'; }
  else if(pct > -0.5){ t = '黄金高位震荡，多空暂时平衡'; }
  else if(pct > -1.5){ t = '黄金小幅回落，短线承压'; }
  else { t = '黄金明显走弱，避险情绪降温'; }
  let extra = [];
  if(udiPct > 0.2) extra.push('美元指数上行 ' + sgn(udiPct) + '%，对金价形成压制');
  else if(udiPct < -0.2) extra.push('美元指数走弱 ' + sgn(udiPct) + '%，对金价构成支撑');
  else extra.push('美元指数基本走平，方向性指引有限');
  const etf = g.q['159934'] || {};
  if(num(etf.pct, null) !== null) extra.push('黄金ETF易方达(159934) ' + sgn(num(etf.pct, 0)) + '%');
  s = extra.join(' · ');
  return { t:t, s:s, pct:pct };
}
function renderGold(){
  const g = S.gold;
  const q = g.q || {};
  const gc = q['GC00Y'] || {};      // COMEX黄金 美元/盎司
  const au = q['au2610'] || {};     // 沪金 元/克
  const etfs = ['159934','518880','159937','518800'].map(function(k){ return q[k]; }).filter(Boolean);
  const mood = goldMood(g);
  function cell(label, price, pct, unit){
    return '<div class="gcell"><div class="gl">' + label + '</div>' +
      '<div class="gn ' + cls(pct) + '">' + fmt(price, 2) + '</div>' +
      '<div class="gp">' + pctPill(pct) + ' <span style="color:var(--sub);font-weight:600">' + unit + '</span></div></div>';
  }
  let html = '<div class="goldtop">';
  html += cell('国际金价 · COMEX黄金', num(gc.price), num(gc.pct), '美元/盎司');
  if(g.xau) html += cell('国际金价 · 伦敦金现货', num(g.xau.price), num(g.xau.pct), '美元/盎司');
  html += cell('国内金价 · 沪金主力', num(au.price), num(au.pct), '元/克');
  html += cell('美元指数', num(q['UDI'] && q['UDI'].price), num(q['UDI'] && q['UDI'].pct), '');
  html += '</div>';

  html += '<div class="mood"><span class="mi">' + (mood.pct >= 0 ? '📈' : '📉') + '</span>' +
    '<div><div class="mt">' + mood.t + '</div><div class="ms">' + mood.s + '</div></div></div>';

  html += '<div class="subgrid"><div class="subcard"><h4>我关注的黄金 ETF</h4>' +
    etfs.map(function(e){
      return '<div class="kv"><span class="k">' + esc(e.name) + '<span style="color:#b3aca2"> ' + e.code + '</span></span>' +
        '<span class="v"><span class="' + cls(e.pct) + '">' + fmt(e.price, 3) + '</span> <span class="sm">' + pctPill(e.pct) + '</span></span></div>';
    }).join('') + '</div>';

  const si = q['SI00Y'];
  html += '<div class="subcard"><h4>贵金属联动</h4>' +
    '<div class="kv"><span class="k">COMEX 白银</span><span class="v ' + cls(si && si.pct) + '">' + fmt(si && si.price, 2) + ' <span class="sm">' + pctPill(si && si.pct) + '</span></span></div>' +
    '<div class="kv"><span class="k">金银联动</span><span class="v">' + (si && si.pct !== undefined && gc.pct !== undefined ? (si.pct > gc.pct ? '白银强于黄金，风险偏好回升' : '黄金强于白银，避险属性占优') : '—') + '</span></div>' +
    '</div></div>';

  html += '<div class="subcard" style="margin-top:12px"><h4>影响金价的关键讯息<span class="more">关键词：美联储 · 降息 · 避险 · 通胀 · 美元</span></h4>' +
    (g.news.length
      ? '<div class="news">' + g.news.map(function(n){
          return '<div class="ni"><div class="nt">' + esc(n.t) + '</div><div class="nx">' + esc(n.x) + '</div></div>';
        }).join('') + '</div>'
      : '<div class="empty">暂未获取到相关资讯</div>') + '</div>';

  document.getElementById('goldBody').innerHTML = html;
}

/* ==================== 全球市场 ==================== */
const GLOBAL_IDX = [
  { id:'100.DJIA',  n:'道琼斯',        g:'美股' },
  { id:'100.NDX',   n:'纳斯达克',      g:'美股' },
  { id:'100.SPX',   n:'标普500',       g:'美股' },
  { id:'100.HSI',   n:'恒生指数',      g:'亚太' },
  { id:'100.HSCEI', n:'国企指数',      g:'亚太' },
  { id:'100.N225',  n:'日经225',       g:'亚太' },
  { id:'100.KS11',  n:'韩国KOSPI',     g:'亚太' },
  { id:'100.TWII',  n:'台湾加权',      g:'亚太' },
  { id:'100.STI',   n:'新加坡海峡时报', g:'亚太' },
  { id:'100.SENSEX',n:'印度SENSEX',    g:'亚太' },
  { id:'100.AORD',  n:'澳洲普通股',     g:'亚太' },
  { id:'100.GDAXI', n:'德国DAX',       g:'欧洲' },
  { id:'100.FCHI',  n:'法国CAC40',     g:'欧洲' },
  { id:'100.FTSE',  n:'英国富时100',    g:'欧洲' },
  { id:'100.RTS',   n:'俄罗斯RTS',     g:'欧洲' },
  { id:'100.BVSP',  n:'巴西BOVESPA',   g:'美洲' },
];
const TX_COMM = [
  { c:'hf_CL',  n:'WTI原油',   u:'美元/桶' },
  { c:'hf_OIL', n:'布伦特原油', u:'美元/桶' },
];
async function loadGlobal(){
  try{
    const [q, btc] = await Promise.all([
      safe(emQuotes(GLOBAL_IDX.map(function(x){ return x.id; }).concat(['101.HG00Y', '100.BDI']))),
      safe(loadBtc())
    ]);
    let comm = [];
    try{
      const p = (await safe(txHf(TX_COMM.map(function(x){ return x.c; })))) || {};
      comm = TX_COMM.map(function(x){
        const v = p[x.c];
        return v ? { name:x.n, price:v.price, pct:v.pct, unit:x.u } : null;
      }).filter(Boolean);
    }catch(e){}
    S.global = { q:q || {}, comm:comm, btc:btc };
    renderGlobal();
  }catch(e){
    document.getElementById('globalBody').innerHTML = '<div class="empty">全球市场数据暂时获取不到，请稍后重试</div>';
  }
}
async function loadBtc(){
  // 新浪 hq.sinajs.cn 在跨域页面下会拒绝（onerror），改用 Gate.io 公开行情（带 CORS 头）
  try{
    const r = await fetch('https://api.gateio.ws/api/v4/spot/tickers?currency_pair=BTC_USDT', { cache:'no-store' });
    if(!r.ok) return null;
    const a = await r.json();
    const t = (a && a[0]) || null;
    if(!t) return null;
    const price = num(t.last), pct = num(t.change_percentage ? parseFloat(t.change_percentage) : null);
    if(price === null) return null;
    return { name:'比特币 BTC/USDT', price:price, pct:pct, unit:'美元' };
  }catch(e){ return null; }
}
function gItem(name, price, pct, unit){
  return '<div class="gitem"><div class="gn2">' + esc(name) + '</div>' +
    '<div class="gv2 ' + cls(pct) + '">' + fmt(price, price && price > 1000 ? 0 : 2) + '</div>' +
    '<div class="gp2">' + pctPill(pct) + (unit ? ' <span style="color:var(--sub);font-weight:600;font-size:10.5px">' + unit + '</span>' : '') + '</div></div>';
}
function renderGlobal(){
  const G = S.global;
  const q = G.q || {};
  const all = GLOBAL_IDX.map(function(x){
    const d = q[x.id.replace('100.', '')] || {};
    return { n:x.n, g:x.g, price:d.price, pct:d.pct };
  }).filter(function(x){ return x.price !== undefined; });
  const shown = S.showAllGlobal ? all : all.slice(0, 6);
  const ups = all.filter(function(x){ return num(x.pct, 0) > 0; }).length;
  const dns = all.filter(function(x){ return num(x.pct, 0) < 0; }).length;
  let html = '<div class="subgrid">';

  html += '<div class="subcard"><h4>📈 全球股指<span class="more" onclick="S.showAllGlobal=!S.showAllGlobal;renderGlobal()">' +
    (S.showAllGlobal ? '收起' : '展开全部 ' + all.length + ' 个') + '</span></h4>' +
    '<div class="ggrid">' + shown.map(function(x){ return gItem(x.n, x.price, x.pct, ''); }).join('') + '</div>' +
    '<div class="axis"><span>上涨 ' + ups + '</span><span>下跌 ' + dns + '</span><span>共 ' + all.length + ' 个市场</span></div></div>';

  const hg = q['HG00Y'], bdi = q['BDI'];
  html += '<div class="subcard"><h4>🛢 大宗商品与另类资产</h4><div class="ggrid">' +
    G.comm.map(function(c){ return gItem(c.name, c.price, c.pct, c.unit); }).join('') +
    (hg ? gItem('COMEX铜', hg.price, hg.pct, '美元/磅') : '') +
    (bdi ? gItem('波罗的海BDI', bdi.price, bdi.pct, '全球干散货运价') : '') +
    (G.btc ? gItem(G.btc.name, G.btc.price, G.btc.pct, '美元') : '<div class="gitem"><div class="gn2">比特币</div><div class="gv2" style="font-size:13px;color:var(--sub)">暂不可用</div><div class="gp2 flat">—</div></div>') +
    '</div></div>';

  html += '<div class="subcard"><h4>🌐 分区概览</h4>' +
    ['美股','亚太','欧洲','美洲'].map(function(gp){
      const arr = all.filter(function(x){ return x.g === gp; });
      if(!arr.length) return '';
      const avg = arr.reduce(function(s, x){ return s + num(x.pct, 0); }, 0) / arr.length;
      return '<div class="kv"><span class="k">' + gp + '（' + arr.length + '）</span>' +
        '<span class="v ' + cls(avg) + '">' + sgn(avg) + '%</span></div>';
    }).join('') + '</div>';

  html += '</div>';
  document.getElementById('globalBody').innerHTML = html;
}

/* ==================== 启动 ==================== */
async function doRefresh(){
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent = '⏳ 加载中…';
  document.getElementById('updateTime').textContent = '数据加载中…';
  await Promise.all([loadGold(), loadGlobal()]);
  document.getElementById('updateTime').textContent = '更新于 ' + new Date().toLocaleString('zh-CN') + ' · 东方财富 / 腾讯财经 / 新浪财经 / Gate.io';
  btn.disabled = false; btn.textContent = '🔄 刷新全部';
}
doRefresh();
</script>
