<style>
  :root{ --bg:#f7f4ee; --accent:#b8714e; --ink:#3a3230; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    height:100dvh; display:flex; flex-direction:column; overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #chips{ display:flex; gap:8px; padding:12px 14px 8px; }
  .chip{
    border:1.5px solid #d8cfc4; background:#fff; color:var(--ink);
    border-radius:999px; padding:7px 18px; font-size:15px; line-height:1;
  }
  .chip.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  #stage{
    flex:1; min-height:0; margin:4px 12px; border-radius:16px;
    background:#141210; display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  #preview{ max-width:100%; max-height:100%; display:none; }
  #emptyHint{ color:#8d857c; font-size:14px; text-align:center; line-height:2; }
  #busy{
    position:absolute; inset:0; background:rgba(20,18,16,.72);
    display:none; align-items:center; justify-content:center; flex-direction:column; gap:12px;
    color:#f2ede6; font-size:15px; z-index:5;
  }
  .spin{ width:34px; height:34px; border-radius:50%; border:3px solid #6b625a; border-top-color:#f2ede6; animation:sp 1s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  #toast{
    position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
    background:rgba(20,18,16,.85); color:#fff; padding:9px 18px; border-radius:999px;
    font-size:14px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:9; white-space:nowrap;
  }
  #cmpBtn{
    display:none; margin:8px auto 0; border:none; background:none;
    color:#8d857c; font-size:13px; text-decoration:underline; text-underline-offset:3px;
  }
  #bar{ display:flex; align-items:center; justify-content:space-around; padding:14px 24px 18px; }
  .sideBtn{
    width:64px; height:44px; border-radius:22px; border:1.5px solid #d8cfc4;
    background:#fff; color:var(--ink); font-size:15px;
  }
  .sideBtn:disabled{ opacity:.4; }
  #shutter{
    width:74px; height:74px; border-radius:50%; border:4px solid var(--accent);
    background:var(--accent); position:relative;
  }
  #shutter::after{
    content:''; position:absolute; inset:5px; border-radius:50%;
    border:2.5px solid #fff; background:var(--accent);
  }
  #shutter:active::after{ inset:12px; }
  #chipList{ display:flex; gap:8px; flex:1; flex-wrap:wrap; }
  #chips{ display:flex; gap:8px; padding:12px 14px 8px; align-items:center; }
  #av{ width:30px; height:30px; border-radius:50%; border:1px solid #e4dccf; margin-right:2px; object-fit:cover; flex:none; }
  #live{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
  #live.mir{ transform:scaleX(-1); }
  #faceBtn{ position:absolute; top:10px; right:10px; z-index:6; width:40px; height:40px; border-radius:50%; border:1.5px solid rgba(255,255,255,.55); background:rgba(20,18,16,.45); color:#fff; font-size:18px; display:none; }
  #startOv{ position:absolute; inset:0; z-index:4; display:none; align-items:center; justify-content:center; }
  #startOv button{ border:1.5px solid #d8cfc4; background:#fff; color:var(--ink); border-radius:999px; padding:13px 30px; font-size:16px; font-weight:600; }
  .mseg{ border:1.5px solid #d8cfc4; background:#fff; border-radius:999px; padding:6px 13px; font-size:13px; color:var(--ink); }
  .mseg.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
  #setBtn{ border:1.5px solid #d8cfc4; background:#fff; border-radius:50%; width:34px; height:34px; font-size:16px; line-height:1; color:var(--ink); }
  #setMask{
    position:fixed; inset:0; background:rgba(20,18,16,.45); z-index:20;
    display:none; align-items:flex-end;
  }
  #setPanel{
    width:100%; background:var(--bg); border-radius:18px 18px 0 0;
    padding:20px 20px calc(18px + env(safe-area-inset-bottom));
  }
  #setPanel h3{ font-size:16px; margin-bottom:14px; font-weight:600; }
  .setRow{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; font-size:15px; }
  .setRow small{ display:block; color:#8d857c; font-size:12px; margin-top:3px; }
  .setNote{ color:#8d857c; font-size:12px; line-height:1.7; margin-top:12px; border-top:1px solid #e4dccf; padding-top:10px; }
  #mirrorBtn{
    display:none; margin:8px auto 0; border:none; background:none;
    color:var(--accent); font-size:13px; font-weight:600;
  }
  #privacy{ text-align:center; color:#a89e91; font-size:11px; padding:0 0 10px; }
  .switch{ position:relative; width:46px; height:26px; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; inset:0; background:#d8cfc4; border-radius:999px; transition:.2s; }
  .slider::before{ content:''; position:absolute; width:20px; height:20px; border-radius:50%; background:#fff; top:3px; left:3px; transition:.2s; }
  .switch input:checked + .slider{ background:var(--accent); }
  .switch input:checked + .slider::before{ transform:translateX(20px); }
</style>

let curFilter = 'mt';

/* ============ 元素 ============ */
const $ = id => document.getElementById(id);
const chipList=$('chipList'), preview=$('preview'), emptyHint=$('emptyHint'),
      busy=$('busy'), busyTxt=$('busyTxt'), toast=$('toast'),
      camIn=$('camIn'), albIn=$('albIn'), saveBtn=$('saveBtn'),

      reLive=$('reLive'), mLive=$('mLive'), mSys=$('mSys');

/* ============ 镜像设置（默认开：自拍所见即所得） ============ */
function mirrorOn(){ return localStorage.getItem('cam_mirror') !== '0'; }
mirrorChk.checked = mirrorOn();
mirrorChk.onchange = () => { localStorage.setItem('cam_mirror', mirrorChk.checked ? '1' : '0'); applyMirrorUI(); };
setBtn.onclick = () => setMask.style.display = 'flex';
setMask.onclick = e => { if(e.target === setMask) setMask.style.display = 'none'; };

/* ============ 取景方式：网页取景(默认) / 系统相机 ============ */
let camMode = localStorage.getItem('cam_mode') || 'live';
function updateModeUI(){
  mLive.classList.toggle('on', camMode==='live');
  mSys.classList.toggle('on', camMode==='sys');
}
function setMode(m){
  if(camMode===m) return;
  camMode=m; localStorage.setItem('cam_mode',m); updateModeUI();
  if(m==='live'){ startOv.style.display='flex'; startLive(); }
  else { stopLive(); startOv.style.display='none'; }
}
mLive.onclick=()=>setMode('live');
mSys.onclick=()=>setMode('sys');

/* ---- 网页取景：getUserMedia 实时取景，无闪光灯、前后可切 ---- */
let liveStream=null, liveFacing='user', liveOn=false, liveStarting=false;
async function startLive(){
  if(liveOn||liveStarting) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toastMsg('此环境不支持网页取景，已切回系统相机');
    camMode='sys'; localStorage.setItem('cam_mode','sys'); updateModeUI(); startOv.style.display='none';
    return;
  }
  liveStarting=true;
  try{
    liveStream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{ facingMode:liveFacing, width:{ideal:1920}, height:{ideal:1080} }
    });
    liveVideo.srcObject=liveStream;
    await liveVideo.play();
    liveOn=true;
    showLiveView();
    applyMirrorUI();
  }catch(e){
    liveOn=false;
    if(camMode==='live') startOv.style.display='flex';
    toastMsg('打开摄像头失败：'+(e&&e.name==='NotAllowedError' ? '未授权摄像头，请在浏览器设置里允许' : '无法访问摄像头'));
  }
  liveStarting=false;
}
function stopLive(){
  if(liveStream){ liveStream.getTracks().forEach(t=>t.stop()); liveStream=null; }
  liveOn=false; liveVideo.srcObject=null; liveVideo.style.display='none'; faceBtn.style.display='none';
  if(camMode==='live' && !lastProcessed) startOv.style.display='flex';
}
function showLiveView(){
  liveVideo.style.display='block';
  faceBtn.style.display='block';
  startOv.style.display='none';
  emptyHint.style.display='none';
  if(!lastProcessed) preview.style.display='none';
  reLive.style.display='none';
}
function applyMirrorUI(){
  liveVideo.classList.toggle('mir', liveFacing==='user' && mirrorOn());
}
faceBtn.onclick=async ()=>{
  liveFacing = liveFacing==='user' ? 'environment' : 'user';
  if(liveStream){ liveStream.getTracks().forEach(t=>t.stop()); liveStream=null; liveOn=false; }
  await startLive();
};
startBtn.onclick=startLive;
reLive.onclick=async ()=>{
  if(camMode!=='live') return;
  if(liveOn) showLiveView();
  else { startOv.style.display='none'; await startLive(); }
};
/* 页面切后台时释放摄像头，回来点「开始取景」即可恢复 */
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && liveOn) stopLive(); });

/* ---- 网页取景截帧 → 走滤镜管线 ---- */
function grabLiveFrame(){
  const v=liveVideo;
  if(!v.videoWidth || !v.videoHeight) return null;
  const c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  return c;
}
async function captureLive(){
  const c=grabLiveFrame();
  if(!c){ toastMsg('取景还没准备好，稍等一下再按'); return; }
  busyShow(FILTERS[curFilter].name==='原片' ? '整理中…' : '渲染滤镜…');
  await sleep(20);
  try{
    const img=await loadImageFromUrl(c.toDataURL('image/jpeg',0.95));
    await runPipeline(img,false);
  }catch(e){ busyHide(); toastMsg('出了点问题：'+(e&&e.message||e)); }
}

/* ============ 滤镜切换 chips ============ */
function renderChips(){
  chipList.innerHTML='';
  for(const key in FILTERS){
    const b=document.createElement('button');
    b.className='chip'+(key===curFilter?' on':'');
    b.textContent=FILTERS[key].name;
    b.onclick=()=>{ if(curFilter===key) return;
      curFilter=key; renderChips();
      if(lastOrigUrl) applyToLast(); else toastMsg('已选 '+FILTERS[key].name);
    };
    chipList.appendChild(b);
  }
}

/* ============ 拍照 / 相册 ============ */
$('shutter').onclick=()=>{
  if(camMode==='live'){
    if(!liveOn){ startOv.style.display='none'; startLive(); return; }
    captureLive();
  } else camIn.click();
};
$('albumBtn').onclick=()=>albIn.click();
camIn.onchange=()=>{ if(camIn.files[0]) handleFile(camIn.files[0]); camIn.value=''; };
albIn.onchange=()=>{ if(albIn.files[0]) handleFile(albIn.files[0]); albIn.value=''; };

/* ============ 主流程 ============ */
let lastOriginal=null, lastProcessed=null, lastOrigUrl=null;
let lastOrigCanvas=null, lastOutCanvas=null;

async function handleFile(file){
  busyShow('读取照片…');
  try{
    const img = await loadImage(file);
    await runPipeline(img, false);
  }catch(err){
    busyHide(); toastMsg('出了点问题：'+(err&&err.message||err));
  }
}

async function runPipeline(img, silent){
  busyShow(FILTERS[curFilter].name==='原片' ? '整理中…' : '渲染滤镜…');
  await sleep(30);
  const t0 = performance.now();
  const f = FILTERS[curFilter];
  let origCanvas = drawToCanvas(img, null).canvas;
  let outCanvas  = drawToCanvas(img, null).canvas;
  if(f.lut || f.desat) outCanvas = applyColor(outCanvas, f);
  if(f.smooth) outCanvas = await smoothSkin(outCanvas, f.smooth);
  if(mirrorOn()){ outCanvas = flipCanvas(outCanvas); origCanvas = flipCanvas(origCanvas); }
  lastOrigCanvas = origCanvas; lastOutCanvas = outCanvas;
  lastOrigUrl  = await canvasToUrl(origCanvas, 0.92);
  lastOriginal = lastOrigUrl;
  lastProcessed = await canvasToUrl(outCanvas, 0.95);
  preview.src = lastProcessed;
  preview.style.display='block'; emptyHint.style.display='none';
  if(camMode==='live'){ liveVideo.style.display='none'; faceBtn.style.display='none'; reLive.style.display='block'; }
  saveBtn.disabled=false; cmpBtn.style.display='block'; mirrorBtn.style.display='block';
  busyHide();
  toastMsg(FILTERS[curFilter].name+' · '+outCanvas.width+'×'+outCanvas.height+' · '+Math.round(performance.now()-t0)+'ms');
  if(!silent) autoSave();
}

/* 换滤镜后对当前这张重跑（镜像按当前设置重建） */
async function applyToLast(){
  if(!lastOrigUrl) return;
  busyShow('重新渲染…');
  try{
    const img = await loadImageFromUrl(lastOrigUrl);
    await runPipeline(img, true);
  }catch(e){ busyHide(); }
}

function loadImageFromUrl(url){
  return new Promise((res, rej)=>{
    const img=new Image();
    img.onload=()=>res(img);
    img.onerror=()=>rej(new Error('图片加载失败'));
    img.src=url;
  });
}

function flipCanvas(cv){
  const c=document.createElement('canvas'); c.width=cv.width; c.height=cv.height;
  const ctx=c.getContext('2d');
  ctx.translate(cv.width,0); ctx.scale(-1,1);
  ctx.drawImage(cv,0,0);
  return c;
}

mirrorBtn.onclick = async () => {
  if(!lastOutCanvas) return;
  busyShow('翻转…'); await sleep(20);
  lastOutCanvas = flipCanvas(lastOutCanvas);
  lastOrigCanvas = flipCanvas(lastOrigCanvas);
  lastProcessed = await canvasToUrl(lastOutCanvas, 0.95);
  lastOrigUrl = await canvasToUrl(lastOrigCanvas, 0.92);
  lastOriginal = lastOrigUrl;
  preview.src = lastProcessed;
  busyHide();
  toastMsg('已翻转 · 按「保存」存这一版');
};

function loadImage(file){
  return new Promise((res, rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>res(img);
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('这张照片打不开（可能是 HEIC 格式，请用系统相机再试）')); };
    img.src=url;
  });
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));

function drawToCanvas(img, maxArea){
  let w=img.naturalWidth, h=img.naturalHeight;
  const area=w*h, CAP=(maxArea||16000000);
  if(area>CAP){ const s=Math.sqrt(CAP/area); w=Math.round(w*s); h=Math.round(h*s); }
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d');
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(img,0,0,w,h);
  return {canvas:c, ctx};
}

function canvasToUrl(cv, q){
  return new Promise(res=>cv.toBlob(b=>res(URL.createObjectURL(b)), 'image/jpeg', q||0.95));
}

/* ---- 色彩：降饱和 + LUT ---- */
function applyColor(srcCanvas, f){
  const ctx=srcCanvas.getContext('2d');
  const im=ctx.getImageData(0,0,srcCanvas.width,srcCanvas.height);
  const d=im.data, lut=f.lut, des=f.desat;
  for(let i=0;i<d.length;i+=4){
    let r=d[i],g=d[i+1],b=d[i+2];
    if(des<1){
      const l=0.299*r+0.587*g+0.114*b;
      r=l+(r-l)*des; g=l+(g-l)*des; b=l+(b-l)*des;
      r=r<0?0:r>255?255:r; g=g<0?0:g>255?255:g; b=b<0?0:b>255?255:b;
    }
    if(lut){ r=lut.R[r|0]; g=lut.G[g|0]; b=lut.B[b|0]; }
    d[i]=r; d[i+1]=g; d[i+2]=b;
  }
  ctx.putImageData(im,0,0);
  return srcCanvas;
}

/* ---- 磨皮：1/4分辨率 可分离双边滤波 × iters，上采样混合 ----
   adaptive：按画面噪声自动分档——暗光/高ISO磨皮重、光线好磨皮轻+锐化足（MT 实测行为） */
async function smoothSkin(srcCanvas, cfg){
  const W=srcCanvas.width, H=srcCanvas.height;
  const w2=Math.max(1,W>>2), h2=Math.max(1,H>>2);
  // 缩小
  const small=document.createElement('canvas'); small.width=w2; small.height=h2;
  const sctx=small.getContext('2d');
  sctx.imageSmoothingQuality='high';
  sctx.drawImage(srcCanvas,0,0,w2,h2);
  const sim=sctx.getImageData(0,0,w2,h2);
  const n=w2*h2;
  let mix=cfg.mix, dk=(cfg.dk===undefined?0.55:cfg.dk), shp=cfg.sharpen||0;
  if(cfg.adaptive){
    const gy=new Float32Array(n);
    for(let i=0,j=0;i<n;i++,j+=4) gy[i]=0.299*sim.data[j]+0.587*sim.data[j+1]+0.114*sim.data[j+2];
    let sum=0, cnt=0;
    for(let y=1;y<h2-1;y++){
      const row=y*w2;
      for(let x=1;x<w2-1;x++){
        const i=row+x;
        sum+=Math.abs(-4*gy[i]+gy[i-1]+gy[i+1]+gy[i-w2]+gy[i+w2]); cnt++;
      }
    }
    const noise=sum/cnt;
    /* 每个滤镜可带自己的噪声映射与暗/亮两档参数；adaptive:true = MT 默认档 */
    const A = (typeof cfg.adaptive==='object') ? cfg.adaptive
            : {lo:11,hi:16,mixD:0.45,mixB:0.12,dkD:0.55,dkB:0.65,shpD:0.15,shpB:0.50};
    const t=Math.max(0,Math.min(1,(noise-A.lo)/(A.hi-A.lo)));
    mix=A.mixD+(A.mixB-A.mixD)*t; dk=A.dkD+(A.dkB-A.dkD)*t; shp=A.shpD+(A.shpB-A.shpD)*t;
  }
  let buf=new Float32Array(n*3), tmp=new Float32Array(n*3);
  for(let i=0,j=0;i<n;i++,j+=4){ buf[i*3]=sim.data[j]; buf[i*3+1]=sim.data[j+1]; buf[i*3+2]=sim.data[j+2]; }
  bilateralSep(buf,tmp,w2,h2,cfg);
  for(let k=1;k<cfg.iters;k++) bilateralSep(buf,tmp,w2,h2,cfg);
  /* 细节回叠：平滑结果 + 原小图细节×dk，保留皮肤质感、消除面具感 */
  for(let i=0,j=0;i<n;i++,j+=4){
    sim.data[j]   = buf[i*3]  +(sim.data[j]  -buf[i*3]  )*dk;
    sim.data[j+1] = buf[i*3+1]+(sim.data[j+1]-buf[i*3+1])*dk;
    sim.data[j+2] = buf[i*3+2]+(sim.data[j+2]-buf[i*3+2])*dk;
    sim.data[j+3] = 255;
  }
  sctx.putImageData(sim,0,0);
  const big=document.createElement('canvas'); big.width=W; big.height=H;
  const bctx=big.getContext('2d');
  bctx.imageSmoothingEnabled=true; bctx.imageSmoothingQuality='high';
  bctx.drawImage(small,0,0,W,H);
  // 混合：src*(1-mix) + smooth*mix
  const s1=srcCanvas.getContext('2d').getImageData(0,0,W,H);
  const s2=bctx.getImageData(0,0,W,H);
  const a=s1.data, b=s2.data, m=mix;
  for(let i=0;i<a.length;i+=4){
    a[i]   = a[i]  +(b[i]  -a[i])*m;
    a[i+1] = a[i+1]+(b[i+1]-a[i+1])*m;
    a[i+2] = a[i+2]+(b[i+2]-a[i+2])*m;
  }
  bctx.putImageData(s1,0,0);
  if(shp) unsharp(big, shp, 2);
  return big;
}

/* 轻量 USM 锐化：清晰度提升但不放大噪点 */
function unsharp(canvas, amount, r){
  const ctx=canvas.getContext('2d');
  const im=ctx.getImageData(0,0,canvas.width,canvas.height);
  const W=canvas.width, H=canvas.height, d=im.data, n=W*H;
  for(let c=0;c<3;c++){
    const ch=new Float32Array(n);
    for(let i=0,p=c;i<n;i++,p+=4) ch[i]=d[p];
    const bl=boxBlur(ch,W,H,r);
    for(let i=0,p=c;i<n;i++,p+=4){
      let v=d[p]+(ch[i]-bl[i])*amount;
      d[p]=v<0?0:v>255?255:v;
    }
  }
  ctx.putImageData(im,0,0);
}
function boxBlur(ch,W,H,r){
  const tmp=new Float32Array(W*H), out=new Float32Array(W*H), inv=1/(2*r+1);
  for(let y=0;y<H;y++){
    const row=y*W; let sum=0;
    for(let k=-r;k<=r;k++) sum+=ch[row+(k<0?0:k>=W?W-1:k)];
    for(let x=0;x<W;x++){
      tmp[row+x]=sum*inv;
      const xi=(x+r+1>=W?W-1:x+r+1), xo=(x-r<0?0:x-r);
      sum+=ch[row+xi]-ch[row+xo];
    }
  }
  for(let x=0;x<W;x++){
    let sum=0;
    for(let k=-r;k<=r;k++) sum+=tmp[(k<0?0:k>=H?H-1:k)*W+x];
    for(let y=0;y<H;y++){
      out[y*W+x]=sum*inv;
      const yi=(y+r+1>=H?H-1:y+r+1), yo=(y-r<0?0:y-r);
      sum+=tmp[yi*W+x]-tmp[yo*W+x];
    }
  }
  return out;
}

/* 可分离双边：横向一遍 + 纵向一遍（近似二维双边，快 ~20 倍） */
function bilateralSep(buf, tmp, w, h, cfg){
  const rad=Math.round(cfg.sigmaS*2);
  const sw=[], swv=[];
  for(let k=-rad;k<=rad;k++){
    sw.push(Math.exp(-(k*k)/(2*cfg.sigmaS*cfg.sigmaS)));
    swv.push(k*k);
  }
  const ir2=1/(2*cfg.sigmaR*cfg.sigmaR);
  // 横向
  for(let y=0;y<h;y++){
    const row=y*w;
    for(let x=0;x<w;x++){
      const ci=(row+x)*3, cr=buf[ci], cg=buf[ci+1], cb=buf[ci+2];
      let sr=0,sg=0,sb=0,swt=0;
      for(let k=-rad;k<=rad;k++){
        let xx=x+k; if(xx<0)xx=0; else if(xx>=w)xx=w-1;
        const pi=(row+xx)*3;
        const dr=buf[pi]-cr, dg=buf[pi+1]-cg, db=buf[pi+2]-cb;
        const wt=sw[k+rad]*Math.exp(-(dr*dr+dg*dg+db*db)*ir2);
        sr+=buf[pi]*wt; sg+=buf[pi+1]*wt; sb+=buf[pi+2]*wt; swt+=wt;
      }
      const ti=ci; tmp[ti]=sr/swt; tmp[ti+1]=sg/swt; tmp[ti+2]=sb/swt;
    }
  }
  // 纵向
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const ci=(y*w+x)*3, cr=tmp[ci], cg=tmp[ci+1], cb=tmp[ci+2];
      let sr=0,sg=0,sb=0,swt=0;
      for(let k=-rad;k<=rad;k++){
        let yy=y+k; if(yy<0)yy=0; else if(yy>=h)yy=h-1;
        const pi=(yy*w+x)*3;
        const dr=tmp[pi]-cr, dg=tmp[pi+1]-cg, db=tmp[pi+2]-cb;
        const wt=sw[k+rad]*Math.exp(-(dr*dr+dg*dg+db*db)*ir2);
        sr+=tmp[pi]*wt; sg+=tmp[pi+1]*wt; sb+=tmp[pi+2]*wt; swt+=wt;
      }
      buf[ci]=sr/swt; buf[ci+1]=sg/swt; buf[ci+2]=sb/swt;
    }
  }
}

/* ============ 保存 / 对比 ============ */
function stamp(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return FILTERS[curFilter].name+'_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
}
function doSave(){
  if(!lastProcessed) return;
  const a=document.createElement('a');
  a.href=lastProcessed; a.download=stamp()+'.jpg';
  document.body.appendChild(a); a.click(); a.remove();
}
saveBtn.onclick=doSave;
function autoSave(){ try{ doSave(); }catch(e){} }

cmpBtn.addEventListener('pointerdown',()=>{ if(lastOriginal){ preview.src=lastOriginal; } });

cmpBtn.addEventListener('pointerleave',()=>{ if(lastOriginal&&lastProcessed){ preview.src=lastProcessed; } });
