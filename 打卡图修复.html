<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>打卡图修复</title>
<style>
:root{--bg:#f7f4ee;--accent:#b8714e;--line:#e3dccf;--sub:#8a7f70;--muted:#a89c8a;--card:#fffdf9;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:#3a3631;padding:18px;max-width:980px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--sub);font-size:13px;margin-bottom:14px}
.warn{background:#fdecec;color:#b23b3b;border:1px solid #f3b5b5;padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;display:none}
.warn.show{display:block}
.section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.section h2{font-size:16px;margin:0 0 10px}
.hint{font-size:12px;color:var(--muted);font-weight:400}
button{font-family:inherit;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:9px 14px;font-size:13px;transition:.14s}
button:hover{opacity:.9}
button.ghost{background:#fff;color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;max-height:62vh;overflow:auto}
.gcell{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;position:relative}
.gcell img{width:100%;height:84px;object-fit:cover;display:block}
.gcell .nm{font-size:10.5px;color:var(--sub);padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:4px;left:4px;font-size:10px;padding:2px 6px;border-radius:8px;color:#fff}
.badge.dup{background:#c0392b}
.badge.old{background:#b8860b}
.ck{display:flex;gap:10px;flex-direction:column}
.ckrow{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.ckdt{font-weight:700;font-size:15px}
.cknote{font-size:12px;color:var(--sub);margin-left:8px}
.items{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{font-size:12.5px;background:rgba(184,113,78,.08);border:1px solid var(--line);border-radius:16px;padding:4px 10px;display:inline-flex;gap:5px;align-items:center}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.photos img{width:64px;height:64px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.log{background:#faf7f1;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;color:var(--sub);max-height:160px;overflow:auto;white-space:pre-wrap;margin-top:10px}
.ov{position:fixed;inset:0;background:rgba(58,54,49,.4);display:none;align-items:flex-start;justify-content:center;padding-top:40px;z-index:50}
.ov.show{display:flex}
.ovbox{background:#fff;border-radius:14px;padding:16px;width:min(92vw,560px);max-height:84vh;overflow:auto}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin-top:10px}
.ovcell{border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer}
.ovcell:hover{border-color:var(--accent)}
.ovcell img{width:100%;height:70px;object-fit:cover;display:block}
.ovcell .t{font-size:10px;color:var(--sub);padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<h1>打卡图修复</h1>
<div class="sub">找回并补全打卡记录的配图；同一张图在库里只保留一份，自动清理重复。云端只存引用（几 KB），不重复占空间。</div>
<div id="warn" class="warn"></div>

<div class="section">
  <h2>① 本机图库总览 <span class="hint">红色"重复"=与另一张完全相同，可一键清理</span></h2>
  <div id="galleryInfo" class="hint"></div>
  <button id="btnDedup" class="ghost">清理重复图（合并为一套）</button>
  <div id="gallery" class="glist" style="margin-top:10px"></div>
</div>

<div class="section">
  <h2>② 打卡记录配图 <span class="hint">先一键按当天菜品自动配图，再手动补</span></h2>
  <button id="btnAutoAll">全部按当天菜品自动配图</button>
  <div id="cklist" class="ck" style="margin-top:12px"></div>
</div>

<div class="section">
  <h2>③ 保存并同步云端</h2>
  <div class="row">
    <button id="btnSave">保存并同步云端</button>
    <button id="btnSaveLocal" class="ghost">仅保存到本机</button>
  </div>
  <div id="log" class="log"></div>
</div>

<div class="ov" id="ov">
  <div class="ovbox">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div id="ovTitle" style="font-weight:700"></div>
      <button id="ovClose" class="ghost">关闭</button>
    </div>
    <div style="margin:8px 0 4px;font-size:12px;color:var(--muted)">点下方本机图库中的图，即可配给当前打卡；也可从上方选择文件上传。</div>
    <input type="file" id="upload" accept="image/*" multiple style="margin:6px 0">
    <div id="ovgrid" class="ovgrid"></div>
  </div>
</div>

<script>
const IDB_DB='food_img_db', IDB_STORE='images';
const SB_KEY='sb_publishable_b6t_c2L2j8wB7Vgp9lWGZw_HqHVFQzF';
const SB_URL='https://vienajheerbsmckfzkzo.supabase.co/rest/v1/workbench_sync';
const MENU_KEY='food_menu', DRINKS_KEY='food_drinks', SNACKS_KEY='food_snacks', CK_KEY='food_checkin';

function log(m){const el=document.getElementById('log');el.textContent+=m+'\n';el.scrollTop=el.scrollHeight;}
function idbOpen(){return new Promise((res,rej)=>{const rq=indexedDB.open(IDB_DB,1);rq.onupgradeneeded=e=>{e.target.result.createObjectStore(IDB_STORE);};rq.onsuccess=e=>res(e.target.result);rq.onerror=()=>rej('idb open failed');});}
async function idbPut(id,val){const db=await idbOpen();return new Promise((res)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(val,id);tx.oncomplete=()=>res();tx.onerror=()=>res();});}
async function idbGet(id){const db=await idbOpen();return new Promise((res)=>{const tx=db.transaction(IDB_STORE,'readonly');const rq=tx.objectStore(IDB_STORE).get(id);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null);});}
async function idbDelete(id){const db=await idbOpen();return new Promise((res)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>res();});}
async function idbGetAll(){try{const db=await idbOpen();return await new Promise((res)=>{const out={};const tx=db.transaction(IDB_STORE,'readonly');const rq=tx.objectStore(IDB_STORE).openCursor();rq.onsuccess=e=>{const cur=e.target.result;if(cur){out[cur.key]=cur.value;cur.continue();}else res(out);};rq.onerror=()=>res({});});}catch(e){return {};}}
async function idbClear(){const db=await idbOpen();return new Promise((res)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).clear();tx.oncomplete=()=>res();tx.onerror=()=>res();});}
function loadLib(k){try{const v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:[];}catch(e){return [];}}
function writeLib(k,v){localStorage.setItem(k,JSON.stringify(v));}
function imgIdFor(name){return 'imp_'+name.replace(/\.[^.]+$/,'').replace(/[^\w一-龥]/g,'_');}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

let MENU=loadLib(MENU_KEY), DRINKS=loadLib(DRINKS_KEY), SNACKS=loadLib(SNACKS_KEY), CHECKINS=loadLib(CK_KEY);
function buildNameMap(){const m={};(MENU||[]).concat(DRINKS||[],SNACKS||[]).forEach(it=>{if(it&&it.name&&it.image)m[it.name]=it.image;});return m;}

/* ---------- 图库总览 + 重复检测 ---------- */
let DUP_SET=new Set();
async function renderGallery(){
  const all=await idbGetAll();
  const groups={};
  for(const id in all){const b64=all[id];if(typeof b64!=='string')continue;(groups[b64]=groups[b64]||[]).push(id);}
  DUP_SET=new Set();
  for(const b64 in groups){const ids=groups[b64];if(ids.length<2)continue;const canon=ids.find(id=>id.indexOf('imp_')===0)||ids[0];ids.forEach(id=>{if(id!==canon)DUP_SET.add(id);});}
  const keys=Object.keys(all);
  document.getElementById('galleryInfo').textContent='本机图库共 '+keys.length+' 张。红色"重复"=与另一张完全相同可清理；黄色"旧库"=早期存入的历史图。';
  const g=document.getElementById('gallery');g.innerHTML='';
  keys.forEach(id=>{
    const v=all[id];if(typeof v!=='string')return;
    const cell=document.createElement('div');cell.className='gcell';
    const img=document.createElement('img');img.src=v;cell.appendChild(img);
    if(DUP_SET.has(id)){const b=document.createElement('div');b.className='badge dup';b.textContent='重复';cell.appendChild(b);}
    else if(id.indexOf('imp_')!==0){const b=document.createElement('div');b.className='badge old';b.textContent='旧库';cell.appendChild(b);}
    const nm=document.createElement('div');nm.className='nm';nm.textContent=id;cell.appendChild(nm);
    g.appendChild(cell);
  });
}
document.getElementById('btnDedup').addEventListener('click',async()=>{
  if(!confirm('把完全相同的图合并为一份（保留 imp_ 那套，删除重复副本），并把所有引用改指向保留的那份。确定？'))return;
  const all=await idbGetAll();
  const groups={};
  for(const id in all){const b64=all[id];if(typeof b64!=='string')continue;(groups[b64]=groups[b64]||[]).push(id);}
  let del=0,rep=0;
  for(const b64 in groups){
    const ids=groups[b64];if(ids.length<2)continue;
    const canon=ids.find(id=>id.indexOf('imp_')===0)||ids[0];
    for(const dup of ids){if(dup===canon)continue;rep+=repointRef(dup,canon);await idbDelete(dup);del++;}
  }
  writeLib(MENU_KEY,MENU);writeLib(DRINKS_KEY,DRINKS);writeLib(SNACKS_KEY,SNACKS);writeLib(CK_KEY,CHECKINS);
  log('已清理重复图 '+del+' 张，改写引用 '+rep+' 处。现在图库只有一套。');
  renderGallery();renderCheckins();
});
function repointRef(dup,canon){
  let c=0;const from='idb://'+dup,to='idb://'+canon;
  [MENU,DRINKS,SNACKS].forEach(arr=>{(arr||[]).forEach(it=>{if(it&&it.image===from){it.image=to;c++;}});});
  (CHECKINS||[]).forEach(ck=>{(ck.photos||[]).forEach((p,i)=>{if(p===from){ck.photos[i]=to;c++;}});});
  return c;
}

/* ---------- 打卡记录 ---------- */
let pickCtx=null;
async function fillPhoto(imgEl,p){if(!p)return;if(p.startsWith('idb://')){const v=await idbGet(p.slice(6));if(v)imgEl.src=v;}else{imgEl.src=p;}}
async function renderCheckins(){
  const nm=buildNameMap();
  document.getElementById('btnAutoAll').onclick=()=>autoFillAll(nm);
  const box=document.getElementById('cklist');box.innerHTML='';
  if(!CHECKINS.length){box.innerHTML='<div class="hint">本机没有打卡记录。</div>';return;}
  CHECKINS.forEach((ck,idx)=>{
    const row=document.createElement('div');row.className='ckrow';
    const dt=document.createElement('div');dt.className='ckdt';
    dt.textContent=ck.date||('#'+idx);
    if(ck.note)dt.innerHTML+='<span class="cknote">'+esc(ck.note)+'</span>';
    row.appendChild(dt);
    const items=Array.isArray(ck.items)?ck.items:[];
    if(items.length){
      const iw=document.createElement('div');iw.className='items';
      items.forEach(it=>{const chip=document.createElement('span');chip.className='chip';chip.textContent=(it.emoji||'🍽️')+' '+(it.name||'');iw.appendChild(chip);});
      row.appendChild(iw);
    }else{const h=document.createElement('div');h.className='hint';h.textContent='（当天未记录菜品）';row.appendChild(h);}
    const phs=Array.isArray(ck.photos)?ck.photos:[];
    const pf=document.createElement('div');pf.className='photos';
    for(const p of phs){const img=document.createElement('img');pf.appendChild(img);fillPhoto(img,p);}
    row.appendChild(pf);
    const op=document.createElement('div');op.className='row';
    const b1=document.createElement('button');b1.textContent='按当天菜品自动配图';b1.onclick=()=>autoFill(idx,nm);op.appendChild(b1);
    const b2=document.createElement('button');b2.className='ghost';b2.textContent='选图';b2.onclick=()=>openPicker(idx);op.appendChild(b2);
    if(phs.length){const b3=document.createElement('button');b3.className='ghost';b3.textContent='删最后一张';b3.onclick=()=>{ck.photos.pop();writeLib(CK_KEY,CHECKINS);renderCheckins();};op.appendChild(b3);}
    row.appendChild(op);
    box.appendChild(row);
  });
}
function autoFill(idx,nm){
  const ck=CHECKINS[idx];
  let added=0;
  (ck.items||[]).forEach(it=>{const img=it&&nm[it.name];if(img&&!it.cover){it.cover=img;added++;}});
  writeLib(CK_KEY,CHECKINS);
  log((ck.date||('#'+idx))+' 自动配图 +'+added+' 道（已写入菜品 cover）');
  renderCheckins();
}
function autoFillAll(nm){
  let total=0;
  CHECKINS.forEach(ck=>{(ck.items||[]).forEach(it=>{const img=it&&nm[it.name];if(img&&!it.cover){it.cover=img;total++;}});});
  writeLib(CK_KEY,CHECKINS);log('全部自动配图完成，共 '+total+' 道菜品（已写入 cover）');renderCheckins();
}
function openPicker(idx){pickCtx=idx;document.getElementById('ovTitle').textContent='为「'+(CHECKINS[idx].date||('#'+idx))+'」选图 / 上传';renderOvGrid();document.getElementById('ov').classList.add('show');}
async function renderOvGrid(){const all=await idbGetAll();const g=document.getElementById('ovgrid');g.innerHTML='';Object.keys(all).forEach(k=>{const v=all[k];if(typeof v!=='string')return;const c=document.createElement('div');c.className='ovcell';const img=document.createElement('img');img.src=v;c.appendChild(img);const t=document.createElement('div');t.className='t';t.textContent=k;t.title=k;c.onclick=()=>addPhoto(pickCtx,'idb://'+k);g.appendChild(c);});}
function addPhoto(idx,ref){const ck=CHECKINS[idx];if(!ck.photos)ck.photos=[];if(ck.photos.indexOf(ref)<0)ck.photos.push(ref);writeLib(CK_KEY,CHECKINS);document.getElementById('ov').classList.remove('show');renderCheckins();}
document.getElementById('ovClose').onclick=()=>document.getElementById('ov').classList.remove('show');
document.getElementById('upload').addEventListener('change',async e=>{
  const files=[...e.target.files].filter(f=>/image\//.test(f.type));
  for(const f of files){const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});const id=imgIdFor(f.name+Date.now());await idbPut(id,b64);if(pickCtx!=null)addPhoto(pickCtx,'idb://'+id);}
  e.target.value='';if(pickCtx!=null)openPicker(pickCtx);
});

/* ---------- 云端同步 ---------- */
const SB_H={'Authorization':'Bearer '+SB_KEY,'apikey':SB_KEY,'Accept':'application/json'};
async function getCloudData(){const r=await fetch(SB_URL+'?id=eq.me',{headers:SB_H});if(!r.ok){log('读取云端失败 '+r.status);return null;}const j=await r.json();return (j[0]&&j[0].payload&&j[0].payload.data)||null;}
async function upsertCloud(dataObj){const headers={'Authorization':'Bearer '+SB_KEY,'apikey':SB_KEY,'Content-Type':'application/json','Accept':'application/json','Prefer':'return=minimal'};const g=await fetch(SB_URL+'?id=eq.me&select=id',{headers});const exists=g.ok&&(await g.json()).length>0;const body=JSON.stringify({id:'me',payload:{data:dataObj,updatedAt:new Date().toISOString()}});if(exists){const r=await fetch(SB_URL+'?id=eq.me',{method:'PUT',headers,body});if(!r.ok)log('PUT 失败 '+r.status);return r.ok;}else{const r=await fetch(SB_URL,{method:'POST',headers,body});if(!r.ok)log('POST 失败 '+r.status);return r.ok;}}
function collectAllRaw(){const out={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);out[k]=localStorage.getItem(k);}return out;}
async function mergeAndPushRaw(){const cloud=await getCloudData();const local=collectAllRaw();const merged=Object.assign({},cloud||{},local);log('云端原有 '+(cloud?Object.keys(cloud).length:0)+' 键，本机 '+Object.keys(local).length+' 键，合并后 '+Object.keys(merged).length+' 键（本机优先）');return await upsertCloud(merged);}
document.getElementById('btnSave').addEventListener('click',async()=>{
  if(!confirm('把打卡记录（含图引用）保存到本机，并合并同步到云端。之后请在 github.io 打开工作台查看。确定？'))return;
  writeLib(CK_KEY,CHECKINS);log('已保存本机打卡记录');
  const ok=await mergeAndPushRaw();log(ok?'已同步云端（引用，未压缩）':'云端同步失败，见上方错误码');
});
document.getElementById('btnSaveLocal').addEventListener('click',()=>{
  writeLib(CK_KEY,CHECKINS);writeLib(MENU_KEY,MENU);writeLib(DRINKS_KEY,DRINKS);writeLib(SNACKS_KEY,SNACKS);
  log('已保存到本机（未同步云端）。可在 github.io 打开工作台触发同步。');
});

/* ---------- 启动 ---------- */
if(location.origin.indexOf('github.io')<0){
  const w=document.getElementById('warn');w.classList.add('show');
  w.textContent='⚠ 你不在 github.io 上！本机数据与工作台不互通。请用 https://hlsbibisky.github.io/workbench/打卡图修复.html 打开。';
}else{log('源正确（github.io），与工作台共用数据。');}
(async()=>{await renderGallery();await renderCheckins();})();
</script>
</body>
</html>
