<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日安排</title>
<style>
  :root{
    --bg:#f7f4ee; --card:#fffdf9; --ink:#3a3631; --sub:#8a837a; --line:#ece5da;
    --accent:#b8714e; --mark:#f0e3d6; --done:#b0a795;
    --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box; margin:0;}
  body{background:var(--bg); color:var(--ink); font-family:var(--font); line-height:1.55;
       -webkit-font-smoothing:antialiased; padding:16px 20px 60px;}
  ::selection{background:var(--mark);}
  /* 满宽，不做居中窄栏 */
  .wrap{width:100%;}

  /* 右上角只放日期与进度，不放与外壳重复的大标题 */
  .dline{display:flex; justify-content:flex-end; align-items:baseline; gap:12px;
         font-size:12px; color:var(--sub); letter-spacing:1px; margin-bottom:10px;}
  .dline b{color:var(--accent); font-weight:600; letter-spacing:0;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:14px;
        box-shadow:0 1px 3px rgba(58,54,49,.06), 0 10px 30px rgba(58,54,49,.05);
        padding:6px 20px 16px;}

  /* 一条安排 */
  .item{display:flex; align-items:flex-start; gap:12px; padding:13px 2px;
        border-bottom:1px dashed var(--line);}
  .item:last-child{border-bottom:0;}
  .ck{flex:0 0 21px; width:21px; height:21px; margin-top:2px; border:1.6px solid #d8cfc0;
      border-radius:6px; cursor:pointer; display:grid; place-items:center; color:#fff;
      font-size:12px; line-height:1; background:#fff; user-select:none; transition:.15s;}
  .ck:hover{border-color:var(--accent);}
  .ck span{opacity:0; transition:.15s;}
  .item.done .ck{background:var(--accent); border-color:var(--accent);}
  .item.done .ck span{opacity:1;}

  .txt{flex:1; min-width:0; font-size:15.5px; word-break:break-word; cursor:text; padding:0 2px;}
  .item.done .txt{color:var(--done); text-decoration:line-through; text-decoration-color:#cfc6b4;}

  .del{flex:0 0 auto; border:0; background:transparent; color:#d8cfc0; cursor:pointer;
       font-size:14px; padding:2px 7px; border-radius:7px; opacity:0; transition:.15s;
       font-family:inherit; margin-top:1px;}
  .item:hover .del{opacity:1;}
  .del:hover{color:var(--accent); background:var(--mark);}

  /* 添加一条 */
  .addrow{display:flex; gap:10px; padding-top:16px; margin-top:6px; border-top:1px solid var(--line);}
  .addrow input{flex:1; min-width:0; border:1px solid var(--line); background:#fff;
      border-radius:10px; padding:10px 14px; font-family:inherit; font-size:15px;
      color:var(--ink); outline:none;}
  .addrow input:focus{border-color:var(--accent);}
  .addbtn{flex:0 0 auto; border:1px solid var(--accent); background:var(--accent); color:#fff;
      border-radius:10px; padding:10px 20px; font-family:inherit; font-size:14px;
      cursor:pointer; transition:.15s;}
  .addbtn:hover{background:#a05f3d;}

  .empty{color:#c4bbaa; font-size:14px; padding:22px 2px;}

  #toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(10px);
      background:rgba(58,50,42,.92); color:#fff; font-size:13px; padding:9px 20px;
      border-radius:10px; opacity:0; transition:.2s; pointer-events:none; z-index:99;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:520px){
    body{padding:12px 12px 50px;}
    .card{padding:4px 14px 14px;}
    .txt{font-size:15px;}
    .del{opacity:1;}   /* 触屏没有 hover，常显 */
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="dline"><span id="todayLabel"></span><b id="progLabel"></b></div>
  <div class="card">
    <div id="list"></div>
    <div class="addrow">
      <input id="newText" placeholder="今天要做什么？写一条，回车添加" autocomplete="off"
             onkeydown="if(event.key==='Enter')addTask()">
      <button class="addbtn" onclick="addTask()">＋ 添加</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ===== 今日安排 · 极简版 =====
   只做一件事：一条一条列今天的安排，勾上就是完成（灰字 + 删除线）。
   底层数据结构不变（TODAY_PLAN / days[日期].tasks），原来「今日重点」「等待确认」的
   数据仍原样留在 days 里，不删也不展示，将来想加回界面随时能接上。 */
const K='TODAY_PLAN';
const WD=['周日','周一','周二','周三','周四','周五','周六'];
let store=null;

function todayKey(d){ d=d||new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function dayObj(k){
  if(!store.days[k]) store.days[k]={focus:'',tasks:[],waiting:[],dels:[]};
  const d=store.days[k];
  if(!Array.isArray(d.tasks)) d.tasks=[];
  if(!Array.isArray(d.waiting)) d.waiting=[];   /* 老数据原样留着，界面不展示也不删 */
  if(!Array.isArray(d.dels)) d.dels=[];
  return d;
}
function cur(){ return dayObj(todayKey()); }

/* 删除墓碑：删掉的条目 id 记进 dels，随同步上云。
   没有它的话，云端旧快照会在合并时把删掉的条目并回来（2026-09-25 实测过的复活 bug）。 */
function pushDel(d,id){
  d.dels=(d.dels||[]).filter(x=>String(x.id)!==String(id));
  d.dels.push({id:id,ts:Date.now()});
  if(d.dels.length>300) d.dels=d.dels.slice(-300);
}

/* 自愈：清掉墓碑里已删除的残留项；同一天同名重复只留一条（任务优先保留已完成那条）。
   不同天同名是正常习惯，绝不动。 */
function healDay(d){
  let changed=false;
  if(!Array.isArray(d.dels)) d.dels=[];
  const dead={}; d.dels.forEach(x=>{ if(x&&x.id!==undefined) dead[String(x.id)]=1; });
  ['tasks','waiting'].forEach(fld=>{
    const arr=Array.isArray(d[fld])?d[fld]:[];
    const out=[],seen={};
    arr.forEach(it=>{
      if(!it||it.id===undefined){ changed=true; return; }
      if(dead[String(it.id)]){ changed=true; return; }
      const key=String(it.text||'');
      const si=seen[key];
      if(si!==undefined){
        changed=true;
        if(fld==='tasks' && it.done && !out[si].done){ pushDel(d,out[si].id); out[si]=it; }
        else { pushDel(d,it.id); }
        return;
      }
      seen[key]=out.length; out.push(it);
    });
    if(out.length!==arr.length) d[fld]=out;
  });
  return changed;
}

function load(){
  let raw=null;
  try{ raw=JSON.parse(localStorage.getItem(K)); }catch(e){ raw=null; }
  if(!raw||typeof raw!=='object'||!raw.days) raw={days:{}};
  store={days:raw.days};
  let healed=false;
  Object.keys(store.days).forEach(k=>{
    const d=store.days[k];
    if(!d||typeof d!=='object'){ delete store.days[k]; healed=true; return; }
    if(healDay(d)) healed=true;
  });
  if(healed) save();
}
function save(){
  try{ localStorage.setItem(K, JSON.stringify(store)); }
  catch(e){ toast('保存失败：本地存储空间不足'); return; }
  try{ if(window.parent&&window.parent!==window) window.parent.postMessage({type:'wb-data-changed'},'*'); }catch(e){}
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2000);
}

/* ===== 渲染 ===== */
function render(){
  const d=cur(), now=new Date();
  document.getElementById('todayLabel').textContent=(now.getMonth()+1)+'月'+now.getDate()+'日 '+WD[now.getDay()];
  const total=d.tasks.length, doneN=d.tasks.filter(t=>t.done).length;
  document.getElementById('progLabel').textContent = total ? ('已完成 '+doneN+'/'+total) : '';

  const list=document.getElementById('list');
  list.innerHTML='';
  if(!total){ list.innerHTML='<div class="empty">今天还没有安排，在下面写一条吧。</div>'; return; }

  d.tasks.forEach(t=>{
    const row=document.createElement('div'); row.className='item'+(t.done?' done':'');

    const ck=document.createElement('div'); ck.className='ck'; ck.title=t.done?'取消完成':'标记完成';
    const tick=document.createElement('span'); tick.textContent='✓'; ck.appendChild(tick);
    ck.onclick=()=>{ t.done=!t.done; save(); render(); };

    const tx=document.createElement('div'); tx.className='txt'; tx.textContent=t.text; tx.title='点击修改文字';
    tx.onclick=()=>{ const v=prompt('修改这一条：', t.text); if(v!==null && v.trim()){ t.text=v.trim(); save(); render(); } };

    const del=document.createElement('button'); del.className='del'; del.textContent='✕'; del.title='删除这一条';
    del.onclick=()=>{ if(confirm('删除这一条？')){ pushDel(d,t.id); d.tasks=d.tasks.filter(x=>x.id!==t.id); save(); render(); } };

    row.appendChild(ck); row.appendChild(tx); row.appendChild(del);
    list.appendChild(row);
  });
}

function addTask(){
  const inp=document.getElementById('newText');
  const text=inp.value.trim(); if(!text){ inp.focus(); return; }
  cur().tasks.push({id:uid(), text:text, cat:'', time:'', est:'', done:false, created:todayKey()});
  inp.value=''; save(); render(); inp.focus();
}

/* ===== 外壳联动：数据变了 / 要求保存 ===== */
window.addEventListener('message',e=>{
  const d=e.data||{};
  if(d.type==='wb-reload'){ location.reload(); }
  if(d.type==='wb-request-save'){ save(); }
});

/* ===== 启动 ===== */
load();
render();
</script>
</body>
</html>
