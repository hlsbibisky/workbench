<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>户型检测 · 工作台</title>
<style>
:root{
  --bg:#f7f4ee; --card:#fffdf9; --ink:#3a3631; --sub:#8a837a;
  --line:#ece5da; --accent:#b8714e; --accent2:#5b8c7b; --mark:#f0e3d6;
  --noted:#3f9d6b; --warn:#d9822b; --bad:#c0392b;
  --radius:14px;
  --shadow:0 1px 3px rgba(58,54,49,.06), 0 10px 30px rgba(58,54,49,.05);
  --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6;-webkit-font-smoothing:antialiased;}
::selection{background:var(--mark);}
.page{max-width:100%;margin:0;padding:14px 20px 22px;}

.tabs{display:flex;gap:8px;margin-bottom:12px;}
.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 20px;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--sub);transition:.15s;}
.tab:hover{color:var(--accent);border-color:#e2d5c7;}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(184,113,78,.25);}
.pane{display:none;}
.pane.show{display:block;}

/* ── 主栅格：左图右表，两列强制等高 ── */
.checkgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(380px,.95fr);gap:16px;align-items:stretch;}
.coleft{display:flex;flex-direction:column;min-width:0;}
.coright{display:flex;flex-direction:column;gap:12px;min-width:0;}
@media (max-width:1020px){ .checkgrid{grid-template-columns:1fr;} }

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 17px;}
.card-title{display:flex;align-items:center;font-size:14px;font-weight:700;margin-bottom:5px;}
.card-title .stepno{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:var(--mark);color:#8d5233;font-size:11.5px;font-weight:700;margin-right:8px;flex:none;}
.card-title .req{color:var(--bad);margin-left:4px;}
.card-title .card-mini{font-weight:400;font-size:12px;color:var(--sub);margin-left:6px;}
.card-sub{font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:10px;}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px;}
.titlerow .card-title{margin-bottom:0;}

/* 上传卡：撑满左列，虚线框自动变高 */
.card.upload{display:flex;flex-direction:column;flex:1;}
.drop{border:2px dashed #d8cfc2;border-radius:12px;background:#fff;color:var(--sub);cursor:pointer;transition:.18s;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
      flex:1;min-height:270px;padding:30px 22px;text-align:center;}
.drop:hover{border-color:var(--accent);background:#fffdfb;}
.dropico{width:46px;height:46px;border-radius:50%;border:1.5px dashed #d8cfc2;display:flex;align-items:center;justify-content:center;color:#bdb2a4;font-size:21px;line-height:1;transition:.18s;}
.drop:hover .dropico{border-color:var(--accent);color:var(--accent);}
.drop .d1{font-size:14.5px;font-weight:600;color:#6b635a;}
.drop .d2{font-size:12px;color:var(--sub);}
.drop .d3{font-size:11.5px;color:#b0a698;margin-top:5px;}
#fpPreview{flex:1;flex-direction:column;justify-content:center;}
#fpImg{max-width:100%;max-height:60vh;border-radius:10px;border:1px solid var(--line);display:block;margin:0 auto;}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;}
.pnote{font-size:11.5px;color:var(--sub);}

/* 表单区：两段式，虚线分隔 */
.card.form{padding:13px 16px 14px;}
.seg + .seg{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}

.person{display:grid;grid-template-columns:minmax(0,1.4fr) 82px 74px 32px;gap:8px;margin-bottom:8px;align-items:center;}
.person input,.person select,textarea,input[type=text],input[type=number],input[type=password],select{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-family:inherit;font-size:13px;padding:8px 11px;outline:none;width:100%;transition:.15s;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(184,113,78,.08);}
textarea{resize:vertical;line-height:1.7;display:block;}
.person .btn.mini{width:32px;padding:7px 0;line-height:1;}

@media (max-width:560px){
  .drop{min-height:190px;padding:22px 18px;}
  .person{grid-template-columns:minmax(0,1fr) 76px 64px 30px;gap:7px;}
  .person input,.person select,textarea,input[type=text],input[type=number],select{padding:8px 9px;}
  .page{padding:14px 14px 22px;}
  .card{padding:14px 14px;}
}

.chips{display:flex;gap:7px;flex-wrap:wrap;}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--sub);transition:.15s;user-select:none;}
.chip:hover{border-color:#e2d5c7;color:var(--accent);}
.chip.on{background:var(--mark);border-color:var(--accent);color:#8d5233;font-weight:600;}

.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 15px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.primary:hover{background:#a05f3d;color:#fff;}
.btn.primary:disabled{opacity:.55;cursor:wait;}
.btn.mini{padding:5px 11px;font-size:12px;border-radius:8px;}

/* 操作卡 */
.card.go{padding:15px 17px 14px;}
.card.go .btn.primary{width:100%;padding:13px 0;font-size:15.5px;letter-spacing:.5px;border-radius:11px;box-shadow:0 4px 14px rgba(184,113,78,.22);}
.state{font-size:12.5px;color:var(--sub);text-align:center;margin-top:8px;line-height:1.7;}
.state b{color:var(--noted);}
.state i{font-style:normal;color:var(--bad);}

details.set{margin-top:11px;border-top:1px dashed var(--line);padding-top:9px;}
details.set summary{list-style:none;cursor:pointer;font-size:12.5px;color:var(--sub);user-select:none;transition:.15s;}
details.set summary::-webkit-details-marker{display:none;}
details.set summary::before{content:"▸";margin-right:6px;font-size:11px;display:inline-block;}
details.set summary:hover{color:var(--accent);}
details.set[open] summary{color:var(--accent);}
details.set[open] summary::before{content:"▾";}
.apigrid{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 10px;align-items:center;margin-top:11px;}
.apigrid label{font-size:12px;color:var(--sub);text-align:right;}
.tip{grid-column:1 / -1;font-size:11.5px;color:var(--sub);line-height:1.7;}

/* ── 结果区 ── */
#out{margin-top:14px;}
#out .card{margin-top:12px;}
.verdict{border-radius:12px;padding:15px 20px;font-size:16px;font-weight:700;border:1px solid;}
.verdict.ok{background:#eaf3de;border-color:#cfe3b4;color:#3b6d11;}
.verdict.mid{background:#faeeda;border-color:#efd9ae;color:#8a5a12;}
.verdict.bad{background:#fcebeb;border-color:#eec3c3;color:#a32d2d;font-size:15.5px;}
.secgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;}
@media (max-width:900px){ .secgrid{grid-template-columns:1fr;} }
.secgrid .sec{margin-top:0;}
.secgrid .sec.wide{grid-column:1 / -1;}
.sec{border-left:3px solid #c98a63;background:#fdfaf6;border-radius:0 10px 10px 0;padding:13px 18px;}
.sec h4{margin:0 0 7px;font-size:14.5px;color:#8d5233;}
.sec.bad{border-left-color:var(--bad);background:#fdf3f3;}
.sec.bad h4{color:var(--bad);}
.sec p{margin:0;font-size:14px;line-height:2.05;color:#5b5148;white-space:pre-wrap;}
</style>
</head>
<body>
<div class="page">

  <div class="tabs">
    <button class="tab on" id="tabCheck" onclick="switchTab('check')">AI 户型检测</button>
    <button class="tab" id="tabBook" onclick="switchTab('book')">户型图鉴 · 参考</button>
  </div>

  <div class="pane show" id="paneCheck">

   <div class="checkgrid">
    <div class="coleft">
    <div class="card upload">
      <div class="card-title"><span class="stepno">1</span>上传户型图<span class="req">*</span></div>
      <div class="card-sub">开发商户型图、手画的都行，拍清楚一点。AI 会直接看图分析。</div>
      <label class="drop" id="fpDrop">
        <input type="file" id="fpInp" accept="image/*" style="display:none;" onchange="onFp(this.files[0])">
        <span class="dropico">＋</span>
        <span class="d1">点击上传户型图</span>
        <span class="d2">也可以直接把图片拖到这里</span>
        <span class="d3">把指北针、房间名、尺寸一起拍进去，AI 判断会更准</span>
      </label>
      <div id="fpPreview" style="display:none;">
        <img id="fpImg" alt="户型图预览">
        <div class="prow">
          <span class="pnote">本次分析用的就是这张图</span>
          <span class="btn mini" style="cursor:pointer;" onclick="clearFp()">换一张</span>
        </div>
      </div>
    </div>
    </div><!-- /左列 -->

    <div class="coright">
    <div class="card form">
      <div class="seg">
        <div class="titlerow">
          <div class="card-title"><span class="stepno">2</span>谁住进来<span class="req">*</span></div>
          <button class="btn mini" onclick="addPerson()">+ 加一个人</button>
        </div>
        <div class="card-sub">同一套房，住的人不同，结论可能完全相反。加几个人就加几行。</div>
        <div id="persons">
          <div class="person">
            <input type="text" class="p-name" placeholder="称呼（可空，如：我 / 老婆 / 儿子）">
            <select class="p-sex"><option value="">性别</option><option>男</option><option>女</option></select>
            <input type="number" class="p-age" placeholder="年龄" min="1" max="100">
            <button class="btn mini" title="删掉这个人" onclick="delPerson(this)">×</button>
          </div>
        </div>
      </div>

      <div class="seg">
        <div class="card-title"><span class="stepno">3</span>想重点看什么<span class="card-mini">（可多选，也可以不选）</span></div>
        <div class="chips" id="focusChips">
          <span class="chip" data-v="财运">财运</span>
          <span class="chip" data-v="健康">健康</span>
          <span class="chip" data-v="感情婚姻">感情婚姻</span>
          <span class="chip" data-v="事业">事业</span>
          <span class="chip" data-v="睡眠">睡眠</span>
          <span class="chip" data-v="孩子学业">孩子学业</span>
        </div>
        <textarea id="extra" style="margin-top:11px;" rows="3" placeholder="可写可不写。有图上看不出来的信息，写这里 AI 会优先采信：朝向（图上有指北针就不用写）、第几层、租的还是买的、装修能不能大动、家里有人身体不好之类的。"></textarea>
      </div>
    </div>

    <div class="card go">
      <button class="btn primary" id="btnGo" onclick="analyze()">AI 分析这个户型</button>
      <div class="state" id="state">传图 + 填好入住人，就能直接出结果</div>
      <details class="set">
        <summary>视觉模型设置（看图用的）</summary>
        <div class="apigrid">
          <label>服务商</label>
          <select id="vlProv">
            <option value="deepseek">DeepSeek（推荐 · 和全站同一个密钥）</option>
            <option value="zhipu">智谱</option>
            <option value="custom">自定义</option>
          </select>
          <label>接口地址</label><input type="text" id="vlBase" placeholder="https://api.deepseek.com">
          <label>密钥</label><input type="password" id="vlKey" placeholder="看图模型的密钥">
          <label>模型</label><input type="text" id="vlModel" placeholder="deepseek-flash">
          <div class="tip">看图要用「视觉模型」。DeepSeek 现在支持看图，<b>用你在别处填过的那个密钥就行</b>，不用另外充钱。如果提示「不支持图片」，把模型名改成 <b>deepseek-flash</b>。密钥只存你这台电脑。</div>
        </div>
      </details>
    </div>
    </div><!-- /右列 -->
   </div><!-- /checkgrid -->

    <div id="out"></div>

  </div>

  <div class="pane" id="paneBook">
    <iframe id="bookFrame" style="width:100%;height:calc(100vh - 138px);border:1px solid var(--line);border-radius:12px;display:block;background:#fff;"></iframe>
  </div>

</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var K = { vlBase:'ywVlBase', vlKey:'ywVlKey', vlModel:'ywVlModel' };
  function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  var bookLoaded = false;
  window.switchTab = function(t){
    $('tabCheck').className = 'tab' + (t==='check'?' on':'');
    $('tabBook').className = 'tab' + (t==='book'?' on':'');
    $('paneCheck').className = 'pane' + (t==='check'?' show':'');
    $('paneBook').className = 'pane' + (t==='book'?' show':'');
    if(t==='book' && !bookLoaded){ $('bookFrame').src = '户型图鉴.html?v=20260922d'; bookLoaded = true; }
  };

  window.addPerson = function(){
    var d = document.createElement('div');
    d.className = 'person';
    d.innerHTML = '<input type="text" class="p-name" placeholder="称呼（可空）">' +
      '<select class="p-sex"><option value="">性别</option><option>男</option><option>女</option></select>' +
      '<input type="number" class="p-age" placeholder="年龄" min="1" max="100">' +
      '<button class="btn mini" onclick="delPerson(this)">×</button>';
    $('persons').appendChild(d);
  };
  window.delPerson = function(btn){
    var box = $('persons');
    if(box.querySelectorAll('.person').length <= 1){ flash('至少要留一个入住人', 'bad'); return; }
    btn.parentNode.parentNode.removeChild(btn.parentNode);
  };

  Array.prototype.forEach.call(document.querySelectorAll('#focusChips .chip'), function(c){
    c.onclick = function(){ c.classList.toggle('on'); };
  });

  var fpData = null;
  window.onFp = function(file){
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var maxSide = 1568;
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxSide / Math.max(w, h));
        var cw = Math.round(w * scale), ch = Math.round(h * scale);
        var cv = document.createElement('canvas');
        cv.width = cw; cv.height = ch;
        cv.getContext('2d').drawImage(img, 0, 0, cw, ch);
        fpData = cv.toDataURL('image/jpeg', 0.85);
        $('fpImg').src = fpData;
        $('fpPreview').style.display = 'flex';
        $('fpDrop').style.display = 'none';
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };
  window.clearFp = function(){
    fpData = null;
    $('fpPreview').style.display = 'none';
    $('fpDrop').style.display = '';
    $('fpInp').value = '';
  };
  var drop = $('fpDrop');
  drop.addEventListener('dragover', function(e){ e.preventDefault(); });
  drop.addEventListener('drop', function(e){
    e.preventDefault();
    if(e.dataTransfer.files && e.dataTransfer.files[0]) onFp(e.dataTransfer.files[0]);
  });

  function flash(msg, kind){
    var el = $('state');
    el.innerHTML = kind==='bad' ? '<i>'+esc(msg)+'</i>' : (kind==='ok' ? '<b>'+esc(msg)+'</b>' : esc(msg));
  }

  var SYS = [
    '你是一位户型风水分析师，熟悉传统堪舆常识（八宅、门房灶三要、穿堂、门冲、缺角、厨厕方位等），但只说大白话，不打哑谜、不吓唬人。',
    '用户会给你一张户型图和入住人信息。看图分析，严格按以下分节输出，每节以【节名】单独成行开头，不要用 markdown 符号：',
    '',
    '【总评】',
    '两三句：这户型整体怎么样，一句话结论。',
    '',
    '【是否适合入住】',
    '三选一，只写其中一个词：适合 / 谨慎（有小问题可化解） / 不建议入住（有极严重问题）',
    '',
    '【利】',
    '3~6 条这个户型的好处，每条一行，格式「好处——为什么好」。',
    '',
    '【弊】',
    '图上能看出的问题，每条一行，格式「问题——影响什么」。要结合入住人的性别年龄说人话（比如家里有老人就提楼梯、潮湿、噪音）。',
    '',
    '【能改的】',
    '能靠装修或布置化解的，每条一行，格式「问题——具体怎么改」。改法要可执行、别玄乎。',
    '',
    '【不能改的】',
    '结构上动不了的，每条一行，格式「问题——为什么改不了 + 平时怎么弱化」。',
    '',
    '【严重警示】',
    '只列极严重、实打实影响居住的问题（如一开门正对卫生间、进门穿堂无遮挡、严重缺角等），每条一行并说明影响；一个都没有就写「无」。',
    '',
    '【给谁住】',
    '结合入住人，两三句：这套房更衬谁、谁要特别注意什么。'
  ].join('\n');

  var VL_PRESETS = {
    deepseek: { base:'https://api.deepseek.com', model:'deepseek-flash' },
    zhipu:    { base:'https://open.bigmodel.cn/api/paas/v4', model:'glm-4v-flash' },
    custom:   { base:'', model:'' }
  };
  function cfgVl(){
    return {
      base: ($('vlBase').value.trim() || VL_PRESETS.deepseek.base).replace(/\/+$/,''),
      key: $('vlKey').value.trim(),
      model: $('vlModel').value.trim() || VL_PRESETS.deepseek.model
    };
  }

  function collectPersons(){
    var arr = [];
    Array.prototype.forEach.call(document.querySelectorAll('#persons .person'), function(row){
      var name = row.querySelector('.p-name').value.trim();
      var sex = row.querySelector('.p-sex').value;
      var age = row.querySelector('.p-age').value.trim();
      if(!name && !sex && !age) return;
      arr.push((name||'入住人') + (sex? '，'+sex : '') + (age? '，'+age+'岁' : ''));
    });
    return arr;
  }

  var busy = false;
  window.analyze = function(){
    if(busy) return;
    if(!fpData){ flash('先把户型图传上来', 'bad'); return; }
    var persons = collectPersons();
    if(!persons.length){ flash('至少填一位入住人（性别、年龄）', 'bad'); return; }
    var c = cfgVl();
    if(!c.key){ flash('先点「视觉模型设置」，把看图模型的密钥填上（glm-4v-flash 免费）', 'bad'); return; }

    var focus = [];
    Array.prototype.forEach.call(document.querySelectorAll('#focusChips .chip.on'), function(c2){ focus.push(c2.getAttribute('data-v')); });
    var extra = $('extra').value.trim();

    var userText = '请分析这个户型。\n\n入住人：\n' + persons.map(function(p,i){ return (i+1) + '. ' + p; }).join('\n');
    if(focus.length) userText += '\n\n最关心：' + focus.join('、');
    if(extra) userText += '\n\n补充信息：' + extra;
    userText += '\n\n（附图为户型图，默认上为北；若图上有指北针以图为准。）';

    busy = true;
    $('btnGo').disabled = true;
    flash('AI 正在看图，通常十几秒到半分钟…');
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 120000) : null;
    fetch(c.base + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.key },
      body: JSON.stringify({
        model: c.model,
        temperature: 0.4,
        messages: [{
          role: 'user',
          content: [
            { type: 'image_url', image_url: { url: fpData } },
            { type: 'text', text: userText }
          ]
        },{
          role: 'system',
          content: SYS
        }]
      }),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function(r){
      if(timer) clearTimeout(timer);
      return r.json().catch(function(){ return {}; }).then(function(j){
        if(!r.ok){
          var m = (j && j.error && j.error.message) ? j.error.message : ('HTTP ' + r.status);
          if(r.status === 401) m = '密钥不对（401）——检查视觉模型密钥';
          else if(r.status === 402) m = '余额不足（402）';
          else if(r.status === 429) m = '请求太频繁（429），等一会儿再试';
          throw m;
        }
        var txt = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
        if(!txt) throw '模型回了空内容，再试一次';
        return txt;
      });
    }).then(function(txt){
      busy = false;
      $('btnGo').disabled = false;
      renderResult(txt);
      flash('分析完成', 'ok');
    }).catch(function(e){
      busy = false;
      $('btnGo').disabled = false;
      if(timer) clearTimeout(timer);
      var msg = (e && e.name === 'AbortError') ? '等太久放弃了（120 秒）' : String(e && e.message ? e.message : e);
      if(msg.indexOf('Failed to fetch') >= 0) msg = '连不上接口——检查网络，或确认视觉模型接口地址';
      flash(msg, 'bad');
    });
  };

  function renderResult(txt){
    var t = String(txt).replace(/^```[^\n]*$/gm,'').replace(/\*\*/g,'');
    var lines = t.split('\n');
    var secs = [], cur = null;
    for(var i=0;i<lines.length;i++){
      var ln = lines[i].trim();
      if(!ln) continue;
      var m = /^【(.{1,10})】\s*(.*)$/.exec(ln);
      if(m){
        cur = { name: m[1], rest: m[2] ? [m[2]] : [] };
        secs.push(cur);
      } else if(cur){
        cur.rest.push(ln);
      }
    }
    if(!secs.length){ $('out').innerHTML = '<div class="card" style="margin-top:12px;"><p style="margin:0;font-size:13px;white-space:pre-wrap;">'+esc(t)+'</p></div>'; return; }

    var WIDE = { '总评':1, '给谁住':1, '严重警示':1 };
    var verdict = '';
    var html = '';
    secs.forEach(function(s){
      var body = s.rest.join('\n');
      if(s.name.indexOf('适合入住') >= 0){ verdict = body; return; }
      var isBad = (s.name === '严重警示');
      var wide = !!WIDE[s.name];
      html += '<div class="sec'+(isBad?' bad':'')+(wide?' wide':'')+'"><h4>'+esc(s.name)+'</h4><p>'+esc(body)+'</p></div>';
    });
    var vc = '';
    if(verdict){
      var cls = /不建议/.test(verdict) ? 'bad' : (/谨慎/.test(verdict) ? 'mid' : 'ok');
      vc = '<div class="verdict '+cls+'">结论：'+esc(verdict)+'</div>';
    }
    $('out').innerHTML = vc + '<div class="card"><div class="secgrid">' + html + '</div></div>';
    try{ $('out').scrollIntoView({ behavior:'smooth', block:'start' }); }catch(e){}
  }

  (function(){
    var prov = lsGet('ywVlProv', 'deepseek');
    $('vlProv').value = prov;
    $('vlBase').value = lsGet(K.vlBase, VL_PRESETS[prov] ? VL_PRESETS[prov].base : VL_PRESETS.deepseek.base);
    $('vlModel').value = lsGet(K.vlModel, VL_PRESETS[prov] ? VL_PRESETS[prov].model : VL_PRESETS.deepseek.model);
    $('vlKey').value = lsGet(K.vlKey, '');
    $('vlProv').addEventListener('change', function(){
      var p = VL_PRESETS[$('vlProv').value] || VL_PRESETS.custom;
      lsSet('ywVlProv', $('vlProv').value);
      if(p.base){
        $('vlBase').value = p.base; $('vlModel').value = p.model;
        lsSet(K.vlBase, p.base); lsSet(K.vlModel, p.model);
      }
      // DeepSeek 的看图密钥跟全站文本密钥是同一个，自动带上
      if($('vlProv').value === 'deepseek' && !$('vlKey').value){
        try{ var k = localStorage.getItem('ywApiKey') || ''; if(k){ $('vlKey').value = k; lsSet(K.vlKey, k); } }catch(e){}
      }
    });
    $('vlBase').addEventListener('input', function(){ lsSet(K.vlBase, $('vlBase').value); });
    $('vlModel').addEventListener('input', function(){ lsSet(K.vlModel, $('vlModel').value); });
    $('vlKey').addEventListener('input', function(){ lsSet(K.vlKey, $('vlKey').value); });
    if(prov === 'deepseek' && !$('vlKey').value){
      try{ var k2 = localStorage.getItem('ywApiKey') || ''; if(k2){ $('vlKey').value = k2; } }catch(e){}
    }
  })();

})();
</script>
</body>
</html>
