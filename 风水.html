<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>户型检测 · 工作台</title>
<style>
:root{
  --bg:#f7f4ee; --card:#fffdf9; --ink:#3a3631; --sub:#8a837a;
  --line:#ece5da; --accent:#b8714e; --accent2:#5b8c7b; --mark:#f0e3d6;
  --noted:#3f9d6b; --warn:#d9822b; --bad:#c0392b;
  --radius:14px;
  --shadow:0 1px 3px rgba(58,54,49,.06), 0 10px 30px rgba(58,54,49,.05);
  --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6;-webkit-font-smoothing:antialiased;}
::selection{background:var(--mark);}
.page{max-width:860px;margin:0 auto;padding:16px 16px 40px;}

.tabs{display:flex;gap:8px;margin-bottom:14px;}
.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 18px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--sub);transition:.15s;}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.pane{display:none;}
.pane.show{display:block;}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;}
.card + .card{margin-top:12px;}
.card-title{font-size:13.5px;font-weight:700;margin-bottom:4px;}
.card-title .req{color:var(--bad);}
.card-sub{font-size:12px;color:var(--sub);line-height:1.7;margin-bottom:10px;}

.drop{border:2px dashed #d8cfc2;border-radius:12px;background:#fff;padding:26px 16px;text-align:center;color:var(--sub);font-size:13px;cursor:pointer;transition:.15s;display:block;line-height:2;}
.drop:hover{border-color:var(--accent);color:var(--accent);}
#fpImg{max-width:100%;max-height:420px;border-radius:10px;border:1px solid var(--line);display:block;margin:0 auto;}

.person{display:grid;grid-template-columns:1fr 110px 90px 34px;gap:8px;margin-bottom:8px;align-items:center;}
.person input,.person select,textarea,input[type=text],input[type=number],input[type=password],select{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-family:inherit;font-size:13px;padding:7px 10px;outline:none;width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
textarea{resize:vertical;line-height:1.7;display:block;}

.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:12.5px;cursor:pointer;color:var(--sub);transition:.15s;user-select:none;}
.chip.on{background:var(--mark);border-color:var(--accent);color:#8d5233;}

.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 15px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.primary:hover{background:#a05f3d;color:#fff;}
.btn.primary:disabled{opacity:.55;cursor:wait;}
.btn.mini{padding:4px 10px;font-size:12px;border-radius:8px;}

.actrow{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;}
.state{font-size:12.5px;color:var(--sub);}
.state b{color:var(--noted);}
.state i{font-style:normal;color:var(--bad);}

details.set summary{list-style:none;cursor:pointer;font-size:12.5px;color:var(--sub);user-select:none;}
details.set summary::-webkit-details-marker{display:none;}
details.set[open] summary{color:var(--accent);}
.apigrid{display:grid;grid-template-columns:82px minmax(0,1fr);gap:8px 10px;align-items:center;margin-top:10px;}
.apigrid label{font-size:12px;color:var(--sub);text-align:right;}
.tip{grid-column:1 / -1;font-size:11.5px;color:var(--sub);line-height:1.7;}

.verdict{border-radius:12px;padding:12px 16px;font-size:14px;font-weight:700;margin-top:12px;border:1px solid;}
.verdict.ok{background:#eaf3de;border-color:#cfe3b4;color:#3b6d11;}
.verdict.mid{background:#faeeda;border-color:#efd9ae;color:#8a5a12;}
.verdict.bad{background:#fcebeb;border-color:#eec3c3;color:#a32d2d;font-size:15.5px;}

.sec{margin-top:12px;border-left:3px solid #c98a63;background:#fdfaf6;border-radius:0 10px 10px 0;padding:11px 14px;}
.sec h4{margin:0 0 6px;font-size:13px;color:#8d5233;}
.sec.bad{border-left-color:var(--bad);background:#fdf3f3;}
.sec.bad h4{color:var(--bad);}
.sec p{margin:0;font-size:13px;line-height:2;color:#5b5148;white-space:pre-wrap;}
</style>
</head>
<body>
<div class="page">

  <div class="tabs">
    <button class="tab on" id="tabCheck" onclick="switchTab('check')">AI 户型检测</button>
    <button class="tab" id="tabBook" onclick="switchTab('book')">户型图鉴 · 参考</button>
  </div>

  <div class="pane show" id="paneCheck">

    <div class="card">
      <div class="card-title">第一步 · 上传户型图 <span class="req">*</span></div>
      <div class="card-sub">开发商户型图、手画的都行，拍清楚一点。AI 会直接看图分析。</div>
      <label class="drop" id="fpDrop">
        <input type="file" id="fpInp" accept="image/*" style="display:none;" onchange="onFp(this.files[0])">
        点击上传户型图（也可以直接把图拖进来）
      </label>
      <div id="fpPreview" style="margin-top:10px;display:none;">
        <img id="fpImg" alt="户型图预览">
        <div style="margin-top:6px;text-align:right;"><span class="btn mini" style="display:inline-block;cursor:pointer;" onclick="clearFp()">换一张</span></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">第二步 · 谁住进来 <span class="req">*</span></div>
      <div class="card-sub">几个人住、什么性别、多大年纪——同一套房，住的人不同，好坏完全不一样。</div>
      <div id="persons">
        <div class="person">
          <input type="text" class="p-name" placeholder="称呼（可空，如：我 / 老婆 / 儿子）">
          <select class="p-sex"><option value="">性别</option><option>男</option><option>女</option></select>
          <input type="number" class="p-age" placeholder="年龄" min="1" max="100">
          <button class="btn mini" title="删掉这个人" onclick="delPerson(this)">×</button>
        </div>
      </div>
      <button class="btn mini" onclick="addPerson()">+ 再加一个入住人</button>
    </div>

    <div class="card">
      <div class="card-title">第三步 · 想重点看什么（可多选，也可以不选）</div>
      <div class="chips" id="focusChips">
        <span class="chip" data-v="财运">财运</span>
        <span class="chip" data-v="健康">健康</span>
        <span class="chip" data-v="感情婚姻">感情婚姻</span>
        <span class="chip" data-v="事业">事业</span>
        <span class="chip" data-v="睡眠">睡眠</span>
        <span class="chip" data-v="孩子学业">孩子学业</span>
      </div>
      <textarea id="extra" style="margin-top:10px;" rows="3" placeholder="还想补充的写这里（可不填）：比如楼层、门朝向、附近有什么、装修能不能动……"></textarea>
    </div>

    <div class="card">
      <div class="actrow" style="margin-top:0;">
        <button class="btn primary" id="btnGo" style="padding:10px 26px;font-size:14px;" onclick="analyze()">AI 分析这个户型</button>
        <span class="state" id="state">传图 + 填好入住人，就能直接出结果</span>
        <span style="flex:1;"></span>
        <details class="set">
          <summary>视觉模型设置（看图用的）</summary>
          <div class="apigrid">
            <label>接口地址</label><input type="text" id="vlBase" placeholder="https://open.bigmodel.cn/api/paas/v4">
            <label>密钥</label><input type="password" id="vlKey" placeholder="看图模型的密钥">
            <label>模型</label><input type="text" id="vlModel" placeholder="glm-4v-flash">
            <div class="tip">看图需要「视觉模型」——文字模型（如 deepseek-chat）看不了图。默认用智谱 glm-4v-flash，<b>免费</b>：open.bigmodel.cn 注册就拿密钥。密钥只存你这台电脑。</div>
          </div>
        </details>
      </div>
    </div>

    <div id="out"></div>

  </div>

  <div class="pane" id="paneBook">
    <div class="card" style="padding:6px;">
      <iframe id="bookFrame" style="width:100%;height:78vh;border:0;border-radius:10px;display:block;"></iframe>
    </div>
  </div>

</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var K = { vlBase:'ywVlBase', vlKey:'ywVlKey', vlModel:'ywVlModel' };
  function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  var bookLoaded = false;
  window.switchTab = function(t){
    $('tabCheck').className = 'tab' + (t==='check'?' on':'');
    $('tabBook').className = 'tab' + (t==='book'?' on':'');
    $('paneCheck').className = 'pane' + (t==='check'?' show':'');
    $('paneBook').className = 'pane' + (t==='book'?' show':'');
    if(t==='book' && !bookLoaded){ $('bookFrame').src = '户型图鉴.html?v=20260922d'; bookLoaded = true; }
  };

  window.addPerson = function(){
    var d = document.createElement('div');
    d.className = 'person';
    d.innerHTML = '<input type="text" class="p-name" placeholder="称呼（可空）">' +
      '<select class="p-sex"><option value="">性别</option><option>男</option><option>女</option></select>' +
      '<input type="number" class="p-age" placeholder="年龄" min="1" max="100">' +
      '<button class="btn mini" onclick="delPerson(this)">×</button>';
    $('persons').appendChild(d);
  };
  window.delPerson = function(btn){
    var box = $('persons');
    if(box.querySelectorAll('.person').length <= 1){ flash('至少要留一个入住人', 'bad'); return; }
    btn.parentNode.parentNode.removeChild(btn.parentNode);
  };

  Array.prototype.forEach.call(document.querySelectorAll('#focusChips .chip'), function(c){
    c.onclick = function(){ c.classList.toggle('on'); };
  });

  var fpData = null;
  window.onFp = function(file){
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var maxSide = 1568;
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxSide / Math.max(w, h));
        var cw = Math.round(w * scale), ch = Math.round(h * scale);
        var cv = document.createElement('canvas');
        cv.width = cw; cv.height = ch;
        cv.getContext('2d').drawImage(img, 0, 0, cw, ch);
        fpData = cv.toDataURL('image/jpeg', 0.85);
        $('fpImg').src = fpData;
        $('fpPreview').style.display = 'block';
        $('fpDrop').style.display = 'none';
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };
  window.clearFp = function(){
    fpData = null;
    $('fpPreview').style.display = 'none';
    $('fpDrop').style.display = 'block';
    $('fpInp').value = '';
  };
  var drop = $('fpDrop');
  drop.addEventListener('dragover', function(e){ e.preventDefault(); });
  drop.addEventListener('drop', function(e){
    e.preventDefault();
    if(e.dataTransfer.files && e.dataTransfer.files[0]) onFp(e.dataTransfer.files[0]);
  });

  function flash(msg, kind){
    var el = $('state');
    el.innerHTML = kind==='bad' ? '<i>'+esc(msg)+'</i>' : (kind==='ok' ? '<b>'+esc(msg)+'</b>' : esc(msg));
  }

  var SYS = [
    '你是一位户型风水分析师，熟悉传统堪舆常识（八宅、门房灶三要、穿堂、门冲、缺角、厨厕方位等），但只说大白话，不打哑谜、不吓唬人。',
    '用户会给你一张户型图和入住人信息。看图分析，严格按以下分节输出，每节以【节名】单独成行开头，不要用 markdown 符号：',
    '',
    '【总评】',
    '两三句：这户型整体怎么样，一句话结论。',
    '',
    '【是否适合入住】',
    '三选一，只写其中一个词：适合 / 谨慎（有小问题可化解） / 不建议入住（有极严重问题）',
    '',
    '【利】',
    '3~6 条这个户型的好处，每条一行，格式「好处——为什么好」。',
    '',
    '【弊】',
    '图上能看出的问题，每条一行，格式「问题——影响什么」。要结合入住人的性别年龄说人话（比如家里有老人就提楼梯、潮湿、噪音）。',
    '',
    '【能改的】',
    '能靠装修或布置化解的，每条一行，格式「问题——具体怎么改」。改法要可执行、别玄乎。',
    '',
    '【不能改的】',
    '结构上动不了的，每条一行，格式「问题——为什么改不了 + 平时怎么弱化」。',
    '',
    '【严重警示】',
    '只列极严重、实打实影响居住的问题（如一开门正对卫生间、进门穿堂无遮挡、严重缺角等），每条一行并说明影响；一个都没有就写「无」。',
    '',
    '【给谁住】',
    '结合入住人，两三句：这套房更衬谁、谁要特别注意什么。'
  ].join('\n');

  function cfgVl(){
    return {
      base: ($('vlBase').value.trim() || 'https://open.bigmodel.cn/api/paas/v4').replace(/\/+$/,''),
      key: $('vlKey').value.trim(),
      model: $('vlModel').value.trim() || 'glm-4v-flash'
    };
  }

  function collectPersons(){
    var arr = [];
    Array.prototype.forEach.call(document.querySelectorAll('#persons .person'), function(row){
      var name = row.querySelector('.p-name').value.trim();
      var sex = row.querySelector('.p-sex').value;
      var age = row.querySelector('.p-age').value.trim();
      if(!name && !sex && !age) return;
      arr.push((name||'入住人') + (sex? '，'+sex : '') + (age? '，'+age+'岁' : ''));
    });
    return arr;
  }

  var busy = false;
  window.analyze = function(){
    if(busy) return;
    if(!fpData){ flash('先把户型图传上来', 'bad'); return; }
    var persons = collectPersons();
    if(!persons.length){ flash('至少填一位入住人（性别、年龄）', 'bad'); return; }
    var c = cfgVl();
    if(!c.key){ flash('先点「视觉模型设置」，把看图模型的密钥填上（glm-4v-flash 免费）', 'bad'); return; }

    var focus = [];
    Array.prototype.forEach.call(document.querySelectorAll('#focusChips .chip.on'), function(c2){ focus.push(c2.getAttribute('data-v')); });
    var extra = $('extra').value.trim();

    var userText = '请分析这个户型。\n\n入住人：\n' + persons.map(function(p,i){ return (i+1) + '. ' + p; }).join('\n');
    if(focus.length) userText += '\n\n最关心：' + focus.join('、');
    if(extra) userText += '\n\n补充信息：' + extra;
    userText += '\n\n（附图为户型图，默认上为北；若图上有指北针以图为准。）';

    busy = true;
    $('btnGo').disabled = true;
    flash('AI 正在看图，通常十几秒到半分钟…');
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 120000) : null;
    fetch(c.base + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.key },
      body: JSON.stringify({
        model: c.model,
        temperature: 0.4,
        messages: [{
          role: 'user',
          content: [
            { type: 'image_url', image_url: { url: fpData } },
            { type: 'text', text: userText }
          ]
        },{
          role: 'system',
          content: SYS
        }]
      }),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function(r){
      if(timer) clearTimeout(timer);
      return r.json().catch(function(){ return {}; }).then(function(j){
        if(!r.ok){
          var m = (j && j.error && j.error.message) ? j.error.message : ('HTTP ' + r.status);
          if(r.status === 401) m = '密钥不对（401）——检查视觉模型密钥';
          else if(r.status === 402) m = '余额不足（402）';
          else if(r.status === 429) m = '请求太频繁（429），等一会儿再试';
          throw m;
        }
        var txt = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
        if(!txt) throw '模型回了空内容，再试一次';
        return txt;
      });
    }).then(function(txt){
      busy = false;
      $('btnGo').disabled = false;
      renderResult(txt);
      flash('分析完成', 'ok');
    }).catch(function(e){
      busy = false;
      $('btnGo').disabled = false;
      if(timer) clearTimeout(timer);
      var msg = (e && e.name === 'AbortError') ? '等太久放弃了（120 秒）' : String(e && e.message ? e.message : e);
      if(msg.indexOf('Failed to fetch') >= 0) msg = '连不上接口——检查网络，或确认视觉模型接口地址';
      flash(msg, 'bad');
    });
  };

  function renderResult(txt){
    var t = String(txt).replace(/^```[^\n]*$/gm,'').replace(/\*\*/g,'');
    var lines = t.split('\n');
    var secs = [], cur = null;
    for(var i=0;i<lines.length;i++){
      var ln = lines[i].trim();
      if(!ln) continue;
      var m = /^【(.{1,10})】\s*(.*)$/.exec(ln);
      if(m){
        cur = { name: m[1], rest: m[2] ? [m[2]] : [] };
        secs.push(cur);
      } else if(cur){
        cur.rest.push(ln);
      }
    }
    if(!secs.length){ $('out').innerHTML = '<div class="card" style="margin-top:12px;"><p style="margin:0;font-size:13px;white-space:pre-wrap;">'+esc(t)+'</p></div>'; return; }

    var verdict = '';
    var html = '';
    secs.forEach(function(s){
      var body = s.rest.join('\n');
      if(s.name.indexOf('适合入住') >= 0){ verdict = body; return; }
      var isBad = (s.name === '严重警示');
      html += '<div class="sec'+(isBad?' bad':'')+'"><h4>'+esc(s.name)+'</h4><p>'+esc(body)+'</p></div>';
    });
    var vc = '';
    if(verdict){
      var cls = /不建议/.test(verdict) ? 'bad' : (/谨慎/.test(verdict) ? 'mid' : 'ok');
      vc = '<div class="verdict '+cls+'">结论：'+esc(verdict)+'</div>';
    }
    $('out').innerHTML = vc + '<div class="card" style="margin-top:12px;">' + html + '</div>';
    try{ $('out').scrollIntoView({ behavior:'smooth', block:'start' }); }catch(e){}
  }

  (function(){
    $('vlBase').value = lsGet(K.vlBase, 'https://open.bigmodel.cn/api/paas/v4');
    $('vlModel').value = lsGet(K.vlModel, 'glm-4v-flash');
    $('vlKey').value = lsGet(K.vlKey, '');
    $('vlBase').addEventListener('input', function(){ lsSet(K.vlBase, $('vlBase').value); });
    $('vlModel').addEventListener('input', function(){ lsSet(K.vlModel, $('vlModel').value); });
    $('vlKey').addEventListener('input', function(){ lsSet(K.vlKey, $('vlKey').value); });
  })();

})();
</script>
</body>
</html>
