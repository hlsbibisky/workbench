<style>
  /* 与「状态记录」模块保持一致的暖色宣纸风格 */
  :root{
    --bg:#f7f4ee; --card:#fffdf9; --ink:#3a3631; --sub:#8a837a;
    --line:#ece5da; --accent:#b8714e; --accent2:#5b8c7b; --mark:#f0e3d6;
    --noted:#3f9d6b;
    --radius:14px;
    --shadow:0 1px 3px rgba(58,54,49,.06), 0 10px 30px rgba(58,54,49,.05);
    --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; height:100dvh;}
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font); line-height:1.5; -webkit-font-smoothing:antialiased;
    overscroll-behavior:none; }
  ::selection{ background:var(--mark); }
  .app{ min-height:100vh; min-height:100dvh; }

  .app{ display:flex; min-height:100vh; }

  /* ===== 左侧导航栏 ===== */
  .sidebar{
    width:240px; flex:0 0 240px; background:var(--card);
    border-right:1px solid var(--line); padding:22px 14px;
    display:flex; flex-direction:column; gap:4px;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    position:relative;
    display:flex; align-items:center; gap:9px;
    padding:4px 4px 16px 24px; margin-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .brand-stack{
    display:flex; flex-direction:column; align-items:flex-start;
    font-weight:700; color:var(--accent); line-height:1.05;
  }
  .brand-tag, .brand-title{
    display:block;
  }
  .brand-tag{ font-size:22px; padding-bottom:3px; letter-spacing:0.05cm; }
  .brand-title{ font-size:22px; letter-spacing:0.1cm; }
  /* HLS 与工作台同为横排，左对齐即 H↔工；LS 顺 H 跟在后面，不与作台对齐 */
  .brand .dot{
    position:absolute; left:7px; top:25px;
    width:9px; height:9px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 0 4px rgba(184,113,78,.14);
  }
  .brand-en{ font-size:11px; font-weight:500; letter-spacing:1px; color:var(--sub);
    padding-bottom:2px; }
    font-size:10.5px; color:var(--sub); letter-spacing:1.5px; font-weight:400; white-space:nowrap; }

  .navlabel{ font-size:11px; color:var(--sub); letter-spacing:2px; padding:10px 12px 4px; }
  .navitem{
    position:relative;
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    border:none; background:transparent; color:var(--ink); padding:11px 14px;
    border-radius:11px; cursor:pointer; font-size:15px; transition:.16s;
    font-family:inherit; letter-spacing:1px;
  }
  .navitem:hover{ background:var(--mark); }
  .navitem.active{ background:var(--accent); color:#fff; font-weight:600;
    box-shadow:0 3px 12px rgba(184,113,78,.28); }
  .navitem.nav-alarm{ border-left:3px solid #d9822b; }
  .navitem.nav-alarm-red{ border-left:3px solid #c0392b; background:#fdf0ee; }
  .navitem .navbadge{ position:absolute; top:7px; right:10px; min-width:18px; height:18px;
    line-height:18px; text-align:center; background:#c0392b; color:#fff; font-size:11px;
    border-radius:9px; padding:0 5px; font-weight:700; }

  .sidefoot{
    margin-top:auto; font-size:11px; color:var(--sub); padding:14px 12px 0;
    border-top:1px solid var(--line); line-height:1.8;
  }
  .sync-box{ margin-top:10px; padding:10px; background:rgba(184,113,78,.06); border:1px solid var(--line); border-radius:10px; }
  .syncbtn{ display:inline-block; margin:2px 4px 2px 0; padding:6px 12px; background:#fff; color:var(--accent); border:1px solid var(--accent); border-radius:14px; cursor:pointer; font-size:12.5px; font-family:inherit; transition:.14s; }
  .syncbtn:hover{ background:var(--accent); color:#fff; }
  .sidefoot .stat{ color:var(--noted); font-weight:600; }

  /* ===== 主区 ===== */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }

  /* 顶栏 */
  .topbar{
    height:58px; flex:0 0 58px; display:flex; align-items:center; justify-content:space-between;
    padding:0 30px; border-bottom:1px solid var(--line); background:rgba(255,253,249,.6);
    backdrop-filter:blur(4px); position:sticky; top:0; z-index:5;
  }
  .crumb{ font-size:13.5px; color:var(--sub); letter-spacing:.5px; display:flex; align-items:center; gap:8px; }
  .crumb .sep{ color:var(--line); }
  .crumb .now{ color:var(--accent); font-weight:600; }
  .topright{ display:flex; align-items:center; gap:14px; font-size:13px; color:var(--sub); }
  .topright .hi{ color:var(--ink); font-weight:600; }
  #wbSaveBtn{ font-family:inherit; font-size:13px; font-weight:600; color:#fff; background:var(--accent);

    border:0; border-radius:9px; padding:7px 15px; cursor:pointer; box-shadow:0 2px 8px rgba(184,113,78,.25);
    display:inline-flex; align-items:center; gap:5px; transition:transform .12s, background .15s; }
  #wbSaveBtn:hover{ background:#a5613f; }
  #wbSaveBtn:active{ transform:scale(.96); }
  .wbsync-state{ font-size:12px; color:#8a7f70; margin-left:6px; white-space:nowrap; }
  .wbsync-state.ok{ color:#3aa76d; }
  .wbsync-state.err{ color:#c0392b; }
  .wbsync-state.off{ color:#a99c8c; }
  .wb-icon-btn{ font-family:inherit; font-size:12.5px; font-weight:500; color:var(--accent); background:#fff;
    border:1px solid var(--line); border-radius:9px; padding:6px 12px; cursor:pointer;
    display:inline-flex; align-items:center; gap:4px; transition:.14s; }
  .wb-icon-btn:hover{ background:var(--mark); border-color:var(--accent); }
  .topright label.wb-icon-btn input{ display:none; }
  .topright .clock{ font-variant-numeric:tabular-nums; color:var(--ink);
    background:var(--mark); padding:3px 11px; border-radius:20px; letter-spacing:.5px; }

  .content{ flex:1; padding:26px 30px 56px; min-width:0; display:flex; flex-direction:column; }

  .modhead{ margin-bottom:18px; flex:0 0 auto; }
  .modtitle{ font-size:22px; font-weight:700; margin:0 0 14px; letter-spacing:1px;
    display:flex; align-items:baseline; gap:12px; }
  .modtitle small{ font-size:13px; color:var(--sub); font-weight:400; letter-spacing:0; }

  /* 子模块 tab */
  .subtabs{ display:flex; gap:8px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  .subtab{
    display:inline-flex; align-items:center; gap:7px;
    border:1px solid var(--line); border-bottom:none; background:#fff; color:var(--sub);
    padding:9px 17px; border-radius:11px 11px 0 0; cursor:pointer; font-size:14px;
    transition:.16s; font-family:inherit; margin-bottom:-1px; letter-spacing:.5px;
  }
  .subtab:hover{ border-color:var(--accent); color:var(--accent); }
  .subtab.active{ background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  .subtab .pip{ width:6px; height:6px; border-radius:50%; background:var(--noted); }
  .subtab.active .pip{ background:#fff; }

  .modbody{ margin-top:18px; flex:1; min-height:0; display:flex; flex-direction:column; }
  .modbody > *{ animation:fade .26s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  /* iframe 容器 + 工具条 */
  .framebox{
    border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
    background:var(--card); box-shadow:var(--shadow);
    display:flex; flex-direction:column; flex:1; min-height:0;
  }
  .framebar{
    display:flex; align-items:center; justify-content:flex-end;
    padding:4px 14px; border-bottom:1px solid var(--line); background:var(--bg);
    min-height:0;
  }
  .framebar .fbtn{
    border:1px solid var(--line); background:#fff; color:var(--sub); cursor:pointer;
    width:30px; height:30px; border-radius:9px; display:grid; place-items:center; transition:.15s;
  }
  .framebar .fbtn:hover{ border-color:var(--accent); color:var(--accent); }
  .framebar .fbtn svg{ width:15px; height:15px; }
  .framebox iframe{ width:100%; flex:1; min-height:0; border:none; display:block; background:var(--bg); }

  /* 占位面板 */
  .placeholder{
    background:var(--card); border:1px dashed var(--line); border-radius:var(--radius);
    padding:52px 28px; text-align:center; color:var(--sub); box-shadow:var(--shadow);
  }
  .placeholder .ico{
    width:46px; height:46px; margin:0 auto 16px; border-radius:14px; background:var(--mark);
    display:grid; place-items:center; color:var(--accent);
  }
  .placeholder .ico svg{ width:24px; height:24px; }
  .placeholder h3{ color:var(--accent); font-size:18px; margin:0 0 10px; letter-spacing:1px; }
  .placeholder p{ font-size:14px; margin:6px auto; max-width:480px; line-height:1.7; }
  .placeholder .tag{ display:inline-block; margin-top:16px; font-size:11px; color:var(--sub);
    background:var(--mark); border-radius:12px; padding:4px 13px; letter-spacing:1px; }

  /* 窄屏：侧栏收窄但仍保留文字 */
  @media (max-width:880px){
    .sidebar{ width:132px; flex:0 0 132px; padding:18px 10px; }
    .brand{ justify-content:flex-start; padding:2px 0 14px; }
    .brand-title{ font-size:17px; }
    .brand-tag{ font-size:17px; padding-bottom:3px; }
    .brand .dot{ left:4px; top:21px; width:7px; height:7px;
      box-shadow:0 0 0 3px rgba(184,113,78,.14); }
    .brand-en{ display:none; }
    .navlabel{ display:none; }
    .navitem{ justify-content:flex-start; padding:11px 10px; }
    .sidefoot{ display:none; }
    .topbar, .content{ padding-left:18px; padding-right:18px; }
    .framebox iframe{ flex:1; min-height:0; }
  }
  /* === 手机：侧栏抽屉化 + 顶栏紧凑 + iframe 撑满 === */
  .wbmenu-btn{ display:none; }
  .menu-mask{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.32); z-index:50; }

  /* 手机：整个 sidebar 变成抽屉，从左侧滑出 */
  @media (max-width:680px){
    .app{ flex-direction:column; }
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; z-index:60; width:260px;
      flex-direction:column; align-items:stretch; gap:6px; padding:14px 8px 18px;
      border-right:1px solid var(--line); border-bottom:none;
      background:#fffdf9;
      box-shadow:0 0 24px rgba(0,0,0,.06);
      transform:translateX(-100%); transition:transform .28s ease;
      overflow-y:auto; -webkit-overflow-scrolling:touch;
    }
    body.menu-open .sidebar{ transform:translateX(0); }
    body.menu-open .menu-mask{ display:block; }
    .brand{ padding:0 6px 10px; border-bottom:1px solid var(--line); margin-bottom:8px; }
    .brand-stack{ font-size:17px; }
    .brand-tag, .brand-title{ font-size:17px; padding-bottom:2px; letter-spacing:1px; }
    .brand .dot{ left:7px; top:25px; width:7px; height:7px;
      box-shadow:0 0 0 3px rgba(184,113,78,.14); }
    .brand-en{ display:none; }
    .navlabel{ display:block; font-size:11px; padding:8px 10px 4px; color:var(--sub); }
    #navCommon, #navOther{
      display:flex; flex-direction:column; gap:2px;
      width:100%;
    }
    .navitem{
      width:100%; padding:10px 12px; font-size:14.5px; justify-content:flex-start;
    }
    .navitem .navbadge{ position:static; margin-left:8px; }

    /* 顶栏紧凑 */
    .topbar{
      padding:0 10px; height:44px; flex:0 0 44px; gap:8px;
    }
    .crumb{ font-size:12px; letter-spacing:0; gap:4px; min-width:0;
      flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .topright{ gap:6px; }
    .topright .wb-icon-btn{
      padding:4px 8px; font-size:11.5px; border-radius:8px;
    }
    /* 手机端只显示图标，不显示文字 */
    .wb-icon-btn .lbl{ display:none; }
    .wb-icon-btn .icn{ font-size:15px; line-height:1; }
    #wbSaveBtn{ padding:5px 9px; font-size:12px; border-radius:8px; }
    #wbSaveBtn .icn{ font-size:15px; line-height:1; }
    .wbsync-state{ display:none; }
    .topright .clock{ padding:2px 8px; font-size:11px; display:none; /* 极窄屏空 */ }
    .topright .hi{ display:none; }

    /* 汉堡按钮显示 */
    .wbmenu-btn{
      display:inline-grid; place-items:center; flex:0 0 auto;
      width:34px; height:34px; border:1px solid var(--line); background:#fff;
      border-radius:9px; cursor:pointer; color:var(--accent); padding:0;
      font-family:inherit;
    }
    .wbmenu-btn:active{ transform:scale(.94); }
    .wbmenu-btn svg{ width:18px; height:18px; }

    .content{ padding:14px 12px 36px; }
    .modtitle{ font-size:17px; letter-spacing:.5px; gap:8px; margin-bottom:10px; }
    .modhead{ margin-bottom:14px; }
    .framebox{ border-radius:10px; }
    .framebox iframe{ flex:1; min-height:0; width:100%; }
  }

  /* 极窄屏（≤420px）：再紧凑，副标题、按钮只图标、subtab 更紧凑 */
  @media (max-width:420px){
    .topbar{ height:40px; flex:0 0 40px; }
    .modtitle{ font-size:15px; gap:6px; }
    .modtitle small{ display:none; }
    .sidebar{ width:230px; padding:12px 6px 16px; }
    .subtab{ padding:7px 11px; font-size:12.5px; gap:5px; }
    .subtabs{ gap:5px; }
    .content{ padding:10px 10px 28px; }
  }



  /* ===== 顶栏全局搜索 ===== */
  .wbsearch{ position:relative; flex:0 1 220px; min-width:110px; max-width:260px; }
  .wbsearch input{ width:100%; border:1px solid var(--line); background:#fff; border-radius:10px; padding:7px 12px 7px 30px; font-size:13px; font-family:inherit; color:var(--ink); outline:none; transition:.15s; }
  .wbsearch input:focus{ border-color:var(--accent); }
  .wbsearch .sic{ position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:13px; color:var(--sub); pointer-events:none; }
  .wbresults{ position:absolute; top:calc(100% + 6px); right:0; width:330px; max-width:80vw; max-height:54vh; overflow:auto; background:#fffdf9; border:1px solid var(--line); border-radius:12px; box-shadow:0 16px 44px rgba(90,70,50,.22); display:none; z-index:150; }
  .wbresults.show{ display:block; }
  .wbr-group{ font-size:11px; color:var(--sub); letter-spacing:2px; padding:10px 14px 3px; }
  .wbr-item{ padding:8px 14px; cursor:pointer; font-size:13px; display:flex; gap:8px; align-items:baseline; }
  .wbr-item:hover{ background:var(--mark); }
  .wbr-item .rmod{ color:var(--accent); font-size:11.5px; flex:0 0 auto; }
  .wbr-item .rtxt{ color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
  .wbr-item mark{ background:none; color:var(--accent); font-weight:700; padding:0; }
  .wbr-empty{ padding:16px; font-size:12.5px; color:var(--sub); text-align:center; }
  @media (max-width:740px){ .wbsearch{ flex:0 1 130px; } }
  @media (max-width:420px){ .wbsearch{ flex:0 1 96px; } }

  /* 全站统一的 AI 接口设置 */
  .wbaimask{position:fixed;inset:0;z-index:200;background:rgba(58,50,42,.36);display:none;align-items:flex-start;justify-content:center;padding:44px 16px;overflow:auto;}
  .wbaimask.show{display:flex;}
  .wbaipanel{width:100%;max-width:430px;background:#fffdf9;border:1px solid #e8dccb;border-radius:14px;padding:18px 20px;box-shadow:0 16px 44px rgba(90,70,50,.24);}
  .wbaipanel h3{margin:0 0 4px;font-size:15px;color:#b8714e;}
  .wbaipanel .sub{font-size:12px;color:#8a837a;line-height:1.7;margin-bottom:12px;}
  .wbaipanel fieldset{border:1px solid #ece5da;border-radius:11px;padding:12px 14px;margin:0 0 12px;}
  .wbaipanel legend{font-size:12.5px;color:#b8714e;padding:0 6px;}
  .wbaigrid{display:grid;grid-template-columns:74px minmax(0,1fr);gap:8px 10px;align-items:center;}
  .wbaigrid label{font-size:12px;color:#8a837a;text-align:right;}
  .wbaigrid input{width:100%;box-sizing:border-box;border:1px solid #ece5da;border-radius:9px;background:#fff;color:#3a3631;font-family:inherit;font-size:13px;padding:7px 10px;outline:none;}
  .wbaigrid input:focus{border-color:#b8714e;}
  .wbaicheck{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#8a837a;margin-top:2px;}
  .wbaiacts{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;}
  .wbaiacts button{border:1px solid #ece5da;background:#fff;color:#3a3631;border-radius:10px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit;}
  .wbaiacts .pri{background:#b8714e;border-color:#b8714e;color:#fff;}
  .wbnudge{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(58,50,42,.9);color:#fff;font-size:13px;padding:9px 18px;border-radius:10px;z-index:300;opacity:0;transition:.2s;pointer-events:none;}
  .wbnudge.show{opacity:1;}
</style>

<script>

   仅当本地文件意外缺失（未部署/404）时，才回退到公共 CDN 兜底。 */
function wbLoadSupaFallback(){
  if(window.supabase) return;
  var urls=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2','https://unpkg.com/@supabase/supabase-js@2'];
  (function tryNext(i){
    if(i>=urls.length || window.supabase) return;
    var s=document.createElement('script'); s.src=urls[i];
    s.onload=function(){ if(!window.supabase && i+1<urls.length) tryNext(i+1); };
    s.onerror=function(){ if(i+1<urls.length) tryNext(i+1); };
    document.head.appendChild(s);
  })(0);
}
</script>

/* 抽屉菜单：手机端汉堡按钮打开/关闭，主区域点击/侧栏外点击也会关闭 */
(function(){
  function close(){ document.body.classList.remove('menu-open'); }
  function open(){  document.body.classList.add('menu-open'); }
  document.getElementById('wbMenuBtn').addEventListener('click', function(){
    document.body.classList.toggle('menu-open');
  });
  document.getElementById('wbMenuMask').addEventListener('click', close);
  /* 点侧栏里的 nav 项目后自动收起（但要等导航逻辑处理完再关） */
  document.addEventListener('click', function(e){
    var item = e.target.closest && e.target.closest('.navitem');
    if(item && document.body.classList.contains('menu-open')){
      /* 200ms 后关，让主页面有时间看见已切换到新模块 */
      setTimeout(close, 220);
    }
  });
  /* ESC 关闭 */
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape') close();
  });
})();
