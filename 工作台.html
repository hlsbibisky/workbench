;font-weight:600;}\n  .tpane{display:none;flex:1;min-height:0;overflow:auto;padding:12px;background:#fdfbf7;}\n  .tpane.show{display:block;}\n  #pane-chat{padding:0;}\n  #pane-chat.show{display:flex;flex-direction:column;}\n  .ttab .unread{display:none;margin-left:5px;background:var(--bad);color:#fff;border-radius:8px;padding:0 5px;font-size:10px;}\n  .ttab .unread.on{display:inline-block;}\n\n  .note-row{display:flex;align-items:flex-start;gap:7px;padding:7px 0;border-bottom:1px dashed var(--line);}\n  .note-row:last-child{border-bottom:none;}\n  .note-time{flex:0 0 48px;font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums;cursor:pointer;background:var(--mark);padding:2px 5px;border-radius:5px;text-align:center;}\n  .note-time:hover{background:var(--accent);color:#fff;}\n  .note-text{flex:1;font-size:12px;color:var(--ink);line-height:1.45;}\n  .note-text .tag{font-size:9.5px;color:var(--sub);background:#f0ebe3;padding:1px 4px;border-radius:5px;margin-right:4px;}\n  .note-del{flex:0 0 20px;color:var(--sub);cursor:pointer;font-size:14px;text-align:center;}\n  .note-del:hover{color:var(--bad);}\n  .addnote{display:flex;gap:5px;margin-top:8px;}\n  .addnote input{flex:1;border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:11.5px;font-family:inherit;}\n  .addnote input[type=\"time\"]{flex:0 0 70px;}\n  .addnote button{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;padding:5px 9px;cursor:pointer;font-size:11px;}\n\n  .aiarea textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:12px;font-family:inherit;resize:vertical;background:#fff;}\n  .aiarea textarea:focus{outline:none;border-color:var(--accent);}\n  .aiopts{display:flex;flex-direction:column;gap:6px;margin-top:8px;}\n  .aiopts input{width:100%;border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:11.5px;font-family:inherit;}\n  .hint{font-size:10.5px;color:var(--sub);line-height:1.5;margin-top:8px;background:#f5efe6;padding:7px;border-radius:7px;}\n  .hint b{color:var(--accent);}\n\n  /* 截图分析 */\n  .shot-drop{display:block;line-height:2.1;border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--sub);font-size:12px;background:#fff;cursor:pointer;transition:.14s;}\n  .shot-drop:hover{border-color:var(--accent);color:var(--accent);background:#fffbf7;}\n  .shot-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}\n  .shot-thumb{width:72px;height:48px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:pointer;}\n  .shot-row{padding:8px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:#fff;}\n  .shot-row .img{width:100%;border-radius:7px;margin-bottom:6px;}\n  .shot-row .txt{font-size:12px;color:var(--ink);line-height:1.5;}\n  .shot-row .meta{font-size:10px;color:var(--sub);margin-top:4px;}\n\n  /* 历史记录（每部影片一条：字幕 + AI 评论 + 进度） */\n  .rec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;}\n  .rec-head .cnt{font-size:12px;color:var(--sub);}\n  .rec-head .cnt b{color:var(--accent);}\n  .rec-card{padding:9px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;background:#fff;transition:.12s;}\n  .rec-card:hover{border-color:var(--accent);background:#fffbf7;}\n  .rec-card.open{border-color:var(--accent);background:#fffbf7;}\n  .rec-top{display:flex;gap:10px;cursor:pointer;}\n  .rec-poster{width:54px;flex:0 0 54px;aspect-ratio:3/4;background:var(--mark);border-radius:8px;overflow:hidden;display:grid;place-items:center;color:var(--sub);font-size:10px;text-align:center;}\n  .rec-poster img{width:100%;height:100%;object-fit:cover;}\n  .rec-info{flex:1;min-width:0;}\n  .rec-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n  .rec-date{font-size:10.5px;color:var(--sub);margin:2px 0 5px;}\n  .rec-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;}\n  .rec-bar span{display:block;height:100%;background:var(--accent2);}\n  .rec-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}\n  .rec-badge{font-size:10px;padding:1px 6px;border-radius:20px;background:#f2ece3;color:var(--sub);border:1px solid var(--line);}\n  .rec-badge.ok{background:#e7f2ec;color:#2f6f55;border-color:#cfe4d9;}\n  .rec-badge.warn{background:#fbf0e2;color:#a35f19;border-color:#f0dcc2;}\n  .rec-acts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;}\n  .mini{font-size:11px;padding:3px 9px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-family:inherit;transition:.12s;}\n  .mini:hover{border-color:var(--accent);color:var(--accent);}\n  .mini.danger:hover{border-color:var(--bad);color:var(--bad);}\n  .hist-cmts{display:none;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);max-height:280px;overflow:auto;}\n  .hist-cmts.show{display:block;}\n  .hist-cmt{display:flex;gap:8px;padding:5px 0;font-size:11.5px;line-height:1.5;}\n  .hist-cmt .t{flex:0 0 46px;color:var(--accent);font-variant-numeric:tabular-nums;font-size:11px;}\n  .hist-cmt .c{flex:1;color:var(--ink);}\n  .hist-sub{font-size:11px;color:var(--sub);padding:2px 0 6px;}\n\n  /* 弹窗 */\n  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100;}\n  .modal.show{display:flex;}\n  .mdialog{background:#faf7f1;max-width:480px;width:92%;border-radius:16px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:92vh;overflow:auto;}\n  .mdialog h3{margin:0 0 10px;font-size:17px;color:var(--accent);}\n  .mrow{margin-bottom:10px;}\n  .mrow label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px;}\n  .mrow input,.mrow select,.mrow textarea{width:100%;border:1px solid #ddd3c4;border-radius:8px;padding:8px;font-size:13px;font-family:inherit;}\n  .macts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}\n\n  /* 记录编辑：搜索候选 + 海报预览 */\n  .rec-preview{width:84px;height:112px;background:var(--mark);border-radius:8px;overflow:hidden;display:grid;place-items:center;color:var(--sub);font-size:10px;flex:0 0 84px;}\n  .rec-preview img{width:100%;height:100%;object-fit:cover;}\n  .rec-cands{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}\n  .cand{width:84px;cursor:pointer;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;transition:.12s;}\n  .cand:hover{border-color:var(--accent);}\n  .cand img{width:100%;height:112px;object-fit:cover;display:block;background:var(--mark);}\n  .cand-title{font-size:10px;padding:4px 5px;line-height:1.3;color:var(--ink);height:34px;overflow:hidden;}\n\n  @media (max-width:1100px){\n    .side-r{width:340px;}\n  }\n  @media (max-width:820px){\n    .side-r{display:none;}\n    .main{width:100%;}\n  }\n</style>\n</head>\n<body>\n\n<div class=\"topbar\">\n  <div class=\"brand\"><b>放映室</b><small>CINEMA</small></div>\n  <div class=\"topacts\">\n    <button class=\"btn primary\" onclick=\"document.getElementById('fileInp').click()\">📂 选择影片</button>\n    <input type=\"file\" class=\"fileinp\" id=\"fileInp\" accept=\"video/*,.mkv,.mp4,.m4v,.mov,.avi,.webm,.ts\" onchange=\"if(this.files[0])loadFile(this.files[0])\">\n    <button class=\"btn\" onclick=\"openAiCfg()\">⚙ AI配置</button>\n    <button class=\"btn\" onclick=\"openHelp()\">❓ 怎么用</button>\n  </div>\n</div>\n\n<div class=\"app\">\n  <!-- 中：16:9 播放器 -->\n  <main class=\"col main\">\n    <div class=\"player-wrap\" id=\"playerWrap\">\n      <div class=\"screen\" id=\"screen\" onclick=\"onScreenClick(event)\" ondblclick=\"toggleFull()\">\n        <video id=\"video\" controlsList=\"nodownload\"\n          ontimeupdate=\"onTimeUpdate()\" onloadedmetadata=\"onLoaded()\"\n          onplay=\"onPlayState()\" onpause=\"onPlayState()\" onended=\"onEnded()\"></video>\n        <div class=\"dropzone\">\n          <b>拖拽影片到这里</b>\n          <span>或点击右上角「选择影片」</span>\n        </div>\n      </div>\n      <div class=\"controls\">\n        <button class=\"playbtn\" id=\"playBtn\" onclick=\"togglePlay()\">▶</button>\n        <button class=\"cbtn\" onclick=\"skip(-10)\" title=\"快退 10 秒\">\n          <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M11 6v12L3 12l8-6z\"/><path d=\"M21 6v12l-8-6 8-6z\"/></svg>\n        </button>\n        <button class=\"cbtn\" onclick=\"skip(10)\" title=\"快进 10 秒\">\n          <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M13 6v12l8-6-8-6z\"/><path d=\"M3 6v12l8-6-8-6z\"/></svg>\n        </button>\n        <span class=\"time\" id=\"timeTxt\">00:00 / 00:00</span>\n        <div class=\"progress\" id=\"progress\" onclick=\"seek(event)\"><div class=\"bar\" id=\"bar\"></div></div>\n        <span class=\"movtitle\" id=\"movTitle\"></span>\n        <div class=\"vgroup\">\n          <button class=\"cbtn\" id=\"muteBtn\" onclick=\"toggleMute()\" title=\"静音 / 恢复音量\">\n            <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M4 9v6h4l5 4V5L8 9H4z\" fill=\"currentColor\" stroke=\"none\"/><path d=\"M17 9.5a4 4 0 010 5\"/><path d=\"M19.6 7a7.5 7.5 0 010 10\"/></svg>\n          </button>\n          <input type=\"range\" class=\"vol\" id=\"vol\" min=\"0\" max=\"1\" step=\"0.05\" value=\"1\" oninput=\"setVol(this.value)\" title=\"音量\">\n        </div>\n        <div class=\"bgroup\">\n          <span class=\"sunicon\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/></svg>\n          </span>\n          <input type=\"range\" class=\"bri\" id=\"bri\" min=\"0.5\" max=\"1.6\" step=\"0.05\" value=\"1\" oninput=\"setBri(this.value)\" title=\"画面亮度\">\n        </div>\n        <select class=\"speed\" id=\"speed\" onchange=\"setSpeed(this.value)\">\n          <option value=\"0.5\">0.5x</option><option value=\"0.75\">0.75x</option>\n          <option value=\"1\" selected>1x</option><option value=\"1.25\">1.25x</option>\n          <option value=\"1.5\">1.5x</option><option value=\"2\">2x</option>\n        </select>\n        <button class=\"cbtn\" id=\"lampBtn\" onclick=\"toggleLights()\" title=\"关灯（只留画面亮）\">\n          <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 00-3.5 10.9V16h7v-2.1A6 6 0 0012 3z\"/></svg>\n        </button>\n        <button class=\"cbtn\" id=\"fullBtn\" onclick=\"toggleFull()\" title=\"全屏\">\n          <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M4 9V4h5\"/><path d=\"M20 9V4h-5\"/><path d=\"M4 15v5h5\"/><path d=\"M20 15v5h-5\"/></svg>\n        </button>\n      </div>\n    </div>\n  </main>\n\n  <!-- 右：对话 + 功能标签 -->\n  <aside class=\"col side-r\">\n    <div class=\"bottom-tabs\">\n      <div class=\"tooltabs\">\n        <button class=\"ttab active\" onclick=\"switchTab('chat')\" data-tab=\"chat\">💬 对话<span class=\"unread\" id=\"chatUnread\"></span></button>\n        <button class=\"ttab\" onclick=\"switchTab('notes')\" data-tab=\"notes\">时间轴</button>\n        <button class=\"ttab\" onclick=\"switchTab('ai')\" data-tab=\"ai\">AI生成</button>\n        <button class=\"ttab\" onclick=\"switchTab('records')\" data-tab=\"records\">历史记录</button>\n      </div>\n\n      <div class=\"tpane show\" id=\"pane-chat\">\n        <div class=\"chat-wrap\">\n          <div class=\"chat-head\">\n            <span class=\"l\">🎭 AI 陪伴</span>\n            <span class=\"r\" id=\"aiStatus\">等待开始</span>\n          </div>\n          <div class=\"ai-body\" id=\"aiBody\">\n            <div class=\"ai-msg ai\">\n              <div class=\"when\">系统</div>\n              打开影片后，AI 会在这里陪你聊天。它不会挡住画面。\n            </div>\n          </div>\n          <div class=\"ai-input\">\n            <button class=\"micbtn\" id=\"micBtn\" onclick=\"toggleMic()\" title=\"点击说话\">🎤</button>\n            <input id=\"chatInp\" placeholder=\"打字或点击麦克风说话…\" onkeydown=\"if(event.key==='Enter')sendChat()\">\n            <button class=\"btn primary\" onclick=\"sendChat()\" style=\"padding:6px 12px;font-size:12px;\">发送</button>\n          </div>\n        </div>\n      </div>\n\n      <div class=\"tpane\" id=\"pane-notes\">\n        <div id=\"noteList\"><div class=\"empty-tip\" style=\"font-size:11.5px;color:var(--sub);text-align:center;padding:14px 0;\">还没有时间轴评论</div></div>\n        <div class=\"addnote\">\n          <input type=\"time\" id=\"noteTime\" step=\"1\">\n          <input type=\"text\" id=\"noteText\" placeholder=\"添加评论…\" onkeydown=\"if(event.key==='Enter')addNote()\">\n          <button onclick=\"addNote()\">+</button>\n        </div>\n      </div>\n\n      <div class=\"tpane\" id=\"pane-ai\">\n        <div style=\"display:flex;gap:8px;margin-bottom:10px;\">\n          <label class=\"btn\" style=\"flex:1;text-align:center;font-size:13px;padding:10px 0;cursor:pointer;margin:0;\">📝 上传字幕<input type=\"file\" class=\"fileinp\" accept=\".srt,.vtt\" onchange=\"onSubtitle(this.files[0])\"></label>\n          <label class=\"btn\" style=\"flex:1;text-align:center;font-size:13px;padding:10px 0;cursor:pointer;margin:0;\">🎬 上传截图<input type=\"file\" id=\"shotInp\" class=\"fileinp\" accept=\"image/*\" multiple onchange=\"onShotSelect(this.files)\"></label>\n        </div>\n        <div id=\"subInfo\" style=\"font-size:11px;color:var(--sub);margin-bottom:8px;\">有字幕就用字幕，AI 评论更准</div>\n        <div id=\"subMatch\"></div>\n        <div id=\"styleBox\" style=\"background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:10px;\">\n          <div style=\"font-size:12px;font-weight:600;margin-bottom:7px;\">评论风格</div>\n          <div style=\"display:flex;flex-direction:column;gap:6px;\">\n            <label style=\"display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);\">\n              <span style=\"width:30px;flex:none;\">长短</span>\n              <select id=\"stLen\" onchange=\"onStyleChange()\" style=\"flex:1;min-width:0;font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);\">\n                <option value=\"short\">精简 · 15~30 字</option>\n                <option value=\"normal\" selected>正常 · 25~70 字</option>\n                <option value=\"long\">话痨 · 40~110 字</option>\n              </select>\n            </label>\n            <label style=\"display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);\">\n              <span style=\"width:30px;flex:none;\">语气</span>\n              <select id=\"stTone\" onchange=\"onStyleChange()\" style=\"flex:1;min-width:0;font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);\">\n                <option value=\"friend\" selected>朋友吐槽 · 口语、有情绪</option>\n                <option value=\"serious\">认真聊 · 分析镜头与人物</option>\n                <option value=\"sharp\">毒舌刻薄 · 犀利带幽默</option>\n              </select>\n            </label>\n            <label style=\"display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);\">\n              <span style=\"width:30px;flex:none;\">密度</span>\n              <select id=\"stDens\" onchange=\"onStyleChange()\" style=\"flex:1;min-width:0;font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);\">\n                <option value=\"sparse\">克制 · 只挑最硬的干货</option>\n                <option value=\"normal\" selected>适中 · 值得聊的就聊</option>\n                <option value=\"dense\">密集 · 边角细节也聊</option>\n              </select>\n            </label>\n          </div>\n          <div id=\"styleHint\" style=\"font-size:11px;color:var(--sub);margin-top:7px;line-height:1.6;\"></div>\n        </div>\n        <div class=\"aiarea\">\n          <textarea id=\"plotText\" placeholder=\"把剧情简介、分集剧情或字幕文本粘贴到这里，AI 会生成时间轴评论。\"></textarea>\n          <button class=\"btn primary\" style=\"width:100%;margin-top:8px;padding:7px 0;\" onclick=\"genAiNotes()\" id=\"genBtn\">✨ 生成时间轴评论</button>\n          <div class=\"hint\">\n          <div class=\"hint\">\n            <b>AI 是怎么「看」电影的？</b><br>\n            先上传字幕（最准）或粘贴剧情，AI 会按 15 分钟一段通读全片，<b>只在真有讨论价值的地方发评论</b>——反转、伏笔、动机说不通、话外音、两难抉择、容易看漏的细节、镜头配乐在替角色说话；平淡的过场它一句都不说。关键桥段会连着来几条。<b>不设固定条数</b>，全看片子本身有多少值得聊的。如果连续 20 分钟一个字都没有，系统会自动补一轮，不会让你干等。播放到对应时间，评论会像聊天消息一样出现在「💬 对话」页，不飘屏、不弹幕。截图上传后 AI 会看图点评。API Key 在右上角「AI配置」里填一次即可。\n          </div>\n          </div>\n        </div>\n        <div class=\"shot-preview\" id=\"shotPreview\"></div>\n        <div id=\"shotList\"></div>\n      </div>\n\n      <div class=\"tpane\" id=\"pane-records\">\n        <div class=\"rec-head\">\n          <span class=\"cnt\">已存档 <b id=\"recCount\">0</b> 部 · AI 评论 <b id=\"notesCount\">0</b> 条</span>\n          <button class=\"btn primary\" style=\"padding:5px 10px;font-size:12px;\" onclick=\"openEditor(null)\">＋ 新建</button>\n        </div>\n        <div class=\"hint\" style=\"margin:0 0 10px;\">\n          每部影片的字幕、AI 评论、播放进度都自动存在这里。<b>刷新或下次打开，点卡片就能调出来，不用重新生成（少花钱）。</b>\n        </div>\n        <div id=\"recList\"></div>\n      </div>\n    </div>\n  </aside>\n</div>\n\n<!-- 帮助弹窗 -->\n<div class=\"modal\" id=\"helpModal\" onclick=\"if(event.target===this)closeHelp()\">\n  <div class=\"mdialog\">\n    <h3>放映室使用说明</h3>\n    <p style=\"font-size:13px;color:var(--sub);line-height:1.7;margin:0 0 12px;\">\n      1. 点击右上角「选择影片」或直接把影片拖进画面，支持 mp4 / mkv / webm / avi 等格式。<br><br>\n      2. 播放器控制条：播放/暂停、快退 10 秒、快进 10 秒、进度条、音量、画面亮度、倍速、关灯（只留画面亮）、全屏。点画面可暂停，双击画面进全屏。<br><br>\n      3. 右侧标签：<b>💬 对话</b>（AI 和你聊天，麦克风与输入框在这里）、时间轴、AI生成、<b>历史记录</b>。<br><br>\n      4. 「AI生成」页最上面是「上传字幕 / 上传截图」两个按钮：字幕(.srt/.vtt)最准，AI 会按片长分段把整部电影评论一次写好；没字幕也可粘贴剧情文本。填好 API Key（右上角「AI配置」）后一键生成。<br><br>\n      5. 播放时，到点的 AI 评论会像聊天消息一样出现在「对话」页；你也可以在那里打字或点 🎤 说话，AI 会结合当前播放位置真实回复。<br><br>\n      6. <b>「历史记录」每部影片一条档</b>：字幕、AI 评论、播放进度都自动存下来。刷新、关掉浏览器、下次再打开，点卡片上的「继续观看」重选一次文件，评论和字幕就全回来了 —— <b>不用重新生成，也就不会再花钱</b>。点卡片本身还能直接看这部片的全部评论。<br><br>\n      7. 「上传截图」让 AI 看图点评；若影片画面在走却完全没声音，多半是 mkv 里的 DTS/AC3 音轨浏览器解不了，建议转成 MP4（H.264+AAC）。\n    </p>\n    <div class=\"macts\"><button class=\"btn primary\" onclick=\"closeHelp()\">知道了</button></div>\n  </div>\n</div>\n\n<!-- AI配置弹窗 -->\n<div class=\"modal\" id=\"cfgModal\" onclick=\"if(event.target===this)closeAiCfg()\">\n  <div class=\"mdialog\">\n    <h3>AI 配置</h3>\n    <div class=\"mrow\"><label>API 端点</label><input id=\"cfgEndpoint\" placeholder=\"https://api.deepseek.com\"></div>\n    <div class=\"mrow\"><label>模型</label><input id=\"cfgModel\" placeholder=\"deepseek-flash\"></div>\n    <div class=\"mrow\"><label>API Key</label><input id=\"cfgKey\" type=\"password\" placeholder=\"sk-...\"></div>\n    <div class=\"mrow\"><label>实时视觉分析间隔（秒，0=关闭）</label><input id=\"cfgVision\" type=\"number\" min=\"0\" step=\"5\" placeholder=\"0\"></div>\n    <div class=\"hint\">实时视觉分析会定时截图并调用多模态模型，费用较高，默认关闭。</div>\n    <div class=\"macts\">\n      <button class=\"btn\" onclick=\"closeAiCfg()\">取消</button>\n      <button class=\"btn primary\" onclick=\"saveAiCfg()\">保存</button>\n    </div>\n  </div>\n</div>\n\n<!-- 观影记录编辑弹窗 -->\n<div class=\"modal\" id=\"recModal\" onclick=\"if(event.target===this)closeRecModal()\">\n  <div class=\"mdialog\">\n    <h3>观影记录</h3>\n    <div class=\"mrow\"><label>片名</label><input id=\"recTitle\" placeholder=\"电影名称\"></div>\n    <div class=\"mrow\">\n      <label>联网搜索海报（输入片名，自动获取海报 / 简介）</label>\n      <div style=\"display:flex;gap:8px;\">\n        <input id=\"recSearch\" placeholder=\"如 盗梦空间 / Inception\">\n        <button class=\"btn\" onclick=\"doSearch()\" style=\"white-space:nowrap;\">🔍 搜索</button>\n      </div>\n    </div>\n    <div class=\"rec-cands\" id=\"recCands\"></div>\n    <div class=\"mrow\">\n      <label>海报（搜索自动获取，或手动上传）</label>\n      <div style=\"display:flex;gap:10px;align-items:center;\">\n        <div class=\"rec-preview\" id=\"recPreview\">无海报</div>\n        <label class=\"btn\">📤 上传海报<input type=\"file\" class=\"fileinp\" accept=\"image/*\" onchange=\"onRecUpload(this)\"></label>\n      </div>\n    </div>\n    <div class=\"mrow\"><label>观看日期</label><input id=\"recDate\" type=\"date\"></div>\n    <div class=\"mrow\"><label>观看进度 <span id=\"recProgLabel\">100%</span></label>\n      <input id=\"recProg\" type=\"range\" min=\"0\" max=\"100\" value=\"100\" oninput=\"recProgLabel.textContent=this.value+'%'\">\n    </div>\n    <div class=\"mrow\"><label>年份 / 导演（可选）</label><input id=\"recYear\" placeholder=\"如 2010 / 克里斯托弗·诺兰\"></div>\n    <div class=\"mrow\"><label>剧情简介（可选）</label></div>\n    <div class=\"mrow\"><textarea id=\"recPlot\" rows=\"3\" placeholder=\"可留空，联网搜索后会自动填入\"></textarea></div>\n    <div class=\"macts\">\n      <button class=\"btn\" onclick=\"deleteRecord()\" id=\"recDel\">删除</button>\n      <button class=\"btn primary\" onclick=\"saveRecord()\">保存</button>\n    </div>\n  </div>\n</div>\n\n<script>\n/* ================= 数据层 =================\n   存储模型（2026-09-23 重构）：\n     cinema_movie_<文件id>  —— 一部影片一条：片名/海报/日期/字幕原文/AI评论（重，只在内容变化时写）\n     cinema_prog_<文件id>   —— 播放进度（轻，独立存，避免播放中反复重写大记录）\n     文件 id = 文件名 + '_' + 文件字节数 → 重选同一部片能找回全部内容\n   ========================================== */\nconst LS_PREFIX='cinema_';\nconst K_CFG=LS_PREFIX+'ai_cfg';\nconst K_RECORDS=LS_PREFIX+'records';     /* 旧版观影记录：仅用于一次性迁移，不再写入 */\nconst K_MOVIE=LS_PREFIX+'movie_';\nconst K_PROG=LS_PREFIX+'prog_';\nlet state={\n  file:null, url:null, currentId:null, recordId:null,\n  meta:{title:'',info:'',plot:''},\n  notes:[], shown:new Set(), visionTimer:null,\n  editingId:null, recPoster:null,\n  subtitle:[], subtitleRaw:'',\n  pendingId:null,        /* 从历史记录点「继续观看」时记下 id，选到文件后自动把档挂上 */\n  lastProgSave:0\n};\nlet saveWarned=false;\n\nfunction lsGet(k){ try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;} }\nfunction lsSet(k,v){\n  try{ localStorage.setItem(k,JSON.stringify(v)); notifyParent(); return true; }\n  catch(e){\n    /* 绝不静默失败：存储满时必须让用户知道，否则会出现「填了但没存下」的假象 */\n    if(!saveWarned){ saveWarned=true; alert('本机存储空间不足，这次没能保存成功。\\n可先在工作台里清理不用的记录，再重试。数据没损坏，只是这一步没落盘。'); }\n    console.error('[cinema] 保存失败',k,e);\n    return false;\n  }\n}\nfunction lsDel(k){ try{ localStorage.removeItem(k); notifyParent(); }catch(e){} }\nfunction notifyParent(){ try{parent.postMessage({type:'wb-data-changed'},'*');}catch(e){} }\n\ntry{ if(!window.__wbStorageHooked){\nvar _oS=Storage.prototype.setItem, _oR=Storage.prototype.removeItem;\nStorage.prototype.setItem=function(k,v){ var r=_oS.apply(this,arguments); try{ if(!window.__syncSilent && String(k).indexOf('cinema_prog_')!==0) notifyParent(); }catch(e){} return r; };\nStorage.prototype.removeItem=function(k){ var r=_oR.apply(this,arguments); try{ notifyParent(); }catch(e){} return r; };\nwindow.__wbStorageHooked=true; } }catch(e){}\n\nfunction loadCfg(){\n  let cfg=lsGet(K_CFG)||{};\n  try{\n    if(!cfg.key) cfg.key=localStorage.getItem('ywApiKey')||'';\n    if(!cfg.endpoint) cfg.endpoint=localStorage.getItem('ywApiBase')||'';\n    if(!cfg.model || cfg.model==='deepseek-flash') cfg.model=localStorage.getItem('ywApiModel')||cfg.model;\n  }catch(e){}\n  cfg.endpoint=(cfg.endpoint||'https://api.deepseek.com').replace(/\\/+$/,'');\n  if(cfg.endpoint.indexOf('/chat/completions')<0) cfg.endpoint=cfg.endpoint+'/chat/completions';\n  cfg.model=cfg.model||'deepseek-flash';\n  cfg.key=cfg.key||'';\n  cfg.vision=cfg.vision||0;\n  return cfg;\n}\nfunction saveCfg(cfg){ lsSet(K_CFG,cfg); }\n\n/* ===== 影片档 ===== */\nfunction movieKey(id){ return K_MOVIE+id; }\nfunction progKey(id){ return K_PROG+id; }\nfunction loadMovie(id){\n  const m=lsGet(movieKey(id))||{};\n  if(m.deleted) return;                        /* 墓碑：已删除的不载入（正常路径点不到，保底） */\n  /* 兼容旧版结构（标题曾存在 meta.title 里） */\n  const t=m.title||(m.meta&&m.meta.title)||'';\n  state.meta={title:t,info:'',plot:m.plot||(m.meta&&m.meta.plot)||''};\n  state.notes=Array.isArray(m.notes)?m.notes:[];\n  state.recPoster=m.poster||null;\n  state.subtitleRaw=m.subtitleRaw||'';\n  state.subtitle=state.subtitleRaw?parseSubtitleText(state.subtitleRaw):[];\n  state.subOffset=m.subOffset||0;                 /* 上次校过的整体平移要接着用 */\n  if(state.subOffset) state.subtitle=state.subtitle.map(c=>({start:Math.max(0,c.start+state.subOffset),text:c.text}));\n  state.pendingId=null;\n  updateSubInfo();\n  renderSubMatch();\n}\n/* 把当前内存里的状态写回影片档；extra 可覆盖/补充字段 */\nfunction saveMovie(extra){\n  if(!state.currentId) return false;\n  const old=lsGet(movieKey(state.currentId))||{};\n  const rec=Object.assign({},old,{\n    v:2,\n    id:state.currentId,\n    deleted:0,                                  /* 又用上这部片了 → 撤销删除标记 */\n    title:(state.meta&&state.meta.title)||old.title||'',\n    plot:(state.meta&&state.meta.plot)||old.plot||'',\n    notes:state.notes||[],\n    subtitleRaw:state.subtitleRaw||'',\n    subCount:(state.subtitle||[]).length,\n    updated:Date.now()\n  });\n  if(extra) Object.assign(rec,extra);\n  const ok=lsSet(movieKey(state.currentId),rec);\n  if(ok) renderHistory();\n  return ok;\n}\nfunction saveProgress(force){\n  if(!state.currentId) return;\n  const dur=(isFinite(video.duration)&&video.duration>0)?video.duration:0;\n  if(!dur) return;\n  const now=Date.now();\n  if(!force && now-state.lastProgSave<30000) return;\n  state.lastProgSave=now;\n  const cur=video.currentTime||0;\n  try{ localStorage.setItem(progKey(state.currentId),JSON.stringify({pct:Math.min(100,Math.round(cur/dur*100)),pos:Math.round(cur),at:now})); }catch(e){}\n}\n/* 扫描本机所有影片档（单一口径，不设索引，避免两份数据不一致） */\nfunction movieList(){\n  const out=[];\n  try{\n    for(let i=0;i<localStorage.length;i++){\n      const k=localStorage.key(i);\n      if(k.indexOf(K_MOVIE)!==0) continue;\n      const id=k.slice(K_MOVIE.length);\n      if(!id) continue;\n      let m=null; try{ m=JSON.parse(localStorage.getItem(k)); }catch(e){ continue; }\n      if(!m||typeof m!=='object') continue;\n      if(m.deleted) continue;                    /* 墓碑：已删除的影片不再显示 */\n      let p=null; try{ p=JSON.parse(localStorage.getItem(progKey(id))); }catch(e){}\n      out.push({\n        id, title:m.title||(m.meta&&m.meta.title)||'(未命名影片)', poster:m.poster||null,\n        date:m.date||'', year:m.year||'', plot:m.plot||(m.meta&&m.meta.plot)||'',\n        notes:Array.isArray(m.notes)?m.notes:[],\n        subCount:m.subCount||((m.subtitle&&m.subtitle.length)||0), duration:m.duration||0,\n        pct:(p&&typeof p.pct==='number')?p.pct:(m.pct||0),\n        updated:m.updated||0\n      });\n    }\n  }catch(e){}\n  out.sort((a,b)=>b.updated-a.updated);\n  return out;\n}\nfunction delHistory(id){\n  const m=lsGet(movieKey(id))||{};\n  if(!confirm('确定删除《'+(m.title||'这条记录')+'》的存档？\\n其中的字幕和 AI 评论会一起删掉，无法恢复。')) return;\n  /* ★ 墓碑式删除（2026-09-24 修复「删了过一天又跳回来」）\n     过去这里直接把键删掉，结果云同步的「并集合并」一看：本机没数据、云端有 →\n     当成「你缺数据」，好心把云端旧记录补回来，删除就白做了。\n     现在改成留一个极小的删除标记（只有片名 + 删除时间戳），重数据（字幕/评论/海报）全部清掉释放空间；\n     云同步看到墓碑就知道这是「主动删的」，不会再回填。 */\n  const ts=Date.now();\n  /* 注意：lsSet 内部会自己 JSON.stringify，这里必须传对象，不能先转成字符串（会被二次编码） */\n  lsSet(movieKey(id),{v:2,id:id,title:m.title||'',deleted:ts,updated:ts});\n  lsDel(progKey(id));\n  if(state.currentId===id){ state.notes=[]; state.subtitle=[]; state.subtitleRaw=''; renderNotes(); updateSubInfo(); }\n  closeRecModal(); renderHistory();\n  /* 被工作台 iframe 承载时，通知外壳立刻推一次，把墓碑同步到云端和其他设备 */\n  if(window.parent!==window){ try{ window.parent.postMessage({type:'wb-data-changed'},'*'); }catch(e){} }\n}\n/* 旧版「观影记录」（cinema_records）一次性迁移进影片档，原键保留不动 */\nfunction migrateLegacyRecords(){\n  const arr=lsGet(K_RECORDS);\n  if(!Array.isArray(arr)||!arr.length) return;\n  let n=0;\n  arr.forEach(r=>{\n    if(!r||!r.title) return;\n    const id='legacy_'+r.id;\n    if(lsGet(movieKey(id))) return;\n    lsSet(movieKey(id),{\n      v:2,id,title:r.title,poster:r.poster||null,year:r.year||'',plot:r.plot||'',\n      date:r.date||'',duration:r.duration||0,notes:[],subtitleRaw:'',subCount:0,\n      updated:r.updated||Date.now()\n    });\n    if(r.progress) lsSet(progKey(id),{pct:r.progress,pos:0,at:r.updated||Date.now()});\n    n++;\n  });\n  if(n) console.log('[cinema] 已迁移旧观影记录',n,'条');\n}\n\n/* ================= UI ================= */\nconst $=id=>document.getElementById(id);\nconst video=$('video'), playBtn=$('playBtn'), timeTxt=$('timeTxt'), bar=$('bar'), progress=$('progress');\n\nfunction fmt(sec){\n  if(!isFinite(sec)) return '00:00';\n  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=Math.floor(sec%60);\n  const p=n=>String(n).padStart(2,'0');\n  return h>0 ? `${p(h)}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;\n}\n/* 只接受纯数字时间（mm:ss / hh:mm:ss）；解析不出就返回 -1，调用方必须丢弃，\n   绝不能再像旧版那样返回 0 —— 那会把一批评论全塞到片头然后互相覆盖掉。\n   ⚠ 分钟必须允许三位以上：1 小时 48 分既可以写成 \"108:30\" 也可以写成 \"01:48:30\"，\n   旧正则只吃两位 → 100 分钟之后的评论会被全部丢掉，后半部凭空消失。 */\nfunction parseTime(t){\n  const s=String(t==null?'':t).trim();\n  const m=s.match(/^(\\d{1,4}):(\\d{1,2})(?::(\\d{1,2}))?$/);\n  if(!m) return -1;\n  if(m[3]!==undefined) return (+m[1])*3600+(+m[2])*60+(+m[3]);\n  return (+m[1])*60+(+m[2]);\n}\nfunction todayStr(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }\nfunction esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }\n\nfunction renderNotes(){\n  const list=$('noteList');\n  if(!state.notes.length){ list.innerHTML='<div class=\"empty-tip\" style=\"font-size:11.5px;color:var(--sub);text-align:center;padding:14px 0;\">还没有时间轴评论</div>'; return; }\n  const sorted=[...state.notes].sort((a,b)=>a.time-b.time);\n  list.innerHTML=sorted.map(n=>`\n    <div class=\"note-row\">\n      <div class=\"note-time\" onclick=\"seekTo(${n.time})\">${fmt(n.time)}</div>\n      <div class=\"note-text\"><span class=\"tag\">${n.type==='ai'?'AI':'我'}</span>${esc(n.text)}</div>\n      <div class=\"note-del\" onclick=\"delNote('${n.id}')\">×</div>\n    </div>\n  `).join('');\n}\n\n/* ================= 历史记录（= 观影记录 + AI 存档） ================= */\nfunction fmtDate(ts){\n  if(!ts) return '—';\n  const d=new Date(ts), p=n=>String(n).padStart(2,'0');\n  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;\n}\nfunction updateSubInfo(){\n  const el=$('subInfo'); if(!el) return;\n  const n=(state.subtitle||[]).length;\n  el.textContent = n ? `已载入 ${n} 条字幕（已存档，刷新不会丢）` : '有字幕就用字幕，AI 评论更准';\n}\nfunction renderHistory(){\n  const el=$('recList'); if(!el) return;\n  const arr=movieList();\n  let noteTotal=0; arr.forEach(m=>noteTotal+=m.notes.length);\n  if($('recCount')) $('recCount').textContent=arr.length;\n  if($('notesCount')) $('notesCount').textContent=noteTotal;\n  if(!arr.length){\n    el.innerHTML='<div class=\"empty-tip\" style=\"font-size:11.5px;color:var(--sub);text-align:center;padding:14px 0;\">还没有存档。加载影片、上传字幕后会自动出现在这里。</div>';\n    return;\n  }\n  el.innerHTML=arr.map(m=>{\n    const aiN=m.notes.filter(n=>n.type==='ai').length;\n    const myN=m.notes.length-aiN;\n    const isCur=(m.id===state.currentId);\n    return `\n    <div class=\"rec-card${isCur?' open':''}\" id=\"hcard-${esc(m.id)}\">\n      <div class=\"rec-top\" onclick=\"toggleHistory('${esc(m.id)}')\">\n        <div class=\"rec-poster\">${m.poster?`<img src=\"${m.poster}\" onerror=\"this.parentNode.innerHTML='无海报'\">`:'无海报'}</div>\n        <div class=\"rec-info\">\n          <div class=\"rec-title\">${esc(m.title)}${isCur?' <span class=\"rec-badge ok\">正在看</span>':''}</div>\n          <div class=\"rec-date\">观看：${esc(m.date||'—')}${m.year?(' · '+esc(m.year)):''} · 进度 ${m.pct||0}%</div>\n          <div class=\"rec-bar\"><span style=\"width:${m.pct||0}%\"></span></div>\n          <div class=\"rec-badges\">\n            ${aiN?`<span class=\"rec-badge ok\">AI 评论 ${aiN} 条</span>`:`<span class=\"rec-badge warn\">还没生成 AI 评论</span>`}\n            ${myN?`<span class=\"rec-badge\">我写的 ${myN} 条</span>`:''}\n            ${m.subCount?`<span class=\"rec-badge ok\">字幕 ${m.subCount} 条</span>`:`<span class=\"rec-badge\">无字幕</span>`}\n            <span class=\"rec-badge\">更新 ${fmtDate(m.updated)}</span>\n          </div>\n          <div class=\"rec-acts\">\n            <button class=\"mini\" onclick=\"event.stopPropagation();resumeMovie('${esc(m.id)}')\">▶ 继续观看</button>\n            <button class=\"mini\" onclick=\"event.stopPropagation();openEditor('${esc(m.id)}')\">片名/海报</button>\n            <button class=\"mini danger\" onclick=\"event.stopPropagation();delHistory('${esc(m.id)}')\">删除</button>\n          </div>\n        </div>\n      </div>\n      <div class=\"hist-cmts\" id=\"hcmt-${esc(m.id)}\"></div>\n    </div>`;\n  }).join('');\n}\n/* 展开某部影片的评论清单（不加载影片也能看） */\nfunction toggleHistory(id){\n  const box=$('hcmt-'+id), card=$('hcard-'+id);\n  if(!box) return;\n  const show=!box.classList.contains('show');\n  box.classList.toggle('show',show);\n  if(card) card.classList.toggle('open',show);\n  if(!show) return;\n  const m=lsGet(movieKey(id))||{};\n  const ns=(Array.isArray(m.notes)?m.notes:[]).slice().sort((a,b)=>a.time-b.time);\n  let html='';\n  if(m.subtitleRaw) html+=`<div class=\"hist-sub\">字幕已存档（${m.subCount||0} 条）——重新生成评论不用再传一次字幕。</div>`;\n  html+= ns.length\n    ? ns.map(n=>`<div class=\"hist-cmt\"><div class=\"t\">${fmt(n.time)}</div><div class=\"c\">${n.type==='ai'?'':'<b>[我]</b> '}${esc(n.text)}</div></div>`).join('')\n    : '<div class=\"hist-sub\">这部片还没有评论。到「AI生成」页上传字幕生成一次，会一直存在这里。</div>';\n  if(ns.length){\n    const mn=fmt(ns[0].time), mx=fmt(ns[ns.length-1].time);\n    html+=`<div class=\"hist-sub\" style=\"margin-top:8px;\">共 ${ns.length} 条，覆盖 ${mn} – ${mx}</div>`;\n  }\n  html+='<div class=\"rec-acts\" style=\"margin-top:8px;\">'\n      + `<button class=\"mini\" onclick=\"restoreToPlayer('${esc(id)}')\">载入到播放器</button>`\n      + `</div>`;\n  box.innerHTML=html;\n}\n/* 把某部影片的存档调回内存（评论 + 字幕），不要求立刻选文件 */\nfunction restoreToPlayer(id){\n  const m=lsGet(movieKey(id))||{};\n  state.pendingId=id;\n  state.currentId=id;\n  loadMovie(id);\n  if(!state.meta.title) state.meta.title=m.title||'';\n  state.shown.clear();\n  $('movTitle').textContent=state.meta.title||'';\n  renderNotes(); updateSubInfo(); renderHistory(); switchTab('chat');\n  const tail=state.notes.length ? '，播放到对应时间会自动出现。' : '。到「AI生成」页生成一次，以后就能一直用。';\n  aiSay('系统',`已调出《${state.meta.title||'这部片'}》的存档：AI 评论 ${state.notes.length} 条、字幕 ${state.subtitle.length} 条${tail}`);\n}\n/* 从历史记录点「继续观看」：先记下 id，选到文件后自动挂上（文件名变了也能认） */\nfunction resumeMovie(id){\n  const m=lsGet(movieKey(id))||{};\n  state.pendingId=id;\n  switchTab('chat');\n  aiSay('系统',`请选择《${m.title||'这部片'}》的影片文件（点右上角「选择影片」，或把文件拖进画面）。选好后评论和字幕会自动挂上，不用重新生成。`);\n  try{ $('fileInp').value=''; $('fileInp').click(); }catch(e){}\n}\n\n/* 编辑弹窗（片名 / 海报 / 年份 / 简介 / 进度） */\nfunction openEditor(id){\n  state.editingId=id||null;\n  state.recPoster=null;\n  if(id){\n    const m=lsGet(movieKey(id));\n    if(!m) return;\n    const p=lsGet(progKey(id))||{};\n    $('recTitle').value=m.title||'';\n    $('recDate').value=m.date||todayStr();\n    const pct=(typeof p.pct==='number')?p.pct:(m.pct||0);\n    $('recProg').value=pct; $('recProgLabel').textContent=pct+'%';\n    $('recYear').value=m.year||'';\n    $('recPlot').value=m.plot||'';\n    state.recPoster=m.poster||null;\n    $('recPreview').innerHTML=m.poster?`<img src=\"${m.poster}\">`:'无海报';\n    $('recDel').style.display='';\n  }else{\n    $('recTitle').value=''; $('recDate').value=todayStr();\n    $('recProg').value=100; $('recProgLabel').textContent='100%';\n    $('recYear').value=''; $('recPlot').value='';\n    $('recPreview').innerHTML='无海报';\n    $('recDel').style.display='none';\n  }\n  $('recSearch').value=''; $('recCands').innerHTML='';\n  $('recModal').classList.add('show');\n}\nfunction closeRecModal(){ $('recModal').classList.remove('show'); }\nfunction onRecUpload(inp){\n  const f=inp.files[0]; if(!f) return;\n  const r=new FileReader();\n  r.onload=()=>{ state.recPoster=r.result; $('recPreview').innerHTML=`<img src=\"${r.result}\">`; };\n  r.readAsDataURL(f);\n}\nfunction saveRecord(){\n  const title=$('recTitle').value.trim();\n  if(!title){ alert('请填写片名'); return; }\n  const pct=parseInt($('recProg').value,10)||0;\n  const fields={\n    title, poster:state.recPoster||null,\n    date:$('recDate').value||todayStr(),\n    year:$('recYear').value.trim(),\n    plot:$('recPlot').value.trim()\n  };\n  if(state.editingId){\n    const m=lsGet(movieKey(state.editingId))||{v:2,notes:[],subtitleRaw:'',subCount:0};\n    lsSet(movieKey(state.editingId),Object.assign({},m,fields,{id:state.editingId,updated:Date.now()}));\n    lsSet(progKey(state.editingId),Object.assign({},lsGet(progKey(state.editingId))||{},{pct,at:Date.now()}));\n  }else{\n    const id='m_'+Date.now();\n    lsSet(movieKey(id),Object.assign({v:2,id,duration:0,notes:[],subtitleRaw:'',subCount:0,updated:Date.now()},fields));\n    lsSet(progKey(id),{pct,pos:0,at:Date.now()});\n  }\n  closeRecModal(); renderHistory();\n}\nfunction deleteRecord(){\n  if(!state.editingId) return;\n  delHistory(state.editingId);\n}\n\n/* 联网搜索海报（维基百科，免 Key） */\nasync function wikiSearch(name,lang){\n  const q=encodeURIComponent(name);\n  const url=`https://${lang}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${q}&gsrlimit=6&prop=pageimages|extracts&exintro&explaintext&exlimit=max&pithumbsize=400&format=json&origin=*&redirects=1`;\n  const res=await fetch(url);\n  if(!res.ok) throw new Error('网络错误 '+res.status);\n  const data=await res.json();\n  const pages=data.query && data.query.pages ? Object.values(data.query.pages) : [];\n  return pages\n    .sort((a,b)=>(a.index||0)-(b.index||0))\n    .map(p=>({ title:p.title, poster:p.thumbnail?p.thumbnail.source:null, extract:(p.extract||'').trim() }))\n    .filter(p=>p.poster);\n}\nasync function wikiSearchAll(name){\n  let r=await wikiSearch(name,'zh');\n  if(r.length<1) r=await wikiSearch(name,'en');\n  return r;\n}\nasync function doSearch(){\n  const name=$('recSearch').value.trim();\n  if(!name){ alert('请输入片名'); return; }\n  $('recCands').innerHTML='<div class=\"empty-tip\" style=\"font-size:11px;color:var(--sub);\">搜索中…</div>';\n  try{\n    const list=await wikiSearchAll(name);\n    if(!list.length){ $('recCands').innerHTML='<div class=\"empty-tip\" style=\"font-size:11px;color:var(--sub);\">未找到匹配，可直接上传海报</div>'; return; }\n    window.__cands=list;\n    $('recCands').innerHTML=list.map((p,i)=>`\n      <div class=\"cand\" onclick=\"pickCand(${i})\">\n        <img src=\"${p.poster}\" onerror=\"this.style.visibility='hidden'\">\n        <div class=\"cand-title\">${esc(p.title)}</div>\n      </div>`).join('');\n  }catch(e){\n    $('recCands').innerHTML='<div class=\"empty-tip\" style=\"font-size:11px;color:var(--sub);\">搜索失败（可能离线）：可直接上传海报</div>';\n  }\n}\nfunction pickCand(i){\n  const p=window.__cands[i]; if(!p) return;\n  $('recTitle').value=p.title;\n  state.recPoster=p.poster;\n  $('recPreview').innerHTML=`<img src=\"${p.poster}\">`;\n  if(p.extract) $('recPlot').value=p.extract.slice(0,400);\n  const y=(p.extract||'').match(/(?:19|20)\\d{2}/);\n  if(y) $('recYear').value=y[0];\n}\n\n/* ================= 播放器控制 ================= */\nfunction loadFile(file){\n  if(!file) return;\n  if(state.url) URL.revokeObjectURL(state.url);\n  state.file=file;\n  state.url=URL.createObjectURL(file);\n  video.src=state.url;\n  video.load();\n  $('screen').classList.add('has-video');\n  const id=file.name+'_'+file.size;                 /* 文件 id：重选同一部片能找回全部存档 */\n  const title=file.name.replace(/\\.[^.]+$/,'');\n  const pend=state.pendingId; state.pendingId=null; /* 从历史记录点「继续观看」时带过来的 id */\n  state.lastProgSave=0;\n  let msg='';\n  if(lsGet(movieKey(id))){\n    /* 这部片有存档：评论 / 字幕 / 海报 全部恢复 */\n    state.currentId=id;\n    loadMovie(id);\n    if(!state.meta.title) state.meta.title=title;\n    state.shown.clear();\n    $('movTitle').textContent=state.meta.title;\n    clearAi();\n    if(state.notes.length || state.subtitle.length){\n      msg=`已恢复《${state.meta.title}》的存档：AI 评论 ${state.notes.length} 条、字幕 ${state.subtitle.length} 条。播放到对应时间会自动出现，不用重新生成。`;\n    }else{\n      msg=`已加载影片：${state.meta.title}`;\n    }\n    aiSay('系统',msg);\n  }else if(pend && lsGet(movieKey(pend))){\n    /* 用户是从历史记录里点进来的，但文件名/大小变了 —— 把存档挂过来 */\n    state.currentId=id;\n    loadMovie(pend);\n    if(!state.meta.title) state.meta.title=title;\n    const oldProg=lsGet(progKey(pend));\n    saveMovie({date:todayStr()});                   /* 先写新键，成功后再清旧键，避免丢数据 */\n    if(oldProg) lsSet(progKey(id),oldProg);\n    lsDel(movieKey(pend)); lsDel(progKey(pend));\n    state.shown.clear();\n    $('movTitle').textContent=state.meta.title;\n    clearAi();\n    aiSay('系统',`已把历史记录挂到这部影片上（AI 评论 ${state.notes.length} 条、字幕 ${state.subtitle.length} 条）。播放即可，不用重新生成。`);\n  }else{\n    state.currentId=id;\n    state.meta={title,info:'',plot:''};\n    state.notes=[]; state.subtitle=[]; state.subtitleRaw='';\n    state.recPoster=null;\n    state.shown.clear();\n    $('movTitle').textContent=title;\n    clearAi();\n    saveMovie({date:todayStr(),duration:(isFinite(video.duration)&&video.duration>0)?video.duration:0});\n    aiSay('系统',`已加载影片：${title}。上传字幕生成评论后会自动存进「历史记录」，下次点一下就能调出，不用重复花钱生成。`);\n  }\n  renderNotes(); updateSubInfo(); renderHistory();\n  saveMovie({duration:(isFinite(video.duration)&&video.duration>0)?video.duration:0,date:todayStr()});\n  renderHistory();\n}\n\n$('fileInp').addEventListener('change',e=>{ if(e.target.files[0]) loadFile(e.target.files[0]); });\nwindow.addEventListener('dragover',e=>{ e.preventDefault(); });\nwindow.addEventListener('drop',e=>{\n  e.preventDefault();\n  const f=e.dataTransfer.files[0];\n  if(f && f.type.startsWith('video/')) loadFile(f);\n});\n\nfunction togglePlay(){ if(video.paused) video.play(); else video.pause(); }\nfunction onPlayState(){\n  playBtn.textContent=video.paused?'▶':'❚❚';\n  if(video.paused){ document.querySelector('.main').classList.remove('idle'); saveProgress(true); }\n  else pokeControls();\n}\nfunction onScreenClick(e){ if(e.target.closest('.dropzone')) return; togglePlay(); }\nfunction setSpeed(v){ video.playbackRate=parseFloat(v); }\nfunction skip(s){\n  if(!isFinite(video.duration)) return;\n  video.currentTime=Math.max(0,Math.min(video.duration, video.currentTime+s));\n  pokeControls();\n}\nfunction toggleMute(){\n  video.muted=!video.muted;\n  $('muteBtn').classList.toggle('on',video.muted);\n  $('vol').value=video.muted?0:(video.volume||1);\n}\nfunction setVol(v){\n  video.volume=Math.max(0,Math.min(1,parseFloat(v)));\n  video.muted=video.volume===0;\n  $('muteBtn').classList.toggle('on',video.muted);\n}\nfunction setBri(v){ video.style.filter='brightness('+v+')'; }\nfunction toggleLights(){\n  document.body.classList.toggle('lights-off');\n  $('lampBtn').classList.toggle('on',document.body.classList.contains('lights-off'));\n}\nfunction toggleFull(){\n  const el=$('playerWrap');\n  if(!document.fullscreenElement){ if(el.requestFullscreen) el.requestFullscreen(); }\n  else if(document.exitFullscreen){ document.exitFullscreen(); }\n}\ndocument.addEventListener('fullscreenchange',()=>{\n  $('fullBtn').classList.toggle('on',!!document.fullscreenElement);\n});\n/* 鼠标不动 3 秒淡出控制条 */\nlet idleTimer=null;\nfunction pokeControls(){\n  const m=document.querySelector('.main');\n  if(!m) return;\n  m.classList.remove('idle');\n  clearTimeout(idleTimer);\n  idleTimer=setTimeout(()=>{ if(!video.paused) m.classList.add('idle'); },3000);\n}\ndocument.addEventListener('mousemove',pokeControls);\n/* 音轨解码检测：画面在走、音频却一帧都没解出来 */\nlet audioWarned=false;\nfunction checkAudio(){\n  if(audioWarned || video.paused || video.muted || video.volume===0) return;\n  if(video.currentTime<8) return;\n  const dec=video.webkitAudioDecodedByteCount;\n  if(typeof dec==='number' && dec===0){\n    audioWarned=true;\n    aiSay('系统','⚠ 这段影片画面在播，但音频一帧都没解出来，说明它的音轨浏览器解不了（mkv 里常见的 DTS、TrueHD 音轨就是这样，属于浏览器解码器的限制）。建议把它转成 MP4（H.264 视频 + AAC 音频）再放，视频不用重编，转换很快。');\n  }\n}\nfunction onLoaded(){\n  timeTxt.textContent=`00:00 / ${fmt(video.duration)}`;\n  audioWarned=false;\n  saveMovie({duration:(isFinite(video.duration)&&video.duration>0)?video.duration:0,date:todayStr()});\n  renderSubMatch();          /* 影片时长出来了，匹配检测才有得比 */\n}\nfunction onTimeUpdate(){\n  const cur=video.currentTime, dur=video.duration||1;\n  timeTxt.textContent=`${fmt(cur)} / ${fmt(video.duration)}`;\n  bar.style.width=(cur/dur*100)+'%';\n  saveProgress(false);      /* 进度独立存，内部节流：最多每 30 秒写一次，不拖累同步 */\n  checkNotes(cur);\n  checkAudio();\n}\nfunction onEnded(){ saveProgress(true); }\nfunction seek(e){\n  const rect=progress.getBoundingClientRect();\n  const p=(e.clientX-rect.left)/rect.width;\n  video.currentTime=p*(video.duration||0);\n  saveProgress(true);\n}\nfunction seekTo(t){ video.currentTime=t; if(video.paused) video.play(); }\n\n/* ================= 时间轴评论 ================= */\nfunction checkNotes(cur){\n  state.notes.forEach(n=>{\n    if(state.shown.has(n.id)) return;\n    if(Math.abs(cur-n.time)<=0.5){\n      state.shown.add(n.id);\n      aiSay((n.type==='ai'?'AI':'我'), n.text, fmt(n.time));\n    }\n  });\n}\nfunction addNote(){\n  const t=$('noteTime').value, txt=$('noteText').value.trim();\n  if(!t || !txt) return;\n  const sec=parseTime(t);\n  if(sec<0) return;\n  state.notes.push({id:Date.now()+'',time:sec,text:txt,type:'manual'});\n  saveMovie(); renderNotes();\n  $('noteText').value='';\n}\nfunction delNote(id){\n  state.notes=state.notes.filter(n=>n.id!==id);\n  saveMovie(); renderNotes();\n}\n\n/* ================= AI 面板 ================= */\nlet unread=0;\nlet curTab='chat';\nfunction bumpUnread(who){\n  if(who!=='AI' && who!=='系统') return;\n  if(curTab==='chat') return;\n  unread++;\n  const el=$('chatUnread');\n  if(el){ el.textContent=(unread>9?'9+':String(unread)); el.classList.add('on'); }\n}\nfunction clearAi(){ $('aiBody').innerHTML=''; }\nfunction aiSay(who, text, when){\n  const body=$('aiBody');\n  const div=document.createElement('div');\n  div.className='ai-msg '+(who==='我'?'user':'ai');\n  div.innerHTML=(when?`<div class=\"when\">${esc(who)} · ${when}</div>`:`<div class=\"when\">${esc(who)}</div>`)+esc(text);\n  body.appendChild(div);\n  body.scrollTop=body.scrollHeight;\n  $('aiStatus').textContent=who==='AI'?'AI 刚刚发言':'等待开始';\n  bumpUnread(who);\n}\nfunction sendChat(){\n  const inp=$('chatInp'), txt=inp.value.trim(); if(!txt) return;\n  aiSay('我', txt);\n  inp.value='';\n  chatWithAI(txt);\n}\n/* 真实调用 AI 聊天（含「问这一幕」隐藏上下文） */\nasync function chatWithAI(userText){\n  const cfg=loadCfg();\n  const key=cfg.key;\n  const model=cfg.model||'deepseek-flash';\n  const endpoint=cfg.endpoint||'https://api.deepseek.com';\n  if(!key){\n    aiSay('AI','（还没配置 AI：点右上角「AI配置」填 API Key，我就能真的陪你聊了。现在先用本地模式。）');\n    return;\n  }\n  // 隐藏上下文：当前影片 + 播放位置 + 附近字幕 + 附近的 AI 评论（仅之前内容）\n  let ctx=`当前影片：${state.meta.title||'未命名'}`;\n  if(isFinite(video.duration)&&video.duration>0) ctx+=`；当前播放位置：${fmt(video.currentTime)} / ${fmt(video.duration)}`;\n  const near=nearbySubtitle(video.currentTime);\n  if(near) ctx+=`；当前附近字幕（之前内容）：${near}`;\n  const nearNotes=nearbyNotes(video.currentTime);\n  if(nearNotes) ctx+=`；刚刚出现过的 AI 评论：${nearNotes}`;\n  try{\n    const sys=`你是陪用户看电影的 AI 朋友，语气像朋友一样自然。${ctx}。只依据用户给出的信息和影片上下文回答；不确定就说不确定，不要编造或剧透未播到的情节。`;\n    const res=await fetch(endpoint,{\n      method:'POST',\n      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},\n      body:JSON.stringify({model:model,messages:[{role:'system',content:sys},{role:'user',content:userText}],temperature:0.8})\n    });\n    if(!res.ok) throw new Error('API '+res.status);\n    const data=await res.json();\n    const txt=data.choices?.[0]?.message?.content?.trim()||'（AI 没有返回内容）';\n    aiSay('AI', txt);\n  }catch(e){\n    aiSay('AI','（调用 AI 失败：'+e.message+'）');\n  }\n}\n/* 取当前播放点之前的邻近字幕（供「问这一幕」用，稍后字幕上传后生效） */\nfunction nearbySubtitle(t){\n  if(!state.subtitle || !state.subtitle.length) return '';\n  const before=state.subtitle.filter(c=>c.start<=t).slice(-3);\n  return before.map(c=>`[${fmt(c.start)}] ${c.text}`).join('  ');\n}\n/* 取播放点前后 ±3 分钟内的 AI 评论（最多 4 条）——用户接话时让 AI 知道「刚才说了什么」 */\nfunction nearbyNotes(t){\n  const ai=(state.notes||[]).filter(n=>n.type==='ai' && Math.abs(n.time-t)<=180)\n    .sort((a,b)=>a.time-b.time).slice(0,4);\n  return ai.map(n=>`[${fmt(n.time)}] ${n.text}`).join('  ');\n}\n\n/* ================= 标签切换 ================= */\nfunction switchTab(name){\n  curTab=name;\n  document.querySelectorAll('.ttab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));\n  document.querySelectorAll('.tpane').forEach(p=>p.classList.toggle('show',p.id==='pane-'+name));\n  if(name==='chat'){\n    unread=0;\n    const el=$('chatUnread');\n    if(el){ el.textContent=''; el.classList.remove('on'); }\n    const body=$('aiBody');\n    if(body) body.scrollTop=body.scrollHeight;\n  }\n  pokeControls();\n}\nfunction openHelp(){$('helpModal').classList.add('show');}\nfunction closeHelp(){$('helpModal').classList.remove('show');}\nfunction openAiCfg(){\n  const cfg=loadCfg();\n  $('cfgEndpoint').value=cfg.endpoint;\n  $('cfgModel').value=cfg.model;\n  $('cfgKey').value=cfg.key;\n  $('cfgVision').value=cfg.vision;\n  $('cfgModal').classList.add('show');\n}\nfunction closeAiCfg(){$('cfgModal').classList.remove('show');}\nfunction saveAiCfg(){\n  saveCfg({\n    endpoint:$('cfgEndpoint').value.trim(),\n    model:$('cfgModel').value.trim(),\n    key:$('cfgKey').value.trim(),\n    vision:parseInt($('cfgVision').value||'0',10)\n  });\n  closeAiCfg();\n  setupVision();\n}\n\n/* ================= AI 生成时间轴 ================= */\n/* 调一次 AI，并从中解析出 JSON 数组 */\nasync function callJson(endpoint,model,key,prompt){\n  const res=await fetch(endpoint,{\n    method:'POST',\n    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},\n    body:JSON.stringify({model:model,messages:[{role:'user',content:prompt}],temperature:0.85})\n  });\n  if(!res.ok) throw new Error('API '+res.status);\n  const data=await res.json();\n  let text=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||'';\n  text=text.replace(/```json/g,'').replace(/```/g,'').trim();\n  const s=text.indexOf('['), e=text.lastIndexOf(']');\n  if(s>=0 && e>s) text=text.slice(s,e+1);\n  const arr=JSON.parse(text);\n  if(!Array.isArray(arr)) throw new Error('返回格式不是数组');\n  return arr;\n}\n/* ================= 评论风格旋钮 =================\n   三个下拉框 → 拼进提示词。改了风格要重新生成才生效（旧评论不会被改写）。\n   存 localStorage 键 cinema_note_style，纯本机偏好，不进云同步包。 */\nconst STYLE_KEY='cinema_note_style';\nconst STYLE_DEF={len:'normal', tone:'friend', dens:'normal'};\nfunction loadStyle(){\n  try{ const o=JSON.parse(localStorage.getItem(STYLE_KEY)||'{}');\n       return {len:o.len||STYLE_DEF.len, tone:o.tone||STYLE_DEF.tone, dens:o.dens||STYLE_DEF.dens}; }\n  catch(e){ return Object.assign({},STYLE_DEF); }\n}\nfunction saveStyle(o){ try{ localStorage.setItem(STYLE_KEY,JSON.stringify(o)); }catch(e){} }\nfunction syncStyleUI(){\n  const st=loadStyle();\n  if($('stLen')) $('stLen').value=st.len;\n  if($('stTone')) $('stTone').value=st.tone;\n  if($('stDens')) $('stDens').value=st.dens;\n  updateStyleHint();\n}\nfunction onStyleChange(){\n  saveStyle({len:$('stLen').value, tone:$('stTone').value, dens:$('stDens').value});\n  updateStyleHint();\n}\nfunction updateStyleHint(){\n  const el=$('styleHint'); if(!el) return;\n  const st=loadStyle();\n  const lenTxt={short:'精简',normal:'正常',long:'话痨'}[st.len]||'正常';\n  const toneTxt={friend:'朋友吐槽',serious:'认真聊',sharp:'毒舌刻薄'}[st.tone]||'朋友吐槽';\n  const densTxt={sparse:'克制',normal:'适中',dense:'密集'}[st.dens]||'适中';\n  el.textContent='当前：'+lenTxt+' · '+toneTxt+' · '+densTxt+'。改了要重新生成才生效（旧的评论不会被改写）。';\n}\nfunction styleLenSpec(){\n  const st=loadStyle();\n  if(st.len==='short') return '每条 15~30 字，短、准、点到为止，不要铺陈。';\n  if(st.len==='long')  return '每条 40~110 字，可以展开说，多聊一层。';\n  return '每条 25~70 字，说清楚就行，别啰嗦。';\n}\nfunction styleToneSpec(){\n  const st=loadStyle();\n  if(st.tone==='serious') return '语气是认真聊片子的人：偏分析，会聊镜头语言、叙事结构、人物动机、主题，冷静克制，不油不贱。';\n  if(st.tone==='sharp')   return '语气是毒舌刻薄的朋友：犀利、敢吐槽、带黑色幽默，可以直接说这片哪里蠢哪里假，但不要人身攻击、不要骂演员本人。';\n  return '语气是坐在旁边陪看的朋友：口语、有情绪、像小声吐槽，会替角色着急、会感叹、会开玩笑。';\n}\nfunction styleDensSpec(){\n  const st=loadStyle();\n  if(st.dens==='sparse') return '密度要【克制】：只挑全片最硬、最值得停下来想一想的几个点，一段 15 分钟通常 0~2 条；宁可整段交白卷，也不要为了凑数说。';\n  if(st.dens==='dense')  return '密度要【密集】：除了主干情节，边边角角也聊——配乐、构图、剪辑节奏、演员微表情、服装道具、一句台词的潜台词，一段 15 分钟通常 3~6 条。';\n  return '密度【适中】：值得聊的就聊，一段 15 分钟通常 1~4 条；剧情密集、情绪上来的时候可以连着来几条，平淡过场就少说或不说。';\n}\n/* 值得聊的六类理由 —— 写进提示词，让 AI 照着筛 */\nconst NOTE_WORTHY='只有符合下面这些情况之一，才值得发一条评论：\\n'\n  +'· 反转、伏笔埋下或回收\\n'\n  +'· 人物动机说不通、或一句话背后有话外音\\n'\n  +'· 一个两难的抉择、价值观的碰撞\\n'\n  +'· 容易一眼看漏、但回头看很关键的细节\\n'\n  +'· 镜头、配乐、剪辑、沉默在替角色说话\\n'\n  +'· 人物的关系、处境发生了实质变化\\n'\n  +'都不符合 → 这一段就返回空数组 []，一句都别发。';\n/* 找出评论时间轴上「连续 gapSec 秒以上没有任何评论」的区间，用于均匀兜底。\n   返回 [[起,止],...]；片头到第一条、最后一条到片尾都要算进去。 */\nfunction findGaps(list, endSec, gapSec){\n  const ts=(list||[]).map(n=>n.time).filter(t=>typeof t==='number').sort((a,b)=>a-b);\n  const gaps=[]; let prev=0;\n  ts.forEach(t=>{\n    if(t-prev>=gapSec) gaps.push([prev,t]);\n    if(t>prev) prev=t;\n  });\n  if(endSec-prev>=gapSec) gaps.push([prev,endSec]);\n  return gaps;\n}\n\nasync function genAiNotes(){\n  const plot=$('plotText').value.trim();\n  const hasSub=!!(state.subtitle && state.subtitle.length);\n  if(!plot && !hasSub){ alert('请先上传字幕文件，或粘贴剧情文本'); return; }\n  if(!state.currentId){ alert('请先选择影片（右上角「选择影片」），这样生成的评论才会存档到这部片名下。'); return; }\n  /* 已有评论时先确认，避免重复花钱生成 */\n  const existAi=(state.notes||[]).filter(n=>n.type==='ai').length;\n  if(existAi){\n    const go=confirm(`《${state.meta.title||'这部片'}》已经有 ${existAi} 条 AI 评论了。\\n\\n`\n      +'继续生成会补充新评论，并覆盖时间点相近的旧评论（会再消耗一次 API 费用）。\\n'\n      +'如果只是想看以前生成的评论，去「历史记录」点开卡片就能看，不花钱。\\n\\n确定继续生成吗？');\n    if(!go) return;\n  }\n  const cfg=loadCfg();\n  const key=cfg.key, model=cfg.model||'deepseek-flash', endpoint=cfg.endpoint||'https://api.deepseek.com';\n  if(!key){ alert('请先点右上角「AI配置」填写 API Key'); return; }\n  const btn=$('genBtn'), old=btn.textContent; btn.disabled=true;\n  /* 生成期间上锁：① 禁止云同步回流的 wb-reload 把页面重载（否则跑到一半全丢）\n                    ② 暂停写盘通知，避免每写一次就触发一轮同步包推送 */\n  window.__genBusy=true; window.__syncSilent=true;\n  const dur=(isFinite(video.duration)&&video.duration>0)?video.duration:0;\n  const durTxt=dur?fmt(dur):'';\n  const collected=[];\n  const diag=[];                       /* 记录哪几段没有字幕，最后如实告诉用户 */\n  const L=styleLenSpec(), T=styleToneSpec(), D=styleDensSpec();\n  const patched=[];                    /* 记录哪些区间走了「均匀兜底」补轮 */\n  try{\n    if(hasSub){\n      /* 有字幕：按 15 分钟切段、逐段生成。\n         ⚠ 分段终点 = max(字幕末尾, 影片时长) —— 只按字幕算会让「字幕不全」的后半部整段空白。\n         ⚠ 某段没有字幕也不能 continue，要改用剧情资料补生成，否则后面一小时一个字都没有。 */\n      const segSec=15*60;\n      const lastCue=state.subtitle[state.subtitle.length-1];\n      const subEnd=lastCue?lastCue.start:0;\n      const endSec=Math.max(subEnd, dur||0, 1);\n      const total=Math.max(1,Math.ceil(endSec/segSec));\n      for(let i=0;i<total;i++){\n        const s=i*segSec, e=Math.min((i+1)*segSec, endSec);   /* 末段按真实片尾收口，别让 AI 写到片外去 */\n        const cues=state.subtitle.filter(c=>c.start>=s && c.start<e);\n        const segMin=Math.max(1,Math.round((Math.min(e,endSec)-s)/60));\n        btn.textContent=`生成中… 第 ${i+1}/${total} 段`;\n        let prompt;\n        if(cues.length){\n          const body=cues.map(c=>`[${fmt(c.start)}] ${c.text}`).join('\\n');\n          prompt=`你是一位陪用户看电影的 AI 朋友。下面是同一部电影 ${fmt(s)}–${fmt(e)} 这一段（约 ${segMin} 分钟）的对白字幕，方括号里的时间就是电影的真实时间。\n请为这一段写「观影时间轴评论」。\n\n【最重要的一条：宁缺毋滥】\n绝对不要为了凑数而发言。这里的每一条评论，都必须是因为这一点真的值得停下来聊一聊。\n${NOTE_WORTHY}\n反过来，剧情密集、情绪上来、反转发生的时候，允许你连着来 3~5 条——那一刻本来就有话说。\n${D}\n【不要设任何固定条数】这一段值 0 条就返回空数组 []，值 6 条就给 6 条，全看内容本身有多少值得聊的。\n\n【写法要求】\n1. 输出必须是合法 JSON 数组，不要 markdown 代码块，不要任何解释文字。\n2. 每条格式：{\"time\":\"mm:ss\",\"text\":\"评论内容\"}\n3. time 必须直接取用下面字幕里真实出现过的时间点，不要自造；所有评论的时间都要落在 ${fmt(s)}–${fmt(e)} 之内。\n4. 【防剧透】只可引用该时间点之前已经出现的内容，绝对不要提到这之后的剧情或结局。\n5. 【时间格式】time 只能是纯数字：mm:ss 或 hh:mm:ss 都行，例如 \"07:30\"、\"63:30\"（即 1 小时 3 分）、\"01:07:30\"。写成\"约10分钟处\"这类文字的会被直接丢弃，务必不要这样写。\n6. ${L}\n7. ${T}\n\n字幕如下：\n${body}`;\n        } else {\n          diag.push(`${fmt(s)}–${fmt(e)}`);\n          prompt=`你是一位陪用户看电影的 AI 朋友。现在要为一部电影的 ${fmt(s)}–${fmt(e)} 这一段（约 ${segMin} 分钟）写「观影时间轴评论」，但这一段没有对白字幕可供参考。\n请基于下面给出的剧情资料，推测这一段大致会是什么氛围、什么进展，再决定要不要发言。\n\n【最重要的一条：宁缺毋滥】\n${NOTE_WORTHY}\n${D}\n\n【写法要求】\n1. 输出必须是合法 JSON 数组，不要 markdown 代码块，不要任何解释文字。\n2. 每条格式：{\"time\":\"mm:ss\",\"text\":\"评论内容\"}\n3. time 要落在 ${fmt(s)}–${fmt(e)} 之内。\n4. 【防剧透】只可引用该时间点之前的内容，不要提到后面的剧情或结局。\n5. 【时间格式】time 只能是纯数字：mm:ss 或 hh:mm:ss 都行，例如 \"52:30\"、\"108:30\"（即 1 小时 48 分）、\"01:52:30\"。写成\"约10分钟处\"这类文字的会被直接丢弃。\n6. 【分寸】因为没有字幕，绝对不要编造具体的台词、人名或具体情节；只谈氛围、节奏、情绪、镜头、配乐、表演这类可以合理推测的东西，拿不准就说感受，不要断言。\n7. ${L}\n8. ${T}\n\n剧情资料如下：\n${plot || '（用户没有提供剧情资料，请只写对氛围、节奏、镜头、配乐的通用感受，不要编造任何具体情节）'}`;\n        }\n        const arr=await callJson(endpoint,model,key,prompt);\n        arr.forEach(it=>{\n          const sec=parseTime(it.time);\n          if(sec<0) return;                                  /* 时间格式不合法 → 丢弃 */\n          if(sec < s-5 || sec > Math.min(e,endSec)+5) return; /* 时间跑到本段之外 → 丢弃 */\n          const txt=String(it.text||'').trim();\n          if(txt) collected.push({id:Date.now()+Math.random()+'',time:sec,text:txt,type:'ai'});\n        });\n      }\n      /* 【均匀兜底】主轮宁缺毋滥，可能整段交白卷。这里扫一遍：\n         凡是连续 GAP_SEC 以上一条评论都没有的区间，用宽松标准补一轮，\n         保证不会出现「半小时没人说话」。最多补 2 轮，防止死循环。 */\n      const GAP_SEC=20*60;\n      for(let round=0; round<2; round++){\n        const gaps=findGaps(collected, endSec, GAP_SEC);\n        if(!gaps.length) break;\n        btn.textContent=`补第 ${round+1} 轮… ${gaps.length} 段空档`;\n        for(const g of gaps){\n          const gs=g[0], ge=Math.min(g[1], endSec);\n          patched.push(`${fmt(gs)}–${fmt(ge)}`);\n          const cues=state.subtitle.filter(c=>c.start>=gs && c.start<ge);\n          const gMin=Math.max(1,Math.round((ge-gs)/60));\n          const need=Math.max(1,Math.min(4,Math.round(gMin/20)));\n          const body=cues.length?('这一段的字幕：\\n'+cues.map(c=>`[${fmt(c.start)}] ${c.text}`).join('\\n')):'（这一段没有字幕）';\n          const prompt=`你是一位陪用户看电影的 AI 朋友。电影的 ${fmt(gs)}–${fmt(ge)} 这一段（约 ${gMin} 分钟）在严格筛选后一条评论都没有，但用户不希望看这么久没人陪着说话。\n请放宽标准，从氛围、节奏、镜头、配乐、表演、人物状态、场景调度这些角度，挑 ${need}~${need+1} 条说一说——可以只是一句很轻的感受，不必非得是关键情节。\n要求：\n1. 输出必须是合法 JSON 数组，不要 markdown 代码块，不要任何解释文字。\n2. 每条格式：{\"time\":\"mm:ss\",\"text\":\"评论内容\"}\n3. time 落在 ${fmt(gs)}–${fmt(ge)} 之内，尽量均匀分布。\n4. 【防剧透】只可引用该时间点之前的内容。\n5. 【时间格式】time 只能是纯数字 mm:ss 或 hh:mm:ss，例如 \"63:30\"、\"01:07:30\"。\n6. ${L}\n7. ${T}\n8. ${cues.length?'有字幕就尽量结合真实台词来说，不要编造。':'没有字幕，绝对不要编造具体台词、人名、情节，只说氛围和感受。'}\n\n${body}`;\n          const arr=await callJson(endpoint,model,key,prompt);\n          arr.forEach(it=>{\n            const sec=parseTime(it.time);\n            if(sec<0) return;\n            if(sec < gs-5 || sec > ge+5) return;\n            const txt=String(it.text||'').trim();\n            if(txt) collected.push({id:Date.now()+Math.random()+'',time:sec,text:txt,type:'ai'});\n          });\n        }\n      }\n    } else {\n      /* 完全没字幕：只有剧情文本，条数按「每 4 分钟 1 条」随片长走，不设硬性下限（短视频会自然变少） */\n      btn.textContent='生成中…';\n      const prompt=`你是一位陪用户看电影的 AI 朋友，会在用户观看时发消息陪他聊。\n下面是一部电影的剧情资料${durTxt?('，影片总时长约 '+durTxt):''}。请生成「观影时间轴评论」。\n\n【最重要的一条：宁缺毋滥】\n绝对不要为了凑数而发言。每一条评论，都必须是因为这一点真的值得停下来聊一聊。\n${NOTE_WORTHY}\n剧情密集、情绪上来、反转发生的地方，允许你连着来 3~5 条。\n${D}\n【不要设固定条数】值多少条就给多少条，全看这部片有多少值得聊的。\n\n【写法要求】\n1. 输出必须是合法 JSON 数组，不要 markdown 代码块，不要任何解释文字。\n2. 每条格式：{\"time\":\"mm:ss\",\"text\":\"评论内容\"}\n3. 时间点要覆盖整部影片（${durTxt?('从开头一直到接近 '+durTxt):'从头到尾'}）。如果连续 20 分钟以上没有任何评论，那是不可接受的——那种空档至少挑一个点说一句，可以从氛围、节奏、配乐、表演这些角度说。\n4. 【防剧透】每条评论只可引用该时间点之前的内容，绝对不要提前说破后面的剧情或结局。\n5. 【时间格式】time 只能是纯数字：mm:ss 或 hh:mm:ss 都行，例如 \"07:30\"、\"63:30\"（即 1 小时 3 分）、\"01:07:30\"。写成\"约10分钟处\"这类文字的会被直接丢弃。\n6. ${L}\n7. ${T}\n\n剧情资料如下：\n${plot}`;\n      const arr=await callJson(endpoint,model,key,prompt);\n      arr.forEach(it=>{\n        const sec=parseTime(it.time);\n        if(sec<0) return;\n        const txt=String(it.text||'').trim();\n        if(txt) collected.push({id:Date.now()+Math.random()+'',time:sec,text:txt,type:'ai'});\n      });\n    }\n\n    if(!collected.length) throw new Error('AI 没有返回可用的评论');\n    /* 合并：时间点差 3 秒内视为同一条（保留新的）。\n       ⚠ 只清理旧的 AI 评论 —— 旧版不区分类型，会把用户自己写的评论一并删掉。 */\n    collected.forEach(n=>{\n      state.notes=state.notes.filter(o=>(o.type==='ai')?Math.abs(o.time-n.time)>3:true);\n      state.notes.push(n);\n    });\n    state.notes.sort((a,b)=>a.time-b.time);\n    const saved=saveMovie({date:todayStr()});\n    renderNotes();\n    switchTab('chat');\n    const mn=Math.min.apply(null,collected.map(n=>n.time));\n    const mx=Math.max.apply(null,collected.map(n=>n.time));\n    const st=loadStyle();\n    const stTxt={short:'精简',normal:'正常',long:'话痨'}[st.len]+' · '+{friend:'朋友吐槽',serious:'认真聊',sharp:'毒舌刻薄'}[st.tone]+' · '+{sparse:'克制',normal:'适中',dense:'密集'}[st.dens];\n    aiSay('系统',`已生成 ${collected.length} 条 AI 评论，覆盖 ${fmt(mn)}–${fmt(mx)}${durTxt?('（全片 '+durTxt+'）'):''}，本片现有 ${state.notes.filter(n=>n.type==='ai').length} 条。这次用的风格：${stTxt}。觉得话多话少、语气不对，去「AI生成」页调「评论风格」再重新生成就行。播放到对应时间，它们会像聊天消息一样出现在这里。`);\n    if(patched.length){\n      aiSay('系统',`说明：${patched.slice(0,4).join('、')}${patched.length>4?' 等':''} 这 ${patched.length} 段在严格筛选后一条评论都没有，为了不让你看太久没人说话，按宽松标准（氛围、节奏这类轻的感受）补了几条。`);\n    }\n    if(diag.length){\n      aiSay('系统',`说明：有 ${diag.length} 段没有字幕（${diag.slice(0,4).join('、')}${diag.length>4?' 等':''}），这几段是依据剧情资料补的，会比有字幕的段落粗略一些，也不会引用具体台词。`);\n    }\n    aiSay('系统', saved ? '已存档到「历史记录」，刷新或下次打开点卡片就能调出来，不用再生成（少花钱）。' : '⚠ 存档失败（本机存储可能已满），请先清理再生成，否则刷新会丢。');\n  }catch(e){\n    const msg=String((e&&e.message)||e);\n    /* 网络类错误和「填错密钥」看起来很像，不分开说会白折腾半天 */\n    let tip='请检查右上角「AI配置」里的 API Key、模型名和接口地址是否正确。';\n    if(/failed to fetch|networkerror|network request failed|load failed|ERR_/i.test(msg)){\n      tip='这是网络连不上接口地址，多半是代理 / 梯子把请求拦了，也可能接口地址被墙。\\n'\n         +'先把代理关掉再试一次；当前用的接口地址是：'+endpoint;\n    }\n    alert('生成失败：'+msg+'\\n\\n'+tip);\n  }finally{\n    btn.textContent=old; btn.disabled=false;\n    window.__genBusy=false; window.__syncSilent=false;\n    try{ notifyParent(); }catch(err){}      /* 解锁后统一通知外壳同步一次 */\n    try{ flushPendingReload(); }catch(err){}\n  }\n}\n\n/* ================= 字幕解析（字幕优先） ================= */\nfunction parseSRT(txt){\n  const out=[]; const blocks=txt.replace(/\\r/g,'').split(/\\n\\s*\\n/);\n  blocks.forEach(b=>{\n    const lines=b.trim().split('\\n');\n    if(lines.length<2) return;\n    const idx=lines.findIndex(l=>/-->/.test(l));\n    if(idx<0) return;\n    const m=lines[idx].match(/(\\d+):(\\d+):(\\d+)[,.](\\d+)\\s*-->\\s*(\\d+):(\\d+):(\\d+)/);\n    if(!m) return;\n    const start=+m[1]*3600+ +m[2]*60+ +m[3]+ +m[4]/1000;\n    const text=lines.slice(idx+1).join(' ').trim();\n    if(text) out.push({start, text});\n  });\n  return out;\n}\nfunction parseVTT(txt){\n  const out=[]; const lines=txt.replace(/\\r/g,'').split('\\n');\n  for(let i=0;i<lines.length;i++){\n    const m=lines[i].match(/(\\d+):(\\d+):(\\d+)[.](\\d+)\\s*-->\\s*(\\d+):(\\d+):(\\d+)/);\n    if(m){\n      const start=+m[1]*3600+ +m[2]*60+ +m[3]+ +m[4]/1000;\n      let j=i+1, text='';\n      while(j<lines.length && lines[j].trim()!==''){ text+=(text?' ':'')+lines[j].trim(); j++; }\n      if(text) out.push({start, text}); i=j;\n    }\n  }\n  return out;\n}\n/* 只存字幕原文，读取时现场解析 —— 存档更小、也不会因格式升级而失效 */\nfunction parseSubtitleText(txt){\n  if(!txt) return [];\n  return /^\\uFEFF?\\s*WEBVTT/i.test(txt.trim()) ? parseVTT(txt) : parseSRT(txt);\n}\n/* ================= 字幕 / 视频 时间轴匹配检测 =================\n   目的：在花钱让 AI 生成之前，先告诉你字幕和这部片子对不对得上。\n   能看到的问题：字幕比影片短/长、中间有整段没字幕、字幕之间有大空档。\n   整体偏移（字幕整体快了或慢了）靠手动平移校正——输入框填秒数，正数=字幕往后推。 */\nfunction subMatchInfo(){\n  const dur=(isFinite(video.duration)&&video.duration>0)?video.duration:0;\n  const subs=(state.subtitle||[]).slice().sort((a,b)=>a.start-b.start);\n  if(!subs.length) return {ok:false,dur:dur};\n  const first=subs[0].start, last=subs[subs.length-1].start;\n  const upto=Math.max(last,dur||0);\n  /* 找「整段没字幕」的 15 分钟窗口 */\n  const holes=[]; const win=15*60;\n  for(let s=0;s<upto;s+=win){\n    const e=s+win;\n    if(!subs.filter(c=>c.start>=s&&c.start<e).length) holes.push([s,Math.min(e,upto)]);\n  }\n  /* 相邻字幕之间的最大空档 */\n  let maxGap=0, gapAt=0;\n  for(let i=1;i<subs.length;i++){\n    const g=subs[i].start-subs[i-1].start;\n    if(g>maxGap){ maxGap=g; gapAt=subs[i-1].start; }\n  }\n  const lenScore = dur>0 ? Math.min(last,dur)/Math.max(last,dur)*100 : 100;\n  const holePenalty = Math.min(45, holes.length*9);\n  const gapPenalty  = maxGap>600 ? Math.min(20, Math.round((maxGap-600)/60)) : 0;\n  const score = Math.max(0, Math.min(100, Math.round(lenScore-holePenalty-gapPenalty)));\n  const level = score>=90 ? ['ok','很匹配'] : score>=70 ? ['warn','基本匹配，有些偏差'] : ['bad','明显不匹配'];\n  return {ok:true,dur:dur,count:subs.length,first:first,last:last,maxGap:maxGap,gapAt:gapAt,holes:holes,score:score,level:level};\n}\nfunction renderSubMatch(){\n  const el=$('subMatch'); if(!el) return;\n  const m=subMatchInfo();\n  if(!m.ok){ el.innerHTML=''; return; }\n  const f=fmt;\n  const color = m.level[0]==='ok' ? '#3f7d4a' : m.level[0]==='warn' ? '#b57a1f' : '#c0392b';\n  const bg    = m.level[0]==='ok' ? '#f0f7f1' : m.level[0]==='warn' ? '#fdf6e8' : '#fdefec';\n  const warns=[];\n  if(m.dur>0 && m.last < m.dur-120)\n    warns.push(`⚠ 字幕比影片<b>短 ${Math.round((m.dur-m.last)/60)} 分钟</b>（到 ${f(m.last)} 就没了）。后面那几段没有台词可参考，AI 会依据剧情资料补，评论会比较粗。`);\n  if(m.dur>0 && m.last > m.dur+120)\n    warns.push(`⚠ 字幕比影片<b>长 ${Math.round((m.last-m.dur)/60)} 分钟</b>，时间轴对不上，很可能不是这一版的字幕。`);\n  if(m.holes.length)\n    warns.push(`⚠ 有 <b>${m.holes.length} 段完全没字幕</b>：${m.holes.slice(0,3).map(h=>f(h[0])+'–'+f(h[1])).join('、')}${m.holes.length>3?' 等':''}。`);\n  if(m.maxGap>600)\n    warns.push(`⚠ 字幕之间最大空档 <b>${Math.round(m.maxGap/60)} 分钟</b>（在 ${f(m.gapAt)} 之后），那段可能本来就没台词。`);\n  if(!warns.length) warns.push('✓ 没发现明显问题，可以放心生成。');\n  el.innerHTML =\n   `<div style=\"border:1px solid ${color}33;background:${bg};border-radius:8px;padding:9px 10px;margin-bottom:9px;\">\n      <div style=\"font-size:11.5px;font-weight:600;color:${color};margin-bottom:5px;\">字幕 / 视频 时间轴匹配检测</div>\n      <div style=\"font-size:11px;color:var(--sub);line-height:1.6;\">\n        影片 <b style=\"color:var(--ink)\">${m.dur?f(m.dur):'未载入'}</b> ·\n        字幕 <b style=\"color:var(--ink)\">${f(m.last)}</b>（${m.count} 条，起于 ${f(m.first)}）${state.subOffset?(' · 已平移 '+(state.subOffset>0?'+':'')+state.subOffset+' 秒'):''}\n      </div>\n      <div style=\"height:5px;background:#e8e0d4;border-radius:3px;margin:6px 0 3px;overflow:hidden;\">\n        <span style=\"display:block;height:100%;width:${m.score}%;background:${color};border-radius:3px;\"></span>\n      </div>\n      <div style=\"font-size:11px;color:${color};font-weight:600;\">匹配度 ${m.score}% · ${m.level[1]}</div>\n      <div style=\"font-size:11px;color:var(--ink);line-height:1.65;margin-top:5px;\">${warns.join('<br>')}</div>\n      <div style=\"margin-top:7px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11px;\">\n        <span style=\"color:var(--sub);\">整体平移：</span>\n        <button class=\"mini\" onclick=\"applySubOffset(-10)\">−10秒</button>\n        <button class=\"mini\" onclick=\"applySubOffset(-1)\">−1秒</button>\n        <button class=\"mini\" onclick=\"applySubOffset(1)\">+1秒</button>\n        <button class=\"mini\" onclick=\"applySubOffset(10)\">+10秒</button>\n        <input id=\"offInp\" type=\"number\" value=\"${state.subOffset||0}\" style=\"width:66px;padding:2px 4px;border:1px solid var(--line);border-radius:4px;font-size:11px;\">\n        <button class=\"mini\" onclick=\"setSubOffset(Number($('offInp').value)||0)\">应用</button>\n      </div>\n      <div style=\"font-size:10.5px;color:var(--sub);margin-top:4px;\">字幕整体比画面<b>早</b>就减，比画面<b>晚</b>就加；改完上面的匹配度会跟着变。</div>\n    </div>`;\n}\nfunction setSubOffset(off){\n  state.subOffset=off;\n  state.subtitle=parseSubtitleText(state.subtitleRaw).map(c=>({start:Math.max(0,c.start+off),text:c.text}));\n  saveMovie({subOffset:off});\n  renderSubMatch(); updateSubInfo(); renderHistory();\n}\nfunction applySubOffset(delta){ setSubOffset((state.subOffset||0)+delta); }\n\nfunction onSubtitle(file){\n  if(!file) return;\n  const r=new FileReader();\n  r.onload=()=>{\n    const txt=r.result;\n    const cues=/\\.vtt$/i.test(file.name)?parseVTT(txt):parseSRT(txt);\n    if(!cues.length){ $('subInfo').textContent='字幕解析失败，请检查格式（.srt / .vtt）'; return; }\n    state.subtitle=cues;\n    state.subtitleRaw=txt.slice(0,400000);           /* 上限 40 万字符，正常一部电影远不到 */\n    state.subCount=cues.length;\n    $('subInfo').textContent=`已载入 ${cues.length} 条字幕，AI 评论将基于真实时间轴`;\n    let saved='';\n    if(!state.currentId){\n      saved='（还没选影片，先选影片再上传字幕，才能存档）';\n    } else {\n      saved = saveMovie({subCount:cues.length}) ? '，已存档（刷新不会丢）' : '，但存档失败了';\n    }\n    aiSay('系统',`字幕已解析：${cues.length} 条${saved}。先看上面的「匹配检测」对不对得上，再点「✨ 生成时间轴评论」。`);\n    renderHistory();\n    renderSubMatch();\n  };\n  r.readAsText(file);\n}\n\n/* ================= 截图分析 ================= */\nfunction onShotSelect(files){\n  if(!files || !files.length) return;\n  const cfg=loadCfg();\n  const key=cfg.key;\n  const model=cfg.model||'deepseek-flash';\n  const endpoint=cfg.endpoint||'https://api.deepseek.com';\n  if(!key){ alert('请先点右上角「AI配置」填写 API Key'); return; }\n  Array.from(files).forEach(file=>analyzeShot(file,endpoint,model,key));\n}\nasync function analyzeShot(file,endpoint,model,key){\n  const id=Date.now()+Math.random();\n  const list=$('shotList');\n  const row=document.createElement('div'); row.className='shot-row'; row.id='shot-'+id;\n  const imgUrl=URL.createObjectURL(file);\n  row.innerHTML=`<img class=\"img\" src=\"${imgUrl}\"><div class=\"txt\">正在分析画面…</div><div class=\"meta\">${esc(file.name)}</div>`;\n  list.prepend(row);\n  try{\n    const base64=await fileToBase64(file);\n    const res=await fetch(endpoint,{\n      method:'POST',\n      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},\n      body:JSON.stringify({\n        model:model,\n        messages:[{\n          role:'user',\n          content:[\n            {type:'text',text:'你是陪用户看电影的 AI。请用一句话点评这张电影截图，语气像朋友一样。只输出一句。'},\n            {type:'image_url',image_url:{url:base64}}\n          ]\n        }],\n        max_tokens:120\n      })\n    });\n    if(!res.ok) throw new Error('API '+res.status);\n    const data=await res.json();\n    const txt=data.choices?.[0]?.message?.content?.trim()||'（AI 没有返回内容）';\n    row.querySelector('.txt').textContent=txt;\n    aiSay('AI', txt);\n  }catch(e){\n    row.querySelector('.txt').textContent='分析失败：'+e.message;\n  }\n}\nfunction fileToBase64(file){\n  return new Promise((resolve,reject)=>{\n    const r=new FileReader();\n    r.onload=()=>resolve(r.result);\n    r.onerror=reject;\n    r.readAsDataURL(file);\n  });\n}\nconst paneAi=$('pane-ai');\npaneAi.addEventListener('dragover',e=>{ e.preventDefault(); paneAi.style.outline='2px dashed var(--accent)'; });\npaneAi.addEventListener('dragleave',e=>{ e.preventDefault(); paneAi.style.outline=''; });\npaneAi.addEventListener('drop',e=>{\n  e.preventDefault(); paneAi.style.outline='';\n  onShotSelect(e.dataTransfer.files);\n});\n\n/* ================= 实时视觉分析（可选） ================= */\nfunction setupVision(){\n  if(state.visionTimer){ clearInterval(state.visionTimer); state.visionTimer=null; }\n  const cfg=loadCfg();\n  if(!cfg.vision || cfg.vision<=0 || !cfg.key) return;\n  state.visionTimer=setInterval(()=>{\n    if(video.paused || video.ended) return;\n    captureAndAnalyze();\n  }, Math.max(10,cfg.vision)*1000);\n}\nasync function captureAndAnalyze(){\n  const cfg=loadCfg();\n  if(!cfg.key) return;\n  try{\n    const canvas=document.createElement('canvas');\n    canvas.width=video.videoWidth||640; canvas.height=video.videoHeight||360;\n    const ctx=canvas.getContext('2d'); ctx.drawImage(video,0,0,canvas.width,canvas.height);\n    const base64=canvas.toDataURL('image/jpeg',0.7);\n    const res=await fetch(cfg.endpoint||'https://api.deepseek.com',{\n      method:'POST',\n      headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},\n      body:JSON.stringify({\n        model:cfg.model||'deepseek-flash',\n        messages:[{\n          role:'user',\n          content:[\n            {type:'text',text:'你是陪用户看电影的 AI。请用一句话描述当前画面里正在发生什么，语气像朋友一样。只输出一句。'},\n            {type:'image_url',image_url:{url:base64}}\n          ]\n        }],\n        max_tokens:80\n      })\n    });\n    if(!res.ok) return;\n    const data=await res.json();\n    const txt=data.choices?.[0]?.message?.content?.trim();\n    if(txt) aiSay('AI', txt, fmt(video.currentTime));\n  }catch(e){ console.error(e); }\n}\n\n/* ================= 语音输入 ================= */\nlet recognizer=null, isRec=false;\nfunction initSpeech(){\n  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;\n  if(!SR){ $('micBtn').style.display='none'; return; }\n  recognizer = new SR();\n  recognizer.continuous = false;\n  recognizer.interimResults = true;\n  recognizer.lang = 'zh-CN';\n  recognizer.onstart = ()=>{ isRec=true; $('micBtn').classList.add('rec'); $('micBtn').title='正在听…再点结束'; };\n  recognizer.onend = ()=>{ isRec=false; $('micBtn').classList.remove('rec'); $('micBtn').title='点击说话'; };\n  recognizer.onresult = (e)=>{\n    let final='', interim='';\n    for(let i=e.resultIndex;i<e.results.length;i++){\n      const t=e.results[i][0].transcript;\n      if(e.results[i].isFinal) final+=t; else interim+=t;\n    }\n    const inp=$('chatInp');\n    if(final){ inp.value=final; sendChat(); }\n    else if(interim){ inp.value=interim; }\n  };\n  recognizer.onerror = (e)=>{\n    if(e.error==='not-allowed') aiSay('系统','麦克风权限被拒绝，请在浏览器地址栏允许使用麦克风。');\n    else if(e.error!=='no-speech') aiSay('系统','语音识别出错：'+e.error);\n  };\n}\nfunction toggleMic(){\n  if(!recognizer){ initSpeech(); }\n  if(!recognizer){ aiSay('系统','当前浏览器不支持语音识别，请用 Edge / Chrome 打开。'); return; }\n  if(isRec){ recognizer.stop(); }\n  else { try{ recognizer.start(); }catch(e){ aiSay('系统','无法启动麦克风：'+e.message); } }\n}\n\n/* ================= 启动 ================= */\nfunction init(){\n  migrateLegacyRecords();\n  renderHistory();\n  initSpeech();\n  setupVision();\n  syncStyleUI();\n}\ninit();\n\n/* ⚠ 子页绝不能被外壳随意重载（2026-09-25 修复「点生成后页面闪一下、回到刚刷新的样子」）\n   只要云同步拉到新数据，外壳就会广播 wb-reload；以前这里无条件 location.reload()，\n   于是正在播放的电影被打断、跑到一半的评论生成被整个抹掉（state 全丢，看着就像刚刷新）。\n   新策略：忙的时候只刷新历史列表，把重载推迟；空闲且手里没片子时才真正重载。 */\nfunction wbSafeReload(){\n  try{ renderHistory(); }catch(e){}\n  if(window.__genBusy){ window.__pendingReload=true; return false; }          /* 正在生成评论 */\n  if(video && video.src && !video.paused){ window.__pendingReload=true; return false; }  /* 正在播放 */\n  if(state.currentId){ window.__pendingReload=true; return false; }           /* 手里有片子，别打断 */\n  return true;\n}\nfunction flushPendingReload(){\n  if(!window.__pendingReload) return;\n  window.__pendingReload=false;\n  if(wbSafeReload()) location.reload();\n}\nwindow.addEventListener('message',e=>{\n  if(e.data && e.data.type==='wb-reload'){ if(wbSafeReload()) location.reload(); }\n});\n<<<SCRIPT_END>>>\n</body>\n</html>\n";

    try{
      const obj = JSON.parse(reader.result);
      const data = obj.data || obj;
      let n=0;
      Object.keys(data).forEach(k=>{ localStorage.setItem(k, data[k]); n++; });

}

    rm.forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });

function wbMergeArr3(localStr,cloudStr,baseStr,dir){

  if(!Array.isArray(L)) return cloudStr;
  if(!Array.isArray(C)) return localStr;
  if(!Array.isArray(B)) B=null;                 /* 无基线：只做并集，绝不敢删 */
  const map={};
  const put=(x, fromLocal)=>{
    const id=wbItemId(x); const cur=map[id];

function wbMergeObj(localStr,cloudStr,dir){

function wbMergeCinemaMovie(localStr,cloudStr){
  let L=null,C=null;
  try{ L=JSON.parse(localStr||'null'); }catch(e){ return localStr; }
  try{ C=JSON.parse(cloudStr||'null'); }catch(e){ C=null; }

     规则：谁的「删除动作」在后，听谁的；删除之后又被别台设备改过，才允许复活。
     本机删、云端活  → 云端更新时间晚于删除时间才复活，否则维持删除。
     云端删、本机活  → 本机更新时间晚于删除时间就保留本机，否则跟着删。
     两边都删        → 取较新的墓碑。 */

  if(ld||cd){
    const lu=Number(L.updated)||0, cu=Number(C.updated)||0;
    const tombstone=(ts,id,title,extra)=>JSON.stringify(Object.assign(
      {v:2,id:id||'',title:title||'',deleted:ts,updated:extra||ts}));
    if(ld&&!cd){
      if(cu>ld) return JSON.stringify(C);                       /* 删除后别处又改过 → 复活 */
      return tombstone(ld, L.id||C.id, L.title||C.title, Math.max(ld,cu));
    }
    if(cd&&!ld){
      if(lu>cd) return localStr;                                /* 本机后来又改过 → 保住（自带 deleted:0） */
      return tombstone(cd, C.id||L.id, C.title||L.title, Math.max(cd,lu));
    }
    return tombstone(Math.max(ld,cd), L.id||C.id, L.title||C.title, Math.max(ld,cd,lu,cu));
  }
  const out=Object.assign({},C,L);                 /* 顶层字段以本机为准 */
  const ln=Array.isArray(L.notes)?L.notes:[];
  const cn=Array.isArray(C.notes)?C.notes:[];
  const seen={}, all=[];
  const push=(n,localFirst)=>{
    if(!n||typeof n!=='object') return;
    const key=(n.id!==undefined&&n.id!==null)?('i'+n.id):(String(n.time)+'|'+String(n.text));
    if(seen[key]) return;

  ln.forEach(n=>push(n,true));

  out.updated=Math.max(L.updated||0,C.updated||0);
  return JSON.stringify(out);
}

function wbTodayUnion(a,b,dels){

  b.forEach(y=>{

  const out={
