}
/* 打卡记录按「日期」并集合并：两侧都有的日期取较新一份，只有一侧有的保留，绝不删除本机条目。
   这正是 2026-09-18 修复「9 月打卡反复丢失」的核心：云端旧快照不再能整键覆盖本机新记录。 */
function wbMergeCheckin(localStr, cloudStr){
  let L=[],C=[];
  try{ const a=JSON.parse(localStr); if(Array.isArray(a)) L=a; }catch(e){}
  try{ const a=JSON.parse(cloudStr); if(Array.isArray(a)) C=a; }catch(e){}
  const map={};
  const put=(x)=>{ if(!x||!x.date) return; const d=x.date; const cur=map[d];
    if(!cur){ map[d]=x; return; }
    const xt=wbItemTs(x), ct=wbItemTs(cur);
    if(xt>ct) map[d]=x;
  };
  L.forEach(put); C.forEach(put);
  const out=Object.keys(map).map(d=>map[d]);
  out.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  return JSON.stringify(out);
}
async function wbMergeAll(cloudObj, dir){
  dir = dir||'push';
  const local=await wbCollect();
  const shadow=wbLoadShadow();
  const out=Object.assign({},cloudObj||{});
  Object.keys(local).forEach(k=>{
    const lv=local[k], cv=out[k], bv=shadow[k];
    if(k==='DAILY_STATUS'){ out[k]=wbMergeDaily(lv,cv); return; }
    if(k==='TODAY_PLAN'){ out[k]=wbMergeToday(lv, cv); return; }   /* 今日安排：按日期/id 并集合并 */
    /* 美食数据：绝不允许「拉取」把本机较新的条目整键覆盖掉（9 月打卡反复丢失的根因）。
       改为按 id/日期 并集合并——两侧都有的取较新一份，只有一侧有的保留，绝不删除本机条目。 */
    if(k==='food_checkin'){ out[k]=wbMergeCheckin(lv, cv); return; }
    if(k.indexOf('cinema_movie_')===0){ out[k]=wbMergeCinemaMovie(lv, cv); return; }   /* 放映室影片档：并集，绝不丢本机评论 */
    if(k.indexOf('cinema_prog_')===0){ out[k]=wbMergeCinemaProg(lv, cv); return; }
    if(k.indexOf('food_')===0){
      if(wbIsArr(lv)||wbIsArr(cv)){
        const merged = wbMergeArr3(wbIsEmptyVal(lv)?'[]':lv, wbIsEmptyVal(cv)?'[]':cv, null, dir);
        if(!wbIsEmptyVal(lv)) out[k]=merged; else if(!wbIsEmptyVal(cv)) out[k]=cv;
      } else if(wbIsObj(lv)&&wbIsObj(cv)){ out[k]=wbMergeObj(lv,cv,dir); }
      else { out[k]=(!wbIsEmptyVal(lv))?lv:cv; }
      return;
    }
    if(wbIsArr(lv)||wbIsArr(cv)){ out[k]=wbMergeArr3(lv,cv,bv,dir); return; }   /* 数组：三向合并（按方向定优先级） */
    if(wbIsObj(lv)&&wbIsObj(cv)){ out[k]=wbMergeObj(lv,cv,dir); return; }        /* 对象：按键合并（按方向定优先级） */
    if(wbIsEmptyVal(lv)&&!wbIsEmptyVal(cv)) return;                          /* 本机空、云端有 → 保留云端（out 初值即云端值，直接 return 即可） */
    if(wbIsEmptyVal(cv)&&!wbIsEmptyVal(lv)){ out[k]=lv; return; }            /* 云端空、本机有 → 必须显式赋值保留本机（2026-09-25 修复：out 初值是云端快照拷贝，原来只 return 会把云端空值留在 out 里，拉取落地把本机刚填的数据抹掉 —— 手机 API Key 反复被清空的根因） */
    out[k] = (dir==='pull') ? (wbIsEmptyVal(cv)?lv:cv) : lv;
  });
  Object.keys(out).forEach(k=>{ if(wbIsJunk(k,out[k]) || wbIsPrivate(k)) delete out[k]; });    /* 清掉污染键与私密键（密钥不进合并结果，避免旧空值随包推送/落地） */
  return out;
}

const WB_SEARCH_KEYS=[
  {k:'TODAY_PLAN',     mod:'today',  sub:'today',   name:'今日安排'},

let wbSearchTimer=null;
function wbHl(text,q){
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return text;
  return text.slice(0,i)+'<mark>'+text.slice(i,i+q.length)+'</mark>'+text.slice(i+q.length);
}
function wbCleanFrag(s){
  return s.replace(/\\u[0-9a-fA-F]{4}/g,'').replace(/\\["\\/]/g,'"')
          .replace(/[{}"\[\],]/g,' ')
          .replace(/\b(id|ts|done|created|cat|est|time|date|note|name|records|tags|stags|focus|tasks|waiting|total|weekKey|weekStart|weekEnd|summary|items|text|count|updatedAt)\s*:/g,' ')
          .replace(/\b(true|false|null)\b/g,' ')
          .replace(/\s+/g,' ').trim();
}
function wbSearchJump(mod,sub){

function wbSearchRun(raw){
  clearTimeout(wbSearchTimer);

function wbSearchRender(raw){
  const q=(raw||'').trim();
  const box=document.getElementById('wbResults');
  if(!q){ box.classList.remove('show'); box.innerHTML=''; return; }
  const ql=q.toLowerCase();
  let html='';
  /* A. 页面导航 */
  const pages=[];
  Object.keys(MODULES).forEach(key=>{
    const m=MODULES[key];
    if((m.title||'').toLowerCase().indexOf(ql)>=0) pages.push({mod:key,sub:m.sub[0].id,t:m.title,g:m.title});
    m.sub.forEach(s=>{ if((s.name||'').toLowerCase().indexOf(ql)>=0) pages.push({mod:key,sub:s.id,t:s.name,g:m.title}); });
  });
  if(pages.length){
    html+='<div class="wbr-group">页面</div>';
    pages.slice(0,6).forEach(p=>{
      html+='<div class="wbr-item" onclick="wbSearchJump(\''+p.mod+'\',\''+p.sub+'\')"><span class="rmod">'+p.g+'</span><span class="rtxt">'+wbHl(p.t,q)+'</span></div>';
    });
  }
  /* B. 数据内容 */
  const hits=[];
  WB_SEARCH_KEYS.forEach(cfg=>{
    let v=null; try{ v=localStorage.getItem(cfg.k); }catch(e){}
    if(!v) return;
    const low=v.toLowerCase();
    let pos=0,count=0;
    while(count<3){
      pos=low.indexOf(ql,pos); if(pos<0) break;
      const start=Math.max(0,pos-26), end=Math.min(v.length,pos+q.length+44);
      const frag=wbCleanFrag(v.slice(start,end));
      if(frag) hits.push({cfg:cfg,frag:frag});
      pos+=q.length; count++;
    }
  });
  if(hits.length){
    html+='<div class="wbr-group">记录内容</div>';
    hits.slice(0,10).forEach(h=>{
      const esc=h.frag.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      html+='<div class="wbr-item" onclick="wbSearchJump(\''+h.cfg.mod+'\',\''+h.cfg.sub+'\')"><span class="rmod">'+h.cfg.name+'</span><span class="rtxt">'+wbHl(esc,q)+'</span></div>';
    });
  }
  if(!html) html='<div class="wbr-empty">没找到「'+q.replace(/</g,'&lt;')+'」相关的内容</div>';
  box.innerHTML=html;
  box.classList.add('show');
}

/* ===== 外壳层撤销栈：最多 10 步，防误删 =====
   子页（如美食记录）在删除前会把「删除前整份数据」通过 postMessage 推过来；
   这里保留快照，用户点顶栏「撤销」即写回本地并通知子页重载，再同步云端。 */
const WB_UNDO_MAX = 10;
let wbUndoStack = [];
function wbUndoPush(d){
  try{
    if(!d || !d.key) return;
    wbUndoStack.push({ label:d.label||'删除操作', key:d.key, value:d.value, ts:Date.now() });
    if(wbUndoStack.length > WB_UNDO_MAX) wbUndoStack.shift();
    wbUpdateUndoBtn();
  }catch(e){}
}
function wbUndo(){
  if(wbUndoStack.length===0){ wbToast('没有可撤销的操作'); return; }
  const item = wbUndoStack.pop();
  try{
    localStorage.setItem(item.key, item.value);   /* 把删除前的数据写回本地 */
    wbBroadcastReload();                          /* 通知 iframe 子页重新加载数据 */
    wbSchedulePush(true);                          /* 同步回云端，避免又被旧云端覆盖 */
    wbToast('已撤销：'+item.label);
  }catch(e){ wbToast('撤销失败：'+(e&&e.message?e.message:e)); }
  wbUpdateUndoBtn();
}
function wbUpdateUndoBtn(){
  const b = document.getElementById('wbUndoBtn');
  if(!b) return;
  const n = wbUndoStack.length;
  b.disabled = (n===0);
  b.title = n ? ('撤销上一步（还可撤销 '+n+' 步）') : '暂无可撤销的操作';
}

/* ================= GitHub 文件同步通道（备份） ================= */
function wbGhToken(){ try{ return localStorage.getItem(WB_K_GH_TOKEN)||''; }catch(e){ return ''; } }
function wbGhHeaders(){ const t=wbGhToken(); const h={'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'}; if(t) h['Authorization']='Bearer '+t; return h; }
async function wbGhGetFile(){
  const url=WB_GH_API+'/repos/'+WB_GH_REPO+'/contents/'+WB_GH_FILE;
  const r=await fetch(url,{headers:wbGhHeaders(),cache:'no-store'});
  if(r.status===404) return {exists:false};
  if(!r.ok) throw new Error('GitHub 读取失败 HTTP '+r.status);
  const j=await r.json();
  let content=''; try{ content=decodeURIComponent(escape(window.atob(j.content.replace(/\s/g,'')))); }catch(e){ content=''; }
  let obj=null; try{ obj=JSON.parse(content); }catch(e){ obj=null; }
  return {exists:true, sha:j.sha, obj:obj};
}
async function wbPushGithubWith(merged){
  const token=wbGhToken(); if(!token) return false;
  const body={ updatedAt:new Date().toISOString(), data:merged };
  const raw=JSON.stringify(body);
  const content=btoa(unescape(encodeURIComponent(raw)));
  const existing=await wbGhGetFile();
  const payload={ message:'workbench sync '+new Date().toISOString(), content:content };
  if(existing.exists && existing.sha) payload.sha=existing.sha;
  const url=WB_GH_API+'/repos/'+WB_GH_REPO+'/contents/'+WB_GH_FILE;
  const r=await fetch(url,{method:'PUT',headers:wbGhHeaders(),body:JSON.stringify(payload)});
  if(!r.ok){ const t=await r.text().catch(()=> ''); throw new Error('GitHub 写入失败 HTTP '+r.status+(t?': '+t.slice(0,120):'')); }
  return true;
}
/* ===== 图片单独通道（2026-09-17 加）=====
   背景：主同步包若自带 base64 图片会涨到 MB 级，一次大上传极易被网络掐断（9-15 的 2.01MB 事故：
   推送永远是 Failed to fetch，且 GitHub contents API 对 >1MB 文件不返回内容，手机端连拉取都为空）。
   做法：主同步包只带 idb:// 引用；图片一张一个独立小文件（约 40~70KB），分批、断点续传。
   铁律：原图字节一个都不改——不压缩、不重编码、不删除；
        任一张失败只跳过，不影响主数据同步，下次自动接着传。 */
const WB_IMG_CH=true, WB_IMG_DIR='data/foodimg', WB_IMG_RUN=25, WB_IMG_ROUNDS=4, WB_K_IMG_STAT='WB_IMG_STAT';
let wbImgBusy=false;
function wbImgUrl(path){ return WB_GH_API+'/repos/'+WB_GH_REPO+'/contents/'+path; }
function wbGhEnc(s){ return btoa(unescape(encodeURIComponent(s))); }
function wbGhDec(s){ try{ return decodeURIComponent(escape(window.atob(String(s||'').replace(/\s/g,'')))); }catch(e){ return ''; } }
function wbImgStatGet(){ try{ return JSON.parse(localStorage.getItem(WB_K_IMG_STAT))||{}; }catch(e){ return {}; } }
function wbImgStatPut(patch){ const o=wbImgStatGet(); Object.assign(o,patch); try{ localStorage.setItem(WB_K_IMG_STAT, JSON.stringify(o)); }catch(e){} return o; }
async function wbImgIndexGet(){
  try{
    const r=await fetch(wbImgUrl(WB_IMG_DIR+'/index.json'),{headers:wbGhHeaders(),cache:'no-store'});
    if(!r.ok) return {ids:{},sha:null};
    const j=await r.json();
    let o=null; try{ o=JSON.parse(wbGhDec(j.content||'')); }catch(e){ o=null; }
    return {ids:(o&&o.ids)||{}, sha:j.sha||null};
  }catch(e){ return {ids:{},sha:null}; }
}
async function wbImgIndexPut(idx){
  const body={message:'img index '+new Date().toISOString(), content:wbGhEnc(JSON.stringify({ids:idx.ids})), branch:'main'};
  if(idx.sha) body.sha=idx.sha;
  const r=await fetch(wbImgUrl(WB_IMG_DIR+'/index.json'),{method:'PUT',headers:wbGhHeaders(),body:JSON.stringify(body)});
  if(!r.ok){ const t=await r.text().catch(()=>''); throw new Error('图片索引写入失败 HTTP '+r.status+' '+t.slice(0,80)); }
  const j=await r.json(); idx.sha=(j&&j.sha)||idx.sha; return idx;
}
async function wbImgLocalIds(){
  try{
    const db=await wbIdbOpen();
    return await new Promise(res=>{ const tx=db.transaction(WB_FOOD_STORE,'readonly'); const rq=tx.objectStore(WB_FOOD_STORE).getAllKeys(); rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>res([]); });
  }catch(e){ return []; }
}
/* 上传单张：原图字节原样，不做任何处理 */
async function wbImgPushOne(id){
  const b64=await wbIdbGet(id);
  if(!b64 || typeof b64!=='string' || b64.indexOf('data:image')!==0) return false;
  const path=WB_IMG_DIR+'/'+id+'.txt';
  let sha=null;
  try{ const r=await fetch(wbImgUrl(path),{headers:wbGhHeaders(),cache:'no-store'}); if(r.ok){ const j=await r.json(); sha=(j&&j.sha)||null; } }catch(e){}
  const body={message:'img '+id, content:wbGhEnc(b64), branch:'main'};
  if(sha) body.sha=sha;
  const r2=await fetch(wbImgUrl(path),{method:'PUT',headers:wbGhHeaders(),body:JSON.stringify(body)});
  if(!r2.ok){ const t=await r2.text().catch(()=>''); throw new Error('图片写入失败 HTTP '+r2.status+' '+t.slice(0,80)); }
  return true;
}
async function wbImgPullOne(id){
  const r=await fetch(wbImgUrl(WB_IMG_DIR+'/'+id+'.txt'),{headers:wbGhHeaders(),cache:'no-store'});
  if(!r.ok) return false;
  const j=await r.json();
  const b64=wbGhDec((j&&j.content)||'');
  if(b64.indexOf('data:image')!==0) return false;
  await wbIdbPut(id, b64);   /* 原图写回本机图库，字节不变 */
  return true;
}
/* 补传：本机有、云端没有的图 */
async function wbImgSyncUp(quiet){
  if(!WB_IMG_CH || wbImgBusy || !wbGhToken()) return 0;
  wbImgBusy=true; let total=0;
  try{
    let idx=await wbImgIndexGet();
    /* 计数如实刷新：即使两边本来就齐、无需传输，也要写真实数字（否则面板永远显示 0/0） */
    wbImgStatPut({cloud:Object.keys(idx.ids).length, local:(await wbImgLocalIds()).length});
    for(let round=0; round<WB_IMG_ROUNDS; round++){
      const ids=await wbImgLocalIds();
      const todo=ids.filter(id=>!idx.ids[id]).slice(0, WB_IMG_RUN);
      if(!todo.length) break;
      let done=0;
      for(const id of todo){
        try{ await wbImgPushOne(id); idx.ids[id]=1; done++; }
        catch(e){ idx.ids[id]=1; /* 单张失败不再死磕，下轮继续 */ }
      }
      total+=done;
      try{ await wbImgIndexPut(idx); }catch(e){}
      wbImgStatPut({cloud:Object.keys(idx.ids).length, local:ids.length});
      if(done<todo.length) break;   /* 网络断了就停，别硬撑 */
    }
    if(total) wbImgStatPut({lastUp:new Date().toISOString()});
    if(total && !quiet){ try{ wbToast('图片已补传 '+total+' 张（原图未压缩）'); }catch(e){} }
  }catch(e){ console.warn('图片补传中断', e); }
  finally{ wbImgBusy=false; }
  return total;
}
/* 补齐：云端有、本机没有的图（换设备/清缓存后自动还原） */
async function wbImgSyncDown(quiet){
  if(!WB_IMG_CH || wbImgBusy || !wbGhToken()) return 0;
  wbImgBusy=true; let done=0;
  try{
    const idx=await wbImgIndexGet();
    const have=new Set(await wbImgLocalIds());
    const todo=Object.keys(idx.ids).filter(id=>!have.has(id)).slice(0, WB_IMG_RUN*2);
    for(const id of todo){ try{ if(await wbImgPullOne(id)) done++; }catch(e){ break; } }
    if(done){ wbBroadcastReload(); if(!quiet){ try{ wbToast('已补齐图片 '+done+' 张'); }catch(e){} } }
    wbImgStatPut({cloud:Object.keys(idx.ids).length});
  }catch(e){ console.warn('图片补齐中断', e); }
  finally{ wbImgBusy=false; }
  return done;
}

async function wbPush(silent){
  if(!wbSync||wbBusy) return; wbBusy=true;
  try{
    /* 未连接/未完成验证时先真实验证一次，而不是空转返回（旧版点「立即同步」毫无反应的根因之一） */
    if(!wbSync.connected || !wbVerified){ try{ await wbConnect(); }catch(e){} }
    if(!wbSync.connected){ setLastTry(false,'未连接：两个通道都连不上，稍后自动重试'); if(!silent) wbToast('未连接：两个通道都连不上，稍后自动重试'); return; }
  }finally{ wbBusy=false; }
  wbBusy=true;
  let sbCloud=null, ghCloud=null, sbErr=null, ghErr=null;
  try{
    /* 先并行取两通道现有内容，用于合并（任一有即可，绝不整库覆盖）。
       按能力尝试而非按验证标志：库已加载就试 Supabase，配了令牌就试 GitHub，各自失败互不影响 */
    const reads=[];
    if(window.supabase) reads.push((async()=>{ try{ const c=wbSbInit(); if(!c) return; const { data }=await c.from('workbench_sync').select('payload').eq('id','me').maybeSingle(); if(data&&data.payload&&data.payload.data) sbCloud=data.payload.data; }catch(e){ sbErr=e; } })());
    if(wbGhToken()) reads.push((async()=>{ try{ const f=await wbGhGetFile(); if(f.exists&&f.obj&&f.obj.data) ghCloud=f.obj.data; }catch(e){ ghErr=e; } })());
    if(reads.length) await Promise.allSettled(reads);
    const cloudObj=sbCloud||ghCloud;

    const sig=wbSig(merged);
    if(sig===wbLastPushSig){ wbBusy=false; if(!silent) wbToast('内容没有变化，云端已是最新'); return; }
    /* 双通道并行写入 */
    const writes=[];
    if(window.supabase) writes.push((async()=>{ try{ const c=wbSbInit(); if(!c) throw new Error('Supabase 未初始化'); const now=new Date().toISOString(); const row={ id:'me', payload:{ updatedAt:now, data:merged }, updated_at:now }; const { error }=await c.from('workbench_sync').upsert(row, { onConflict:'id' }); if(error) throw error; }catch(e){ sbErr=e; throw e; } })());
    if(wbGhToken()) writes.push((async()=>{ try{ await wbPushGithubWith(merged); }catch(e){ ghErr=e; throw e; } })());
    if(!writes.length){ wbBusy=false; if(!silent) wbToast('没有可用通道：未配置 GitHub 令牌且 Supabase 库未加载'); wbMarkDisconnected(); return; }
    const res=await Promise.allSettled(writes);

    if(anyOk){
      wbLastPushSig=sig;
      wbSaveShadow(merged);
      try{ localStorage.setItem(WB_K_LAST_SYNC, new Date().toISOString()); }catch(e){}
      clearLastSyncErr(); setLastTry(true);
      const onlyGh = !sbErr && ghErr && wbSbOk===false;  /* 仅用于提示，不影响成功 */
      wbUpdateSyncUI(); if(!silent) wbToast('已同步 ✓ '+fmtHM(new Date()));
      wbImgKick();   /* 主数据已上去，图片走单独小文件通道后台补传（原图不压缩） */
    }else{
      const m='同步失败：'+((sbErr&&sbErr.message)||(ghErr&&ghErr.message)||'未知错误');
      setLastSyncErr(m); setLastTry(false,m); wbUpdateSyncUI(); wbToast(m); wbMarkDisconnected();
    }
  }catch(e){ console.error(e); const m='同步失败：'+(e&&e.message?e.message:e); setLastSyncErr(m); setLastTry(false,m); wbUpdateSyncUI(); wbToast(m); wbMarkDisconnected(); }
  finally{ wbBusy=false; }

  try{ const m=document.getElementById('wbSyncModal'); if(m && m.style.display!=='none') wbOpenSync(); }catch(e){}

/* ===== 防陈旧云端反向覆盖（2026-09-15 加） =====
   事故复盘：本机「已见云端版本」标记(WB_K_CLOUD_VER)一旦丢失（清缓存/新会话/首次连接）
   会退化成 1970，于是判定云端有更新 → 用云端很旧的快照覆盖本机刚写入的新数据，
   表现为「明明保存了，刷新后全没了」。
   保险：逐键比较数据内的时间戳（created/updated/ts），
   若云端版本明显比本机旧，则保留本机，不采用云端旧值，并反过来把本机推上云端。 */
function wbMaxTs(v){
  try{
    const a=JSON.parse(v); let m=0;
    const walk=(x)=>{
      if(Array.isArray(x)){ x.forEach(walk); return; }
      if(x&&typeof x==='object'){
        const t=x.created||x.updated||x.ts||x._ts;
        if(typeof t==='number'&&t>m) m=t;
        else if(typeof t==='string'){ const p=Date.parse(t); if(!isNaN(p)&&p>m) m=p; }
        for(const k in x){ if(Object.prototype.hasOwnProperty.call(x,k)) walk(x[k]); }
      }
    };
    walk(a); return m;
  }catch(e){ return 0; }
}
function wbGuardStale(merged, cloudObj){
  const out=Object.assign({}, merged||{});
  const kept=[];
  for(const k of Object.keys(out)){
    const local=localStorage.getItem(k);
    if(!local) continue;
    const lt=wbMaxTs(local), ct=wbMaxTs((cloudObj&&cloudObj[k])||'');
    if(lt>0 && ct>0 && lt>ct+1000){ out[k]=local; kept.push(k); }
  }
  if(kept.length) console.warn('[sync] 云端版本更旧，已保留本机数据：', kept);
  return { merged:out, kept };
}
async function wbPull(force){
  if(!wbSync||!wbSync.connected||wbBusy) return; wbBusy=true;
  try{
    let sbObj=null, ghObj=null;
    const reads=[];
    if(window.supabase) reads.push((async()=>{ try{ const c=wbSbInit(); if(!c) return; const { data, error }=await c.from('workbench_sync').select('*').eq('id','me').maybeSingle(); if(!error&&data&&data.payload) sbObj=data.payload; }catch(e){} })());
    if(wbGhToken()) reads.push((async()=>{ try{ ghObj=await wbPullGithub(); }catch(e){} })());
    if(reads.length) await Promise.allSettled(reads);
    /* 两个通道都可能有更新，取 updatedAt 较新的一份落地（双写保证通常一致） */
    const sbAt=(sbObj&&sbObj.updatedAt)||'1970-01-01T00:00:00.000Z';
    const ghAt=(ghObj&&ghObj.updatedAt)||'1970-01-01T00:00:00.000Z';
    const chosen=(ghAt>sbAt)?ghObj:sbObj;
    if(!chosen||!chosen.data) return;
    const seenVer=localStorage.getItem(WB_K_CLOUD_VER)||'1970-01-01T00:00:00.000Z';
    const cloudAt=chosen.updatedAt||'1970-01-01T00:00:00.000Z';
    if(force || cloudAt>seenVer){
      let merged=await wbMergeAll(chosen.data,'pull');   /* 落地走合并，pull 时云端优先 */
      let kept=[];
      if(!force){
        const g=wbGuardStale(merged, chosen.data);
        merged=g.merged; kept=g.kept;
      }
      await wbApply(merged);
      wbSaveShadow(merged);
      try{ localStorage.setItem(WB_K_CLOUD_VER, cloudAt); }catch(e){}
      if(kept.length){
        try{ wbToast('云端数据比你本机旧，已保留本机记录'); }catch(e){}
        wbSchedulePush(true);                        /* 顺手把本机新数据回传，让两通道对齐 */
      }
    }
  }catch(e){ console.error(e); }
  finally{ wbBusy=false; }
}
function wbStartPoll(){
  if(wbPollTimer) clearInterval(wbPollTimer);
  wbPollTimer=setInterval(async()=>{
    if(!wbSync||!wbSync.connected||wbBusy) return;
    try{
      let cloudAt='1970-01-01T00:00:00.000Z';
      if(window.supabase){
        const client=wbSbInit(); if(!client) return;
        const { data, error }=await client.from('workbench_sync').select('updated_at').eq('id','me').maybeSingle();
        if(!error && data) cloudAt=(data.updated_at)||cloudAt;
      }
      if(wbGhToken()){
        const f=await wbGhGetFile().catch(()=>null);
        if(f&&f.exists&&f.obj&&(f.obj.updatedAt||'')>cloudAt) cloudAt=f.obj.updatedAt;
      }
      const seenVer=localStorage.getItem(WB_K_CLOUD_VER)||'1970-01-01T00:00:00.000Z';
      if(cloudAt>seenVer) wbPull();
    }catch(e){}
  },15000);
}
async function wbConnect(){

  const sbTask=(async()=>{ try{ const c=wbSbInit(); if(!c){ wbSbErr='Supabase 库未加载'; return false; } const { error }=await c.from('workbench_sync').select('updated_at').eq('id','me').maybeSingle(); if(error) throw error; return true; }catch(e){ wbSbErr=(e&&e.message)||'Supabase 不可达'; return false; } })();
  const ghTask=(async()=>{ try{ if(!wbGhToken()) return false; await wbGhGetFile(); return true; }catch(e){ wbGhErr=(e&&e.message)||'GitHub 不可达'; return false; } })();
  const [sbOk, ghOk]=await Promise.all([sbTask, ghTask]);
  wbSbOk=sbOk; wbGhOk=ghOk; wbVerified=true;

    const m='连接失败：Supabase 不可达'+(wbGhToken()?('，'+why):'（开代理可连 Supabase，或在面板配置 GitHub 令牌）');
    setLastSyncErr(m);
    const dot=document.getElementById('wbSyncDot'); if(dot) dot.style.background='#d9534f';
    wbToast(m); wbUpdateSyncUI();
    /* 30 秒后自动重试：网络恢复 / 开了代理 / 配上令牌后能自行转绿 */
    setTimeout(function(){ if(!wbSync.connected && !wbSync.userDisconnected) wbSilentReconnect(); }, 30000);
  }

  wbLoadCfg();
  const dot=document.getElementById('wbSyncDot');
  if(wbSync.userDisconnected){ if(dot) dot.style.background='#c9bfae'; wbReady=true; return; }
  if(!window.supabase){   /* 库还在异步加载（仅本地缺失、走了 CDN 兜底时），稍后重试 */
    if(dot) dot.style.background='#c9bfae'; wbReady=true;
    setTimeout(function(){ wbSilentReconnect(); }, 4000);
    return;
  }
  /* 无论持久化 connected 为何值，都重新真实验证（刷新后不再假绿），绿点=真实连通 */
  try{ await wbConnect(); }catch(e){ if(dot) dot.style.background='#c9bfae'; }
  if(wbSync.connected){
    wbReady=true;                                   /* 连接已确证，放开推送闸门 */
    if(wbPendingPush){ wbPendingPush=false; wbSchedulePush(); }
    wbStartPoll();
    wbUpdateSyncUI();
  }
}

/* ================= 同步兜底层（2026-09-09 根因修复） =================
   以前只有 iframe 子页主动 postMessage 通知，父页才会推送。像「日期记录」这类
   没埋桥的页面写完数据，父页完全不知情，另一台设备永远拉不到——这正是本次
   「手机写了内观觉察、电脑看不到」的直接原因。
   这里补三道兜底，任何页面、任何写入方式都不会漏：
     ① storage 事件：同源 iframe 写入 localStorage 时父页会收到
     ② 每 6 秒扫描本地数据指纹，变了就推（storage 事件不触发的场景也能兜住）
     ③ 切到后台 / 关页面 / 回到前台：立刻同步一次 */
let wbFpPrev='';
function wbFingerprint(){
  try{
    let n=0,s=0;
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i); if(!k) continue;
      if(WB_SKIP.indexOf(k)>=0 || wbIsPrivate(k)) continue;
      if(k===WB_K_SHADOW||k===WB_K_LAST_SYNC||k===WB_K_CLOUD_VER||k==='wb_cloud_ver') continue;
      s+=(localStorage.getItem(k)||'').length; n++;
    }
    return n+':'+s;
  }catch(e){ return ''; }
}
function wbAutoTick(){
  if(!wbSync||!wbSync.connected) return;
  const fp=wbFingerprint(); if(!fp) return;
  if(fp!==wbFpPrev){ if(wbFpPrev!=='') wbSchedulePush(); wbFpPrev=fp; }
}
window.addEventListener('storage', function(e){
  if(!e || !e.key) return;
  wbFpPrev=wbFingerprint();
  if(wbSync&&wbSync.connected) wbSchedulePush();
});
setInterval(wbAutoTick, 6000);
document.addEventListener('visibilitychange', function(){
  if(!wbSync||!wbSync.connected) return;
  if(document.visibilityState==='visible'){
    wbFpPrev=wbFingerprint();
    try{ wbPull(true); }catch(e){}
    wbSchedulePush(true);
  }else{
    try{ wbPush(true); }catch(e){}
  }
});
window.addEventListener('pagehide', function(){
  if(wbSync&&wbSync.connected){ try{ wbPush(true); }catch(e){} }
});
window.addEventListener('beforeunload', function(){
  if(wbSync&&wbSync.connected){ try{ wbPush(true); }catch(e){} }
});

wbSilentReconnect();
wbUpdateSyncUI();


</script>

  n.classList.add('show');
  setTimeout(function(){ n.classList.remove('show'); }, 2200);

function openGlobalAi(){
  var g = function(id){ return document.getElementById(id); };
  var ls = function(k,d){ try{ return localStorage.getItem(k) || d; }catch(e){ return d; } };
  g('waiBase').value   = ls('ywApiBase','') || 'https://api.deepseek.com';
  g('waiModel').value  = ls('ywApiModel','') || 'deepseek-flash';
  g('waiKey').value    = ls('ywApiKey','');
  g('waiVlBase').value = ls('ywVlBase','')  || 'https://api.deepseek.com';
  g('waiVlModel').value= ls('ywVlModel','') || 'deepseek-flash';
  g('waiVlKey').value  = ls('ywVlKey','');
  g('wbAiMask').classList.add('show');
}
function closeGlobalAi(){ document.getElementById('wbAiMask').classList.remove('show'); }
function saveGlobalAi(){
  var g = function(id){ return document.getElementById(id); };
  var b  = g('waiBase').value.trim()    || 'https://api.deepseek.com';
  var m  = g('waiModel').value.trim()   || 'deepseek-flash';
  var k  = g('waiKey').value.trim();
  var vb = g('waiVlBase').value.trim()  || 'https://api.deepseek.com';
  var vm = g('waiVlModel').value.trim() || 'deepseek-flash';
  var vk = g('waiVlKey').value.trim() || k;
  try{
    localStorage.setItem('ywApiBase', b);
    localStorage.setItem('ywApiModel', m);
    localStorage.setItem('ywApiKey', k);
    localStorage.setItem('ywVlBase', vb);
    localStorage.setItem('ywVlModel', vm);
    localStorage.setItem('ywVlKey', vk);
    if(g('waiForce').checked){
      var del = [];
      for(var i=0;i<localStorage.length;i++){
        var kk = localStorage.key(i);
        if(kk && kk.indexOf('ai_cfg') >= 0) del.push(kk);
      }
      del.forEach(function(kk){ try{ localStorage.removeItem(kk); }catch(e){} });
      try{ localStorage.removeItem('ms_cfg'); }catch(e){}
    }
  }catch(e){}
  closeGlobalAi();
  Array.prototype.forEach.call(document.querySelectorAll('iframe'), function(f){

      else if(f.getAttribute('src')){ f.src = f.getAttribute('src'); }
    }catch(e){}
  });
  wnudge('AI 设置已保存到全部页面');
}
