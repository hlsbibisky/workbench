<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>周计划 · 工作台</title>
<style>
  :root{ --bg:#f7f4ee; --accent:#b8714e; --line:#e7ddcd; --mark:#f0e9dd; --sub:#8a7d6b; --noted:#c0392b; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:#2c241b; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid var(--line); background:#fbf8f2; gap:8px; flex-wrap:wrap; }
  .brand{ font-weight:700; font-size:16px; }
  .brand small{ font-weight:400; color:var(--sub); font-size:11px; margin-left:6px; }
  .topacts{ display:flex; gap:6px; flex:none; }
  .topbtn{ border:1px solid var(--line); background:#fff; border-radius:8px; height:32px; padding:0 10px; cursor:pointer; color:var(--accent); font-size:13px; display:flex; align-items:center; gap:4px; }
  .topbtn:hover{ border-color:var(--accent); }
  .topbtn .ic{ font-size:14px; }
  .content{ padding:14px 16px 40px; max-width:920px; margin:0 auto; }
  /* 周日期条 */
  .weekbar{ display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .wk-nav{ border:1px solid var(--line); background:#fff; border-radius:8px; width:34px; height:34px; cursor:pointer; color:var(--accent); font-size:16px; flex:none; }
  .wk-label{ font-size:13px; color:var(--sub); margin-right:4px; }
  .days{ display:flex; gap:6px; flex:1; min-width:0; }
  .day{ flex:1; min-width:54px; text-align:center; padding:8px 4px; border:1px solid var(--line); border-radius:10px; background:#fff; cursor:pointer; transition:.15s; }
  .day .wd{ font-size:12px; color:var(--sub); }
  .day .dt{ font-size:13px; font-weight:600; margin-top:2px; }
  .day.today{ border-color:var(--accent); background:#fdf2ea; }
  .day.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .day.active .wd{ color:#ffe9dd; }
  .day.all{ min-width:48px; display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--sub); }
  .day.all.active{ color:#fff; }
  /* 分类卡片 */
  .cat{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:14px; }
  .cat-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .cat-name{ font-size:15px; font-weight:700; flex:1; outline:none; }
  .cat-name[contenteditable="true"]{ background:#fff8ef; border-bottom:1px dashed var(--accent); }
  .mini{ border:none; background:var(--mark); color:var(--accent); border-radius:7px; padding:4px 8px; cursor:pointer; font-size:12px; }
  .mini.del{ background:#f6e3dd; color:#c0392b; }
  .mini.ok{ background:var(--accent); color:#fff; }
  .add-cat{ display:inline-block; margin:4px 0 18px; border:1px dashed var(--accent); color:var(--accent); background:transparent; border-radius:10px; padding:8px 14px; cursor:pointer; font-size:13px; }
  .add-task{ display:inline-block; margin:6px 0 2px; border:none; background:var(--mark); color:var(--accent); border-radius:8px; padding:5px 10px; cursor:pointer; font-size:12px; }
  .task{ display:flex; align-items:center; gap:8px; padding:7px 4px; border-bottom:1px dashed #efe7d8; }
  .task:last-child{ border-bottom:none; }
  .ck{ width:18px; height:18px; border:2px solid var(--accent); border-radius:5px; cursor:pointer; flex:none; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; }
  .ck.done{ background:var(--accent); }
  .ttext{ flex:1; outline:none; font-size:14px; }
  .ttext.done{ color:var(--sub); }
  .ttext[contenteditable="true"]{ background:#fff8ef; }
  .tcount-wrap{ flex:none; display:flex; align-items:center; gap:3px; }
  .tcount-btn{ font-size:11px; color:var(--accent); background:#fdf2ea; border:1px solid #f0d8c0; border-radius:9px; padding:2px 8px; cursor:pointer; user-select:none; white-space:nowrap; }
  .tcount-btn:hover{ background:#fae7d7; }
  .tcount-arrow{ width:18px; height:18px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--sub); font-size:10px; cursor:pointer; }
  .tcount-arrow:hover{ border-color:var(--accent); color:var(--accent); }
  .add-task-row{ display:inline-block; margin:8px 0 0; border:none; background:transparent; color:var(--accent); font-size:12px; cursor:pointer; padding:2px 0; }
  .add-task-row:hover{ text-decoration:underline; }
  .empty{ color:var(--sub); font-size:13px; padding:6px 2px; }
  .hint{ color:var(--sub); font-size:12px; margin:10px 2px 0; line-height:1.6; }

  /* 弹层/抽屉 */
  .overlay{ position:fixed; inset:0; background:rgba(40,30,20,.42); display:none; z-index:50; }
  .overlay.show{ display:block; }
  .drawer{ position:absolute; left:0; right:0; bottom:0; max-height:88vh; background:var(--bg); border-radius:18px 18px 0 0; display:flex; flex-direction:column; animation:slideUp .22s ease; }
  @keyframes slideUp{ from{ transform:translateY(40px); opacity:.4; } to{ transform:translateY(0); opacity:1; } }
  .drawer-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); font-weight:700; font-size:15px; }
  .drawer-body{ padding:10px 16px; overflow:auto; flex:1; }
  .drawer-foot{ display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .drawer-foot .mini{ flex:1; text-align:center; padding:9px 0; font-size:13px; min-width:120px; }
  /* 历史 */
  .hwk{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:10px; }
  .hwk.cur{ border-color:var(--accent); background:#fdf2ea; }
  .hwk-h{ display:flex; align-items:center; justify-content:space-between; font-size:13px; }
  .hwk-range{ font-weight:700; }
  .hwk-tag{ font-size:11px; color:var(--sub); }
  .hwk-cats{ font-size:12px; color:var(--sub); margin-top:4px; }
  .hwk-dcat{ font-size:12px; font-weight:700; margin:8px 0 2px; }
  .hwk-dtask{ font-size:12px; color:#4a4036; padding:2px 0 2px 10px; }
  .hwk-dtask .c{ color:var(--accent); }
  /* toast */
  .toast{ position:fixed; left:50%; top:64px; transform:translateX(-50%) translateY(-12px); background:#3a2c1f; color:#fff; padding:11px 14px; border-radius:12px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.22); z-index:70; display:flex; align-items:center; gap:12px; opacity:0; pointer-events:none; transition:.25s; max-width:92vw; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  .toast .tbtn{ border:1px solid rgba(255,255,255,.4); background:transparent; color:#fff; border-radius:8px; padding:5px 9px; font-size:12px; cursor:pointer; white-space:nowrap; }
  .toast .tbtn.acc{ background:var(--accent); border-color:var(--accent); }
  @media (max-width:640px){ .day{ min-width:46px; } .cat-name{ font-size:14px; } .tcount-btn{ font-size:10px; padding:2px 6px; } .tcount-arrow{ width:16px; height:16px; } .topbtn{ padding:0 8px; font-size:12px; } }
</style>
</head>
<body>
<script>
/* 工作台级云同步桥接 */
(function(){
  try{ var orig=localStorage.setItem;
    localStorage.setItem=function(k,v){ var r=orig.apply(this,arguments); try{ if(window.parent!==window) window.parent.postMessage({type:'wb-data-changed'},'*'); }catch(e){} return r; };
  }catch(e){}
  function _editing(){
    var a=document.activeElement;
    if(a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'||a.isContentEditable)) return true;
    return false;
  }
  window.addEventListener('message',function(e){
    if(!e.data) return;
    if(e.data.type==='wb-reload'){ if(_editing()) return; try{ location.reload(); }catch(err){} }
    else if(e.data.type==='wb-request-save'){ try{ if(window.__savePage) window.__savePage(); }catch(err){} }
  });
  window.__savePage=function(){ if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); try{ window.parent.postMessage({type:'wb-saved',msg:'已保存（自动保存）'},'*'); }catch(e){} };
})();
</script>
  <div class="topbar">
    <div class="brand">周计划 <small>工作台</small></div>
    <div class="topacts">
      <button class="topbtn" onclick="startNewWeek()"><span class="ic">🔄</span>新一周</button>
      <button class="topbtn" onclick="openHistory()"><span class="ic">📚</span>历史</button>
    </div>
  </div>

  <div class="content">
    <div class="weekbar">
      <button class="wk-nav" onclick="shiftWeek(-1)">‹</button>
      <span class="wk-label" id="wkRange"></span>
      <div class="days" id="days"></div>
      <button class="wk-nav" onclick="shiftWeek(1)">›</button>
    </div>

    <div id="cats"></div>

    <button class="add-cat" onclick="addCat()">＋ 新增分类</button>
    <div class="hint">每周一打开会自动开启新一周：本周任务会保留下来，只是完成进度清空；上一周会变成一条历史摘要，点「📚 历史」查看。</div>
  </div>

  <!-- 历史抽屉 -->
  <div class="overlay" id="histOverlay" onclick="if(event.target===this)closeHistory()">
    <div class="drawer">
      <div class="drawer-head">历史周任务
        <button class="mini del" onclick="closeHistory()">✕</button>
      </div>
      <div class="drawer-body" id="histBody"></div>
    </div>
  </div>

  <!-- toast -->
  <div class="toast" id="toast">
    <span id="toastMsg"></span>
    <button class="tbtn acc" onclick="openHistory()">📚 看上周</button>
    <button class="tbtn" onclick="hideToast()">知道了</button>
  </div>

<script>
const K='weekly_plan';
const WD=['周一','周二','周三','周四','周五','周六','周日'];
let state=null;
let viewDay=-1;          // -1=全部
let monday=new Date();

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function pad(n){ return n<10?('0'+n):(''+n); }
/* 返回自然周周一（周一 00:00:00） */
function getMonday(d){
  const date=new Date(d);
  const day=date.getDay(); // 0=周日,1=周一...
  const diff=(day===0)?-6:(1-day); // 回到本周一
  date.setDate(date.getDate()+diff);
  date.setHours(0,0,0,0);
  return date;
}
function setMonday(d){ monday=getMonday(d); }
function weekKeyOf(d){ const m=getMonday(d); return m.getFullYear()+'-'+pad(m.getMonth()+1)+'-'+pad(m.getDate()); }
function getSundayKey(key){ const d=new Date(key); d.setDate(d.getDate()+6); return fmtDate(d); }
function dayDate(i){ const d=new Date(monday); d.setDate(monday.getDate()+i); return d; }
function fmtMD(d){ return (d.getMonth()+1)+'/'+d.getDate(); }
function fmtDate(d){ return pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function isToday(i){ const d=dayDate(i),t=new Date(); return d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth()&&d.getDate()===t.getDate(); }

/* 修复旧数据：把当前 weekKey 与历史记录都归一到自然周（周一~周日），并合并同一周的多设备归档 */
function normalizeHistory(){
  if(!state) return;
  // 当前周归到周一
  state.weekKey = weekKeyOf(state.weekKey || new Date());
  // 历史归一 + 合并同周
  const map={};
  (state.history||[]).forEach(h=>{
    const startKey = weekKeyOf(h.weekStart || h.weekKey || new Date());
    const endDate = new Date(startKey); endDate.setDate(endDate.getDate()+6);
    const endKey = fmtDate(endDate);
    if(!map[startKey]){
      map[startKey] = { weekKey:startKey, weekStart:startKey, weekEnd:endKey, summary:{}, totals:{total:0,done:0}, createdAt:h.createdAt||Date.now() };
    }
    (h.summary||[]).forEach(s=>{
      const name=s.catName||'未分类';
      if(!map[startKey].summary[name]) map[startKey].summary[name]={catName:name,items:[],total:0,done:0};
      const target=map[startKey].summary[name];
      (s.items||[]).forEach(it=>{
        // 按任务文本去重（不区分完成态），保留完成状态更高的、计数更大的
        const exist=target.items.find(x=>x.text===it.text);
        if(exist){
          if(it.done) exist.done=true;
          exist.count = Math.max(exist.count||0, it.count||0);
        } else {
          target.items.push({text:it.text,count:it.count||0,done:!!it.done});
        }
      });
      // 完全重新计算 total/done，避免旧数据里重复计数或跨设备污染
      target.total = target.items.length;
      target.done = target.items.filter(x=>x.done).length;
    });
  });
  state.history = Object.values(map).sort((a,b)=> new Date(b.weekStart)-new Date(a.weekStart));
  state.history.forEach(h=>{
    h.summary = Object.values(h.summary);
    h.totals = {total:0, done:0};
    h.summary.forEach(s=>{
      s.total = s.items.length;
      h.totals.total += s.total;
      h.totals.done += s.done;
    });
  });
}
function load(){
  let raw=null;
  try{ raw=JSON.parse(localStorage.getItem(K)); }catch(e){ raw=null; }
  if(!raw || typeof raw!=='object'){
    state={ weekKey:weekKeyOf(new Date()), cats:[], tasks:[], history:[] };
    return;
  }
  state={
    weekKey: raw.weekKey || weekKeyOf(new Date()),
    cats: Array.isArray(raw.cats)? raw.cats : [],
    tasks: Array.isArray(raw.tasks)? raw.tasks : [],
    history: Array.isArray(raw.history)? raw.history : []
  };
  normalizeHistory();
  save();
}
function save(){ localStorage.setItem(K, JSON.stringify(state)); }

/* 开启新一周：保留任务、清空进度、归档上周 */
function archiveCurrent(){
  const start=new Date(state.weekKey);
  const end=new Date(start); end.setDate(start.getDate()+6);
  const catMap={}; state.cats.forEach(c=>catMap[c.id]=c.name);
  const byCat={};
  state.tasks.forEach(t=>{
    const cn=catMap[t.catId] || '未分类';
    if(!byCat[cn]) byCat[cn]={catName:cn, items:[], total:0, done:0};
    byCat[cn].total++; if(t.done) byCat[cn].done++;
    byCat[cn].items.push({text:t.text, count:t.count||0, done:!!t.done});
  });
  const summary=Object.keys(byCat).map(cn=>byCat[cn]);
  const totals={ total:state.tasks.length, done: state.tasks.filter(t=>t.done).length };
  state.history.unshift({
    weekKey: state.weekKey,
    weekStart: state.weekKey,
    weekEnd: fmtDate(end),
    summary, totals
  });
  return totals;
}
function rollWeek(force){
  const thisWk=weekKeyOf(new Date());
  if(!force && state.weekKey===thisWk) return null;
  let archived=null;
  if(state.tasks.length>0) archived=archiveCurrent();
  state.tasks.forEach(t=>{ t.done=false; t.count=0; });
  state.weekKey=thisWk;
  save();
  return archived;
}
/* 打开自动检测 */
function maybeRollWeek(){
  const r=rollWeek(false);
  if(r){ showToast('新的一周开始了：上周已完成 '+r.done+'/'+r.total+' 项，已保留任务并清空进度'); }
}

/* ---------- 渲染 ---------- */
function shiftWeek(n){ monday.setDate(monday.getDate()+7*n); renderWeek(); }
function pickDay(i){ viewDay=i; renderWeek(); renderCats(); }

function renderWeek(){
  const el=document.getElementById('days'); el.innerHTML='';
  const all=document.createElement('div'); all.className='day all'+(viewDay===-1?' active':'');
  all.textContent='全部'; all.onclick=()=>pickDay(-1); el.appendChild(all);
  for(let i=0;i<7;i++){
    const d=document.createElement('div');
    d.className='day'+(isToday(i)?' today':'')+(viewDay===i?' active':'');
    d.innerHTML='<div class="wd">'+WD[i]+'</div><div class="dt">'+fmtMD(dayDate(i))+'</div>';
    d.onclick=()=>pickDay(i); el.appendChild(d);
  }
  const a=dayDate(0), b=dayDate(6);
  document.getElementById('wkRange').textContent= a.getFullYear()+'年 '+(a.getMonth()+1)+'/'+a.getDate()+' – '+(b.getMonth()+1)+'/'+b.getDate();
}

function renderCats(){
  const box=document.getElementById('cats'); box.innerHTML='';
  if(state.cats.length===0){
    box.innerHTML='<div class="empty">还没有分类，点下方「＋ 新增分类」开始规划本周。</div>';
    return;
  }
  state.cats.forEach(c=>{
    const list=state.tasks.filter(t=> t.catId===c.id);
    const card=document.createElement('div'); card.className='cat';
    const head=document.createElement('div'); head.className='cat-head';
    const name=document.createElement('div'); name.className='cat-name'; name.textContent=c.name; name.title='点击重命名';
    name.onclick=()=>startEdit(name, v=>{ c.name=v; save(); renderCats(); });
    const delC=document.createElement('button'); delC.className='mini del'; delC.textContent='🗑'; delC.title='删除分类（含其下计划）'; delC.onclick=()=>delCat(c.id);
    head.appendChild(name); head.appendChild(delC);
    card.appendChild(head);

    if(list.length===0){
      const e=document.createElement('div'); e.className='empty'; e.textContent= viewDay===-1?'本周暂无计划':'该日无计划'; card.appendChild(e);
    }
    list.forEach(t=> card.appendChild(taskRow(t)));

    const addT=document.createElement('button'); addT.className='add-task-row'; addT.textContent='＋ 在此分类下新增计划'; addT.onclick=()=>addTask(c.id);
    card.appendChild(addT);
    box.appendChild(card);
  });
}

function taskRow(t){
  const row=document.createElement('div'); row.className='task';

  const wrap=document.createElement('div'); wrap.className='tcount-wrap';
  const cntBtn=document.createElement('span'); cntBtn.className='tcount-btn';
  cntBtn.textContent='完成 '+(t.count||0)+' 次'; cntBtn.title='点击 +1';
  cntBtn.onclick=()=>{ t.count=(t.count||0)+1; if(!t.done) t.done=true; save(); renderCats(); };
  const down=document.createElement('span'); down.className='tcount-arrow'; down.textContent='▼'; down.title='-1';
  down.onclick=()=>{ if((t.count||0)>0){ t.count=(t.count||0)-1; save(); renderCats(); } };
  wrap.appendChild(cntBtn); wrap.appendChild(down);

  const ck=document.createElement('div'); ck.className='ck'+(t.done?' done':'');
  ck.textContent=t.done?'✓':''; ck.title='点击标记完成/取消';
  ck.onclick=()=>{ t.done=!t.done; save(); renderCats(); };
  const tx=document.createElement('div'); tx.className='ttext'+(t.done?' done':'');
  tx.textContent=t.text;
  tx.onclick=()=>startEdit(tx, v=>{ t.text=v; save(); renderCats(); });
  const del=document.createElement('button'); del.className='mini del'; del.textContent='🗑'; del.title='删除这条计划';
  del.onclick=()=>delTask(t.id);
  row.appendChild(ck); row.appendChild(tx); row.appendChild(wrap); row.appendChild(del);
  return row;
}

function startEdit(el, onSave){
  el.setAttribute('contenteditable','true'); el.focus();
  const r=document.createRange(); r.selectNodeContents(el);
  const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
  const finish=()=>{ el.removeAttribute('contenteditable'); const v=el.textContent.trim(); if(v) onSave(v); else renderCats(); el.removeEventListener('blur',finish); el.removeEventListener('keydown',key); };
  const key=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } if(e.key==='Escape'){ el.blur(); } };
  el.addEventListener('blur',finish); el.addEventListener('keydown',key);
}

function addCat(){
  const name=prompt('新分类名称：','新分类'); if(!name) return;
  state.cats.push({id:uid(), name:name.trim()}); save(); renderCats();
}
function delCat(id){
  if(!confirm('删除该分类及其下全部计划？')) return;
  state.cats=state.cats.filter(c=>c.id!==id);
  state.tasks=state.tasks.filter(t=>t.catId!==id);
  save(); renderCats();
}
function addTask(catId){
  const text=prompt('新计划内容：',''); if(!text) return;
  state.tasks.push({id:uid(), catId, text:text.trim(), done:false, count:0});
  save(); renderCats();
}
function delTask(id){
  if(!confirm('删除这条计划？')) return;
  state.tasks=state.tasks.filter(t=>t.id!==id); save(); renderCats();
}

function startNewWeek(){
  const thisWk=weekKeyOf(new Date());
  if(state.weekKey===thisWk && state.tasks.length===0){ showToast('本周还是空的，先添加计划吧'); return; }
  if(!confirm('把本周归档到历史，并开启新的一周？\n（任务会保留，仅清空完成进度）')) return;
  const r=rollWeek(true);
  renderAll();
  if(r) showToast('已归档上周（完成 '+r.done+'/'+r.total+' 项），本周进度已清空');
}

/* ---------- 历史抽屉 ---------- */
function openHistory(){
  normalizeHistory(); // 每次打开前重新归并，防止同步后同一周出现多条
  save();
  const body=document.getElementById('histBody'); body.innerHTML='';
  if(!state.history.length){
    body.innerHTML='<div class="empty">还没有历史周。下次新的一周开始时，会自动在这里留下一条上周的完成摘要。</div>';
  }
  const all=[{_cur:true, weekKey:state.weekKey, tasks:state.tasks}, ...state.history];
  all.forEach(w=>{
    const card=document.createElement('div'); card.className='hwk'+(w._cur?' cur':'');
    const head=document.createElement('div'); head.className='hwk-h';
    const range=document.createElement('div'); range.className='hwk-range';
    const end= ' ~ '+(w._cur? getSundayKey(w.weekKey) : w.weekEnd);
    range.textContent=w.weekKey.slice(5)+end + (w._cur?'（本周·进行中）':'');
    head.appendChild(range);
    if(!w._cur){
      const tag=document.createElement('div'); tag.className='hwk-tag';
      tag.textContent='完成 '+w.totals.done+'/'+w.totals.total;
      head.appendChild(tag);
    } else {
      const tag=document.createElement('div'); tag.className='hwk-tag';
      tag.textContent='进行中 '+state.tasks.filter(t=>t.done).length+'/'+state.tasks.length;
      head.appendChild(tag);
    }
    card.appendChild(head);
    if(!w._cur){
      const cats=document.createElement('div'); cats.className='hwk-cats';
      cats.textContent=w.summary.map(s=>s.catName+' '+s.done+'/'+s.total).join(' · ');
      card.appendChild(cats);
      w.summary.forEach(s=>{
        const dh=document.createElement('div'); dh.className='hwk-dcat'; dh.textContent=s.catName+'（'+s.done+'/'+s.total+'）';
        card.appendChild(dh);
        s.items.forEach(tt=>{
          const dt=document.createElement('div'); dt.className='hwk-dtask';
          dt.innerHTML='· '+tt.text+' 完成 '+(tt.count||0)+' 次'+(tt.done?' <span class="c">✓</span>':'');
          card.appendChild(dt);
        });
      });
    } else if(w.tasks.length){
      const cats=document.createElement('div'); cats.className='hwk-cats';
      cats.textContent='本周任务 '+w.tasks.length+' 条，照常勾选即可';
      card.appendChild(cats);
    }
    body.appendChild(card);
  });
  document.getElementById('histOverlay').classList.add('show');
}
function closeHistory(){ document.getElementById('histOverlay').classList.remove('show'); }

/* ---------- toast ---------- */
let toastTimer=null;
function showToast(msg){
  document.getElementById('toastMsg').textContent=msg;
  const t=document.getElementById('toast'); t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(hideToast, 9000);
}
function hideToast(){ document.getElementById('toast').classList.remove('show'); }

function renderAll(){ renderWeek(); renderCats(); }

load();
setMonday(new Date());
maybeRollWeek();
renderWeek();
renderCats();
</script>
